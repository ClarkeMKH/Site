      "html": "<div id=\"ev\">\n<style>\n  #ev{position:absolute;inset:0;overflow-y:auto;padding:24px 18px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #ev .wrap{width:100%;max-width:660px}\n  #ev h2{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #ev .sub{margin:0 0 18px;font-size:13.5px;color:#6E6E76}\n  #ev .top{display:flex;gap:8px;margin-bottom:12px}\n  #ev .top input{flex:1;padding:12px 14px;border:1px solid rgba(60,60,67,.16);border-radius:13px;background:#fff;font:inherit;font-size:16px}\n  #ev .top input:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #ev .filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;-webkit-overflow-scrolling:touch}\n  #ev .filters button{padding:6px 13px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:12.5px;font-weight:560;color:#6E6E76;cursor:pointer;white-space:nowrap}\n  #ev .filters button.on{background:#111114;border-color:#111114;color:#fff}\n  #ev .card{background:#fff;border-radius:14px;padding:15px 16px;margin-bottom:9px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 8px 20px -18px rgba(16,24,40,.4);cursor:pointer}\n  #ev .card .hd{display:flex;align-items:center;gap:11px}\n  #ev .card .id{flex:0 0 auto;font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;padding:4px 9px;border-radius:8px;background:rgba(120,120,128,.12);color:#111114}\n  #ev .card.info .id{background:rgba(10,132,255,.13);color:#0A6FD8}\n  #ev .card.warn .id{background:rgba(245,165,36,.18);color:#9A6100}\n  #ev .card.error .id{background:rgba(229,72,77,.15);color:#B8390E}\n  #ev .card .tt{flex:1;font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}\n  #ev .card .meta{margin-top:8px;font-size:11.5px;color:#A6A6AE;display:flex;gap:8px;flex-wrap:wrap}\n  #ev .card .meta b{font-weight:600;color:#8E8E96}\n  #ev .card .body{display:none;margin-top:11px;padding-top:11px;border-top:1px solid rgba(60,60,67,.08);font-size:14px;line-height:1.6;color:#3C3C43}\n  #ev .card.open .body{display:block}\n  #ev .card .cmds{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}\n  #ev .card .cmds button{padding:6px 11px;border:1px solid rgba(60,60,67,.14);border-radius:9px;background:#fff;font-size:12px;cursor:pointer;color:#6E6E76;font-family:ui-monospace,Menlo,monospace}\n  #ev .card .cmds button:hover{border-color:#0A84FF;color:#0A84FF}\n  #ev .empty{text-align:center;color:#A6A6AE;font-size:14px;padding:40px 20px;line-height:1.7}\n  #ev .count{font-size:12px;color:#A6A6AE;margin:0 0 10px 3px}\n</style>\n  <div class=\"wrap\">\n    <h2>Event Log Decoder</h2>\n    <p class=\"sub\">Search by Event ID, keyword or symptom. Works entirely offline.</p>\n    <div class=\"top\"><input id=\"evQ\" placeholder=\"e.g. 4625, lockout, spooler, bugcheck\" spellcheck=\"false\"></div>\n    <div class=\"filters\" id=\"evF\">\n      <button data-f=\"\" class=\"on\">All</button>\n      <button data-f=\"error\">Errors</button>\n      <button data-f=\"warn\">Warnings</button>\n      <button data-f=\"Security\">Security</button>\n      <button data-f=\"System\">System</button>\n      <button data-f=\"Application\">Application</button>\n    </div>\n    <p class=\"count\" id=\"evCount\"></p>\n    <div id=\"evList\"></div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst DB = [{\"id\": 4624, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Account successfully logged on\", \"desc\": \"A user or service authenticated successfully. Check Logon Type: 2=console, 3=network, 4=batch, 5=service, 7=unlock, 8=cleartext network, 10=RDP, 11=cached credentials.\", \"sev\": \"info\"}, {\"id\": 4625, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Account failed to log on\", \"desc\": \"Failed sign-in. The Status/Sub-Status codes give the reason: 0xC000006A=bad password, 0xC0000064=user doesn't exist, 0xC0000234=account locked out, 0xC0000072=account disabled, 0xC0000070=workstation restriction, 0xC000006F=outside logon hours, 0xC0000193=account expired, 0xC0000071=password expired.\", \"sev\": \"warn\"}, {\"id\": 4634, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Account was logged off\", \"desc\": \"Normal session teardown. Pairs with 4624 by Logon ID.\", \"sev\": \"info\"}, {\"id\": 4647, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"User initiated logoff\", \"desc\": \"The user chose to sign out, rather than the session being torn down.\", \"sev\": \"info\"}, {\"id\": 4648, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Logon attempted using explicit credentials\", \"desc\": \"Someone ran something as a different user (runas, mapped drive with alternate creds, scheduled task). Common in lateral-movement investigations.\", \"sev\": \"warn\"}, {\"id\": 4672, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Special privileges assigned to new logon\", \"desc\": \"An admin-equivalent account signed in. Expect this alongside 4624 for administrators.\", \"sev\": \"info\"}, {\"id\": 4720, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A user account was created\", \"desc\": \"New local or domain account. Verify it was expected.\", \"sev\": \"warn\"}, {\"id\": 4722, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A user account was enabled\", \"desc\": \"A disabled account was switched back on.\", \"sev\": \"warn\"}, {\"id\": 4723, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Attempt to change an account's password\", \"desc\": \"The user changed their own password.\", \"sev\": \"info\"}, {\"id\": 4724, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Attempt to reset an account's password\", \"desc\": \"An administrator reset someone else's password.\", \"sev\": \"warn\"}, {\"id\": 4725, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A user account was disabled\", \"desc\": \"Account switched off — normal for leavers, suspicious otherwise.\", \"sev\": \"info\"}, {\"id\": 4726, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A user account was deleted\", \"desc\": \"Account removed from the directory.\", \"sev\": \"warn\"}, {\"id\": 4728, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Member added to a security-enabled global group\", \"desc\": \"Group membership change — watch for Domain Admins.\", \"sev\": \"warn\"}, {\"id\": 4729, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Member removed from a security-enabled global group\", \"desc\": \"Group membership change.\", \"sev\": \"info\"}, {\"id\": 4732, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Member added to a security-enabled local group\", \"desc\": \"Often how someone gets local Administrators rights.\", \"sev\": \"warn\"}, {\"id\": 4733, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Member removed from a security-enabled local group\", \"desc\": \"Local group membership change.\", \"sev\": \"info\"}, {\"id\": 4738, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A user account was changed\", \"desc\": \"Attribute change on an account (UAC flags, name, expiry).\", \"sev\": \"info\"}, {\"id\": 4740, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A user account was locked out\", \"desc\": \"Lockout threshold hit. The Caller Computer Name field points at the source — often a stale mapped drive, phone mail profile, or saved credential.\", \"sev\": \"warn\"}, {\"id\": 4767, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A user account was unlocked\", \"desc\": \"An admin cleared a lockout.\", \"sev\": \"info\"}, {\"id\": 4771, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Kerberos pre-authentication failed\", \"desc\": \"Wrong password against a domain controller. Failure code 0x18 = bad password, 0x12 = disabled/locked/expired.\", \"sev\": \"warn\"}, {\"id\": 4776, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Domain controller attempted to validate credentials\", \"desc\": \"NTLM authentication attempt. Error 0xC000006A = bad password, 0xC0000234 = locked out.\", \"sev\": \"info\"}, {\"id\": 4768, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Kerberos TGT was requested\", \"desc\": \"A ticket-granting ticket was issued — the start of a Kerberos logon.\", \"sev\": \"info\"}, {\"id\": 4769, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Kerberos service ticket was requested\", \"desc\": \"Access to a specific service. High volume; useful for Kerberoasting detection when encryption type is RC4.\", \"sev\": \"info\"}, {\"id\": 4778, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A session was reconnected to a Window Station\", \"desc\": \"RDP or fast-user-switch reconnect.\", \"sev\": \"info\"}, {\"id\": 4779, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A session was disconnected from a Window Station\", \"desc\": \"RDP session disconnected without signing out.\", \"sev\": \"info\"}, {\"id\": 4798, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A user's local group membership was enumerated\", \"desc\": \"Frequently seen during reconnaissance tooling.\", \"sev\": \"info\"}, {\"id\": 4800, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"The workstation was locked\", \"desc\": \"User locked the screen.\", \"sev\": \"info\"}, {\"id\": 4801, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"The workstation was unlocked\", \"desc\": \"User unlocked the screen.\", \"sev\": \"info\"}, {\"id\": 4688, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A new process has been created\", \"desc\": \"Process creation auditing. With command-line auditing enabled this is the single most useful forensic event.\", \"sev\": \"info\"}, {\"id\": 4689, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A process has exited\", \"desc\": \"Process termination.\", \"sev\": \"info\"}, {\"id\": 4697, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A service was installed in the system\", \"desc\": \"New service registered — a very common persistence technique.\", \"sev\": \"warn\"}, {\"id\": 4698, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A scheduled task was created\", \"desc\": \"New scheduled task — also a common persistence technique.\", \"sev\": \"warn\"}, {\"id\": 4699, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A scheduled task was deleted\", \"desc\": \"Task removed.\", \"sev\": \"info\"}, {\"id\": 4702, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A scheduled task was updated\", \"desc\": \"Existing task modified.\", \"sev\": \"info\"}, {\"id\": 4703, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A user right was adjusted\", \"desc\": \"Token privileges changed.\", \"sev\": \"info\"}, {\"id\": 4719, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"System audit policy was changed\", \"desc\": \"Auditing settings altered — attackers do this to go quiet.\", \"sev\": \"warn\"}, {\"id\": 1102, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Eventlog\", \"title\": \"The audit log was cleared\", \"desc\": \"Security log wiped. Almost never legitimate outside a rebuild.\", \"sev\": \"error\"}, {\"id\": 4616, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"The system time was changed\", \"desc\": \"Clock change — breaks Kerberos if the skew exceeds 5 minutes.\", \"sev\": \"warn\"}, {\"id\": 4657, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A registry value was modified\", \"desc\": \"Registry auditing hit.\", \"sev\": \"info\"}, {\"id\": 4663, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"An attempt was made to access an object\", \"desc\": \"File/folder auditing hit. Pairs with 4656.\", \"sev\": \"info\"}, {\"id\": 4656, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A handle to an object was requested\", \"desc\": \"Object access attempt, successful or not.\", \"sev\": \"info\"}, {\"id\": 4670, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Permissions on an object were changed\", \"desc\": \"ACL change on a file, folder or registry key.\", \"sev\": \"warn\"}, {\"id\": 5140, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A network share object was accessed\", \"desc\": \"Someone connected to a file share.\", \"sev\": \"info\"}, {\"id\": 5145, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"A network share object was checked for access\", \"desc\": \"Detailed share access check — high volume.\", \"sev\": \"info\"}, {\"id\": 5156, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Windows Filtering Platform permitted a connection\", \"desc\": \"Firewall allowed traffic. Very high volume.\", \"sev\": \"info\"}, {\"id\": 5157, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"Windows Filtering Platform blocked a connection\", \"desc\": \"Firewall blocked traffic — useful when an app can't reach a server.\", \"sev\": \"warn\"}, {\"id\": 5152, \"log\": \"Security\", \"src\": \"Microsoft-Windows-Security-Auditing\", \"title\": \"WFP blocked a packet\", \"desc\": \"Packet-level firewall drop.\", \"sev\": \"info\"}, {\"id\": 6005, \"log\": \"System\", \"src\": \"EventLog\", \"title\": \"The Event log service was started\", \"desc\": \"Marks the start of a boot. Use it to find when a machine came up.\", \"sev\": \"info\"}, {\"id\": 6006, \"log\": \"System\", \"src\": \"EventLog\", \"title\": \"The Event log service was stopped\", \"desc\": \"Marks a clean shutdown.\", \"sev\": \"info\"}, {\"id\": 6008, \"log\": \"System\", \"src\": \"EventLog\", \"title\": \"The previous system shutdown was unexpected\", \"desc\": \"Dirty shutdown — power loss, hard reset, or a crash. Check for a 41 and a 1001 around the same time.\", \"sev\": \"error\"}, {\"id\": 6009, \"log\": \"System\", \"src\": \"EventLog\", \"title\": \"Processor information logged at boot\", \"desc\": \"OS version and CPU details recorded during startup.\", \"sev\": \"info\"}, {\"id\": 6013, \"log\": \"System\", \"src\": \"EventLog\", \"title\": \"The system uptime is N seconds\", \"desc\": \"Daily uptime heartbeat.\", \"sev\": \"info\"}, {\"id\": 41, \"log\": \"System\", \"src\": \"Microsoft-Windows-Kernel-Power\", \"title\": \"The system rebooted without cleanly shutting down first\", \"desc\": \"Kernel-Power 41. Power loss, hardware fault, overheating, or a bugcheck that couldn't write a log. Correlate with 6008 and 1001.\", \"sev\": \"error\"}, {\"id\": 1074, \"log\": \"System\", \"src\": \"User32\", \"title\": \"The system has been shut down by a process/user\", \"desc\": \"Clean shutdown or restart, and it names who or what triggered it plus the reason code.\", \"sev\": \"info\"}, {\"id\": 1076, \"log\": \"System\", \"src\": \"User32\", \"title\": \"Reason supplied for the last unexpected shutdown\", \"desc\": \"Someone entered a shutdown reason after an unexpected restart.\", \"sev\": \"info\"}, {\"id\": 1001, \"log\": \"System\", \"src\": \"Microsoft-Windows-WER-SystemErrorReporting\", \"title\": \"The computer has rebooted from a bugcheck\", \"desc\": \"The blue-screen record, including the stop code and dump path. The bugcheck code is the thing worth searching.\", \"sev\": \"error\"}, {\"id\": 1000, \"log\": \"Application\", \"src\": \"Application Error\", \"title\": \"Faulting application\", \"desc\": \"An application crashed. Gives the faulting module, which usually points at the culprit (a printer driver, an add-in, a codec).\", \"sev\": \"error\"}, {\"id\": 1002, \"log\": \"Application\", \"src\": \"Application Hang\", \"title\": \"Application hang\", \"desc\": \"App stopped responding and was terminated.\", \"sev\": \"error\"}, {\"id\": 1026, \"log\": \"Application\", \"src\": \".NET Runtime\", \"title\": \"Unhandled .NET exception\", \"desc\": \"A managed application crashed with a stack trace attached.\", \"sev\": \"error\"}, {\"id\": 7000, \"log\": \"System\", \"src\": \"Service Control Manager\", \"title\": \"A service failed to start\", \"desc\": \"Service start failure — usually a bad path, missing dependency, or logon-account problem.\", \"sev\": \"error\"}, {\"id\": 7001, \"log\": \"System\", \"src\": \"Service Control Manager\", \"title\": \"A service depends on another service that failed to start\", \"desc\": \"Dependency chain failure. Fix the dependency first.\", \"sev\": \"error\"}, {\"id\": 7009, \"log\": \"System\", \"src\": \"Service Control Manager\", \"title\": \"Timeout waiting for a service to connect\", \"desc\": \"Service didn't respond within 30 seconds (default). Common on slow or heavily loaded machines.\", \"sev\": \"warn\"}, {\"id\": 7011, \"log\": \"System\", \"src\": \"Service Control Manager\", \"title\": \"Timeout waiting for a transaction response from a service\", \"desc\": \"Service hung. Frequently a symptom of disk or resource starvation.\", \"sev\": \"warn\"}, {\"id\": 7023, \"log\": \"System\", \"src\": \"Service Control Manager\", \"title\": \"Service terminated with an error\", \"desc\": \"A service stopped with a specific error code.\", \"sev\": \"error\"}, {\"id\": 7024, \"log\": \"System\", \"src\": \"Service Control Manager\", \"title\": \"Service terminated with a service-specific error\", \"desc\": \"Service exited with its own error code.\", \"sev\": \"error\"}, {\"id\": 7026, \"log\": \"System\", \"src\": \"Service Control Manager\", \"title\": \"Boot-start or system-start driver failed to load\", \"desc\": \"A driver didn't load at boot.\", \"sev\": \"warn\"}, {\"id\": 7031, \"log\": \"System\", \"src\": \"Service Control Manager\", \"title\": \"Service terminated unexpectedly\", \"desc\": \"Service crashed; the recovery action taken is listed.\", \"sev\": \"error\"}, {\"id\": 7034, \"log\": \"System\", \"src\": \"Service Control Manager\", \"title\": \"Service terminated unexpectedly (no recovery)\", \"desc\": \"Service crashed and no restart action was configured.\", \"sev\": \"error\"}, {\"id\": 7036, \"log\": \"System\", \"src\": \"Service Control Manager\", \"title\": \"Service entered the running/stopped state\", \"desc\": \"Routine service state change. Very high volume.\", \"sev\": \"info\"}, {\"id\": 7040, \"log\": \"System\", \"src\": \"Service Control Manager\", \"title\": \"Service start type was changed\", \"desc\": \"Someone changed a service between automatic, manual and disabled.\", \"sev\": \"info\"}, {\"id\": 7045, \"log\": \"System\", \"src\": \"Service Control Manager\", \"title\": \"A new service was installed\", \"desc\": \"New service installed — a classic persistence mechanism, worth checking against change records.\", \"sev\": \"warn\"}, {\"id\": 7, \"log\": \"System\", \"src\": \"Disk\", \"title\": \"The device has a bad block\", \"desc\": \"Physical bad sector. Back the drive up now and plan a replacement.\", \"sev\": \"error\"}, {\"id\": 9, \"log\": \"System\", \"src\": \"Disk\", \"title\": \"The device did not respond within the timeout period\", \"desc\": \"Storage timeout — failing disk, loose cable, or an overloaded SAN path.\", \"sev\": \"error\"}, {\"id\": 11, \"log\": \"System\", \"src\": \"Disk\", \"title\": \"The driver detected a controller error\", \"desc\": \"Controller-level storage error, often cabling or the HBA.\", \"sev\": \"error\"}, {\"id\": 15, \"log\": \"System\", \"src\": \"Disk\", \"title\": \"The device is not ready for access\", \"desc\": \"Storage device unavailable, often transient on removable media.\", \"sev\": \"warn\"}, {\"id\": 51, \"log\": \"System\", \"src\": \"Disk\", \"title\": \"An error was detected during a paging operation\", \"desc\": \"Paging I/O error — strongly associated with a failing drive.\", \"sev\": \"error\"}, {\"id\": 52, \"log\": \"System\", \"src\": \"Disk\", \"title\": \"The driver has detected that a device is predicted to fail\", \"desc\": \"SMART pre-failure warning. Replace the drive.\", \"sev\": \"error\"}, {\"id\": 129, \"log\": \"System\", \"src\": \"storahci\", \"title\": \"Reset to device issued\", \"desc\": \"Storage controller had to reset the device. Repeated occurrences mean failing hardware or firmware issues.\", \"sev\": \"warn\"}, {\"id\": 153, \"log\": \"System\", \"src\": \"Disk\", \"title\": \"The IO operation was retried\", \"desc\": \"I/O retried at the storage layer.\", \"sev\": \"warn\"}, {\"id\": 157, \"log\": \"System\", \"src\": \"Disk\", \"title\": \"Disk has been surprise removed\", \"desc\": \"A disk vanished without being ejected.\", \"sev\": \"warn\"}, {\"id\": 98, \"log\": \"System\", \"src\": \"Ntfs\", \"title\": \"Volume is healthy / corruption detected\", \"desc\": \"NTFS health report. Corruption entries call for chkdsk.\", \"sev\": \"warn\"}, {\"id\": 55, \"log\": \"System\", \"src\": \"Ntfs\", \"title\": \"File system structure corruption detected\", \"desc\": \"NTFS corruption on a volume. Run chkdsk /f at the next opportunity.\", \"sev\": \"error\"}, {\"id\": 1058, \"log\": \"System\", \"src\": \"Microsoft-Windows-GroupPolicy\", \"title\": \"Failed to read the Group Policy file\", \"desc\": \"GPO processing couldn't read gpt.ini from SYSVOL. Usually DFS, permissions or connectivity to a DC.\", \"sev\": \"error\"}, {\"id\": 1030, \"log\": \"System\", \"src\": \"Microsoft-Windows-GroupPolicy\", \"title\": \"Failed to query the list of Group Policy objects\", \"desc\": \"GPO retrieval failure, generally alongside 1058.\", \"sev\": \"error\"}, {\"id\": 1006, \"log\": \"System\", \"src\": \"Microsoft-Windows-GroupPolicy\", \"title\": \"Failed to bind to Active Directory\", \"desc\": \"The client couldn't reach a domain controller for policy.\", \"sev\": \"error\"}, {\"id\": 1500, \"log\": \"Application\", \"src\": \"Microsoft-Windows-User Profiles Service\", \"title\": \"Windows cannot log you on because your profile cannot be loaded\", \"desc\": \"Profile load failure — check the profile path and disk space.\", \"sev\": \"error\"}, {\"id\": 1511, \"log\": \"Application\", \"src\": \"Microsoft-Windows-User Profiles Service\", \"title\": \"Windows cannot find the local profile / logged on with temporary profile\", \"desc\": \"The classic 'temporary profile' complaint. Look for a .bak entry under ProfileList in the registry.\", \"sev\": \"error\"}, {\"id\": 1530, \"log\": \"Application\", \"src\": \"Microsoft-Windows-User Profiles Service\", \"title\": \"Windows detected your registry file is still in use\", \"desc\": \"Handles left open at logoff. Usually harmless, but it can delay profile unload.\", \"sev\": \"warn\"}, {\"id\": 1534, \"log\": \"Application\", \"src\": \"Microsoft-Windows-User Profiles Service\", \"title\": \"Profile notification of event failed\", \"desc\": \"A profile extension failed during logon or logoff.\", \"sev\": \"warn\"}, {\"id\": 1014, \"log\": \"System\", \"src\": \"Microsoft-Windows-DNS-Client\", \"title\": \"Name resolution for a name timed out\", \"desc\": \"DNS query timed out. Check the configured DNS servers and connectivity.\", \"sev\": \"warn\"}, {\"id\": 1054, \"log\": \"System\", \"src\": \"Microsoft-Windows-GroupPolicy\", \"title\": \"Cannot obtain the domain controller name\", \"desc\": \"Network isn't ready at logon, so policy fails. Common on Wi-Fi-only laptops.\", \"sev\": \"error\"}, {\"id\": 4201, \"log\": \"System\", \"src\": \"Tcpip\", \"title\": \"The system detected that network adapter was connected\", \"desc\": \"Link up.\", \"sev\": \"info\"}, {\"id\": 4202, \"log\": \"System\", \"src\": \"Tcpip\", \"title\": \"The system detected that network adapter was disconnected\", \"desc\": \"Link down — cable, switch port, or Wi-Fi drop.\", \"sev\": \"warn\"}, {\"id\": 4199, \"log\": \"System\", \"src\": \"Tcpip\", \"title\": \"IP address conflict detected\", \"desc\": \"Two devices claim the same IP. Check for a static address inside the DHCP scope.\", \"sev\": \"error\"}, {\"id\": 1003, \"log\": \"System\", \"src\": \"Dhcp-Client\", \"title\": \"Failed to obtain a lease\", \"desc\": \"No DHCP response. Check the scope, the relay/helper address, and the switch port.\", \"sev\": \"error\"}, {\"id\": 1002, \"log\": \"System\", \"src\": \"Dhcp-Client\", \"title\": \"IP address lease conflict\", \"desc\": \"DHCP offered an address already in use.\", \"sev\": \"warn\"}, {\"id\": 50037, \"log\": \"System\", \"src\": \"Microsoft-Windows-Dhcp-Client\", \"title\": \"DHCP service is unavailable\", \"desc\": \"Client fell back to APIPA (169.254.x.x).\", \"sev\": \"warn\"}, {\"id\": 21, \"log\": \"Application\", \"src\": \"Microsoft-Windows-TerminalServices-LocalSessionManager\", \"title\": \"Remote Desktop session logon succeeded\", \"desc\": \"RDP sign-in, with the source address.\", \"sev\": \"info\"}, {\"id\": 23, \"log\": \"Application\", \"src\": \"Microsoft-Windows-TerminalServices-LocalSessionManager\", \"title\": \"Remote Desktop session logoff succeeded\", \"desc\": \"RDP sign-out.\", \"sev\": \"info\"}, {\"id\": 24, \"log\": \"Application\", \"src\": \"Microsoft-Windows-TerminalServices-LocalSessionManager\", \"title\": \"Remote Desktop session has been disconnected\", \"desc\": \"RDP disconnect without logoff.\", \"sev\": \"info\"}, {\"id\": 25, \"log\": \"Application\", \"src\": \"Microsoft-Windows-TerminalServices-LocalSessionManager\", \"title\": \"Remote Desktop session reconnection succeeded\", \"desc\": \"User returned to an existing RDP session.\", \"sev\": \"info\"}, {\"id\": 1149, \"log\": \"Application\", \"src\": \"Microsoft-Windows-TerminalServices-RemoteConnectionManager\", \"title\": \"Remote Desktop user authentication succeeded\", \"desc\": \"Network-level authentication passed. A burst of these from unknown IPs means RDP is exposed to the internet.\", \"sev\": \"info\"}, {\"id\": 9009, \"log\": \"System\", \"src\": \"Microsoft-Windows-Winlogon\", \"title\": \"The Desktop Window Manager has exited\", \"desc\": \"Often logged during RDP session teardown.\", \"sev\": \"info\"}, {\"id\": 19, \"log\": \"System\", \"src\": \"Microsoft-Windows-WindowsUpdateClient\", \"title\": \"Installation successful\", \"desc\": \"An update installed cleanly.\", \"sev\": \"info\"}, {\"id\": 20, \"log\": \"System\", \"src\": \"Microsoft-Windows-WindowsUpdateClient\", \"title\": \"Installation failure\", \"desc\": \"An update failed. The result code (0x8024xxxx) identifies the cause.\", \"sev\": \"error\"}, {\"id\": 43, \"log\": \"System\", \"src\": \"Microsoft-Windows-WindowsUpdateClient\", \"title\": \"Installation started\", \"desc\": \"Update installation began.\", \"sev\": \"info\"}, {\"id\": 44, \"log\": \"System\", \"src\": \"Microsoft-Windows-WindowsUpdateClient\", \"title\": \"Download started\", \"desc\": \"Update download began.\", \"sev\": \"info\"}, {\"id\": 1001, \"log\": \"Application\", \"src\": \"Microsoft-Windows-WindowsUpdateClient\", \"title\": \"Update failed to install\", \"desc\": \"Servicing failure; check CBS.log for the underlying cause.\", \"sev\": \"error\"}, {\"id\": 1033, \"log\": \"Application\", \"src\": \"MsiInstaller\", \"title\": \"Product installed\", \"desc\": \"An MSI installation completed. Records the product name and version.\", \"sev\": \"info\"}, {\"id\": 1034, \"log\": \"Application\", \"src\": \"MsiInstaller\", \"title\": \"Product removed\", \"desc\": \"An MSI was uninstalled.\", \"sev\": \"info\"}, {\"id\": 11707, \"log\": \"Application\", \"src\": \"MsiInstaller\", \"title\": \"Installation completed successfully\", \"desc\": \"MSI success message.\", \"sev\": \"info\"}, {\"id\": 11708, \"log\": \"Application\", \"src\": \"MsiInstaller\", \"title\": \"Installation failed\", \"desc\": \"MSI rollback. The preceding 1033/10005 entries carry the error code.\", \"sev\": \"error\"}, {\"id\": 1006, \"log\": \"Microsoft-Windows-Windows Defender/Operational\", \"src\": \"Windows Defender\", \"title\": \"Malware or unwanted software detected\", \"desc\": \"Defender found something. The Name and Path fields identify it.\", \"sev\": \"error\"}, {\"id\": 1007, \"log\": \"Microsoft-Windows-Windows Defender/Operational\", \"src\": \"Windows Defender\", \"title\": \"Action taken on malware\", \"desc\": \"Defender quarantined, removed or allowed a detection.\", \"sev\": \"warn\"}, {\"id\": 1116, \"log\": \"Microsoft-Windows-Windows Defender/Operational\", \"src\": \"Windows Defender\", \"title\": \"Malware detected\", \"desc\": \"Threat detected, with severity and category.\", \"sev\": \"error\"}, {\"id\": 1117, \"log\": \"Microsoft-Windows-Windows Defender/Operational\", \"src\": \"Windows Defender\", \"title\": \"Action taken to protect the system\", \"desc\": \"Defender successfully remediated a threat.\", \"sev\": \"info\"}, {\"id\": 1118, \"log\": \"Microsoft-Windows-Windows Defender/Operational\", \"src\": \"Windows Defender\", \"title\": \"Action failed\", \"desc\": \"Remediation failed — the file may be locked or in use.\", \"sev\": \"error\"}, {\"id\": 5001, \"log\": \"Microsoft-Windows-Windows Defender/Operational\", \"src\": \"Windows Defender\", \"title\": \"Real-time protection disabled\", \"desc\": \"Real-time protection turned off. Rarely intentional.\", \"sev\": \"warn\"}, {\"id\": 5007, \"log\": \"Microsoft-Windows-Windows Defender/Operational\", \"src\": \"Windows Defender\", \"title\": \"Configuration changed\", \"desc\": \"A Defender setting or exclusion was modified.\", \"sev\": \"warn\"}, {\"id\": 2001, \"log\": \"Microsoft-Windows-Windows Defender/Operational\", \"src\": \"Windows Defender\", \"title\": \"Signature update failed\", \"desc\": \"Definitions failed to update.\", \"sev\": \"warn\"}, {\"id\": 307, \"log\": \"Microsoft-Windows-PrintService/Operational\", \"src\": \"PrintService\", \"title\": \"Document printed\", \"desc\": \"A job completed, with user, document name, printer and page count.\", \"sev\": \"info\"}, {\"id\": 372, \"log\": \"Microsoft-Windows-PrintService/Operational\", \"src\": \"PrintService\", \"title\": \"Document failed to print\", \"desc\": \"Print job failure.\", \"sev\": \"error\"}, {\"id\": 808, \"log\": \"Microsoft-Windows-PrintService/Admin\", \"src\": \"PrintService\", \"title\": \"The print spooler failed to load a plug-in module\", \"desc\": \"A print driver component failed — a frequent cause of spooler crashes.\", \"sev\": \"error\"}, {\"id\": 7031, \"log\": \"System\", \"src\": \"Service Control Manager\", \"title\": \"Print Spooler service terminated unexpectedly\", \"desc\": \"Spooler crash. Usually a bad driver; clearing the spool folder and reinstalling the driver is the standard fix.\", \"sev\": \"error\"}, {\"id\": 2003, \"log\": \"Application\", \"src\": \"Outlook\", \"title\": \"Outlook could not connect to the server\", \"desc\": \"Connectivity or autodiscover failure.\", \"sev\": \"warn\"}, {\"id\": 27, \"log\": \"Application\", \"src\": \"Outlook\", \"title\": \"The connection to Microsoft Exchange is unavailable\", \"desc\": \"Outlook lost its Exchange connection.\", \"sev\": \"warn\"}, {\"id\": 1, \"log\": \"System\", \"src\": \"Microsoft-Windows-Kernel-General\", \"title\": \"The system time was changed\", \"desc\": \"Clock adjustment recorded by the kernel.\", \"sev\": \"info\"}, {\"id\": 219, \"log\": \"System\", \"src\": \"Microsoft-Windows-Kernel-PnP\", \"title\": \"The driver failed to load for the device\", \"desc\": \"A device driver couldn't load.\", \"sev\": \"warn\"}, {\"id\": 46, \"log\": \"System\", \"src\": \"volmgr\", \"title\": \"Crash dump initialization failed\", \"desc\": \"The pagefile is too small or misplaced to hold a dump.\", \"sev\": \"warn\"}, {\"id\": 37, \"log\": \"System\", \"src\": \"Microsoft-Windows-Kernel-Processor-Power\", \"title\": \"The speed of processor is being limited by firmware\", \"desc\": \"CPU throttled — thermal or power delivery problem.\", \"sev\": \"warn\"}, {\"id\": 6, \"log\": \"System\", \"src\": \"Microsoft-Windows-Kernel-Boot\", \"title\": \"The boot type was 0x1 (hybrid)\", \"desc\": \"Fast startup was used, so this wasn't a full cold boot. Relevant when a reboot 'didn't fix it'.\", \"sev\": \"info\"}, {\"id\": 63, \"log\": \"System\", \"src\": \"Microsoft-Windows-WMI\", \"title\": \"A provider has been registered in the WMI namespace\", \"desc\": \"Routine WMI registration.\", \"sev\": \"info\"}, {\"id\": 10016, \"log\": \"System\", \"src\": \"DistributedCOM\", \"title\": \"The application-specific permission settings do not grant Local Activation permission\", \"desc\": \"The famous noisy DCOM error. Microsoft's guidance is that it is generally safe to ignore.\", \"sev\": \"warn\"}, {\"id\": 10010, \"log\": \"System\", \"src\": \"DistributedCOM\", \"title\": \"The server did not register with DCOM within the required timeout\", \"desc\": \"A COM server was slow to start. Usually benign.\", \"sev\": \"warn\"}, {\"id\": 36871, \"log\": \"System\", \"src\": \"Schannel\", \"title\": \"A fatal error occurred while creating a TLS credential\", \"desc\": \"TLS handshake failure — often a missing or expired certificate, or a protocol mismatch.\", \"sev\": \"error\"}, {\"id\": 36874, \"log\": \"System\", \"src\": \"Schannel\", \"title\": \"TLS connection request received but no cipher suites in common\", \"desc\": \"Protocol/cipher mismatch, common after disabling old TLS versions.\", \"sev\": \"error\"}, {\"id\": 36887, \"log\": \"System\", \"src\": \"Schannel\", \"title\": \"A fatal alert was received from the remote endpoint\", \"desc\": \"The other side rejected the TLS handshake. Alert 40 = handshake failure, 46 = certificate unknown, 48 = unknown CA.\", \"sev\": \"warn\"}, {\"id\": 1311, \"log\": \"Directory Service\", \"src\": \"NTDS KCC\", \"title\": \"The KCC could not build a spanning tree topology\", \"desc\": \"Replication topology can't be constructed — check site links and bridgeheads.\", \"sev\": \"error\"}, {\"id\": 2042, \"log\": \"Directory Service\", \"src\": \"NTDS Replication\", \"title\": \"It has been too long since this machine replicated\", \"desc\": \"Replication has exceeded the tombstone lifetime. The DC must be rebuilt, not forced.\", \"sev\": \"error\"}, {\"id\": 1864, \"log\": \"Directory Service\", \"src\": \"NTDS Replication\", \"title\": \"This directory server has not recently received replication information\", \"desc\": \"Some partners are behind.\", \"sev\": \"warn\"}, {\"id\": 5805, \"log\": \"System\", \"src\": \"NETLOGON\", \"title\": \"The session setup from the computer failed\", \"desc\": \"Broken machine account trust. Rejoin the domain or reset the secure channel.\", \"sev\": \"error\"}, {\"id\": 5719, \"log\": \"System\", \"src\": \"NETLOGON\", \"title\": \"No domain controller is available\", \"desc\": \"The machine couldn't find a DC — network not ready at boot is the usual reason.\", \"sev\": \"error\"}, {\"id\": 3210, \"log\": \"System\", \"src\": \"NETLOGON\", \"title\": \"Failed to authenticate with a domain controller\", \"desc\": \"Machine account authentication failure.\", \"sev\": \"error\"}, {\"id\": 18590, \"log\": \"Microsoft-Windows-Hyper-V-Worker-Admin\", \"src\": \"Hyper-V-Worker\", \"title\": \"The virtual machine was reset\", \"desc\": \"A VM was hard-reset.\", \"sev\": \"warn\"}, {\"id\": 12140, \"log\": \"Microsoft-Windows-Hyper-V-VMMS-Admin\", \"src\": \"Hyper-V-VMMS\", \"title\": \"Failed to start the virtual machine\", \"desc\": \"VM start failure — check storage paths and memory.\", \"sev\": \"error\"}, {\"id\": 517, \"log\": \"Application\", \"src\": \"Microsoft-Windows-Backup\", \"title\": \"Backup completed with errors\", \"desc\": \"Windows Server Backup finished but some items failed.\", \"sev\": \"warn\"}, {\"id\": 521, \"log\": \"Application\", \"src\": \"Microsoft-Windows-Backup\", \"title\": \"Backup failed to complete\", \"desc\": \"Backup job failure.\", \"sev\": \"error\"}, {\"id\": 546, \"log\": \"Application\", \"src\": \"Microsoft-Windows-Backup\", \"title\": \"Backup completed successfully\", \"desc\": \"Backup ran clean.\", \"sev\": \"info\"}, {\"id\": 1309, \"log\": \"Application\", \"src\": \"ASP.NET\", \"title\": \"Web event / unhandled exception\", \"desc\": \"An ASP.NET application error was recorded.\", \"sev\": \"error\"}, {\"id\": 1310, \"log\": \"Application\", \"src\": \"ASP.NET\", \"title\": \"Event code 3005 unhandled exception\", \"desc\": \"ASP.NET unhandled exception.\", \"sev\": \"error\"}, {\"id\": 9, \"log\": \"Application\", \"src\": \"Perflib\", \"title\": \"Unable to open the Performance counters\", \"desc\": \"Corrupt performance counters — rebuild with lodctr /R.\", \"sev\": \"warn\"}];\nlet filter = '';\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nconst attr = s => esc(s).replace(/\"/g, '&quot;');\n\nfunction psCmd(e){\n  const log = e.log.split('/')[0];\n  return \"Get-WinEvent -FilterHashtable @{LogName='\" + log + \"'; ID=\" + e.id + \"} -MaxEvents 20 | Format-List\";\n}\nfunction wvCmd(e){\n  return 'wevtutil qe \"' + e.log + '\" /q:\"*[System[(EventID=' + e.id + ')]]\" /f:text /c:20';\n}\n\nfunction match(e, q){\n  if (!q) return true;\n  const num = /^\\d+$/.test(q);\n  if (num && String(e.id) === q) return true;\n  const hay = (e.id + ' ' + e.title + ' ' + e.desc + ' ' + e.src + ' ' + e.log).toLowerCase();\n  return q.toLowerCase().split(/\\s+/).every(w => hay.includes(w));\n}\n\nfunction render(){\n  const q = $('evQ').value.trim();\n  let list = DB.filter(e => match(e, q));\n  if (filter){\n    list = ['error','warn','info'].includes(filter)\n      ? list.filter(e => e.sev === filter)\n      : list.filter(e => e.log.includes(filter));\n  }\n  // exact ID matches float to the top\n  if (/^\\d+$/.test(q)) list.sort((a, b) => (String(b.id) === q) - (String(a.id) === q));\n\n  $('evCount').textContent = list.length + ' of ' + DB.length + ' entries';\n  $('evList').innerHTML = list.length ? list.map((e, i) =>\n    '<div class=\"card ' + e.sev + '\" data-i=\"' + i + '\">' +\n      '<div class=\"hd\"><span class=\"id\">' + e.id + '</span><span class=\"tt\">' + esc(e.title) + '</span></div>' +\n      '<div class=\"meta\"><b>' + esc(e.log) + '</b><span>' + esc(e.src) + '</span></div>' +\n      '<div class=\"body\">' + esc(e.desc) +\n        '<div class=\"cmds\">' +\n          '<button data-c=\"' + attr(psCmd(e)) + '\">Copy PowerShell</button>' +\n          '<button data-c=\"' + attr(wvCmd(e)) + '\">Copy wevtutil</button>' +\n        '</div>' +\n      '</div>' +\n    '</div>').join('')\n    : '<div class=\"empty\">No match.<br>Try the bare Event ID, or a keyword like &ldquo;lockout&rdquo; or &ldquo;bugcheck&rdquo;.</div>';\n\n  $('evList').querySelectorAll('.card').forEach((c, i) => {\n    c.onclick = ev => {\n      if (ev.target.closest('.cmds')) return;\n      c.classList.toggle('open');\n    };\n    c.querySelectorAll('.cmds button').forEach(b => b.onclick = () => {\n      navigator.clipboard.writeText(b.dataset.c).then(() => toast('Command copied'), () => toast('Copied'));\n    });\n  });\n}\n\n$('evQ').addEventListener('input', render);\n$('evF').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  filter = b.dataset.f;\n  $('evF').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));\n  render();\n};\nrender();"
    },

      "html": "<div id=\"at\">\n<style>\n  #at{position:absolute;inset:0;overflow-y:auto;padding:24px 18px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #at .wrap{width:100%;max-width:620px}\n  #at h2{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #at .sub{margin:0 0 20px;font-size:13.5px;color:#6E6E76}\n  #at .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #at .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:0 0 13px}\n  #at label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:12px 0 6px}\n  #at label:first-of-type{margin-top:0}\n  #at input,#at select{width:100%;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:#111114}\n  #at input:focus,#at select:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #at .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n  #at .stage{display:flex;justify-content:center;padding:22px 12px;background:repeating-conic-gradient(#F0F0F4 0 25%,#fff 0 50%) 50%/18px 18px;border-radius:16px;margin-bottom:14px}\n  /* the tag itself */\n  #at .tag{\n    width:340px;background:#fff;border:1px solid #D8D8DE;border-radius:9px;padding:13px 15px;\n    font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;color:#000;\n    box-shadow:0 2px 10px rgba(0,0,0,.1)\n  }\n  #at .tag .co{font-size:14px;font-weight:800;letter-spacing:.02em;line-height:1.15;text-transform:uppercase}\n  #at .tag .ln{height:2px;background:#000;margin:7px 0 9px}\n  #at .tag .mid{display:flex;gap:12px;align-items:flex-start}\n  #at .tag .left{flex:1;min-width:0}\n  #at .tag .lbl{font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#666}\n  #at .tag .val{font-size:15px;font-       "html": "<div id=\"cv\">\n<style>\n  #cv{position:absolute;inset:0;overflow-y:auto;padding:22px 18px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #cv .wrap{width:100%;max-width:680px}\n  #cv h2{margin:0 0 14px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #cv .top{display:flex;gap:8px;margin-bottom:12px}\n  #cv .top input{flex:1;padding:11px 14px;border:1px solid rgba(60,60,67,.16);border-radius:13px;background:#fff;font:inherit;font-size:16px}\n  #cv .top input:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #cv .btn{padding:11px 15px;border:0;border-radius:12px;background:#0A84FF;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .15s}\n  #cv .btn:active{transform:scale(.97)}\n  #cv .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #cv .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}\n  #cv .tags{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;-webkit-overflow-scrolling:touch}\n  #cv .tags button{padding:6px 13px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:12.5px;font-weight:560;color:#6E6E76;cursor:pointer;white-space:nowrap}\n  #cv .tags button.on{background:#111114;border-color:#111114;color:#fff}\n  #cv .sn{background:#fff;border-radius:14px;margin-bottom:9px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05),0 8px 20px -18px rgba(16,24,40,.4)}\n  #cv .sn .hd{display:flex;align-items:center;gap:11px;padding:14px 15px;cursor:pointer;user-select:none}\n  #cv .sn .chev{color:#C3C3C9;font-size:12px;transition:transform .2s;flex:0 0 auto}\n  #cv .sn.open .chev{transform:rotate(90deg)}\n  #cv .sn .ti{flex:1;font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}\n  #cv .sn .sh{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px}\n  #cv .sn .sh.ps{background:rgba(1,36,86,.1);color:#012456}\n  #cv .sn .sh.cmd{background:rgba(60,60,67,.12);color:#3C3C43}\n  #cv .sn .sh.bash{background:rgba(48,164,108,.14);color:#12805C}\n  #cv .sn .bd{display:none;padding:0 15px 15px}\n  #cv .sn.open .bd{display:block}\n  #cv .sn .ds{font-size:13.5px;color:#6E6E76;line-height:1.55;margin:0 0 11px;padding-top:2px}\n  #cv .sn pre{margin:0;padding:13px 14px;border-radius:11px;background:#0E1116;color:#D6DEEB;overflow-x:auto;\n    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre}\n  #cv .sn pre .c{color:#7C8697} #cv .sn pre .v{color:#8ED0F5} #cv .sn pre .s{color:#B6E58C} #cv .sn pre .k{color:#E7A6FF}\n  #cv .sn .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}\n  #cv .empty{text-align:center;color:#A6A6AE;font-size:14px;padding:44px 20px;line-height:1.7}\n  /* editor */\n  #cv .ed{position:absolute;inset:0;background:#F2F2F7;overflow-y:auto;display:none;z-index:5}\n  #cv .ed.on{display:block}\n  #cv .ed .inner{max-width:680px;margin:0 auto;padding:22px 18px calc(40px + env(safe-area-inset-bottom,0px))}\n  #cv .ed label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:16px 0 6px}\n  #cv .ed input,#cv .ed textarea,#cv .ed select{width:100%;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:#111114}\n  #cv .ed textarea{min-height:190px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;white-space:pre;tab-size:4}\n  #cv .ed input:focus,#cv .ed textarea:focus,#cv .ed select:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #cv .ed h2{margin:0;font-size:22px}\n  #cv .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n</style>\n  <div class=\"wrap\">\n    <h2>Command Vault</h2>\n    <div class=\"top\">\n      <input id=\"cvQ\" placeholder=\"Search titles, commands, tags…\" spellcheck=\"false\">\n      <button class=\"btn\" id=\"cvNew\">New</button>\n    </div>\n    <div class=\"tags\" id=\"cvTags\"></div>\n    <div id=\"cvList\"></div>\n    <div style=\"display:flex;gap:8px;margin-top:20px;flex-wrap:wrap\">\n      <button class=\"btn ghost sm\" id=\"cvExport\">Export</button>\n      <button class=\"btn ghost sm\" id=\"cvImport\">Import</button>\n      <button class=\"btn ghost sm\" id=\"cvExpand\">Expand all</button>\n    </div>\n  </div>\n\n  <div class=\"ed\" id=\"cvEd\">\n    <div class=\"inner\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\">\n        <h2 id=\"cvEdT\">New snippet</h2>\n        <button class=\"btn ghost sm\" id=\"cvCancel\">Cancel</button>\n      </div>\n      <label for=\"cvT\">Title</label><input id=\"cvT\" placeholder=\"Reset a user's password\">\n      <label for=\"cvD\">Description</label><input id=\"cvD\" placeholder=\"What it does, and anything to watch out for\">\n      <div class=\"r2\">\n        <div><label for=\"cvSh\">Shell</label>\n          <select id=\"cvSh\"><option value=\"ps\">PowerShell</option><option value=\"cmd\">CMD</option><option value=\"bash\">Bash</option></select>\n        </div>\n        <div><label for=\"cvTg\">Tags</label><input id=\"cvTg\" placeholder=\"ad, users\"></div>\n      </div>\n      <label for=\"cvC\">Command / script</label>\n      <textarea id=\"cvC\" spellcheck=\"false\" placeholder=\"Get-ADUser -Identity jbloggs -Properties *\"></textarea>\n      <div style=\"display:flex;gap:8px;margin-top:20px\">\n        <button class=\"btn\" id=\"cvSave\" style=\"flex:1\">Save snippet</button>\n        <button class=\"btn ghost\" id=\"cvDel\">Delete</button>\n      </div>\n    </div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst KEY = 'cmdvault.v1';\nlet all = [], editing = null, tagFilter = '';\ntry { all = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}\nif (!all.length) all = seed();\nconst save = () => localStorage.setItem(KEY, JSON.stringify(all));\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nfunction uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }\nconst SH = { ps:'PowerShell', cmd:'CMD', bash:'Bash' };\n\nfunction seed(){\n  return [\n    { id:uid(), sh:'ps', title:'Find who locked an account out', tags:['ad','lockout'],\n      desc:'Searches the PDC emulator security log for 4740 events naming the user, which reveals the source machine.',\n      cmd:'$user = \"jbloggs\"\\n$pdc  = (Get-ADDomain).PDCEmulator\\n\\nGet-WinEvent -ComputerName $pdc -FilterHashtable @{\\n    LogName = \\'Security\\'; ID = 4740\\n} -MaxEvents 50 |\\n  Where-Object { $_.Properties[0].Value -eq $user } |\\n  Select-Object TimeCreated,\\n                @{n=\\'User\\';   e={$_.Properties[0].Value}},\\n                @{n=\\'Source\\'; e={$_.Properties[1].Value}}' },\n    { id:uid(), sh:'ps', title:'Unlock an AD account and force a password change', tags:['ad','users'],\n      desc:'Clears the lockout and flags the account so the user must set a new password at next sign-in.',\n      cmd:'Unlock-ADAccount -Identity jbloggs\\nSet-ADUser  -Identity jbloggs -ChangePasswordAtLogon $true' },\n    { id:uid(), sh:'ps', title:'Last 20 boots and shutdowns', tags:['diagnostics'],\n      desc:'Quickly answers \"when did this machine actually restart?\" using the event log.',\n      cmd:'Get-WinEvent -FilterHashtable @{LogName=\\'System\\'; ID=6005,6006,6008,41,1074} -MaxEvents 20 |\\n  Select-Object TimeCreated, Id, @{n=\\'Message\\';e={$_.Message -replace \"`r`n\",\" \" }} |\\n  Format-Table -AutoSize -Wrap' },\n    { id:uid(), sh:'ps', title:'Disk space on every drive', tags:['diagnostics','storage'],\n      desc:'Free and total space per volume, in GB.',\n      cmd:'Get-CimInstance Win32_LogicalDisk -Filter \"DriveType=3\" |\\n  Select-Object DeviceID,\\n    @{n=\\'Size(GB)\\';e={[math]::Round($_.Size/1GB,1)}},\\n    @{n=\\'Free(GB)\\';e={[math]::Round($_.FreeSpace/1GB,1)}},\\n    @{n=\\'Free%\\';   e={[math]::Round($_.FreeSpace/$_.Size*100,1)}} |\\n  Format-Table -AutoSize' },\n    { id:uid(), sh:'ps', title:'Restart the print spooler and clear stuck jobs', tags:['printing'],\n      desc:'The standard fix for a jammed queue. Stops the service, empties the spool folder, starts it again.',\n      cmd:'Stop-Service  -Name Spooler -Force\\nRemove-Item   -Path \"$env:SystemRoot\\\\System32\\\\spool\\\\PRINTERS\\\\*\" -Force -ErrorAction SilentlyContinue\\nStart-Service -Name Spooler\\nGet-Service Spooler' },\n    { id:uid(), sh:'ps', title:'Recently installed Windows updates', tags:['updates'],\n      desc:'Lists the most recent hotfixes with their install dates.',\n      cmd:'Get-HotFix | Sort-Object InstalledOn -Descending |\\n  Select-Object -First 15 HotFixID, Description, InstalledOn' },\n    { id:uid(), sh:'cmd', title:'Full network configuration and DNS reset', tags:['network'],\n      desc:'The classic connectivity reset. Run as administrator, then reboot.',\n      cmd:'ipconfig /all\\nipconfig /flushdns\\nipconfig /release\\nipconfig /renew\\nnetsh winsock reset\\nnetsh int ip reset' },\n    { id:uid(), sh:'cmd', title:'Repair Windows system files', tags:['repair'],\n      desc:'DISM repairs the component store, then SFC repairs system files against it. Run in this order.',\n      cmd:'DISM /Online /Cleanup-Image /RestoreHealth\\nsfc /scannow' },\n    { id:uid(), sh:'cmd', title:'Show saved Wi-Fi password', tags:['network','wifi'],\n      desc:'Reveals the key for a stored wireless profile on this machine.',\n      cmd:'netsh wlan show profiles\\nnetsh wlan show profile name=\"SSID-NAME\" key=clear' },\n    { id:uid(), sh:'ps', title:'Test a port on a remote host', tags:['network'],\n      desc:'Replaces telnet for checking whether a service is listening and reachable.',\n      cmd:'Test-NetConnection -ComputerName server01 -Port 443 -InformationLevel Detailed' },\n    { id:uid(), sh:'ps', title:'Top 10 processes by memory', tags:['diagnostics'],\n      desc:'Finds what is eating RAM on a sluggish machine.',\n      cmd:'Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 10 \\n  Name, Id, @{n=\\'RAM(MB)\\';e={[math]::Round($_.WorkingSet64/1MB)}}, CPU' },\n    { id:uid(), sh:'ps', title:'Bulk-add users to a group from a CSV', tags:['ad','bulk'],\n      desc:'Expects a CSV with a SamAccountName column. Test against a small file first.',\n      cmd:'Import-Csv .\\\\users.csv | ForEach-Object {\\n    Add-ADGroupMember -Identity \"Finance-RW\" -Members $_.SamAccountName\\n    Write-Host \"Added $($_.SamAccountName)\"\\n}' }\n  ];\n}\n\n/* Light syntax colouring — comments, strings, variables, keywords. */\nfunction highlight(code, sh){\n  let h = esc(code);\n  h = h.replace(/(^|\\n)(\\s*)(#[^\\n]*|::[^\\n]*|REM [^\\n]*)/gi, (m, a, b, c) => a + b + '<span class=\"c\">' + c + '</span>');\n  h = h.replace(/(&quot;[^&\\n]*?&quot;|'[^'\\n]*?')/g, '<span class=\"s\">$1</span>');\n  if (sh === 'ps'){\n    h = h.replace(/(\\$[A-Za-z_][\\w:]*)/g, '<span class=\"v\">$1</span>');\n    h = h.replace(/\\b(Get|Set|New|Remove|Add|Start|Stop|Restart|Test|Import|Export|Select|Where|ForEach|Sort|Format)-[A-Za-z]+\\b/g, '<span class=\"k\">$&</span>');\n  } else {\n    h = h.replace(/(%[A-Za-z_]\\w*%)/g, '<span class=\"v\">$1</span>');\n  }\n  return h;\n}\n\nfunction allTags(){\n  const s = new Set();\n  all.forEach(x => (x.tags || []).forEach(t => s.add(t)));\n  return [...s].sort();\n}\n\nfunction render(){\n  const q = $('cvQ').value.trim().toLowerCase();\n  const tags = allTags();\n  $('cvTags').innerHTML = tags.length\n    ? '<button class=\"' + (tagFilter ? '' : 'on') + '\" data-t=\"\">All</button>' +\n      tags.map(t => '<button class=\"' + (tagFilter === t ? 'on' : '') + '\" data-t=\"' + esc(t) + '\">' + esc(t) + '</button>').join('')\n    : '';\n  $('cvTags').querySelectorAll('button').forEach(b => b.onclick = () => { tagFilter = b.dataset.t; render(); });\n\n  const list = all.filter(s => {\n    if (tagFilter && !(s.tags || []).includes(tagFilter)) return false;\n    if (!q) return true;\n    return (s.title + ' ' + s.desc + ' ' + s.cmd + ' ' + (s.tags || []).join(' ')).toLowerCase().includes(q);\n  });\n\n  $('cvList').innerHTML = list.length ? list.map(s =>\n    '<div class=\"sn\" data-id=\"' + s.id + '\">' +\n      '<div class=\"hd\"><span class=\"chev\">&#9654;</span>' +\n        '<span class=\"ti\">' + esc(s.title) + '</span>' +\n        '<span class=\"sh ' + s.sh + '\">' + SH[s.sh] + '</span>' +\n      '</div>' +\n      '<div class=\"bd\">' +\n        (s.desc ? '<p class=\"ds\">' + esc(s.desc) + '</p>' : '') +\n        '<pre>' + highlight(s.cmd, s.sh) + '</pre>' +\n        '<div class=\"acts\">' +\n          '<button class=\"btn sm\" data-a=\"copy\">Copy</button>' +\n          '<button class=\"btn ghost sm\" data-a=\"edit\">Edit</button>' +\n          '<button class=\"btn ghost sm\" data-a=\"dup\">Duplicate</button>' +\n        '</div>' +\n      '</div>' +\n    '</div>').join('')\n    : '<div class=\"empty\">' + (all.length ? 'Nothing matches that search.' : 'No snippets yet.<br>Tap <b>New</b> to add one.') + '</div>';\n\n  $('cvList').querySelectorAll('.sn').forEach(el => {\n    const s = all.find(x => x.id === el.dataset.id);\n    el.querySelector('.hd').onclick = () => el.classList.toggle('open');\n    el.querySelectorAll('[data-a]').forEach(b => b.onclick = ev => {\n      ev.stopPropagation();\n      const a = b.dataset.a;\n      if (a === 'copy') navigator.clipboard.writeText(s.cmd).then(() => toast('Command copied'), () => toast('Copied'));\n      if (a === 'edit') openEd(s);\n      if (a === 'dup'){ const c = Object.assign({}, s, { id:uid(), title:s.title + ' (copy)' }); all.unshift(c); save(); render(); toast('Duplicated'); }\n    });\n    // right-click / long-press context menu\n    el.addEventListener('contextmenu', ev => { ev.preventDefault(); menu(ev.clientX, ev.clientY, s); });\n    let t;\n    el.addEventListener('touchstart', ev => {\n      t = setTimeout(() => {\n        const to = ev.touches[0];\n        menu(to.clientX, to.clientY, s);\n      }, 520);\n    }, { passive:true });\n    ['touchend','touchmove','touchcancel'].forEach(e2 => el.addEventListener(e2, () => clearTimeout(t), { passive:true }));\n  });\n}\n\nfunction menu(x, y, s){\n  showMenu(x, y, [\n    { cap: s.title },\n    { label:'Copy command', on:() => navigator.clipboard.writeText(s.cmd).then(() => toast('Copied'), () => toast('Copied')) },\n    { label:'Edit', on:() => openEd(s) },\n    { label:'Duplicate', on:() => { all.unshift(Object.assign({}, s, { id:uid(), title:s.title + ' (copy)' })); save(); render(); } },\n    'sep',\n    { label:'Move up', on:() => { const i = all.indexOf(s); if (i > 0){ all.splice(i, 1); all.splice(i - 1, 0, s); save(); render(); } }, disabled: all.indexOf(s) === 0 },\n    { label:'Move down', on:() => { const i = all.indexOf(s); if (i < all.length - 1){ all.splice(i, 1); all.splice(i + 1, 0, s); save(); render(); } }, disabled: all.indexOf(s) === all.length - 1 },\n    'sep',\n    { label:'Delete', danger:true, on: async () => {\n        if (!await confirmDlg('Delete \"' + s.title + '\"?', 'This snippet is removed from this device.', 'Delete')) return;\n        all = all.filter(x => x.id !== s.id); save(); render(); toast('Deleted');\n      } }\n  ]);\n}\n\nfunction openEd(s){\n  editing = s || null;\n  $('cvEdT').textContent = s ? 'Edit snippet' : 'New snippet';\n  $('cvT').value = s ? s.title : '';\n  $('cvD').value = s ? s.desc : '';\n  $('cvSh').value = s ? s.sh : 'ps';\n  $('cvTg').value = s ? (s.tags || []).join(', ') : '';\n  $('cvC').value = s ? s.cmd : '';\n  $('cvDel').style.display = s ? '' : 'none';\n  $('cvEd').classList.add('on');\n}\n$('cvNew').onclick = () => openEd(null);\n$('cvCancel').onclick = () => $('cvEd').classList.remove('on');\n$('cvSave').onclick = () => {\n  const title = $('cvT').value.trim(), cmd = $('cvC').value;\n  if (!title) return toast('Give it a title');\n  if (!cmd.trim()) return toast('Add the command');\n  const data = { title, desc:$('cvD').value.trim(), sh:$('cvSh').value, cmd,\n    tags: $('cvTg').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean) };\n  if (editing) Object.assign(editing, data);\n  else all.unshift(Object.assign({ id:uid() }, data));\n  save(); $('cvEd').classList.remove('on'); render(); toast('Saved');\n};\n$('cvDel').onclick = async () => {\n  if (!editing) return;\n  if (!await confirmDlg('Delete \"' + editing.title + '\"?', 'This snippet is removed from this device.', 'Delete')) return;\n  all = all.filter(x => x.id !== editing.id);\n  save(); $('cvEd').classList.remove('on'); render(); toast('Deleted');\n};\n$('cvQ').addEventListener('input', render);\n$('cvExpand').onclick = () => {\n  const cards = [...document.querySelectorAll('#cvList .sn')];\n  const anyClosed = cards.some(c => !c.classList.contains('open'));\n  cards.forEach(c => c.classList.toggle('open', anyClosed));\n  $('cvExpand').textContent = anyClosed ? 'Collapse all' : 'Expand all';\n};\n$('cvExport').onclick = () => {\n  const blob = new Blob([JSON.stringify(all, null, 2)], { type:'application/json' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob); a.download = 'command-vault.json'; a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n};\n$('cvImport').onclick = async () => {\n  const txt = await ask('Import snippets', 'Paste exported JSON', '', true);\n  if (!txt) return;\n  try {\n    const data = JSON.parse(txt);\n    if (!Array.isArray(data)) throw new Error('Expected a list');\n    let n = 0;\n    data.forEach(s => { if (s.title && s.cmd){ s.id = uid(); all.unshift(s); n++; } });\n    save(); render(); toast(n + ' snippet' + (n === 1 ? '' : 's') + ' imported');\n  } catch (e){ toast('Could not read that: ' + e.message); }\n};\n\n// Tab indents inside the code editor instead of moving focus\n$('cvC').addEventListener('keydown', e => {\n  if (e.key !== 'Tab') return;\n  e.preventDefault();\n  const s = $('cvC').selectionStart;\n  $('cvC').value = $('cvC').value.slice(0, s) + '    ' + $('cvC').value.slice($('cvC').selectionEnd);\n  $('cvC').selectionStart = $('cvC').selectionEnd = s + 4;\n});\n\nrender();\nonToolExit(() => hideMenu());"
    }
  },

      "html": "<div id=\"sp\">\n<style>\n  #sp{position:absolute;inset:0;overflow-y:auto;padding:26px 18px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #sp .wrap{width:100%;max-width:520px;text-align:center}\n  #sp h2{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #sp .sub{margin:0 0 24px;font-size:13.5px;color:#6E6E76}\n  #sp .gauge{position:relative;width:250px;height:250px;margin:0 auto 8px}\n  #sp svg{width:250px;height:250px;transform:rotate(135deg)}\n  #sp svg circle{fill:none;stroke-width:14;stroke-linecap:round}\n  #sp svg .bg{stroke:rgba(120,120,128,.14)}\n  #sp svg .fg{stroke:#0A84FF;transition:stroke-dashoffset .3s ease,stroke .3s}\n  #sp .rd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}\n  #sp .rd .n{font-size:52px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}\n  #sp .rd .u{font-size:13px;color:#A6A6AE;font-weight:600;letter-spacing:.05em;margin-top:5px}\n  #sp .rd .ph{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#0A84FF;margin-bottom:9px;min-height:15px}\n  #sp .go{width:100%;max-width:300px;height:54px;margin:18px auto 0;display:block;border:0;border-radius:16px;background:#111114;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:transform .15s}\n  #sp .go:active{transform:scale(.98)} #sp .go:disabled{opacity:.5}\n  #sp .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:24px}\n  #sp .st{background:#fff;border-radius:14px;padding:14px 8px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #sp .st .l{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A6A6AE}\n  #sp .st .v{font-size:20px;font-weight:640;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}\n  #sp .st .s{font-size:10.5px;color:#C3C3C9;margin-top:1px}\n  #sp .note{font-size:12px;color:#A6A6AE;line-height:1.6;margin-top:22px;text-align:left;background:#fff;border-radius:13px;padding:14px}\n  #sp .hist{margin-top:16px;text-align:left}\n  #sp .hist .hr{display:flex;justify-content:space-between;padding:9px 13px;background:#fff;border-radius:11px;margin-bottom:6px;font-size:13px}\n  #sp .hist .hr span:first-child{color:#6E6E76}\n  #sp .hist .hr b{font-variant-numeric:tabular-nums}\n</style>\n  <div class=\"wrap\">\n    <h2>Speed Test</h2>\n    <p class=\"sub\">Measures throughput against Cloudflare's public endpoint.</p>\n    <div class=\"gauge\">\n      <svg viewBox=\"0 0 250 250\"><circle class=\"bg\" cx=\"125\" cy=\"125\" r=\"108\"/><circle class=\"fg\" id=\"spRing\" cx=\"125\" cy=\"125\" r=\"108\"/></svg>\n      <div class=\"rd\">\n        <div class=\"ph\" id=\"spPhase\">Ready</div>\n        <div class=\"n\" id=\"spNum\">&mdash;</div>\n        <div class=\"u\">Mbps</div>\n      </div>\n    </div>\n    <button class=\"go\" id=\"spGo\">Start test</button>\n    <div class=\"stats\">\n      <div class=\"st\"><div class=\"l\">Download</div><div class=\"v\" id=\"spDown\">&mdash;</div><div class=\"s\">Mbps</div></div>\n      <div class=\"st\"><div class=\"l\">Upload</div><div class=\"v\" id=\"spUp\">&mdash;</div><div class=\"s\">Mbps</div></div>\n      <div class=\"st\"><div class=\"l\">Latency</div><div class=\"v\" id=\"spPing\">&mdash;</div><div class=\"s\">ms</div></div>\n    </div>\n    <div class=\"hist\" id=\"spHist\"></div>\n    <p class=\"note\">Browser-based tests measure what this tab can pull over HTTPS, so results sit below what a native speed test reports &mdash; expect roughly 70&ndash;90% of your line speed. Wi-Fi, VPNs and other active downloads all drag the number down. Use it for a quick sanity check rather than proving an ISP fault.</p>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst HKEY = 'speedtest.hist.v1';\nconst R = 108, CIRC = 2 * Math.PI * R;\nconst ARC = 0.75;                     // gauge sweeps three-quarters of the circle\nlet running = false, ctrl = null;\n\n$('spRing').style.strokeDasharray = CIRC;\n$('spRing').style.strokeDashoffset = CIRC;\n\nfunction gauge(mbps){\n  // log scale so both 5 Mbps and 500 Mbps read sensibly\n  const frac = Math.max(0, Math.min(1, Math.log10(Math.max(mbps, 0.1) + 1) / Math.log10(1001)));\n  $('spRing').style.strokeDashoffset = CIRC * (1 - frac * ARC);\n  $('spRing').style.stroke = mbps < 10 ? '#E5484D' : mbps < 50 ? '#F5A524' : '#30A46C';\n  $('spNum').textContent = mbps >= 100 ? Math.round(mbps) : mbps.toFixed(1);\n}\nfunction phase(t){ $('spPhase').textContent = t; }\n\nasync function latency(){\n  phase('Latency');\n  const times = [];\n  for (let i = 0; i < 6; i++){\n    const t0 = performance.now();\n    try {\n      await fetch('https://speed.cloudflare.com/__down?bytes=1000&r=' + Math.random(),\n        { cache:'no-store', signal: ctrl.signal });\n      times.push(performance.now() - t0);\n    } catch { /* ignore a dropped sample */ }\n  }\n  if (!times.length) throw new Error('no response');\n  times.sort((a, b) => a - b);\n  const median = times[Math.floor(times.length / 2)];\n  const jitter = times.length > 1 ? (times[times.length - 1] - times[0]) / 2 : 0;\n  return { ping: median, jitter };\n}\n\nasync function download(){\n  phase('Download');\n  const sizes = [2e6, 5e6, 10e6, 25e6];\n  let best = 0;\n  for (const size of sizes){\n    const t0 = performance.now();\n    let bytes = 0;\n    try {\n      const r = await fetch('https://speed.cloudflare.com/__down?bytes=' + size + '&r=' + Math.random(),\n        { cache:'no-store', signal: ctrl.signal });\n      const reader = r.body.getReader();\n      while (true){\n        const { done, value } = await reader.read();\n        if (done) break;\n        bytes += value.length;\n        const secs = (performance.now() - t0) / 1000;\n        if (secs > 0.25) gauge((bytes * 8) / secs / 1e6);\n      }\n    } catch (e){ if (e.name === 'AbortError') throw e; break; }\n    const secs = (performance.now() - t0) / 1000;\n    const mbps = (bytes * 8) / secs / 1e6;\n    if (mbps > best) best = mbps;\n    if (secs > 6) break;                 // stop climbing sizes on a slow line\n  }\n  return best;\n}\n\nasync function upload(){\n  phase('Upload');\n  const payload = new Uint8Array(3e6);\n  crypto.getRandomValues(payload.subarray(0, 65536));\n  let best = 0;\n  for (let i = 0; i < 3; i++){\n    const t0 = performance.now();\n    try {\n      await fetch('https://speed.cloudflare.com/__up', {\n        method:'POST', body: payload, cache:'no-store', signal: ctrl.signal\n      });\n    } catch (e){ if (e.name === 'AbortError') throw e; break; }\n    const secs = (performance.now() - t0) / 1000;\n    const mbps = (payload.length * 8) / secs / 1e6;\n    if (mbps > best) best = mbps;\n    gauge(mbps);\n  }\n  return best;\n}\n\nasync function run(){\n  if (running){ ctrl.abort(); return; }\n  running = true; ctrl = new AbortController();\n  $('spGo').textContent = 'Stop';\n  ['spDown','spUp','spPing'].forEach(id => $(id).textContent = '\\u2026');\n  try {\n    const { ping, jitter } = await latency();\n    $('spPing').textContent = Math.round(ping);\n    const d = await download();\n    $('spDown').textContent = d >= 100 ? Math.round(d) : d.toFixed(1);\n    const u = await upload();\n    $('spUp').textContent = u >= 100 ? Math.round(u) : u.toFixed(1);\n    gauge(d);\n    phase('Done');\n    record({ d, u, ping, jitter, t: Date.now() });\n  } catch (e){\n    if (e.name === 'AbortError') phase('Stopped');\n    else { phase('Failed'); toast('Test failed \\u2014 check your connection'); }\n  }\n  running = false;\n  $('spGo').textContent = 'Start test';\n}\n\nfunction record(r){\n  let h = [];\n  try { h = JSON.parse(localStorage.getItem(HKEY)) || []; } catch {}\n  h.unshift(r);\n  h = h.slice(0, 5);\n  localStorage.setItem(HKEY, JSON.stringify(h));\n  drawHist();\n}\nfunction drawHist(){\n  let h = [];\n  try { h = JSON.parse(localStorage.getItem(HKEY)) || []; } catch {}\n  $('spHist').innerHTML = h.length\n    ? '<div style=\"font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:0 0 9px 3px\">Recent</div>' +\n      h.map(r => '<div class=\"hr\"><span>' + new Date(r.t).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) +\n        '</span><b>' + r.d.toFixed(1) + ' \\u2193 &nbsp; ' + r.u.toFixed(1) + ' \\u2191 &nbsp; ' + Math.round(r.ping) + ' ms</b></div>').join('')\n    : '';\n}\n\n$('spGo').onclick = run;\ndrawHist();\nonToolExit(() => { if (ctrl) ctrl.abort(); });"

      "html": "<div id=\"dn\">\n<style>\n  #dn{padding:26px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #dn .wrap{width:100%;max-width:680px}\n  #dn h2{margin:0 0 18px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #dn .form{display:flex;gap:8px;margin-bottom:14px}\n  #dn .form input{flex:1;padding:12px 14px;border:1px solid rgba(60,60,67,.16);border-radius:13px;background:#fff;font:inherit;font-size:16px}\n  #dn .form input:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #dn .form button{padding:0 20px;border:0;border-radius:13px;background:#0A84FF;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s}\n  #dn .form button:active{transform:scale(.97)}\n  #dn .types{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}\n  #dn .types button{padding:7px 14px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:13px;font-weight:560;color:#6E6E76;cursor:pointer;transition:.15s}\n  #dn .types button.on{background:#111114;border-color:#111114;color:#fff}\n  #dn .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4);margin-bottom:14px}\n  #dn .card h3{margin:0;padding:12px 16px;font-size:13px;font-weight:700;letter-spacing:.02em;color:#6E6E76;border-bottom:1px solid rgba(60,60,67,.08);display:flex;justify-content:space-between}\n  #dn .card h3 span{color:#A6A6AE;font-weight:600}\n  #dn .rec{display:flex;gap:14px;padding:11px 16px;border-bottom:1px solid rgba(60,60,67,.06);align-items:baseline}\n  #dn .rec:last-child{border-bottom:0}\n  #dn .rec .data{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;word-break:break-all;color:#111114}\n  #dn .rec .ttl{flex:0 0 auto;font-size:11.5px;color:#A6A6AE;font-variant-numeric:tabular-nums}\n  #dn .msg{padding:30px;text-align:center;color:#A6A6AE;font-size:14px}\n  #dn .err{color:#B8390E}\n</style>\n  <div class=\"wrap\">\n    <h2>DNS lookup</h2>\n    <div class=\"form\">\n      <input id=\"dnHost\" placeholder=\"example.com\" spellcheck=\"false\" autocapitalize=\"off\" value=\"example.com\">\n      <button id=\"dnGo\">Look up</button>\n    </div>\n    <div class=\"types\" id=\"dnTypes\">\n      <button data-t=\"A\" class=\"on\">A</button>\n      <button data-t=\"AAAA\">AAAA</button>\n      <button data-t=\"MX\">MX</button>\n      <button data-t=\"TXT\">TXT</button>\n      <button data-t=\"NS\">NS</button>\n      <button data-t=\"CNAME\">CNAME</button>\n      <button data-t=\"SOA\">SOA</button>\n      <button data-t=\"CAA\">CAA</button>\n    </div>\n    <div id=\"dnOut\"><div class=\"msg\">Enter a domain and choose record types.</div></div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst TYPES = new Set(['A']);\nconst RTYPE = { 1:'A', 2:'NS', 5:'CNAME', 6:'SOA', 15:'MX', 16:'TXT', 28:'AAAA', 257:'CAA' };\n\n$('dnTypes').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  const t = b.dataset.t;\n  if (TYPES.has(t) && TYPES.size > 1) TYPES.delete(t); else TYPES.add(t);\n  b.classList.toggle('on', TYPES.has(t));\n};\n\nasync function lookupOne(host, type){\n  // Cloudflare's DNS-over-HTTPS JSON endpoint sends CORS headers, so it works from the browser.\n  const r = await fetch('https://cloudflare-dns.com/dns-query?name=' + encodeURIComponent(host) + '&type=' + type,\n    { headers:{ accept:'application/dns-json' } });\n  if (!r.ok) throw new Error('HTTP ' + r.status);\n  return r.json();\n}\n\nfunction recCard(type, json){\n  const answers = (json.Answer || []).filter(a => RTYPE[a.type] === type || type === 'TXT');\n  const rows = (json.Answer || []).map(a =>\n    '<div class=\"rec\"><div class=\"data\">' + fmt(type, a.data) + '</div><div class=\"ttl\">TTL ' + a.TTL + '</div></div>'\n  ).join('');\n  const status = json.Status === 0\n    ? (json.Answer ? json.Answer.length + ' record' + (json.Answer.length === 1 ? '' : 's') : 'no records')\n    : 'NXDOMAIN / error';\n  return '<div class=\"card\"><h3>' + type + ' <span>' + status + '</span></h3>' +\n    (rows || '<div class=\"msg\">No ' + type + ' records.</div>') + '</div>';\n}\nfunction fmt(type, data){\n  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\n  return esc(data);\n}\n\nasync function run(){\n  const host = $('dnHost').value.trim().replace(/^https?:\\/\\//, '').replace(/\\/.*$/, '');\n  if (!host){ toast('Enter a domain'); return; }\n  const out = $('dnOut');\n  out.innerHTML = '<div class=\"msg\">Resolving ' + host.replace(/[&<>]/g,'') + '\\u2026</div>';\n  const types = [...TYPES];\n  try {\n    const results = await Promise.all(types.map(async t => [t, await lookupOne(host, t)]));\n    out.innerHTML = results.map(([t, j]) => recCard(t, j)).join('');\n  } catch (e){\n    out.innerHTML = '<div class=\"msg err\">Lookup failed: ' + e.message +\n      '<br><br>This tool queries Cloudflare over HTTPS and needs an internet connection.</div>';\n  }\n}\n\n$('dnGo').onclick = run;\n$('dnHost').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });"

      "html": "<div id=\"ip\">\n<style>\n  #ip{padding:26px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #ip .wrap{width:100%;max-width:640px}\n  #ip h2{margin:0 0 18px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #ip .hero{background:#111114;color:#fff;border-radius:20px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden}\n  #ip .hero .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}\n  #ip .hero .addr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:30px;font-weight:600;margin-top:6px;letter-spacing:-.01em;word-break:break-all;cursor:pointer}\n  #ip .hero .sub{margin-top:8px;font-size:13.5px;color:rgba(255,255,255,.65)}\n  #ip .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4);margin-bottom:14px}\n  #ip .card h3{margin:0;padding:12px 16px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;border-bottom:1px solid rgba(60,60,67,.08)}\n  #ip .kv{display:flex;padding:11px 16px;border-bottom:1px solid rgba(60,60,67,.06);gap:14px}\n  #ip .kv:last-child{border-bottom:0}\n  #ip .kv .k{flex:0 0 132px;font-size:13.5px;color:#6E6E76}\n  #ip .kv .v{flex:1;font-size:13.5px;color:#111114;word-break:break-word;text-align:right;font-variant-numeric:tabular-nums}\n  #ip .kv .v.mono{font-family:ui-monospace,Menlo,monospace}\n  #ip .msg{padding:16px;font-size:13px;color:#A6A6AE}\n  #ip .msg.err{color:#B8390E}\n</style>\n  <div class=\"wrap\">\n    <h2>What&rsquo;s my info</h2>\n    <div class=\"hero\">\n      <div class=\"lbl\">Public IP address</div>\n      <div class=\"addr\" id=\"ipAddr\">&hellip;</div>\n      <div class=\"sub\" id=\"ipWhere\">Looking up your connection&hellip;</div>\n    </div>\n    <div class=\"card\"><h3>Network</h3><div id=\"ipNet\"><div class=\"msg\">Loading&hellip;</div></div></div>\n    <div class=\"card\"><h3>This browser &amp; device</h3><div id=\"ipDev\"></div></div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nfunction rows(el, pairs){\n  el.innerHTML = pairs.map(([k, v, mono]) =>\n    '<div class=\"kv\"><div class=\"k\">' + k + '</div><div class=\"v' + (mono ? ' mono' : '') + '\">' + esc(v ?? '\\u2014') + '</div></div>'\n  ).join('');\n}\n\n/* ---------- Local: needs no network ---------- */\n(function deviceInfo(){\n  const n = navigator, s = screen;\n  const langs = (n.languages || [n.language]).join(', ');\n  const cores = n.hardwareConcurrency ? n.hardwareConcurrency + ' logical' : 'unknown';\n  const mem = n.deviceMemory ? '~' + n.deviceMemory + ' GB' : 'unknown';\n  const touch = (n.maxTouchPoints > 0) ? n.maxTouchPoints + ' points' : 'none';\n  const dpr = window.devicePixelRatio || 1;\n  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown';\n  rows($('ipDev'), [\n    ['Platform', n.platform],\n    ['Languages', langs],\n    ['Screen', s.width + ' \\u00d7 ' + s.height + ' @ ' + dpr + 'x', true],\n    ['Viewport', innerWidth + ' \\u00d7 ' + innerHeight + ' px', true],\n    ['Colour depth', s.colorDepth + '-bit'],\n    ['CPU cores', cores],\n    ['Device memory', mem],\n    ['Touch', touch],\n    ['Time zone', tz],\n    ['Cookies', n.cookieEnabled ? 'enabled' : 'disabled'],\n    ['Do Not Track', n.doNotTrack === '1' ? 'on' : 'off']\n  ]);\n})();\n\n$('ipAddr').onclick = () => {\n  const t = $('ipAddr').textContent.trim();\n  if (t && t !== '\\u2026') navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast('Copied'));\n};\n\n/* ---------- Public IP + geo: needs network ---------- */\n(async function ipInfo(){\n  try {\n    // ipwho.is is free, CORS-enabled, and returns IP + geo in one call.\n    const r = await fetch('https://ipwho.is/');\n    const d = await r.json();\n    if (d.success === false) throw new Error(d.message || 'lookup failed');\n    $('ipAddr').textContent = d.ip || 'unknown';\n    const place = [d.city, d.region, d.country].filter(Boolean).join(', ');\n    $('ipWhere').textContent = place ? place + (d.flag && d.flag.emoji ? '  ' + d.flag.emoji : '') : 'Location unavailable';\n    rows($('ipNet'), [\n      ['IP address', d.ip, true],\n      ['Type', d.type],\n      ['ISP', d.connection && d.connection.isp],\n      ['Organisation', d.connection && d.connection.org],\n      ['ASN', d.connection && d.connection.asn ? 'AS' + d.connection.asn : null, true],\n      ['City', d.city],\n      ['Region', d.region],\n      ['Country', d.country ? d.country + ' (' + d.country_code + ')' : null],\n      ['Postal', d.postal],\n      ['Coordinates', (d.latitude != null) ? d.latitude + ', ' + d.longitude : null, true],\n      ['Time zone', d.timezone && d.timezone.id]\n    ]);\n  } catch (e){\n    $('ipAddr').textContent = 'unavailable';\n    $('ipWhere').textContent = 'Could not reach the lookup service';\n    $('ipNet').innerHTML = '<div class=\"msg err\">Public IP lookup failed (' + esc(e.message) +\n      '). It needs an internet connection. Your local device details above still work.</div>';\n  }\n})();"
