      "html": "<div id=\"ac\">\n<style>\n  #ac{position:absolute;inset:0;display:flex;flex-direction:column;background:#F2F2F7}\n  #ac .bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid rgba(60,60,67,.1)}\n  #ac .bar .t{font-size:14px;font-weight:640;color:#111114}\n  #ac .bar .sp{flex:1}\n  #ac .bar button{padding:7px 12px;border:1px solid rgba(60,60,67,.14);border-radius:10px;background:#fff;font-size:13px;font-weight:560;cursor:pointer;color:#111114}\n  #ac .bar button:hover{border-color:#0A84FF;color:#0A84FF}\n  #ac .dot{width:8px;height:8px;border-radius:50%;background:#A6A6AE}\n  #ac .dot.ok{background:#30A46C} #ac .dot.err{background:#E5484D}\n  #ac .log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}\n  #ac .m{max-width:80%;padding:12px 15px;border-radius:18px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}\n  #ac .m.u{align-self:flex-end;background:#0A84FF;color:#fff;border-bottom-right-radius:5px}\n  #ac .m.a{align-self:flex-start;background:#fff;color:#111114;border-bottom-left-radius:5px;box-shadow:0 1px 2px rgba(16,24,40,.06)}\n  #ac .m.e{align-self:center;background:rgba(229,72,77,.1);color:#B8390E;font-size:13px;max-width:92%}\n  #ac .m .meta{display:block;margin-top:6px;font-size:10.5px;opacity:.55}\n  #ac .m.a .copy{margin-top:8px;border:0;background:rgba(120,120,128,.12);border-radius:7px;padding:4px 9px;font-size:11.5px;cursor:pointer;color:#6E6E76}\n  #ac .typing{align-self:flex-start;display:flex;gap:4px;padding:14px 16px;background:#fff;border-radius:18px;border-bottom-left-radius:5px}\n  #ac .typing i{width:7px;height:7px;border-radius:50%;background:#C3C3C9;animation:acb 1.2s infinite}\n  #ac .typing i:nth-child(2){animation-delay:.15s} #ac .typing i:nth-child(3){animation-delay:.3s}\n  @keyframes acb{40%{transform:translateY(-5px);background:#8E8E96}}\n  #ac .empty{margin:auto;text-align:center;color:#A6A6AE;font-size:14px;line-height:1.6;padding:20px}\n  #ac .composer{flex:0 0 auto;display:flex;gap:9px;align-items:flex-end;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid rgba(60,60,67,.1)}\n  #ac .composer textarea{flex:1;max-height:150px;min-height:44px;padding:11px 14px;border:1px solid rgba(60,60,67,.16);border-radius:20px;background:#fff;font:inherit;font-size:16px;line-height:1.4;resize:none;outline:none}\n  #ac .composer textarea:focus{border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.12)}\n  #ac .send{width:44px;height:44px;flex:0 0 auto;border:0;border-radius:50%;background:#0A84FF;color:#fff;font-size:19px;cursor:pointer;transition:transform .15s}\n  #ac .send:active{transform:scale(.9)} #ac .send:disabled{opacity:.4}\n  #ac .cfg{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}\n  #ac .cfg.on{display:flex}\n  #ac .cfg .box{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:440px;max-height:88%;overflow:auto}\n  #ac .cfg h3{margin:0 0 16px;font-size:18px;font-weight:700}\n  #ac .cfg label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:0 0 6px}\n  #ac .cfg input,#ac .cfg select{width:100%;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:11px;font:inherit;font-size:16px;margin-bottom:14px;background:#fff}\n  #ac .cfg input:focus{outline:none;border-color:#0A84FF}\n  #ac .cfg .hint{font-size:12px;color:#A6A6AE;margin:-10px 0 14px;line-height:1.5}\n  #ac .cfg .row{display:flex;gap:8px}\n  #ac .cfg .row button{flex:1;padding:12px;border:0;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}\n  #ac .cfg .row .ok{background:#0A84FF;color:#fff} #ac .cfg .row .no{background:rgba(120,120,128,.12);color:#111114}\n</style>\n  <div class=\"bar\">\n    <span class=\"dot\" id=\"acDot\"></span>\n    <span class=\"t\">AI Chat</span>\n    <span class=\"sp\"></span>\n    <button id=\"acClear\">Clear</button>\n    <button id=\"acCfgBtn\">Settings</button>\n  </div>\n  <div class=\"log\" id=\"acLog\"></div>\n  <div class=\"composer\">\n    <textarea id=\"acIn\" rows=\"1\" placeholder=\"Send a message…\"></textarea>\n    <button class=\"send\" id=\"acSend\">&#8593;</button>\n  </div>\n  <div class=\"cfg\" id=\"acCfg\">\n    <div class=\"box\">\n      <h3>Webhook settings</h3>\n      <label for=\"acUrl\">n8n webhook URL</label>\n      <input id=\"acUrl\" placeholder=\"https://n8n.example.com/webhook/chat\" spellcheck=\"false\">\n      <p class=\"hint\">Your workflow should return JSON with an <b>output</b> field. Plain text and other common field names are handled too.</p>\n      <label for=\"acHdr\">Auth header name (optional)</label>\n      <input id=\"acHdr\" placeholder=\"Authorization\" spellcheck=\"false\">\n      <label for=\"acVal\">Auth header value (optional)</label>\n      <input id=\"acVal\" type=\"password\" placeholder=\"Bearer …\" spellcheck=\"false\">\n      <label for=\"acHist\">Send conversation history</label>\n      <select id=\"acHist\"><option value=\"10\">Last 10 messages</option><option value=\"20\">Last 20 messages</option><option value=\"0\">None (single turn)</option></select>\n      <div class=\"row\"><button class=\"no\" id=\"acCfgNo\">Cancel</button><button class=\"ok\" id=\"acCfgOk\">Save</button></div>\n    </div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst CFG = 'aichat.cfg.v1', HIST = 'aichat.hist.v1';\nlet cfg = { url:'', hdr:'', val:'', hist:'10' };\nlet msgs = [];\nlet busy = false, ctrl = null;\n\ntry { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(CFG)) || {}); } catch {}\ntry { msgs = JSON.parse(localStorage.getItem(HIST)) || []; } catch {}\n\nfunction setDot(){ $('acDot').className = 'dot' + (cfg.url ? ' ok' : ' err'); }\nfunction save(){ localStorage.setItem(HIST, JSON.stringify(msgs.slice(-100))); }\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\n\nfunction render(){\n  const log = $('acLog');\n  if (!msgs.length){\n    log.innerHTML = '<div class=\"empty\">' + (cfg.url\n      ? 'Ask anything. Your prompt goes to your n8n workflow and the reply lands here.'\n      : 'Add your n8n webhook URL in <b>Settings</b> to get started.') + '</div>';\n    return;\n  }\n  log.innerHTML = msgs.map((m, i) => {\n    const time = new Date(m.t).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });\n    if (m.role === 'error') return '<div class=\"m e\">' + esc(m.text) + '</div>';\n    const copy = m.role === 'assistant' ? '<button class=\"copy\" data-i=\"' + i + '\">Copy</button>' : '';\n    return '<div class=\"m ' + (m.role === 'user' ? 'u' : 'a') + '\">' + esc(m.text) +\n      '<span class=\"meta\">' + time + '</span>' + copy + '</div>';\n  }).join('');\n  log.querySelectorAll('.copy').forEach(b => b.onclick = () => {\n    navigator.clipboard.writeText(msgs[+b.dataset.i].text).then(() => toast('Copied'), () => toast('Copied'));\n  });\n  log.scrollTop = log.scrollHeight;\n}\n\nfunction typing(on){\n  const log = $('acLog');\n  const old = log.querySelector('.typing');\n  if (old) old.remove();\n  if (on){\n    const d = document.createElement('div');\n    d.className = 'typing';\n    d.innerHTML = '<i></i><i></i><i></i>';\n    log.appendChild(d);\n    log.scrollTop = log.scrollHeight;\n  }\n}\n\n// n8n workflows return all sorts of shapes; dig out the text wherever it is.\nfunction extract(data){\n  if (typeof data === 'string') return data;\n  if (Array.isArray(data)) return data.map(extract).filter(Boolean).join('\\n\\n');\n  if (data && typeof data === 'object'){\n    for (const k of ['output','text','reply','response','message','answer','result','content','data']){\n      if (typeof data[k] === 'string' && data[k].trim()) return data[k];\n      if (data[k] && typeof data[k] === 'object'){ const v = extract(data[k]); if (v) return v; }\n    }\n    if (data.json) return extract(data.json);\n  }\n  return '';\n}\n\nasync function send(){\n  const text = $('acIn').value.trim();\n  if (!text || busy) return;\n  if (!cfg.url){ toast('Add your webhook URL in Settings'); openCfg(); return; }\n\n  msgs.push({ role:'user', text, t:Date.now() });\n  $('acIn').value = ''; $('acIn').style.height = 'auto';\n  render(); save();\n\n  busy = true; $('acSend').disabled = true; typing(true);\n  ctrl = new AbortController();\n  const n = +cfg.hist;\n  const history = n ? msgs.slice(-n - 1, -1).filter(m => m.role !== 'error')\n    .map(m => ({ role:m.role, content:m.text })) : [];\n\n  try {\n    const headers = { 'Content-Type':'application/json' };\n    if (cfg.hdr && cfg.val) headers[cfg.hdr] = cfg.val;\n    const r = await fetch(cfg.url, {\n      method:'POST', headers, signal: ctrl.signal,\n      body: JSON.stringify({ chatInput:text, message:text, prompt:text, history, sessionId:sessionId() })\n    });\n    const raw = await r.text();\n    let out = '';\n    try { out = extract(JSON.parse(raw)); } catch { out = raw; }\n    if (!r.ok) throw new Error('HTTP ' + r.status + (out ? ' \\u2014 ' + out.slice(0, 200) : ''));\n    typing(false);\n    msgs.push({ role:'assistant', text: out.trim() || '(empty reply from the workflow)', t:Date.now() });\n  } catch (e){\n    typing(false);\n    const msg = e.name === 'AbortError' ? 'Cancelled.'\n      : (e.message.includes('Failed to fetch')\n        ? 'Could not reach the webhook. Check the URL, that the workflow is active, and that it allows requests from this page (CORS).'\n        : e.message);\n    msgs.push({ role:'error', text: msg, t:Date.now() });\n  }\n  busy = false; $('acSend').disabled = false;\n  render(); save();\n}\n\nfunction sessionId(){\n  let s = sessionStorage.getItem('aichat.sid');\n  if (!s){ s = 'tb-' + Math.random().toString(36).slice(2, 11); sessionStorage.setItem('aichat.sid', s); }\n  return s;\n}\n\nfunction openCfg(){\n  $('acUrl').value = cfg.url; $('acHdr').value = cfg.hdr;\n  $('acVal').value = cfg.val; $('acHist').value = cfg.hist;\n  $('acCfg').classList.add('on');\n}\n$('acCfgBtn').onclick = openCfg;\n$('acCfgNo').onclick = () => $('acCfg').classList.remove('on');\n$('acCfgOk').onclick = () => {\n  cfg = { url:$('acUrl').value.trim(), hdr:$('acHdr').value.trim(), val:$('acVal').value, hist:$('acHist').value };\n  localStorage.setItem(CFG, JSON.stringify(cfg));\n  $('acCfg').classList.remove('on');\n  setDot(); render(); toast('Settings saved');\n};\n$('acClear').onclick = async () => {\n  if (!msgs.length) return;\n  if (!await confirmDlg('Clear this conversation?', 'The message history on this device is erased.', 'Clear')) return;\n  msgs = []; save(); render();\n};\n$('acSend').onclick = send;\n$('acIn').addEventListener('keydown', e => {\n  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }\n});\n$('acIn').addEventListener('input', e => {\n  e.target.style.height = 'auto';\n  e.target.style.height = Math.min(e.target.scrollHeight, 150) + 'px';\n});\n\nsetDot(); render();\nonToolExit(() => { if (ctrl) ctrl.abort(); });"

      "html": "<div id=\"ms\">\n<style>\n  #ms{padding:26px 20px calc(60px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #ms .wrap{width:100%;max-width:760px}\n  #ms h2{margin:0 0 4px;font-size:26px;font-weight:700;letter-spacing:-.022em}\n  #ms .lede{margin:0 0 22px;font-size:14.5px;color:#6E6E76;letter-spacing:-.01em}\n  #ms .card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #ms .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:0 0 12px}\n  #ms label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:0 0 5px}\n  #ms input,#ms select,#ms textarea{\n    width:100%;padding:10px 12px;border:1px solid rgba(60,60,67,.16);border-radius:11px;\n    background:#fff;font:inherit;font-size:16px;color:#111114\n  }\n  #ms input:focus,#ms select:focus,#ms textarea:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #ms textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;min-height:96px;resize:vertical}\n  @media (max-width:860px){#ms textarea{font-size:16px}}\n  #ms .grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}\n  #ms .btn{\n    padding:11px 18px;border:0;border-radius:12px;background:#0A84FF;color:#fff;\n    font-size:15px;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:transform .15s,opacity .15s\n  }\n  #ms .btn:active{transform:scale(.97)}\n  #ms .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #ms .btn.dark{background:#111114}\n  #ms .btn:disabled{opacity:.45;cursor:default}\n  #ms .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}\n  #ms .code{\n    display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n    font-size:30px;font-weight:600;letter-spacing:.14em;text-align:center;padding:20px;\n    border-radius:14px;background:#F2F2F7;cursor:pointer;margin:0 0 6px\n  }\n  #ms .codehint{text-align:center;font-size:12.5px;color:#A6A6AE;margin:0 0 12px}\n  #ms .status{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#6E6E76;margin-top:14px}\n  #ms .dot{width:8px;height:8px;border-radius:50%;background:#A6A6AE;flex:0 0 auto}\n  #ms .dot.ok{background:#30A46C} #ms .dot.err{background:#E5484D}\n  #ms .dot.wait{background:#F5A524;animation:mspulse 1.2s infinite}\n  @keyframes mspulse{50%{opacity:.3}}\n  #ms pre{\n    margin:0;padding:14px;border-radius:12px;background:#0E1116;color:#D6DEEB;overflow:auto;\n    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;max-height:460px\n  }\n  #ms .note{font-size:12.5px;color:#6E6E76;line-height:1.6;margin:12px 0 0}\n  #ms .note code{background:rgba(120,120,128,.14);padding:1px 5px;border-radius:5px;font-size:12px}\n  #ms .pill{display:inline-block;padding:3px 9px;border-radius:999px;background:rgba(120,120,128,.14);font-size:11.5px;font-weight:600;margin-left:8px;vertical-align:middle}\n  #ms details{margin-top:12px} #ms summary{cursor:pointer;font-size:13.5px;color:#0A84FF;font-weight:560}\n  #ms .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}\n  #ms .presets button{padding:6px 11px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:12.5px;cursor:pointer;color:#6E6E76}\n  #ms .presets button:hover{border-color:#0A84FF;color:#0A84FF}\n  #ms .hide{display:none}\n  @media (max-width:640px){#ms .grid{grid-template-columns:1fr}}\n</style>\n  <div class=\"wrap\">\n    <h2>Microsoft 365 Admin</h2>\n    <p class=\"lede\">Sign in with your own account &mdash; no app registration. A device code is copied for you and a sign-in tab opens; once you finish, the session is connected to your tenant.</p>\n\n    <div class=\"card\">\n      <p class=\"cap\">Session <span class=\"pill\" id=\"msWho\">not signed in</span></p>\n      <div class=\"btns\" style=\"margin-top:0\">\n        <button class=\"btn\" id=\"msStart\">Sign in</button>\n        <button class=\"btn ghost hide\" id=\"msOut\">Sign out</button>\n      </div>\n\n      <div id=\"msCodeBox\" class=\"hide\" style=\"margin-top:16px\">\n        <code class=\"code\" id=\"msCode\"></code>\n        <p class=\"codehint\">Copied to your clipboard &middot; tap to copy again</p>\n        <div class=\"btns\" style=\"margin-top:0\">\n          <button class=\"btn dark\" id=\"msOpen\">Open sign-in page</button>\n        </div>\n      </div>\n\n      <div class=\"status\"><span class=\"dot\" id=\"msDot\"></span><span id=\"msStatus\">Not connected</span></div>\n\n      <details>\n        <summary>If sign-in gets blocked</summary>\n        <p class=\"note\">\n          Browsers refuse the sign-in request unless the page is served with permission to reach\n          <code>login.microsoftonline.com</code> (a CORS limit &mdash; opening the file straight from disk\n          triggers it). Two ways around it:<br><br>\n          &bull; Put a proxy prefix that adds CORS headers here, and sign-in works as designed:\n        </p>\n        <div style=\"margin-top:8px\"><label for=\"msProxy\">CORS proxy prefix</label><input id=\"msProxy\" placeholder=\"https://your-proxy.example.com/\" spellcheck=\"false\"></div>\n        <p class=\"note\">&bull; Or skip sign-in and paste a token from <b>Graph Explorer</b> &mdash; requests below work unchanged:</p>\n        <div class=\"btns\"><button class=\"btn ghost\" id=\"msManual\">Paste a token instead</button></div>\n        <p class=\"note\" style=\"margin-top:14px\"><b>Advanced.</b> Override the tenant (default <code>common</code>) if you need to pin sign-in to one directory:</p>\n        <div style=\"margin-top:6px\"><label for=\"msTenant\">Tenant</label><input id=\"msTenant\" value=\"common\" spellcheck=\"false\"></div>\n      </details>\n    </div>\n\n    <div class=\"card\">\n      <p class=\"cap\">Request</p>\n      <div class=\"grid\" style=\"grid-template-columns:120px 1fr\">\n        <div><label for=\"msMethod\">Method</label>\n          <select id=\"msMethod\"><option>GET</option><option>POST</option><option>PATCH</option><option>DELETE</option></select>\n        </div>\n        <div><label for=\"msPath\">Path</label><input id=\"msPath\" value=\"/me\" spellcheck=\"false\"></div>\n      </div>\n      <div class=\"presets\" id=\"msPresets\">\n        <button data-m=\"GET\" data-p=\"/me\">My profile</button>\n        <button data-m=\"GET\" data-p=\"/organization\">Tenant</button>\n        <button data-m=\"GET\" data-p=\"/users?$top=25&amp;$select=id,displayName,userPrincipalName,accountEnabled\">Users</button>\n        <button data-m=\"GET\" data-p=\"/groups?$top=25&amp;$select=id,displayName,mail\">Groups</button>\n        <button data-m=\"GET\" data-p=\"/subscribedSkus\">Licences</button>\n        <button data-m=\"GET\" data-p=\"/auditLogs/signIns?$top=10\">Sign-in logs</button>\n        <button data-m=\"POST\" data-p=\"/users\">Create user</button>\n      </div>\n      <div id=\"msBodyBox\" class=\"hide\" style=\"margin-top:14px\">\n        <label for=\"msBody\">Request body (JSON)</label>\n        <textarea id=\"msBody\" spellcheck=\"false\"></textarea>\n      </div>\n      <div class=\"btns\"><button class=\"btn\" id=\"msSend\">Send request</button><button class=\"btn ghost\" id=\"msCopyRes\">Copy response</button></div>\n    </div>\n\n    <div class=\"card\"><p class=\"cap\">Response</p><pre id=\"msRes\">Nothing sent yet.</pre></div>\n  </div>\n</div>",
      "js": "// A public first-party client ID (Microsoft Graph PowerShell). It ships with\n// device-code support and broad delegated Graph scopes, so no app registration\n// is needed \\u2014 you just sign in as yourself.\nconst CLIENT_ID = '14d82eec-204b-4c2f-b7e8-296a70dab67e';\nconst SCOPE = 'https://graph.microsoft.com/.default offline_access openid profile';\nconst GRAPH = 'https://graph.microsoft.com/v1.0';\nconst $ = id => document.getElementById(id);\nlet token = sessionStorage.getItem('ms.token') || '';\nlet polling = null;\n\n$('msProxy').value  = localStorage.getItem('ms.proxy')  || '';\n$('msTenant').value = localStorage.getItem('ms.tenant') || 'common';\n\nfunction setStatus(text, kind){\n  $('msStatus').textContent = text;\n  $('msDot').className = 'dot' + (kind ? ' ' + kind : '');\n}\nfunction authBase(){\n  const proxy = $('msProxy').value.trim();\n  return proxy + 'https://login.microsoftonline.com/' + ($('msTenant').value.trim() || 'common') + '/oauth2/v2.0';\n}\nfunction connected(yes, who){\n  $('msWho').textContent = yes ? (who || 'signed in') : 'not signed in';\n  $('msOut').classList.toggle('hide', !yes);\n}\n\nasync function whoAmI(){\n  try {\n    const r = await fetch(GRAPH + '/me', { headers:{ Authorization:'Bearer ' + token } });\n    const j = await r.json();\n    if (r.ok){ connected(true, j.userPrincipalName || j.displayName); setStatus('Connected', 'ok'); }\n    else { connected(true, 'token set'); setStatus('Token present, /me returned ' + r.status, 'err'); }\n  } catch { connected(true, 'token set'); setStatus('Token present', 'ok'); }\n}\nif (token) whoAmI();\n\n$('msStart').onclick = async () => {\n  localStorage.setItem('ms.proxy', $('msProxy').value.trim());\n  localStorage.setItem('ms.tenant', $('msTenant').value.trim());\n\n  // Open the sign-in tab now, inside the click, so the browser allows the popup.\n  const tab = window.open('about:blank', '_blank');\n  setStatus('Requesting a device code\\u2026', 'wait');\n\n  let data;\n  try {\n    const r = await fetch(authBase() + '/devicecode', {\n      method:'POST',\n      headers:{ 'Content-Type':'application/x-www-form-urlencoded' },\n      body: new URLSearchParams({ client_id: CLIENT_ID, scope: SCOPE })\n    });\n    data = await r.json();\n    if (!r.ok) throw new Error(data.error_description || r.status);\n  } catch (e) {\n    if (tab) tab.close();\n    setStatus('The browser blocked the sign-in request \\u2014 see \"If sign-in gets blocked\"', 'err');\n    $('msRes').textContent = String(e) +\n      '\\n\\nThis is the browser stopping a cross-origin call to login.microsoftonline.com (CORS).\\n' +\n      'Add a proxy prefix, or use \"Paste a token instead\".';\n    return;\n  }\n\n  const url = data.verification_uri || 'https://microsoft.com/devicelogin';\n  // Copy the code, then send the already-open tab to the sign-in page.\n  try { await navigator.clipboard.writeText(data.user_code); toast('Code copied \\u2014 paste it in the new tab'); }\n  catch { toast('Copy the code shown, then sign in'); }\n  if (tab) tab.location = url; else window.open(url, '_blank', 'noopener');\n\n  $('msCode').textContent = data.user_code;\n  $('msCodeBox').classList.remove('hide');\n  $('msCode').onclick = () => { navigator.clipboard.writeText(data.user_code); toast('Code copied'); };\n  $('msOpen').onclick = () => window.open(url, '_blank', 'noopener');\n  setStatus('Waiting for you to finish signing in\\u2026', 'wait');\n\n  const deadline = Date.now() + (data.expires_in || 900) * 1000;\n  clearInterval(polling);\n  polling = setInterval(async () => {\n    if (Date.now() > deadline){ clearInterval(polling); setStatus('Device code expired \\u2014 sign in again', 'err'); return; }\n    try {\n      const r = await fetch(authBase() + '/token', {\n        method:'POST',\n        headers:{ 'Content-Type':'application/x-www-form-urlencoded' },\n        body: new URLSearchParams({\n          grant_type:'urn:ietf:params:oauth:grant-type:device_code',\n          client_id: CLIENT_ID, device_code: data.device_code\n        })\n      });\n      const j = await r.json();\n      if (j.access_token){\n        clearInterval(polling);\n        token = j.access_token;\n        sessionStorage.setItem('ms.token', token);\n        $('msCodeBox').classList.add('hide');\n        toast('Signed in');\n        whoAmI();\n      } else if (j.error && j.error !== 'authorization_pending' && j.error !== 'slow_down'){\n        clearInterval(polling);\n        setStatus(j.error_description || j.error, 'err');\n      }\n    } catch { /* keep polling through transient failures */ }\n  }, (data.interval || 5) * 1000);\n};\n\n$('msManual').onclick = async () => {\n  const t = await ask('Access token', 'Paste a bearer token for https://graph.microsoft.com', '', true);\n  if (!t || !t.trim()) return;\n  token = t.trim();\n  sessionStorage.setItem('ms.token', token);\n  whoAmI();\n};\n$('msOut').onclick = () => {\n  token = ''; sessionStorage.removeItem('ms.token');\n  connected(false); setStatus('Not connected'); toast('Signed out');\n};\n\n$('msMethod').onchange = () => {\n  $('msBodyBox').classList.toggle('hide', $('msMethod').value === 'GET' || $('msMethod').value === 'DELETE');\n};\n$('msPresets').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  $('msMethod').value = b.dataset.m;\n  $('msPath').value = b.dataset.p;\n  $('msMethod').onchange();\n  if (b.dataset.m === 'POST' && b.dataset.p === '/users'){\n    $('msBody').value = JSON.stringify({\n      accountEnabled:true, displayName:'Ada Lovelace', mailNickname:'ada',\n      userPrincipalName:'ada@yourtenant.onmicrosoft.com',\n      passwordProfile:{ forceChangePasswordNextSignIn:true, password:'ChangeThis!2026' }\n    }, null, 2);\n  }\n};\n\n$('msSend').onclick = async () => {\n  if (!token){ toast('Sign in first'); return; }\n  const method = $('msMethod').value;\n  const path = $('msPath').value.trim();\n  const opts = { method, headers:{ Authorization:'Bearer ' + token } };\n  if (method !== 'GET' && method !== 'DELETE'){\n    opts.headers['Content-Type'] = 'application/json';\n    opts.body = $('msBody').value;\n  }\n  $('msRes').textContent = 'Sending\\u2026';\n  try {\n    const r = await fetch(GRAPH + (path.startsWith('/') ? path : '/' + path), opts);\n    const text = await r.text();\n    let out;\n    try { out = JSON.stringify(JSON.parse(text), null, 2); } catch { out = text || '(empty response)'; }\n    $('msRes').textContent = r.status + ' ' + r.statusText + '\\n\\n' + out;\n  } catch (e) {\n    $('msRes').textContent = 'Request failed: ' + e;\n  }\n};\n$('msCopyRes').onclick = () => { navigator.clipboard.writeText($('msRes').textContent); toast('Response copied'); };\n\nonToolExit(() => clearInterval(polling));"
    }

      "html": "<div id=\"sl\">\n<style>\n  #sl{position:absolute;inset:0;background:#F2F2F7;overflow:hidden}\n  #sl .scroll{position:absolute;inset:0;overflow-y:auto;padding:22px 18px calc(40px + env(safe-area-inset-bottom,0px))}\n  #sl .wrap{max-width:600px;margin:0 auto}\n  #sl h2{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #sl .sub{margin:0 0 18px;font-size:13.5px;color:#6E6E76}\n  #sl .btn{padding:11px 15px;border:0;border-radius:12px;background:#0A84FF;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .15s}\n  #sl .btn:active{transform:scale(.97)}\n  #sl .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #sl .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}\n  #sl .btn.wide{width:100%;height:52px;font-size:16px;border-radius:15px}\n  #sl .btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}\n  #sl .prog{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}\n  #sl .prog .t{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px}\n  #sl .prog .t b{font-variant-numeric:tabular-nums}\n  #sl .prog .tr{height:7px;border-radius:4px;background:rgba(120,120,128,.14);overflow:hidden}\n  #sl .prog .fl{height:100%;background:#30A46C;border-radius:4px;transition:width .3s}\n  #sl .cat{margin-bottom:18px}\n  #sl .cat h3{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;display:flex;justify-content:space-between}\n  #sl .it{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:12px;margin-bottom:6px;cursor:pointer}\n  #sl .it .cb{width:22px;height:22px;flex:0 0 auto;border:1.8px solid #C3C3C9;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}\n  #sl .it.done .cb{background:#30A46C;border-color:#30A46C}\n  #sl .it .n{flex:1;font-size:15px}\n  #sl .it.done .n{color:#A6A6AE;text-decoration:line-through}\n  #sl .it .q{font-size:12.5px;color:#A6A6AE}\n  #sl .empty{text-align:center;color:#A6A6AE;font-size:14px;padding:46px 20px;line-height:1.7}\n  /* editor */\n  #sl .ed{position:absolute;inset:0;background:#F2F2F7;overflow-y:auto;display:none;z-index:5}\n  #sl .ed.on{display:block}\n  #sl .ed .inner{max-width:600px;margin:0 auto;padding:22px 18px calc(40px + env(safe-area-inset-bottom,0px))}\n  #sl .row{display:flex;gap:8px;margin-bottom:10px}\n  #sl input,#sl select{flex:1;min-width:0;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:#111114}\n  #sl input:focus,#sl select:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #sl .row .cat-in{flex:0 0 40%}\n  #sl .eit{display:flex;align-items:center;gap:10px;padding:10px 13px;background:#fff;border-radius:11px;margin-bottom:6px}\n  #sl .eit .n{flex:1;font-size:14.5px}\n  #sl .eit .x{border:0;background:none;color:#C3C3C9;font-size:19px;cursor:pointer;padding:0 2px}\n  #sl .eit .x:hover{color:#E5484D}\n  /* generator */\n  #sl .gen{position:absolute;inset:0;background:#111114;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;z-index:7}\n  #sl .gen.on{display:flex}\n  #sl .gen .ct{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}\n  #sl .gen .cn{font-size:13.5px;color:#5AA9FF;margin-top:10px;font-weight:600}\n  #sl .gen .nm{font-size:38px;font-weight:700;color:#fff;letter-spacing:-.025em;margin:12px 0 40px;line-height:1.2;text-align:center;max-width:92%;word-break:break-word}\n  #sl .gen .pick{display:flex;gap:26px}\n  #sl .gen .pick button{width:96px;height:96px;border:0;border-radius:50%;font-size:42px;cursor:pointer;transition:transform .15s;display:flex;align-items:center;justify-content:center}\n  #sl .gen .pick button:active{transform:scale(.9)}\n  #sl .gen .no{background:rgba(229,72,77,.9);color:#fff}\n  #sl .gen .yes{background:#30A46C;color:#fff}\n  #sl .gen .bar{position:absolute;top:0;left:0;height:4px;background:#5AA9FF;transition:width .25s}\n  #sl .gen .skip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));border:0;background:none;color:rgba(255,255,255,.45);font-size:14px;cursor:pointer;text-decoration:underline}\n  #sl .gen .back{position:absolute;top:18px;left:18px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 13px;font-size:13px;cursor:pointer}\n</style>\n  <div class=\"scroll\"><div class=\"wrap\">\n    <h2>Shopping List</h2>\n    <p class=\"sub\" id=\"slSub\"></p>\n    <div class=\"btns\">\n      <button class=\"btn\" id=\"slGen\">Generate list</button>\n      <button class=\"btn ghost\" id=\"slEdit\">Edit items</button>\n      <button class=\"btn ghost\" id=\"slUncheck\">Uncheck all</button>\n    </div>\n    <div id=\"slProg\"></div>\n    <div id=\"slList\"></div>\n  </div></div>\n\n  <div class=\"ed\" id=\"slEd\"><div class=\"inner\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:16px\">\n      <h2 style=\"margin:0;font-size:22px\">Edit items</h2>\n      <button class=\"btn ghost sm\" id=\"slEdDone\">Done</button>\n    </div>\n    <p class=\"sub\" style=\"margin-bottom:14px\">Your master list. Generating a shopping list walks through these one at a time.</p>\n    <div class=\"row\">\n      <input id=\"slNewCat\" class=\"cat-in\" list=\"slCatList\" placeholder=\"Category\" autocomplete=\"off\">\n      <datalist id=\"slCatList\"></datalist>\n      <input id=\"slNewItem\" placeholder=\"Item name\" autocomplete=\"off\">\n      <button class=\"btn\" id=\"slAdd\" style=\"flex:0 0 auto\">Add</button>\n    </div>\n    <div id=\"slEdList\"></div>\n    <div class=\"btns\" style=\"margin-top:18px\">\n      <button class=\"btn ghost sm\" id=\"slSeed\">Add starter items</button>\n      <button class=\"btn ghost sm\" id=\"slClearAll\">Clear all items</button>\n    </div>\n  </div></div>\n\n  <div class=\"gen\" id=\"slGenView\">\n    <div class=\"bar\" id=\"slBar\"></div>\n    <button class=\"back\" id=\"slGenBack\">&larr; Cancel</button>\n    <div class=\"ct\" id=\"slGenCount\"></div>\n    <div class=\"cn\" id=\"slGenCat\"></div>\n    <div class=\"nm\" id=\"slGenName\"></div>\n    <div class=\"pick\">\n      <button class=\"no\" id=\"slNo\">&#10007;</button>\n      <button class=\"yes\" id=\"slYes\">&#10003;</button>\n    </div>\n    <button class=\"skip\" id=\"slFinish\">Finish early</button>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst IKEY = 'shopping.items.v1', LKEY = 'shopping.list.v1';\nlet items = [], list = [];\nlet gi = 0, gPicked = [];\n\ntry { items = JSON.parse(localStorage.getItem(IKEY)) || []; } catch {}\ntry { list = JSON.parse(localStorage.getItem(LKEY)) || []; } catch {}\nconst saveItems = () => localStorage.setItem(IKEY, JSON.stringify(items));\nconst saveList = () => localStorage.setItem(LKEY, JSON.stringify(list));\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nconst uid = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);\n\nconst STARTER = [\n  ['Fruit & Veg','Bananas'],['Fruit & Veg','Apples'],['Fruit & Veg','Onions'],['Fruit & Veg','Potatoes'],['Fruit & Veg','Salad'],\n  ['Dairy','Milk'],['Dairy','Butter'],['Dairy','Cheese'],['Dairy','Eggs'],['Dairy','Yoghurt'],\n  ['Meat & Fish','Chicken breasts'],['Meat & Fish','Beef mince'],['Meat & Fish','Bacon'],['Meat & Fish','Salmon fillets'],\n  ['Bakery','Bread'],['Bakery','Wraps'],['Bakery','Crumpets'],\n  ['Cupboard','Pasta'],['Cupboard','Rice'],['Cupboard','Chopped tomatoes'],['Cupboard','Olive oil'],['Cupboard','Cereal'],['Cupboard','Coffee'],['Cupboard','Tea bags'],\n  ['Frozen','Peas'],['Frozen','Chips'],['Frozen','Ice cream'],\n  ['Household','Washing-up liquid'],['Household','Kitchen roll'],['Household','Bin bags'],['Household','Toilet roll'],\n  ['Toiletries','Shampoo'],['Toiletries','Toothpaste'],['Toiletries','Deodorant']\n];\n\n/* ---------- grouping ---------- */\nfunction grouped(arr){\n  const g = {};\n  arr.forEach(it => (g[it.cat || 'Other'] = g[it.cat || 'Other'] || []).push(it));\n  return Object.keys(g).sort().map(k => [k, g[k]]);\n}\n\n/* ---------- main list ---------- */\nfunction render(){\n  $('slSub').textContent = list.length\n    ? list.filter(i => i.done).length + ' of ' + list.length + ' picked up'\n    : items.length + ' item' + (items.length === 1 ? '' : 's') + ' in your master list';\n\n  if (list.length){\n    const done = list.filter(i => i.done).length;\n    $('slProg').innerHTML = '<div class=\"prog\"><div class=\"t\"><span>Progress</span><b>' + done + ' / ' + list.length +\n      '</b></div><div class=\"tr\"><div class=\"fl\" style=\"width:' + (done / list.length * 100) + '%\"></div></div></div>';\n  } else $('slProg').innerHTML = '';\n\n  $('slList').innerHTML = list.length\n    ? grouped(list).map(([cat, arr]) =>\n        '<div class=\"cat\"><h3><span>' + esc(cat) + '</span><span>' + arr.filter(i => i.done).length + '/' + arr.length + '</span></h3>' +\n        arr.map(it => '<div class=\"it' + (it.done ? ' done' : '') + '\" data-id=\"' + it.id + '\">' +\n          '<span class=\"cb\">✓</span><span class=\"n\">' + esc(it.name) + '</span>' +\n          (it.qty ? '<span class=\"q\">' + esc(it.qty) + '</span>' : '') + '</div>').join('') +\n        '</div>').join('')\n    : '<div class=\"empty\">' + (items.length\n        ? 'No list yet.<br>Tap <b>Generate list</b> to build one from your items.'\n        : 'Nothing here yet.<br>Tap <b>Edit items</b> to add what you usually buy.') + '</div>';\n\n  $('slList').querySelectorAll('.it').forEach(el => el.onclick = () => {\n    const it = list.find(i => i.id === el.dataset.id);\n    it.done = !it.done; saveList(); render();\n  });\n}\n\n$('slUncheck').onclick = () => { list.forEach(i => i.done = false); saveList(); render(); };\n\n/* ---------- item editor ---------- */\nfunction renderEd(){\n  const cats = [...new Set(items.map(i => i.cat || 'Other'))].sort();\n  $('slCatList').innerHTML = cats.map(c => '<option value=\"' + esc(c) + '\">').join('');\n  $('slEdList').innerHTML = items.length\n    ? grouped(items).map(([cat, arr]) =>\n        '<div class=\"cat\"><h3><span>' + esc(cat) + '</span><span>' + arr.length + '</span></h3>' +\n        arr.map(it => '<div class=\"eit\" data-id=\"' + it.id + '\">' +\n          '<span class=\"n\">' + esc(it.name) + '</span><button class=\"x\">&times;</button></div>').join('') +\n        '</div>').join('')\n    : '<div class=\"empty\">No items yet.<br>Add some above, or tap <b>Add starter items</b>.</div>';\n\n  $('slEdList').querySelectorAll('.eit').forEach(el => {\n    const it = items.find(i => i.id === el.dataset.id);\n    el.querySelector('.x').onclick = () => { items = items.filter(i => i.id !== it.id); saveItems(); renderEd(); };\n    el.querySelector('.n').onclick = async () => {\n      const n = await ask('Rename item', 'Item name', it.name);\n      if (n && n.trim()){ it.name = n.trim(); saveItems(); renderEd(); }\n    };\n  });\n}\n$('slEdit').onclick = () => { renderEd(); $('slEd').classList.add('on'); };\n$('slEdDone').onclick = () => { $('slEd').classList.remove('on'); render(); };\n$('slAdd').onclick = () => {\n  const name = $('slNewItem').value.trim();\n  const cat = $('slNewCat').value.trim() || 'Other';\n  if (!name) return toast('Enter an item name');\n  if (items.some(i => i.name.toLowerCase() === name.toLowerCase() && (i.cat || 'Other') === cat))\n    return toast('Already in the list');\n  items.push({ id:uid(), name, cat });\n  saveItems(); renderEd();\n  $('slNewItem').value = ''; $('slNewItem').focus();\n};\n$('slNewItem').addEventListener('keydown', e => { if (e.key === 'Enter') $('slAdd').click(); });\n$('slSeed').onclick = () => {\n  let n = 0;\n  STARTER.forEach(([cat, name]) => {\n    if (!items.some(i => i.name.toLowerCase() === name.toLowerCase())){\n      items.push({ id:uid(), name, cat }); n++;\n    }\n  });\n  saveItems(); renderEd(); toast(n + ' items added');\n};\n$('slClearAll').onclick = async () => {\n  if (!items.length) return;\n  if (!await confirmDlg('Clear every item?', 'Your master list is emptied. The current shopping list is left alone.', 'Clear')) return;\n  items = []; saveItems(); renderEd();\n};\n\n/* ---------- generator ---------- */\n$('slGen').onclick = async () => {\n  if (!items.length){ toast('Add some items first'); $('slEdit').click(); return; }\n  if (list.length && !await confirmDlg('Start a new list?', 'The current shopping list is cleared and rebuilt from your items.', 'Start over')) return;\n  gi = 0; gPicked = [];\n  $('slGenView').classList.add('on');\n  step();\n};\nfunction ordered(){\n  // walk category by category so the run feels organised\n  return grouped(items).flatMap(([, arr]) => arr);\n}\nlet seq = [];\nfunction step(){\n  if (!seq.length || gi === 0) seq = ordered();\n  if (gi >= seq.length) return finish();\n  const it = seq[gi];\n  $('slGenCount').textContent = 'Item ' + (gi + 1) + ' of ' + seq.length;\n  $('slGenCat').textContent = it.cat || 'Other';\n  $('slGenName').textContent = it.name;\n  $('slBar').style.width = (gi / seq.length * 100) + '%';\n}\nfunction pick(yes){\n  const it = seq[gi];\n  if (yes) gPicked.push({ id:uid(), name:it.name, cat:it.cat || 'Other', done:false });\n  gi++;\n  step();\n}\nfunction finish(){\n  list = gPicked;\n  saveList();\n  $('slGenView').classList.remove('on');\n  render();\n  toast(list.length ? list.length + ' item' + (list.length === 1 ? '' : 's') + ' on your list' : 'Empty list \\u2014 nothing selected');\n}\n$('slYes').onclick = () => pick(true);\n$('slNo').onclick = () => pick(false);\n$('slFinish').onclick = finish;\n$('slGenBack').onclick = () => $('slGenView').classList.remove('on');\n\nrender();"

      "html": "<div id=\"ex\">\n<style>\n  #ex{position:absolute;inset:0;background:#F2F2F7;overflow-y:auto}\n  #ex .wrap{max-width:640px;margin:0 auto;padding:22px 18px calc(40px + env(safe-area-inset-bottom,0px))}\n  #ex h2{margin:0 0 14px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #ex .mo{display:flex;align-items:center;justify-content:space-between;background:#111114;color:#fff;border-radius:18px;padding:18px 20px;margin-bottom:14px}\n  #ex .mo .nav{border:0;background:rgba(255,255,255,.14);color:#fff;width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer}\n  #ex .mo .mid{text-align:center;flex:1}\n  #ex .mo .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}\n  #ex .mo .amt{font-size:31px;font-weight:600;margin-top:4px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}\n  #ex .mo .m{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:3px}\n  #ex .sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:16px}\n  #ex .sum .s{background:#fff;border-radius:13px;padding:12px 10px;text-align:center;box-shadow:0 1px 2px rgba(16,24,40,.05)}\n  #ex .sum .s .l{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#A6A6AE}\n  #ex .sum .s .v{font-size:17px;font-weight:640;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}\n  #ex .bars{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #ex .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:0 0 14px}\n  #ex .bar{margin-bottom:11px}\n  #ex .bar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}\n  #ex .bar .t b{font-variant-numeric:tabular-nums}\n  #ex .bar .tr{height:7px;border-radius:4px;background:rgba(120,120,128,.14);overflow:hidden}\n  #ex .bar .fl{height:100%;border-radius:4px;transition:width .3s}\n  #ex .e{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:13px;margin-bottom:7px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05)}\n  #ex .e .ic{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px}\n  #ex .e .tx{flex:1;min-width:0}\n  #ex .e .n{font-size:14.5px;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  #ex .e .d{font-size:12px;color:#A6A6AE;margin-top:1px}\n  #ex .e .a{flex:0 0 auto;font-size:15px;font-weight:640;font-variant-numeric:tabular-nums;letter-spacing:-.01em}\n  #ex .e .a.in{color:#12805C}\n  #ex .empty{text-align:center;color:#A6A6AE;font-size:14px;padding:36px 20px;line-height:1.7}\n  #ex .add{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border:0;border-radius:50%;background:#0A84FF;color:#fff;font-size:27px;cursor:pointer;box-shadow:0 6px 20px rgba(10,132,255,.4);z-index:3}\n  #ex .add:active{transform:scale(.93)}\n  #ex .btn{padding:10px 14px;border:0;border-radius:11px;background:rgba(120,120,128,.12);color:#111114;font-size:13.5px;font-weight:560;cursor:pointer}\n  #ex .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}\n  #ex .sheet{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:6}\n  #ex .sheet.on{display:flex}\n  #ex .sheet .box{background:#F2F2F7;width:100%;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}\n  #ex .sheet h3{margin:0 0 4px;font-size:20px;font-weight:700}\n  #ex label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:14px 0 6px}\n  #ex input,#ex select{width:100%;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:#111114}\n  #ex input:focus,#ex select:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #ex .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n  #ex .cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}\n  #ex .cats button{padding:8px 13px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:13px;cursor:pointer;color:#6E6E76}\n  #ex .cats button.on{background:#111114;border-color:#111114;color:#fff}\n  #ex .sbtn{display:flex;gap:8px;margin-top:20px}\n  #ex .sbtn button{flex:1;height:48px;border:0;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer}\n  #ex .sbtn .ok{background:#0A84FF;color:#fff} #ex .sbtn .no{background:rgba(120,120,128,.14);color:#111114}\n  #ex .sbtn .del{background:rgba(229,72,77,.14);color:#B8390E;flex:0 0 88px}\n</style>\n  <div class=\"wrap\">\n    <h2>Expense Tracker</h2>\n    <div class=\"mo\">\n      <button class=\"nav\" id=\"exPrev\">&#8249;</button>\n      <div class=\"mid\"><div class=\"lbl\">Spent</div><div class=\"amt\" id=\"exTotal\">0.00</div><div class=\"m\" id=\"exMonth\"></div></div>\n      <button class=\"nav\" id=\"exNext\">&#8250;</button>\n    </div>\n    <div class=\"sum\">\n      <div class=\"s\"><div class=\"l\">Income</div><div class=\"v\" id=\"exIn\">0</div></div>\n      <div class=\"s\"><div class=\"l\">Net</div><div class=\"v\" id=\"exNet\">0</div></div>\n      <div class=\"s\"><div class=\"l\">Per day</div><div class=\"v\" id=\"exDay\">0</div></div>\n    </div>\n    <div class=\"bars\" id=\"exBars\"></div>\n    <div class=\"cap\">Transactions</div>\n    <div id=\"exList\"></div>\n    <div class=\"btns\">\n      <button class=\"btn\" id=\"exCsv\">Export CSV</button>\n      <button class=\"btn\" id=\"exBudget\">Set budget</button>\n    </div>\n  </div>\n  <button class=\"add\" id=\"exAdd\">+</button>\n\n  <div class=\"sheet\" id=\"exSheet\"><div class=\"box\">\n    <h3 id=\"exSheetT\">New transaction</h3>\n    <div class=\"r2\">\n      <div><label for=\"exAmt\">Amount</label><input id=\"exAmt\" type=\"number\" step=\"0.01\" inputmode=\"decimal\" placeholder=\"0.00\"></div>\n      <div><label for=\"exDate\">Date</label><input id=\"exDate\" type=\"date\"></div>\n    </div>\n    <label for=\"exDesc\">Description</label><input id=\"exDesc\" placeholder=\"Tesco food shop\">\n    <label>Category</label><div class=\"cats\" id=\"exCats\"></div>\n    <div class=\"r2\">\n      <div><label for=\"exType\">Type</label><select id=\"exType\"><option value=\"out\">Expense</option><option value=\"in\">Income</option></select></div>\n      <div><label for=\"exRep\">Repeats</label><select id=\"exRep\"><option value=\"\">One-off</option><option value=\"monthly\">Monthly</option><option value=\"weekly\">Weekly</option></select></div>\n    </div>\n    <div class=\"sbtn\">\n      <button class=\"no\" id=\"exCancel\">Cancel</button>\n      <button class=\"del\" id=\"exDel\" style=\"display:none\">Delete</button>\n      <button class=\"ok\" id=\"exSave\">Save</button>\n    </div>\n  </div></div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst KEY = 'expenses.v1', SET = 'expenses.settings.v1';\nconst CATS = [\n  ['Groceries','🛒','#30A46C'], ['Eating out','🍽','#F5A524'], ['Transport','🚗','#0A84FF'],\n  ['Bills','🏠','#8A2BE2'], ['Shopping','🛍','#C82F5A'], ['Health','💊','#0E7C90'],\n  ['Leisure','🎬','#E5484D'], ['Travel','✈️','#37C4C4'], ['Other','📦','#8E8E96']\n];\nlet all = [], settings = { currency:'£', budget:0 };\nlet cursor = new Date(); cursor.setDate(1);\nlet editing = null, pickedCat = 'Groceries';\n\ntry { all = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}\ntry { settings = Object.assign(settings, JSON.parse(localStorage.getItem(SET)) || {}); } catch {}\nconst save = () => localStorage.setItem(KEY, JSON.stringify(all));\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nconst uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);\nconst cur = n => settings.currency + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits:2, maximumFractionDigits:2 });\nconst catOf = n => CATS.find(c => c[0] === n) || CATS[CATS.length - 1];\nconst ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');\n\n/* Recurring entries are expanded on the fly rather than written to storage,\n   so changing the original updates every future occurrence. */\nfunction occurrences(month){\n  const out = [];\n  const mStart = new Date(month.getFullYear(), month.getMonth(), 1);\n  const mEnd = new Date(month.getFullYear(), month.getMonth() + 1, 0);\n  all.forEach(t => {\n    const d0 = new Date(t.date);\n    if (!t.repeat){\n      if (d0 >= mStart && d0 <= mEnd) out.push({ t, date:d0 });\n      return;\n    }\n    if (d0 > mEnd) return;\n    if (t.repeat === 'monthly'){\n      const d = new Date(month.getFullYear(), month.getMonth(), Math.min(d0.getDate(), mEnd.getDate()));\n      if (d >= d0 || ym(d) === ym(d0)) out.push({ t, date:d, virtual: ym(d) !== ym(d0) });\n    } else if (t.repeat === 'weekly'){\n      const d = new Date(d0);\n      while (d <= mEnd){\n        if (d >= mStart) out.push({ t, date:new Date(d), virtual: d.getTime() !== d0.getTime() });\n        d.setDate(d.getDate() + 7);\n      }\n    }\n  });\n  return out.sort((a, b) => b.date - a.date);\n}\n\nfunction render(){\n  const rows = occurrences(cursor);\n  const spent = rows.filter(r => r.t.type !== 'in').reduce((n, r) => n + r.t.amount, 0);\n  const income = rows.filter(r => r.t.type === 'in').reduce((n, r) => n + r.t.amount, 0);\n  const days = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();\n  const now = new Date();\n  const elapsed = (ym(now) === ym(cursor)) ? now.getDate() : days;\n\n  $('exTotal').textContent = cur(spent);\n  $('exMonth').textContent = cursor.toLocaleDateString(undefined, { month:'long', year:'numeric' }) +\n    (settings.budget ? '  ·  budget ' + cur(settings.budget) : '');\n  $('exIn').textContent = cur(income);\n  $('exNet').textContent = (income - spent >= 0 ? '' : '−') + cur(income - spent);\n  $('exNet').style.color = income - spent >= 0 ? '#12805C' : '#B8390E';\n  $('exDay').textContent = cur(spent / Math.max(elapsed, 1));\n\n  // category breakdown\n  const byCat = {};\n  rows.filter(r => r.t.type !== 'in').forEach(r => byCat[r.t.cat] = (byCat[r.t.cat] || 0) + r.t.amount);\n  const sorted = Object.entries(byCat).sort((a, b) => b[1] - a[1]);\n  const max = sorted.length ? sorted[0][1] : 1;\n  $('exBars').innerHTML = '<p class=\"cap\">By category</p>' + (sorted.length\n    ? sorted.map(([c, v]) => {\n        const [, , col] = catOf(c);\n        return '<div class=\"bar\"><div class=\"t\"><span>' + catOf(c)[1] + ' ' + esc(c) + '</span><b>' + cur(v) +\n          ' <span style=\"color:#A6A6AE;font-weight:400\">' + Math.round(v / spent * 100) + '%</span></b></div>' +\n          '<div class=\"tr\"><div class=\"fl\" style=\"width:' + (v / max * 100) + '%;background:' + col + '\"></div></div></div>';\n      }).join('')\n    : '<div class=\"empty\" style=\"padding:14px\">Nothing spent this month yet.</div>') +\n    (settings.budget ? '<div class=\"bar\" style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(60,60,67,.08)\">' +\n      '<div class=\"t\"><span>Budget used</span><b>' + Math.round(spent / settings.budget * 100) + '%</b></div>' +\n      '<div class=\"tr\"><div class=\"fl\" style=\"width:' + Math.min(100, spent / settings.budget * 100) + '%;background:' +\n      (spent > settings.budget ? '#E5484D' : spent > settings.budget * .8 ? '#F5A524' : '#30A46C') + '\"></div></div></div>' : '');\n\n  $('exList').innerHTML = rows.length ? rows.map(r => {\n    const [, ic, col] = catOf(r.t.cat);\n    return '<div class=\"e\" data-id=\"' + r.t.id + '\">' +\n      '<span class=\"ic\" style=\"background:' + col + '22\">' + ic + '</span>' +\n      '<span class=\"tx\"><span class=\"n\">' + esc(r.t.desc || r.t.cat) + '</span>' +\n      '<span class=\"d\">' + r.date.toLocaleDateString(undefined, { day:'numeric', month:'short' }) +\n        ' · ' + esc(r.t.cat) + (r.t.repeat ? ' · repeats' : '') + '</span></span>' +\n      '<span class=\"a' + (r.t.type === 'in' ? ' in' : '') + '\">' + (r.t.type === 'in' ? '+' : '−') + cur(r.t.amount) + '</span>' +\n    '</div>';\n  }).join('') : '<div class=\"empty\">No transactions this month.<br>Tap <b>+</b> to add one.</div>';\n\n  $('exList').querySelectorAll('.e').forEach(el =>\n    el.onclick = () => openSheet(all.find(t => t.id === el.dataset.id)));\n}\n\nfunction openSheet(t){\n  editing = t || null;\n  $('exSheetT').textContent = t ? 'Edit transaction' : 'New transaction';\n  $('exAmt').value = t ? t.amount : '';\n  $('exDate').value = t ? t.date : new Date().toISOString().slice(0, 10);\n  $('exDesc').value = t ? (t.desc || '') : '';\n  $('exType').value = t ? t.type : 'out';\n  $('exRep').value = t ? (t.repeat || '') : '';\n  pickedCat = t ? t.cat : 'Groceries';\n  $('exCats').innerHTML = CATS.map(([n, i]) =>\n    '<button data-c=\"' + n + '\" class=\"' + (n === pickedCat ? 'on' : '') + '\">' + i + ' ' + n + '</button>').join('');\n  $('exCats').querySelectorAll('button').forEach(b => b.onclick = () => {\n    pickedCat = b.dataset.c;\n    $('exCats').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));\n  });\n  $('exDel').style.display = t ? '' : 'none';\n  $('exSheet').classList.add('on');\n  if (!t) setTimeout(() => $('exAmt').focus(), 80);\n}\n$('exAdd').onclick = () => openSheet(null);\n$('exCancel').onclick = () => $('exSheet').classList.remove('on');\n$('exSave').onclick = () => {\n  const amount = Math.abs(parseFloat($('exAmt').value));\n  if (!amount || isNaN(amount)) return toast('Enter an amount');\n  const data = { amount, date:$('exDate').value, desc:$('exDesc').value.trim(),\n    cat:pickedCat, type:$('exType').value, repeat:$('exRep').value };\n  if (editing) Object.assign(editing, data);\n  else all.unshift(Object.assign({ id:uid() }, data));\n  save(); $('exSheet').classList.remove('on'); render(); toast('Saved');\n};\n$('exDel').onclick = async () => {\n  if (!editing) return;\n  if (!await confirmDlg('Delete this transaction?', 'It is removed from your records.', 'Delete')) return;\n  all = all.filter(t => t.id !== editing.id);\n  save(); $('exSheet').classList.remove('on'); render(); toast('Deleted');\n};\n$('exPrev').onclick = () => { cursor.setMonth(cursor.getMonth() - 1); render(); };\n$('exNext').onclick = () => { cursor.setMonth(cursor.getMonth() + 1); render(); };\n$('exBudget').onclick = async () => {\n  const v = await ask('Monthly budget', 'Amount in ' + settings.currency + ' (0 to turn it off)', String(settings.budget || ''));\n  if (v === null) return;\n  settings.budget = Math.max(0, parseFloat(v) || 0);\n  localStorage.setItem(SET, JSON.stringify(settings));\n  render(); toast(settings.budget ? 'Budget set' : 'Budget cleared');\n};\n$('exCsv').onclick = () => {\n  const rows = occurrences(cursor);\n  const csv = 'Date,Description,Category,Type,Amount\\n' + rows.map(r =>\n    [r.date.toISOString().slice(0, 10), '\"' + (r.t.desc || '').replace(/\"/g, '\"\"') + '\"',\n     r.t.cat, r.t.type === 'in' ? 'Income' : 'Expense', r.t.amount.toFixed(2)].join(',')).join('\\n');\n  const blob = new Blob([csv], { type:'text/csv' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = 'expenses-' + ym(cursor) + '.csv'; a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n};\n\nrender();"
    },

      "html": "<div id=\"rc\">\n<style>\n  #rc{position:absolute;inset:0;background:#F2F2F7;overflow-y:auto}\n  #rc .wrap{max-width:640px;margin:0 auto;padding:22px 18px calc(30px + env(safe-area-inset-bottom,0px))}\n  #rc .top{display:flex;gap:8px;align-items:center;margin-bottom:16px}\n  #rc .top input{flex:1;padding:11px 14px;border:1px solid rgba(60,60,67,.16);border-radius:13px;background:#fff;font:inherit;font-size:16px}\n  #rc .top input:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #rc .btn{padding:11px 15px;border:0;border-radius:12px;background:#0A84FF;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .15s}\n  #rc .btn:active{transform:scale(.97)}\n  #rc .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #rc .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}\n  #rc .tags{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;margin-bottom:4px;-webkit-overflow-scrolling:touch}\n  #rc .tags button{padding:6px 13px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:12.5px;font-weight:560;color:#6E6E76;cursor:pointer;white-space:nowrap}\n  #rc .tags button.on{background:#111114;border-color:#111114;color:#fff}\n  #rc .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}\n  #rc .rcard{background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4);transition:transform .15s}\n  #rc .rcard:active{transform:scale(.98)}\n  #rc .rcard .ph{height:96px;background:linear-gradient(135deg,#FFB84D,#EF5F3C);display:flex;align-items:center;justify-content:center;font-size:34px}\n  #rc .rcard .bd{padding:12px 13px}\n  #rc .rcard h3{margin:0 0 5px;font-size:15px;font-weight:640;letter-spacing:-.01em;line-height:1.3}\n  #rc .rcard .meta{font-size:11.5px;color:#A6A6AE;display:flex;gap:9px;flex-wrap:wrap}\n  #rc .empty{text-align:center;color:#A6A6AE;font-size:14px;padding:50px 20px;line-height:1.7}\n  /* detail */\n  #rc .view{position:absolute;inset:0;background:#fff;overflow-y:auto;display:none;z-index:4}\n  #rc .view.on{display:block}\n  #rc .view .hero{height:150px;background:linear-gradient(135deg,#FFB84D,#EF5F3C);display:flex;align-items:center;justify-content:center;font-size:56px;position:relative}\n  #rc .view .back{position:absolute;top:14px;left:14px;border:0;border-radius:11px;background:rgba(255,255,255,.9);padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;color:#111114}\n  #rc .view .inner{max-width:640px;margin:0 auto;padding:22px 18px calc(40px + env(safe-area-inset-bottom,0px))}\n  #rc .view h2{margin:0 0 8px;font-size:26px;font-weight:700;letter-spacing:-.022em;line-height:1.2}\n  #rc .view .vmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#6E6E76;margin-bottom:18px}\n  #rc .view .desc{font-size:14.5px;color:#3C3C43;line-height:1.6;margin-bottom:20px}\n  #rc .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:24px 0 12px;display:flex;justify-content:space-between;align-items:center}\n  #rc .serv{display:flex;align-items:center;gap:10px;background:rgba(120,120,128,.1);border-radius:11px;padding:4px}\n  #rc .serv button{width:28px;height:28px;border:0;border-radius:8px;background:#fff;font-size:16px;cursor:pointer;font-weight:600;color:#111114}\n  #rc .serv span{font-size:13px;font-weight:600;min-width:64px;text-align:center;text-transform:none;letter-spacing:0;color:#111114}\n  #rc .ing{display:flex;align-items:flex-start;gap:11px;padding:10px 2px;border-bottom:1px solid rgba(60,60,67,.07);cursor:pointer;font-size:15px;line-height:1.45}\n  #rc .ing:last-child{border-bottom:0}\n  #rc .ing .cb{width:21px;height:21px;flex:0 0 auto;border:1.8px solid #C3C3C9;border-radius:6px;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}\n  #rc .ing.done .cb{background:#30A46C;border-color:#30A46C}\n  #rc .ing.done .tx{color:#A6A6AE;text-decoration:line-through}\n  #rc .ing .amt{font-weight:640;color:#111114}\n  #rc .step{display:flex;gap:13px;padding:13px 2px;border-bottom:1px solid rgba(60,60,67,.07);cursor:pointer}\n  #rc .step:last-child{border-bottom:0}\n  #rc .step .n{flex:0 0 26px;height:26px;border-radius:50%;background:rgba(10,132,255,.12);color:#0A84FF;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}\n  #rc .step .tx{flex:1;font-size:15px;line-height:1.55;color:#1A1A1F}\n  #rc .step.done .n{background:#30A46C;color:#fff} #rc .step.done .tx{color:#A6A6AE}\n  #rc .notes{background:#FFF9E8;border-radius:12px;padding:14px;font-size:14px;line-height:1.6;color:#5C4A16}\n  #rc .vbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}\n  /* editor */\n  #rc .ed{position:absolute;inset:0;background:#F2F2F7;overflow-y:auto;display:none;z-index:5}\n  #rc .ed.on{display:block}\n  #rc .ed .inner{max-width:640px;margin:0 auto;padding:22px 18px calc(40px + env(safe-area-inset-bottom,0px))}\n  #rc .ed label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:16px 0 6px}\n  #rc .ed input,#rc .ed textarea,#rc .ed select{width:100%;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:#111114}\n  #rc .ed textarea{min-height:120px;resize:vertical;line-height:1.55}\n  #rc .ed input:focus,#rc .ed textarea:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #rc .ed .hint{font-size:12px;color:#A6A6AE;margin-top:5px;line-height:1.5}\n  #rc .ed .r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}\n  #rc .ed h2{margin:0;font-size:22px;font-weight:700}\n</style>\n  <div class=\"wrap\" id=\"rcHome\">\n    <div class=\"top\">\n      <input id=\"rcSearch\" placeholder=\"Search recipes, ingredients…\" spellcheck=\"false\">\n      <button class=\"btn\" id=\"rcNew\">New</button>\n    </div>\n    <div class=\"tags\" id=\"rcTags\"></div>\n    <div class=\"grid\" id=\"rcGrid\"></div>\n    <div style=\"display:flex;gap:8px;margin-top:22px;flex-wrap:wrap\">\n      <button class=\"btn ghost sm\" id=\"rcExport\">Export all</button>\n      <button class=\"btn ghost sm\" id=\"rcImport\">Import</button>\n    </div>\n  </div>\n\n  <div class=\"view\" id=\"rcView\">\n    <div class=\"hero\" id=\"rcHero\"><button class=\"back\" id=\"rcBack\">&larr; Back</button><span id=\"rcEmoji\">🍲</span></div>\n    <div class=\"inner\" id=\"rcViewBody\"></div>\n  </div>\n\n  <div class=\"ed\" id=\"rcEd\">\n    <div class=\"inner\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\">\n        <h2 id=\"rcEdTitle\">New recipe</h2>\n        <button class=\"btn ghost sm\" id=\"rcEdCancel\">Cancel</button>\n      </div>\n      <label for=\"rcT\">Title</label><input id=\"rcT\" placeholder=\"Spaghetti Bolognese\">\n      <label for=\"rcD\">Short description</label><input id=\"rcD\" placeholder=\"Rich, slow-cooked and freezer-friendly\">\n      <div class=\"r3\">\n        <div><label for=\"rcServ\">Serves</label><input id=\"rcServ\" type=\"number\" min=\"1\" value=\"4\" inputmode=\"numeric\"></div>\n        <div><label for=\"rcPrep\">Prep (min)</label><input id=\"rcPrep\" type=\"number\" min=\"0\" value=\"15\" inputmode=\"numeric\"></div>\n        <div><label for=\"rcCook\">Cook (min)</label><input id=\"rcCook\" type=\"number\" min=\"0\" value=\"30\" inputmode=\"numeric\"></div>\n      </div>\n      <label for=\"rcEmojiIn\">Icon &amp; tags</label>\n      <div class=\"r3\" style=\"grid-template-columns:80px 1fr\">\n        <input id=\"rcEmojiIn\" value=\"🍲\" maxlength=\"4\" style=\"text-align:center;font-size:20px\">\n        <input id=\"rcTagsIn\" placeholder=\"dinner, italian, quick\">\n      </div>\n      <label for=\"rcI\">Ingredients &mdash; one per line</label>\n      <textarea id=\"rcI\" spellcheck=\"false\" placeholder=\"500g beef mince&#10;2 onions, diced&#10;1 tbsp olive oil\"></textarea>\n      <p class=\"hint\">Start a line with a number and it scales automatically when servings change.</p>\n      <label for=\"rcS\">Method &mdash; one step per line</label>\n      <textarea id=\"rcS\" placeholder=\"Heat the oil in a large pan.&#10;Brown the mince, breaking it up as you go.\"></textarea>\n      <label for=\"rcN\">Notes (optional)</label>\n      <textarea id=\"rcN\" style=\"min-height:70px\" placeholder=\"Tastes better the next day.\"></textarea>\n      <div style=\"display:flex;gap:8px;margin-top:22px\">\n        <button class=\"btn\" id=\"rcSave\" style=\"flex:1\">Save recipe</button>\n        <button class=\"btn ghost\" id=\"rcDelete\">Delete</button>\n      </div>\n    </div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst KEY = 'recipes.v1';\nlet all = [], editing = null, current = null, servings = 0, tagFilter = '';\ntry { all = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}\nif (!all.length) all = seed();\nconst save = () => localStorage.setItem(KEY, JSON.stringify(all));\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nfunction uid(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }\n\nfunction seed(){\n  return [{\n    id: uid(), emoji:'🍝', title:'Spaghetti Bolognese',\n    desc:'A rich weeknight ragù that only gets better the next day.',\n    serves:4, prep:15, cook:45, tags:['dinner','italian'],\n    ingredients:['1 tbsp olive oil','500 g beef mince','1 onion, finely diced','2 garlic cloves, crushed','400 g chopped tomatoes','2 tbsp tomato purée','1 beef stock cube','400 g spaghetti','Parmesan, to serve'],\n    steps:['Heat the oil in a large pan over medium heat.','Add the onion and cook for 5 minutes until soft, then add the garlic for 1 minute.','Turn the heat up, add the mince and brown all over, breaking it up as you go.','Stir in the tomatoes, purée and crumbled stock cube. Simmer gently for 30 minutes.','Meanwhile cook the spaghetti in well-salted boiling water until al dente.','Drain, toss with the sauce and finish with plenty of Parmesan.'],\n    notes:'Freezes beautifully for up to 3 months. A splash of milk at the end softens the acidity.'\n  }];\n}\n\n/* ---------- ingredient scaling ---------- */\n// Leading numbers (incl. fractions and ranges) scale with servings; the rest is left alone.\nfunction scaleLine(line, factor){\n  if (factor === 1) return esc(line);\n  return esc(line).replace(/^(\\d+(?:\\.\\d+)?(?:\\s*\\/\\s*\\d+)?)/, m => {\n    let n;\n    if (m.includes('/')){ const [a, b] = m.split('/').map(Number); n = a / b; }\n    else n = parseFloat(m);\n    const v = n * factor;\n    const out = Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v))\n      : (v < 10 ? v.toFixed(1).replace(/\\.0$/, '') : String(Math.round(v)));\n    return '<span class=\"amt\">' + out + '</span>';\n  });\n}\n\n/* ---------- home ---------- */\nfunction allTags(){\n  const s = new Set();\n  all.forEach(r => (r.tags || []).forEach(t => s.add(t)));\n  return [...s].sort();\n}\nfunction renderHome(){\n  const q = $('rcSearch').value.trim().toLowerCase();\n  const tags = allTags();\n  $('rcTags').innerHTML = tags.length\n    ? '<button class=\"' + (tagFilter ? '' : 'on') + '\" data-t=\"\">All</button>' +\n      tags.map(t => '<button class=\"' + (tagFilter === t ? 'on' : '') + '\" data-t=\"' + esc(t) + '\">' + esc(t) + '</button>').join('')\n    : '';\n  $('rcTags').querySelectorAll('button').forEach(b => b.onclick = () => { tagFilter = b.dataset.t; renderHome(); });\n\n  const list = all.filter(r => {\n    if (tagFilter && !(r.tags || []).includes(tagFilter)) return false;\n    if (!q) return true;\n    return (r.title + ' ' + r.desc + ' ' + (r.tags || []).join(' ') + ' ' + r.ingredients.join(' ')).toLowerCase().includes(q);\n  });\n\n  $('rcGrid').innerHTML = list.length ? list.map(r =>\n    '<div class=\"rcard\" data-id=\"' + r.id + '\">' +\n      '<div class=\"ph\">' + esc(r.emoji || '🍲') + '</div>' +\n      '<div class=\"bd\"><h3>' + esc(r.title) + '</h3><div class=\"meta\">' +\n        '<span>Serves ' + r.serves + '</span><span>' + ((r.prep || 0) + (r.cook || 0)) + ' min</span>' +\n      '</div></div></div>').join('')\n    : '<div class=\"empty\" style=\"grid-column:1/-1\">' + (all.length\n        ? 'Nothing matches that search.'\n        : 'No recipes yet.<br>Tap <b>New</b> to add your first one.') + '</div>';\n  $('rcGrid').querySelectorAll('.rcard').forEach(c => c.onclick = () => openRecipe(c.dataset.id));\n}\n$('rcSearch').oninput = renderHome;\n\n/* ---------- detail ---------- */\nfunction openRecipe(id){\n  current = all.find(r => r.id === id);\n  if (!current) return;\n  servings = current.serves;\n  drawView();\n  $('rcView').classList.add('on');\n}\nfunction drawView(){\n  const r = current, f = servings / r.serves;\n  $('rcEmoji').textContent = r.emoji || '🍲';\n  $('rcViewBody').innerHTML =\n    '<h2>' + esc(r.title) + '</h2>' +\n    '<div class=\"vmeta\">' +\n      (r.prep ? '<span>⏱ ' + r.prep + ' min prep</span>' : '') +\n      (r.cook ? '<span>🔥 ' + r.cook + ' min cook</span>' : '') +\n      ((r.tags || []).length ? '<span>' + r.tags.map(esc).join(' · ') + '</span>' : '') +\n    '</div>' +\n    (r.desc ? '<p class=\"desc\">' + esc(r.desc) + '</p>' : '') +\n    '<div class=\"cap\">Ingredients<span class=\"serv\">' +\n      '<button id=\"rcMinus\">&minus;</button><span>Serves ' + servings + '</span><button id=\"rcPlus\">+</button>' +\n    '</span></div>' +\n    '<div id=\"rcIngs\">' + r.ingredients.map((l, i) =>\n      '<div class=\"ing\" data-i=\"' + i + '\"><span class=\"cb\">✓</span><span class=\"tx\">' + scaleLine(l, f) + '</span></div>').join('') + '</div>' +\n    '<div class=\"cap\">Method</div>' +\n    '<div id=\"rcSteps\">' + r.steps.map((s, i) =>\n      '<div class=\"step\" data-i=\"' + i + '\"><span class=\"n\">' + (i + 1) + '</span><span class=\"tx\">' + esc(s) + '</span></div>').join('') + '</div>' +\n    (r.notes ? '<div class=\"cap\">Notes</div><div class=\"notes\">' + esc(r.notes) + '</div>' : '') +\n    '<div class=\"vbtns\">' +\n      '<button class=\"btn\" id=\"rcCook2\">Cook mode</button>' +\n      '<button class=\"btn ghost\" id=\"rcEdit\">Edit</button>' +\n      '<button class=\"btn ghost\" id=\"rcShare\">Copy as text</button>' +\n      '<button class=\"btn ghost\" id=\"rcShop\">Send to shopping list</button>' +\n    '</div>';\n\n  $('rcMinus').onclick = () => { if (servings > 1){ servings--; drawView(); } };\n  $('rcPlus').onclick = () => { if (servings < 50){ servings++; drawView(); } };\n  document.querySelectorAll('#rcIngs .ing, #rcSteps .step').forEach(el =>\n    el.onclick = () => el.classList.toggle('done'));\n  $('rcEdit').onclick = () => openEditor(current);\n  $('rcCook2').onclick = cookMode;\n  $('rcShare').onclick = () => {\n    const f2 = servings / current.serves;\n    const txt = current.title + '\\n\\nServes ' + servings + '\\n\\nINGREDIENTS\\n' +\n      current.ingredients.map(l => '- ' + l.replace(/^(\\d+(?:\\.\\d+)?)/, m => String(+m * f2))).join('\\n') +\n      '\\n\\nMETHOD\\n' + current.steps.map((s, i) => (i + 1) + '. ' + s).join('\\n') +\n      (current.notes ? '\\n\\nNOTES\\n' + current.notes : '');\n    navigator.clipboard.writeText(txt).then(() => toast('Recipe copied'), () => toast('Copied'));\n  };\n  $('rcShop').onclick = () => {\n    // Goes onto the *current* shopping list, not the master item library,\n    // so it shows up straight away on the Shopping List tool.\n    let list = [];\n    try { list = JSON.parse(localStorage.getItem('shopping.list.v1')) || []; } catch {}\n    const f2 = servings / current.serves;\n    let added = 0, skipped = 0;\n    current.ingredients.forEach(l => {\n      // scale any leading quantity to the servings currently on screen\n      const name = l.replace(/^(\\d+(?:\\.\\d+)?(?:\\s*\\/\\s*\\d+)?)/, m => {\n        let n;\n        if (m.includes('/')){ const [x, y] = m.split('/').map(Number); n = x / y; }\n        else n = parseFloat(m);\n        const v = n * f2;\n        return Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v))\n          : (v < 10 ? v.toFixed(1).replace(/\\.0$/, '') : String(Math.round(v)));\n      }).trim();\n      if (list.some(i => i.name.toLowerCase() === name.toLowerCase())){ skipped++; return; }\n      list.push({\n        id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),\n        name, cat: current.title, done: false\n      });\n      added++;\n    });\n    localStorage.setItem('shopping.list.v1', JSON.stringify(list));\n    toast(added + ' added to your shopping list' + (skipped ? ' \\u00b7 ' + skipped + ' already there' : ''));\n  };\n}\n\n/* Cook mode: keeps the screen awake and walks the steps full-screen. */\nasync function cookMode(){\n  let lock = null;\n  try { if (navigator.wakeLock) lock = await navigator.wakeLock.request('screen'); } catch {}\n  let i = 0;\n  const ov = document.createElement('div');\n  ov.style.cssText = 'position:absolute;inset:0;background:#0E1116;color:#fff;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;text-align:center';\n  const draw = () => {\n    ov.innerHTML =\n      '<div style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5)\">Step ' + (i + 1) + ' of ' + current.steps.length + '</div>' +\n      '<div style=\"font-size:23px;line-height:1.5;margin:22px 0 34px;max-width:600px\">' + esc(current.steps[i]) + '</div>' +\n      '<div style=\"display:flex;gap:12px\">' +\n        '<button id=\"ckP\" style=\"min-width:96px;height:54px;border:0;border-radius:15px;background:rgba(255,255,255,.14);color:#fff;font-size:15px;font-weight:600;cursor:pointer\">Back</button>' +\n        '<button id=\"ckN\" style=\"min-width:96px;height:54px;border:0;border-radius:15px;background:#4BD08B;color:#062B1B;font-size:15px;font-weight:600;cursor:pointer\">' + (i === current.steps.length - 1 ? 'Done' : 'Next') + '</button>' +\n        '<button id=\"ckX\" style=\"min-width:70px;height:54px;border:0;border-radius:15px;background:rgba(229,72,77,.85);color:#fff;font-size:15px;font-weight:600;cursor:pointer\">Exit</button>' +\n      '</div>';\n    ov.querySelector('#ckP').onclick = () => { if (i > 0){ i--; draw(); } };\n    ov.querySelector('#ckN').onclick = () => { if (i < current.steps.length - 1){ i++; draw(); } else close(); };\n    ov.querySelector('#ckX').onclick = close;\n  };\n  const close = () => { try { lock && lock.release(); } catch {} ov.remove(); };\n  draw();\n  document.getElementById('rc').appendChild(ov);\n}\n\n$('rcBack').onclick = () => { $('rcView').classList.remove('on'); renderHome(); };\n\n/* ---------- editor ---------- */\nfunction openEditor(r){\n  editing = r;\n  $('rcEdTitle').textContent = r ? 'Edit recipe' : 'New recipe';\n  $('rcT').value = r ? r.title : '';\n  $('rcD').value = r ? r.desc : '';\n  $('rcServ').value = r ? r.serves : 4;\n  $('rcPrep').value = r ? r.prep : 15;\n  $('rcCook').value = r ? r.cook : 30;\n  $('rcEmojiIn').value = r ? (r.emoji || '🍲') : '🍲';\n  $('rcTagsIn').value = r ? (r.tags || []).join(', ') : '';\n  $('rcI').value = r ? r.ingredients.join('\\n') : '';\n  $('rcS').value = r ? r.steps.join('\\n') : '';\n  $('rcN').value = r ? (r.notes || '') : '';\n  $('rcDelete').style.display = r ? '' : 'none';\n  $('rcEd').classList.add('on');\n}\n$('rcNew').onclick = () => openEditor(null);\n$('rcEdCancel').onclick = () => $('rcEd').classList.remove('on');\n$('rcSave').onclick = () => {\n  const title = $('rcT').value.trim();\n  if (!title) return toast('Give the recipe a title');\n  const data = {\n    title, desc:$('rcD').value.trim(),\n    serves: Math.max(1, parseInt($('rcServ').value, 10) || 1),\n    prep: parseInt($('rcPrep').value, 10) || 0,\n    cook: parseInt($('rcCook').value, 10) || 0,\n    emoji: $('rcEmojiIn').value.trim() || '🍲',\n    tags: $('rcTagsIn').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean),\n    ingredients: $('rcI').value.split('\\n').map(l => l.trim()).filter(Boolean),\n    steps: $('rcS').value.split('\\n').map(l => l.trim()).filter(Boolean),\n    notes: $('rcN').value.trim()\n  };\n  if (editing) Object.assign(editing, data);\n  else { const n = Object.assign({ id: uid() }, data); all.unshift(n); editing = n; }\n  save();\n  $('rcEd').classList.remove('on');\n  renderHome();\n  if ($('rcView').classList.contains('on')){ current = editing; servings = current.serves; drawView(); }\n  toast('Recipe saved');\n};\n$('rcDelete').onclick = async () => {\n  if (!editing) return;\n  if (!await confirmDlg('Delete \"' + editing.title + '\"?', 'This recipe is removed from this device.', 'Delete')) return;\n  all = all.filter(r => r.id !== editing.id);\n  save(); editing = null;\n  $('rcEd').classList.remove('on');\n  $('rcView').classList.remove('on');\n  renderHome(); toast('Deleted');\n};\n\n/* ---------- import / export ---------- */\n$('rcExport').onclick = () => {\n  const blob = new Blob([JSON.stringify(all, null, 2)], { type:'application/json' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = 'recipes.json'; a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n};\n$('rcImport').onclick = async () => {\n  const txt = await ask('Import recipes', 'Paste exported recipe JSON', '', true);\n  if (!txt) return;\n  try {\n    const data = JSON.parse(txt);\n    if (!Array.isArray(data)) throw new Error('Expected a list');\n    let n = 0;\n    data.forEach(r => {\n      if (!r.title) return;\n      r.id = uid(); all.unshift(r); n++;\n    });\n    save(); renderHome(); toast(n + ' recipe' + (n === 1 ? '' : 's') + ' imported');\n  } catch (e){ toast('Could not read that: ' + e.message); }\n};\n\nrenderHome();"
