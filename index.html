<script type="text/x-tool" data-id="m" data-part="js">
Tool.title('Multiplayer');

/* ---------- compact byte-mode QR encoder, versions 1-10 ----------
   Same maths as the QR Code tool, including the format-information fix:
   the two 15-bit copies run down column 8 and along row 8 respectively,
   and transposing them makes the symbol undecodable even though every
   data module is correct. */
const EXP=[],LOG=[];(function(){let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11D}
for(let i=255;i<512;i++)EXP[i]=EXP[i-255]})();
const gmul=(a,b)=>a&&b?EXP[(LOG[a]+LOG[b])%255]:0;
function rsPoly(n){let p=[1];for(let i=0;i<n;i++){const q=[1,EXP[i]],r=new Array(p.length+1).fill(0);
  for(let a=0;a<p.length;a++)for(let b=0;b<2;b++)r[a+b]^=gmul(p[a],q[b]);p=r}return p}
function rsEnc(data,n){const gen=rsPoly(n),res=new Array(n).fill(0);
  for(const d of data){const f=d^res[0];res.shift();res.push(0);
    if(f)for(let i=0;i<n;i++)res[i]^=gmul(gen[i+1],f)}return res}
/* Error-correction level M throughout - these MUST be the M rows, because
   the format bits below declare M. Mixing an L block table with an M
   format field yields a symbol no scanner will touch. */
const RSB={1:[1,26,16],2:[1,44,28],3:[1,70,44],4:[2,50,32],5:[2,67,43],
  6:[4,43,27],7:[4,49,31],8:[2,60,38,2,61,39],9:[3,58,36,2,59,37],
  10:[4,69,43,1,70,44]};
const ALIGN={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],
  8:[6,24,42],9:[6,26,46],10:[6,28,50]};
const VINFO={7:0x07C94,8:0x085BC,9:0x09A99,10:0x0A4D3};
function blocks(v){const t=RSB[v],out=[];for(let i=0;i<t.length;i+=3)
  for(let j=0;j<t[i];j++)out.push({total:t[i+1],data:t[i+2]});return out}
function cap(v){return blocks(v).reduce((a,b)=>a+b.data,0)}

function qrGen(text){
  const bytes=[...new TextEncoder().encode(text)];
  let v=0;for(let i=1;i<=10;i++){const lb=i<10?8:16;
    if(4+lb+bytes.length*8<=cap(i)*8){v=i;break}}
  if(!v)throw new Error('too long');
  const total=cap(v),lb=v<10?8:16,bits=[];
  const push=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>i)&1)};
  push(4,4);push(bytes.length,lb);bytes.forEach(b=>push(b,8));
  push(0,Math.min(4,total*8-bits.length));
  while(bits.length%8)bits.push(0);
  const pad=[0xEC,0x11];let pi=0;
  while(bits.length<total*8)push(pad[pi++%2],8);
  const dc=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];dc.push(b)}
  const bl=blocks(v);let off=0;const dp=[],ep=[];
  bl.forEach(b=>{const d=dc.slice(off,off+b.data);off+=b.data;dp.push(d);ep.push(rsEnc(d,b.total-b.data))});
  const fin=[];
  for(let i=0;i<Math.max(...bl.map(b=>b.data));i++)dp.forEach(d=>{if(i<d.length)fin.push(d[i])});
  for(let i=0;i<Math.max(...ep.map(e=>e.length));i++)ep.forEach(e=>{if(i<e.length)fin.push(e[i])});

  const n=17+4*v,m=[],res=[];
  for(let i=0;i<n;i++){m.push(new Array(n).fill(0));res.push(new Array(n).fill(0))}
  const setF=(r,c,val)=>{m[r][c]=val;res[r][c]=1};
  const finder=(r,c)=>{for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){
    const rr=r+i,cc=c+j;if(rr<0||cc<0||rr>=n||cc>=n)continue;
    const on=(i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6))||(i>=2&&i<=4&&j>=2&&j<=4);
    setF(rr,cc,on?1:0)}};
  finder(0,0);finder(0,n-7);finder(n-7,0);
  for(let i=8;i<n-8;i++){setF(6,i,i%2===0?1:0);setF(i,6,i%2===0?1:0)}
  const al=ALIGN[v];
  al.forEach(r=>al.forEach(c=>{
    if((r<8&&c<8)||(r<8&&c>n-9)||(r>n-9&&c<8))return;
    for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)
      setF(r+i,c+j,(Math.abs(i)===2||Math.abs(j)===2||(i===0&&j===0))?1:0)}));
  setF(n-8,8,1);
  for(let i=0;i<9;i++){if(!res[8][i])res[8][i]=1;if(!res[i][8])res[i][8]=1}
  for(let i=0;i<8;i++){res[8][n-1-i]=1;res[n-1-i][8]=1}
  if(v>=7)for(let i=0;i<18;i++){const r=Math.floor(i/3),c=i%3;res[n-11+c][r]=1;res[r][n-11+c]=1}
  const db=[];fin.forEach(b=>{for(let i=7;i>=0;i--)db.push((b>>i)&1)});
  let bi=0,up=true;
  for(let c=n-1;c>0;c-=2){if(c===6)c--;
    for(let k=0;k<n;k++){const r=up?n-1-k:k;
      for(let s=0;s<2;s++){const cc=c-s;if(res[r][cc])continue;
        m[r][cc]=bi<db.length?db[bi++]:0}}
    up=!up}
  const mf=[(r,c)=>(r+c)%2===0,(r,c)=>r%2===0,(r,c)=>c%3===0,(r,c)=>(r+c)%3===0,
    (r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0,(r,c)=>((r*c)%2)+((r*c)%3)===0,
    (r,c)=>(((r*c)%2)+((r*c)%3))%2===0,(r,c)=>(((r+c)%2)+((r*c)%3))%2===0];
  function withMask(mk){
    const g=m.map(r=>r.slice());
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(!res[r][c]&&mf[mk](r,c))g[r][c]^=1;
    const fmt=(0<<3)|mk;let d=fmt<<10;            /* EC level M = 0 */
    for(let i=4;i>=0;i--)if(d&(1<<(i+10)))d^=0x537<<i;
    const bf=((fmt<<10)|d)^0x5412,get=i=>(bf>>i)&1;
    for(let i=0;i<=5;i++)g[i][8]=get(i);
    g[7][8]=get(6);g[8][8]=get(7);g[8][7]=get(8);
    for(let i=9;i<=14;i++)g[8][14-i]=get(i);
    for(let i=0;i<=7;i++)g[8][n-1-i]=get(i);
    for(let i=8;i<=14;i++)g[n-15+i][8]=get(i);
    g[n-8][8]=1;
    if(v>=7){const vb=VINFO[v];for(let i=0;i<18;i++){const b=(vb>>i)&1;
      g[n-11+(i%3)][Math.floor(i/3)]=b;g[Math.floor(i/3)][n-11+(i%3)]=b}}
    return g}
  function pen(g){let p=0;
    for(let r=0;r<n;r++)for(let pass=0;pass<2;pass++){let run=1,prev=pass?g[0][r]:g[r][0];
      for(let c=1;c<n;c++){const v2=pass?g[c][r]:g[r][c];
        if(v2===prev)run++;else{if(run>=5)p+=3+(run-5);run=1;prev=v2}}
      if(run>=5)p+=3+(run-5)}
    for(let r=0;r<n-1;r++)for(let c=0;c<n-1;c++){
      const s=g[r][c]+g[r][c+1]+g[r+1][c]+g[r+1][c+1];if(s===0||s===4)p+=3}
    const pat=[1,0,1,1,1,0,1,0,0,0,0];
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)for(let pass=0;pass<2;pass++){
      if(pass===0&&c+10>=n)continue;if(pass===1&&r+10>=n)continue;let ok=true;
      for(let i=0;i<11;i++){const val=pass?g[r+i][c]:g[r][c+i];if(val!==pat[i]){ok=false;break}}
      if(ok)p+=40}
    let dark=0;g.forEach(r=>r.forEach(v2=>dark+=v2));
    p+=Math.floor(Math.abs(dark*100/(n*n)-50)/5)*10;
    return p}
  let best=null,bp=1e9;
  for(let mk=0;mk<8;mk++){const g=withMask(mk),p=pen(g);if(p<bp){bp=p;best=g}}
  return {matrix:best,size:n};
}

function drawQR(text){
  try{
    const q=qrGen(text),qz=4,tot=q.size+qz*2,sc=Math.max(3,Math.floor(760/tot));
    const cv=$('#qr'),ctx=cv.getContext('2d');
    cv.width=cv.height=tot*sc;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#000';
    for(let r=0;r<q.size;r++)for(let c=0;c<q.size;c++)
      if(q.matrix[r][c])ctx.fillRect((c+qz)*sc,(r+qz)*sc,sc,sc);
    return true;
  }catch(e){return false}
}

/* ---------- shared lobby state ---------- */
const TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.6 2.6L16 9.6"/></svg>';
const CROSS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';
let ST={role:null,players:[],chat:[],name:null};
let joinURL='';
let pendingName='';

function stateIcon(p){
  if(p.state==='linking')return '<span class="st linking"><span class="spin"></span></span>';
  if(p.state==='error')return '<span class="st error">'+CROSS+'</span>';
  return '<span class="st ok">'+TICK+'</span>';
}

function show(which){
  ['gate','manual','lobby'].forEach(function(k){
    $('#'+k).style.display = (k===which) ? '' : 'none';
  });
}

function failGate(msg){ const g=$('#gerr'); g.style.display=''; g.textContent=msg }

function render(){
  if(ST.role==='host'||ST.role==='player'){
    show('lobby');
    const isHost = ST.role==='host';
    $('#pcount').textContent='\u00b7 '+ST.players.length;
    $('#plist').innerHTML=ST.players.map(function(p,i){
      const me = isHost ? i===0 : p.name===ST.name;
      return '<div class="prow'+(isHost?' click':'')+'"'+(isHost?' data-id="'+esc(p.id)+'"':'')+'>'+stateIcon(p)+
        '<span class="nm">'+esc(p.name)+(me?'<span class="you">you</span>':'')+'</span>'+
        '<span class="tag'+(p.link==='rtc'?' rtc':'')+'">'+(p.link==='rtc'?'RTC':'WS')+'</span></div>';
    }).join('');
    if(isHost){
      $$('.prow').forEach(function(el){ el.onclick=function(){ manage(el.dataset.id) } });
    }
    $('#hostactions').style.display = isHost ? '' : 'none';
    $('#playeractions').style.display = isHost ? 'none' : '';
    $('#qrpanel').style.display = isHost ? '' : 'none';
    if(isHost)$('#hostpanel').classList.remove('solo'); else $('#hostpanel').classList.add('solo');
    $('#chat').innerHTML=ST.chat.map(function(c){
      return c.who?'<div class="cm"><b>'+esc(c.who)+'</b> '+esc(c.text)+'</div>'
                  :'<div class="cm sys">'+esc(c.text)+'</div>'}).join('');
    $('#chat').scrollTop=$('#chat').scrollHeight;
    return;
  }
  if($('#manual').style.display==='none') show('gate');
}

Tool.party.watch(function(s){ ST=s; render() });

/* ---------- entry: try to join, fall back to hosting, fall back to manual ---------- */
$('#enter').onclick=async function(){
  const nm=$('#uname').value.trim();
  if(!nm)return toast('Enter a name first');
  pendingName=nm;
  $('#gerr').style.display='none';
  $('#enter').disabled=true;
  $('#enter').textContent='Looking for a lobby\u2026';
  let r=await Tool.party.cmd('player.start',{name:nm});
  if(r&&!r.error){
    $('#enter').disabled=false; $('#enter').textContent='Enter';
    return;                                   /* joined an existing lobby; watcher renders */
  }
  if(r&&r.error==='nohost'){
    /* Nobody is hosting yet on this server, so become the host. */
    $('#enter').textContent='Opening a lobby\u2026';
    r=await Tool.party.cmd('host.start',{name:nm});
    $('#enter').disabled=false; $('#enter').textContent='Enter';
    if(r&&r.error){ failGate(r.error); return }
    const h=await Tool.party.cmd('href');
    joinURL=(h.href||location.href)+'#join';
    $('#qcap').textContent=drawQR(joinURL)?joinURL:'Could not draw a code for '+joinURL;
    return;
  }
  $('#enter').disabled=false; $('#enter').textContent='Enter';
  if(r&&r.error==='nosocket'){
    /* This page has no shared server at all - offer to host or pair by code. */
    show('manual');
    return;
  }
  if(r&&r.error) failGate(r.error);
};
$('#uname').addEventListener('keydown',function(e){ if(e.key==='Enter')$('#enter').click() });

/* ---------- manual: become a host with no server ---------- */
$('#mhost').onclick=async function(){
  $('#mhost').disabled=true;
  const r=await Tool.party.cmd('host.start',{name:pendingName||'Host'});
  $('#mhost').disabled=false;
  if(r&&r.error){ const m=$('#merr'); m.style.display=''; m.textContent=r.error; return }
  const h=await Tool.party.cmd('href');
  joinURL=(h.href||location.href)+'#join';
  $('#qcap').textContent=drawQR(joinURL)?joinURL:'Could not draw a code for '+joinURL;
  /* watcher flips role to host and swaps in the lobby view */
};

/* ---------- manual: join with a code someone sent you ---------- */
$('#jmk').onclick=async function(){
  const code=$('#joff').value.trim();
  if(!code)return toast('Paste the invitation first');
  const nm=pendingName||'Player';
  $('#jmk').disabled=true;
  const r=await Tool.party.cmd('manual.answer',{code:code,name:nm});
  $('#jmk').disabled=false;
  if(r.error)return toast(r.error);
  $('#jans').value=r.code;
  $('#jansbox').style.display='';
  copyText(r.code);
  toast('Answer copied \u2014 send it to them');
};
$('#jcp').onclick=function(){ copyText($('#jans').value) };

/* Offer codes are long, so make pasting as easy as possible on a phone. */
pasteText().then(function(t){
  if(t&&t.length>200&&!$('#joff').value)$('#joff').value=t.trim();
});

/* ---------- lobby: chat (host and player) ---------- */
$('#saybtn').onclick=function(){
  const v=$('#say').value.trim(); if(!v)return;
  Tool.party.cmd('say',{text:v}); $('#say').value='';
};
$('#say').addEventListener('keydown',function(e){ if(e.key==='Enter')$('#saybtn').click() });

/* ---------- lobby: leave (player) / end (host) ---------- */
$('#leave').onclick=function(){ Tool.party.cmd('leave'); Tool.close() };
$('#end').onclick=function(){
  confirmBox('End the lobby?','Everyone is returned to their own tool wall.',
    function(){ Tool.party.cmd('leave'); Tool.close() });
};

/* ---------- host: per-player controls ---------- */
function manage(id){
  const p=ST.players.find(function(x){return x.id===id});
  if(!p)return;
  const me=ST.players[0]&&ST.players[0].id===id;
  const btns=[{label:'Close',cls:'gho'}];
  if(!me&&p.link!=='rtc')btns.push({label:'Switch to RTC',onClick:function(){
    Tool.party.cmd('upgrade',{id:id})}});
  if(!me)btns.push({label:'Remove',cls:'dgr',onClick:function(){
    Tool.party.cmd('kick',{id:id})}});
  btns.push({label:'Rename',cls:'pri',close:false,onClick:function(b){
    const v=b.querySelector('#rn').value.trim();
    if(!v)return false;
    Tool.party.cmd('rename',{id:id,name:v});
    b.close();
  }});
  dialog({title:p.name,style:'width:min(400px,100%)',
    body:'<div class="row"><label class="fl">Name</label>'+
      '<input class="fld" id="rn" maxlength="18" value="'+esc(p.name)+'"></div>'+
      '<div class="hint">Names have to be unique, so a duplicate gets a number added. '+
      (p.link==='rtc'?'This player already has a direct link.'
        :'Switching to RTC moves their traffic off the Stick and onto a direct '+
         'connection with you. Everything still routes through you, so nothing else changes.')+
      '</div>',
    buttons:btns,
    onOpen:function(b){ setTimeout(function(){ b.querySelector('#rn').select() },50) }});
}

/* ---------- host: manual invitation from inside a running lobby ---------- */
$('#invite').onclick=async function(){
  const r=await Tool.party.cmd('manual.offer');
  if(r.error)return toast(r.error);
  dialog({title:'Invite by code',style:'width:min(560px,100%)',dismiss:false,
    body:'<div class="row"><label class="fl">Step 1 \u2014 send them this</label>'+
      '<textarea class="fld code" id="off" rows="5" readonly></textarea>'+
      '<div class="hint">Any channel will do \u2014 message it, email it, read it out. '+
      'They paste it into their Multiplayer tool and send back an answer code.</div></div>'+
      '<div class="row"><label class="fl">Step 2 \u2014 paste their answer</label>'+
      '<textarea class="fld code" id="ans" rows="5" placeholder="Paste the answer code here"></textarea></div>',
    buttons:[
      {label:'Copy invitation',cls:'gho left',close:false,onClick:function(b){
        copyText(b.querySelector('#off').value)}},
      {label:'Cancel',cls:'gho'},
      {label:'Add player',cls:'pri',close:false,onClick:async function(b){
        const v=b.querySelector('#ans').value.trim();
        if(!v)return toast('Paste their answer code first'),false;
        const res=await Tool.party.cmd('manual.accept',{code:v});
        if(res.error)return toast(res.error),false;
        toast(res.name+' is connecting');
        b.close();
      }}],
    onOpen:function(b){
      b.querySelector('#off').value=r.code;
      copyText(r.code);
    }});
};

/* ---------- host: play a tool together ---------- */
$('#play').onclick=async function(){
  const r=await Tool.party.cmd('tools');
  const list=(r.tools||[]).filter(function(t){return t.id!=='host'&&t.id!=='join'&&t.id!=='multiplayer'});
  dialog({title:'Play a tool together',style:'width:min(520px,100%)',
    body:'<div class="row"><label class="fl">Tool</label>'+
      '<select class="fld" id="tsel">'+list.map(function(t){
        return '<option value="'+esc(t.id)+'">'+esc(t.name)+(t.edited?' (edited)':'')+'</option>'
      }).join('')+'</select></div>'+
      '<label style="display:flex;gap:9px;align-items:center;font-size:14px;margin-bottom:9px">'+
      '<input type="checkbox" id="pers"> Persistent \u2014 save it to their wall</label>'+
      '<label style="display:flex;gap:9px;align-items:center;font-size:14px">'+
      '<input type="checkbox" id="cch"> Copy cache \u2014 send my saved data too</label>'+
      '<div class="hint">Left unticked, players run your copy for this session only. Nothing is '+
      'written to their storage and their own version of the tool is untouched.</div>',
    buttons:[{label:'Cancel',cls:'gho'},
      {label:'Start',cls:'pri',onClick:function(b){
        Tool.party.cmd('play',{id:b.querySelector('#tsel').value,
          persist:b.querySelector('#pers').checked,
          cache:b.querySelector('#cch').checked});
      }}]});
};

render();
</script>

</div>

</style></script>
<script type="text/x-tool" data-id="cmt4xgmmb708" data-part="js">
const K_E = 'entries', K_B = 'budgets', K_C = 'currency';
let entries = [];
let budgets = {};
let cur = '$';
let view = new Date();
view = new Date(view.getFullYear(), view.getMonth(), 1);
let tab = 'entries';
let filter = { text: '', cat: '', type: '' };

const PAL = ['#4CC9C0', '#E8A44C', '#5BC77A', '#7B9CE8', '#C77ADD', '#E5534B', '#6FD2E8', '#D8C24C', '#9AA7B5', '#E87AA4', '#7ADDB0', '#B08CE8'];

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function mkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function monthOf(iso) { return (iso || '').slice(0, 7); }
function fmt(n) {
  const neg = n < 0;
  const v = Math.abs(Number(n) || 0).toFixed(2);
  const parts = v.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '-' : '') + cur + parts.join('.');
}
function monthName(d) {
  const M = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  return M[d.getMonth()] + ' ' + d.getFullYear();
}
function shortM(k) {
  const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const p = k.split('-');
  return M[parseInt(p[1], 10) - 1] + ' ' + p[0].slice(2);
}
function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return PAL[h % PAL.length];
}

async function save() { await Tool.set(K_E, entries); }
async function saveB() { await Tool.set(K_B, budgets); }

function categories() {
  const s = {};
  entries.forEach(e => { if (e.cat) s[e.cat] = 1; });
  Object.keys(budgets).forEach(c => s[c] = 1);
  return Object.keys(s).sort((a, b) => a.toLowerCase() < b.toLowerCase() ? -1 : 1);
}

function monthEntries(k) {
  return entries.filter(e => monthOf(e.date) === k);
}

function applyFilter(list) {
  const t = filter.text.trim().toLowerCase();
  return list.filter(e => {
    if (filter.type && e.type !== filter.type) return false;
    if (filter.cat && e.cat !== filter.cat) return false;
    if (t) {
      const hay = ((e.note || '') + ' ' + (e.cat || '')).toLowerCase();
      if (hay.indexOf(t) < 0) return false;
    }
    return true;
  });
}

function totals(list) {
  let inc = 0, out = 0;
  list.forEach(e => { if (e.type === 'income') inc += e.amount; else out += e.amount; });
  return { inc: inc, out: out, net: inc - out };
}

/* ---------- rendering ---------- */

function renderHeader() {
  const k = mkey(view);
  $('#monthLbl').textContent = monthName(view);
  const t = totals(monthEntries(k));
  $('#monthSub').textContent = monthEntries(k).length + ' entries \u00b7 net ' + fmt(t.net);
  $('#pieMonth').textContent = monthName(view);
}

function renderSummary(list) {
  const t = totals(list);
  $('#sIn').textContent = fmt(t.inc);
  $('#sOut').textContent = fmt(t.out);
  const net = $('#sNet');
  net.textContent = fmt(t.net);
  net.style.color = t.net < 0 ? 'var(--danger)' : 'var(--ok)';
}

function renderList() {
  const k = mkey(view);
  let list = applyFilter(monthEntries(k));
  renderSummary(list);
  const act = filter.text || filter.cat || filter.type;
  const fl = $('#filtLbl');
  if (act) {
    fl.style.display = '';
    fl.innerHTML = 'Filtered: ' + esc([filter.type, filter.cat, filter.text].filter(Boolean).join(' \u00b7 ')) + ' &mdash; <a href="#" id="clrF" style="color:var(--accent)">clear</a>';
    const c = $('#clrF');
    if (c) c.onclick = (ev) => { ev.preventDefault(); filter = { text: '', cat: '', type: '' }; renderList(); };
  } else fl.style.display = 'none';

  const box = $('#list');
  if (!list.length) {
    box.innerHTML = '<div class="empty">' + (monthEntries(k).length ? 'No entries match the filter.' : 'No entries for ' + esc(monthName(view)) + '. Tap \u201c+ Add entry\u201d to start.') + '</div>';
    return;
  }
  list = list.slice().sort((a, b) => a.date === b.date ? (b.ts - a.ts) : (a.date < b.date ? 1 : -1));
  let html = '<div class="card listcard">';
  let day = null;
  list.forEach(e => {
    if (e.date !== day) {
      day = e.date;
      html += '<div class="daygrp">' + esc(day) + '</div>';
    }
    const col = e.type === 'income' ? 'var(--ok)' : colorFor(e.cat || 'Uncategorised');
    html += '<div class="ent" data-id="' + esc(e.id) + '">' +
      '<span class="edot" style="background:' + col + '"></span>' +
      '<span class="emid"><div class="etop">' + esc(e.note || e.cat || '(no note)') + '</div>' +
      '<div class="esub">' + esc(e.cat || 'Uncategorised') + '</div></span>' +
      '<span class="eamt" style="color:' + (e.type === 'income' ? 'var(--ok)' : 'var(--txt)') + '">' +
      (e.type === 'income' ? '+' : '\u2212') + fmt(e.amount).replace('-', '') + '</span></div>';
  });
  html += '</div>';
  box.innerHTML = html;
  $$('#list .ent').forEach(n => n.onclick = () => {
    const e = entries.find(x => x.id === n.dataset.id);
    if (e) entryDialog(e);
  });
}

function last12Keys() {
  const out = [];
  const d = new Date(view.getFullYear(), view.getMonth(), 1);
  for (let i = 11; i >= 0; i--) {
    const x = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push(mkey(x));
  }
  return out;
}

function renderBars() {
  const keys = last12Keys();
  const data = keys.map(k => {
    const t = totals(monthEntries(k));
    return { k: k, inc: t.inc, out: t.out };
  });
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.out)));
  const has = data.some(d => d.inc || d.out);
  if (!has) { $('#barsWrap').innerHTML = '<div class="empty">No data yet.</div>'; return; }
  const W = 700, H = 220, padL = 6, padB = 26, padT = 8;
  const n = data.length;
  const slot = (W - padL * 2) / n;
  const bw = Math.max(4, slot * 0.32);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:220px">';
  s += '<line x1="0" y1="' + (H - padB) + '" x2="' + W + '" y2="' + (H - padB) + '" stroke="#36434F" stroke-width="1"/>';
  for (let g = 1; g <= 3; g++) {
    const y = padT + (H - padB - padT) * (g / 4);
    s += '<line x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="#28323E" stroke-width="1"/>';
  }
  data.forEach((d, i) => {
    const cx = padL + slot * i + slot / 2;
    const avail = H - padB - padT;
    const hi = (d.inc / max) * avail, ho = (d.out / max) * avail;
    const isCur = d.k === mkey(view);
    s += '<rect x="' + (cx - bw - 1) + '" y="' + (H - padB - hi) + '" width="' + bw + '" height="' + Math.max(0, hi) + '" rx="2" fill="#5BC77A" opacity="' + (isCur ? 1 : 0.72) + '"/>';
    s += '<rect x="' + (cx + 1) + '" y="' + (H - padB - ho) + '" width="' + bw + '" height="' + Math.max(0, ho) + '" rx="2" fill="#E8A44C" opacity="' + (isCur ? 1 : 0.72) + '"/>';
    s += '<text x="' + cx + '" y="' + (H - 8) + '" font-size="11" fill="' + (isCur ? '#E6EBF1' : '#5F6E7E') + '" text-anchor="middle" font-family="sans-serif">' + shortM(d.k).split(' ')[0] + '</text>';
  });
  s += '</svg>';
  s += '<div class="hint" style="margin-top:6px">Peak month value: ' + esc(fmt(max)) + '</div>';
  $('#barsWrap').innerHTML = s;
}

function renderPie() {
  const k = mkey(view);
  const list = monthEntries(k).filter(e => e.type === 'expense');
  if (!list.length) { $('#pieWrap').innerHTML = '<div class="empty">No expenses this month.</div>'; return; }
  const by = {};
  list.forEach(e => { const c = e.cat || 'Uncategorised'; by[c] = (by[c] || 0) + e.amount; });
  const arr = Object.keys(by).map(c => ({ c: c, v: by[c] })).sort((a, b) => b.v - a.v);
  const tot = arr.reduce((s, x) => s + x.v, 0);
  const R = 62, CX = 75, CY = 75, IR = 34;
  let ang = -Math.PI / 2;
  let paths = '';
  arr.forEach(x => {
    const frac = tot ? x.v / tot : 0;
    const a2 = ang + frac * Math.PI * 2;
    const col = colorFor(x.c);
    if (frac >= 0.9999) {
      paths += '<circle cx="' + CX + '" cy="' + CY + '" r="' + ((R + IR) / 2) + '" fill="none" stroke="' + col + '" stroke-width="' + (R - IR) + '"/>';
    } else {
      const large = (a2 - ang) > Math.PI ? 1 : 0;
      const x1 = CX + R * Math.cos(ang), y1 = CY + R * Math.sin(ang);
      const x2 = CX + R * Math.cos(a2), y2 = CY + R * Math.sin(a2);
      const x3 = CX + IR * Math.cos(a2), y3 = CY + IR * Math.sin(a2);
      const x4 = CX + IR * Math.cos(ang), y4 = CY + IR * Math.sin(ang);
      paths += '<path d="M' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2) +
        ' L' + x3.toFixed(2) + ' ' + y3.toFixed(2) + ' A' + IR + ' ' + IR + ' 0 ' + large + ' 0 ' + x4.toFixed(2) + ' ' + y4.toFixed(2) + ' Z" fill="' + col + '"/>';
    }
    ang = a2;
  });
  let leg = '<div class="pieleg">';
  arr.forEach(x => {
    const pct = tot ? Math.round(x.v / tot * 100) : 0;
    leg += '<div class="plrow"><i class="sw" style="background:' + colorFor(x.c) + '"></i>' +
      '<span class="nm">' + esc(x.c) + '</span><span class="vv">' + esc(fmt(x.v)) + ' \u00b7 ' + pct + '%</span></div>';
  });
  leg += '</div>';
  $('#pieWrap').innerHTML = '<div class="pierow"><div class="piesvg"><svg viewBox="0 0 150 150">' + paths +
    '<text x="75" y="73" text-anchor="middle" font-size="11" fill="#8B99A9" font-family="sans-serif">total</text>' +
    '<text x="75" y="88" text-anchor="middle" font-size="13" fill="#E6EBF1" font-family="monospace">' + esc(fmt(tot)) + '</text>' +
    '</svg></div><div class="pieside">' + leg + '</div></div>';
}

function renderLine() {
  const keys = last12Keys();
  const vals = keys.map(k => { const t = totals(monthEntries(k)); return t.net; });
  if (!vals.some(v => v !== 0)) { $('#lineWrap').innerHTML = '<div class="empty">No data yet.</div>'; return; }
  let run = 0;
  const cum = vals.map(v => (run += v));
  const min = Math.min(0, ...cum), max = Math.max(0, ...cum);
  const span = (max - min) || 1;
  const W = 700, H = 180, padT = 12, padB = 26;
  const step = W / (keys.length - 1 || 1);
  const y = v => padT + (1 - (v - min) / span) * (H - padT - padB);
  let d = '', area = '';
  cum.forEach((v, i) => {
    const x = i * step;
    d += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y(v).toFixed(1);
  });
  area = d + ' L' + ((keys.length - 1) * step).toFixed(1) + ' ' + y(min).toFixed(1) + ' L0 ' + y(min).toFixed(1) + ' Z';
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:180px">';
  const zy = y(0);
  s += '<line x1="0" y1="' + zy + '" x2="' + W + '" y2="' + zy + '" stroke="#36434F" stroke-dasharray="3 3"/>';
  s += '<path d="' + area + '" fill="#4CC9C0" opacity="0.13"/>';
  s += '<path d="' + d + '" fill="none" stroke="#4CC9C0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  cum.forEach((v, i) => {
    s += '<circle cx="' + (i * step).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="3" fill="#0E1116" stroke="#4CC9C0" stroke-width="2"/>';
  });
  s += '</svg>';
  s += '<div class="hint" style="margin-top:6px">Running net over the 12 months ending ' + esc(monthName(view)) + ': ' + esc(fmt(cum[cum.length - 1])) + '</div>';
  $('#lineWrap').innerHTML = s;
}

function renderBudgets() {
  const k = mkey(view);
  const spent = {};
  monthEntries(k).forEach(e => { if (e.type === 'expense') { const c = e.cat || 'Uncategorised'; spent[c] = (spent[c] || 0) + e.amount; } });
  const cats = Object.keys(budgets).sort((a, b) => a.toLowerCase() < b.toLowerCase() ? -1 : 1);
  const box = $('#budgetList');
  if (!cats.length) {
    box.innerHTML = '<div class="empty">No budgets set. Add a category limit below.</div>';
    return;
  }
  let html = '<div class="card listcard">';
  cats.forEach(c => {
    const lim = budgets[c] || 0;
    const sp = spent[c] || 0;
    const pct = lim > 0 ? Math.min(100, sp / lim * 100) : 0;
    const over = lim > 0 && sp > lim;
    const col = over ? 'var(--danger)' : (pct > 80 ? 'var(--brass)' : colorFor(c));
    html += '<div class="bud">' +
      '<div class="budtop"><i class="sw" style="background:' + colorFor(c) + '"></i>' +
      '<span class="nm">' + esc(c) + '</span>' +
      '<span class="bval" style="color:' + (over ? 'var(--danger)' : 'var(--dim)') + '">' + esc(fmt(sp)) + '</span>' +
      '<button class="btn sm gho" data-del="' + esc(c) + '">\u00d7</button></div>' +
      '<div class="bseg"><i style="width:' + pct.toFixed(1) + '%;background:' + col + '"></i></div>' +
      '<div class="hint">' + (lim > 0 ? esc(fmt(lim)) + ' limit \u00b7 ' + (over ? esc(fmt(sp - lim)) + ' over' : esc(fmt(lim - sp)) + ' left') : 'no limit') + '</div>' +
      '</div>';
  });
  html += '</div>';
  box.innerHTML = html;
  $$('#budgetList [data-del]').forEach(b => b.onclick = () => {
    const c = b.dataset.del;
    confirmBox('Remove budget', 'Remove the budget for <b>' + esc(c) + '</b>? Entries are kept.', async () => {
      delete budgets[c];
      await saveB();
      renderBudgets();
      toast('Budget removed');
    }, true);
  });
}

function renderStats() {
  const t = totals(entries);
  const months = {};
  entries.forEach(e => months[monthOf(e.date)] = 1);
  $('#stats').innerHTML = entries.length + ' entries across ' + Object.keys(months).length + ' months \u00b7 total in ' +
    esc(fmt(t.inc)) + ' \u00b7 total out ' + esc(fmt(t.out)) + ' \u00b7 net ' + esc(fmt(t.net));
}

function renderAll() {
  renderHeader();
  if (tab === 'entries') renderList();
  if (tab === 'charts') { renderBars(); renderPie(); renderLine(); }
  if (tab === 'budgets') renderBudgets();
  if (tab === 'data') renderStats();
}

/* ---------- dialogs ---------- */

function entryDialog(existing) {
  const e = existing || { id: '', type: 'expense', amount: 0, cat: '', note: '', date: defaultDate() };
  const cats = categories();
  const opts = cats.map(c => '<option value="' + esc(c) + '"></option>').join('');
  const body =
    '<div class="row" style="margin-bottom:10px">' +
    '<button class="btn grow" id="tExp">Expense</button>' +
    '<button class="btn grow" id="tInc">Income</button></div>' +
    '<label class="fl">Amount</label>' +
    '<input class="fld" id="fAmt" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" value="' + (e.amount ? e.amount : '') + '">' +
    '<label class="fl" style="margin-top:8px">Category</label>' +
    '<input class="fld" id="fCat" list="catList" placeholder="e.g. Groceries" value="' + esc(e.cat || '') + '">' +
    '<datalist id="catList">' + opts + '</datalist>' +
    '<label class="fl" style="margin-top:8px">Date</label>' +
    '<input class="fld" id="fDate" type="date" value="' + esc(e.date) + '">' +
    '<label class="fl" style="margin-top:8px">Note</label>' +
    '<input class="fld" id="fNote" placeholder="optional" value="' + esc(e.note || '') + '">' +
    '<div class="hint" id="fErr" style="color:var(--danger);display:none;margin-top:8px"></div>';

  let type = e.type;
  const buttons = [];
  if (existing) {
    buttons.push({
      label: 'Delete', cls: 'dgr', left: true, close: true, onClick: () => {
        confirmBox('Delete entry', 'Delete this entry permanently?', async () => {
          entries = entries.filter(x => x.id !== existing.id);
          await save();
          renderAll();
          toast('Deleted');
        }, true);
      }
    });
  }
  buttons.push({ label: 'Cancel', cls: 'gho', close: true });
  buttons.push({
    label: existing ? 'Save' : 'Add', cls: 'pri', close: false, onClick: async (node) => {
      const amt = parseFloat($('#fAmt').value);
      const err = $('#fErr');
      if (!isFinite(amt) || amt <= 0) { err.style.display = ''; err.textContent = 'Enter an amount greater than zero.'; return; }
      const date = $('#fDate').value || todayStr();
      const rec = {
        id: existing ? existing.id : uid(),
        ts: existing && existing.ts ? existing.ts : Date.now(),
        type: type,
        amount: Math.round(amt * 100) / 100,
        cat: $('#fCat').value.trim() || 'Uncategorised',
        note: $('#fNote').value.trim(),
        date: date
      };
      if (existing) {
        const i = entries.findIndex(x => x.id === existing.id);
        entries[i] = rec;
      } else {
        entries.push(rec);
        const mk = monthOf(date);
        if (mk !== mkey(view)) {
          const p = mk.split('-');
          view = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, 1);
        }
      }
      await save();
      if (closeRef) closeRef();
      renderAll();
      toast(existing ? 'Saved' : 'Entry added');
    }
  });

  let closeRef = null;
  dialog({
    title: existing ? 'Edit entry' : 'New entry',
    body: body,
    buttons: buttons,
    onOpen: (node, close) => {
      closeRef = close;
      const be = $('#tExp'), bi = $('#tInc');
      function paint() {
        be.classList.toggle('on', type === 'expense');
        bi.classList.toggle('on', type === 'income');
        be.classList.toggle('pri', type === 'expense');
        bi.classList.toggle('pri', type === 'income');
      }
      be.onclick = () => { type = 'expense'; paint(); };
      bi.onclick = () => { type = 'income'; paint(); };
      paint();
      const a = $('#fAmt');
      if (a) setTimeout(() => a.focus(), 40);
    }
  });
}

function defaultDate() {
  const now = new Date();
  if (mkey(now) === mkey(view)) return todayStr();
  return view.getFullYear() + '-' + pad(view.getMonth() + 1) + '-01';
}

function filterDialog() {
  const cats = categories();
  const body =
    '<label class="fl">Search note or category</label>' +
    '<input class="fld" id="gTxt" value="' + esc(filter.text) + '" placeholder="text">' +
    '<label class="fl" style="margin-top:8px">Category</label>' +
    '<select class="fld" id="gCat"><option value="">All</option>' +
    cats.map(c => '<option value="' + esc(c) + '"' + (filter.cat === c ? ' selected' : '') + '>' + esc(c) + '</option>').join('') +
    '</select>' +
    '<label class="fl" style="margin-top:8px">Type</label>' +
    '<select class="fld" id="gTyp">' +
    '<option value=""' + (filter.type === '' ? ' selected' : '') + '>All</option>' +
    '<option value="expense"' + (filter.type === 'expense' ? ' selected' : '') + '>Expense</option>' +
    '<option value="income"' + (filter.type === 'income' ? ' selected' : '') + '>Income</option>' +
    '</select>';
  dialog({
    title: 'Filter entries',
    body: body,
    buttons: [
      { label: 'Clear', cls: 'gho', left: true, close: true, onClick: () => { filter = { text: '', cat: '', type: '' }; renderList(); } },
      { label: 'Cancel', cls: 'gho', close: true },
      {
        label: 'Apply', cls: 'pri', close: true, onClick: () => {
          filter.text = $('#gTxt').value;
          filter.cat = $('#gCat').value;
          filter.type = $('#gTyp').value;
          renderList();
        }
      }
    ]
  });
}

/* ---------- import / export ---------- */

function toCsv() {
  const rows = [['date', 'type', 'category', 'amount', 'note']];
  entries.slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach(e => {
    rows.push([e.date, e.type, e.cat || '', e.amount.toFixed(2), e.note || '']);
  });
  return rows.map(r => r.map(v => {
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
}

function parseCsvLine(line) {
  const out = [];
  let cur2 = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur2 += '"'; i++; } else q = false;
      } else cur2 += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { out.push(cur2); cur2 = ''; }
    else cur2 += ch;
  }
  out.push(cur2);
  return out;
}

function normDate(s) {
  s = (s || '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3] + '-' + pad(+m[2]) + '-' + pad(+m[1]);
  return null;
}

async function doImport(text) {
  text = (text || '').trim();
  if (!text) { toast('Nothing to import'); return; }
  let added = 0;
  try {
    const j = JSON.parse(text);
    const arr = Array.isArray(j) ? j : (j.entries || []);
    if (!Array.isArray(arr)) throw new Error('bad');
    arr.forEach(r => {
      const d = normDate(r.date);
      const a = parseFloat(r.amount);
      if (!d || !isFinite(a) || a <= 0) return;
      entries.push({
        id: uid(), ts: Date.now() + added,
        type: r.type === 'income' ? 'income' : 'expense',
        amount: Math.round(Math.abs(a) * 100) / 100,
        cat: (r.cat || r.category || 'Uncategorised').toString().trim() || 'Uncategorised',
        note: (r.note || '').toString(),
        date: d
      });
      added++;
    });
    if (!Array.isArray(j) && j.budgets && typeof j.budgets === 'object') {
      Object.keys(j.budgets).forEach(c => {
        const v = parseFloat(j.budgets[c]);
        if (isFinite(v) && v >= 0) budgets[c] = Math.round(v * 100) / 100;
      });
      await saveB();
    }
    if (!Array.isArray(j) && typeof j.currency === 'string' && j.currency) {
      cur = j.currency.slice(0, 4);
      await Tool.set(K_C, cur);
      $('#curInp').value = cur;
    }
  } catch (err) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    let start = 0;
    if (lines.length && /date/i.test(lines[0]) && /amount/i.test(lines[0])) start = 1;
    for (let i = start; i < lines.length; i++) {
      const c = parseCsvLine(lines[i]);
      const d = normDate(c[0]);
      const a = parseFloat((c[3] || '').replace(/[^0-9.\-]/g, ''));
      if (!d || !isFinite(a) || a === 0) continue;
      const ty = /inc/i.test(c[1] || '') ? 'income' : 'expense';
      entries.push({
        id: uid(), ts: Date.now() + i,
        type: ty,
        amount: Math.round(Math.abs(a) * 100) / 100,
        cat: (c[2] || 'Uncategorised').trim() || 'Uncategorised',
        note: (c[4] || '').trim(),
        date: d
      });
      added++;
    }
  }
  if (!added) { toast('No valid rows found'); return; }
  await save();
  $('#impTa').value = '';
  renderAll();
  toast('Imported ' + added + ' entries');
}

/* ---------- wiring ---------- */

function setTab(name) {
  tab = name;
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  ['entries', 'charts', 'budgets', 'data'].forEach(t => {
    $('#pane-' + t).style.display = t === name ? '' : 'none';
  });
  renderAll();
}

function wire() {
  $$('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $('#prevM').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderAll(); };
  $('#nextM').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderAll(); };
  $('#monthLbl').onclick = () => { const n = new Date(); view = new Date(n.getFullYear(), n.getMonth(), 1); renderAll(); toast('Jumped to this month'); };
  $('#addBtn').onclick = () => entryDialog(null);
  $('#filtBtn').onclick = filterDialog;

  $('#bSave').onclick = async () => {
    const c = $('#bCat').value.trim();
    const v = parseFloat($('#bAmt').value);
    if (!c) { toast('Enter a category name'); return; }
    if (!isFinite(v) || v < 0) { toast('Enter a valid limit'); return; }
    budgets[c] = Math.round(v * 100) / 100;
    await saveB();
    $('#bCat').value = '';
    $('#bAmt').value = '';
    renderBudgets();
    toast('Budget saved');
  };

  $('#curSave').onclick = async () => {
    cur = ($('#curInp').value || '$').slice(0, 4);
    await Tool.set(K_C, cur);
    renderAll();
    toast('Currency updated');
  };

  $('#expCsv').onclick = () => {
    if (!entries.length) { toast('Nothing to export'); return; }
    download('expenses-' + todayStr() + '.csv', 'text/csv', toCsv());
  };
  $('#expJson').onclick = () => {
    download('expenses-backup-' + todayStr() + '.json', 'application/json',
      JSON.stringify({ version: 1, currency: cur, budgets: budgets, entries: entries }, null, 2));
  };
  $('#copyJson').onclick = () => {
    copyText(JSON.stringify({ version: 1, currency: cur, budgets: budgets, entries: entries }));
    toast('Backup copied');
  };
  $('#impPaste').onclick = async () => {
    const t = await pasteText();
    if (t) { $('#impTa').value = t; toast('Pasted'); } else toast('Clipboard empty');
  };
  $('#impGo').onclick = () => doImport($('#impTa').value);

  $('#wipe').onclick = () => {
    confirmBox('Delete everything', 'This removes <b>all entries and budgets</b> permanently. Export a backup first if you need one.', async () => {
      entries = [];
      budgets = {};
      await Tool.set(K_E, entries);
      await Tool.set(K_B, budgets);
      renderAll();
      toast('All data deleted');
    }, true);
  };
  $('#closeBtn').onclick = () => Tool.close();

  document.addEventListener('keydown', ev => {
    if (ev.key === 'n' && !/input|textarea|select/i.test((ev.target.tagName || '')) && !ev.metaKey && !ev.ctrlKey) {
      ev.preventDefault();
      entryDialog(null);
    }
  });
}

async function init() {
  Tool.title('Expense Tracker');
  try {
    const e = await Tool.get(K_E);
    if (Array.isArray(e)) entries = e.filter(x => x && x.date && typeof x.amount === 'number');
    const b = await Tool.get(K_B);
    if (b && typeof b === 'object') budgets = b;
    const c = await Tool.get(K_C);
    if (typeof c === 'string' && c) cur = c;
  } catch (err) {
    toast('Could not load saved data');
  }
  entries.forEach(x => { if (!x.id) x.id = uid(); if (!x.ts) x.ts = 0; if (!x.type) x.type = 'expense'; });
  $('#curInp').value = cur;
  wire();
  setTab('entries');
}

init();</script>

    const d = await Tool.get(KEY);
    if (d && typeof d === 'object') {
      if (Array.isArray(d.items)) state.items = d.items.filter(i => i && i.id && typeof i.name === 'string');
      if (Array.isArray(d.cats) && d.cats.length) state.cats = d.cats.slice();
      if (d.review && Array.isArray(d.review.queue)) state.review = d.review;
      if (d.final && Array.isArray(d.final.entries)) {
        state.final = d.final;
        if (!Array.isArray(state.final.collapsed)) state.final.collapsed = [];
      }
      if (typeof d.lastCat === 'string') state.lastCat = d.lastCat;
      if (['build', 'review', 'final'].includes(d.view)) state.view = d.view;
    }
  } catch (e) { /* fresh start */ }

  // repair view against reality
  if (state.view === 'review' && !state.review) state.view = state.final ? 'final' : 'build';
  if (state.view === 'final' && !state.final) state.view = 'build';
  if (!state.cats.includes('Uncategorised')) state.cats.unshift('Uncategorised');
}

/* ---------------- helpers ---------------- */

function byId(id) { return state.items.find(i => i.id === id); }

function catIndex(c) {
  const i = state.cats.indexOf(c);
  return i === -1 ? 9999 : i;
}

function catColor(c) {
  // stable hue per category name
  let h = 0;
  for (let i = 0; i < c.length; i++) h = (h * 31 + c.charCodeAt(i)) % 360;
  return 'hsl(' + h + ' 55% 58%)';
}

function plural(n, s, p) { return n + ' ' + (n === 1 ? s : (p || s + 's')); }

/* ---------------- category dropdown ---------------- */

const NEW_CAT = '__new__';

function fillCatSelect(sel, value) {
  sel.innerHTML = state.cats.map(c =>
    '<option value="' + esc(c) + '">' + esc(c) + '</option>'
  ).join('') + '<option value="' + NEW_CAT + '">+ New category\u2026</option>';
  sel.value = state.cats.includes(value) ? value : state.cats[0];
}

function promptNewCategory(cb) {
  dialog({
    title: 'New category',
    body: '<label class="fl">Name</label><input class="fld" id="ncName" placeholder="e.g. Snacks" autocomplete="off" style="width:100%">',
    buttons: [
      { label: 'Cancel', cls: 'gho', close: true, left: true },
      {
        label: 'Create', cls: 'pri', onClick: (node) => {
          const v = (node.querySelector('#ncName').value || '').trim();
          if (!v) { toast('Enter a name'); return; }
          if (state.cats.some(c => c.toLowerCase() === v.toLowerCase())) {
            const existing = state.cats.find(c => c.toLowerCase() === v.toLowerCase());
            toast('Already exists');
            cb(existing);
            return true;
          }
          state.cats.push(v);
          save();
          cb(v);
          toast('Added \u201c' + v + '\u201d');
          return true;
        }, close: true
      }
    ],
    onOpen: (node) => {
      const inp = node.querySelector('#ncName');
      if (inp) {
        inp.focus();
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const b = node.querySelector('.btn.pri');
            if (b) b.click();
          }
        });
      }
    }
  });
}

function wireCatSelect(sel, onPick) {
  sel.addEventListener('change', () => {
    if (sel.value === NEW_CAT) {
      const prev = onPick ? onPick.current() : state.lastCat;
      sel.value = state.cats.includes(prev) ? prev : state.cats[0];
      promptNewCategory((name) => {
        fillCatSelect(sel, name);
        sel.value = name;
        if (onPick && onPick.set) onPick.set(name);
        refreshAllCatSelects(sel);
      });
    } else if (onPick && onPick.set) {
      onPick.set(sel.value);
    }
  });
}

function refreshAllCatSelects(except) {
  $$('select[data-cats]').forEach(s => {
    if (s === except) return;
    const v = s.value;
    fillCatSelect(s, v);
  });
}

/* ---------------- BUILD view ---------------- */

const inName = $('#inName');
const inCat = $('#inCat');
const inQty = $('#inQty');

inCat.setAttribute('data-cats', '1');

function renderBuild() {
  const wrap = $('#itemList');
  const q = filterTxt.trim().toLowerCase();
  let list = state.items.slice();
  if (q) list = list.filter(i => i.name.toLowerCase().includes(q) || i.cat.toLowerCase().includes(q));

  if (sortMode === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
  else if (sortMode === 'cat') list.sort((a, b) => (catIndex(a.cat) - catIndex(b.cat)) || a.name.localeCompare(b.name));

  $('#itemStats').textContent = state.items.length
    ? plural(state.items.length, 'item') + ' \u00b7 ' + plural(new Set(state.items.map(i => i.cat)).size, 'category', 'categories') +
      (q ? ' \u00b7 ' + list.length + ' shown' : '')
    : '';

  if (!list.length) {
    wrap.innerHTML = '<div class="empty">' +
      (state.items.length ? 'Nothing matches that filter.' : 'No items yet. Add everything you might want \u2014 you decide what actually gets bought in the Review step.') +
      '</div>';
    return;
  }

  wrap.innerHTML = list.map(i =>
    '<div class="it" data-id="' + esc(i.id) + '">' +
      '<span class="dot" style="background:' + catColor(i.cat) + '"></span>' +
      '<div class="grow">' +
        '<div class="nm">' + esc(i.name) + '</div>' +
        '<div class="meta"><span class="chip">' + esc(i.cat) + '</span>' +
          (i.qty ? ' <span class="qty">' + esc(i.qty) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<button class="icobtn" data-act="edit" title="Edit">\u270e</button>' +
      '<button class="icobtn dgr" data-act="del" title="Delete">\u2715</button>' +
    '</div>'
  ).join('');
}

function addItem() {
  const name = (inName.value || '').trim();
  if (!name) { inName.focus(); return; }
  const cat = state.cats.includes(inCat.value) ? inCat.value : 'Uncategorised';
  const qty = (inQty.value || '').trim();

  state.items.push({ id: uid(), name, cat, qty });
  state.lastCat = cat;
  inName.value = '';
  inQty.value = '';
  inName.focus();
  save();
  renderBuild();
}

function editItem(id) {
  const it = byId(id);
  if (!it) return;
  const selId = 'ed' + uid();
  dialog({
    title: 'Edit item',
    body:
      '<label class="fl">Name</label><input class="fld" id="edName" style="width:100%" autocomplete="off">' +
      '<label class="fl" style="margin-top:8px">Category</label><select class="fld" id="' + selId + '" data-cats="1" style="width:100%"></select>' +
      '<label class="fl" style="margin-top:8px">Quantity / note</label><input class="fld" id="edQty" style="width:100%" autocomplete="off">',
    buttons: [
      { label: 'Cancel', cls: 'gho', close: true, left: true },
      {
        label: 'Save', cls: 'pri', close: true, onClick: (node) => {
          const n = (node.querySelector('#edName').value || '').trim();
          if (!n) { toast('Name cannot be empty'); return; }
          it.name = n;
          const s = node.querySelector('#' + selId);
          it.cat = state.cats.includes(s.value) ? s.value : it.cat;
          it.qty = (node.querySelector('#edQty').value || '').trim();
          save();
          renderBuild();
          return true;
        }
      }
    ],
    onOpen: (node) => {
      node.querySelector('#edName').value = it.name;
      node.querySelector('#edQty').value = it.qty || '';
      const s = node.querySelector('#' + selId);
      fillCatSelect(s, it.cat);
      let cur = it.cat;
      wireCatSelect(s, { current: () => cur, set: (v) => { cur = v; } });
      node.querySelector('#edName').focus();
    }
  });
}

$('#btnAdd').addEventListener('click', addItem);
inName.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addItem(); } });
inQty.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addItem(); } });

$('#inFilter').addEventListener('input', e => { filterTxt = e.target.value; renderBuild(); });
$('#inSort').addEventListener('change', e => { sortMode = e.target.value; renderBuild(); });

$('#itemList').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const row = btn.closest('.it');
  const id = row && row.dataset.id;
  if (!id) return;
  if (btn.dataset.act === 'del') {
    const it = byId(id);
    confirmBox('Delete item', 'Remove <strong>' + esc(it ? it.name : '') + '</strong> from your list?', () => {
      state.items = state.items.filter(x => x.id !== id);
      save();
      renderBuild();
    }, true);
  } else {
    editItem(id);
  }
});

$('#btnClearItems').addEventListener('click', () => {
  if (!state.items.length) { toast('Nothing to clear'); return; }
  confirmBox('Clear all items', 'This deletes all <strong>' + state.items.length + '</strong> items. Categories are kept.', () => {
    state.items = [];
    state.review = null;
    state.final = null;
    save();
    renderBuild();
    setView('build');
    toast('Cleared');
  }, true);
});

/* ---------------- categories manager ---------------- */

function renderCatRows(node) {
  const box = node.querySelector('#catBox');
  const counts = {};
  state.items.forEach(i => { counts[i.cat] = (counts[i.cat] || 0) + 1; });
  box.innerHTML = state.cats.map(c =>
    '<div class="catrow" data-cat="' + esc(c) + '">' +
      '<span class="dot" style="background:' + catColor(c) + '"></span>' +
      '<span class="grow">' + esc(c) + '</span>' +
      '<span class="cnt hint">' + (counts[c] || 0) + '</span>' +
      (c === 'Uncategorised' ? '<span style="width:30px"></span>'
        : '<button class="icobtn dgr" data-act="delcat" title="Delete category">\u2715</button>') +
    '</div>'
  ).join('');
}

$('#btnCats').addEventListener('click', () => {
  dialog({
    title: 'Categories',
    body:
      '<div class="row"><input class="fld grow" id="newCat" placeholder="New category name" autocomplete="off">' +
      '<button class="btn pri" id="addCat">Add</button></div>' +
      '<div id="catBox" style="margin-top:10px;max-height:46vh;overflow:auto"></div>' +
      '<div class="hint" style="margin-top:8px">Deleting a category moves its items to Uncategorised.</div>',
    buttons: [{ label: 'Done', cls: 'pri', close: true }],
    onOpen: (node) => {
      renderCatRows(node);
      const add = () => {
        const v = (node.querySelector('#newCat').value || '').trim();
        if (!v) return;
        if (state.cats.some(c => c.toLowerCase() === v.toLowerCase())) { toast('Already exists'); return; }
        state.cats.push(v);
        node.querySelector('#newCat').value = '';
        save();
        renderCatRows(node);
        refreshAllCatSelects();
      };
      node.querySelector('#addCat').addEventListener('click', add);
      node.querySelector('#newCat').addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); add(); }
      });
      node.querySelector('#catBox').addEventListener('click', e => {
        const b = e.target.closest('button[data-act="delcat"]');
        if (!b) return;
        const cat = b.closest('.catrow').dataset.cat;
        const n = state.items.filter(i => i.cat === cat).length;
        confirmBox('Delete category',
          'Delete <strong>' + esc(cat) + '</strong>?' + (n ? ' ' + plural(n, 'item') + ' will move to Uncategorised.' : ''),
          () => {
            state.cats = state.cats.filter(c => c !== cat);
            state.items.forEach(i => { if (i.cat === cat) i.cat = 'Uncategorised'; });
            if (state.lastCat === cat) state.lastCat = 'Uncategorised';
            save();
            renderCatRows(node);
            refreshAllCatSelects();
            renderBuild();
          }, true);
      });
    }
  });
});

/* ---------------- REVIEW view ---------------- */

$('#btnGenerate').addEventListener('click', () => {
  if (!state.items.length) { toast('Add some items first'); return; }
  const start = () => {
    state.review = { queue: state.items.map(i => i.id), idx: 0, picked: [] };
    state.final = null;
    save();
    setView('review');
  };
  if (state.final || (state.review && state.review.idx > 0)) {
    confirmBox('Start over', 'This clears the current review / generated list and starts again from the top.', start, false);
  } else {
    start();
  }
});

function reviewDecide(keep) {
  const r = state.review;
  if (!r || r.idx >= r.queue.length) return;
  const id = r.queue[r.idx];
  if (keep && !r.picked.includes(id)) r.picked.push(id);
  r.idx++;
  if (r.idx >= r.queue.length) finishReview();
  else { save(); renderReview(); }
}

function reviewBack() {
  const r = state.review;
  if (!r || r.idx === 0) return;
  r.idx--;
  const id = r.queue[r.idx];
  r.picked = r.picked.filter(x => x !== id);
  save();
  renderReview();
}

function finishReview() {
  const r = state.review;
  const entries = r.picked.map(id => {
    const it = byId(id);
    if (!it) return null;
    return { id: it.id, name: it.name, cat: it.cat, qty: it.qty || '', done: false };
  }).filter(Boolean);

  state.final = { entries, collapsed: [], at: Date.now() };
  state.review = null;
  save();
  setView('final');
  toast(entries.length ? plural(entries.length, 'item') + ' on your list' : 'You said no to everything!');
}

function renderReview() {
  const wrap = $('#reviewWrap');
  const r = state.review;
  if (!r) {
    wrap.innerHTML = '<div class="empty">No review in progress. Go to <strong>Items</strong> and hit Generate Shopping List.</div>';
    return;
  }
  const total = r.queue.length;
  const it = byId(r.queue[r.idx]);
  if (!it) { // item deleted mid-review
    r.queue.splice(r.idx, 1);
    if (r.idx >= r.queue.length) { finishReview(); return; }
    renderReview();
    return;
  }
  const pct = Math.round((r.idx / total) * 100);

  wrap.innerHTML =
    '<div class="rvcard">' +
      '<div class="rvprog"><i style="width:' + pct + '%"></i></div>' +
      '<div class="rvcount">' + (r.idx + 1) + ' / ' + total + ' \u00b7 ' + r.picked.length + ' kept</div>' +
      '<div class="rvname">' + esc(it.name) + '</div>' +
      '<div class="rvmeta">' +
        '<span class="dot" style="background:' + catColor(it.cat) + '"></span>' +
        '<span class="chip">' + esc(it.cat) + '</span>' +
        (it.qty ? '<span class="qty">' + esc(it.qty) + '</span>' : '') +
      '</div>' +
      '<div class="rvbtns">' +
        '<button class="bigbtn no" id="rvNo" title="Skip (\u2190)">\u2715</button>' +
        '<button class="bigbtn yes" id="rvYes" title="Add (\u2192)">\u2713</button>' +
      '</div>' +
      '<div class="rvfoot">' +
        '<button class="btn gho sm" id="rvBack"' + (r.idx === 0 ? ' disabled' : '') + '>\u21b6 Undo</button>' +
        '<button class="btn gho sm" id="rvRest">Finish now</button>' +
        '<button class="btn gho sm" id="rvAll">Keep all remaining</button>' +
        '<button class="btn dgr sm" id="rvCancel">Cancel</button>' +
      '</div>' +
      '<div class="hint" style="margin-top:10px">Keyboard: \u2190 skip \u00b7 \u2192 or Space keep \u00b7 Backspace undo</div>' +
    '</div>';

  $('#rvYes').addEventListener('click', () => reviewDecide(true));
  $('#rvNo').addEventListener('click', () => reviewDecide(false));
  $('#rvBack').addEventListener('click', reviewBack);
  $('#rvRest').addEventListener('click', () => {
    confirmBox('Finish now', 'Build the list from the ' + plural(r.picked.length, 'item') + ' kept so far?', finishReview, false);
  });
  $('#rvAll').addEventListener('click', () => {
    for (let i = r.idx; i < r.queue.length; i++) {
      if (!r.picked.includes(r.queue[i])) r.picked.push(r.queue[i]);
    }
    r.idx = r.queue.length;
    finishReview();
  });
  $('#rvCancel').addEventListener('click', () => {
    confirmBox('Cancel review', 'Discard this run? Your items are kept.', () => {
      state.review = null;
      save();
      setView('build');
    }, true);
  });
}

document.addEventListener('keydown', e => {
  if (state.view !== 'review' || !state.review) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
  if (document.querySelector('.dlg, .modal, dialog[open]')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); reviewDecide(true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); reviewDecide(false); }
  else if (e.key === 'Backspace') { e.preventDefault(); reviewBack(); }
});

/* ---------------- FINAL view ---------------- */

function renderFinal() {
  const wrap = $('#finalWrap');
  const f = state.final;
  if (!f) {
    wrap.innerHTML = '<div class="empty">No shopping list yet. Add items, then press <strong>Generate Shopping List</strong>.</div>';
    return;
  }
  if (!f.entries.length) {
    wrap.innerHTML = '<div class="warnbox">You skipped every item, so the list is empty.</div>' +
      '<div class="row" style="margin-top:12px"><button class="btn pri grow" id="fnReset">Run through again</button></div>';
    $('#fnReset').addEventListener('click', resetRun);
    return;
  }

  const groups = {};
  f.entries.forEach(e => { (groups[e.cat] = groups[e.cat] || []).push(e); });
  const catNames = Object.keys(groups).sort((a, b) => (catIndex(a) - catIndex(b)) || a.localeCompare(b));

  const done = f.entries.filter(e => e.done).length;
  const total = f.entries.length;
  const pct = Math.round((done / total) * 100);

  let html =
    '<div class="card">' +
      '<div class="sumbar">' +
        '<div class="pb"><i style="width:' + pct + '%"></i></div>' +
        '<div class="pct">' + done + '/' + total + '</div>' +
      '</div>' +
      '<div class="hint">' + (done === total ? 'All done \u2014 nice one.' : plural(total - done, 'item') + ' left \u00b7 tap a category header to collapse it.') + '</div>' +
    '</div>';

  html += '<div style="margin-top:10px">' + catNames.map(c => {
    const rows = groups[c];
    const cd = rows.filter(r => r.done).length;
    const min = f.collapsed.includes(c);
    return '<div class="grp' + (min ? ' min' : '') + '" data-cat="' + esc(c) + '">' +
      '<div class="grph" data-act="toggle">' +
        '<span class="caret">\u25bc</span>' +
        '<span class="dot" style="background:' + catColor(c) + '"></span>' +
        '<span class="cname grow">' + esc(c) + '</span>' +
        '<span class="cnt">' + cd + '/' + rows.length + '</span>' +
      '</div>' +
      '<div class="grpb">' + rows.map(r =>
        '<div class="li' + (r.done ? ' done' : '') + '" data-id="' + esc(r.id) + '">' +
          '<span class="box">' + (r.done ? '\u2713' : '') + '</span>' +
          '<span class="lnm grow">' + esc(r.name) + '</span>' +
          (r.qty ? '<span class="qty">' + esc(r.qty) + '</span>' : '') +
        '</div>'
      ).join('') + '</div>' +
    '</div>';
  }).join('') + '</div>';

  html +=
    '<div class="row" style="margin-top:14px;flex-wrap:wrap;gap:8px">' +
      '<button class="btn pri grow" id="fnReset">Reset &amp; run again</button>' +
      '<button class="btn gho" id="fnUncheck">Untick all</button>' +
      '<button class="btn gho" id="fnCopy">Copy</button>' +
      '<button class="btn gho" id="fnDl">Download</button>' +
    '</div>';

  wrap.innerHTML = html;

  wrap.querySelectorAll('.grph').forEach(h => {
    h.addEventListener('click', () => {
      const cat = h.closest('.grp').dataset.cat;
      if (f.collapsed.includes(cat)) f.collapsed = f.collapsed.filter(x => x !== cat);
      else f.collapsed.push(cat);
      save();
      renderFinal();
    });
  });

  wrap.querySelectorAll('.li').forEach(li => {
    li.addEventListener('click', () => {
      const en = f.entries.find(e => e.id === li.dataset.id);
      if (!en) return;
      en.done = !en.done;
      save();
      renderFinal();
    });
  });

  $('#fnReset').addEventListener('click', resetRun);
  $('#fnUncheck').addEventListener('click', () => {
    f.entries.forEach(e => { e.done = false; });
    save();
    renderFinal();
    toast('All unticked');
  });
  $('#fnCopy').addEventListener('click', () => {
    copyText(listAsText());
    toast('Copied');
  });
  $('#fnDl').addEventListener('click', () => {
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    download('shopping-list-' + stamp + '.txt', 'text/plain', listAsText());
  });
}

function listAsText() {
  const f = state.final;
  if (!f) return '';
  const groups = {};
  f.entries.forEach(e => { (groups[e.cat] = groups[e.cat] || []).push(e); });
  return Object.keys(groups)
    .sort((a, b) => (catIndex(a) - catIndex(b)) || a.localeCompare(b))
    .map(c => c.toUpperCase() + '\n' + groups[c].map(e =>
      '  [' + (e.done ? 'x' : ' ') + '] ' + e.name + (e.qty ? ' (' + e.qty + ')' : '')
    ).join('\n')).join('\n\n');
}

function resetRun() {
  confirmBox('Reset list', 'Clear the ticks and run through all <strong>' + state.items.length + '</strong> items again?', () => {
    if (!state.items.length) { toast('No items to review'); setView('build'); return; }
    state.final = null;
    state.review = { queue: state.items.map(i => i.id), idx: 0, picked: [] };
    save();
    setView('review');
  }, false);
}

$('#btnImport').addEventListener('click', () => {

      {

/* ---------------- views ---------------- */

function setView(v) {

(async function boot() {

let sel=['A','AAAA','MX','TXT','NS'];
function chips(){
  $('#types').innerHTML=TYPES.map(t=>'<button class="tchip'+(sel.includes(t)?' on':'')+'" data-t="'+t+'">'+t+'</button>').join('');

<script type="text/x-tool" data-id="speed" data-part="js">
const DOWN='https://speed.cloudflare.com/__down?bytes=',UP='https://speed.cloudflare.com/__up';
let running=false,hist=[];
function dial(v,label,max){
  const pct=Math.min(1,Math.log10(1+Math.max(0,v))/Math.log10(1+(max||500)));
  $('#arc').style.strokeDashoffset=270-270*pct;
  $('#nowv').textContent=v>=100?v.toFixed(0):v.toFixed(1);
  $('#nowl').textContent=label;
}
async function ping(n){
  const t=[];
  for(let i=0;i<n;i++){const s=performance.now();
    try{await fetch(DOWN+'1&r='+Math.random(),{cache:'no-store'})}catch(e){}
    t.push(performance.now()-s)}
  t.sort((a,b)=>a-b);
  const med=t[Math.floor(t.length/2)];
  const jit=t.reduce((a,x)=>a+Math.abs(x-med),0)/t.length;
  return [med,jit];
}
async function down(){
  const sizes=[1e6,5e6,1e7,2.5e7];let best=0;
  for(const sz of sizes){
    const s=performance.now();
    try{const r=await fetch(DOWN+sz+'&r='+Math.random(),{cache:'no-store'});
      const rd=r.body?r.body.getReader():null;let got=0;
      if(rd){for(;;){const {done,value}=await rd.read();if(done)break;got+=value.length;
        const el=(performance.now()-s)/1000;if(el>0.35){const mb=got*8/1e6/el;dial(mb,'download')}}}
      else{got=(await r.arrayBuffer()).byteLength}
      const el=(performance.now()-s)/1000;const mb=got*8/1e6/el;
      if(mb>best)best=mb;dial(best,'download');
      if(el>7)break;
    }catch(e){}
  }
  return best;
}
async function up(){
  const sizes=[5e5,2e6,6e6];let best=0;
  for(const sz of sizes){
    const buf=new Uint8Array(sz);
    const s=performance.now();
    try{await fetch(UP,{method:'POST',body:buf,cache:'no-store'});
      const el=(performance.now()-s)/1000;const mb=sz*8/1e6/el;
      if(mb>best)best=mb;dial(best,'upload');
      if(el>7)break;
    }catch(e){}
  }
  return best;
}
async function run(){
  if(running)return;running=true;$('#go').disabled=true;$('#go').textContent='Testing…';
  ['#rdl','#rul','#rpg','#rjt'].forEach(s=>$(s).textContent='—');
  dial(0,'latency');
  const [p,j]=await ping(9);
  $('#rpg').textContent=p.toFixed(0);$('#rjt').textContent=j.toFixed(1);
  dial(0,'download');
  const d=await down(); $('#rdl').textContent=d>=100?d.toFixed(0):d.toFixed(1);
  dial(0,'upload');
  const u=await up(); $('#rul').textContent=u>=100?u.toFixed(0):u.toFixed(1);
  dial(d,'download');
  hist.unshift({t:Date.now(),d,u,p,j});hist=hist.slice(0,20);await Tool.set('hist',hist);drawHist();
  $('#go').disabled=false;$('#go').textContent='Test again';running=false;
}
function drawHist(){
  if(!hist.length)return $('#hist').innerHTML='';
  $('#hist').innerHTML='<label class="fl">Recent tests</label>'+hist.map(h=>
    '<div class="hrow"><span>'+new Date(h.t).toLocaleString()+'</span>'+
    '<b>'+h.d.toFixed(1)+'</b><small style="color:var(--dim2)">down</small>'+
    '<b>'+h.u.toFixed(1)+'</b><small style="color:var(--dim2)">up</small>'+
    '<b>'+h.p.toFixed(0)+'</b><small style="color:var(--dim2)">ms</small></div>').join('')+
    '<button class="btn gho sm" id="clh" style="margin-top:10px">Clear history</button>';
  $('#clh').onclick=async()=>{hist=[];await Tool.set('hist',[]);drawHist()};
}
$('#go').onclick=run;
$('#meta').textContent=(navigator.connection&&navigator.connection.effectiveType)?
  'Browser reports a '+navigator.connection.effectiveType+' connection'+
  (navigator.connection.downlink?' (~'+navigator.connection.downlink+' Mbps estimate)':''):'';
(async()=>{hist=(await Tool.get('hist'))||[];drawHist()})();

<script type="text/x-tool" data-id="rss" data-part="js">
const PROXIES=['https://api.allorigins.win/raw?url=','https://corsproxy.io/?url='];

async function fetchFeed(url){
  let txt=null;
  for(const p of PROXIES){
    try{const r=await fetch(p+encodeURIComponent(url));if(!r.ok)continue;
      const t=await r.text();if(t&&t.length>40){txt=t;break}}catch(e){}
  }
  if(!txt)throw new Error('unreachable');
  const doc=new DOMParser().parseFromString(txt,'text/xml');
  if(doc.querySelector('parsererror'))throw new Error('bad xml');
  const title=(doc.querySelector('channel>title,feed>title')||{}).textContent||url;
  const nodes=[...doc.querySelectorAll('item,entry')];
  const out=nodes.map(n=>{
    const g=s=>{const e=n.querySelector(s);return e?e.textContent.trim():''};
    let link=g('link');
    if(!link){const l=n.querySelector('link[href]');if(l)link=l.getAttribute('href')}

(async()=>{

      extra.map(o=>'<option'+(cur===o?' selected':'')+'>'+o+'</option>').join('')+'</select></div>';

    return '<div><label class="fl">'+label+'</label><input class="fld" data-k="'+key+'" value="'+esc(cur)+'" placeholder="'+esc(extra||'')+'"></div>';
  }).join('');
  $$('#form [data-k]').forEach(e=>{const h=()=>{vals[kind][e.dataset.k]=e.type==='checkbox'?e.checked:e.value;gen();save()};
    e.oninput=h;e.onchange=h});
}
function gen(){
  const txt=payload();
  const cv=$('#cv'),ctx=cv.getContext('2d');
  if(!txt.trim()){cv.width=cv.height=300;ctx.fillStyle=opts.cl;ctx.fillRect(0,0,300,300);
    ctx.fillStyle='#9aa5b1';ctx.font='14px sans-serif';ctx.textAlign='center';
    ctx.fillText('Fill in the fields',150,150);$('#qm').textContent='';return}
  let q;try{q=qrEncode(txt,opts.ec)}catch(e){$('#qm').textContent=e.message;return}
  const qz=opts.qz,total=q.size+qz*2,scale=Math.max(2,Math.floor(1200/total));
  cv.width=cv.height=total*scale;
  ctx.fillStyle=opts.cl;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle=opts.cd;
  for(let r=0;r<q.size;r++)for(let c=0;c<q.size;c++)
    if(q.matrix[r][c])ctx.fillRect((c+qz)*scale,(r+qz)*scale,scale,scale);
  $('#qm').textContent='Version '+q.version+' · '+q.size+'×'+q.size+' modules · '+q.bytes+' bytes · EC '+opts.ec;
  cv._q=q;
}
function svgOut(){
  const q=$('#cv')._q;if(!q)return'';const qz=opts.qz,t=q.size+qz*2;let p='';
  for(let r=0;r<q.size;r++)for(let c=0;c<q.size;c++)if(q.matrix[r][c])p+='M'+(c+qz)+' '+(r+qz)+'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+t+' '+t+'" shape-rendering="crispEdges">'+
    '<rect width="'+t+'" height="'+t+'" fill="'+opts.cl+'"/><path d="'+p+'" fill="'+opts.cd+'"/></svg>';
}
function save(){Tool.set('state',{kind,vals,opts})}
$('#kinds').innerHTML=KINDS.map(k=>'<button data-k="'+k.id+'">'+k.label+'</button>').join('');
$$('#kinds button').forEach(b=>b.onclick=()=>{kind=b.dataset.k;
  $$('#kinds button').forEach(x=>x.classList.toggle('on',x===b));form();gen();save()});
['ec','qz','cd','cl'].forEach(id=>$('#'+id).onchange=e=>{
  opts[id]=id==='qz'?parseInt(e.target.value)||0:e.target.value;gen();save()});
$('#png').onclick=()=>{const a=document.createElement('a');a.download='qr-'+kind+'.png';
  a.href=$('#cv').toDataURL('image/png');a.click();toast('PNG downloaded')};
$('#svg').onclick=()=>download('qr-'+kind+'.svg','image/svg+xml',svgOut());
$('#cp').onclick=()=>copyText(payload());
(async()=>{
  const s=await Tool.get('state');
  if(s){kind=s.kind;vals=s.vals||{};opts=Object.assign(opts,s.opts||{})}
  else{const h=await Tool.href();vals.url={v:h}}
  $('#ec').value=opts.ec;$('#qz').value=opts.qz;$('#cd').value=opts.cd;$('#cl').value=opts.cl;
  $$('#kinds button').forEach(x=>x.classList.toggle('on',x.dataset.k===kind));
  form();gen();
})();
</script>
