<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Toolbox</title>
<style>
/* ---------- Design tokens ---------- */
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --ink:#111114;
  --ink2:#6E6E76;
  --ink3:#A6A6AE;
  --accent:#0A84FF;
  --accent-ink:#0060DF;
  --green:#30A46C;
  --red:#E5484D;
  --line:rgba(60,60,67,.14);
  --line-soft:rgba(60,60,67,.08);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --shadow-tile:0 1px 2px rgba(16,24,40,.05), 0 10px 24px -14px rgba(16,24,40,.35);
  --shadow-pop:0 8px 40px -8px rgba(16,24,40,.28), 0 1px 3px rgba(16,24,40,.08);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);font-size:16px;line-height:1.45;color:var(--ink);
  background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- Home ---------- */
#home{min-height:100%;padding-bottom:calc(40px + var(--sab))}
.hdr{
  position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 14px) 20px 10px;
  background:rgba(242,242,247,.82);backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
.hdr.scrolled{border-bottom-color:var(--line-soft)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr h1{margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.024em}
.hdr-sub{margin:2px 0 0;font-size:13.5px;color:var(--ink2);letter-spacing:-.01em}
.icon-btn{
  width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;
  border:0;border-radius:50%;background:rgba(120,120,128,.12);cursor:pointer;
  transition:transform .15s,background .15s;
}
.icon-btn:active{transform:scale(.9);background:rgba(120,120,128,.2)}
.icon-btn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.search{
  position:relative;margin-top:12px;
}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round}
.search input{
  width:100%;height:38px;padding:0 12px 0 34px;border:0;border-radius:11px;
  background:rgba(118,118,128,.12);font:inherit;font-size:16px;color:var(--ink);
}
.search input::placeholder{color:var(--ink3)}
.search input:focus{outline:none;background:rgba(118,118,128,.16)}

.sec{margin-top:22px}
.sec-head{display:flex;align-items:baseline;gap:8px;padding:0 20px 10px}
.sec-head h2{margin:0;font-size:19px;font-weight:680;letter-spacing:-.018em}
.sec-head .count{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.row{
  display:flex;gap:16px;overflow-x:auto;padding:2px 20px 6px;
  scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.row::-webkit-scrollbar{display:none}
.tile{
  flex:0 0 auto;width:92px;scroll-snap-align:start;
  background:none;border:0;padding:0;cursor:pointer;text-align:center;
}
.tile .art{
  width:76px;height:76px;margin:0 auto 9px;border-radius:20px;overflow:hidden;
  background:var(--card);box-shadow:var(--shadow-tile);
  display:grid;place-items:center;position:relative;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;
}
.tile:hover .art{transform:translateY(-2px)}
.tile:active .art{transform:scale(.92)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .glyph{font-size:34px;line-height:1}
.tile .lbl{
  display:block;font-size:12.5px;font-weight:590;letter-spacing:-.008em;line-height:1.25;
  color:var(--ink);word-break:break-word;
}
.pin-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px #fff}
.empty{padding:60px 24px;text-align:center;color:var(--ink2)}
.empty strong{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}

/* ---------- Runner ---------- */
#runner{
  position:fixed;inset:0;z-index:40;background:var(--card);
  display:flex;flex-direction:column;
}
#runner[hidden]{display:none}
#runner.in{animation:slideIn .28s cubic-bezier(.32,.72,0,1)}
@keyframes slideIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
#runbar{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  height:calc(var(--sat) + 48px);padding:var(--sat) 12px 0;
  background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid var(--line-soft);z-index:2;
}
#backBtn{
  display:flex;align-items:center;gap:3px;height:34px;padding:0 12px 0 7px;
  border:0;border-radius:17px;background:rgba(120,120,128,.1);color:var(--accent);
  font-size:15px;font-weight:590;letter-spacing:-.01em;cursor:pointer;transition:transform .15s
}
#backBtn:active{transform:scale(.94)}
#backBtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#runtitle{font-size:15px;font-weight:640;letter-spacing:-.012em;margin-left:2px}
#runnerBody{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch}
.runerr{margin:24px;padding:16px;border-radius:var(--r-md);background:#FFF1F1;border:1px solid #FFD5D5;color:#8B1A1E;font-family:var(--mono);font-size:13px;white-space:pre-wrap}

/* ---------- Shared floating UI ---------- */
.menu{
  position:fixed;z-index:200;min-width:214px;padding:6px;
  background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(28px);
  -webkit-backdrop-filter:saturate(180%) blur(28px);
  border:1px solid var(--line-soft);border-radius:var(--r-md);box-shadow:var(--shadow-pop);
  animation:pop .16s cubic-bezier(.2,.9,.3,1);transform-origin:top left;
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.menu[hidden]{display:none}
.menu button{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;
  border:0;background:none;border-radius:8px;font-size:14.5px;letter-spacing:-.01em;
  text-align:left;cursor:pointer
}
.menu button:hover{background:rgba(10,132,255,.1)}
.menu button.danger{color:var(--red)}
.menu button.danger:hover{background:rgba(229,72,77,.1)}
.menu button:disabled{opacity:.35;cursor:default;background:none}
.menu .sep{height:1px;margin:5px 8px;background:var(--line-soft)}
.menu .cap{padding:6px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}

#toast{
  position:fixed;left:50%;bottom:calc(28px + var(--sab));transform:translate(-50%,16px);
  z-index:300;padding:11px 18px;border-radius:22px;
  background:rgba(20,20,24,.92);color:#fff;font-size:14.5px;font-weight:560;letter-spacing:-.01em;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  backdrop-filter:blur(20px);max-width:80vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

.scrim{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.28);animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<!-- ===== Home ===== -->
<div id="home">
  <header class="hdr" id="hdr">
    <div class="hdr-row">
      <div>
        <h1>Toolbox</h1>
        <p class="hdr-sub" id="hdrSub"></p>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Library options">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="search" type="search" placeholder="Search tools" autocomplete="off" spellcheck="false">
    </div>
  </header>
  <main id="sections"></main>
</div>

<!-- ===== Full-screen tool runner ===== -->
<div id="runner" hidden>
  <div id="runbar">
    <button id="backBtn"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>Tools</button>
    <span id="runtitle"></span>
  </div>
  <div id="runnerBody"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="menu" class="menu" hidden></div>

<style>
/* ---------- Dialogs ---------- */
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:160;
  width:min(420px,calc(100vw - 40px));padding:22px;border-radius:20px;background:#fff;
  box-shadow:0 24px 70px -20px rgba(16,24,40,.5);animation:rise .22s cubic-bezier(.2,.9,.3,1)
}
@keyframes rise{from{transform:translate(-50%,-46%);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
.modal h3{margin:0 0 4px;font-size:19px;font-weight:680;letter-spacing:-.018em}
.modal p{margin:0 0 16px;font-size:14px;color:var(--ink2);line-height:1.5}
.modal input,.modal textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;
  font:inherit;font-size:16px;color:var(--ink);background:#fff
}
.modal textarea{font-family:var(--mono);font-size:13px;min-height:110px;resize:vertical}
.modal input:focus,.modal textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}
.modal .opts{max-height:44vh;overflow:auto;margin:-4px 0 4px}
.modal .opts button{
  display:block;width:100%;padding:11px 13px;margin-bottom:6px;border:1px solid var(--line);
  border-radius:12px;background:#fff;font-size:15px;text-align:left;cursor:pointer
}
.modal .opts button:hover{border-color:var(--accent);color:var(--accent)}
.modal .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.modal .acts button{padding:10px 18px;border:0;border-radius:12px;font-size:15px;font-weight:590;cursor:pointer}
.modal .acts .ghost{background:rgba(120,120,128,.12)}
.modal .acts .primary{background:var(--accent);color:#fff}
.modal .acts .primary.danger{background:var(--red)}
.modal .acts button:active{transform:scale(.97)}
</style>

<script>
/* =========================================================================
   Toolbox runtime
   The `tools` object is the single source of truth:
     tools[subcategory][toolName] = { html, js, icon }
   It is persisted to localStorage, so edits survive a refresh.
   ========================================================================= */

const STORAGE_KEY = 'toolbox.library.v1';

let tools  = {};   // subcategory -> toolName -> { html, js, icon }
let pinned = [];   // ["Subcategory/Tool Name", ...]

/* The built-in tools. Edited copies are cached; these are the fallback the
   library is (re)seeded from on first run or after resetToolbox(). */
const DEFAULT_PINNED = ["Workshop/Edit Tools", "Security/Password Generator"];
const DEFAULT_LIBRARY = {
  "Security": {
    "Password Generator": {
      "icon": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0Ij48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImdfcGFzc3dvcmQiIHgxPSIwIiB5MT0iMCIgeDI9IjAiIHkyPSIxIj48c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiM0QkQwOEIiLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiMxMjgwNUMiLz48L2xpbmVhckdyYWRpZW50PjwvZGVmcz48cmVjdCB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHJ4PSIxNSIgZmlsbD0idXJsKCNnX3Bhc3N3b3JkKSIvPjxnIHRyYW5zZm9ybT0idHJhbnNsYXRlKDE0LDE0KSBzY2FsZSgxLjUpIiBmaWxsPSJub25lIiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iMS45IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxjaXJjbGUgY3g9IjE2IiBjeT0iOCIgcj0iMy45Ii8+PHBhdGggZD0iTTEzLjMgMTAuOCA0LjIgMTkuOSIvPjxwYXRoIGQ9Im03IDE2LjYgMi42IDIuNiIvPjxwYXRoIGQ9Im05LjcgMTMuOSAyLjYgMi42Ii8+PC9nPjwvc3ZnPg==",
      "html": "<div id=\"pw\">\n<style>\n  #pw{padding:34px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #pw .wrap{width:100%;max-width:520px}\n  #pw .eyebrow{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A6A6AE;text-align:center}\n  #pw .out{\n    display:block;width:100%;min-height:104px;padding:22px 20px;border:1px solid rgba(60,60,67,.1);\n    border-radius:20px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.04),0 14px 30px -22px rgba(16,24,40,.5);\n    font-family:ui-monospace,SFMono-Regular,\"SF Mono\",Menlo,Consolas,monospace;\n    font-size:23px;line-height:1.4;letter-spacing:.01em;word-break:break-all;text-align:center;\n    cursor:pointer;transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .15s;\n  }\n  #pw .out:active{transform:scale(.985)}\n  #pw .out .digit{color:#0A84FF}\n  #pw .out .sym{color:#C7415C}\n  #pw .hint{margin:9px 0 22px;font-size:12.5px;color:#A6A6AE;text-align:center}\n  #pw .meter{height:6px;border-radius:3px;background:rgba(120,120,128,.16);overflow:hidden;margin-bottom:8px}\n  #pw .meter span{display:block;height:100%;width:0;border-radius:3px;background:#30A46C;transition:width .3s cubic-bezier(.2,.8,.2,1),background .3s}\n  #pw .meta{display:flex;justify-content:space-between;font-size:12.5px;color:#6E6E76;margin-bottom:24px;font-variant-numeric:tabular-nums}\n  #pw .meta b{font-weight:640;color:#111114}\n  #pw .card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #pw .lenrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}\n  #pw .lenrow span{font-size:14.5px;font-weight:560}\n  #pw .lenrow b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}\n  #pw input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:none;margin:0 0 18px}\n  #pw input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:rgba(120,120,128,.2)}\n  #pw input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10.5px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.05)}\n  #pw input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:rgba(120,120,128,.2)}\n  #pw input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.22)}\n  #pw .opts{display:flex;flex-wrap:wrap;gap:8px}\n  #pw .opt{\n    padding:8px 14px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;\n    font-size:14px;font-weight:560;letter-spacing:-.01em;color:#6E6E76;cursor:pointer;transition:.15s\n  }\n  #pw .opt[aria-pressed=true]{background:#0A84FF;border-color:#0A84FF;color:#fff}\n  #pw .opt:active{transform:scale(.95)}\n  #pw .go{\n    width:100%;margin-top:18px;height:52px;border:0;border-radius:16px;background:#111114;color:#fff;\n    font-size:16px;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:transform .15s,opacity .15s\n  }\n  #pw .go:active{transform:scale(.98);opacity:.9}\n</style>\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Generated on this device</p>\n    <button class=\"out\" id=\"pwOut\" aria-label=\"Generated password, click to copy\"></button>\n    <p class=\"hint\">Tap the password to copy it</p>\n    <div class=\"meter\"><span id=\"pwBar\"></span></div>\n    <div class=\"meta\"><span id=\"pwStrength\"></span><span id=\"pwEntropy\"></span></div>\n    <div class=\"card\">\n      <div class=\"lenrow\"><span>Length</span><b id=\"pwLenVal\">20</b></div>\n      <input id=\"pwLen\" type=\"range\" min=\"6\" max=\"64\" value=\"20\">\n      <div class=\"opts\" id=\"pwOpts\">\n        <button class=\"opt\" data-set=\"lower\" aria-pressed=\"true\">a&ndash;z</button>\n        <button class=\"opt\" data-set=\"upper\" aria-pressed=\"true\">A&ndash;Z</button>\n        <button class=\"opt\" data-set=\"digit\" aria-pressed=\"true\">0&ndash;9</button>\n        <button class=\"opt\" data-set=\"symbol\" aria-pressed=\"true\">Symbols</button>\n        <button class=\"opt\" data-set=\"clear\" aria-pressed=\"false\">Avoid look-alikes</button>\n      </div>\n      <button class=\"go\" id=\"pwNew\">Generate new password</button>\n    </div>\n  </div>\n</div>",
      "js": "const SETS = {\n  lower: 'abcdefghijklmnopqrstuvwxyz',\n  upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',\n  digit: '0123456789',\n  symbol: '!@#$%^&*()-_=+[]{};:,.?/~'\n};\nconst AMBIGUOUS = 'Il1O0oB8S5Z2';\nconst on = { lower:true, upper:true, digit:true, symbol:true, clear:false };\nconst out = document.getElementById('pwOut');\nconst bar = document.getElementById('pwBar');\n\nfunction pool(){\n  let p = '';\n  for (const k of ['lower','upper','digit','symbol']) if (on[k]) p += SETS[k];\n  if (on.clear) p = [...p].filter(c => !AMBIGUOUS.includes(c)).join('');\n  return p;\n}\n\n// Rejection sampling keeps every character equally likely across the pool.\nfunction pick(p){\n  const max = 256 - (256 % p.length);\n  const buf = new Uint8Array(1);\n  let v;\n  do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= max);\n  return p[v % p.length];\n}\n\nfunction paint(pw, poolSize){\n  out.innerHTML = [...pw].map(c => {\n    const cls = /[0-9]/.test(c) ? 'digit' : /[a-z]/i.test(c) ? '' : 'sym';\n    const esc = c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');\n    return cls ? '<span class=\"' + cls + '\">' + esc + '</span>' : esc;\n  }).join('');\n  const bits = Math.round(pw.length * Math.log2(poolSize));\n  const tiers = [[35,'Weak','#E5484D'],[60,'Fair','#F5A524'],[90,'Strong','#30A46C'],[1e9,'Excellent','#12805C']];\n  const [, label, colour] = tiers.find(t => bits < t[0]);\n  bar.style.width = Math.min(100, bits / 1.2) + '%';\n  bar.style.background = colour;\n  document.getElementById('pwStrength').innerHTML = '<b>' + label + '</b>';\n  document.getElementById('pwEntropy').textContent = bits + ' bits of entropy';\n}\n\nfunction generate(){\n  const p = pool();\n  if (!p){ out.textContent = 'Choose at least one character set'; bar.style.width = '0'; return; }\n  const len = +document.getElementById('pwLen').value;\n  let pw = '';\n  for (let i = 0; i < len; i++) pw += pick(p);\n  paint(pw, p.length);\n}\n\ndocument.getElementById('pwOpts').onclick = e => {\n  const b = e.target.closest('.opt'); if (!b) return;\n  const k = b.dataset.set;\n  on[k] = !on[k];\n  b.setAttribute('aria-pressed', on[k]);\n  generate();\n};\ndocument.getElementById('pwLen').oninput = e => {\n  document.getElementById('pwLenVal').textContent = e.target.value;\n  generate();\n};\ndocument.getElementById('pwNew').onclick = generate;\nout.onclick = async () => {\n  const text = out.textContent;\n  try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }\n  catch { \n    const t = document.createElement('textarea');\n    t.value = text; document.body.appendChild(t); t.select();\n    document.execCommand('copy'); t.remove(); toast('Copied to clipboard');\n  }\n};\ngenerate();"
    },
    "2FA / TOTP": {

      "html": "<div id=\"tp\">\n<style>\n  #tp{padding:30px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #tp .wrap{width:100%;max-width:520px}\n  #tp .eyebrow{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A6A6AE;text-align:center}\n  #tp .code{\n    display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:112px;\n    padding:20px;border:1px solid rgba(60,60,67,.1);border-radius:20px;background:#fff;cursor:pointer;\n    box-shadow:0 1px 2px rgba(16,24,40,.04),0 14px 30px -22px rgba(16,24,40,.5);\n    transition:transform .15s cubic-bezier(.2,.8,.2,1)\n  }\n  #tp .code:active{transform:scale(.985)}\n  #tp .digits{\n    font-family:ui-monospace,SFMono-Regular,\"SF Mono\",Menlo,Consolas,monospace;\n    font-size:44px;font-weight:600;letter-spacing:.12em;color:#111114;font-variant-numeric:tabular-nums\n  }\n  #tp .digits .sp{display:inline-block;width:.28em}\n  #tp .ring{width:44px;height:44px;flex:0 0 auto}\n  #tp .ring circle{fill:none;stroke-width:5}\n  #tp .ring .bg{stroke:rgba(120,120,128,.18)}\n  #tp .ring .fg{stroke:#0A84FF;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s linear,stroke .3s}\n  #tp .hint{margin:10px 0 22px;font-size:12.5px;color:#A6A6AE;text-align:center}\n  #tp .card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #tp label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:0 0 6px}\n  #tp input{\n    width:100%;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;\n    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;color:#111114;letter-spacing:.04em\n  }\n  #tp input:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #tp .row{display:flex;gap:10px;margin-top:12px}\n  #tp .row>div{flex:1}\n  #tp select{width:100%;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:15px}\n  #tp .save{\n    width:100%;margin-top:14px;height:48px;border:0;border-radius:14px;background:#111114;color:#fff;\n    font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s\n  }\n  #tp .save:active{transform:scale(.98)}\n  #tp .err{margin:10px 0 0;font-size:12.5px;color:#E5484D;text-align:center;min-height:16px}\n  #tp .accs{margin-top:16px;display:flex;flex-direction:column;gap:8px}\n  #tp .acc{\n    display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#fff;cursor:pointer;\n    box-shadow:0 1px 2px rgba(16,24,40,.05),0 8px 20px -18px rgba(16,24,40,.4)\n  }\n  #tp .acc.on{outline:2px solid #0A84FF;outline-offset:-2px}\n  #tp .acc .nm{flex:1;font-size:14.5px;font-weight:560;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  #tp .acc .mini{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-variant-numeric:tabular-nums;color:#6E6E76}\n  #tp .acc .del{border:0;background:none;color:#C3C3C9;font-size:20px;cursor:pointer;padding:0 2px;line-height:1}\n  #tp .acc .del:hover{color:#E5484D}\n</style>\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Time-based one-time password</p>\n    <button class=\"code\" id=\"tpCode\" aria-label=\"Current code, tap to copy\">\n      <span class=\"digits\" id=\"tpDigits\">&mdash;&mdash;&mdash; &mdash;&mdash;&mdash;</span>\n      <svg class=\"ring\" viewBox=\"0 0 44 44\"><circle class=\"bg\" cx=\"22\" cy=\"22\" r=\"18\"/><circle class=\"fg\" id=\"tpRing\" cx=\"22\" cy=\"22\" r=\"18\"/></svg>\n    </button>\n    <p class=\"hint\">Tap the code to copy it</p>\n\n    <div class=\"card\">\n      <label for=\"tpSecret\">Secret key (Base32)</label>\n      <input id=\"tpSecret\" placeholder=\"JBSWY3DPEHPK3PXP\" spellcheck=\"false\" autocapitalize=\"characters\">\n      <div class=\"row\">\n        <div><label for=\"tpDigitsN\">Digits</label><select id=\"tpDigitsN\"><option>6</option><option>7</option><option>8</option></select></div>\n        <div><label for=\"tpPeriod\">Period (s)</label><select id=\"tpPeriod\"><option>30</option><option>60</option></select></div>\n        <div><label for=\"tpAlgo\">Algorithm</label><select id=\"tpAlgo\"><option>SHA-1</option><option>SHA-256</option><option>SHA-512</option></select></div>\n      </div>\n      <p class=\"err\" id=\"tpErr\"></p>\n      <button class=\"save\" id=\"tpSave\">Save this account</button>\n    </div>\n\n    <div class=\"accs\" id=\"tpAccs\"></div>\n  </div>\n</div>",
      "js": "const KEY = 'totp.accounts.v1';\nconst $ = id => document.getElementById(id);\nlet accounts = [];\ntry { accounts = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}\nlet active = null;   // index of the saved account being shown, or null for the live form\nlet ticker = null;\n\nfunction decodeBase32(s){\n  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';\n  s = s.replace(/[\\s=]/g, '').toUpperCase();\n  let bits = 0, val = 0; const out = [];\n  for (const c of s){\n    const i = A.indexOf(c);\n    if (i < 0) throw new Error('Not valid Base32');\n    val = (val << 5) | i; bits += 5;\n    if (bits >= 8){ bits -= 8; out.push((val >>> bits) & 0xff); }\n  }\n  return new Uint8Array(out);\n}\n\nasync function totp(secret, { digits = 6, period = 30, algo = 'SHA-1' } = {}){\n  const key = decodeBase32(secret);\n  const counter = Math.floor(Date.now() / 1000 / period);\n  const msg = new Uint8Array(8);\n  let c = counter;\n  for (let i = 7; i >= 0; i--){ msg[i] = c & 0xff; c = Math.floor(c / 256); }\n  const ck = await crypto.subtle.importKey('raw', key, { name:'HMAC', hash:algo }, false, ['sign']);\n  const mac = new Uint8Array(await crypto.subtle.sign('HMAC', ck, msg));\n  const off = mac[mac.length - 1] & 0xf;\n  const bin = ((mac[off] & 0x7f) << 24) | (mac[off+1] << 16) | (mac[off+2] << 8) | mac[off+3];\n  return String(bin % 10 ** digits).padStart(digits, '0');\n}\n\nfunction currentConfig(){\n  if (active !== null) return accounts[active];\n  return {\n    secret: $('tpSecret').value.trim(),\n    digits: +$('tpDigitsN').value,\n    period: +$('tpPeriod').value,\n    algo:   $('tpAlgo').value\n  };\n}\n\nasync function tick(){\n  const cfg = currentConfig();\n  const ring = $('tpRing');\n  const R = 18, C = 2 * Math.PI * R;\n  ring.style.strokeDasharray = C;\n\n  if (!cfg.secret){ $('tpDigits').textContent = '\\u2014\\u2014\\u2014 \\u2014\\u2014\\u2014'; ring.style.strokeDashoffset = C; return; }\n  try {\n    const code = await totp(cfg.secret, cfg);\n    $('tpErr').textContent = '';\n    const mid = Math.ceil(code.length / 2);\n    $('tpDigits').innerHTML = code.slice(0, mid) + '<span class=\"sp\"></span>' + code.slice(mid);\n    const left = cfg.period - (Math.floor(Date.now() / 1000) % cfg.period);\n    ring.style.strokeDashoffset = C * (1 - left / cfg.period);\n    ring.style.stroke = left <= 5 ? '#E5484D' : '#0A84FF';\n    // refresh the little codes on saved rows\n    document.querySelectorAll('#tpAccs .acc').forEach(async el => {\n      const a = accounts[+el.dataset.i];\n      try { el.querySelector('.mini').textContent = await totp(a.secret, a); } catch {}\n    });\n  } catch (e){\n    $('tpErr').textContent = e.message;\n    $('tpDigits').textContent = '\\u2014\\u2014\\u2014 \\u2014\\u2014\\u2014';\n  }\n}\n\nfunction renderAccounts(){\n  const box = $('tpAccs');\n  box.innerHTML = '';\n  accounts.forEach((a, i) => {\n    const el = document.createElement('div');\n    el.className = 'acc' + (i === active ? ' on' : '');\n    el.dataset.i = i;\n    el.innerHTML = '<span class=\"nm\">' + a.name.replace(/[&<>]/g, '') + '</span><span class=\"mini\">\\u2022\\u2022\\u2022 \\u2022\\u2022\\u2022</span><button class=\"del\" title=\"Delete\">&times;</button>';\n    el.onclick = e => {\n      if (e.target.closest('.del')) return;\n      active = (active === i) ? null : i;\n      renderAccounts(); tick();\n    };\n    el.querySelector('.del').onclick = async () => {\n      if (!await confirmDlg('Delete \"' + a.name + '\"?', 'The saved secret is removed from this device.', 'Delete')) return;\n      accounts.splice(i, 1);\n      if (active === i) active = null; else if (active > i) active--;\n      localStorage.setItem(KEY, JSON.stringify(accounts));\n      renderAccounts(); tick();\n    };\n    box.appendChild(el);\n  });\n}\n\n$('tpSave').onclick = async () => {\n  const secret = $('tpSecret').value.trim();\n  if (!secret){ $('tpErr').textContent = 'Enter a secret first'; return; }\n  try { await totp(secret, currentConfig()); } catch (e){ $('tpErr').textContent = e.message; return; }\n  const name = await ask('Save account', 'A label for this code (e.g. \"GitHub \\u2013 me\")', '');\n  if (!name) return;\n  accounts.push({ name, secret, digits:+$('tpDigitsN').value, period:+$('tpPeriod').value, algo:$('tpAlgo').value });\n  localStorage.setItem(KEY, JSON.stringify(accounts));\n  active = accounts.length - 1;\n  renderAccounts(); tick(); toast('Saved');\n};\n\n['tpSecret','tpDigitsN','tpPeriod','tpAlgo'].forEach(id => $(id).addEventListener('input', () => { active = null; renderAccounts(); tick(); }));\n\n$('tpCode').onclick = () => {\n  const code = $('tpDigits').textContent.replace(/\\D/g, '');\n  if (!code) return;\n  navigator.clipboard.writeText(code).then(() => toast('Copied'), () => toast('Copied'));\n};\n\nrenderAccounts();\ntick();\nticker = setInterval(tick, 1000);\nonToolExit(() => clearInterval(ticker));"
    },

      "html": "<div id=\"pp\">\n<style>\n  #pp{padding:34px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #pp .wrap{width:100%;max-width:560px}\n  #pp .eyebrow{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A6A6AE;text-align:center}\n  #pp .out{\n    display:block;width:100%;min-height:104px;padding:24px 22px;border:1px solid rgba(60,60,67,.1);\n    border-radius:20px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.04),0 14px 30px -22px rgba(16,24,40,.5);\n    font-size:25px;line-height:1.45;text-align:center;cursor:pointer;word-break:break-word;\n    transition:transform .15s cubic-bezier(.2,.8,.2,1)\n  }\n  #pp .out:active{transform:scale(.985)}\n  #pp .out .sep{color:#C3C3C9}\n  #pp .out .num{color:#0A84FF;font-family:ui-monospace,Menlo,monospace}\n  #pp .hint{margin:9px 0 22px;font-size:12.5px;color:#A6A6AE;text-align:center}\n  #pp .meta{display:flex;justify-content:center;gap:8px;font-size:12.5px;color:#6E6E76;margin-bottom:22px;font-variant-numeric:tabular-nums}\n  #pp .meta b{font-weight:640;color:#111114}\n  #pp .card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #pp .lenrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}\n  #pp .lenrow span{font-size:14.5px;font-weight:560}\n  #pp .lenrow b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}\n  #pp input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:none;margin:0 0 18px}\n  #pp input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:rgba(120,120,128,.2)}\n  #pp input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10.5px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.05)}\n  #pp input[type=range]::-moz-range-track{height:       "html": "<div id=\"js\">\n<style>\n  #js{position:absolute;inset:0;display:flex;flex-direction:column;background:#F2F2F7}\n  #js .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid rgba(60,60,67,.1);flex-wrap:wrap}\n  #js .bar button{padding:8px 14px;border:1px solid rgba(60,60,67,.14);border-radius:10px;background:#fff;font-size:13.5px;font-weight:560;color:#111114;cursor:pointer;transition:.15s}\n  #js .bar button:hover{border-color:#0A84FF;color:#0A84FF}\n  #js .bar button.primary{background:#0A84FF;border-color:#0A84FF;color:#fff}\n  #js .bar button:active{transform:scale(.96)}\n  #js .bar .spacer{flex:1}\n  #js .bar select{padding:8px 10px;border:1px solid rgba(60,60,67,.14);border-radius:10px;background:#fff;font:inherit;font-size:13.5px}\n  #js .panes{flex:1;display:flex;min-height:0}\n  #js textarea{flex:1;min-width:0;padding:16px 18px;border:0;outline:none;resize:none;background:#fff;\n    font-family:ui-monospace,SFMono-Regular,\"SF Mono\",Menlo,Consolas,monospace;font-size:13px;line-height:1.6;tab-size:2;white-space:pre;overflow:auto}\n  @media (max-width:860px){#js textarea{font-size:16px}}\n  #js .divide{width:1px;background:rgba(60,60,67,.1)}\n  #js #jsView{flex:1;min-width:0;overflow:auto;background:#fff;padding:16px 18px;margin:0;\n    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre}\n  #js .k{color:#0A3069;font-weight:600} #js .s{color:#0A7B3E} #js .n{color:#B8390E}\n  #js .b{color:#8250DF} #js .z{color:#A6A6AE} #js .p{color:#57606A}\n  #js .status{flex:0 0 auto;padding:9px 16px;font-size:13px;background:#fff;border-top:1px solid rgba(60,60,67,.1);\n    font-family:ui-monospace,Menlo,monospace}\n  #js .status.ok{color:#12805C} #js .status.err{color:#B8390E}\n  @media (max-width:760px){#js .panes{flex-direction:column} #js .divide{width:auto;height:1px}}\n</style>\n  <div class=\"bar\">\n    <button class=\"primary\" id=\"jsFmt\">Format</button>\n    <button id=\"jsMin\">Minify</button>\n    <button id=\"jsSort\">Sort keys</button>\n    <select id=\"jsIndent\"><option value=\"2\">2 spaces</option><option value=\"4\">4 spaces</option><option value=\"tab\">Tab</option></select>\n    <span class=\"spacer\"></span>\n    <button id=\"jsCopy\">Copy</button>\n    <button id=\"jsSample\">Sample</button>\n  </div>\n  <div class=\"panes\">\n    <textarea id=\"jsIn\" spellcheck=\"false\" placeholder=\"Paste JSON here\"></textarea>\n    <div class=\"divide\"></div>\n    <pre id=\"jsView\"></pre>\n  </div>\n  <div class=\"status\" id=\"jsStatus\">Waiting for input</div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst inEl = $('jsIn'), view = $('jsView'), status = $('jsStatus');\n\nfunction indentStr(){ const v = $('jsIndent').value; return v === 'tab' ? '\\t' : ' '.repeat(+v); }\n\nfunction sortDeep(x){\n  if (Array.isArray(x)) return x.map(sortDeep);\n  if (x && typeof x === 'object'){\n    const o = {}; Object.keys(x).sort().forEach(k => o[k] = sortDeep(x[k])); return o;\n  }\n  return x;\n}\n\n// Turn a SyntaxError position into a line/column the reader can find.\nfunction locate(text, err){\n  const m = /position (\\d+)/.exec(err.message);\n  if (!m) return '';\n  const pos = +m[1];\n  const upto = text.slice(0, pos);\n  const line = upto.split('\\n').length;\n  const col = pos - upto.lastIndexOf('\\n');\n  return '  (line ' + line + ', column ' + col + ')';\n}\n\nfunction highlight(json){\n  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\n  return esc(json).replace(\n    /(\"(\\\\.|[^\"\\\\])*\")(\\s*:)?|\\b(true|false)\\b|\\bnull\\b|-?\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?/g,\n    (m, str, _c, colon, bool) => {\n      if (str) return colon ? '<span class=\"k\">' + str + '</span><span class=\"p\">:</span>' : '<span class=\"s\">' + str + '</span>';\n      if (bool) return '<span class=\"b\">' + m + '</span>';\n      if (m === 'null') return '<span class=\"z\">null</span>';\n      return '<span class=\"n\">' + m + '</span>';\n    }\n  );\n}\n\nfunction process(transform){\n  const raw = inEl.value.trim();\n  if (!raw){ view.innerHTML = ''; status.className = 'status'; status.textContent = 'Waiting for input'; return; }\n  let data;\n  try { data = JSON.parse(raw); }\n  catch (e){\n    status.className = 'status err';\n    status.textContent = '\\u2716 ' + e.message + locate(raw, e);\n    return;\n  }\n  if (transform) data = transform(data);\n  const text = JSON.stringify(data, null, transform === MINIFY ? 0 : indentStr());\n  view.innerHTML = highlight(text);\n  const bytes = new Blob([text]).size;\n  status.className = 'status ok';\n  status.textContent = '\\u2713 Valid JSON \\u00b7 ' + count(data) + ' \\u00b7 ' + bytes + ' bytes';\n  view.dataset.text = text;\n}\n\nfunction count(x){\n  let keys = 0, arr = 0;\n  (function walk(v){\n    if (Array.isArray(v)){ arr += v.length; v.forEach(walk); }\n    else if (v && typeof v === 'object'){ const k = Object.keys(v); keys += k.length; k.forEach(kk => walk(v[kk])); }\n  })(x);\n  return keys + ' keys, ' + arr + ' array items';\n}\n\nconst MINIFY = x => x;   // sentinel used to signal zero-indent output\n$('jsFmt').onclick    = () => process(null);\n$('jsMin').onclick    = () => process(MINIFY);\n$('jsSort').onclick   = () => process(sortDeep);\n$('jsIndent').onchange = () => process(null);\ninEl.oninput = () => process(null);\n\n$('jsCopy').onclick = () => {\n  const t = view.dataset.text || '';\n  if (!t) return toast('Nothing to copy yet');\n  navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast('Copied'));\n};\n$('jsSample').onclick = () => {\n  inEl.value = '{\"name\":\"Toolbox\",\"version\":2,\"active\":true,\"tags\":[\"cli\",\"web\",null],'\n    + '\"owner\":{\"id\":42,\"email\":\"me@example.com\"},\"scores\":[9.5,8,10]}';\n  process(null);\n};\n\n// Tab inserts two spaces rather than moving focus.\ninEl.addEventListener('keydown', e => {\n  if (e.key !== 'Tab') return;\n  e.preventDefault();\n  const s = inEl.selectionStart;\n  inEl.value = inEl.value.slice(0, s) + '  ' + inEl.value.slice(inEl.selectionEnd);\n  inEl.selectionStart = inEl.selectionEnd = s + 2;\n});"

      "html": "<div id=\"b6\">\n<style>\n  #b6{padding:26px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #b6 .wrap{width:100%;max-width:680px}\n  #b6 h2{margin:0 0 18px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #b6 .tabs{display:flex;gap:6px;padding:3px;background:rgba(120,120,128,.12);border-radius:12px;margin-bottom:18px}\n  #b6 .tabs button{flex:1;padding:9px;border:0;border-radius:9px;background:none;font-size:14px;font-weight:560;color:#6E6E76;cursor:pointer;transition:.15s}\n  #b6 .tabs button.on{background:#fff;color:#111114;box-shadow:0 1px 3px rgba(0,0,0,.1)}\n  #b6 .field{margin-bottom:14px}\n  #b6 .field label{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:560;color:#6E6E76;margin-bottom:7px}\n  #b6 .field label button{border:0;background:none;color:#0A84FF;font-size:13px;font-weight:560;cursor:pointer}\n  #b6 textarea{\n    width:100%;min-height:132px;padding:14px;border:1px solid rgba(60,60,67,.16);border-radius:14px;background:#fff;resize:vertical;\n    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.55;color:#111114\n  }\n  @media (max-width:860px){#b6 textarea{font-size:16px}}\n  #b6 textarea:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #b6 .swap{display:flex;justify-content:center;margin:2px 0 12px}\n  #b6 .swap button{width:40px;height:40px;border:1px solid rgba(60,60,67,.16);border-radius:50%;background:#fff;font-size:18px;cursor:pointer;transition:transform .2s}\n  #b6 .swap button:active{transform:rotate(180deg) scale(.9)}\n  #b6 .opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}\n  #b6 .opt{padding:7px 13px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:13px;font-weight:560;color:#6E6E76;cursor:pointer;transition:.15s}\n  #b6 .opt[aria-pressed=true]{background:#0A84FF;border-color:#0A84FF;color:#fff}\n  #b6 .err{font-size:12.5px;color:#E5484D;min-height:16px;margin-top:6px}\n</style>\n  <div class=\"wrap\">\n    <h2>Encode &amp; decode</h2>\n    <div class=\"tabs\" id=\"b6Tabs\">\n      <button data-mode=\"base64\" class=\"on\">Base64</button>\n      <button data-mode=\"url\">URL</button>\n    </div>\n    <div class=\"opts\" id=\"b6Opts\">\n      <button class=\"opt\" data-flag=\"safe\" aria-pressed=\"false\">URL-safe Base64</button>\n      <button class=\"opt\" data-flag=\"comp\" aria-pressed=\"false\">Encode each component</button>\n    </div>\n\n    <div class=\"field\">\n      <label>Plain text <button id=\"b6ClearA\">Clear</button></label>\n      <textarea id=\"b6A\" spellcheck=\"false\" placeholder=\"Type or paste text\"></textarea>\n    </div>\n    <div class=\"swap\"><button id=\"b6Swap\" title=\"Move result up to re-decode\">&#8645;</button></div>\n    <div class=\"field\" style=\"margin-bottom:0\">\n      <label>Encoded <button id=\"b6CopyB\">Copy</button></label>\n      <textarea id=\"b6B\" spellcheck=\"false\" placeholder=\"\\u2026or paste encoded text here to decode\"></textarea>\n    </div>\n    <p class=\"err\" id=\"b6Err\"></p>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst A = $('b6A'), B = $('b6B'), err = $('b6Err');\nconst mode = { kind:'base64', safe:false, comp:false };\n\n// btoa/atob are byte-based; route text through UTF-8 so emoji and accents survive.\nconst enc = new TextEncoder(), dec = new TextDecoder();\nfunction b64encode(str){\n  let bin = '';\n  enc.encode(str).forEach(b => bin += String.fromCharCode(b));\n  let out = btoa(bin);\n  if (mode.safe) out = out.replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=+$/, '');\n  return out;\n}\nfunction b64decode(str){\n  let s = str.trim().replace(/-/g, '+').replace(/_/g, '/').replace(/\\s+/g, '');\n  while (s.length % 4) s += '=';\n  const bin = atob(s);\n  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));\n  return dec.decode(bytes);\n}\nfunction urlEncode(str){ return mode.comp ? encodeURIComponent(str) : encodeURI(str); }\nfunction urlDecode(str){ return decodeURIComponent(str.replace(/\\+/g, ' ')); }\n\nfunction encode(){\n  err.textContent = '';\n  const t = A.value;\n  if (!t){ B.value = ''; return; }\n  try { B.value = mode.kind === 'base64' ? b64encode(t) : urlEncode(t); }\n  catch (e){ err.textContent = 'Could not encode: ' + e.message; }\n}\nfunction decode(){\n  err.textContent = '';\n  const t = B.value;\n  if (!t){ A.value = ''; return; }\n  try { A.value = mode.kind === 'base64' ? b64decode(t) : urlDecode(t); }\n  catch (e){ err.textContent = mode.kind === 'base64' ? 'That is not valid Base64' : 'That is not valid percent-encoding'; }\n}\n\nA.addEventListener('input', encode);\nB.addEventListener('input', decode);\n\n$('b6Tabs').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  mode.kind = b.dataset.mode;\n  document.querySelectorAll('#b6Tabs button').forEach(x => x.classList.toggle('on', x === b));\n  document.querySelectorAll('#b6Opts .opt').forEach(o => {\n    o.style.display = (o.dataset.flag === 'safe' && mode.kind !== 'base64') ||\n                      (o.dataset.flag === 'comp' && mode.kind !== 'url') ? 'none' : '';\n  });\n  encode();\n};\n$('b6Opts').onclick = e => {\n  const b = e.target.closest('.opt'); if (!b) return;\n  mode[b.dataset.flag] = !mode[b.dataset.flag];\n  b.setAttribute('aria-pressed', mode[b.dataset.flag]);\n  encode();\n};\n$('b6Swap').onclick = () => { A.value = B.value; B.value = ''; decode(); };\n$('b6ClearA').onclick = () => { A.value = ''; B.value = ''; err.textContent = ''; };\n$('b6CopyB').onclick = () => {\n  if (!B.value) return toast('Nothing to copy');\n  navigator.clipboard.writeText(B.value).then(() => toast('Copied'), () => toast('Copied'));\n};\n\n// hide the option that doesn't apply to the starting tab\ndocument.querySelector('#b6Opts .opt[data-flag=\"comp\"]').style.display = 'none';"

      "html": "<div id=\"qr\">\n<style>\n  #qr{padding:26px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #qr .wrap{width:100%;max-width:560px}\n  #qr .tabs{display:flex;gap:6px;padding:3px;background:rgba(120,120,128,.12);border-radius:12px;margin-bottom:20px}\n  #qr .tabs button{flex:1;padding:9px;border:0;border-radius:9px;background:none;font-size:14px;font-weight:560;color:#6E6E76;cursor:pointer;transition:.15s}\n  #qr .tabs button.on{background:#fff;color:#111114;box-shadow:0 1px 3px rgba(0,0,0,.1)}\n  #qr .pane{display:none} #qr .pane.on{display:block}\n  #qr .canvaswrap{display:flex;justify-content:center;margin-bottom:18px}\n  #qr .canvaswrap .plate{padding:18px;background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 16px 34px -22px rgba(16,24,40,.5)}\n  #qr canvas{display:block;image-rendering:pixelated;width:256px;height:256px;border-radius:6px}\n  #qr textarea{\n    width:100%;min-height:96px;padding:14px;border:1px solid rgba(60,60,67,.16);border-radius:14px;background:#fff;resize:vertical;\n    font:inherit;font-size:16px;line-height:1.5;color:#111114;margin-bottom:14px\n  }\n  #qr textarea:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #qr .row{display:flex;gap:10px;align-items:center;margin-bottom:14px}\n  #qr .row label{font-size:13px;font-weight:560;color:#6E6E76}\n  #qr select{padding:9px 11px;border:1px solid rgba(60,60,67,.14);border-radius:11px;background:#fff;font:inherit;font-size:14px}\n  #qr .btns{display:flex;gap:8px;flex-wrap:wrap}\n  #qr .btn{padding:11px 16px;border:0;border-radius:12px;background:#0A84FF;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .15s}\n  #qr .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #qr .btn:active{transform:scale(.97)}\n  #qr .drop{\n    border:1.5px dashed rgba(60,60,67,.28);border-radius:18px;padding:38px 20px;text-align:center;color:#8E8E96;\n    font-si       "html": "<div id=\"cl\">\n<style>\n  #cl{padding:26px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #cl .wrap{width:100%;max-width:560px}\n  #cl .hero{border-radius:22px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05),0 18px 40px -24px rgba(16,24,40,.55);margin-bottom:18px}\n  #cl .swatch{height:180px;position:relative;cursor:pointer}\n  #cl .swatch input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}\n  #cl .swatch .tap{position:absolute;left:16px;bottom:14px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);color:#111}\n  #cl .vals{background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(60,60,67,.1)}\n  #cl .val{background:#fff;padding:13px 16px;cursor:pointer;transition:background .12s}\n  #cl .val:hover{background:#F7F7FA}\n  #cl .val .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A6A6AE}\n  #cl .val .v{font-family:ui-monospace,Menlo,monospace;font-size:15px;margin-top:3px;color:#111114}\n  #cl .card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #cl .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:0 0 14px}\n  #cl .sliders label{display:flex;justify-content:space-between;font-size:13px;font-weight:560;color:#6E6E76;margin-bottom:6px}\n  #cl .sliders label b{font-family:ui-monospace,Menlo,monospace;color:#111114}\n  #cl input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;margin:0 0 16px}\n  #cl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.1);cursor:pointer}\n  #cl input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}\n  #cl .hexin{display:flex;gap:8px;margin-bottom:2px}\n  #cl .hexin input{flex:1;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;font-family:ui-monospace,Menlo,monospace;font-size:16px;text-transform:uppercase}\n  #cl .hexin input:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #cl .hexin button{padding:0 16px;border:0;border-radius:12px;background:#111114;color:#fff;font-size:14px;font-weight:560;cursor:pointer}\n  #cl .palette{display:flex;border-radius:12px;overflow:hidden}\n  #cl .palette div{flex:1;height:52px;cursor:pointer;position:relative}\n  #cl .palette div span{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;opacity:0;transition:.15s}\n  #cl .palette div:hover span{opacity:1}\n  #cl .contrast{display:flex;gap:12px;align-items:stretch}\n  #cl .cpreview{flex:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;min-height:66px}\n  #cl .cinfo{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:12.5px}\n  #cl .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}\n  #cl .badge.pass{background:rgba(48,164,108,.16);color:#12805C} #cl .badge.fail{background:rgba(229,72,77,.16);color:#B8390E}\n  #cl .ratio{font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:600;color:#111114}\n</style>\n  <div class=\"wrap\">\n    <div class=\"hero\">\n      <div class=\"swatch\" id=\"clSwatch\">\n        <input type=\"color\" id=\"clPicker\" value=\"#0A84FF\">\n        <span class=\"tap\">Tap to pick</span>\n      </div>\n      <div class=\"vals\" id=\"clVals\"></div>\n    </div>\n\n    <div class=\"card\">\n      <p class=\"cap\">Adjust</p>\n      <div class=\"hexin\">\n        <input id=\"clHex\" value=\"#0A84FF\" spellcheck=\"false\" maxlength=\"7\">\n        <button id=\"clRandom\">Random</button>\n      </div>\n      <div class=\"sliders\" id=\"clSliders\" style=\"margin-top:16px\">\n        <label>Red <b id=\"clRv\">10</b></label><input type=\"range\" id=\"clR\" min=\"0\" max=\"255\" value=\"10\">\n        <label>Green <b id=\"clGv\">132</b></label><input type=\"range\" id=\"clG\" min=\"0\" max=\"255\" value=\"132\">\n        <label>Blue <b id=\"clBv\">255</b></label><input type=\"range\" id=\"clB\" min=\"0\" max=\"255\" value=\"255\">\n      </div>\n    </div>\n\n    <div class=\"card\">\n      <p class=\"cap\">Harmonies</p>\n      <div class=\"palette\" id=\"clPalette\"></div>\n    </div>\n\n    <div class=\"card\" style=\"margin-bottom:0\">\n      <p class=\"cap\">Contrast check</p>\n      <div class=\"contrast\">\n        <div class=\"cpreview\" id=\"clCP\">Sample text</div>\n        <div class=\"cinfo\">\n          <span class=\"ratio\" id=\"clRatio\">&mdash;</span>\n          <span><span class=\"badge\" id=\"clAA\">AA</span> <span class=\"badge\" id=\"clAAA\">AAA</span></span>\n          <span style=\"color:#A6A6AE\">vs white / black</span>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nlet rgb = { r:10, g:132, b:255 };\n\nconst hex2 = n => n.toString(16).padStart(2, '0');\nconst toHex = ({r,g,b}) => '#' + hex2(r) + hex2(g) + hex2(b);\nfunction parseHex(s){\n  s = s.trim().replace(/^#/, '');\n  if (/^[0-9a-f]{3}$/i.test(s)) s = s.split('').map(c => c + c).join('');\n  if (!/^[0-9a-f]{6}$/i.test(s)) return null;\n  return { r:parseInt(s.slice(0,2),16), g:parseInt(s.slice(2,4),16), b:parseInt(s.slice(4,6),16) };\n}\nfunction rgb2hsl({r,g,b}){\n  r/=255; g/=255; b/=255;\n  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;\n  let h=0, s=0, l=(max+min)/2;\n  if (d){\n    s = l > .5 ? d/(2-max-min) : d/(max+min);\n    h = max===r ? (g-b)/d + (g<b?6:0) : max===g ? (b-r)/d + 2 : (r-g)/d + 4;\n    h *= 60;\n  }\n  return { h:Math.round(h), s:Math.round(s*100), l:Math.round(l*100) };\n}\nfunction hsl2rgb(h,s,l){\n  s/=100; l/=100;\n  const k = n => (n + h/30) % 12;\n  const a = s * Math.min(l, 1-l);\n  const f = n => l - a * Math.max(-1, Math.min(k(n)-3, 9-k(n), 1));\n  return { r:Math.round(f(0)*255), g:Math.round(f(8)*255), b:Math.round(f(4)*255) };\n}\nconst relLum = ({r,g,b}) => {\n  const f = c => { c/=255; return c <= .03928 ? c/12.92 : ((c+.055)/1.055)**2.4; };\n  return .2126*f(r) + .7152*f(g) + .0722*f(b);\n};\nconst contrast = (a,b) => { const l1=relLum(a), l2=relLum(b); return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05); };\n\nfunction copy(text){ navigator.clipboard.writeText(text).then(() => toast('Copied ' + text), () => toast('Copied')); }\n\nfunction render(){\n  const hex = toHex(rgb);\n  const hsl = rgb2hsl(rgb);\n\n  $('clPicker').value = hex;\n  $('clHex').value = hex.toUpperCase();\n  $('clR').value = rgb.r; $('clG').value = rgb.g; $('clB').value = rgb.b;\n  $('clRv').textContent = rgb.r; $('clGv').textContent = rgb.g; $('clBv').textContent = rgb.b;\n  $('clSwatch').style.background = hex;\n\n  ['clR','clG','clB'].forEach(id => {\n    const base = { clR:'255,0,0', clG:'0,255,0', clB:'0,0,255' }[id];\n    $(id).style.background = 'linear-gradient(90deg, #000, rgb(' + base + '))';\n  });\n\n  const vals = [\n    ['HEX', hex.toUpperCase()],\n    ['RGB', 'rgb(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ')'],\n    ['HSL', 'hsl(' + hsl.h + ', ' + hsl.s + '%, ' + hsl.l + '%)'],\n    ['CSS', hex.toUpperCase()]\n  ];\n  $('clVals').innerHTML = vals.map(([k,v]) =>\n    '<div class=\"val\" data-c=\"' + v + '\"><div class=\"k\">' + k + '</div><div class=\"v\">' + v + '</div></div>'\n  ).join('');\n  $('clVals').querySelectorAll('.val').forEach(el => el.onclick = () => copy(el.dataset.c));\n\n  // harmonies: complementary, triadic, analogous, split\n  const offs = [0, 180, 120, 240, 30, -30];\n  $('clPalette').innerHTML = offs.map(o => {\n    const c = toHex(hsl2rgb((hsl.h + o + 360) % 360, hsl.s, hsl.l));\n    return '<div style=\"background:' + c + '\" data-c=\"' + c + '\"><span style=\"color:' +\n      (relLum(parseHex(c)) > .4 ? '#000' : '#fff') + '\">' + c.slice(1).toUpperCase() + '</span></div>';\n  }).join('');\n  $('clPalette').querySelectorAll('div[data-c]').forEach(el => el.onclick = () => copy(el.dataset.c.toUpperCase()));\n\n  // contrast vs whichever of black/white reads better on this colour\n  const cw = contrast(rgb, {r:255,g:255,b:255});\n  const cb = contrast(rgb, {r:0,g:0,b:0});\n  const best = cw >= cb ? { c:'#fff', ratio:cw } : { c:'#111', ratio:cb };\n  $('clCP').style.background = hex; $('clCP').style.color = best.c;\n  $('clRatio').textContent = best.ratio.toFixed(2) + ':1';\n  const aa = best.ratio >= 4.5, aaa = best.ratio >= 7;\n  $('clAA').className = 'badge ' + (aa ? 'pass' : 'fail');\n  $('clAAA').className = 'badge ' + (aaa ? 'pass' : 'fail');\n}\n\nfunction setRgb(next){ rgb = next; render(); }\n\n$('clPicker').oninput = e => setRgb(parseHex(e.target.value));\n$('clHex').oninput = e => { const p = parseHex(e.target.value); if (p) setRgb(p); };\n['clR','clG','clB'].forEach(id => $(id).oninput = () => setRgb({\n  r:+$('clR').value, g:+$('clG').value, b:+$('clB').value\n}));\n$('clRandom').onclick = () => setRgb({ r:rnd(), g:rnd(), b:rnd() });\nfunction rnd(){ return crypto.getRandomValues(new Uint8Array(1))[0]; }\n\nrender();"

      "html": "<div id=\"dn\">\n<style>\n  #dn{padding:26px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #dn .wrap{width:100%;max-width:680px}\n  #dn h2{margin:0 0 18px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #dn .form{display:flex;gap:8px;margin-bottom:14px}\n  #dn .form input{flex:1;padding:12px 14px;border:1px solid rgba(60,60,67,.16);border-radius:13px;background:#fff;font:inherit;font-size:16px}\n  #dn .form input:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #dn .form button{padding:0 20px;border:0;border-radius:13px;background:#0A84FF;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s}\n  #dn .form button:active{transform:scale(.97)}\n  #dn .types{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}\n  #dn .types button{padding:7px 14px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:13px;font-weight:560;color:#6E6E76;cursor:pointer;transition:.15s}\n  #dn .types button.on{background:#111114;border-color:#111114;color:#fff}\n  #dn .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4);margin-bottom:14px}\n  #dn .card h3{margin:0;padding:12px 16px;font-size:13px;font-weight:700;letter-spacing:.02em;color:#6E6E76;border-bottom:1px solid rgba(60,60,67,.08);display:flex;justify-content:space-between}\n  #dn .card h3 span{color:#A6A6AE;font-weight:600}\n  #dn .rec{display:flex;gap:14px;padding:11px 16px;border-bottom:1px solid rgba(60,60,67,.06);align-items:baseline}\n  #dn .rec:last-child{border-bottom:0}\n  #dn .rec .data{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;word-break:break-all;color:#111114}\n  #dn .rec .ttl{flex:0 0 auto;font-size:11.5px;color:#A6A6AE;font-variant-numeric:tabular-nums}\n  #dn .msg{padding:30px;text-align:center;color:#A6A6AE;font-size:14px}\n  #dn .err{color:#B8390E}\n</style>\n  <div class=\"wrap\">\n    <h2>DNS lookup</h2>\n    <div class=\"form\">\n      <input id=\"dnHost\" placeholder=\"example.com\" spellcheck=\"false\" autocapitalize=\"off\" value=\"example.com\">\n      <button id=\"dnGo\">Look up</button>\n    </div>\n    <div class=\"types\" id=\"dnTypes\">\n      <button data-t=\"A\" class=\"on\">A</button>\n      <button data-t=\"AAAA\">AAAA</button>\n      <button data-t=\"MX\">MX</button>\n      <button data-t=\"TXT\">TXT</button>\n      <button data-t=\"NS\">NS</button>\n      <button data-t=\"CNAME\">CNAME</button>\n      <button data-t=\"SOA\">SOA</button>\n      <button data-t=\"CAA\">CAA</button>\n    </div>\n    <div id=\"dnOut\"><div class=\"msg\">Enter a domain and choose record types.</div></div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst TYPES = new Set(['A']);\nconst RTYPE = { 1:'A', 2:'NS', 5:'CNAME', 6:'SOA', 15:'MX', 16:'TXT', 28:'AAAA', 257:'CAA' };\n\n$('dnTypes').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  const t = b.dataset.t;\n  if (TYPES.has(t) && TYPES.size > 1) TYPES.delete(t); else TYPES.add(t);\n  b.classList.toggle('on', TYPES.has(t));\n};\n\nasync function lookupOne(host, type){\n  // Cloudflare's DNS-over-HTTPS JSON endpoint sends CORS headers, so it works from the browser.\n  const r = await fetch('https://cloudflare-dns.com/dns-query?name=' + encodeURIComponent(host) + '&type=' + type,\n    { headers:{ accept:'application/dns-json' } });\n  if (!r.ok) throw new Error('HTTP ' + r.status);\n  return r.json();\n}\n\nfunction recCard(type, json){\n  const answers = (json.Answer || []).filter(a => RTYPE[a.type] === type || type === 'TXT');\n  const rows = (json.Answer || []).map(a =>\n    '<div class=\"rec\"><div class=\"data\">' + fmt(type, a.data) + '</div><div class=\"ttl\">TTL ' + a.TTL + '</div></div>'\n  ).join('');\n  const status = json.Status === 0\n    ? (json.Answer ? json.Answer.length + ' record' + (json.Answer.length === 1 ? '' : 's') : 'no records')\n    : 'NXDOMAIN / error';\n  return '<div class=\"card\"><h3>' + type + ' <span>' + status + '</span></h3>' +\n    (rows || '<div class=\"msg\">No ' + type + ' records.</div>') + '</div>';\n}\nfunction fmt(type, data){\n  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\n  return esc(data);\n}\n\nasync function run(){\n  const host = $('dnHost').value.trim().replace(/^https?:\\/\\//, '').replace(/\\/.*$/, '');\n  if (!host){ toast('Enter a domain'); return; }\n  const out = $('dnOut');\n  out.innerHTML = '<div class=\"msg\">Resolving ' + host.replace(/[&<>]/g,'') + '\\u2026</div>';\n  const types = [...TYPES];\n  try {\n    const results = await Promise.all(types.map(async t => [t, await lookupOne(host, t)]));\n    out.innerHTML = results.map(([t, j]) => recCard(t, j)).join('');\n  } catch (e){\n    out.innerHTML = '<div class=\"msg err\">Lookup failed: ' + e.message +\n      '<br><br>This tool queries Cloudflare over HTTPS and needs an internet connection.</div>';\n  }\n}\n\n$('dnGo').onclick = run;\n$('dnHost').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });"

      "html": "<div id=\"ip\">\n<style>\n  #ip{padding:26px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #ip .wrap{width:100%;max-width:640px}\n  #ip h2{margin:0 0 18px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #ip .hero{background:#111114;color:#fff;border-radius:20px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden}\n  #ip .hero .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}\n  #ip .hero .addr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:30px;font-weight:600;margin-top:6px;letter-spacing:-.01em;word-break:break-all;cursor:pointer}\n  #ip .hero .sub{margin-top:8px;font-size:13.5px;color:rgba(255,255,255,.65)}\n  #ip .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4);margin-bottom:14px}\n  #ip .card h3{margin:0;padding:12px 16px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;border-bottom:1px solid rgba(60,60,67,.08)}\n  #ip .kv{display:flex;padding:11px 16px;border-bottom:1px solid rgba(60,60,67,.06);gap:14px}\n  #ip .kv:last-child{border-bottom:0}\n  #ip .kv .k{flex:0 0 132px;font-size:13.5px;color:#6E6E76}\n  #ip .kv .v{flex:1;font-size:13.5px;color:#111114;word-break:break-word;text-align:right;font-variant-numeric:tabular-nums}\n  #ip .kv .v.mono{font-family:ui-monospace,Menlo,monospace}\n  #ip .msg{padding:16px;font-size:13px;color:#A6A6AE}\n  #ip .msg.err{color:#B8390E}\n</style>\n  <div class=\"wrap\">\n    <h2>What&rsquo;s my info</h2>\n    <div class=\"hero\">\n      <div class=\"lbl\">Public IP address</div>\n      <div class=\"addr\" id=\"ipAddr\">&hellip;</div>\n      <div class=\"sub\" id=\"ipWhere\">Looking up your connection&hellip;</div>\n    </div>\n    <div class=\"card\"><h3>Network</h3><div id=\"ipNet\"><div class=\"msg\">Loading&hellip;</div></div></div>\n    <div class=\"card\"><h3>This browser &amp; device</h3><div id=\"ipDev\"></div></div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nfunction rows(el, pairs){\n  el.innerHTML = pairs.map(([k, v, mono]) =>\n    '<div class=\"kv\"><div class=\"k\">' + k + '</div><div class=\"v' + (mono ? ' mono' : '') + '\">' + esc(v ?? '\\u2014') + '</div></div>'\n  ).join('');\n}\n\n/* ---------- Local: needs no network ---------- */\n(function deviceInfo(){\n  const n = navigator, s = screen;\n  const langs = (n.languages || [n.language]).join(', ');\n  const cores = n.hardwareConcurrency ? n.hardwareConcurrency + ' logical' : 'unknown';\n  const mem = n.deviceMemory ? '~' + n.deviceMemory + ' GB' : 'unknown';\n  const touch = (n.maxTouchPoints > 0) ? n.maxTouchPoints + ' points' : 'none';\n  const dpr = window.devicePixelRatio || 1;\n  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown';\n  rows($('ipDev'), [\n    ['Platform', n.platform],\n    ['Languages', langs],\n    ['Screen', s.width + ' \\u00d7 ' + s.height + ' @ ' + dpr + 'x', true],\n    ['Viewport', innerWidth + ' \\u00d7 ' + innerHeight + ' px', true],\n    ['Colour depth', s.colorDepth + '-bit'],\n    ['CPU cores', cores],\n    ['Device memory', mem],\n    ['Touch', touch],\n    ['Time zone', tz],\n    ['Cookies', n.cookieEnabled ? 'enabled' : 'disabled'],\n    ['Do Not Track', n.doNotTrack === '1' ? 'on' : 'off']\n  ]);\n})();\n\n$('ipAddr').onclick = () => {\n  const t = $('ipAddr').textContent.trim();\n  if (t && t !== '\\u2026') navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast('Copied'));\n};\n\n/* ---------- Public IP + geo: needs network ---------- */\n(async function ipInfo(){\n  try {\n    // ipwho.is is free, CORS-enabled, and returns IP + geo in one call.\n    const r = await fetch('https://ipwho.is/');\n    const d = await r.json();\n    if (d.success === false) throw new Error(d.message || 'lookup failed');\n    $('ipAddr').textContent = d.ip || 'unknown';\n    const place = [d.city, d.region, d.country].filter(Boolean).join(', ');\n    $('ipWhere').textContent = place ? place + (d.flag && d.flag.emoji ? '  ' + d.flag.emoji : '') : 'Location unavailable';\n    rows($('ipNet'), [\n      ['IP address', d.ip, true],\n      ['Type', d.type],\n      ['ISP', d.connection && d.connection.isp],\n      ['Organisation', d.connection && d.connection.org],\n      ['ASN', d.connection && d.connection.asn ? 'AS' + d.connection.asn : null, true],\n      ['City', d.city],\n      ['Region', d.region],\n      ['Country', d.country ? d.country + ' (' + d.country_code + ')' : null],\n      ['Postal', d.postal],\n      ['Coordinates', (d.latitude != null) ? d.latitude + ', ' + d.longitude : null, true],\n      ['Time zone', d.timezone && d.timezone.id]\n    ]);\n  } catch (e){\n    $('ipAddr').textContent = 'unavailable';\n    $('ipWhere').textContent = 'Could not reach the lookup service';\n    $('ipNet').innerHTML = '<div class=\"msg err\">Public IP lookup failed (' + esc(e.message) +\n      '). It needs an internet connection. Your local device details above still work.</div>';\n  }\n})();"

      "html": "<div id=\"ms\">\n<style>\n  #ms{padding:26px 20px calc(60px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #ms .wrap{width:100%;max-width:760px}\n  #ms h2{margin:0 0 4px;font-size:26px;font-weight:700;letter-spacing:-.022em}\n  #ms .lede{margin:0 0 22px;font-size:14.5px;color:#6E6E76;letter-spacing:-.01em}\n  #ms .card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #ms .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:0 0 12px}\n  #ms label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:0 0 5px}\n  #ms input,#ms select,#ms textarea{\n    width:100%;padding:10px 12px;border:1px solid rgba(60,60,67,.16);border-radius:11px;\n    background:#fff;font:inherit;font-size:16px;color:#111114\n  }\n  #ms input:focus,#ms select:focus,#ms textarea:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #ms textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;min-height:96px;resize:vertical}\n  @media (max-width:860px){#ms textarea{font-size:16px}}\n  #ms .grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}\n  #ms .btn{\n    padding:11px 18px;border:0;border-radius:12px;background:#0A84FF;color:#fff;\n    font-size:15px;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:transform .15s,opacity .15s\n  }\n  #ms .btn:active{transform:scale(.97)}\n  #ms .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #ms .btn.dark{background:#111114}\n  #ms .btn:disabled{opacity:.45;cursor:default}\n  #ms .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}\n  #ms .code{\n    display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n    font-size:30px;font-weight:600;letter-spacing:.14em;text-align:center;padding:20px;\n    border-radius:14px;background:#F2F2F7;cursor:pointer;margin:0 0 6px\n  }\n  #ms .codehint{text-align:center;font-size:12.5px;color:#A6A6AE;margin:0 0 12px}\n  #ms .status{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#6E6E76;margin-top:14px}\n  #ms .dot{width:8px;height:8px;border-radius:50%;background:#A6A6AE;flex:0 0 auto}\n  #ms .dot.ok{background:#30A46C} #ms .dot.err{background:#E5484D}\n  #ms .dot.wait{background:#F5A524;animation:mspulse 1.2s infinite}\n  @keyframes mspulse{50%{opacity:.3}}\n  #ms pre{\n    margin:0;padding:14px;border-radius:12px;background:#0E1116;color:#D6DEEB;overflow:auto;\n    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;max-height:460px\n  }\n  #ms .note{font-size:12.5px;color:#6E6E76;line-height:1.6;margin:12px 0 0}\n  #ms .note code{background:rgba(120,120,128,.14);padding:1px 5px;border-radius:5px;font-size:12px}\n  #ms .pill{display:inline-block;padding:3px 9px;border-radius:999px;background:rgba(120,120,128,.14);font-size:11.5px;font-weight:600;margin-left:8px;vertical-align:middle}\n  #ms details{margin-top:12px} #ms summary{cursor:pointer;font-size:13.5px;color:#0A84FF;font-weight:560}\n  #ms .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}\n  #ms .presets button{padding:6px 11px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:12.5px;cursor:pointer;color:#6E6E76}\n  #ms .presets button:hover{border-color:#0A84FF;color:#0A84FF}\n  #ms .hide{display:none}\n  @media (max-width:640px){#ms .grid{grid-template-columns:1fr}}\n</style>\n  <div class=\"wrap\">\n    <h2>Microsoft 365 Admin</h2>\n    <p class=\"lede\">Sign in with your own account &mdash; no app registration. A device code is copied for you and a sign-in tab opens; once you finish, the session is connected to your tenant.</p>\n\n    <div class=\"card\">\n      <p class=\"cap\">Session <span class=\"pill\" id=\"msWho\">not signed in</span></p>\n      <div class=\"btns\" style=\"margin-top:0\">\n        <button class=\"btn\" id=\"msStart\">Sign in</button>\n        <button class=\"btn ghost hide\" id=\"msOut\">Sign out</button>\n      </div>\n\n      <div id=\"msCodeBox\" class=\"hide\" style=\"margin-top:16px\">\n        <code class=\"code\" id=\"msCode\"></code>\n        <p class=\"codehint\">Copied to your clipboard &middot; tap to copy again</p>\n        <div class=\"btns\" style=\"margin-top:0\">\n          <button class=\"btn dark\" id=\"msOpen\">Open sign-in page</button>\n        </div>\n      </div>\n\n      <div class=\"status\"><span class=\"dot\" id=\"msDot\"></span><span id=\"msStatus\">Not connected</span></div>\n\n      <details>\n        <summary>If sign-in gets blocked</summary>\n        <p class=\"note\">\n          Browsers refuse the sign-in request unless the page is served with permission to reach\n          <code>login.microsoftonline.com</code> (a CORS limit &mdash; opening the file straight from disk\n          triggers it). Two ways around it:<br><br>\n          &bull; Put a proxy prefix that adds CORS headers here, and sign-in works as designed:\n        </p>\n        <div style=\"margin-top:8px\"><label for=\"msProxy\">CORS proxy prefix</label><input id=\"msProxy\" placeholder=\"https://your-proxy.example.com/\" spellcheck=\"false\"></div>\n        <p class=\"note\">&bull; Or skip sign-in and paste a token from <b>Graph Explorer</b> &mdash; requests below work unchanged:</p>\n        <div class=\"btns\"><button class=\"btn ghost\" id=\"msManual\">Paste a token instead</button></div>\n        <p class=\"note\" style=\"margin-top:14px\"><b>Advanced.</b> Override the tenant (default <code>common</code>) if you need to pin sign-in to one directory:</p>\n        <div style=\"margin-top:6px\"><label for=\"msTenant\">Tenant</label><input id=\"msTenant\" value=\"common\" spellcheck=\"false\"></div>\n      </details>\n    </div>\n\n    <div class=\"card\">\n      <p class=\"cap\">Request</p>\n      <div class=\"grid\" style=\"grid-template-columns:120px 1fr\">\n        <div><label for=\"msMethod\">Method</label>\n          <select id=\"msMethod\"><option>GET</option><option>POST</option><option>PATCH</option><option>DELETE</option></select>\n        </div>\n        <div><label for=\"msPath\">Path</label><input id=\"msPath\" value=\"/me\" spellcheck=\"false\"></div>\n      </div>\n      <div class=\"presets\" id=\"msPresets\">\n        <button data-m=\"GET\" data-p=\"/me\">My profile</button>\n        <button data-m=\"GET\" data-p=\"/organization\">Tenant</button>\n        <button data-m=\"GET\" data-p=\"/users?$top=25&amp;$select=id,displayName,userPrincipalName,accountEnabled\">Users</button>\n        <button data-m=\"GET\" data-p=\"/groups?$top=25&amp;$select=id,displayName,mail\">Groups</button>\n        <button data-m=\"GET\" data-p=\"/subscribedSkus\">Licences</button>\n        <button data-m=\"GET\" data-p=\"/auditLogs/signIns?$top=10\">Sign-in logs</button>\n        <button data-m=\"POST\" data-p=\"/users\">Create user</button>\n      </div>\n      <div id=\"msBodyBox\" class=\"hide\" style=\"margin-top:14px\">\n        <label for=\"msBody\">Request body (JSON)</label>\n        <textarea id=\"msBody\" spellcheck=\"false\"></textarea>\n      </div>\n      <div class=\"btns\"><button class=\"btn\" id=\"msSend\">Send request</button><button class=\"btn ghost\" id=\"msCopyRes\">Copy response</button></div>\n    </div>\n\n    <div class=\"card\"><p class=\"cap\">Response</p><pre id=\"msRes\">Nothing sent yet.</pre></div>\n  </div>\n</div>",
      "js": "// A public first-party client ID (Microsoft Graph PowerShell). It ships with\n// device-code support and broad delegated Graph scopes, so no app registration\n// is needed \\u2014 you just sign in as yourself.\nconst CLIENT_ID = '14d82eec-204b-4c2f-b7e8-296a70dab67e';\nconst SCOPE = 'https://graph.microsoft.com/.default offline_access openid profile';\nconst GRAPH = 'https://graph.microsoft.com/v1.0';\nconst $ = id => document.getElementById(id);\nlet token = sessionStorage.getItem('ms.token') || '';\nlet polling = null;\n\n$('msProxy').value  = localStorage.getItem('ms.proxy')  || '';\n$('msTenant').value = localStorage.getItem('ms.tenant') || 'common';\n\nfunction setStatus(text, kind){\n  $('msStatus').textContent = text;\n  $('msDot').className = 'dot' + (kind ? ' ' + kind : '');\n}\nfunction authBase(){\n  const proxy = $('msProxy').value.trim();\n  return proxy + 'https://login.microsoftonline.com/' + ($('msTenant').value.trim() || 'common') + '/oauth2/v2.0';\n}\nfunction connected(yes, who){\n  $('msWho').textContent = yes ? (who || 'signed in') : 'not signed in';\n  $('msOut').classList.toggle('hide', !yes);\n}\n\nasync function whoAmI(){\n  try {\n    const r = await fetch(GRAPH + '/me', { headers:{ Authorization:'Bearer ' + token } });\n    const j = await r.json();\n    if (r.ok){ connected(true, j.userPrincipalName || j.displayName); setStatus('Connected', 'ok'); }\n    else { connected(true, 'token set'); setStatus('Token present, /me returned ' + r.status, 'err'); }\n  } catch { connected(true, 'token set'); setStatus('Token present', 'ok'); }\n}\nif (token) whoAmI();\n\n$('msStart').onclick = async () => {\n  localStorage.setItem('ms.proxy', $('msProxy').value.trim());\n  localStorage.setItem('ms.tenant', $('msTenant').value.trim());\n\n  // Open the sign-in tab now, inside the click, so the browser allows the popup.\n  const tab = window.open('about:blank', '_blank');\n  setStatus('Requesting a device code\\u2026', 'wait');\n\n  let data;\n  try {\n    const r = await fetch(authBase() + '/devicecode', {\n      method:'POST',\n      headers:{ 'Content-Type':'application/x-www-form-urlencoded' },\n      body: new URLSearchParams({ client_id: CLIENT_ID, scope: SCOPE })\n    });\n    data = await r.json();\n    if (!r.ok) throw new Error(data.error_description || r.status);\n  } catch (e) {\n    if (tab) tab.close();\n    setStatus('The browser blocked the sign-in request \\u2014 see \"If sign-in gets blocked\"', 'err');\n    $('msRes').textContent = String(e) +\n      '\\n\\nThis is the browser stopping a cross-origin call to login.microsoftonline.com (CORS).\\n' +\n      'Add a proxy prefix, or use \"Paste a token instead\".';\n    return;\n  }\n\n  const url = data.verification_uri || 'https://microsoft.com/devicelogin';\n  // Copy the code, then send the already-open tab to the sign-in page.\n  try { await navigator.clipboard.writeText(data.user_code); toast('Code copied \\u2014 paste it in the new tab'); }\n  catch { toast('Copy the code shown, then sign in'); }\n  if (tab) tab.location = url; else window.open(url, '_blank', 'noopener');\n\n  $('msCode').textContent = data.user_code;\n  $('msCodeBox').classList.remove('hide');\n  $('msCode').onclick = () => { navigator.clipboard.writeText(data.user_code); toast('Code copied'); };\n  $('msOpen').onclick = () => window.open(url, '_blank', 'noopener');\n  setStatus('Waiting for you to finish signing in\\u2026', 'wait');\n\n  const deadline = Date.now() + (data.expires_in || 900) * 1000;\n  clearInterval(polling);\n  polling = setInterval(async () => {\n    if (Date.now() > deadline){ clearInterval(polling); setStatus('Device code expired \\u2014 sign in again', 'err'); return; }\n    try {\n      const r = await fetch(authBase() + '/token', {\n        method:'POST',\n        headers:{ 'Content-Type':'application/x-www-form-urlencoded' },\n        body: new URLSearchParams({\n          grant_type:'urn:ietf:params:oauth:grant-type:device_code',\n          client_id: CLIENT_ID, device_code: data.device_code\n        })\n      });\n      const j = await r.json();\n      if (j.access_token){\n        clearInterval(polling);\n        token = j.access_token;\n        sessionStorage.setItem('ms.token', token);\n        $('msCodeBox').classList.add('hide');\n        toast('Signed in');\n        whoAmI();\n      } else if (j.error && j.error !== 'authorization_pending' && j.error !== 'slow_down'){\n        clearInterval(polling);\n        setStatus(j.error_description || j.error, 'err');\n      }\n    } catch { /* keep polling through transient failures */ }\n  }, (data.interval || 5) * 1000);\n};\n\n$('msManual').onclick = async () => {\n  const t = await ask('Access token', 'Paste a bearer token for https://graph.microsoft.com', '', true);\n  if (!t || !t.trim()) return;\n  token = t.trim();\n  sessionStorage.setItem('ms.token', token);\n  whoAmI();\n};\n$('msOut').onclick = () => {\n  token = ''; sessionStorage.removeItem('ms.token');\n  connected(false); setStatus('Not connected'); toast('Signed out');\n};\n\n$('msMethod').onchange = () => {\n  $('msBodyBox').classList.toggle('hide', $('msMethod').value === 'GET' || $('msMethod').value === 'DELETE');\n};\n$('msPresets').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  $('msMethod').value = b.dataset.m;\n  $('msPath').value = b.dataset.p;\n  $('msMethod').onchange();\n  if (b.dataset.m === 'POST' && b.dataset.p === '/users'){\n    $('msBody').value = JSON.stringify({\n      accountEnabled:true, displayName:'Ada Lovelace', mailNickname:'ada',\n      userPrincipalName:'ada@yourtenant.onmicrosoft.com',\n      passwordProfile:{ forceChangePasswordNextSignIn:true, password:'ChangeThis!2026' }\n    }, null, 2);\n  }\n};\n\n$('msSend').onclick = async () => {\n  if (!token){ toast('Sign in first'); return; }\n  const method = $('msMethod').value;\n  const path = $('msPath').value.trim();\n  const opts = { method, headers:{ Authorization:'Bearer ' + token } };\n  if (method !== 'GET' && method !== 'DELETE'){\n    opts.headers['Content-Type'] = 'application/json';\n    opts.body = $('msBody').value;\n  }\n  $('msRes').textContent = 'Sending\\u2026';\n  try {\n    const r = await fetch(GRAPH + (path.startsWith('/') ? path : '/' + path), opts);\n    const text = await r.text();\n    let out;\n    try { out = JSON.stringify(JSON.parse(text), null, 2); } catch { out = text || '(empty response)'; }\n    $('msRes').textContent = r.status + ' ' + r.statusText + '\\n\\n' + out;\n  } catch (e) {\n    $('msRes').textContent = 'Request failed: ' + e;\n  }\n};\n$('msCopyRes').onclick = () => { navigator.clipboard.writeText($('msRes').textContent); toast('Response copied'); };\n\nonToolExit(() => clearInterval(polling));"
    }
  },
