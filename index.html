v>\n\n      <div id=\"gcSprStatus\">\n        <span id=\"gcStatTool\"></span>\n        <span class=\"div\"></span>\n        <span id=\"gcStatPos\">&mdash;</span>\n        <span class=\"div\"></span>\n        <span id=\"gcStatCol\"></span>\n        <span class=\"sp\"></span>\n        <span id=\"gcStatFrame\"></span>\n        <span class=\"div\"></span>\n        <span id=\"gcStatZoom\"></span>\n      </div>\n\n      <div id=\"gcBottom\">\n        <div id=\"gcPal\"></div>\n        <div id=\"gcTagsWrap\">\n          <div id=\"gcTags\"></div>\n          <button class=\"b s\" id=\"gcTagAdd\" title=\"Name a range of cells so your code and the animation preview can play it back\">+ Tag</button>\n        </div>\n        <div id=\"gcStrip\"></div>\n      </div>\n    </div>\n  </div>\n\n  <!-- ================= MAP ================= -->\n  <div class=\"pane\" id=\"gcPaneMap\">\n    <div class=\"list\" id=\"gcMapList\"></div>\n    <div id=\"gcMapEd\">\n      <div class=\"tools\" id=\"gcMapTools\">\n        <button class=\"b s\" data-back>&larr; Maps</button>\n        <span class=\"tag\" id=\"gcMapName\"></span>\n        <span class=\"div\"></span>\n        <select class=\"b s\" id=\"gcMapSheet\" style=\"padding:6px 8px\"></select>\n        <span class=\"div\"></span>\n        <button class=\"t\" data-tool=\"pen\" title=\"Place tile\">&#9998;</button>\n        <button class=\"t\" data-tool=\"eraser\" title=\"Erase\">&#9003;</button>\n        <button class=\"t\" data-tool=\"rect\" title=\"Rectangle fill\">&#9632;</button>\n        <button class=\"t\" data-tool=\"fill\" title=\"Flood fill\">&#9673;</button>\n        <button class=\"t\" data-tool=\"pick\" title=\"Pick tile\">&#128167;</button>\n        <button class=\"t\" data-tool=\"pan\" title=\"Pan\">&#9995;</button>\n        <span class=\"div\"></span>\n        <button class=\"t\" data-act=\"zin\" title=\"Zoom in\">+</button>\n        <button class=\"t\" data-act=\"zout\" title=\"Zoom out\">&minus;</button>\n        <button class=\"t\" data-act=\"home\" title=\"Back to origin\">&#8962;</button>\n        <button class=\"t\" data-act=\"grid\" title=\"Toggle grid\">#</button>\n        <span class=\"div\"></span>\n        <button class=\"t\" data-act=\"undo\" title=\"Undo\">&#8630;</button>\n        <button class=\"t\" data-act=\"redo\" title=\"Redo\">&#8631;</button>\n        <button class=\"b s\" data-act=\"clear\">Clear map</button>\n        <button class=\"b s\" data-act=\"dl\">&#8681; PNG</button>\n        <button class=\"b s\" data-act=\"opts\">&#9881;</button>\n      </div>\n      <div id=\"gcMapWrap\"><canvas id=\"gcMapCan\"></canvas><div id=\"gcMapHud\">0, 0</div></div>\n      <div id=\"gcBottom2\" style=\"flex:0 0 auto;background:var(--g-p);border-top:1px solid var(--g-line)\">\n        <div id=\"gcMapStrip\" style=\"display:flex;gap:5px;padding:9px 10px;overflow-x:auto\"></div>\n      </div>\n    </div>\n  </div>\n\n  <!-- ================= SFX ================= -->\n  <div class=\"pane\" id=\"gcPaneSfx\">\n    <div class=\"tools\">\n      <div class=\"seg\" id=\"gcSfxSeg\"><button class=\"on\" data-s=\"sfx\">Sound effects</button><button data-s=\"mus\">Music</button></div>\n      <span class=\"sp\"></span>\n      <button class=\"b s\" id=\"gcStopAll\">&#9632; Stop audio</button>\n    </div>\n    <div class=\"list\" id=\"gcSfxList\"></div>\n    <div class=\"list\" id=\"gcMusList\" style=\"display:none\"></div>\n\n    <div id=\"gcSfxEd\">\n      <div class=\"tools\">\n        <button class=\"b s\" data-back>&larr; Sounds</button>\n        <span class=\"tag\" id=\"gcSfxName\"></span>\n        <span class=\"div\"></span>\n        <button class=\"b ok\" data-act=\"play\">&#9654; Play</button>\n        <button class=\"b s\" data-act=\"stop\">&#9632;</button>\n        <button class=\"t\" data-act=\"loop\" title=\"Loop\">&#8635;</button>\n        <span class=\"div\"></span>\n        <button class=\"b s\" data-act=\"up\">Pitch +1</button>\n        <button class=\"b s\" data-act=\"down\">Pitch -1</button>\n        <button class=\"b s\" data-act=\"shl\">&#8592; Shift</button>\n        <button class=\"b s\" data-act=\"shr\">Shift &#8594;</button>\n        <button class=\"b s\" data-act=\"clear\">Clear</button>\n        <button class=\"b s\" data-act=\"rand\">Randomise</button>\n        <button class=\"b s\" data-act=\"rename\">Rename</button>\n      </div>\n      <div id=\"gcSfxBody\">\n        <div id=\"gcRollWrap\"><canvas id=\"gcRoll\"></canvas></div>\n        <div id=\"gcStepsWrap\"><canvas id=\"gcSteps\"></canvas></div>\n        <div class=\"fld\"><label>Speed</label><input type=\"range\" id=\"gcSpeed\" min=\"1\" max=\"48\" value=\"14\"><span class=\"val\" id=\"gcSpeedV\">14</span>\n          <label>Length</label><input type=\"range\" id=\"gcLen\" min=\"1\" max=\"32\" value=\"32\"><span class=\"val\" id=\"gcLenV\">32</span></div>\n        <div class=\"fld\"><label>Wave</label><div class=\"wavebtns\" id=\"gcWaves\"></div></div>\n        <div class=\"fld\"><label>Volume</label><input type=\"range\" id=\"gcVol\" min=\"0\" max=\"7\" value=\"5\"><span class=\"val\" id=\"gcVolV\">5</span></div>\n        <div class=\"fld\"><label>Effect</label><div class=\"fxbtns\" id=\"gcFx\"></div></div>\n        <div class=\"fld\"><button class=\"b s\" id=\"gcApplyAll\">Apply wave / volume / effect to every note</button>\n          <span class=\"tag\" id=\"gcStepInfo\"></span></div>\n      </div>\n    </div>\n\n    <div id=\"gcMusEd\">\n      <div class=\"tools two\">\n        <button class=\"b s\" data-back>&larr; Music</button>\n        <span class=\"tag\" id=\"gcMusName\"></span>\n\n        <div class=\"tgrp\"><span class=\"tgl\">Transport</span><div class=\"trow\">\n          <button class=\"b ok\" data-act=\"play\">&#9654; Play</button>\n          <button class=\"b s\" data-act=\"stop\">&#9632; Stop</button>\n          <button class=\"t\" data-act=\"loop\" title=\"Repeat the song when it reaches the end\">&#8635;</button>\n        </div></div>\n\n        <div class=\"tgrp\"><span class=\"tgl\">Rows</span><div class=\"trow\">\n          <button class=\"b s\" data-act=\"add\">+ Row</button>\n          <button class=\"b s\" data-act=\"dupRow\">Duplicate</button>\n          <button class=\"b s\" data-act=\"clearRow\">Clear</button>\n        </div></div>\n\n        <div class=\"tgrp\"><span class=\"tgl\">Track</span><div class=\"trow\">\n          <button class=\"b s\" data-act=\"rename\">Rename</button>\n          <button class=\"b s\" data-act=\"unmute\">Unmute all</button>\n        </div></div>\n\n        <span class=\"sp\"></span>\n        <span class=\"tag\" id=\"gcMusInfo\"></span>\n      </div>\n      <div id=\"gcMusBody\">\n        <div id=\"gcTrack\">\n          <div class=\"thead\" id=\"gcTHead\"></div>\n          <div id=\"gcRows\"></div>\n        </div>\n        <div class=\"mlegend\">\n          <span><b style=\"color:var(--g-acc)\">&#9698;</b> loop returns here</span>\n          <span><b style=\"color:var(--g-acc2)\">&#9632;</b> song ends here</span>\n          <span><b style=\"color:var(--g-ok)\">&#9654;</b> play from this row</span>\n        </div>\n        <p class=\"mhint\">\n          A track is a list of <b>rows</b>, played top to bottom. Each row triggers up to four sounds\n          at once &mdash; one per <b>channel</b> &mdash; so you can layer a bassline, a melody, a\n          harmony and a drum. A row lasts as long as its longest sound.\n          Use <b>M</b> to silence a channel while you work and <b>S</b> to hear it on its own;\n          neither is saved, and both are ignored by the running game.\n        </p>\n      </div>\n    </div>\n  </div>\n\n  <!-- ================= CODE ================= -->\n  <div class=\"pane\" id=\"gcPaneCode\">\n    <div class=\"tools\">\n      <button class=\"b ok\" id=\"gcRunBtn2\">&#9654; Run game</button>\n      <span class=\"div\"></span>\n      <button class=\"b s\" id=\"gcDocsBtn\">API reference</button>\n      <button class=\"b s\" id=\"gcTemplate\">Insert snippet</button>\n      <span class=\"sp\"></span>\n      <span class=\"tag\" id=\"gcCodeInfo\">Ln 1, Col 1</span>\n    </div>\n    <div id=\"gcCodeWrap\">\n      <div id=\"gcGutter\">1</div>\n      <textarea id=\"gcCode\" spellcheck=\"false\" autocapitalize=\"off\" autocomplete=\"off\" autocorrect=\"off\"></textarea>\n      <div id=\"gcDocs\"></div>\n    </div>\n  </div>\n</div>\n\n<div id=\"gcRun\">\n  <div class=\"rb\">\n    <button class=\"b s\" id=\"gcRunClose\">&larr; Back to editor</button>\n    <button class=\"b s\" id=\"gcRunReload\">&#8635; Restart</button>\n    <button class=\"b s\" id=\"gcLogBtn\">Console</button>\n    <span class=\"sp\"></span>\n    <span class=\"tag\" id=\"gcRunInfo\"></span>\n  </div>\n  <iframe id=\"gcFrame\" title=\"Game\" allow=\"autoplay\"></iframe>\n  <div id=\"gcLog\"></div>\n</div>\n\n<div id=\"gcModal\"><div class=\"box\" id=\"gcModalBox\"></div></div>\n</div>\n",
      "js": "/* ============================================================\n   Game Creator  —  sprites, maps, SFX/music and a Kaplay runtime\n   Everything autosaves to localStorage under gc.games.v1\n   ============================================================ */\nconst $ = id => document.getElementById(id);\nconst KEY = 'gc.games.v1';\nconst CH = '0123456789abcdefghijklmnopqrstuv';   /* palette index -> char, '.' = transparent */\n\nlet games = [], G = null;                        /* G = the open game */\nlet saveT = null;\n\nconst uid = p => (p || 'x') + Math.random().toString(36).slice(2, 8);\nconst esc = s => String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\nconst clone = o => JSON.parse(JSON.stringify(o));\nconst clamp = (v, a, b) => v < a ? a : v > b ? b : v;\n\nconst DEFAULT_PALETTE = ['#000000', '#1D2B53', '#7E2553', '#008751', '#AB5236', '#5F574F', '#C2C3C7', '#FFF1E8',\n  '#FF004D', '#FFA300', '#FFEC27', '#00E436', '#29ADFF', '#83769C', '#FF77A8', '#FFCCAA'];\nconst PALETTES = {\n  'PICO-8': DEFAULT_PALETTE,\n  'Sweetie 16': ['#1a1c2c', '#5d275d', '#b13e53', '#ef7d57', '#ffcd75', '#a7f070', '#38b764', '#257179',\n    '#29366f', '#3b5dc9', '#41a6f6', '#73eff7', '#f4f4f4', '#94b0c2', '#566c86', '#333c57'],\n  'Endesga 16': ['#0d2b45', '#203c56', '#544e68', '#8d697a', '#d08159', '#ffaa5e', '#ffd4a3', '#ffecd6',\n    '#e2c290', '#c19a6b', '#9c7a51', '#755b3f', '#4d3a2b', '#33241c', '#1a120e', '#000000'],\n  'Game Boy': ['#0f380f', '#306230', '#8bac0f', '#9bbc0f', '#000000', '#1e1e1e', '#3c3c3c', '#5a5a5a',\n    '#787878', '#969696', '#b4b4b4', '#d2d2d2', '#f0f0f0', '#ffffff', '#203020', '#405040'],\n  'Greyscale': ['#000000', '#111111', '#222222', '#333333', '#444444', '#555555', '#666666', '#777777',\n    '#888888', '#999999', '#aaaaaa', '#cccccc', '#dddddd', '#eeeeee', '#f7f7f7', '#ffffff'],\n  'Vivid': ['#000000', '#ffffff', '#ff0040', '#ff8c00', '#ffe600', '#37ff00', '#00ffa6', '#00d0ff',\n    '#0060ff', '#7a00ff', '#ff00e1', '#8b5a2b', '#3d3d5c', '#7b7b9e', '#c0c0d8', '#20203a']\n};\n\n/* ---------- storage ---------- */\nfunction load() {\n  try { games = JSON.parse(localStorage.getItem(KEY)) || []; } catch { games = []; }\n  games.forEach(fixGame);\n}\nfunction fixGame(g) {\n  g.sheets = g.sheets || []; g.maps = g.maps || []; g.sfx = g.sfx || []; g.music = g.music || [];\n  g.code = g.code == null ? DEFAULT_CODE : g.code;\n  g.settings = Object.assign({ w: 320, h: 240, scale: 3, bg: '#0f0f1a', crisp: true, letterbox: true, kaplay: KAPLAY_URL }, g.settings || {});\n  g.sheets.forEach(s => { s.palette = s.palette || DEFAULT_PALETTE.slice(); s.sprites = s.sprites || []; s.tags = s.tags || []; });\n  g.maps.forEach(m => { m.tiles = m.tiles || {}; });\n  g.sfx.forEach(s => { if (!s.notes) s.notes = blankNotes(); });\n  g.music.forEach(m => { m.patterns = m.patterns || []; });\n}\nfunction save(quiet) {\n  try { localStorage.setItem(KEY, JSON.stringify(games)); }\n  catch (e) { toast('Storage full \\u2014 delete a game or shrink a map'); return; }\n  const el = $('gcSaved');\n  if (!quiet && el) {\n    el.textContent = 'Saving\\u2026'; el.classList.add('busy');\n    clearTimeout(saveT);\n    saveT = setTimeout(() => { el.textContent = 'Saved'; el.classList.remove('busy'); }, 340);\n  }\n}\nfunction touch() { if (G) G.updated = Date.now(); save(); }\n\n/* ---------- generic modal form ----------\n   fields: [{k, l, t:'text|num|sel|color|check|area', v, o, mn, mx, hint}]  */\nfunction form(title, sub, fields, okLabel) {\n  return new Promise(resolve => {\n    const box = $('gcModalBox');\n    box.innerHTML = '<h3>' + esc(title) + '</h3>' + (sub ? '<p class=\"sub\">' + esc(sub) + '</p>' : '');\n    const inputs = {};\n    fields.forEach(f => {\n      const wrap = document.createElement('div');\n      if (f.t === 'check') {\n        wrap.innerHTML = '<label style=\"display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--g-ink);margin-top:14px\">' +\n          '<input type=\"checkbox\" style=\"width:17px;height:17px;flex:0 0 auto;accent-color:var(--g-acc)\">' + esc(f.l) + '</label>';\n        wrap.querySelector('input').checked = !!f.v;\n      } else if (f.t === 'sel') {\n        wrap.innerHTML = '<label>' + esc(f.l) + '</label><select>' +\n          f.o.map(o => '<option value=\"' + esc(o[0]) + '\"' + (String(o[0]) === String(f.v) ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';\n      } else if (f.t === 'area') {\n        wrap.innerHTML = '<label>' + esc(f.l) + '</label><textarea rows=\"4\">' + esc(f.v || '') + '</textarea>';\n      } else {\n        wrap.innerHTML = '<label>' + esc(f.l) + '</label><input type=\"' + (f.t === 'num' ? 'number' : f.t === 'color' ? 'color' : 'text') + '\"' +\n          (f.mn != null ? ' min=\"' + f.mn + '\"' : '') + (f.mx != null ? ' max=\"' + f.mx + '\"' : '') + '>';\n        wrap.querySelector('input').value = f.v == null ? '' : f.v;\n      }\n      if (f.hint) wrap.insertAdjacentHTML('beforeend', '<p class=\"sub\" style=\"margin:5px 0 0;font-size:11.5px\">' + esc(f.hint) + '</p>');\n      inputs[f.k] = wrap.querySelector('input,select,textarea');\n      box.appendChild(wrap);\n    });\n    const acts = document.createElement('div');\n    acts.className = 'acts';\n    acts.innerHTML = '<button class=\"cancel\">Cancel</button><button class=\"go\">' + esc(okLabel || 'Create') + '</button>';\n    box.appendChild(acts);\n    const close = v => { $('gcModal').classList.remove('on'); box.innerHTML = ''; resolve(v); };\n    acts.querySelector('.cancel').onclick = () => close(null);\n    acts.querySelector('.go').onclick = () => {\n      const out = {};\n      fields.forEach(f => {\n        const el = inputs[f.k];\n        out[f.k] = f.t === 'check' ? el.checked : f.t === 'num' ? +el.value : el.value;\n      });\n      close(out);\n    };\n    box.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') acts.querySelector('.go').click(); });\n    $('gcModal').classList.add('on');\n    const first = box.querySelector('input,select,textarea');\n    if (first) setTimeout(() => { first.focus(); if (first.select) first.select(); }, 40);\n  });\n}\n$('gcModal').onclick = e => { if (e.target.id === 'gcModal') { $('gcModal').classList.remove('on'); $('gcModalBox').innerHTML = ''; } };\n\n/* ---------- sheet helpers ---------- */\nconst blankSprite = (w, h) => '.'.repeat(w * h);\nfunction newSheet(name, w, h, count, cols) {\n  return {\n    id: uid('sh'), name, w, h, count, cols: cols || Math.min(16, count),\n    palette: DEFAULT_PALETTE.slice(),\n    sprites: Array.from({ length: count }, () => blankSprite(w, h)),\n    tags: []\n  };\n}\nconst sheetRows = s => Math.ceil(s.count / s.cols);\nconst findSheet = id => G.sheets.find(s => s.id === id);\n\n/* draw one sprite onto a 2d context at 1px per pixel */\nfunction drawSprite(ctx, sheet, idx, ox, oy) {\n  const px = sheet.sprites[idx] || '';\n  const p = sheet.palette;\n  for (let y = 0; y < sheet.h; y++) {\n    for (let x = 0; x < sheet.w; x++) {\n      const c = px[y * sheet.w + x];\n      if (!c || c === '.') continue;\n      const ci = CH.indexOf(c);\n      if (ci < 0 || !p[ci]) continue;\n      ctx.fillStyle = p[ci];\n      ctx.fillRect(ox + x, oy + y, 1, 1);\n    }\n  }\n}\n/* full sheet as a canvas (cols x rows grid, transparent gaps) */\nfunction sheetCanvas(sheet) {\n  const rows = sheetRows(sheet);\n  const c = document.createElement('canvas');\n  c.width = sheet.cols * sheet.w; c.height = rows * sheet.h;\n  const ctx = c.getContext('2d');\n  ctx.imageSmoothingEnabled = false;\n  for (let i = 0; i < sheet.count; i++)\n    drawSprite(ctx, sheet, i, (i % sheet.cols) * sheet.w, Math.floor(i / sheet.cols) * sheet.h);\n  return c;\n}\nfunction spriteCanvas(sheet, idx, scale) {\n  const s = scale || 1;\n  const c = document.createElement('canvas');\n  c.width = sheet.w * s; c.height = sheet.h * s;\n  const ctx = c.getContext('2d');\n  ctx.imageSmoothingEnabled = false;\n  if (s === 1) drawSprite(ctx, sheet, idx, 0, 0);\n  else { const t = spriteCanvas(sheet, idx, 1); ctx.drawImage(t, 0, 0, c.width, c.height); }\n  return c;\n}\nfunction downloadCanvas(canvas, name) {\n  canvas.toBlob(b => {\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(b); a.download = name; a.click();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  }, 'image/png');\n}\nfunction dlText(text, name, type) {\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));\n  a.download = name; a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n}\n\n/* ============================================================\n   Synth engine.  Written as one self-contained factory so the\n   exact same code can be stringified into the game runtime.\n   ============================================================ */\nfunction GCSynth() {\n  var AC = window.AudioContext || window.webkitAudioContext;\n  var ctx = null, master = null, waves = {}, nbuf = null;\n  var timers = [], srcs = [], playing = false;\n\n  var SHAPES = [\n    function (t) { return 4 * Math.abs(t - 0.5) - 1; },                                  /* 0 triangle   */\n    function (t) { return t < 0.875 ? (t / 0.875) * 2 - 1 : ((1 - t) / 0.125) * 2 - 1; },/* 1 tilted saw */\n    function (t) { return t * 2 - 1; },                                                  /* 2 saw        */\n    function (t) { return t < 0.5 ? 1 : -1; },                                           /* 3 square     */\n    function (t) { return t < 0.25 ? 1 : -1; },                                          /* 4 pulse      */\n    function (t) { return (Math.sin(6.283185 * t) + 0.5 * Math.sin(12.56637 * t) + 0.28 * Math.sin(25.13274 * t)) * 0.66; }, /* 5 organ */\n    null,                                                                                /* 6 noise      */\n    function (t) { return ((t * 2 - 1) + (((t * 1.505) % 1) * 2 - 1)) * 0.5; }            /* 7 phaser     */\n  ];\n\n  function begin() {\n    if (!ctx) {\n      ctx = new AC();\n      master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);\n    }\n    if (ctx.state === 'suspended') ctx.resume();\n    return ctx;\n  }\n  function periodic(i) {\n    if (waves[i]) return waves[i];\n    var c = begin(), N = 512, H = 40, re = new Float32Array(H), im = new Float32Array(H);\n    var shape = SHAPES[i] || SHAPES[0], buf = new Float32Array(N), n, h, a, sr, si;\n    for (n = 0; n < N; n++) buf[n] = shape(n / N);\n    for (h = 1; h < H; h++) {\n      sr = 0; si = 0;\n      for (n = 0; n < N; n++) { a = 6.283185307 * h * n / N; sr += buf[n] * Math.cos(a); si -= buf[n] * Math.sin(a); }\n      re[h] = sr * 2 / N; im[h] = si * 2 / N;\n    }\n    return waves[i] = c.createPeriodicWave(re, im);\n  }\n  function noise() {\n    if (nbuf) return nbuf;\n    var c = begin(), len = c.sampleRate * 2;\n    nbuf = c.createBuffer(1, len, c.sampleRate);\n    var d = nbuf.getChannelData(0), s = 0;\n    for (var i = 0; i < len; i++) { s = (s + (Math.random() * 2 - 1)) * 0.5; d[i] = s * 1.6; }\n    return nbuf;\n  }\n  function freq(p) { return 65.40639 * Math.pow(2, p / 12); }\n\n  function voice(n, t0, dur, prev, group) {\n    if (!n || !n.v) return;\n    var c = begin(), g = c.createGain();\n    g.connect(master);\n    var f = freq(n.p), v = (n.v / 7) * 0.32, e = n.e | 0, src, param, base;\n    if (n.w === 6) {\n      src = c.createBufferSource(); src.buffer = noise(); src.loop = true;\n      param = src.playbackRate; base = Math.max(0.05, f / 440);\n      param.setValueAtTime(base, t0);\n    } else {\n      src = c.createOscillator(); src.setPeriodicWave(periodic(n.w | 0));\n      param = src.frequency; base = f;\n      param.setValueAtTime(base, t0);\n    }\n    if (e === 1 && prev) { param.setValueAtTime(n.w === 6 ? Math.max(.05, prev / 440) : prev, t0); param.linearRampToValueAtTime(base, t0 + dur); }\n    else if (e === 3) { param.exponentialRampToValueAtTime(Math.max(0.02, base * 0.1), t0 + dur); }\n    else if (e === 2) {\n      var lfo = c.createOscillator(), lg = c.createGain();\n      lfo.frequency.value = 7; lg.gain.value = base * 0.035;\n      lfo.connect(lg); lg.connect(param); lfo.start(t0); lfo.stop(t0 + dur); srcs.push(lfo);\n    } else if (e === 6 || e === 7) {\n      var pitches = [], i;\n      for (i = 0; i < group.length; i++) if (group[i] && group[i].v) pitches.push(group[i].p);\n      if (!pitches.length) pitches = [n.p];\n      var reps = e === 6 ? 4 : 2, total = reps * pitches.length, step = dur / total;\n      for (i = 0; i < total; i++) {\n        var fp = freq(pitches[i % pitches.length]);\n        param.setValueAtTime(n.w === 6 ? Math.max(.05, fp / 440) : fp, t0 + i * step);\n      }\n    }\n    var atk = 0.005, rel = Math.min(0.04, dur * 0.35);\n    g.gain.setValueAtTime(0.0001, t0);\n    if (e === 4) g.gain.linearRampToValueAtTime(v, t0 + dur * 0.85);\n    else g.gain.linearRampToValueAtTime(v, t0 + atk);\n    if (e === 5) g.gain.linearRampToValueAtTime(0.0001, t0 + dur);\n    else { g.gain.setValueAtTime(v, t0 + Math.max(atk + 0.001, dur - rel)); g.gain.linearRampToValueAtTime(0.0001, t0 + dur); }\n    src.connect(g);\n    src.start(t0); src.stop(t0 + dur + 0.02);\n    srcs.push(src);\n  }\n\n  function sfxDur(s) { return (s.len || 32) * ((s.speed || 14) / 128); }\n\n  function playSfx(s, when) {\n    if (!s) return 0;\n    var c = begin(), sd = (s.speed || 14) / 128, len = s.len || 32;\n    var t0 = when == null ? c.currentTime + 0.03 : when, prev = null, i;\n    for (i = 0; i < len; i++) {\n      var n = s.notes[i];\n      if (n && n.v) { var gs = Math.floor(i / 4) * 4; voice(n, t0 + i * sd, sd * 0.96, prev, s.notes.slice(gs, gs + 4)); prev = freq(n.p); }\n      else prev = null;\n    }\n    playing = true;\n    return t0 + len * sd;\n  }\n  function loopSfx(s) {\n    var e dd([',\n  '  rect(12, 12),',\n  '  color(120, 200, 255),',\n  '  pos(center()),',\n  '  anchor(\"center\"),',\n  '  area(),',\n  '  \"player\",',\n  ']);',\n  '',\n  'onKeyDown(\"left\",  () => player.move(-90, 0));',\n  'onKeyDown(\"right\", () => player.move(90, 0));',\n  'onKeyDown(\"up\",    () => player.move(0, -90));',\n  'onKeyDown(\"down\",  () => player.move(0, 90));',\n  '',\n  'onUpdate(() => {',\n  '  player.pos.x = clamp(player.pos.x, 0, width());',\n  '  player.pos.y = clamp(player.pos.y, 0, height());',\n  '});'\n].join('\\n');\n\nfunction renderHome() {\n  G = null;\n  $('gcHome').style.display = 'block';\n  $('gcEd').classList.remove('on');\n  $('gcBarHome').style.display = 'flex';\n  $('gcBarEd').style.display = 'none';\n  synth.stop();\n  const box = $('gcGames');\n  if (!games.length) {\n    box.innerHTML = '<div class=\"empty\"><b>No games yet.</b><br>Tap <b>+ New Game</b> to make sprites, maps, sound and code in one place.</div>';\n    return;\n  }\n  box.innerHTML = '<div class=\"g\">' + games.map(g =>\n    '<div class=\"c\" data-id=\"' + g.id + '\"><h3>' + esc(g.name) + '</h3>' +\n    '<p>' + g.sheets.length + ' sheets \\u00B7 ' + g.maps.length + ' maps<br>' +\n    g.sfx.length + ' sounds \\u00B7 ' + g.music.length + ' tracks</p>' +\n    '<div class=\"row\"><button class=\"b p s\" data-open>Open</button><button class=\"b s\" data-more>\\u2026</button></div></div>').join('') + '</div>';\n  box.querySelectorAll('.c').forEach(el => {\n    const id = el.dataset.id;\n    el.onclick = e => { if (!e.target.closest('[data-more]')) openGame(id); };\n    el.querySelector('[data-more]').onclick = async e => {\n      e.stopPropagation();\n      const g = games.find(x => x.id === id);\n      const pick = await choose(g.name, ['Open', 'Rename\\u2026', 'Duplicate', 'Export (.json)', 'Delete']);\n      if (pick === 'Open') openGame(id);\n      else if (pick === 'Rename\\u2026') { const v = await ask('Rename game', 'Game name', g.name); if (v) { g.name = v.tr grids. */\nfunction shapeCanvas(w, h, ops) {\n  const fake = { w, h };\n  const arr = blankSprite(w, h).split('');\n  ops.forEach(op => {\n    const k = op[0];\n    if (k === 'rect') rectOp(arr, fake, op[1], op[2], op[3], op[4], op[5], op[6]);\n    else if (k === 'ellipse') ellipseOp(arr, fake, op[1], op[2], op[3], op[4], op[5], op[6]);\n    else if (k === 'line') line(arr, fake, op[1], op[2], op[3], op[4], op[5]);\n    else if (k === 'put') arr[idxAt(fake, op[1], op[2])] = op[3];\n  });\n  return arr.join('');\n}\n/* Stamps a row of ASCII art onto a map: each character in `rows` looks up a\n   cell index in `legend`; a space means \"leave this square empty\". */\nfunction paintMap(map, sheetId, legend, rows) {\n  rows.forEach((row, y) => {\n    for (let x = 0; x < row.length; x++) {\n      const ch = row[x];\n      if (ch === ' ' || legend[ch] == null) continue;\n      map.tiles[x + ',' + y] = sheetId + '/' + legend[ch];\n    }\n  });\n}\n/* A short looping tune: one tiny sfx per note, sequenced into a music\n   track that loops from its first row. Enough to prove music works and\n   give each template its own mood, without hand-composing a real song. */\nfunction makeSimpleTune(g, name, wave, pitches, speed) {\n  const ids = pitches.map((p, i) => {\n    const s = newSfx(name + '_note' + (i + 1));\n    s.speed = speed || 14; s.len = 10;\n    for (let n = 0; n < 6; n++) s.notes[n] = { p: p, w: wave, v: 5, e: n === 5 ? 5 : 0 };\n    g.sfx.push(s);\n    return s.id;\n  });\n  const mus = newMusic(name + '_theme');\n  mus.patterns = ids.map((id, i) => ({ ch: [id, null, null, null], start: i === 0, stop: false }));\n  g.music.push(mus);\n  return mus;\n}\n\n/* ---------- game templates, offered when creating a new game ----------\n   Each one seeds its own sprites (with a couple of animation tags),\n   sfx, a map, a music track, and code that ties them together — a\n   self-contained example of a different kind of game, not a checkbox\n   bolted onto a blank project. */ nst enemy = newSheet('enemy', 8, 8, 1, 1);\n      enemy.sprites[0] = shapeCanvas(8, 8, [['ellipse',0,0,7,7,'8',true],['ellipse',2,2,5,5,'2',true]]);\n      g.sheets.push(enemy);\n\n      const bullet = newSheet('bullet', 4, 4, 1, 1);\n      bullet.sprites[0] = shapeCanvas(4, 4, [['rect',1,0,2,3,'a',true]]);\n      g.sheets.push(bullet);\n\n      const star = newSheet('star', 4, 4, 1, 1);\n      star.sprites[0] = shapeCanvas(4, 4, [['put',1,1,'7'],['put',2,2,'6']]);\n      g.sheets.push(star);\n\n      const map = { id: uid('map'), name: 'starfield', sheets: [star.id], tiles: {} };\n      for (let i = 0; i < 40; i++) {\n        const x = Math.floor(Math.random() * 26), y = Math.floor(Math.random() * 18);\n        map.tiles[x + ',' + y] = star.id + '/0';\n      }\n      g.maps.push(map);\n\n      const shoot = newSfx('shoot');\n      for (let i = 0; i < 4; i++) shoot.notes[i] = { p: 60 - i * 4, w: 4, v: 5, e: 0 };\n      shoot.len = 5; shoot.speed = 12; g.sfx.push(shoot);\n      const explode = newSfx('explode');\n      for (let i = 0; i < 10; i++) explode.notes[i] = { p: 30, w: 6, v: 6, e: 3 };\n      explode.len = 12; explode.speed = 12; g.sfx.push(explode);\n\n      makeSimpleTune(g, 'shooter', 2, [36, 39, 43, 36], 9);\n    },\n    code(g) {\n      return [\n        'setBackground(rgb(6, 8, 20));',\n        'addMap(\"starfield\", { scale: 3 });',\n        '',\n        'const player = add([',\n        '  sprite(\"ship\"),',\n        '  pos(width() / 2, height() - 30),',\n        '  anchor(\"center\"),',\n        '  scale(3),',\n        '  area(),',\n        '  \"player\",',\n        ']);',\n        '',\n        'const SPEED = 200;',\n        'onKeyDown(\"left\",  () => player.move(-SPEED, 0));',\n        'onKeyDown(\"right\", () => player.move(SPEED, 0));',\n        '',\n        'function shoot() {',\n        '  add([sprite(\"bullet\"), pos(player.pos.x, player.pos.y - 14), anchor(\"center\"), scale(3), area(), move(UP, 400), \"bullet\"]);',\n        '  playSfx(\"sh click = renderHome;\n$('gcImport').onclick = () => {\n  const inp = document.createElement('input');\n  inp.type = 'file'; inp.accept = 'application/json,.json';\n  inp.onchange = () => {\n    const f = inp.files[0]; if (!f) return;\n    const rd = new FileReader();\n    rd.onload = () => {\n      try {\n        const data = JSON.parse(rd.result);\n        (Array.isArray(data) ? data : [data]).forEach(g => { g.id = uid('g'); fixGame(g); games.unshift(g); });\n        save(); renderHome(); toast('Imported');\n      } catch { toast('That file is not a Game Creator export'); }\n    };\n    rd.readAsText(f);\n  };\n  inp.click();\n};\n$('gcSettings').onclick = async () => {\n  const s = G.settings;\n  const r = await form('Game settings', 'These are passed to kaplay() when the game starts.', [\n    { k: 'name', l: 'Game name', t: 'text', v: G.name },\n    { k: 'w', l: 'Screen width', t: 'num', v: s.w, mn: 32, mx: 1920 },\n    { k: 'h', l: 'Screen height', t: 'num', v: s.h, mn: 32, mx: 1080 },\n    { k: 'scale', l: 'Pixel scale', t: 'num', v: s.scale, mn: 1, mx: 8 },\n    { k: 'bg', l: 'Background colour', t: 'color', v: s.bg },\n    { k: 'crisp', l: 'Crisp pixels (no smoothing)', t: 'check', v: s.crisp },\n    { k: 'letterbox', l: 'Letterbox to fit the window', t: 'check', v: s.letterbox },\n    { k: 'kaplay', l: 'Kaplay script URL', t: 'text', v: s.kaplay, hint: 'Change this to pin a different Kaplay version.' }\n  ], 'Save');\n  if (!r) return;\n  G.name = r.name.trim() || G.name;\n  Object.assign(s, { w: r.w, h: r.h, scale: r.scale, bg: r.bg, crisp: r.crisp, letterbox: r.letterbox, kaplay: r.kaplay });\n  $('gcName').textContent = G.name;\n  touch();\n};\n\n/* ============================================================\n   SPRITES\n   A \"sheet\" is a grid of same-sized cells. Any cell can be used on its\n   own (as a tile, an icon, a single-frame object) or as part of a named\n   \"tag\" \\u2014 a range of cells played back in order, which is what most\n   people mean by \"animation\". Tags map directly onto Kaplay's own\n   loadSprite(...) anims option, so naming one here is enough to play it\n   in code with obj.play(\"name\").\n   ============================================================ */\nlet curSheet = null, curSprite = 0, sprTool = 'pen', palIdx = 8;\nlet mirX = false, mirY = false, sprGrid = true;\nlet clipboard = null, selRect = null;\nconst undoS = {}, redoS = {};\n\n/* zoom: 0 = fit to the window, otherwise an explicit pixel size */\nlet sprZoom = 0, brushSize = 1, onionOn = false;\n/* animation preview */\nlet animOn = false, animTimer = null, animFrame = 0, animFps = 8;\n\n/* Each tool gets a plain-English name and a one-line hint for the status bar,\n   so it is always obvious what the selected tool will do. */\nconst TOOL_INFO = {\n  pen:      ['Pencil',        'Drag to paint. Brush size sets the nib width.'],\n  eraser:   ['Eraser',        'Drag to rub pixels back to transparent.'],\n  fill:     ['Flood fill',    'Tap an area to flood it with the chosen colour.'],\n  replace:  ['Replace colour','Tap a pixel to swap every pixel of that colour.'],\n  pick:     ['Colour picker', 'Tap a pixel to make its colour the active one.'],\n  line:     ['Line',          'Drag from one point to another.'],\n  rect:     ['Rectangle',     'Drag to draw an outlined box.'],\n  rectf:    ['Filled box',    'Drag to draw a solid box.'],\n  ellipse:  ['Ellipse',       'Drag to draw an outlined ellipse.'],\n  ellipsef: ['Filled ellipse','Drag to draw a solid ellipse.'],\n  select:   ['Select',        'Drag a box, then drag inside it to move those pixels.'],\n  shift:    ['Shift cell',    'Drag to slide the whole cell around; edges wrap.']\n};\n\nconst TAG_COLORS = ['#4C8DFF', '#3DD68C', '#FFB84D', '#FF6B9D', '#C084FC', '#5FE3E3', '#9C9CB2', '#FF8A5B'];\nconst tagColor = i => TAG_COLORS[i % TAG_COLORS.length];\n\nfunction renderSheetList() {\n  const box = $('gcSheetList');\n  $('gcSprEd').classList.remove('on');\n  box.style.disp on(k){',\n  '   var t = m.tiles[k], p = k.split(\",\"), gx = +p[0], gy = +p[1];',\n  '   if (opt.filter && !opt.filter(t.frame, gx, gy)) return;',\n  '   var comps = [ sprite(t.sheet, { frame: t.frame }), pos(ox + gx * tw, oy + gy * th), anchor(\"topleft\") ];',\n  '   if (sc !== 1) comps.push(scale(sc));',\n  '   if (opt.z != null) comps.push(z(opt.z));',\n  '   if (opt.area || opt.body || opt.solid) comps.push(area());',\n  '   if (opt.body || opt.solid) comps.push(body({ isStatic: true }));',\n  '   comps.push(\"tile\", \"tile\" + t.frame, name);',\n  '   (opt.tags || []).forEach(function(tg){ comps.push(tg); });',\n  '   objs.push(add(comps));',\n  '  });',\n  '  var b = m.bounds;',\n  '  return { objs: objs, tileWidth: tw, tileHeight: th, map: m,',\n  '           width: b ? b.w * tw : 0, height: b ? b.h * th : 0,',\n  '           tileAt: function(x, y){ return m.tiles[x + \",\" + y] || null; } };',\n  ' }',\n  ' function playSfx(name){',\n  '  var f = SFX[name];',\n  '  if (!f) { console.warn(\"playSfx: no sound called \\\\\"\" + name + \"\\\\\"\"); return; }',\n  '  return synth.playSfx(f);',\n  ' }',\n  ' function playMusic(name, opt){',\n  '  var m = MUSIC[name];',\n  '  if (!m) { console.warn(\"playMusic: no track called \\\\\"\" + name + \"\\\\\"\"); return; }',\n  '  synth.playMusic(JSON.parse(JSON.stringify(m)), D.sfx, !opt || opt.loop !== false);',\n  ' }',\n  ' return { start: start, synth: synth };',\n  '})();'\n].join('\\n');\n\nfunction runGame() {\n  if (!G) return;\n  synth.stop();\n  $('gcLog').innerHTML = '';\n  $('gcRunInfo').textContent = G.settings.w + '\\u00D7' + G.settings.h + ' \\u00B7 \\u00D7' + G.settings.scale;\n  $('gcRun').classList.add('on');\n  $('gcFrame').srcdoc = buildRunner();\n}\nfunction logLine(level, msg) {\n  const box = $('gcLog');\n  const d = document.createElement('div');\n  d.className = level === 'error' ? 'e' : level === 'warn' ? 'w' : '';\n  d.textContent = msg;\n  box.appendChild(d);\n  box.scrollTop = box.scrollHeight;\n  if (level === 'error') box.classList.add('on');\n}\nconst onMsg = e => { if (e.data && e.data.__gc) logLine(e.data.level, e.data.msg); };\naddEventListener('message', onMsg);\n\n$('gcRunBtn').onclick = runGame;\n$('gcRunBtn2').onclick = runGame;\n$('gcRunReload').onclick = runGame;\n$('gcLogBtn').onclick = () => $('gcLog').classList.toggle('on');\n$('gcRunClose').onclick = () => { $('gcRun').classList.remove('on'); $('gcFrame').srcdoc = ''; };\n\n/* ---------- API reference ---------- */\nfunction renderDocs() {\n  const sh = G && G.sheets[0], mp = G && G.maps[0], sf = G && G.sfx[0], mu = G && G.music[0];\n  const tag = sh && (sh.tags || [])[0];\n  $('gcDocs').innerHTML =\n    '<h4>How it runs</h4><p>Kaplay is started for you with your Settings, every sheet is loaded as a sprite, ' +\n    'and your code runs once all assets are ready. All Kaplay functions are global \\u2014 no <code>import</code>, no <code>kaplay()</code> call needed.</p>' +\n    '<h4>Sprites</h4>' +\n    '<p>Each sheet is one Kaplay sprite; each cell is numbered left to right, top to bottom, starting at 0.</p>' +\n    '<pre>add([\\n  sprite(\"' + esc(sh ? sh.name : 'main') + '\", { frame: 3 }),\\n  pos(40, 40),\\n]);\\n\\n// shorthand\\nadd([ spr(\"' + esc(sh ? sh.name : 'main') + '\", 3), pos(40, 40) ]);</pre>' +\n    '<p>A named tag on a sheet becomes a real Kaplay animation \\u2014 play it by name instead of juggling frame numbers:</p>' +\n    '<pre>add([\\n  sprite(\"' + esc(sh ? sh.name : 'main') + '\"' + (tag ? ', { anim: \"' + esc(tag.name) + '\" }' : '') + '),\\n  pos(40, 40),\\n]);\\n\\n' +\n    (tag ? 'obj.play(\"' + esc(tag.name) + '\");   // switch animation at any time' : '// tag a range of cells on the Sprites tab, then: obj.play(\"walk\")') + '</pre>' +\n    '<p>Use <code>SHEETS[\"' + esc(sh ? sh.name : 'main') + '\"]</code> to read <code>w</code>, <code>h</code>, <code>cols</code>, <code>count</code> at runtime.</p>' +\n    '<h4>Maps</h4>' +\n    '<pre>const level = addMap(           // gravity + solid ground, needs area()\\n  z(0),\\n  \"player\",         // tags: plain strings, any number of them\\n]);\\nobj.destroy();      // or destroy(obj)\\nget(\"enemy\");        // -> array of every obj tagged \"enemy\"</pre>',\n\n  '<h4>Movement &amp; physics</h4>',\n  '<pre>setGravity(1000);\\nobj.move(dx, dy);          // pixels per second, call every frame\\nobj.move(LEFT.scale(200)); // or a vec2 \\u00d7 speed\\nadd([ ..., move(RIGHT, 200) ]); // component: moves itself every frame\\nobj.jump(force);            // needs body()\\nobj.isGrounded();\\nobj.onGround(() => {});\\nobj.onCollide(\"enemy\", (other) => {});</pre>',\n\n  '<h4>Input</h4>',\n  '<pre>onKeyDown(\"left\", () => {});     // fires every frame the key is held\\nonKeyPress(\"space\", () => {});   // fires once on press\\nonKeyRelease(\"space\", () => {});\\nonMouseDown(() => {});\\nonMousePress(() => {});\\nonTouchStart((pos, t) => {});\\nisKeyDown(\"left\");                // poll instead of subscribing</pre>',\n\n  '<h4>Scenes &amp; camera</h4>',\n  '<pre>scene(\"game\", () => { /* build the scene */ });\\ngo(\"game\", data);            // switch scene, optionally passing data\\ncamPos(player.pos);           // follow something\\ncamScale(2);\\nshake(6);                     // quick screen shake\\nflash(\"#ffffff\", 0.2);        // full-screen colour flash</pre>',\n\n  '<h4>Timers &amp; tweens</h4>',\n  '<pre>wait(1.5, () => {});                 // once, after a delay\\nloop(2, () => {});                   // repeatedly, every interval\\ntween(0, 1, 0.3, v => obj.opacity = v, easings.easeOutQuad);</pre>',\n\n  '<h4>Text &amp; UI</h4>',\n  '<pre>const label = add([\\n  text(\"Score: 0\", { size: 16 }),\\n  pos(8, 8),\\n  fixed(),   // stays put when the camera moves\\n]);\\nlabel.text = \"Score: \" + score;</pre>',\n\n  '<h4>Utilities</h4>',\n  '<pre>rand(0, 10);        // random number (or rand(vec2, vec2))\\nchoose([\"a\",\"b\"]);  // random array element\\nwidth(); height( kspace') { e.preventDefault(); cellAction('cellClear'); return; }\n  if (e.key === '[') gotoFrame(curSprite - 1);\n  else if (e.key === ']') gotoFrame(curSprite + 1);\n  else if (e.key === '+' || e.key === '=') setZoom((sprZoom > 0 ? sprZoom : fitZoom()) + 1);\n  else if (e.key === '-' || e.key === '_') setZoom((sprZoom > 0 ? sprZoom : fitZoom()) - 1);\n  else if (e.key === '0') setZoom(0);\n};\naddEventListener('keydown', onKey);\n\nonToolExit(() => {\n  synth.stop();\n  animStop();\n  if (playRAF) cancelAnimationFrame(playRAF);\n  removeEventListener('resize', onResize);\n  removeEventListener('keydown', onKey);\n  removeEventListener('message', onMsg);\n});\n\nload();\nrenderHome();\n"
    }
  }
};

/* ---------- Persistence (global on purpose: any tool can call these) ---------- */
function saveTools(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ v:1, tools, pinned }));
    return true;
  } catch (e){
    toast('Could not save \u2014 storage is full or blocked');
    return false;
  }
}
function loadTools(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || typeof data.tools !== 'object') return false;
    tools  = data.tools;
    pinned = Array.isArray(data.pinned) ? data.pinned : [];
    return true;
  } catch { return false; }
}
/* The default tools live inline below as the DEFAULT_LIBRARY object.
   A deep copy is taken so editing a tool never mutates the constant. */
function defaultLibrary(){ return JSON.parse(JSON.stringify(DEFAULT_LIBRARY)); }
function resetLibrary(){
  tools = defaultLibrary();
  pinned = DEFAULT_PINNED.slice();
  saveTools(); renderHome();
}
function repin(oldKey, newKey){
  pinned = newKey === null
    ? pinned.filter(k => k !== oldKey)
    : pinned.map(k => k === oldKey ? newKey : k);
}

/* ---------- Small utilities shared with every tool ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function iconMarkup(icon, cls){
  icon = String(icon || '').trim();
  const looksLikeImage = /^(https?:\/\/|data:image|blob:|\.{0,2}\/)/i.test(icon);
  if (looksLikeImage){
    return '<img src="' + escapeHtml(icon) + '" alt="" draggable="false" onerror="iconFallback(this)">';
  }
  return '<span class="' + (cls || 'glyph') + '">' + escapeHtml(icon || '\u{1F9F0}') + '</span>';
}
function iconFallback(img){
  const span = document.createElement('span');
  span.className = img.closest('.et-tool') ? 'fallback' : 'glyph';
  span.textContent = '\u{1F9F0}';
  img.replaceWith(span);
}
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ---------- Context menu ---------- */
const menuEl = document.getElementById('menu');
function showMenu(x, y, items){
  menuEl.innerHTML = '';
  for (const item of items){
    if (item === 'sep'){ menuEl.insertAdjacentHTML('beforeend', '<div class="sep"></div>'); continue; }
    if (item.cap){ menuEl.insertAdjacentHTML('beforeend', '<div class="cap">' + escapeHtml(item.cap) + '</div>'); continue; }
    const b = document.createElement('button');
    b.textContent = item.label;
    if (item.danger) b.className = 'danger';
    b.disabled = !!item.disabled;
    b.onclick = () => { hideMenu(); item.on(); };
    menuEl.appendChild(b);
  }
  menuEl.hidden = false;
  const r = menuEl.getBoundingClientRect();
  menuEl.style.left = Math.max(8, Math.min(x, innerWidth  - r.width  - 8)) + 'px';
  menuEl.style.top  = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
}
function hideMenu(){ menuEl.hidden = true; }
addEventListener('pointerdown', e => { if (!menuEl.hidden && !menuEl.contains(e.target)) hideMenu(); }, true);
addEventListener('keydown', e => { if (e.key === 'Escape') hideMenu(); });
addEventListener('resize', hideMenu);

/* ---------- Dialogs (promise based, so tools can await them) ---------- */
function dialog(build){
  return new Promise(resolve => {
    const scrim = document.createElement('div'); scrim.className = 'scrim';
    const box   = document.createElement('div'); box.className = 'modal';
    let settled = false;
    const done = v => { if (settled) return; settled = true; scrim.remove(); box.remove(); removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(null); };
    build(box, done);
    scrim.onclick = () => done(null);
    addEventListener('keydown', onKey);
    document.body.append(scrim, box);
    const focusable = box.querySelector('input,textarea,button');
    if (focusable) focusable.focus();
    if (focusable && focusable.select) focusable.select();
  });
}
function ask(title, label, value, multiline){
  return dialog((box, done) => {
    box.innerHTML =
      '<h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(label) + '</p>' +
      (multiline ? '<textarea spellcheck="false"></textarea>' : '<input spellcheck="false">') +
      '<div class="acts"><button class="ghost">Cancel</button><button class="primary">Save</button></div>';
    const field = box.querySelector('input,textarea');
    field.value = value || '';
    const [cancel, ok] = box.querySelectorAll('.acts button');
    cancel.onclick = () => done(null);
    ok.onclick = () => done(field.value);
    if (!multiline) field.onkeydown = e => { if (e.key === 'Enter') done(field.value); };
  });
}
function confirmDlg(title, message, okLabel){
  return dialog((box, done) => {
    box.innerHTML =
      '<h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(message) + '</p>' +
      '<div class="acts"><button class="ghost">Cancel</button><button class="primary danger">' + escapeHtml(okLabel || 'Confirm') + '</button></div>';
    const [cancel, ok] = box.querySelectorAll('.acts button');
    cancel.onclick = () => done(false);
    ok.onclick = () => done(true);
  });
}
function choose(title, options){
  return dialog((box, done) => {
    box.innerHTML = '<h3>' + escapeHtml(title) + '</h3><div class="opts"></div>' +
                    '<div class="acts"><button class="ghost">Cancel</button></div>';
    const list = box.querySelector('.opts');
    if (!options.length) list.innerHTML = '<p style="margin:0">There is nowhere else to move it yet.</p>';
    options.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o;
      b.onclick = () => done(o);
      list.appendChild(b);
    });
    box.querySelector('.acts button').onclick = () => done(null);
  });
}

/* ---------- Home screen ---------- */
const sectionsEl = document.getElementById('sections');

function exists(key){
  const [c, n] = key.split('/');
  return tools[c] && tools[c][n];
}
function makeTile(cat, name){
  const b = document.createElement('button');
  b.className = 'tile';
  b.innerHTML = '<span class="art">' + iconMarkup(tools[cat][name].icon) +
                (pinned.includes(cat + '/' + name) ? '<span class="pin-dot"></span>' : '') +
                '</span><span class="lbl">' + escapeHtml(name) + '</span>';
  b.onclick = () => openTool(cat, name);
  bindLongPress(b, () => tileMenu(cat, name));
  return b;
}
function tileMenu(cat, name){
  const key = cat + '/' + name;
  const isPinned = pinned.includes(key);
  return [
    { cap:name },
    { label: isPinned ? 'Remove from Pinned' : 'Add to Pinned', on: () => {
        pinned = isPinned ? pinned.filter(k => k !== key) : pinned.concat(key);
        saveTools(); renderHome(); toast(isPinned ? 'Unpinned' : 'Pinned');
      } },
    { label:'Edit source\u2026', on: () => {
        const editor = findTool('Edit Tools');
        if (!editor) return toast('The Edit Tools tool is missing');
        window.pendingEdit = key;
        openTool(editor[0], editor[1]);
      } }
  ];
}
function findTool(name){
  for (const c in tools) if (tools[c][name]) return [c, name];
  return null;
}
function section(title, entries){
  const sec = document.createElement('section');
  sec.className = 'sec';
  sec.innerHTML = '<div class="sec-head"><h2>' + escapeHtml(title) + '</h2><span class="count">' + entries.length + '</span></div>';
  const row = document.createElement('div');
  row.className = 'row';
  entries.forEach(([c, n]) => row.appendChild(makeTile(c, n)));
  sec.appendChild(row);
  return sec;
}
function renderHome(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  sectionsEl.innerHTML = '';
  let shown = 0, total = 0;

  if (!q){
    const live = pinned.filter(exists).map(k => k.split('/'));
    if (live.length){ sectionsEl.appendChild(section('Pinned', live)); shown += live.length; }
  }
  for (const cat in tools){
    const names = Object.keys(tools[cat]);
    total += names.length;
    const hit = names.filter(n => !q || n.toLowerCase().includes(q) || cat.toLowerCase().includes(q));
    if (!hit.length) continue;
    sectionsEl.appendChild(section(cat, hit.map(n => [cat, n])));
    shown += hit.length;
  }
  if (!shown){
    sectionsEl.innerHTML = q
      ? '<div class="empty"><strong>No matches</strong>Nothing here is called &ldquo;' + escapeHtml(q) + '&rdquo;.</div>'
      : '<div class="empty"><strong>Your library is empty</strong>Open Edit Tools to add a subcategory and your first tool.</div>';
  }
  const cats = Object.keys(tools).length;
  document.getElementById('hdrSub').textContent =
    total + (total === 1 ? ' tool' : ' tools') + ' in ' + cats + (cats === 1 ? ' subcategory' : ' subcategories');
}

/* Right-click on desktop, long-press on touch. */
function bindLongPress(el, build){
  let timer, sx, sy, justOpened = false, longPressed = false;
  const open = (x, y) => { justOpened = true; showMenu(x, y, build()); };

  /* A long press should produce the context menu and nothing else. Mobile
     browsers otherwise also start a text selection and an image drag on the
     same gesture, so those two are cancelled explicitly. */
  el.setAttribute('draggable', 'false');
  el.addEventListener('dragstart', e => { e.preventDefault(); return false; });
  el.addEventListener('selectstart', e => { e.preventDefault(); return false; });

  el.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); open(e.clientX, e.clientY); };
  el.addEventListener('touchstart', e => {
    e.stopPropagation();
    longPressed = false;
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    timer = setTimeout(() => {
      timer = null; longPressed = true;
      /* Drop any selection the platform started while the finger was held. */
      const sel = window.getSelection && window.getSelection();
      if (sel && sel.removeAllRanges) sel.removeAllRanges();
      open(sx, sy);
    }, 480);
  }, { passive:true });
  el.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) clearTimeout(timer);
  }, { passive:true });
  /* Non-passive: once the menu is up, swallow the tail of the gesture so the
     browser cannot turn it into a drag or a tap. */
  el.addEventListener('touchend', e => {
    clearTimeout(timer);
    if (longPressed){ longPressed = false; e.preventDefault(); }
  });
  el.addEventListener('touchcancel', () => { clearTimeout(timer); longPressed = false; });
  // a long press must not also count as a tap
  el.addEventListener('click', e => {
    if (!justOpened) return;
    justOpened = false; e.preventDefault(); e.stopImmediatePropagation();
  }, true);
}

document.getElementById('search').addEventListener('input', renderHome);
addEventListener('scroll', () => {
  document.getElementById('hdr').classList.toggle('scrolled', scrollY > 4);
}, { passive:true });

/* ---------- Running a tool ---------- */
const runner = document.getElementById('runner');
const runnerBody = document.getElementById('runnerBody');
let exitHooks = [];
let usedHistory = false;

/* Tools call this to clean up timers or listeners when the user goes back. */
function onToolExit(fn){ exitHooks.push(fn); }

function openTool(cat, name){
  const tool = tools[cat] && tools[cat][name];
  if (!tool) return toast('That tool no longer exists');

  exitHooks = [];
  runnerBody.innerHTML = tool.html;
  runnerBody.scrollTop = 0;
  document.getElementById('runtitle').textContent = name;
  runner.hidden = false;
  runner.classList.add('in');
  // Lets the hardware/browser back button leave a tool. Blocked on some file:// origins.
  usedHistory = false;
  try { history.pushState({ tool: cat + '/' + name }, ''); usedHistory = true; } catch {}

  // The tool's JS is evaluated in its own function scope so it can be re-run safely.
  try {
    new Function(tool.js)();
  } catch (err){
    runnerBody.insertAdjacentHTML('beforeend', '<div class="runerr">' + escapeHtml(name + ' failed to start\n\n' + err) + '</div>');
  }
}
function doCloseTool(){
  exitHooks.forEach(fn => { try { fn(); } catch {} });
  exitHooks = [];
  runner.hidden = true;
  runner.classList.remove('in');
  runnerBody.innerHTML = '';
  hideMenu();
  renderHome();   // the editor may have changed the library while it was open
}
function closeTool(){ usedHistory ? history.back() : doCloseTool(); }
document.getElementById('backBtn').onclick = closeTool;
addEventListener('popstate', () => { if (!runner.hidden) doCloseTool(); });
addEventListener('keydown', e => {
  if (e.key === 'Escape' && !runner.hidden && menuEl.hidden && !document.querySelector('.modal')) closeTool();
});

/* ---------- Library options ---------- */
document.getElementById('settingsBtn').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  showMenu(r.right - 214, r.bottom + 6, [
    { cap:'Library' },
    { label:'Export library\u2026', on: () => {
        const blob = new Blob([JSON.stringify({ v:1, tools, pinned }, null, 2)], { type:'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'toolbox-library.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      } },
    { label:'Import library\u2026', on: () => {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'application/json,.json';
        input.onchange = async () => {
          try {
            const data = JSON.parse(await input.files[0].text());
            if (!data || typeof data.tools !== 'object') throw new Error('Not a library file');
            tools = data.tools;
            pinned = Array.isArray(data.pinned) ? data.pinned : [];
            saveTools(); renderHome(); toast('Library imported');
          } catch (err){ toast('That file is not a library export'); }
        };
        input.click();
      } },
    'sep',
    { label:'Restore default tools', danger:true, on: async () => {
        if (!await confirmDlg('Restore default tools?', 'Every tool you have written or edited is replaced by the originals.', 'Restore')) return;
        resetLibrary(); toast('Defaults restored');
      } },
    'sep',
    { cap:'Danger zone' },
    { label:'Erase everything\u2026', danger:true, on: async () => {
        const phrase = await ask(
          'Erase everything?',
          'This deletes every tool you\u2019ve edited AND every piece of data saved inside them \u2014 the password vault, saved recipes, expenses, shopping lists, the scratchpad, all of it. This cannot be undone. Type ERASE to confirm.',
          ''
        );
        if (phrase !== 'ERASE'){ if (phrase !== null) toast('Not erased \u2014 type ERASE exactly'); return; }
        eraseEverything();
      } }
  ]);
};

/* ----------------------------------------------------------------------
   Console access:
   - resetToolbox()   wipes the cached tool LIBRARY only (your edited tool
                       code/HTML/JS). Saved data inside tools \u2014 the vault,
                       recipes, expenses, shopping lists,
                       scratchpad, etc \u2014 is untouched.
   - eraseEverything() wipes ALL of it: the library AND every tool's saved
                       data. This is a full factory reset with no way back.
   Both reload the page afterwards.
   ---------------------------------------------------------------------- */
window.resetToolbox = function(){
  try { localStorage.removeItem(STORAGE_KEY); } catch {}
  location.reload();
};
window.eraseEverything = function(){
  try { localStorage.clear(); } catch {}
  try { sessionStorage.clear(); } catch {}
  location.reload();
};

/* ---------- Boot ----------
   Always prefer the cache. Only seed the defaults when nothing is stored. */
if (!loadTools()){
  tools  = defaultLibrary();
  pinned = DEFAULT_PINNED.slice();
  saveTools();
}
renderHome();
</script>
