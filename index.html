<script type="text/x-tool" data-id="quiz" data-part="js">
let Q=[],cur=null,qi=0;
const TYPES={
  single:{n:'One answer',d:'Pick a single option'},
  multi:{n:'Several answers',d:'Tick everything that applies'},
  tf:{n:'True or false',d:'A quick binary check'},
  text:{n:'Type the answer',d:'Free text, matched loosely'},
  num:{n:'A number',d:'With an optional tolerance'},
  order:{n:'Put in order',d:'Arrange the steps correctly'}
};
const blankQ=t=>({id:uid(),type:t||'single',prompt:'',img:'',explain:'',points:1,secs:0,
  options:t==='tf'?['True','False']:['','','',''],correct:t==='tf'?[0]:[0],
  answers:[''],num:0,tol:0,items:['','','']});
const blankQuiz=()=>({id:uid(),title:'New quiz',desc:'',u:Date.now(),attempts:[],
  s:{shuffleQ:false,shuffleA:true,instant:true,pass:70,secs:0,retryWrong:true},
  qs:[blankQ('single')]});
const save=()=>{if(cur)cur.u=Date.now();return Tool.set('quizzes',Q)};
const LETTERS='ABCDEFGH';
/* ---------- home ---------- */
function home(){
  $('#home').style.display='';$('#editor').style.display='none';
  $('#qcards').innerHTML=Q.length?Q.slice().sort((a,b)=>b.u-a.u).map(q=>{
    const best=(q.attempts||[]).reduce((m,a)=>Math.max(m,a.pct),-1);
    return '<div class="qcard" data-i="'+q.id+'"><b>'+esc(q.title)+'</b>'+
      '<small>'+q.qs.length+' question'+(q.qs.length===1?'':'s')+' · '+
      q.qs.reduce((a,x)=>a+(+x.points||1),0)+' points</small>'+
      (q.desc?'<div class="hint" style="margin-top:8px">'+esc(q.desc.slice(0,90))+'</div>':'')+
      (best>=0?'<div class="best">Best '+best+'% · '+q.attempts.length+' attempt'+(q.attempts.length===1?'':'s')+'</div>':'')+
      '</div>'}).join('')
    :'<div class="empty">No quizzes yet. Make your first one.</div>';
  $$('.qcard').forEach(c=>c.onclick=()=>openQ(c.dataset.i));
}
function openQ(id){cur=Q.find(q=>q.id===id);if(!cur)return;qi=0;
  $('#home').style.display='none';$('#editor').style.display='flex';
  $('#qtitle').textContent=cur.title;Tool.set('last',id);Tool.title('Quiz — '+cur.title);
  items();form()}
$('#newq').onclick=async()=>{const q=blankQuiz();Q.push(q);await save();openQ(q.id)};
$('#home2').onclick=()=>{home();Tool.title('Quiz Maker')};
$('#qmenu').onclick=()=>$('#qlist').classList.toggle('show');
/* ---------- editor ---------- */
function items(){
  $('#qitems').innerHTML=cur.qs.map((q,i)=>'<div class="qi'+(i===qi?' on':'')+'" data-q="'+i+'">'+
    '<span class="n">'+(i+1)+'</span><span class="t"><span class="ty">'+TYPES[q.type].n.toUpperCase()+'</span><br>'+
    esc(q.prompt||'Untitled question')+'</span></div>').join('');
  $$('.qi').forEach(x=>x.onclick=()=>{qi=+x.dataset.q;items();form();$('#qlist').classList.remove('show')});
  $('#qsum').textContent=cur.qs.length+' questions · '+cur.qs.reduce((a,x)=>a+(+x.points||1),0)+' points';
}
function form(){
  const q=cur.qs[qi];
  if(!q)return $('#qform').innerHTML='<div class="empty">Add a question.</div>';
  const optRows=()=>q.options.map((o,i)=>'<div class="opt"><button class="mark'+
    (q.correct.includes(i)?' on':'')+'" data-mk="'+i+'" title="Mark correct">'+
    (q.correct.includes(i)?'✓':LETTERS[i])+'</button>'+
    '<input class="fld" data-opt="'+i+'" value="'+esc(o)+'" placeholder="Option '+LETTERS[i]+'">'+
    (q.type==='tf'?'':'<button class="rm" data-optx="'+i+'">×</button>')+'</div>').join('');
  $('#qform').innerHTML='<div class="pane" style="max-width:720px">'+
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:16px">'+
    '<span class="hint" style="margin:0">Question '+(qi+1)+' of '+cur.qs.length+'</span><div class="grow"></div>'+
    '<button class="btn sm gho" id="qup">↑</button><button class="btn sm gho" id="qdn">↓</button>'+
    '<button class="btn sm gho" id="qdup">Duplicate</button><button class="btn sm dgr" id="qdel">Delete</button></div>'+
    '<div class="row"><label class="fl">Type</label><select class="fld" id="qtype">'+
    Object.keys(TYPES).map(t=>'<option value="'+t+'"'+(q.type===t?' selected':'')+'>'+TYPES[t].n+'</option>').join('')+'</select></div>'+
    '<div class="row"><label class="fl">Question</label><textarea class="fld" rows="2" id="qp">'+esc(q.prompt)+'</textarea></div>'+
    '<div class="row"><label class="fl">Image URL (optional)</label><input class="fld" id="qimg" value="'+esc(q.img||'')+'" placeholder="https://…">'+
    (q.img?'<img src="'+esc(q.img)+'" style="max-height:130px;margin-top:9px;border-radius:9px;border:1px solid var(--line)" onerror="this.remove()">':'')+'</div>'+
    '<div class="row"><label class="fl">Answers</label><div id="opts">'+
    (q.type==='single'||q.type==='multi'||q.type==='tf'?optRows()+
      (q.type==='tf'?'':'<button class="btn sm gho" id="addopt">+ Option</button>')+
      '<div class="hint">'+(q.type==='multi'?'Tick every correct option.':'Click a letter to mark the correct answer.')+'</div>'
     :q.type==='text'?q.answers.map((a,i)=>'<div class="opt"><span class="mark">✓</span>'+
        '<input class="fld" data-ans="'+i+'" value="'+esc(a)+'" placeholder="Accepted answer">'+
        '<button class="rm" data-ansx="'+i+'">×</button></div>').join('')+
        '<button class="btn sm gho" id="addans">+ Another accepted answer</button>'+
        '<div class="hint">Case and surrounding spaces are ignored. Add every wording you would accept.</div>'
     :q.type==='num'?'<div style="display:flex;gap:10px"><div style="flex:1"><label class="fl">Correct value</label>'+
        '<input class="fld" type="number" step="any" id="qnum" value="'+(q.num||0)+'"></div>'+
        '<div style="flex:1"><label class="fl">Allowed error ±</label>'+
        '<input class="fld" type="number" step="any" id="qtol" value="'+(q.tol||0)+'"></div></div>'
     :q.items.map((it,i)=>'<div class="opt"><span class="mark">'+(i+1)+'</span>'+
        '<input class="fld" data-item="'+i+'" value="'+esc(it)+'" placeholder="Step '+(i+1)+'">'+
        '<button class="rm" data-itemx="'+i+'">×</button></div>').join('')+
        '<button class="btn sm gho" id="additem">+ Step</button>'+
        '<div class="hint">Type them in the right order — they get shuffled when the quiz runs.</div>')+
    '</div></div>'+
    '<div class="row"><label class="fl">Explanation shown after answering</label>'+
    '<textarea class="fld" rows="2" id="qex" placeholder="Why that is the answer">'+esc(q.explain||'')+'</textarea></div>'+
    '<div style="display:flex;gap:12px"><div class="row" style="flex:1"><label class="fl">Points</label>'+
    '<input class="fld" type="number" min="1" id="qpt" value="'+(q.points||1)+'"></div>'+
    '<div class="row" style="flex:1"><label class="fl">Time limit (seconds, 0 = none)</label>'+
    '<input class="fld" type="number" min="0" id="qsec" value="'+(q.secs||0)+'"></div></div></div>';
  const b=(id,fn)=>{const e=$('#'+id);if(e)e.oninput=fn};
  $('#qtype').onchange=e=>{const t=e.target.value;const nq=blankQ(t);
    nq.id=q.id;nq.prompt=q.prompt;nq.img=q.img;nq.explain=q.explain;nq.points=q.points;nq.secs=q.secs;
    cur.qs[qi]=nq;save();items();form()};
  b('qp',e=>{q.prompt=e.target.value;save();items()});
  b('qimg',e=>{q.img=e.target.value;save()});
  b('qex',e=>{q.explain=e.target.value;save()});
  b('qpt',e=>{q.points=+e.target.value||1;save();items()});
  b('qsec',e=>{q.secs=+e.target.value||0;save()});
  b('qnum',e=>{q.num=+e.target.value;save()});
  b('qtol',e=>{q.tol=+e.target.value;save()});
  $$('[data-opt]').forEach(e=>e.oninput=()=>{q.options[+e.dataset.opt]=e.value;save()});
  $$('[data-mk]').forEach(e=>e.onclick=()=>{const i=+e.dataset.mk;
    if(q.type==='multi')q.correct.includes(i)?q.correct=q.correct.filter(x=>x!==i):q.correct.push(i);
    else q.correct=[i];
    save();form()});
  $$('[data-optx]').forEach(e=>e.onclick=()=>{const i=+e.dataset.optx;
    if(q.options.length<=2)return toast('Keep at least two options');
    q.options.splice(i,1);q.correct=q.correct.filter(x=>x!==i).map(x=>x>i?x-1:x);
    if(!q.correct.length)q.correct=[0];save();form()});
  $$('[data-ans]').forEach(e=>e.oninput=()=>{q.answers[+e.dataset.ans]=e.value;save()});
  $$('[data-ansx]').forEach(e=>e.onclick=()=>{q.answers.splice(+e.dataset.ansx,1);
    if(!q.answers.length)q.answers=[''];save();form()});
  $$('[data-item]').forEach(e=>e.oninput=()=>{q.items[+e.dataset.item]=e.value;save()});
  $$('[data-itemx]').forEach(e=>e.onclick=()=>{if(q.items.length<=2)return toast('Keep at least two steps');
    q.items.splice(+e.dataset.itemx,1);save();form()});
  const add=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn};
  add('addopt',()=>{if(q.options.length>=8)return toast('Eight options is the limit');q.options.push('');save();form()});
  add('addans',()=>{q.answers.push('');save();form()});
  add('additem',()=>{q.items.push('');save();form()});
  $('#qup').onclick=()=>{if(!qi)return;[cur.qs[qi-1],cur.qs[qi]]=[cur.qs[qi],cur.qs[qi-1]];qi--;save();items();form()};
  $('#qdn').onclick=()=>{if(qi>=cur.qs.length-1)return;[cur.qs[qi+1],cur.qs[qi]]=[cur.qs[qi],cur.qs[qi+1]];qi++;save();items();form()};
  $('#qdup').onclick=()=>{const c=JSON.parse(JSON.stringify(q));c.id=uid();cur.qs.splice(qi+1,0,c);qi++;save();items();form()};
  $('#qdel').onclick=()=>{if(cur.qs.length<=1)return toast('A quiz needs at least one question');
    cur.qs.splice(qi,1);qi=Math.max(0,qi-1);save();items();form()};
}
$('#addq').onclick=()=>dialog({title:'Add a question',style:'width:min(520px,100%)',
  body:'<div class="typepick">'+Object.keys(TYPES).map(t=>'<button data-nt="'+t+'"><b>'+TYPES[t].n+'</b>'+
    '<small>'+TYPES[t].d+'</small></button>').join('')+'</div>',
  buttons:[{label:'Cancel',cls:'gho'}],
  onOpen:(b,close)=>b.querySelectorAll('[data-nt]').forEach(x=>x.onclick=()=>{
    cur.qs.push(blankQ(x.dataset.nt));qi=cur.qs.length-1;save();items();form();close()})});
$('#qset').onclick=()=>{const s=cur.s;
  dialog({title:'Quiz settings',style:'width:min(460px,100%)',
    body:'<div class="row"><label class="fl">Title</label><input class="fld" id="st2" value="'+esc(cur.title)+'"></div>'+
      '<div class="row"><label class="fl">Description</label><textarea class="fld" rows="2" id="sd2">'+esc(cur.desc||'')+'</textarea></div>'+
      [['shuffleQ','Shuffle the questions'],['shuffleA','Shuffle the answers'],
       ['instant','Show whether each answer was right straight away'],
       ['retryWrong','Offer a retry of just the ones you missed']].map(o=>
      '<label style="display:flex;gap:9px;align-items:center;font-size:14px;padding:5px 0">'+
      '<input type="checkbox" data-s="'+o[0]+'"'+(s[o[0]]?' checked':'')+'>'+o[1]+'</label>').join('')+
      '<div style="display:flex;gap:12px;margin-top:12px"><div class="row" style="flex:1"><label class="fl">Pass mark %</label>'+
      '<input class="fld" type="number" min="0" max="100" id="sp2" value="'+s.pass+'"></div>'+
      '<div class="row" style="flex:1"><label class="fl">Whole-quiz timer (s)</label>'+
      '<input class="fld" type="number" min="0" id="ss2" value="'+(s.secs||0)+'"></div></div>'+
      ((cur.attempts||[]).length?'<button class="btn sm dgr" id="clrat">Clear '+cur.attempts.length+' saved attempts</button>':''),
    buttons:[{label:'Delete quiz',cls:'dgr left',onClick:()=>{
      confirmBox('Delete quiz?','"'+esc(cur.title)+'" and its results go for good.',async()=>{
        Q=Q.filter(x=>x.id!==cur.id);await Tool.set('quizzes',Q);home()},true)}},
      {label:'Done',cls:'pri',onClick:b=>{
        cur.title=b.querySelector('#st2').value||cur.title;cur.desc=b.querySelector('#sd2').value;
        b.querySelectorAll('[data-s]').forEach(c=>s[c.dataset.s]=c.checked);
        s.pass=+b.querySelector('#sp2').value||0;s.secs=+b.querySelector('#ss2').value||0;
        save();$('#qtitle').textContent=cur.title}}],
    onOpen:b=>{const c=b.querySelector('#clrat');if(c)c.onclick=()=>{cur.attempts=[];save();b.close();toast('Attempts cleared')}}})};
$('#qexp').onclick=()=>dialog({title:'Export',style:'width:min(440px,100%)',
  body:'<div style="display:flex;flex-direction:column;gap:9px">'+
    '<button class="btn pri" id="e5">Download as a playable web page</button>'+
    '<button class="btn" id="e6">Export quiz JSON</button>'+
    '<button class="btn" id="e7">Print an answer sheet</button></div>'+
    '<div class="hint">The web page is one self-contained file — hand it to anyone and it just runs.</div>',
  buttons:[{label:'Close',cls:'gho'}],
  onOpen:(b,close)=>{
    b.querySelector('#e5').onclick=()=>{exportPlayable();close()};
    b.querySelector('#e6').onclick=()=>download(cur.title.replace(/\W+/g,'-').toLowerCase()+'.json','application/json',JSON.stringify(cur,null,2));
    b.querySelector('#e7').onclick=()=>{answerSheet();close()}}});
$('#imp2').onclick=()=>dialog({title:'Import quiz',
  body:'<textarea class="fld" rows="8" id="iq" placeholder=\'{"title":"…","qs":[…]}\'></textarea>',
  buttons:[{label:'Cancel',cls:'gho'},{label:'Import',cls:'pri',onClick:async b=>{
    try{const o=JSON.parse(b.querySelector('#iq').value);const arr=Array.isArray(o)?o:[o];
      arr.forEach(q=>{q.id=uid();q.u=Date.now();q.attempts=[];
        q.s=Object.assign({shuffleQ:false,shuffleA:true,instant:true,pass:70,secs:0,retryWrong:true},q.s||{});
        q.qs=(q.qs||[]).map(x=>Object.assign(blankQ(x.type),x,{id:uid()}));Q.push(q)});
      await save();home();toast(arr.length+' imported')}
    catch(e){toast('Invalid JSON');return false}}}]});
function answerSheet(){
  const rows=cur.qs.map((q,i)=>{
    let a='';
    if(q.type==='single'||q.type==='multi'||q.type==='tf')a=q.correct.map(c=>LETTERS[c]+'. '+q.options[c]).join('; ');
    if(q.type==='text')a=q.answers.filter(Boolean).join(' / ');
    if(q.type==='num')a=q.num+(q.tol?' ±'+q.tol:'');
    if(q.type==='order')a=q.items.join(' → ');
    return '<tr><td>'+(i+1)+'</td><td>'+esc(q.prompt)+'</td><td><b>'+esc(a)+'</b></td><td>'+esc(q.explain||'')+'</td></tr>'}).join('');
  download(cur.title.replace(/\W+/g,'-').toLowerCase()+'-answers.html','text/html',
    '<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(cur.title)+' — answers</title><style>'+
    'body{font-family:-apple-system,Arial,sans-serif;margin:30px;color:#14181D;font-size:13px}'+
    'h1{font-size:22px}table{width:100%;border-collapse:collapse}'+
    'th{text-align:left;background:#F1F3F6;padding:7px 9px;border:1px solid #D6DBE1;font-size:11px;'+
    'letter-spacing:.1em;text-transform:uppercase;color:#5A6472}'+
    'td{padding:7px 9px;border:1px solid #E4E8ED;vertical-align:top}@media print{@page{margin:14mm}}</style></head><body>'+
    '<h1>'+esc(cur.title)+' — answer sheet</h1><table><thead><tr><th>#</th><th>Question</th><th>Answer</th><th>Explanation</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></body></html>');
}
/* ---------- play ---------- */
let run=null,tick2=null;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startPlay(only){
  let qs=(only||cur.qs).map(q=>{
    const c=JSON.parse(JSON.stringify(q));
    if(c.type==='order')c.shown=shuf(c.items.map((t,i)=>({t,i})));
    else if((c.type==='single'||c.type==='multi')&&cur.s.shuffleA){
      const idx=shuf(c.options.map((o,i)=>i));
      c.shown=idx.map(i=>({t:c.options[i],ok:c.correct.includes(i)}))}
    else if(c.options)c.shown=c.options.map((o,i)=>({t:o,ok:c.correct.includes(i)}));
    return c});
  if(cur.s.shuffleQ&&!only)qs=shuf(qs);
  run={qs,i:0,answers:[],score:0,total:qs.reduce((a,q)=>a+(+q.points||1),0),
    started:Date.now(),checked:false,left:cur.s.secs||0};
  $('#play').classList.add('on');$('#pname').textContent=cur.title;
  clearInterval(tick2);tick2=setInterval(clock,250);
  paintQ();
}
function clock(){
  if(!run)return;
  const q=run.qs[run.i];
  if(run.left>0){run.left-=0.25;
    if(run.left<=0){run.left=0;return finish()}}
  let t=run.left>0?run.left:(q&&q.secs&&run.qleft>0?run.qleft:0);
  if(q&&q.secs&&!run.checked){run.qleft-=0.25;
    if(run.qleft<=0){run.qleft=0;check(true)}t=run.qleft}
  $('#pclock').textContent=t>0?Math.ceil(t)+'s':'';
  $('#pclock').style.color=t>0&&t<6?'var(--danger)':'var(--dim)';
}
function paintQ(){
  const q=run.qs[run.i];run.checked=false;run.pick=q.type==='multi'?[]:null;
  run.qleft=q.secs||0;
  $('#pcount').textContent=(run.i+1)+' / '+run.qs.length;
  $('#pbar').firstElementChild.style.width=(run.i/run.qs.length*100)+'%';
  const w=$('#pwrap');
  let body='';
  if(q.type==='text')body='<input class="fld" id="pt2" placeholder="Type your answer" autocomplete="off" style="font-size:17px;padding:14px">';
  else if(q.type==='num')body='<input class="fld" id="pn2" type="number" step="any" placeholder="Your number" style="font-size:17px;padding:14px">';
  else if(q.type==='order')body='<div id="pord">'+q.shown.map((o,i)=>'<div class="ordrow" data-o="'+i+'">'+
    '<span style="font-family:var(--mono);color:var(--dim2);font-size:12px">'+(i+1)+'</span>'+esc(o.t)+
    '<span class="g"><button class="btn sm gho" data-ou="'+i+'">↑</button>'+

function paintKeep(){const s=$('#pord');const q=run.qs[run.i];
  s.innerHTML=q.shown.map((o,i)=>'<div class="ordrow" data-o="'+i+'">'+
    '<span style="font-family:var(--mono);color:var(--dim2);font-size:12px">'+(i+1)+'</span>'+esc(o.t)+

  $$('[data-ou]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ou;if(!i)return;
    [q.shown[i-1],q.shown[i]]=[q.shown[i],q.shown[i-1]];paintKeep()});
  $$('[data-od]').forEach(b=>b.onclick=()=>{const i=+b.dataset.od;if(i>=q.shown.length-1)return;
    [q.shown[i+1],q.shown[i]]=[q.shown[i],q.shown[i+1]];paintKeep()})}
const norm=s=>String(s||'').trim().toLowerCase().replace(/[^\w\s]/g,'').replace(/\s+/g,' ');
function grade(q){
  if(q.type==='text'){const v=norm(($('#pt2')||{}).value);
    return{ok:q.answers.some(a=>a&&norm(a)===v),given:($('#pt2')||{}).value||'',
      want:q.answers.filter(Boolean).join(' / ')}}
  if(q.type==='num'){const v=parseFloat(($('#pn2')||{}).value);
    return{ok:!isNaN(v)&&Math.abs(v-q.num)<=(q.tol||0),given:isNaN(v)?'—':String(v),
      want:q.num+(q.tol?' ±'+q.tol:'')}}
  if(q.type==='order'){const ok=q.shown.every((o,i)=>o.i===i);
    return{ok,given:q.shown.map(o=>o.t).join(' → '),want:q.items.join(' → ')}}
  if(q.type==='multi'){const want=q.shown.map((o,i)=>o.ok?i:-1).filter(i=>i>=0);
    const p=(run.pick||[]).slice().sort();
    return{ok:p.length===want.length&&want.slice().sort().every((v,i)=>v===p[i]),
      given:(run.pick||[]).map(i=>q.shown[i].t).join(', ')||'—',
      want:want.map(i=>q.shown[i].t).join(', ')}}
  const i=run.pick;
  return{ok:i!=null&&q.shown[i].ok,given:i!=null?q.shown[i].t:'—',
    want:(q.shown.find(o=>o.ok)||{}).t||''}
}
function check(auto){
  const q=run.qs[run.i];
  if(!auto&&run.pick==null&&q.type!=='order'&&!$('#pt2')&&!$('#pn2'))return toast('Pick an answer');
  const r=grade(q);
  run.answers.push({q,r});
  if(r.ok)run.score+=(+q.points||1);
  run.checked=true;
  if(cur.s.instant){
    if(q.shown&&(q.type==='single'||q.type==='multi'||q.type==='tf'))
      $$('[data-a]').forEach(b=>{const i=+b.dataset.a;
        b.classList.remove('sel');
        if(q.shown[i].ok)b.classList.add('right');
        else if(q.type==='multi'?(run.pick||[]).includes(i):run.pick===i)b.classList.add('wrong')});
    $('#pfb').innerHTML='<div class="fb '+(r.ok?'ok':'no')+'"><b>'+(r.ok?'Correct':'Not quite')+'</b>'+
      (r.ok?'':' — the answer is <b>'+esc(r.want)+'</b>')+
      (q.explain?'<div style="margin-top:6px;opacity:.85">'+esc(q.explain)+'</div>':'')+'</div>';
    $('#pnext').textContent=run.i===run.qs.length-1?'See results':'Next question';
    $('#pskip').style.display='none';
  } else next();
}

$('#pskip').onclick=()=>{run.pick=run.pick===null?null:run.pick;const q=run.qs[run.i];

function finish(){
  clearInterval(tick2);
  const pct=Math.round(run.score/Math.max(1,run.total)*100);
  const secs=Math.round((Date.now()-run.started)/1000);
  const pass=pct>=(cur.s.pass||0);
  cur.attempts=(cur.attempts||[]).concat([{t:Date.now(),pct,score:run.score,total:run.total,secs}]).slice(-40);
  save();

  const wrong=run.answers.filter(a=>!a.r.ok);

    '<div class="ring2"><svg width="132" height="132"><circle cx="66" cy="66" r="54" fill="none" stroke="var(--line)" stroke-width="9"/>'+
    '<circle cx="66" cy="66" r="54" fill="none" stroke="'+(pass?'var(--ok)':'var(--brass)')+'" stroke-width="9" stroke-linecap="round" '+
    'stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct/100))+'"/></svg><span>'+pct+'%</span></div>'+
    '<h1 style="margin:0 0 6px">'+(pass?'Passed':'Not this time')+'</h1>'+

    '<div><span>Missed</span><b>'+wrong.length+'</b></div>'+
    '<div><span>Time</span><b>'+Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0')+'</b></div>'+
    '<div><span>Attempt</span><b>'+cur.attempts.length+'</b></div></div>'+
    '<div class="pmeta">Review</div>'+
    run.answers.map((a,i)=>'<div class="rev'+(a.r.ok?'':' bad')+'"><div class="h">'+
      '<span style="color:'+(a.r.ok?'var(--ok)':'var(--danger)')+'">'+(a.r.ok?'✓':'✕')+'</span>'+
      '<span>'+(i+1)+'. '+esc(a.q.prompt)+'</span></div>'+
      '<div class="d">You said <b>'+esc(a.r.given)+'</b>'+(a.r.ok?'':' · correct answer <b>'+esc(a.r.want)+'</b>')+
      (a.q.explain?'<div style="margin-top:5px">'+esc(a.q.explain)+'</div>':'')+'</div></div>').join('');
  $('#pfoot').innerHTML='<button class="btn gho" id="pdone">Back to the quiz</button><div class="grow"></div>'+
    (wrong.length&&cur.s.retryWrong?'<button class="btn" id="pwrong">Retry the '+wrong.length+' I missed</button>':'')+
    '<button class="btn pri" id="pagain">Try the whole thing again</button>';
  $('#pdone').onclick=()=>{run=null;$('#play').classList.remove('on');resetFoot();home2()};
  $('#pagain').onclick=()=>{resetFoot();startPlay(null)};
  const pw=$('#pwrong');if(pw)pw.onclick=()=>{resetFoot();startPlay(wrong.map(a=>cur.qs.find(x=>x.id===a.q.id)||a.q))};
  $('#pclock').textContent='';$('#pbar').firstElementChild.style.width='100%';
}
