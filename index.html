      "html": "<div id=\"ex\">\n<style>\n  #ex{position:absolute;inset:0;background:#F2F2F7;overflow-y:auto}\n  #ex .wrap{max-width:640px;margin:0 auto;padding:22px 18px calc(40px + env(safe-area-inset-bottom,0px))}\n  #ex h2{margin:0 0 14px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #ex .mo{display:flex;align-items:center;justify-content:space-between;background:#111114;color:#fff;border-radius:18px;padding:18px 20px;margin-bottom:14px}\n  #ex .mo .nav{border:0;background:rgba(255,255,255,.14);color:#fff;width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer}\n  #ex .mo .mid{text-align:center;flex:1}\n  #ex .mo .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}\n  #ex .mo .amt{font-size:31px;font-weight:600;margin-top:4px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}\n  #ex .mo .m{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:3px}\n  #ex .sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:16px}\n  #ex .sum .s{background:#fff;border-radius:13px;padding:12px 10px;text-align:center;box-shadow:0 1px 2px rgba(16,24,40,.05)}\n  #ex .sum .s .l{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#A6A6AE}\n  #ex .sum .s .v{font-size:17px;font-weight:640;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}\n  #ex .bars{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #ex .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:0 0 14px}\n  #ex .bar{margin-bottom:11px}\n  #ex .bar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}\n  #ex .bar .t b{font-variant-numeric:tabular-nums}\n  #ex .bar .tr{height:7px;border-radius:4px;background:rgba(120,120,128,.14);overflow:hidden}\n  #ex .bar .fl{height:100%;border-radius:4px;transition:width .3s}\n  #ex .e{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:13px;margin-bottom:7px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05)}\n  #ex .e .ic{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px}\n  #ex .e .tx{flex:1;min-width:0}\n  #ex .e .n{font-size:14.5px;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  #ex .e .d{font-size:12px;color:#A6A6AE;margin-top:1px}\n  #ex .e .a{flex:0 0 auto;font-size:15px;font-weight:640;font-variant-numeric:tabular-nums;letter-spacing:-.01em}\n  #ex .e .a.in{color:#12805C}\n  #ex .empty{text-align:center;color:#A6A6AE;font-size:14px;padding:36px 20px;line-height:1.7}\n  #ex .add{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border:0;border-radius:50%;background:#0A84FF;color:#fff;font-size:27px;cursor:pointer;box-shadow:0 6px 20px rgba(10,132,255,.4);z-index:3}\n  #ex .add:active{transform:scale(.93)}\n  #ex .btn{padding:10px 14px;border:0;border-radius:11px;background:rgba(120,120,128,.12);color:#111114;font-size:13.5px;font-weight:560;cursor:pointer}\n  #ex .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}\n  #ex .sheet{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:6}\n  #ex .sheet.on{display:flex}\n  #ex .sheet .box{background:#F2F2F7;width:100%;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}\n  #ex .sheet h3{margin:0 0 4px;font-size:20px;font-weight:700}\n  #ex label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:14px 0 6px}\n  #ex input,#ex select{width:100%;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:#111114}\n  #ex input:focus,#ex select:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #ex .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n  #ex .cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}\n  #ex .cats button{padding:8px 13px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:13px;cursor:pointer;color:#6E6E76}\n  #ex .cats button.on{background:#111114;border-color:#111114;color:#fff}\n  #ex .sbtn{display:flex;gap:8px;margin-top:20px}\n  #ex .sbtn button{flex:1;height:48px;border:0;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer}\n  #ex .sbtn .ok{background:#0A84FF;color:#fff} #ex .sbtn .no{background:rgba(120,120,128,.14);color:#111114}\n  #ex .sbtn .del{background:rgba(229,72,77,.14);color:#B8390E;flex:0 0 88px}\n</style>\n  <div class=\"wrap\">\n    <h2>Expense Tracker</h2>\n    <div class=\"mo\">\n      <button class=\"nav\" id=\"exPrev\">&#8249;</button>\n      <div class=\"mid\"><div class=\"lbl\">Spent</div><div class=\"amt\" id=\"exTotal\">0.00</div><div class=\"m\" id=\"exMonth\"></div></div>\n      <button class=\"nav\" id=\"exNext\">&#8250;</button>\n    </div>\n    <div class=\"sum\">\n      <div class=\"s\"><div class=\"l\">Income</div><div class=\"v\" id=\"exIn\">0</div></div>\n      <div class=\"s\"><div class=\"l\">Net</div><div class=\"v\" id=\"exNet\">0</div></div>\n      <div class=\"s\"><div class=\"l\">Per day</div><div class=\"v\" id=\"exDay\">0</div></div>\n    </div>\n    <div class=\"bars\" id=\"exBars\"></div>\n    <div class=\"cap\">Transactions</div>\n    <div id=\"exList\"></div>\n    <div class=\"btns\">\n      <button class=\"btn\" id=\"exCsv\">Export CSV</button>\n      <button class=\"btn\" id=\"exBudget\">Set budget</button>\n    </div>\n  </div>\n  <button class=\"add\" id=\"exAdd\">+</button>\n\n  <div class=\"sheet\" id=\"exSheet\"><div class=\"box\">\n    <h3 id=\"exSheetT\">New transaction</h3>\n    <div class=\"r2\">\n      <div><label for=\"exAmt\">Amount</label><input id=\"exAmt\" type=\"number\" step=\"0.01\" inputmode=\"decimal\" placeholder=\"0.00\"></div>\n      <div><label for=\"exDate\">Date</label><input id=\"exDate\" type=\"date\"></div>\n    </div>\n    <label for=\"exDesc\">Description</label><input id=\"exDesc\" placeholder=\"Tesco food shop\">\n    <label>Category</label><div class=\"cats\" id=\"exCats\"></div>\n    <div class=\"r2\">\n      <div><label for=\"exType\">Type</label><select id=\"exType\"><option value=\"out\">Expense</option><option value=\"in\">Income</option></select></div>\n      <div><label for=\"exRep\">Repeats</label><select id=\"exRep\"><option value=\"\">One-off</option><option value=\"monthly\">Monthly</option><option value=\"weekly\">Weekly</option></select></div>\n    </div>\n    <div class=\"sbtn\">\n      <button class=\"no\" id=\"exCancel\">Cancel</button>\n      <button class=\"del\" id=\"exDel\" style=\"display:none\">Delete</button>\n      <button class=\"ok\" id=\"exSave\">Save</button>\n    </div>\n  </div></div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst KEY = 'expenses.v1', SET = 'expenses.settings.v1';\nconst CATS = [\n  ['Groceries','🛒','#30A46C'], ['Eating out','🍽','#F5A524'], ['Transport','🚗','#0A84FF'],\n  ['Bills','🏠','#8A2BE2'], ['Shopping','🛍','#C82F5A'], ['Health','💊','#0E7C90'],\n  ['Leisure','🎬','#E5484D'], ['Travel','✈️','#37C4C4'], ['Other','📦','#8E8E96']\n];\nlet all = [], settings = { currency:'£', budget:0 };\nlet cursor = new Date(); cursor.setDate(1);\nlet editing = null, pickedCat = 'Groceries';\n\ntry { all = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}\ntry { settings = Object.assign(settings, JSON.parse(localStorage.getItem(SET)) || {}); } catch {}\nconst save = () => localStorage.setItem(KEY, JSON.stringify(all));\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nconst uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);\nconst cur = n => settings.currency + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits:2, maximumFractionDigits:2 });\nconst catOf = n => CATS.find(c => c[0] === n) || CATS[CATS.length - 1];\nconst ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');\n\n/* Recurring entries are expanded on the fly rather than written to storage,\n   so changing the original updates every future occurrence. */\nfunction occurrences(month){\n  const out = [];\n  const mStart = new Date(month.getFullYear(), month.getMonth(), 1);\n  const mEnd = new Date(month.getFullYear(), month.getMonth() + 1, 0);\n  all.forEach(t => {\n    const d0 = new Date(t.date);\n    if (!t.repeat){\n      if (d0 >= mStart && d0 <= mEnd) out.push({ t, date:d0 });\n      return;\n    }\n    if (d0 > mEnd) return;\n    if (t.repeat === 'monthly'){\n      const d = new Date(month.getFullYear(), month.getMonth(), Math.min(d0.getDate(), mEnd.getDate()));\n      if (d >= d0 || ym(d) === ym(d0)) out.push({ t, date:d, virtual: ym(d) !== ym(d0) });\n    } else if (t.repeat === 'weekly'){\n      const d = new Date(d0);\n      while (d <= mEnd){\n        if (d >= mStart) out.push({ t, date:new Date(d), virtual: d.getTime() !== d0.getTime() });\n        d.setDate(d.getDate() + 7);\n      }\n    }\n  });\n  return out.sort((a, b) => b.date - a.date);\n}\n\nfunction render(){\n  const rows = occurrences(cursor);\n  const spent = rows.filter(r => r.t.type !== 'in').reduce((n, r) => n + r.t.amount, 0);\n  const income = rows.filter(r => r.t.type === 'in').reduce((n, r) => n + r.t.amount, 0);\n  const days = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();\n  const now = new Date();\n  const elapsed = (ym(now) === ym(cursor)) ? now.getDate() : days;\n\n  $('exTotal').textContent = cur(spent);\n  $('exMonth').textContent = cursor.toLocaleDateString(undefined, { month:'long', year:'numeric' }) +\n    (settings.budget ? '  ·  budget ' + cur(settings.budget) : '');\n  $('exIn').textContent = cur(income);\n  $('exNet').textContent = (income - spent >= 0 ? '' : '−') + cur(income - spent);\n  $('exNet').style.color = income - spent >= 0 ? '#12805C' : '#B8390E';\n  $('exDay').textContent = cur(spent / Math.max(elapsed, 1));\n\n  // category breakdown\n  const byCat = {};\n  rows.filter(r => r.t.type !== 'in').forEach(r => byCat[r.t.cat] = (byCat[r.t.cat] || 0) + r.t.amount);\n  const sorted = Object.entries(byCat).sort((a, b) => b[1] - a[1]);\n  const max = sorted.length ? sorted[0][1] : 1;\n  $('exBars').innerHTML = '<p class=\"cap\">By category</p>' + (sorted.length\n    ? sorted.map(([c, v]) => {\n        const [, , col] = catOf(c);\n        return '<div class=\"bar\"><div class=\"t\"><span>' + catOf(c)[1] + ' ' + esc(c) + '</span><b>' + cur(v) +\n          ' <span style=\"color:#A6A6AE;font-weight:400\">' + Math.round(v / spent * 100) + '%</span></b></div>' +\n          '<div class=\"tr\"><div class=\"fl\" style=\"width:' + (v / max * 100) + '%;background:' + col + '\"></div></div></div>';\n      }).join('')\n    : '<div class=\"empty\" style=\"padding:14px\">Nothing spent this month yet.</div>') +\n    (settings.budget ? '<div class=\"bar\" style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(60,60,67,.08)\">' +\n      '<div class=\"t\"><span>Budget used</span><b>' + Math.round(spent / settings.budget * 100) + '%</b></div>' +\n      '<div class=\"tr\"><div class=\"fl\" style=\"width:' + Math.min(100, spent / settings.budget * 100) + '%;background:' +\n      (spent > settings.budget ? '#E5484D' : spent > settings.budget * .8 ? '#F5A524' : '#30A46C') + '\"></div></div></div>' : '');\n\n  $('exList').innerHTML = rows.length ? rows.map(r => {\n    const [, ic, col] = catOf(r.t.cat);\n    return '<div class=\"e\" data-id=\"' + r.t.id + '\">' +\n      '<span class=\"ic\" style=\"background:' + col + '22\">' + ic + '</span>' +\n      '<span class=\"tx\"><span class=\"n\">' + esc(r.t.desc || r.t.cat) + '</span>' +\n      '<span class=\"d\">' + r.date.toLocaleDateString(undefined, { day:'numeric', month:'short' }) +\n        ' · ' + esc(r.t.cat) + (r.t.repeat ? ' · repeats' : '') + '</span></span>' +\n      '<span class=\"a' + (r.t.type === 'in' ? ' in' : '') + '\">' + (r.t.type === 'in' ? '+' : '−') + cur(r.t.amount) + '</span>' +\n    '</div>';\n  }).join('') : '<div class=\"empty\">No transactions this month.<br>Tap <b>+</b> to add one.</div>';\n\n  $('exList').querySelectorAll('.e').forEach(el =>\n    el.onclick = () => openSheet(all.find(t => t.id === el.dataset.id)));\n}\n\nfunction openSheet(t){\n  editing = t || null;\n  $('exSheetT').textContent = t ? 'Edit transaction' : 'New transaction';\n  $('exAmt').value = t ? t.amount : '';\n  $('exDate').value = t ? t.date : new Date().toISOString().slice(0, 10);\n  $('exDesc').value = t ? (t.desc || '') : '';\n  $('exType').value = t ? t.type : 'out';\n  $('exRep').value = t ? (t.repeat || '') : '';\n  pickedCat = t ? t.cat : 'Groceries';\n  $('exCats').innerHTML = CATS.map(([n, i]) =>\n    '<button data-c=\"' + n + '\" class=\"' + (n === pickedCat ? 'on' : '') + '\">' + i + ' ' + n + '</button>').join('');\n  $('exCats').querySelectorAll('button').forEach(b => b.onclick = () => {\n    pickedCat = b.dataset.c;\n    $('exCats').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));\n  });\n  $('exDel').style.display = t ? '' : 'none';\n  $('exSheet').classList.add('on');\n  if (!t) setTimeout(() => $('exAmt').focus(), 80);\n}\n$('exAdd').onclick = () => openSheet(null);\n$('exCancel').onclick = () => $('exSheet').classList.remove('on');\n$('exSave').onclick = () => {\n  const amount = Math.abs(parseFloat($('exAmt').value));\n  if (!amount || isNaN(amount)) return toast('Enter an amount');\n  const data = { amount, date:$('exDate').value, desc:$('exDesc').value.trim(),\n    cat:pickedCat, type:$('exType').value, repeat:$('exRep').value };\n  if (editing) Object.assign(editing, data);\n  else all.unshift(Object.assign({ id:uid() }, data));\n  save(); $('exSheet').classList.remove('on'); render(); toast('Saved');\n};\n$('exDel').onclick = async () => {\n  if (!editing) return;\n  if (!await confirmDlg('Delete this transaction?', 'It is removed from your records.', 'Delete')) return;\n  all = all.filter(t => t.id !== editing.id);\n  save(); $('exSheet').classList.remove('on'); render(); toast('Deleted');\n};\n$('exPrev').onclick = () => { cursor.setMonth(cursor.getMonth() - 1); render(); };\n$('exNext').onclick = () => { cursor.setMonth(cursor.getMonth() + 1); render(); };\n$('exBudget').onclick = async () => {\n  const v = await ask('Monthly budget', 'Amount in ' + settings.currency + ' (0 to turn it off)', String(settings.budget || ''));\n  if (v === null) return;\n  settings.budget = Math.max(0, parseFloat(v) || 0);\n  localStorage.setItem(SET, JSON.stringify(settings));\n  render(); toast(settings.budget ? 'Budget set' : 'Budget cleared');\n};\n$('exCsv').onclick = () => {\n  const rows = occurrences(cursor);\n  const csv = 'Date,Description,Category,Type,Amount\\n' + rows.map(r =>\n    [r.date.toISOString().slice(0, 10), '\"' + (r.t.desc || '').replace(/\"/g, '\"\"') + '\"',\n     r.t.cat, r.t.type === 'in' ? 'Income' : 'Expense', r.t.amount.toFixed(2)].join(',')).join('\\n');\n  const blob = new Blob([csv], { type:'text/csv' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = 'expenses-' + ym(cursor) + '.csv'; a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n};\n\nrender();"

      "html": "<div id=\"rc\">\n<style>\n  #rc{position:absolute;inset:0;background:#F2F2F7;overflow-y:auto}\n  #rc .wrap{max-width:640px;margin:0 auto;padding:22px 18px calc(30px + env(safe-area-inset-bottom,0px))}\n  #rc .top{display:flex;gap:8px;align-items:center;margin-bottom:16px}\n  #rc .top input{flex:1;padding:11px 14px;border:1px solid rgba(60,60,67,.16);border-radius:13px;background:#fff;font:inherit;font-size:16px}\n  #rc .top input:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #rc .btn{padding:11px 15px;border:0;border-radius:12px;background:#0A84FF;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .15s}\n  #rc .btn:active{transform:scale(.97)}\n  #rc .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #rc .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}\n  #rc .tags{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;margin-bottom:4px;-webkit-overflow-scrolling:touch}\n  #rc .tags button{padding:6px 13px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:12.5px;font-weight:560;color:#6E6E76;cursor:pointer;white-space:nowrap}\n  #rc .tags button.on{background:#111114;border-color:#111114;color:#fff}\n  #rc .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}\n  #rc .rcard{background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4);transition:transform .15s}\n  #rc .rcard:active{transform:scale(.98)}\n  #rc .rcard .ph{height:96px;background:linear-gradient(135deg,#FFB84D,#EF5F3C);display:flex;align-items:center;justify-content:center;font-size:34px}\n  #rc .rcard .bd{padding:12px 13px}\n  #rc .rcard h3{margin:0 0 5px;font-size:15px;font-weight:640;letter-spacing:-.01em;line-height:1.3}\n  #rc .rcard .meta{font-size:11.5px;color:#A6A6AE;display:flex;gap:9px;flex-wrap:wrap}\n  #rc .empty{text-align:center;color:#A6A6AE;font-size:14px;padding:50px 20px;line-height:1.7}\n  /* detail */\n  #rc .view{position:absolute;inset:0;background:#fff;overflow-y:auto;display:none;z-index:4}\n  #rc .view.on{display:block}\n  #rc .view .hero{height:150px;background:linear-gradient(135deg,#FFB84D,#EF5F3C);display:flex;align-items:center;justify-content:center;font-size:56px;position:relative}\n  #rc .view .back{position:absolute;top:14px;left:14px;border:0;border-radius:11px;background:rgba(255,255,255,.9);padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;color:#111114}\n  #rc .view .inner{max-width:640px;margin:0 auto;padding:22px 18px calc(40px + env(safe-area-inset-bottom,0px))}\n  #rc .view h2{margin:0 0 8px;font-size:26px;font-weight:700;letter-spacing:-.022em;line-height:1.2}\n  #rc .view .vmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#6E6E76;margin-bottom:18px}\n  #rc .view .desc{font-size:14.5px;color:#3C3C43;line-height:1.6;margin-bottom:20px}\n  #rc .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:24px 0 12px;display:flex;justify-content:space-between;align-items:center}\n  #rc .serv{display:flex;align-items:center;gap:10px;background:rgba(120,120,128,.1);border-radius:11px;padding:4px}\n  #rc .serv button{width:28px;height:28px;border:0;border-radius:8px;background:#fff;font-size:16px;cursor:pointer;font-weight:600;color:#111114}\n  #rc .serv span{font-size:13px;font-weight:600;min-width:64px;text-align:center;text-transform:none;letter-spacing:0;color:#111114}\n  #rc .ing{display:flex;align-items:flex-start;gap:11px;padding:10px 2px;border-bottom:1px solid rgba(60,60,67,.07);cursor:pointer;font-size:15px;line-height:1.45}\n  #rc .ing:last-child{border-bottom:0}\n  #rc .ing .cb{width:21px;height:21px;flex:0 0 auto;border:1.8px solid #C3C3C9;border-radius:6px;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}\n  #rc .ing.done .cb{background:#30A46C;border-color:#30A46C}\n  #rc .ing.done .tx{color:#A6A6AE;text-decoration:line-through}\n  #rc .ing .amt{font-weight:640;color:#111114}\n  #rc .step{display:flex;gap:13px;padding:13px 2px;border-bottom:1px solid rgba(60,60,67,.07);cursor:pointer}\n  #rc .step:last-child{border-bottom:0}\n  #rc .step .n{flex:0 0 26px;height:26px;border-radius:50%;background:rgba(10,132,255,.12);color:#0A84FF;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}\n  #rc .step .tx{flex:1;font-size:15px;line-height:1.55;color:#1A1A1F}\n  #rc .step.done .n{background:#30A46C;color:#fff} #rc .step.done .tx{color:#A6A6AE}\n  #rc .notes{background:#FFF9E8;border-radius:12px;padding:14px;font-size:14px;line-height:1.6;color:#5C4A16}\n  #rc .vbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}\n  /* editor */\n  #rc .ed{position:absolute;inset:0;background:#F2F2F7;overflow-y:auto;display:none;z-index:5}\n  #rc .ed.on{display:block}\n  #rc .ed .inner{max-width:640px;margin:0 auto;padding:22px 18px calc(40px + env(safe-area-inset-bottom,0px))}\n  #rc .ed label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:16px 0 6px}\n  #rc .ed input,#rc .ed textarea,#rc .ed select{width:100%;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:#111114}\n  #rc .ed textarea{min-height:120px;resize:vertical;line-height:1.55}\n  #rc .ed input:focus,#rc .ed textarea:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #rc .ed .hint{font-size:12px;color:#A6A6AE;margin-top:5px;line-height:1.5}\n  #rc .ed .r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}\n  #rc .ed h2{margin:0;font-size:22px;font-weight:700}\n</style>\n  <div class=\"wrap\" id=\"rcHome\">\n    <div class=\"top\">\n      <input id=\"rcSearch\" placeholder=\"Search recipes, ingredients…\" spellcheck=\"false\">\n      <button class=\"btn\" id=\"rcNew\">New</button>\n    </div>\n    <div class=\"tags\" id=\"rcTags\"></div>\n    <div class=\"grid\" id=\"rcGrid\"></div>\n    <div style=\"display:flex;gap:8px;margin-top:22px;flex-wrap:wrap\">\n      <button class=\"btn ghost sm\" id=\"rcExport\">Export all</button>\n      <button class=\"btn ghost sm\" id=\"rcImport\">Import</button>\n    </div>\n  </div>\n\n  <div class=\"view\" id=\"rcView\">\n    <div class=\"hero\" id=\"rcHero\"><button class=\"back\" id=\"rcBack\">&larr; Back</button><span id=\"rcEmoji\">🍲</span></div>\n    <div class=\"inner\" id=\"rcViewBody\"></div>\n  </div>\n\n  <div class=\"ed\" id=\"rcEd\">\n    <div class=\"inner\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\">\n        <h2 id=\"rcEdTitle\">New recipe</h2>\n        <button class=\"btn ghost sm\" id=\"rcEdCancel\">Cancel</button>\n      </div>\n      <label for=\"rcT\">Title</label><input id=\"rcT\" placeholder=\"Spaghetti Bolognese\">\n      <label for=\"rcD\">Short description</label><input id=\"rcD\" placeholder=\"Rich, slow-cooked and freezer-friendly\">\n      <div class=\"r3\">\n        <div><label for=\"rcServ\">Serves</label><input id=\"rcServ\" type=\"number\" min=\"1\" value=\"4\" inputmode=\"numeric\"></div>\n        <div><label for=\"rcPrep\">Prep (min)</label><input id=\"rcPrep\" type=\"number\" min=\"0\" value=\"15\" inputmode=\"numeric\"></div>\n        <div><label for=\"rcCook\">Cook (min)</label><input id=\"rcCook\" type=\"number\" min=\"0\" value=\"30\" inputmode=\"numeric\"></div>\n      </div>\n      <label for=\"rcEmojiIn\">Icon &amp; tags</label>\n      <div class=\"r3\" style=\"grid-template-columns:80px 1fr\">\n        <input id=\"rcEmojiIn\" value=\"🍲\" maxlength=\"4\" style=\"text-align:center;font-size:20px\">\n        <input id=\"rcTagsIn\" placeholder=\"dinner, italian, quick\">\n      </div>\n      <label for=\"rcI\">Ingredients &mdash; one per line</label>\n      <textarea id=\"rcI\" spellcheck=\"false\" placeholder=\"500g beef mince&#10;2 onions, diced&#10;1 tbsp olive oil\"></textarea>\n      <p class=\"hint\">Start a line with a number and it scales automatically when servings change.</p>\n      <label for=\"rcS\">Method &mdash; one step per line</label>\n      <textarea id=\"rcS\" placeholder=\"Heat the oil in a large pan.&#10;Brown the mince, breaking it up as you go.\"></textarea>\n      <label for=\"rcN\">Notes (optional)</label>\n      <textarea id=\"rcN\" style=\"min-height:70px\" placeholder=\"Tastes better the next day.\"></textarea>\n      <div style=\"display:flex;gap:8px;margin-top:22px\">\n        <button class=\"btn\" id=\"rcSave\" style=\"flex:1\">Save recipe</button>\n        <button class=\"btn ghost\" id=\"rcDelete\">Delete</button>\n      </div>\n    </div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst KEY = 'recipes.v1';\nlet all = [], editing = null, current = null, servings = 0, tagFilter = '';\ntry { all = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}\nif (!all.length) all = seed();\nconst save = () => localStorage.setItem(KEY, JSON.stringify(all));\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nfunction uid(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }\n\nfunction seed(){\n  return [{\n    id: uid(), emoji:'🍝', title:'Spaghetti Bolognese',\n    desc:'A rich weeknight ragù that only gets better the next day.',\n    serves:4, prep:15, cook:45, tags:['dinner','italian'],\n    ingredients:['1 tbsp olive oil','500 g beef mince','1 onion, finely diced','2 garlic cloves, crushed','400 g chopped tomatoes','2 tbsp tomato purée','1 beef stock cube','400 g spaghetti','Parmesan, to serve'],\n    steps:['Heat the oil in a large pan over medium heat.','Add the onion and cook for 5 minutes until soft, then add the garlic for 1 minute.','Turn the heat up, add the mince and brown all over, breaking it up as you go.','Stir in the tomatoes, purée and crumbled stock cube. Simmer gently for 30 minutes.','Meanwhile cook the spaghetti in well-salted boiling water until al dente.','Drain, toss with the sauce and finish with plenty of Parmesan.'],\n    notes:'Freezes beautifully for up to 3 months. A splash of milk at the end softens the acidity.'\n  }];\n}\n\n/* ---------- ingredient scaling ---------- */\n// Leading numbers (incl. fractions and ranges) scale with servings; the rest is left alone.\nfunction scaleLine(line, factor){\n  if (factor === 1) return esc(line);\n  return esc(line).replace(/^(\\d+(?:\\.\\d+)?(?:\\s*\\/\\s*\\d+)?)/, m => {\n    let n;\n    if (m.includes('/')){ const [a, b] = m.split('/').map(Number); n = a / b; }\n    else n = parseFloat(m);\n    const v = n * factor;\n    const out = Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v))\n      : (v < 10 ? v.toFixed(1).replace(/\\.0$/, '') : String(Math.round(v)));\n    return '<span class=\"amt\">' + out + '</span>';\n  });\n}\n\n/* ---------- home ---------- */\nfunction allTags(){\n  const s = new Set();\n  all.forEach(r => (r.tags || []).forEach(t => s.add(t)));\n  return [...s].sort();\n}\nfunction renderHome(){\n  const q = $('rcSearch').value.trim().toLowerCase();\n  const tags = allTags();\n  $('rcTags').innerHTML = tags.length\n    ? '<button class=\"' + (tagFilter ? '' : 'on') + '\" data-t=\"\">All</button>' +\n      tags.map(t => '<button class=\"' + (tagFilter === t ? 'on' : '') + '\" data-t=\"' + esc(t) + '\">' + esc(t) + '</button>').join('')\n    : '';\n  $('rcTags').querySelectorAll('button').forEach(b => b.onclick = () => { tagFilter = b.dataset.t; renderHome(); });\n\n  const list = all.filter(r => {\n    if (tagFilter && !(r.tags || []).includes(tagFilter)) return false;\n    if (!q) return true;\n    return (r.title + ' ' + r.desc + ' ' + (r.tags || []).join(' ') + ' ' + r.ingredients.join(' ')).toLowerCase().includes(q);\n  });\n\n  $('rcGrid').innerHTML = list.length ? list.map(r =>\n    '<div class=\"rcard\" data-id=\"' + r.id + '\">' +\n      '<div class=\"ph\">' + esc(r.emoji || '🍲') + '</div>' +\n      '<div class=\"bd\"><h3>' + esc(r.title) + '</h3><div class=\"meta\">' +\n        '<span>Serves ' + r.serves + '</span><span>' + ((r.prep || 0) + (r.cook || 0)) + ' min</span>' +\n      '</div></div></div>').join('')\n    : '<div class=\"empty\" style=\"grid-column:1/-1\">' + (all.length\n        ? 'Nothing matches that search.'\n        : 'No recipes yet.<br>Tap <b>New</b> to add your first one.') + '</div>';\n  $('rcGrid').querySelectorAll('.rcard').forEach(c => c.onclick = () => openRecipe(c.dataset.id));\n}\n$('rcSearch').oninput = renderHome;\n\n/* ---------- detail ---------- */\nfunction openRecipe(id){\n  current = all.find(r => r.id === id);\n  if (!current) return;\n  servings = current.serves;\n  drawView();\n  $('rcView').classList.add('on');\n}\nfunction drawView(){\n  const r = current, f = servings / r.serves;\n  $('rcEmoji').textContent = r.emoji || '🍲';\n  $('rcViewBody').innerHTML =\n    '<h2>' + esc(r.title) + '</h2>' +\n    '<div class=\"vmeta\">' +\n      (r.prep ? '<span>⏱ ' + r.prep + ' min prep</span>' : '') +\n      (r.cook ? '<span>🔥 ' + r.cook + ' min cook</span>' : '') +\n      ((r.tags || []).length ? '<span>' + r.tags.map(esc).join(' · ') + '</span>' : '') +\n    '</div>' +\n    (r.desc ? '<p class=\"desc\">' + esc(r.desc) + '</p>' : '') +\n    '<div class=\"cap\">Ingredients<span class=\"serv\">' +\n      '<button id=\"rcMinus\">&minus;</button><span>Serves ' + servings + '</span><button id=\"rcPlus\">+</button>' +\n    '</span></div>' +\n    '<div id=\"rcIngs\">' + r.ingredients.map((l, i) =>\n      '<div class=\"ing\" data-i=\"' + i + '\"><span class=\"cb\">✓</span><span class=\"tx\">' + scaleLine(l, f) + '</span></div>').join('') + '</div>' +\n    '<div class=\"cap\">Method</div>' +\n    '<div id=\"rcSteps\">' + r.steps.map((s, i) =>\n      '<div class=\"step\" data-i=\"' + i + '\"><span class=\"n\">' + (i + 1) + '</span><span class=\"tx\">' + esc(s) + '</span></div>').join('') + '</div>' +\n    (r.notes ? '<div class=\"cap\">Notes</div><div class=\"notes\">' + esc(r.notes) + '</div>' : '') +\n    '<div class=\"vbtns\">' +\n      '<button class=\"btn\" id=\"rcCook2\">Cook mode</button>' +\n      '<button class=\"btn ghost\" id=\"rcEdit\">Edit</button>' +\n      '<button class=\"btn ghost\" id=\"rcShare\">Copy as text</button>' +\n      '<button class=\"btn ghost\" id=\"rcShop\">Send to shopping list</button>' +\n    '</div>';\n\n  $('rcMinus').onclick = () => { if (servings > 1){ servings--; drawView(); } };\n  $('rcPlus').onclick = () => { if (servings < 50){ servings++; drawView(); } };\n  document.querySelectorAll('#rcIngs .ing, #rcSteps .step').forEach(el =>\n    el.onclick = () => el.classList.toggle('done'));\n  $('rcEdit').onclick = () => openEditor(current);\n  $('rcCook2').onclick = cookMode;\n  $('rcShare').onclick = () => {\n    const f2 = servings / current.serves;\n    const txt = current.title + '\\n\\nServes ' + servings + '\\n\\nINGREDIENTS\\n' +\n      current.ingredients.map(l => '- ' + l.replace(/^(\\d+(?:\\.\\d+)?)/, m => String(+m * f2))).join('\\n') +\n      '\\n\\nMETHOD\\n' + current.steps.map((s, i) => (i + 1) + '. ' + s).join('\\n') +\n      (current.notes ? '\\n\\nNOTES\\n' + current.notes : '');\n    navigator.clipboard.writeText(txt).then(() => toast('Recipe copied'), () => toast('Copied'));\n  };\n  $('rcShop').onclick = () => {\n    // Goes onto the *current* shopping list, not the master item library,\n    // so it shows up straight away on the Shopping List tool.\n    let list = [];\n    try { list = JSON.parse(localStorage.getItem('shopping.list.v1')) || []; } catch {}\n    const f2 = servings / current.serves;\n    let added = 0, skipped = 0;\n    current.ingredients.forEach(l => {\n      // scale any leading quantity to the servings currently on screen\n      const name = l.replace(/^(\\d+(?:\\.\\d+)?(?:\\s*\\/\\s*\\d+)?)/, m => {\n        let n;\n        if (m.includes('/')){ const [x, y] = m.split('/').map(Number); n = x / y; }\n        else n = parseFloat(m);\n        const v = n * f2;\n        return Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v))\n          : (v < 10 ? v.toFixed(1).replace(/\\.0$/, '') : String(Math.round(v)));\n      }).trim();\n      if (list.some(i => i.name.toLowerCase() === name.toLowerCase())){ skipped++; return; }\n      list.push({\n        id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),\n        name, cat: current.title, done: false\n      });\n      added++;\n    });\n    localStorage.setItem('shopping.list.v1', JSON.stringify(list));\n    toast(added + ' added to your shopping list' + (skipped ? ' \\u00b7 ' + skipped + ' already there' : ''));\n  };\n}\n\n/* Cook mode: keeps the screen awake and walks the steps full-screen. */\nasync function cookMode(){\n  let lock = null;\n  try { if (navigator.wakeLock) lock = await navigator.wakeLock.request('screen'); } catch {}\n  let i = 0;\n  const ov = document.createElement('div');\n  ov.style.cssText = 'position:absolute;inset:0;background:#0E1116;color:#fff;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;text-align:center';\n  const draw = () => {\n    ov.innerHTML =\n      '<div style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5)\">Step ' + (i + 1) + ' of ' + current.steps.length + '</div>' +\n      '<div style=\"font-size:23px;line-height:1.5;margin:22px 0 34px;max-width:600px\">' + esc(current.steps[i]) + '</div>' +\n      '<div style=\"display:flex;gap:12px\">' +\n        '<button id=\"ckP\" style=\"min-width:96px;height:54px;border:0;border-radius:15px;background:rgba(255,255,255,.14);color:#fff;font-size:15px;font-weight:600;cursor:pointer\">Back</button>' +\n        '<button id=\"ckN\" style=\"min-width:96px;height:54px;border:0;border-radius:15px;background:#4BD08B;color:#062B1B;font-size:15px;font-weight:600;cursor:pointer\">' + (i === current.steps.length - 1 ? 'Done' : 'Next') + '</button>' +\n        '<button id=\"ckX\" style=\"min-width:70px;height:54px;border:0;border-radius:15px;background:rgba(229,72,77,.85);color:#fff;font-size:15px;font-weight:600;cursor:pointer\">Exit</button>' +\n      '</div>';\n    ov.querySelector('#ckP').onclick = () => { if (i > 0){ i--; draw(); } };\n    ov.querySelector('#ckN').onclick = () => { if (i < current.steps.length - 1){ i++; draw(); } else close(); };\n    ov.querySelector('#ckX').onclick = close;\n  };\n  const close = () => { try { lock && lock.release(); } catch {} ov.remove(); };\n  draw();\n  document.getElementById('rc').appendChild(ov);\n}\n\n$('rcBack').onclick = () => { $('rcView').classList.remove('on'); renderHome(); };\n\n/* ---------- editor ---------- */\nfunction openEditor(r){\n  editing = r;\n  $('rcEdTitle').textContent = r ? 'Edit recipe' : 'New recipe';\n  $('rcT').value = r ? r.title : '';\n  $('rcD').value = r ? r.desc : '';\n  $('rcServ').value = r ? r.serves : 4;\n  $('rcPrep').value = r ? r.prep : 15;\n  $('rcCook').value = r ? r.cook : 30;\n  $('rcEmojiIn').value = r ? (r.emoji || '🍲') : '🍲';\n  $('rcTagsIn').value = r ? (r.tags || []).join(', ') : '';\n  $('rcI').value = r ? r.ingredients.join('\\n') : '';\n  $('rcS').value = r ? r.steps.join('\\n') : '';\n  $('rcN').value = r ? (r.notes || '') : '';\n  $('rcDelete').style.display = r ? '' : 'none';\n  $('rcEd').classList.add('on');\n}\n$('rcNew').onclick = () => openEditor(null);\n$('rcEdCancel').onclick = () => $('rcEd').classList.remove('on');\n$('rcSave').onclick = () => {\n  const title = $('rcT').value.trim();\n  if (!title) return toast('Give the recipe a title');\n  const data = {\n    title, desc:$('rcD').value.trim(),\n    serves: Math.max(1, parseInt($('rcServ').value, 10) || 1),\n    prep: parseInt($('rcPrep').value, 10) || 0,\n    cook: parseInt($('rcCook').value, 10) || 0,\n    emoji: $('rcEmojiIn').value.trim() || '🍲',\n    tags: $('rcTagsIn').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean),\n    ingredients: $('rcI').value.split('\\n').map(l => l.trim()).filter(Boolean),\n    steps: $('rcS').value.split('\\n').map(l => l.trim()).filter(Boolean),\n    notes: $('rcN').value.trim()\n  };\n  if (editing) Object.assign(editing, data);\n  else { const n = Object.assign({ id: uid() }, data); all.unshift(n); editing = n; }\n  save();\n  $('rcEd').classList.remove('on');\n  renderHome();\n  if ($('rcView').classList.contains('on')){ current = editing; servings = current.serves; drawView(); }\n  toast('Recipe saved');\n};\n$('rcDelete').onclick = async () => {\n  if (!editing) return;\n  if (!await confirmDlg('Delete \"' + editing.title + '\"?', 'This recipe is removed from this device.', 'Delete')) return;\n  all = all.filter(r => r.id !== editing.id);\n  save(); editing = null;\n  $('rcEd').classList.remove('on');\n  $('rcView').classList.remove('on');\n  renderHome(); toast('Deleted');\n};\n\n/* ---------- import / export ---------- */\n$('rcExport').onclick = () => {\n  const blob = new Blob([JSON.stringify(all, null, 2)], { type:'application/json' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = 'recipes.json'; a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n};\n$('rcImport').onclick = async () => {\n  const txt = await ask('Import recipes', 'Paste exported recipe JSON', '', true);\n  if (!txt) return;\n  try {\n    const data = JSON.parse(txt);\n    if (!Array.isArray(data)) throw new Error('Expected a list');\n    let n = 0;\n    data.forEach(r => {\n      if (!r.title) return;\n      r.id = uid(); all.unshift(r); n++;\n    });\n    save(); renderHome(); toast(n + ' recipe' + (n === 1 ? '' : 's') + ' imported');\n  } catch (e){ toast('Could not read that: ' + e.message); }\n};\n\nrenderHome();"

      "html": "<div id=\"wk\">\n<style>\n  #wk{position:absolute;inset:0;display:flex;flex-direction:column;background:#F2F2F7;overflow:hidden}\n  #wk .scroll{flex:1;overflow-y:auto;padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px))}\n  #wk .wrap{max-width:560px;margin:0 auto}\n  #wk h2{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #wk .sub{margin:0 0 20px;font-size:13.5px;color:#6E6E76}\n  #wk .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #wk .ex{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#fff;border-radius:14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,24,40,.05)}\n  #wk .ex.rest{background:#EEF3FF}\n  #wk .ex .grip{color:#C3C3C9;font-size:17px;cursor:grab;flex:0 0 auto;touch-action:none}\n  #wk .ex .nm{flex:1;font-size:15px;font-weight:560;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  #wk .ex .du{font-size:14px;color:#6E6E76;font-variant-numeric:tabular-nums;flex:0 0 auto}\n  #wk .ex .x{border:0;background:none;color:#C3C3C9;font-size:19px;cursor:pointer;padding:0 2px;line-height:1}\n  #wk .ex .x:hover{color:#E5484D}\n  #wk .row{display:flex;gap:8px;margin-bottom:10px}\n  #wk input,#wk select{width:100%;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:#111114}\n  #wk input:focus,#wk select:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #wk .row .dur{flex:0 0 108px}\n  #wk .btn{padding:11px 16px;border:0;border-radius:12px;background:#0A84FF;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .15s}\n  #wk .btn:active{transform:scale(.97)}\n  #wk .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #wk .btn.wide{width:100%;height:52px;font-size:16px;border-radius:15px}\n  #wk .btns{display:flex;gap:8px;flex-wrap:wrap}\n  #wk .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:0 0 12px}\n  #wk .tot{display:flex;justify-content:space-between;font-size:13.5px;color:#6E6E76;margin:14px 0;padding:0 4px}\n  #wk .tot b{color:#111114;font-variant-numeric:tabular-nums}\n  #wk .empty{text-align:center;color:#A6A6AE;font-size:14px;padding:26px 10px;line-height:1.6}\n  #wk .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}\n  #wk .presets button{padding:6px 12px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:12.5px;cursor:pointer;color:#6E6E76}\n  #wk .presets button:hover{border-color:#0A84FF;color:#0A84FF}\n  /* runner */\n  #wk .run{position:absolute;inset:0;background:#0E1116;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;z-index:6}\n  #wk .run.on{display:flex}\n  #wk .run.rest{background:#0B2545}\n  #wk .run .step{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5)}\n  #wk .run .nm{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:10px 0 4px;line-height:1.15;max-width:90%}\n  #wk .run .next{font-size:13.5px;color:rgba(255,255,255,.45);margin-bottom:26px}\n  #wk .run .ringwrap{position:relative;width:230px;height:230px;margin-bottom:26px}\n  #wk .run svg{width:230px;height:230px;transform:rotate(-90deg)}\n  #wk .run svg circle{fill:none;stroke-width:9}\n  #wk .run svg .bg{stroke:rgba(255,255,255,.12)}\n  #wk .run svg .fg{stroke:#4BD08B;stroke-linecap:round;transition:stroke-dashoffset .95s linear,stroke .3s}\n  #wk .run .time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em}\n  #wk .run .ctrls{display:flex;gap:12px}\n  #wk .run .ctrls button{min-width:64px;height:56px;padding:0 20px;border:0;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;font-size:15px;font-weight:600;cursor:pointer}\n  #wk .run .ctrls .go{background:#4BD08B;color:#062B1B}\n  #wk .run .ctrls .end{background:rgba(229,72,77,.85)}\n  #wk .run .done{font-size:26px;font-weight:700}\n  #wk .run .mute{position:absolute;top:18px;right:18px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 12px;font-size:12.5px;cursor:pointer}\n</style>\n  <div class=\"scroll\">\n    <div class=\"wrap\">\n      <h2>Workout Planner</h2>\n      <p class=\"sub\">Build a routine, then run it hands-free with spoken cues.</p>\n\n      <div class=\"card\">\n        <p class=\"cap\">Add an exercise</p>\n        <div class=\"row\">\n          <input id=\"wkName\" placeholder=\"e.g. Push-ups\" autocomplete=\"off\">\n          <input class=\"dur\" id=\"wkDur\" type=\"number\" min=\"5\" max=\"3600\" value=\"45\" inputmode=\"numeric\">\n        </div>\n        <div class=\"btns\">\n          <button class=\"btn\" id=\"wkAdd\">Add exercise</button>\n          <button class=\"btn ghost\" id=\"wkRest\">Add rest</button>\n        </div>\n        <div class=\"presets\" id=\"wkPresets\">\n          <button data-n=\"Jumping Jacks\" data-d=\"45\">Jumping Jacks</button>\n          <button data-n=\"Push-ups\" data-d=\"45\">Push-ups</button>\n          <button data-n=\"Squats\" data-d=\"45\">Squats</button>\n          <button data-n=\"Plank\" data-d=\"60\">Plank</button>\n          <button data-n=\"Lunges\" data-d=\"45\">Lunges</button>\n          <button data-n=\"Burpees\" data-d=\"30\">Burpees</button>\n          <button data-n=\"Mountain Climbers\" data-d=\"40\">Mountain Climbers</button>\n          <button data-n=\"Sit-ups\" data-d=\"45\">Sit-ups</button>\n        </div>\n      </div>\n\n      <p class=\"cap\" style=\"margin-top:20px\">Routine</p>\n      <div id=\"wkList\"></div>\n      <div class=\"tot\"><span>Total time</span><b id=\"wkTotal\">0:00</b></div>\n\n      <button class=\"btn wide\" id=\"wkRun\">Start workout</button>\n      <div class=\"btns\" style=\"margin-top:10px\">\n        <button class=\"btn ghost\" id=\"wkSave\">Save routine</button>\n        <button class=\"btn ghost\" id=\"wkLoad\">Load routine</button>\n        <button class=\"btn ghost\" id=\"wkClear\">Clear</button>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"run\" id=\"wkRunner\">\n    <button class=\"mute\" id=\"wkMute\">🔊 Voice on</button>\n    <div class=\"step\" id=\"wkStep\"></div>\n    <div class=\"nm\" id=\"wkNow\"></div>\n    <div class=\"next\" id=\"wkNext\"></div>\n    <div class=\"ringwrap\">\n      <svg viewBox=\"0 0 230 230\"><circle class=\"bg\" cx=\"115\" cy=\"115\" r=\"103\"/><circle class=\"fg\" id=\"wkRing\" cx=\"115\" cy=\"115\" r=\"103\"/></svg>\n      <div class=\"time\" id=\"wkTime\">0</div>\n    </div>\n    <div class=\"ctrls\">\n      <button id=\"wkPrev\">Prev</button>\n      <button class=\"go\" id=\"wkPause\">Pause</button>\n      <button id=\"wkSkip\">Skip</button>\n      <button class=\"end\" id=\"wkStop\">End</button>\n    </div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst KEY = 'workout.routine.v1', SAVED = 'workout.saved.v1';\nlet plan = [];\nlet voiceOn = localStorage.getItem('workout.voice') !== 'off';\ntry { plan = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}\n\nconst fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nconst save = () => localStorage.setItem(KEY, JSON.stringify(plan));\n\n/* ---------- speech ---------- */\nlet voice = null;\nfunction pickVoice(){\n  if (typeof speechSynthesis === 'undefined') return;\n  const vs = speechSynthesis.getVoices();\n  voice = vs.find(v => /en-GB/i.test(v.lang) && !/google/i.test(v.name))\n       || vs.find(v => /en/i.test(v.lang)) || vs[0] || null;\n}\npickVoice();\nif (typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = pickVoice;\nfunction say(text, force){\n  if ((!voiceOn && !force) || typeof speechSynthesis === 'undefined') return;\n  try {\n    const u = new SpeechSynthesisUtterance(text);\n    if (voice) u.voice = voice;\n    u.rate = 1.02; u.pitch = 1;\n    speechSynthesis.speak(u);\n  } catch {}\n}\nfunction beep(freq, ms){\n  try {\n    const C = window.AudioContext || window.webkitAudioContext;\n    if (!C) return;\n    audioCtx = audioCtx || new C();\n    const o = audioCtx.createOscillator(), g = audioCtx.createGain();\n    o.frequency.value = freq; o.type = 'sine';\n    g.gain.setValueAtTime(.18, audioCtx.currentTime);\n    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + ms / 1000);\n    o.connect(g); g.connect(audioCtx.destination);\n    o.start(); o.stop(audioCtx.currentTime + ms / 1000);\n  } catch {}\n}\nlet audioCtx = null;\n\n/* ---------- list ---------- */\nfunction render(){\n  const box = $('wkList');\n  if (!plan.length){\n    box.innerHTML = '<div class=\"empty\">No exercises yet.<br>Add one above or tap a suggestion.</div>';\n  } else {\n    box.innerHTML = plan.map((e, i) =>\n      '<div class=\"ex' + (e.rest ? ' rest' : '') + '\" draggable=\"true\" data-i=\"' + i + '\">' +\n        '<span class=\"grip\">&#8942;&#8942;</span>' +\n        '<span class=\"nm\">' + esc(e.name) + '</span>' +\n        '<span class=\"du\">' + fmt(e.dur) + '</span>' +\n        '<button class=\"x\" title=\"Remove\">&times;</button>' +\n      '</div>').join('');\n    box.querySelectorAll('.ex').forEach(el => {\n      const i = +el.dataset.i;\n      el.querySelector('.x').onclick = ev => { ev.stopPropagation(); plan.splice(i, 1); save(); render(); };\n      el.querySelector('.nm').onclick = async () => {\n        const n = await ask('Rename', 'Exercise name', plan[i].name);\n        if (n && n.trim()){ plan[i].name = n.trim(); save(); render(); }\n      };\n      el.querySelector('.du').onclick = async () => {\n        const d = await ask('Duration', 'Seconds', String(plan[i].dur));\n        const v = parseInt(d, 10);\n        if (v > 0){ plan[i].dur = Math.min(v, 3600); save(); render(); }\n      };\n      el.addEventListener('dragstart', e => { drag = i; el.style.opacity = '.4'; });\n      el.addEventListener('dragend', () => { el.style.opacity = ''; });\n      el.addEventListener('dragover', e => e.preventDefault());\n      el.addEventListener('drop', e => {\n        e.preventDefault();\n        if (drag === null || drag === i) return;\n        const [m] = plan.splice(drag, 1);\n        plan.splice(i, 0, m); drag = null; save(); render();\n      });\n    });\n  }\n  $('wkTotal').textContent = fmt(plan.reduce((n, e) => n + e.dur, 0));\n  $('wkRun').disabled = !plan.length;\n}\nlet drag = null;\n\nfunction add(name, dur, rest){\n  plan.push({ name, dur: Math.max(5, Math.min(dur, 3600)), rest: !!rest });\n  save(); render();\n}\n$('wkAdd').onclick = () => {\n  const n = $('wkName').value.trim();\n  const d = parseInt($('wkDur').value, 10) || 45;\n  if (!n) return toast('Give the exercise a name');\n  add(n, d, false);\n  $('wkName').value = ''; $('wkName').focus();\n};\n$('wkName').addEventListener('keydown', e => { if (e.key === 'Enter') $('wkAdd').click(); });\n$('wkRest').onclick = () => add('Rest', parseInt($('wkDur').value, 10) || 20, true);\n$('wkPresets').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  add(b.dataset.n, +b.dataset.d, false);\n};\n$('wkClear').onclick = async () => {\n  if (!plan.length) return;\n  if (!await confirmDlg('Clear the routine?', 'All exercises in the current routine are removed.', 'Clear')) return;\n  plan = []; save(); render();\n};\n$('wkSave').onclick = async () => {\n  if (!plan.length) return toast('Nothing to save');\n  const name = await ask('Save routine', 'Give this routine a name', '');\n  if (!name) return;\n  let all = {};\n  try { all = JSON.parse(localStorage.getItem(SAVED)) || {}; } catch {}\n  all[name] = plan;\n  localStorage.setItem(SAVED, JSON.stringify(all));\n  toast('Routine saved');\n};\n$('wkLoad').onclick = async () => {\n  let all = {};\n  try { all = JSON.parse(localStorage.getItem(SAVED)) || {}; } catch {}\n  const names = Object.keys(all);\n  if (!names.length) return toast('No saved routines yet');\n  const pick = await choose('Load routine', names);\n  if (!pick) return;\n  plan = JSON.parse(JSON.stringify(all[pick]));\n  save(); render(); toast('Loaded \"' + pick + '\"');\n};\n\n/* ---------- runner ---------- */\nlet idx = 0, left = 0, timer = null, paused = false;\nconst R = 103, CIRC = 2 * Math.PI * R;\n\nfunction startRun(){\n  if (!plan.length) return;\n  idx = 0; paused = false;\n  $('wkRunner').classList.add('on');\n  $('wkRing').style.strokeDasharray = CIRC;\n  try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch {}\n  say('Starting workout. First up, ' + plan[0].name, true);\n  beginStep();\n  clearInterval(timer);\n  timer = setInterval(tick, 1000);\n}\nfunction beginStep(){\n  const e = plan[idx];\n  left = e.dur;\n  $('wkRunner').classList.toggle('rest', !!e.rest);\n  $('wkStep').textContent = 'Exercise ' + (idx + 1) + ' of ' + plan.length;\n  $('wkNow').textContent = e.name;\n  $('wkNext').textContent = plan[idx + 1] ? 'Next: ' + plan[idx + 1].name : 'Last one \\u2014 finish strong';\n  $('wkRing').style.stroke = e.rest ? '#5AA9FF' : '#4BD08B';\n  paint();\n}\nfunction paint(){\n  const e = plan[idx];\n  $('wkTime').textContent = left;\n  $('wkRing').style.strokeDashoffset = CIRC * (1 - left / e.dur);\n  if (left <= 3 && left > 0) $('wkRing').style.stroke = '#E5484D';\n}\nfunction tick(){\n  if (paused) return;\n  const e = plan[idx];\n  left--;\n  if (left === Math.floor(e.dur / 2) && e.dur >= 30 && !e.rest) say('Halfway');\n  if (left === 10 && e.dur > 20) say('Ten seconds');\n  if (left <= 3 && left > 0) beep(760, 110);\n  if (left <= 0){\n    beep(1040, 260);\n    if (idx + 1 < plan.length){\n      idx++;\n      const n = plan[idx];\n      say(n.rest ? 'Rest' : 'Next, ' + n.name);\n      beginStep();\n    } else {\n      finish();\n      return;\n    }\n  }\n  paint();\n}\nfunction finish(){\n  clearInterval(timer); timer = null;\n  say('Workout complete. Well done.', true);\n  $('wkNow').innerHTML = '<span class=\"done\">Workout complete 🎉</span>';\n  $('wkStep').textContent = 'Finished';\n  $('wkNext').textContent = fmt(plan.reduce((n, e) => n + e.dur, 0)) + ' of work done';\n  $('wkTime').textContent = '\\u2713';\n  $('wkRing').style.strokeDashoffset = 0;\n  $('wkRing').style.stroke = '#4BD08B';\n}\nfunction stopRun(){\n  clearInterval(timer); timer = null;\n  try { speechSynthesis.cancel(); } catch {}\n  $('wkRunner').classList.remove('on');\n}\n$('wkRun').onclick = startRun;\n$('wkStop').onclick = stopRun;\n$('wkPause').onclick = () => {\n  paused = !paused;\n  $('wkPause').textContent = paused ? 'Resume' : 'Pause';\n  if (paused){ try { speechSynthesis.cancel(); } catch {} say('Paused', true); }\n};\n$('wkSkip').onclick = () => {\n  if (idx + 1 < plan.length){ idx++; say(plan[idx].rest ? 'Rest' : plan[idx].name); beginStep(); }\n  else finish();\n};\n$('wkPrev').onclick = () => {\n  if (!timer){ startRun(); return; }\n  if (left < plan[idx].dur - 2) beginStep();\n  else if (idx > 0){ idx--; say(plan[idx].name); beginStep(); }\n};\n$('wkMute').onclick = () => {\n  voiceOn = !voiceOn;\n  localStorage.setItem('workout.voice', voiceOn ? 'on' : 'off');\n  $('wkMute').textContent = voiceOn ? '🔊 Voice on' : '🔇 Voice off';\n  if (!voiceOn) try { speechSynthesis.cancel(); } catch {}\n};\n$('wkMute').textContent = voiceOn ? '🔊 Voice on' : '🔇 Voice off';\n\nrender();\nonToolExit(() => { clearInterval(timer); try { speechSynthesis.cancel(); } catch {} });"
    },
