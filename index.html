      "html": "<div id=\"wk\">\n<style>\n  #wk{position:absolute;inset:0;display:flex;flex-direction:column;background:#F2F2F7;overflow:hidden}\n  #wk .scroll{flex:1;overflow-y:auto;padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px))}\n  #wk .wrap{max-width:560px;margin:0 auto}\n  #wk h2{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #wk .sub{margin:0 0 20px;font-size:13.5px;color:#6E6E76}\n  #wk .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #wk .ex{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#fff;border-radius:14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,24,40,.05)}\n  #wk .ex.rest{background:#EEF3FF}\n  #wk .ex .grip{color:#C3C3C9;font-size:17px;cursor:grab;flex:0 0 auto;touch-action:none}\n  #wk .ex .nm{flex:1;font-size:15px;font-weight:560;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  #wk .ex .du{font-size:14px;color:#6E6E76;font-variant-numeric:tabular-nums;flex:0 0 auto}\n  #wk .ex .x{border:0;background:none;color:#C3C3C9;font-size:19px;cursor:pointer;padding:0 2px;line-height:1}\n  #wk .ex .x:hover{color:#E5484D}\n  #wk .row{display:flex;gap:8px;margin-bottom:10px}\n  #wk input,#wk select{width:100%;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:#111114}\n  #wk input:focus,#wk select:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #wk .row .dur{flex:0 0 108px}\n  #wk .btn{padding:11px 16px;border:0;border-radius:12px;background:#0A84FF;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .15s}\n  #wk .btn:active{transform:scale(.97)}\n  #wk .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #wk .btn.wide{width:100%;height:52px;font-size:16px;border-radius:15px}\n  #wk .btns{display:flex;gap:8px;flex-wrap:wrap}\n  #wk .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:0 0 12px}\n  #wk .tot{display:flex;justify-content:space-between;font-size:13.5px;color:#6E6E76;margin:14px 0;padding:0 4px}\n  #wk .tot b{color:#111114;font-variant-numeric:tabular-nums}\n  #wk .empty{text-align:center;color:#A6A6AE;font-size:14px;padding:26px 10px;line-height:1.6}\n  #wk .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}\n  #wk .presets button{padding:6px 12px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:12.5px;cursor:pointer;color:#6E6E76}\n  #wk .presets button:hover{border-color:#0A84FF;color:#0A84FF}\n  /* runner */\n  #wk .run{position:absolute;inset:0;background:#0E1116;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;z-index:6}\n  #wk .run.on{display:flex}\n  #wk .run.rest{background:#0B2545}\n  #wk .run .step{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5)}\n  #wk .run .nm{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:10px 0 4px;line-height:1.15;max-width:90%}\n  #wk .run .next{font-size:13.5px;color:rgba(255,255,255,.45);margin-bottom:26px}\n  #wk .run .ringwrap{position:relative;width:230px;height:230px;margin-bottom:26px}\n  #wk .run svg{width:230px;height:230px;transform:rotate(-90deg)}\n  #wk .run svg circle{fill:none;stroke-width:9}\n  #wk .run svg .bg{stroke:rgba(255,255,255,.12)}\n  #wk .run svg .fg{stroke:#4BD08B;stroke-linecap:round;transition:stroke-dashoffset .95s linear,stroke .3s}\n  #wk .run .time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em}\n  #wk .run .ctrls{display:flex;gap:12px}\n  #wk .run .ctrls button{min-width:64px;height:56px;padding:0 20px;border:0;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;font-size:15px;font-weight:600;cursor:pointer}\n  #wk .run .ctrls .go{background:#4BD08B;color:#062B1B}\n  #wk .run .ctrls .end{background:rgba(229,72,77,.85)}\n  #wk .run .done{font-size:26px;font-weight:700}\n  #wk .run .mute{position:absolute;top:18px;right:18px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 12px;font-size:12.5px;cursor:pointer}\n</style>\n  <div class=\"scroll\">\n    <div class=\"wrap\">\n      <h2>Workout Planner</h2>\n      <p class=\"sub\">Build a routine, then run it hands-free with spoken cues.</p>\n\n      <div class=\"card\">\n        <p class=\"cap\">Add an exercise</p>\n        <div class=\"row\">\n          <input id=\"wkName\" placeholder=\"e.g. Push-ups\" autocomplete=\"off\">\n          <input class=\"dur\" id=\"wkDur\" type=\"number\" min=\"5\" max=\"3600\" value=\"45\" inputmode=\"numeric\">\n        </div>\n        <div class=\"btns\">\n          <button class=\"btn\" id=\"wkAdd\">Add exercise</button>\n          <button class=\"btn ghost\" id=\"wkRest\">Add rest</button>\n        </div>\n        <div class=\"presets\" id=\"wkPresets\">\n          <button data-n=\"Jumping Jacks\" data-d=\"45\">Jumping Jacks</button>\n          <button data-n=\"Push-ups\" data-d=\"45\">Push-ups</button>\n          <button data-n=\"Squats\" data-d=\"45\">Squats</button>\n          <button data-n=\"Plank\" data-d=\"60\">Plank</button>\n          <button data-n=\"Lunges\" data-d=\"45\">Lunges</button>\n          <button data-n=\"Burpees\" data-d=\"30\">Burpees</button>\n          <button data-n=\"Mountain Climbers\" data-d=\"40\">Mountain Climbers</button>\n          <button data-n=\"Sit-ups\" data-d=\"45\">Sit-ups</button>\n        </div>\n      </div>\n\n      <p class=\"cap\" style=\"margin-top:20px\">Routine</p>\n      <div id=\"wkList\"></div>\n      <div class=\"tot\"><span>Total time</span><b id=\"wkTotal\">0:00</b></div>\n\n      <button class=\"btn wide\" id=\"wkRun\">Start workout</button>\n      <div class=\"btns\" style=\"margin-top:10px\">\n        <button class=\"btn ghost\" id=\"wkSave\">Save routine</button>\n        <button class=\"btn ghost\" id=\"wkLoad\">Load routine</button>\n        <button class=\"btn ghost\" id=\"wkClear\">Clear</button>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"run\" id=\"wkRunner\">\n    <button class=\"mute\" id=\"wkMute\">🔊 Voice on</button>\n    <div class=\"step\" id=\"wkStep\"></div>\n    <div class=\"nm\" id=\"wkNow\"></div>\n    <div class=\"next\" id=\"wkNext\"></div>\n    <div class=\"ringwrap\">\n      <svg viewBox=\"0 0 230 230\"><circle class=\"bg\" cx=\"115\" cy=\"115\" r=\"103\"/><circle class=\"fg\" id=\"wkRing\" cx=\"115\" cy=\"115\" r=\"103\"/></svg>\n      <div class=\"time\" id=\"wkTime\">0</div>\n    </div>\n    <div class=\"ctrls\">\n      <button id=\"wkPrev\">Prev</button>\n      <button class=\"go\" id=\"wkPause\">Pause</button>\n      <button id=\"wkSkip\">Skip</button>\n      <button class=\"end\" id=\"wkStop\">End</button>\n    </div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst KEY = 'workout.routine.v1', SAVED = 'workout.saved.v1';\nlet plan = [];\nlet voiceOn = localStorage.getItem('workout.voice') !== 'off';\ntry { plan = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}\n\nconst fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nconst save = () => localStorage.setItem(KEY, JSON.stringify(plan));\n\n/* ---------- speech ---------- */\nlet voice = null;\nfunction pickVoice(){\n  if (typeof speechSynthesis === 'undefined') return;\n  const vs = speechSynthesis.getVoices();\n  voice = vs.find(v => /en-GB/i.test(v.lang) && !/google/i.test(v.name))\n       || vs.find(v => /en/i.test(v.lang)) || vs[0] || null;\n}\npickVoice();\nif (typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = pickVoice;\nfunction say(text, force){\n  if ((!voiceOn && !force) || typeof speechSynthesis === 'undefined') return;\n  try {\n    const u = new SpeechSynthesisUtterance(text);\n    if (voice) u.voice = voice;\n    u.rate = 1.02; u.pitch = 1;\n    speechSynthesis.speak(u);\n  } catch {}\n}\nfunction beep(freq, ms){\n  try {\n    const C = window.AudioContext || window.webkitAudioContext;\n    if (!C) return;\n    audioCtx = audioCtx || new C();\n    const o = audioCtx.createOscillator(), g = audioCtx.createGain();\n    o.frequency.value = freq; o.type = 'sine';\n    g.gain.setValueAtTime(.18, audioCtx.currentTime);\n    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + ms / 1000);\n    o.connect(g); g.connect(audioCtx.destination);\n    o.start(); o.stop(audioCtx.currentTime + ms / 1000);\n  } catch {}\n}\nlet audioCtx = null;\n\n/* ---------- list ---------- */\nfunction render(){\n  const box = $('wkList');\n  if (!plan.length){\n    box.innerHTML = '<div class=\"empty\">No exercises yet.<br>Add one above or tap a suggestion.</div>';\n  } else {\n    box.innerHTML = plan.map((e, i) =>\n      '<div class=\"ex' + (e.rest ? ' rest' : '') + '\" draggable=\"true\" data-i=\"' + i + '\">' +\n        '<span class=\"grip\">&#8942;&#8942;</span>' +\n        '<span class=\"nm\">' + esc(e.name) + '</span>' +\n        '<span class=\"du\">' + fmt(e.dur) + '</span>' +\n        '<button class=\"x\" title=\"Remove\">&times;</button>' +\n      '</div>').join('');\n    box.querySelectorAll('.ex').forEach(el => {\n      const i = +el.dataset.i;\n      el.querySelector('.x').onclick = ev => { ev.stopPropagation(); plan.splice(i, 1); save(); render(); };\n      el.querySelector('.nm').onclick = async () => {\n        const n = await ask('Rename', 'Exercise name', plan[i].name);\n        if (n && n.trim()){ plan[i].name = n.trim(); save(); render(); }\n      };\n      el.querySelector('.du').onclick = async () => {\n        const d = await ask('Duration', 'Seconds', String(plan[i].dur));\n        const v = parseInt(d, 10);\n        if (v > 0){ plan[i].dur = Math.min(v, 3600); save(); render(); }\n      };\n      el.addEventListener('dragstart', e => { drag = i; el.style.opacity = '.4'; });\n      el.addEventListener('dragend', () => { el.style.opacity = ''; });\n      el.addEventListener('dragover', e => e.preventDefault());\n      el.addEventListener('drop', e => {\n        e.preventDefault();\n        if (drag === null || drag === i) return;\n        const [m] = plan.splice(drag, 1);\n        plan.splice(i, 0, m); drag = null; save(); render();\n      });\n    });\n  }\n  $('wkTotal').textContent = fmt(plan.reduce((n, e) => n + e.dur, 0));\n  $('wkRun').disabled = !plan.length;\n}\nlet drag = null;\n\nfunction add(name, dur, rest){\n  plan.push({ name, dur: Math.max(5, Math.min(dur, 3600)), rest: !!rest });\n  save(); render();\n}\n$('wkAdd').onclick = () => {\n  const n = $('wkName').value.trim();\n  const d = parseInt($('wkDur').value, 10) || 45;\n  if (!n) return toast('Give the exercise a name');\n  add(n, d, false);\n  $('wkName').value = ''; $('wkName').focus();\n};\n$('wkName').addEventListener('keydown', e => { if (e.key === 'Enter') $('wkAdd').click(); });\n$('wkRest').onclick = () => add('Rest', parseInt($('wkDur').value, 10) || 20, true);\n$('wkPresets').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  add(b.dataset.n, +b.dataset.d, false);\n};\n$('wkClear').onclick = async () => {\n  if (!plan.length) return;\n  if (!await confirmDlg('Clear the routine?', 'All exercises in the current routine are removed.', 'Clear')) return;\n  plan = []; save(); render();\n};\n$('wkSave').onclick = async () => {\n  if (!plan.length) return toast('Nothing to save');\n  const name = await ask('Save routine', 'Give this routine a name', '');\n  if (!name) return;\n  let all = {};\n  try { all = JSON.parse(localStorage.getItem(SAVED)) || {}; } catch {}\n  all[name] = plan;\n  localStorage.setItem(SAVED, JSON.stringify(all));\n  toast('Routine saved');\n};\n$('wkLoad').onclick = async () => {\n  let all = {};\n  try { all = JSON.parse(localStorage.getItem(SAVED)) || {}; } catch {}\n  const names = Object.keys(all);\n  if (!names.length) return toast('No saved routines yet');\n  const pick = await choose('Load routine', names);\n  if (!pick) return;\n  plan = JSON.parse(JSON.stringify(all[pick]));\n  save(); render(); toast('Loaded \"' + pick + '\"');\n};\n\n/* ---------- runner ---------- */\nlet idx = 0, left = 0, timer = null, paused = false;\nconst R = 103, CIRC = 2 * Math.PI * R;\n\nfunction startRun(){\n  if (!plan.length) return;\n  idx = 0; paused = false;\n  $('wkRunner').classList.add('on');\n  $('wkRing').style.strokeDasharray = CIRC;\n  try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch {}\n  say('Starting workout. First up, ' + plan[0].name, true);\n  beginStep();\n  clearInterval(timer);\n  timer = setInterval(tick, 1000);\n}\nfunction beginStep(){\n  const e = plan[idx];\n  left = e.dur;\n  $('wkRunner').classList.toggle('rest', !!e.rest);\n  $('wkStep').textContent = 'Exercise ' + (idx + 1) + ' of ' + plan.length;\n  $('wkNow').textContent = e.name;\n  $('wkNext').textContent = plan[idx + 1] ? 'Next: ' + plan[idx + 1].name : 'Last one \\u2014 finish strong';\n  $('wkRing').style.stroke = e.rest ? '#5AA9FF' : '#4BD08B';\n  paint();\n}\nfunction paint(){\n  const e = plan[idx];\n  $('wkTime').textContent = left;\n  $('wkRing').style.strokeDashoffset = CIRC * (1 - left / e.dur);\n  if (left <= 3 && left > 0) $('wkRing').style.stroke = '#E5484D';\n}\nfunction tick(){\n  if (paused) return;\n  const e = plan[idx];\n  left--;\n  if (left === Math.floor(e.dur / 2) && e.dur >= 30 && !e.rest) say('Halfway');\n  if (left === 10 && e.dur > 20) say('Ten seconds');\n  if (left <= 3 && left > 0) beep(760, 110);\n  if (left <= 0){\n    beep(1040, 260);\n    if (idx + 1 < plan.length){\n      idx++;\n      const n = plan[idx];\n      say(n.rest ? 'Rest' : 'Next, ' + n.name);\n      beginStep();\n    } else {\n      finish();\n      return;\n    }\n  }\n  paint();\n}\nfunction finish(){\n  clearInterval(timer); timer = null;\n  say('Workout complete. Well done.', true);\n  $('wkNow').innerHTML = '<span class=\"done\">Workout complete 🎉</span>';\n  $('wkStep').textContent = 'Finished';\n  $('wkNext').textContent = fmt(plan.reduce((n, e) => n + e.dur, 0)) + ' of work done';\n  $('wkTime').textContent = '\\u2713';\n  $('wkRing').style.strokeDashoffset = 0;\n  $('wkRing').style.stroke = '#4BD08B';\n}\nfunction stopRun(){\n  clearInterval(timer); timer = null;\n  try { speechSynthesis.cancel(); } catch {}\n  $('wkRunner').classList.remove('on');\n}\n$('wkRun').onclick = startRun;\n$('wkStop').onclick = stopRun;\n$('wkPause').onclick = () => {\n  paused = !paused;\n  $('wkPause').textContent = paused ? 'Resume' : 'Pause';\n  if (paused){ try { speechSynthesis.cancel(); } catch {} say('Paused', true); }\n};\n$('wkSkip').onclick = () => {\n  if (idx + 1 < plan.length){ idx++; say(plan[idx].rest ? 'Rest' : plan[idx].name); beginStep(); }\n  else finish();\n};\n$('wkPrev').onclick = () => {\n  if (!timer){ startRun(); return; }\n  if (left < plan[idx].dur - 2) beginStep();\n  else if (idx > 0){ idx--; say(plan[idx].name); beginStep(); }\n};\n$('wkMute').onclick = () => {\n  voiceOn = !voiceOn;\n  localStorage.setItem('workout.voice', voiceOn ? 'on' : 'off');\n  $('wkMute').textContent = voiceOn ? '🔊 Voice on' : '🔇 Voice off';\n  if (!voiceOn) try { speechSynthesis.cancel(); } catch {}\n};\n$('wkMute').textContent = voiceOn ? '🔊 Voice on' : '🔇 Voice off';\n\nrender();\nonToolExit(() => { clearInterval(timer); try { speechSynthesis.cancel(); } catch {} });"

      "html": "<div id=\"dc\">\n<style>\n  #dc{position:absolute;inset:0;background:#F2F2F7;overflow-y:auto;padding:24px 18px calc(40px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #dc .wrap{width:100%;max-width:520px}\n  #dc h2{margin:0 0 16px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #dc .tabs{display:flex;gap:6px;padding:3px;background:rgba(120,120,128,.12);border-radius:12px;margin-bottom:18px}\n  #dc .tabs button{flex:1;padding:9px;border:0;border-radius:9px;background:none;font-size:13.5px;font-weight:560;color:#6E6E76;cursor:pointer}\n  #dc .tabs button.on{background:#fff;color:#111114;box-shadow:0 1px 3px rgba(0,0,0,.1)}\n  #dc .pane{display:none} #dc .pane.on{display:block}\n  #dc .stage{background:#111114;border-radius:20px;padding:34px 22px;text-align:center;margin-bottom:16px;min-height:172px;display:flex;flex-direction:column;align-items:center;justify-content:center}\n  #dc .stage .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:12px}\n  #dc .stage .res{font-size:31px;font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1.25;word-break:break-word}\n  #dc .stage .res.spin{opacity:.4;filter:blur(1px)}\n  #dc .stage .sub{font-size:13px;color:rgba(255,255,255,.5);margin-top:10px}\n  #dc .go{width:100%;height:54px;border:0;border-radius:16px;background:#0A84FF;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:transform .15s}\n  #dc .go:active{transform:scale(.98)}\n  #dc .card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #dc .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:0 0 12px}\n  #dc .row{display:flex;gap:8px;margin-bottom:10px}\n  #dc input{flex:1;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:16px}\n  #dc input:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #dc .btn{padding:11px 15px;border:0;border-radius:12px;background:#0A84FF;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}\n  #dc .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #dc .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}\n  #dc .opt{display:flex;align-items:center;gap:10px;padding:11px 13px;background:#F7F7FA;border-radius:11px;margin-bottom:7px}\n  #dc .opt .n{flex:1;font-size:15px}\n  #dc .opt .w{flex:0 0 62px}\n  #dc .opt .w input{width:100%;padding:6px 8px;font-size:13px;text-align:center;border-radius:8px}\n  #dc .opt .x{border:0;background:none;color:#C3C3C9;font-size:19px;cursor:pointer;padding:0 2px}\n  #dc .opt .x:hover{color:#E5484D}\n  #dc .empty{text-align:center;color:#A6A6AE;font-size:14px;padding:22px 10px;line-height:1.6}\n  #dc .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}\n  #dc .presets button{padding:6px 12px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:12.5px;cursor:pointer;color:#6E6E76}\n  #dc .presets button:hover{border-color:#0A84FF;color:#0A84FF}\n  #dc .hist{margin-top:14px}\n  #dc .hist .h{display:flex;justify-content:space-between;padding:8px 12px;background:#fff;border-radius:10px;margin-bottom:5px;font-size:13px}\n  #dc .hist .h span:last-child{color:#A6A6AE;font-size:11.5px}\n  #dc .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n  #dc label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:0 0 6px}\n</style>\n  <div class=\"wrap\">\n    <h2>Decision Maker</h2>\n    <div class=\"tabs\" id=\"dcTabs\">\n      <button data-p=\"list\" class=\"on\">Pick one</button>\n      <button data-p=\"coin\">Coin</button>\n      <button data-p=\"num\">Number</button>\n      <button data-p=\"dice\">Dice</button>\n    </div>\n\n    <div class=\"stage\">\n      <div class=\"lbl\" id=\"dcLbl\">Result</div>\n      <div class=\"res\" id=\"dcRes\">—</div>\n      <div class=\"sub\" id=\"dcSub\"></div>\n    </div>\n    <button class=\"go\" id=\"dcGo\">Decide</button>\n\n    <div class=\"pane on\" id=\"dcList\">\n      <div class=\"card\">\n        <p class=\"cap\">Options</p>\n        <div class=\"row\"><input id=\"dcNew\" placeholder=\"Add an option…\"><button class=\"btn\" id=\"dcAdd\">Add</button></div>\n        <div id=\"dcOpts\"></div>\n        <div class=\"presets\" id=\"dcPresets\">\n          <button data-l=\"Pizza,Curry,Chinese,Thai,Burgers,Fish &amp; chips\">Takeaway</button>\n          <button data-l=\"Yes,No\">Yes / No</button>\n          <button data-l=\"Yes,No,Ask again later\">Magic 8</button>\n        </div>\n        <div style=\"display:flex;gap:8px;margin-top:12px\">\n          <button class=\"btn ghost sm\" id=\"dcClear\">Clear all</button>\n          <button class=\"btn ghost sm\" id=\"dcWeights\">Toggle weights</button>\n          <button class=\"btn ghost sm\" id=\"dcRemove\">Remove after pick</button>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"pane\" id=\"dcNum\">\n      <div class=\"card\"><p class=\"cap\">Range</p>\n        <div class=\"r2\">\n          <div><label for=\"dcMin\">From</label><input id=\"dcMin\" type=\"number\" value=\"1\" inputmode=\"numeric\"></div>\n          <div><label for=\"dcMax\">To</label><input id=\"dcMax\" type=\"number\" value=\"100\" inputmode=\"numeric\"></div>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"pane\" id=\"dcDice\">\n      <div class=\"card\"><p class=\"cap\">Dice</p>\n        <div class=\"r2\">\n          <div><label for=\"dcCount\">How many</label><input id=\"dcCount\" type=\"number\" value=\"2\" min=\"1\" max=\"12\" inputmode=\"numeric\"></div>\n          <div><label for=\"dcSides\">Sides</label><input id=\"dcSides\" type=\"number\" value=\"6\" min=\"2\" max=\"100\" inputmode=\"numeric\"></div>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"hist\" id=\"dcHist\"></div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst KEY = 'decide.options.v1';\nlet opts = [], mode = 'list', showW = false, removeAfter = false, hist = [], busy = false;\ntry { opts = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}\nif (!opts.length) opts = [{ n:'Pizza', w:1 }, { n:'Curry', w:1 }, { n:'Chinese', w:1 }];\nconst save = () => localStorage.setItem(KEY, JSON.stringify(opts));\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nconst rand = n => { const b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] % n; };\n\nfunction renderOpts(){\n  $('dcOpts').innerHTML = opts.length ? opts.map((o, i) =>\n    '<div class=\"opt\"><span class=\"n\">' + esc(o.n) + '</span>' +\n    (showW ? '<span class=\"w\"><input type=\"number\" min=\"1\" max=\"99\" value=\"' + o.w + '\" data-w=\"' + i + '\"></span>' : '') +\n    '<button class=\"x\" data-x=\"' + i + '\">&times;</button></div>').join('')\n    : '<div class=\"empty\">No options yet.<br>Add a few above.</div>';\n  $('dcOpts').querySelectorAll('[data-x]').forEach(b => b.onclick = () => { opts.splice(+b.dataset.x, 1); save(); renderOpts(); });\n  $('dcOpts').querySelectorAll('[data-w]').forEach(el => el.oninput = () => { opts[+el.dataset.w].w = Math.max(1, +el.value || 1); save(); });\n}\nfunction addOpt(n){\n  n = n.trim(); if (!n) return;\n  if (opts.some(o => o.n.toLowerCase() === n.toLowerCase())) return toast('Already on the list');\n  opts.push({ n, w:1 }); save(); renderOpts();\n}\n$('dcAdd').onclick = () => { addOpt($('dcNew').value); $('dcNew').value = ''; $('dcNew').focus(); };\n$('dcNew').addEventListener('keydown', e => { if (e.key === 'Enter') $('dcAdd').click(); });\n$('dcClear').onclick = async () => {\n  if (!opts.length) return;\n  if (!await confirmDlg('Clear all options?', 'The list is emptied.', 'Clear')) return;\n  opts = []; save(); renderOpts();\n};\n$('dcWeights').onclick = () => { showW = !showW; renderOpts(); };\n$('dcRemove').onclick = () => {\n  removeAfter = !removeAfter;\n  $('dcRemove').textContent = removeAfter ? '✓ Remove after pick' : 'Remove after pick';\n};\n$('dcPresets').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  b.dataset.l.split(',').forEach(n => { if (!opts.some(o => o.n === n)) opts.push({ n, w:1 }); });\n  save(); renderOpts();\n};\n\n$('dcTabs').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  mode = b.dataset.p;\n  $('dcTabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));\n  ['list','num','dice'].forEach(p => {\n    const el = $('dc' + p[0].toUpperCase() + p.slice(1));\n    if (el) el.classList.toggle('on', mode === p);\n  });\n  $('dcRes').textContent = '—'; $('dcSub').textContent = '';\n  $('dcLbl').textContent = { list:'Result', coin:'Coin flip', num:'Random number', dice:'Dice roll' }[mode];\n};\n\nfunction weightedPick(){\n  const total = opts.reduce((n, o) => n + (o.w || 1), 0);\n  let r = rand(total * 100) / 100;\n  for (const o of opts){ r -= (o.w || 1); if (r <= 0) return o; }\n  return opts[opts.length - 1];\n}\n\nasync function decide(){\n  if (busy) return;\n  busy = true;\n  const res = $('dcRes'), sub = $('dcSub');\n  sub.textContent = '';\n\n  let final = '', detail = '';\n  if (mode === 'list'){\n    if (!opts.length){ busy = false; return toast('Add some options first'); }\n    const pick = weightedPick();\n    final = pick.n;\n    const total = opts.reduce((n, o) => n + (o.w || 1), 0);\n    detail = opts.length + ' options · ' + Math.round((pick.w || 1) / total * 100) + '% chance';\n  } else if (mode === 'coin'){\n    final = rand(2) ? 'Heads' : 'Tails';\n  } else if (mode === 'num'){\n    const a = parseInt($('dcMin').value, 10) || 0, b = parseInt($('dcMax').value, 10) || 100;\n    const lo = Math.min(a, b), hi = Math.max(a, b);\n    final = String(lo + rand(hi - lo + 1));\n    detail = 'between ' + lo + ' and ' + hi;\n  } else {\n    const c = Math.max(1, Math.min(12, parseInt($('dcCount').value, 10) || 2));\n    const s = Math.max(2, Math.min(100, parseInt($('dcSides').value, 10) || 6));\n    const rolls = Array.from({ length:c }, () => 1 + rand(s));\n    final = String(rolls.reduce((a, b) => a + b, 0));\n    detail = c + 'd' + s + ' · ' + rolls.join(' + ');\n  }\n\n  // short shuffle animation before settling\n  res.classList.add('spin');\n  const pool = mode === 'list' ? opts.map(o => o.n)\n    : mode === 'coin' ? ['Heads','Tails']\n    : [final, String(rand(99) + 1), String(rand(99) + 1)];\n  for (let i = 0; i < 11; i++){\n    res.textContent = pool[rand(pool.length)];\n    await new Promise(r => setTimeout(r, 45 + i * 11));\n  }\n  res.classList.remove('spin');\n  res.textContent = final;\n  $('dcSub').textContent = detail;\n\n  hist.unshift({ v:final, t:Date.now() });\n  hist = hist.slice(0, 5);\n  $('dcHist').innerHTML = hist.map(h =>\n    '<div class=\"h\"><span>' + esc(h.v) + '</span><span>' +\n    new Date(h.t).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) + '</span></div>').join('');\n\n  if (mode === 'list' && removeAfter){\n    opts = opts.filter(o => o.n !== final);\n    save(); renderOpts();\n  }\n  busy = false;\n}\n$('dcGo').onclick = decide;\n\nrenderOpts();"

      "html": "<div id=\"et\">\n<style>\n  #et{position:absolute;inset:0;display:flex;background:#F2F2F7;overflow:hidden;\n      font-family:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif}\n  #et button{font:inherit;color:inherit}\n\n  /* --- sidebar --- */\n  #et-side{\n    flex:0 0 272px;display:flex;flex-direction:column;background:#fff;\n    border-right:1px solid rgba(60,60,67,.1);z-index:4\n  }\n  #et-sidehead{\n    display:flex;align-items:center;justify-content:space-between;gap:8px;\n    padding:12px 10px 10px 16px;border-bottom:1px solid rgba(60,60,67,.08)\n  }\n  #et-sidehead span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A6A6AE}\n  #et-sidehead button{width:28px;height:28px;border:0;border-radius:8px;background:rgba(120,120,128,.12);font-size:17px;line-height:1;cursor:pointer;color:#0A84FF}\n  #et-sidehead button:active{transform:scale(.9)}\n  #et-list{flex:1;overflow-y:auto;padding:8px}\n  #et-hint{margin:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));font-size:11.5px;line-height:1.4;color:#A6A6AE;border-top:1px solid rgba(60,60,67,.08)}\n  .et-cat{\n    display:flex;align-items:center;gap:6px;width:100%;padding:7px 8px;margin-top:2px;\n    border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;\n    font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8E8E96\n  }\n  .et-cat:hover{background:rgba(120,120,128,.09)}\n  .et-cat .chev{display:inline-block;font-size:9px;transition:transform .18s;color:#B8B8BE}\n  .et-cat.closed .chev{transform:rotate(-90deg)}\n  .et-cat .n{margin-left:auto;font-weight:600;letter-spacing:0;color:#C3C3C9}\n  .et-tool{\n    display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;\n    border:0;background:none;border-radius:9px;cursor:pointer;text-align:left;\n    font-size:14px;letter-spacing:-.01em;color:#111114\n  }\n  .et-tool img{width:22px;height:22px;border-radius:6px;object-fit:cover;flex:0 0 auto;background:#F2F2F7}\n  .et-tool .fallback{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:#F2F2F7;font-size:12px;flex:0 0 auto}\n  .et-tool span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .et-tool:hover{background:rgba(120,120,128,.09)}\n  .et-tool.sel{background:#0A84FF;color:#fff}\n  .et-tool.sel .fallback{background:rgba(255,255,255,.22)}\n\n  /* --- main --- */\n  #et-main{flex:1;display:flex;flex-direction:column;min-width:0}\n  #et-bar{\n    flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;\n    background:#fff;border-bottom:1px solid rgba(60,60,67,.1)\n  }\n  #et-burger{display:none;width:32px;height:32px;border:0;border-radius:9px;background:rgba(120,120,128,.12);cursor:pointer}\n  #et-name{font-size:14.5px;font-weight:640;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}\n  #et-seg{display:flex;gap:2px;padding:2px;border-radius:10px;background:rgba(120,120,128,.12);flex:0 0 auto}\n  #et-seg button{padding:5px 13px;border:0;border-radius:8px;background:none;font-size:13px;font-weight:560;color:#6E6E76;cursor:pointer;transition:.15s}\n  #et-seg button.on{background:#fff;color:#111114;box-shadow:0 1px 3px rgba(0,0,0,.1)}\n  #et-prevbtn{\n    flex:0 0 auto;padding:6px 13px;border:1px solid rgba(60,60,67,.16);border-radius:10px;\n    background:#fff;font-size:13px;font-weight:560;cursor:pointer;color:#6E6E76\n  }\n  #et-prevbtn.on{background:#0A84FF;border-color:#0A84FF;color:#fff}\n  #et-saved{flex:0 0 auto;font-size:12px;color:#A6A6AE;min-width:52px;text-align:right;transition:color .2s}\n  #et-saved.busy{color:#F5A524}\n\n  #et-panes{flex:1;display:flex;min-height:0}\n  #et-editwrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}\n  #et-ta{\n    flex:1;width:100%;padding:16px 18px;border:0;background:#fff;resize:none;outline:none;\n    font-family:ui-monospace,SFMono-Regular,\"SF Mono\",Menlo,Consolas,\"Liberation Mono\",monospace;\n    font-size:13px;line-height:1.65;color:#1A1A1F;tab-size:4;white-space:pre;overflow:auto;\n    -webkit-text-size-adjust:100%\n  }\n  #et-foot{\n    flex:0 0 auto;display:flex;gap:14px;padding:6px 18px;background:#FAFAFC;\n    border-top:1px solid rgba(60,60,67,.08);font-size:11.5px;color:#A6A6AE;\n    font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\n  }\n  #et-previewwrap{flex:1;display:none;flex-direction:column;min-width:0;min-height:0;border-left:1px solid rgba(60,60,67,.1);background:#fff}\n  #et.preview #et-previewwrap{display:flex}\n  #et-prevhead{\n    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;\n    padding:7px 14px;background:#FAFAFC;border-bottom:1px solid rgba(60,60,67,.08);\n    font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE\n  }\n  #et-prevhead button{border:0;background:none;color:#0A84FF;font-size:12px;cursor:pointer;letter-spacing:0;text-transform:none;font-weight:560}\n  #et-frame{flex:1;width:100%;border:0;background:#fff}\n\n  #et-scrim{display:none;position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:3}\n  #et-empty{flex:1;display:grid;place-items:center;padding:40px;text-align:center;color:#A6A6AE;font-size:14.5px}\n\n  @media (max-width:860px){\n    #et-side{position:absolute;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .26s cubic-bezier(.32,.72,0,1);box-shadow:0 0 40px rgba(0,0,0,.16);flex-basis:80%;max-width:300px}\n    #et.drawer #et-side{transform:none}\n    #et.drawer #et-scrim{display:block}\n    #et-burger{display:block}\n    #et-panes{flex-direction:column}\n    #et-previewwrap{border-left:0;border-top:1px solid rgba(60,60,67,.1)}\n    #et-ta{font-size:16px;line-height:1.55}\n    #et-name{font-size:13.5px}\n    #et-seg button{padding:5px 10px}\n  }\n</style>\n  <aside id=\"et-side\">\n    <div id=\"et-sidehead\"><span>Library</span><button id=\"et-addcat\" title=\"New subcategory\">+</button></div>\n    <div id=\"et-list\"></div>\n    <p id=\"et-hint\">Right-click or long-press any item for options.</p>\n  </aside>\n  <div id=\"et-scrim\"></div>\n  <section id=\"et-main\">\n    <div id=\"et-bar\">\n      <button id=\"et-burger\" aria-label=\"Show library\">&#9776;</button>\n      <div id=\"et-name\">Select a tool</div>\n      <div id=\"et-seg\"><button data-mode=\"html\" class=\"on\">HTML</button><button data-mode=\"js\">JavaScript</button></div>\n      <button id=\"et-prevbtn\">Preview</button>\n      <span id=\"et-saved\"></span>\n    </div>\n    <div id=\"et-panes\">\n      <div id=\"et-editwrap\">\n        <textarea id=\"et-ta\" spellcheck=\"false\" autocapitalize=\"off\" autocorrect=\"off\" placeholder=\"Select a tool from the library to edit its source.\"></textarea>\n        <div id=\"et-foot\"><span id=\"et-pos\">Ln 1, Col 1</span><span id=\"et-lines\">0 lines</span><span id=\"et-chars\">0 chars</span></div>\n      </div>\n      <div id=\"et-previewwrap\">\n        <div id=\"et-prevhead\"><span>Live preview</span><button id=\"et-reload\">Reload</button></div>\n        <iframe id=\"et-frame\" title=\"Live preview\"></iframe>\n      </div>\n    </div>\n  </section>\n</div>",
      "js": "const et      = document.getElementById('et');\nconst list    = document.getElementById('et-list');\nconst ta      = document.getElementById('et-ta');\nconst frame   = document.getElementById('et-frame');\nconst savedEl = document.getElementById('et-saved');\nconst S = { cat:null, name:null, mode:'html', closed:new Set() };\nlet saveTimer, prevTimer;\n\n/* ---------- object helpers: order matters, so keys are rebuilt ---------- */\nfunction moveKey(obj, key, dir){\n  const keys = Object.keys(obj), i = keys.indexOf(key), j = i + dir;\n  if (i < 0 || j < 0 || j >= keys.length) return obj;\n  keys.splice(j, 0, keys.splice(i, 1)[0]);\n  const out = {}; keys.forEach(k => out[k] = obj[k]); return out;\n}\nfunction renameKey(obj, oldK, newK){\n  const out = {}; for (const k in obj) out[k === oldK ? newK : k] = obj[k]; return out;\n}\nfunction commit(){ saveTools(); renderList(); }\n\n/* ---------- sidebar ---------- */\nfunction renderList(){\n  list.innerHTML = '';\n  for (const cat of Object.keys(tools)){\n    const head = document.createElement('button');\n    head.className = 'et-cat' + (S.closed.has(cat) ? ' closed' : '');\n    head.dataset.cat = cat;\n    head.innerHTML = '<span class=\"chev\">&#9660;</span>' + escapeHtml(cat) +\n                     '<span class=\"n\">' + Object.keys(tools[cat]).length + '</span>';\n    head.onclick = () => { S.closed.has(cat) ? S.closed.delete(cat) : S.closed.add(cat); renderList(); };\n    bindMenu(head, () => catMenu(cat));\n    list.appendChild(head);\n    if (S.closed.has(cat)) continue;\n\n    for (const name of Object.keys(tools[cat])){\n      const b = document.createElement('button');\n      b.className = 'et-tool' + (cat === S.cat && name === S.name ? ' sel' : '');\n      b.innerHTML = iconMarkup(tools[cat][name].icon, 'fallback') + '<span>' + escapeHtml(name) + '</span>';\n      b.onclick = () => { select(cat, name); et.classList.remove('drawer'); };\n      bindMenu(b, () => toolMenu(cat, name));\n      list.appendChild(b);\n    }\n  }\n  if (!Object.keys(tools).length){\n    list.innerHTML = '<p style=\"padding:20px;color:#A6A6AE;font-size:13px\">No subcategories yet. Use + to add one.</p>';\n  }\n}\n\n/* Right-click on desktop, long-press on touch, both open the same menu. */\nfunction bindMenu(el, build){\n  let timer, sx, sy, justOpened = false;\n  const open = (x, y) => { justOpened = true; showMenu(x, y, build()); };\n\n  el.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); open(e.clientX, e.clientY); };\n  el.addEventListener('touchstart', e => {\n    e.stopPropagation();\n    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;\n    timer = setTimeout(() => { timer = null; open(sx, sy); }, 480);\n  }, { passive:true });\n  el.addEventListener('touchmove', e => {\n    const t = e.touches[0];\n    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) clearTimeout(timer);\n  }, { passive:true });\n  el.addEventListener('touchend', () => clearTimeout(timer));\n  // a long press must not also count as a tap\n  el.addEventListener('click', e => {\n    if (!justOpened) return;\n    justOpened = false; e.preventDefault(); e.stopImmediatePropagation();\n  }, true);\n}\n\n/* ---------- editing ---------- */\nfunction select(cat, name){\n  S.cat = cat; S.name = name;\n  document.getElementById('et-name').textContent = cat + '  \\u203A  ' + name;\n  ta.value = tools[cat][name][S.mode] || '';\n  renderList(); updateFoot(); refreshPreview();\n}\nfunction setMode(mode){\n  S.mode = mode;\n  document.querySelectorAll('#et-seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));\n  if (S.cat) ta.value = tools[S.cat][S.name][mode] || '';\n  updateFoot();\n}\ndocument.getElementById('et-seg').onclick = e => {\n  const b = e.target.closest('button'); if (b) setMode(b.dataset.mode);\n};\n\nta.addEventListener('input', () => {\n  if (!S.cat) return;\n  tools[S.cat][S.name][S.mode] = ta.value;   // the object updates on every keystroke\n  savedEl.textContent = 'Saving\\u2026'; savedEl.classList.add('busy');\n  clearTimeout(saveTimer);\n  saveTimer = setTimeout(() => {\n    saveTools();\n    savedEl.textContent = 'Saved'; savedEl.classList.remove('busy');\n  }, 260);\n  updateFoot(); refreshPreview();\n});\nta.addEventListener('keyup', updateFoot);\nta.addEventListener('click', updateFoot);\n\n/* Tab inserts four spaces; Shift+Tab removes them. Selections indent line by line. */\nta.addEventListener('keydown', e => {\n  if (e.key !== 'Tab') return;\n  e.preventDefault();\n  const v = ta.value, s = ta.selectionStart, t = ta.selectionEnd;\n  const lineStart = v.lastIndexOf('\\n', s - 1) + 1;\n\n  if (s === t && !e.shiftKey){\n    ta.value = v.slice(0, s) + '    ' + v.slice(t);\n    ta.selectionStart = ta.selectionEnd = s + 4;\n  } else {\n    const lineEnd = v.indexOf('\\n', t) === -1 ? v.length : v.indexOf('\\n', t);\n    const block = v.slice(lineStart, lineEnd);\n    let removedFirst = 0, delta = 0;\n    const lines = block.split('\\n').map((ln, i) => {\n      if (e.shiftKey){\n        const cut = ln.match(/^ {1,4}/);\n        const n = cut ? cut[0].length : 0;\n        if (i === 0) removedFirst = n;\n        delta -= n;\n        return ln.slice(n);\n      }\n      if (i === 0) removedFirst = -4;\n      delta += 4;\n      return '    ' + ln;\n    });\n    ta.value = v.slice(0, lineStart) + lines.join('\\n') + v.slice(lineEnd);\n    ta.selectionStart = Math.max(lineStart, s - removedFirst);\n    ta.selectionEnd = t + delta;\n  }\n  ta.dispatchEvent(new Event('input'));\n});\n\nfunction updateFoot(){\n  const upto = ta.value.slice(0, ta.selectionStart).split('\\n');\n  document.getElementById('et-pos').textContent = 'Ln ' + upto.length + ', Col ' + (upto[upto.length - 1].length + 1);\n  document.getElementById('et-lines').textContent = ta.value.split('\\n').length + ' lines';\n  document.getElementById('et-chars').textContent = ta.value.length + ' chars';\n}\n\n/* ---------- live preview ---------- */\ndocument.getElementById('et-prevbtn').onclick = e => {\n  et.classList.toggle('preview');\n  e.currentTarget.classList.toggle('on', et.classList.contains('preview'));\n  refreshPreview(true);\n};\ndocument.getElementById('et-reload').onclick = () => refreshPreview(true);\n\nfunction refreshPreview(now){\n  if (!et.classList.contains('preview') || !S.cat) return;\n  clearTimeout(prevTimer);\n  prevTimer = setTimeout(() => {\n    const t = tools[S.cat][S.name];\n    const open = '<scr' + 'ipt>', close = '</scr' + 'ipt>';\n    frame.srcdoc =\n      '<!DOCTYPE html><meta charset=\"utf-8\">' +\n      '<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">' +\n      '<style>html,body{margin:0;min-height:100%;position:relative;' +\n      'font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}</style>' +\n      t.html +\n      open + 'function toast(m){console.log(m)}function onToolExit(){}' + close +\n      open + 'try{' + t.js + '\\n}catch(e){document.body.insertAdjacentHTML(\"beforeend\",' +\n      '\"<pre style=\\\\\"margin:0;padding:12px;background:#FFF1F1;color:#8B1A1E;font:12px monospace;white-space:pre-wrap\\\\\">\"+e+\"</pre>\")}' + close;\n  }, now ? 0 : 320);\n}\n\n/* ---------- structure: tools ---------- */\nfunction toolMenu(cat, name){\n  const names = Object.keys(tools[cat]);\n  const i = names.indexOf(name);\n  return [\n    { cap:name },\n    { label:'Rename tool\\u2026', on: async () => {\n        const v = await ask('Rename tool', 'Tool name', name);\n        if (!v || v === name) return;\n        if (tools[cat][v]) return toast('That name is already used');\n        tools[cat] = renameKey(tools[cat], name, v);\n        repin(cat + '/' + name, cat + '/' + v);\n        if (S.cat === cat && S.name === name) S.name = v;\n        commit(); if (S.cat === cat) select(cat, S.name);\n      } },\n    { label:'Edit icon\\u2026', on: async () => {\n        const v = await ask('Tool icon', 'Image URL, data: URI, or a single emoji', tools[cat][name].icon, true);\n        if (v === null) return;\n        tools[cat][name].icon = v.trim(); commit();\n      } },\n    { label:'Move to subcategory\\u2026', on: async () => {\n        const target = await choose('Move \"' + name + '\" to', Object.keys(tools).filter(c => c !== cat));\n        if (!target) return;\n        if (tools[target][name]) return toast('That subcategory already has a tool with this name');\n        tools[target][name] = tools[cat][name];\n        delete tools[cat][name];\n        repin(cat + '/' + name, target + '/' + name);\n        if (S.cat === cat && S.name === name) S.cat = target;\n        commit(); if (S.name === name) select(target, name);\n      } },\n    'sep',\n    { label:'Move up', disabled:i === 0, on: () => { tools[cat] = moveKey(tools[cat], name, -1); commit(); } },\n    { label:'Move down', disabled:i === names.length - 1, on: () => { tools[cat] = moveKey(tools[cat], name, 1); commit(); } },\n    'sep',\n    { label:'New tool in \"' + cat + '\"\\u2026', on: () => newTool(cat) },\n    { label:'Delete tool', danger:true, on: async () => {\n        if (!await confirmDlg('Delete \"' + name + '\"?', 'This removes the tool and its source from the library.', 'Delete')) return;\n        delete tools[cat][name];\n        repin(cat + '/' + name, null);\n        if (S.cat === cat && S.name === name){ S.cat = S.name = null; ta.value = ''; document.getElementById('et-name').textContent = 'Select a tool'; }\n        commit(); toast('Tool deleted');\n      } }\n  ];\n}\n\nasync function newTool(cat){\n  const name = await ask('New tool', 'Tool name', '');\n  if (!name) return;\n  if (tools[cat][name]) return toast('That name is already used');\n  tools[cat][name] = {\n    icon: '\\u{1F9F0}',\n    html: '<div id=\"my-tool\">\\n    <style>\\n        #my-tool{padding:32px;text-align:center}\\n    </style>\\n    <h2>' + name + '</h2>\\n    <p id=\"my-tool-out\">Ready.</p>\\n</div>',\n    js:   '// Runs as soon as the tool opens.\\ndocument.getElementById(\"my-tool-out\").textContent = \"Hello from ' + name.replace(/\"/g,'') + '\";'\n  };\n  commit(); select(cat, name);\n}\n\n/* ---------- structure: subcategories ---------- */\nfunction catMenu(cat){\n  const cats = Object.keys(tools);\n  const i = cats.indexOf(cat);\n  return [\n    { cap:cat },\n    { label:'New tool here\\u2026', on: () => newTool(cat) },\n    { label:'Rename subcategory\\u2026', on: async () => {\n        const v = await ask('Rename subcategory', 'Subcategory name', cat);\n        if (!v || v === cat) return;\n        if (tools[v]) return toast('That subcategory already exists');\n        Object.keys(tools[cat]).forEach(n => repin(cat + '/' + n, v + '/' + n));\n        tools = renameKey(tools, cat, v);\n        if (S.cat === cat) S.cat = v;\n        commit(); if (S.cat === v) select(v, S.name);\n      } },\n    'sep',\n    { label:'Move up', disabled:i === 0, on: () => { tools = moveKey(tools, cat, -1); commit(); } },\n    { label:'Move down', disabled:i === cats.length - 1, on: () => { tools = moveKey(tools, cat, 1); commit(); } },\n    'sep',\n    { label:'New subcategory\\u2026', on: newCat },\n    { label:'Delete subcategory', danger:true, on: async () => {\n        const n = Object.keys(tools[cat]).length;\n        if (!await confirmDlg('Delete \"' + cat + '\"?', n ? 'This also deletes the ' + n + ' tool' + (n > 1 ? 's' : '') + ' inside it.' : 'The subcategory is empty.', 'Delete')) return;\n        Object.keys(tools[cat]).forEach(t => repin(cat + '/' + t, null));\n        delete tools[cat];\n        if (S.cat === cat){ S.cat = S.name = null; ta.value = ''; document.getElementById('et-name').textContent = 'Select a tool'; }\n        commit(); toast('Subcategory deleted');\n      } }\n  ];\n}\nasync function newCat(){\n  const v = await ask('New subcategory', 'Subcategory name', '');\n  if (!v) return;\n  if (tools[v]) return toast('That subcategory already exists');\n  tools[v] = {}; commit();\n}\ndocument.getElementById('et-addcat').onclick = newCat;\nbindMenu(list, () => [{ cap:'Library' }, { label:'New subcategory\\u2026', on:newCat }]);\n\n/* ---------- chrome ---------- */\ndocument.getElementById('et-burger').onclick = () => et.classList.toggle('drawer');\ndocument.getElementById('et-scrim').onclick  = () => et.classList.remove('drawer');\n\nrenderList();\nconst wanted = String(window.pendingEdit || '').split('/');\nwindow.pendingEdit = null;\nif (wanted.length === 2 && tools[wanted[0]] && tools[wanted[0]][wanted[1]]){\n  select(wanted[0], wanted[1]);\n} else {\n  const firstCat = Object.keys(tools)[0];\n  if (firstCat && Object.keys(tools[firstCat])[0]) select(firstCat, Object.keys(tools[firstCat])[0]);\n}\nsavedEl.textContent = 'Saved';"

    }

};

/* ---------- Persistence (global on purpose: any tool can call these) ---------- */
function saveTools(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ v:1, tools, pinned }));
    return true;
  } catch (e){
    toast('Could not save \u2014 storage is full or blocked');
    return false;
  }
}
function loadTools(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || typeof data.tools !== 'object') return false;
    tools  = data.tools;
    pinned = Array.isArray(data.pinned) ? data.pinned : [];
    return true;
  } catch { return false; }
}
/* The default tools live inline below as the DEFAULT_LIBRARY object.
   A deep copy is taken so editing a tool never mutates the constant. */
function defaultLibrary(){ return JSON.parse(JSON.stringify(DEFAULT_LIBRARY)); }
function resetLibrary(){
  tools = defaultLibrary();
  pinned = DEFAULT_PINNED.slice();
  saveTools(); renderHome();
}
function repin(oldKey, newKey){
  pinned = newKey === null
    ? pinned.filter(k => k !== oldKey)
    : pinned.map(k => k === oldKey ? newKey : k);
}

/* ---------- Small utilities shared with every tool ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function iconMarkup(icon, cls){
  icon = String(icon || '').trim();
  const looksLikeImage = /^(https?:\/\/|data:image|blob:|\.{0,2}\/)/i.test(icon);
  if (looksLikeImage){
    return '<img src="' + escapeHtml(icon) + '" alt="" onerror="iconFallback(this)">';
  }
  return '<span class="' + (cls || 'glyph') + '">' + escapeHtml(icon || '\u{1F9F0}') + '</span>';
}
function iconFallback(img){
  const span = document.createElement('span');
  span.className = img.closest('.et-tool') ? 'fallback' : 'glyph';
  span.textContent = '\u{1F9F0}';
  img.replaceWith(span);
}
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ---------- Context menu ---------- */
const menuEl = document.getElementById('menu');
function showMenu(x, y, items){
  menuEl.innerHTML = '';
  for (const item of items){
    if (item === 'sep'){ menuEl.insertAdjacentHTML('beforeend', '<div class="sep"></div>'); continue; }
    if (item.cap){ menuEl.insertAdjacentHTML('beforeend', '<div class="cap">' + escapeHtml(item.cap) + '</div>'); continue; }
    const b = document.createElement('button');
    b.textContent = item.label;
    if (item.danger) b.className = 'danger';
    b.disabled = !!item.disabled;
    b.onclick = () => { hideMenu(); item.on(); };
    menuEl.appendChild(b);
  }
  menuEl.hidden = false;
  const r = menuEl.getBoundingClientRect();
  menuEl.style.left = Math.max(8, Math.min(x, innerWidth  - r.width  - 8)) + 'px';
  menuEl.style.top  = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
}
function hideMenu(){ menuEl.hidden = true; }
addEventListener('pointerdown', e => { if (!menuEl.hidden && !menuEl.contains(e.target)) hideMenu(); }, true);
addEventListener('keydown', e => { if (e.key === 'Escape') hideMenu(); });
addEventListener('resize', hideMenu);

/* ---------- Dialogs (promise based, so tools can await them) ---------- */
function dialog(build){
  return new Promise(resolve => {
    const scrim = document.createElement('div'); scrim.className = 'scrim';
    const box   = document.createElement('div'); box.className = 'modal';
    let settled = false;
    const done = v => { if (settled) return; settled = true; scrim.remove(); box.remove(); removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(null); };
    build(box, done);
    scrim.onclick = () => done(null);
    addEventListener('keydown', onKey);
    document.body.append(scrim, box);
    const focusable = box.querySelector('input,textarea,button');
    if (focusable) focusable.focus();
    if (focusable && focusable.select) focusable.select();
  });
}
function ask(title, label, value, multiline){
  return dialog((box, done) => {
    box.innerHTML =
      '<h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(label) + '</p>' +
      (multiline ? '<textarea spellcheck="false"></textarea>' : '<input spellcheck="false">') +
      '<div class="acts"><button class="ghost">Cancel</button><button class="primary">Save</button></div>';
    const field = box.querySelector('input,textarea');
    field.value = value || '';
    const [cancel, ok] = box.querySelectorAll('.acts button');
    cancel.onclick = () => done(null);
    ok.onclick = () => done(field.value);
    if (!multiline) field.onkeydown = e => { if (e.key === 'Enter') done(field.value); };
  });
}
function confirmDlg(title, message, okLabel){
  return dialog((box, done) => {
    box.innerHTML =
      '<h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(message) + '</p>' +
      '<div class="acts"><button class="ghost">Cancel</button><button class="primary danger">' + escapeHtml(okLabel || 'Confirm') + '</button></div>';
    const [cancel, ok] = box.querySelectorAll('.acts button');
    cancel.onclick = () => done(false);
    ok.onclick = () => done(true);
  });
}
function choose(title, options){
  return dialog((box, done) => {
    box.innerHTML = '<h3>' + escapeHtml(title) + '</h3><div class="opts"></div>' +
                    '<div class="acts"><button class="ghost">Cancel</button></div>';
    const list = box.querySelector('.opts');
    if (!options.length) list.innerHTML = '<p style="margin:0">There is nowhere else to move it yet.</p>';
    options.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o;
      b.onclick = () => done(o);
      list.appendChild(b);
    });
    box.querySelector('.acts button').onclick = () => done(null);
  });
}

/* ---------- Home screen ---------- */
const sectionsEl = document.getElementById('sections');

function exists(key){
  const [c, n] = key.split('/');
  return tools[c] && tools[c][n];
}
function makeTile(cat, name){
  const b = document.createElement('button');
  b.className = 'tile';
  b.innerHTML = '<span class="art">' + iconMarkup(tools[cat][name].icon) +
                (pinned.includes(cat + '/' + name) ? '<span class="pin-dot"></span>' : '') +
                '</span><span class="lbl">' + escapeHtml(name) + '</span>';
  b.onclick = () => openTool(cat, name);
  bindLongPress(b, () => tileMenu(cat, name));
  return b;
}
function tileMenu(cat, name){
  const key = cat + '/' + name;
  const isPinned = pinned.includes(key);
  return [
    { cap:name },
    { label: isPinned ? 'Remove from Pinned' : 'Add to Pinned', on: () => {
        pinned = isPinned ? pinned.filter(k => k !== key) : pinned.concat(key);
        saveTools(); renderHome(); toast(isPinned ? 'Unpinned' : 'Pinned');
      } },
    { label:'Edit source\u2026', on: () => {
        const editor = findTool('Edit Tools');
        if (!editor) return toast('The Edit Tools tool is missing');
        window.pendingEdit = key;
        openTool(editor[0], editor[1]);
      } }
  ];
}
function findTool(name){
  for (const c in tools) if (tools[c][name]) return [c, name];
  return null;
}
function section(title, entries){
  const sec = document.createElement('section');
  sec.className = 'sec';
  sec.innerHTML = '<div class="sec-head"><h2>' + escapeHtml(title) + '</h2><span class="count">' + entries.length + '</span></div>';
  const row = document.createElement('div');
  row.className = 'row';
  entries.forEach(([c, n]) => row.appendChild(makeTile(c, n)));
  sec.appendChild(row);
  return sec;
}
function renderHome(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  sectionsEl.innerHTML = '';
  let shown = 0, total = 0;

  if (!q){
    const live = pinned.filter(exists).map(k => k.split('/'));
    if (live.length){ sectionsEl.appendChild(section('Pinned', live)); shown += live.length; }
  }
  for (const cat in tools){
    const names = Object.keys(tools[cat]);
    total += names.length;
    const hit = names.filter(n => !q || n.toLowerCase().includes(q) || cat.toLowerCase().includes(q));
    if (!hit.length) continue;
    sectionsEl.appendChild(section(cat, hit.map(n => [cat, n])));
    shown += hit.length;
  }
  if (!shown){
    sectionsEl.innerHTML = q
      ? '<div class="empty"><strong>No matches</strong>Nothing here is called &ldquo;' + escapeHtml(q) + '&rdquo;.</div>'
      : '<div class="empty"><strong>Your library is empty</strong>Open Edit Tools to add a subcategory and your first tool.</div>';
  }
  const cats = Object.keys(tools).length;
  document.getElementById('hdrSub').textContent =
    total + (total === 1 ? ' tool' : ' tools') + ' in ' + cats + (cats === 1 ? ' subcategory' : ' subcategories');
}

/* Right-click on desktop, long-press on touch. */
function bindLongPress(el, build){
  let timer, sx, sy, justOpened = false;
  const open = (x, y) => { justOpened = true; showMenu(x, y, build()); };

  el.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); open(e.clientX, e.clientY); };
  el.addEventListener('touchstart', e => {
    e.stopPropagation();
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    timer = setTimeout(() => { timer = null; open(sx, sy); }, 480);
  }, { passive:true });
  el.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) clearTimeout(timer);
  }, { passive:true });
  el.addEventListener('touchend', () => clearTimeout(timer));
  // a long press must not also count as a tap
  el.addEventListener('click', e => {
    if (!justOpened) return;
    justOpened = false; e.preventDefault(); e.stopImmediatePropagation();
  }, true);
}

document.getElementById('search').addEventListener('input', renderHome);
addEventListener('scroll', () => {
  document.getElementById('hdr').classList.toggle('scrolled', scrollY > 4);
}, { passive:true });

/* ---------- Running a tool ---------- */
const runner = document.getElementById('runner');
const runnerBody = document.getElementById('runnerBody');
let exitHooks = [];
let usedHistory = false;

/* Tools call this to clean up timers or listeners when the user goes back. */
function onToolExit(fn){ exitHooks.push(fn); }

function openTool(cat, name){
  const tool = tools[cat] && tools[cat][name];
  if (!tool) return toast('That tool no longer exists');

  exitHooks = [];
  runnerBody.innerHTML = tool.html;
  runnerBody.scrollTop = 0;
  document.getElementById('runtitle').textContent = name;
  runner.hidden = false;
  runner.classList.add('in');
  // Lets the hardware/browser back button leave a tool. Blocked on some file:// origins.
  usedHistory = false;
  try { history.pushState({ tool: cat + '/' + name }, ''); usedHistory = true; } catch {}

  // The tool's JS is evaluated in its own function scope so it can be re-run safely.
  try {
    new Function(tool.js)();
  } catch (err){
    runnerBody.insertAdjacentHTML('beforeend', '<div class="runerr">' + escapeHtml(name + ' failed to start\n\n' + err) + '</div>');
  }
}
function doCloseTool(){
  exitHooks.forEach(fn => { try { fn(); } catch {} });
  exitHooks = [];
  runner.hidden = true;
  runner.classList.remove('in');
  runnerBody.innerHTML = '';
  hideMenu();
  renderHome();   // the editor may have changed the library while it was open
}
function closeTool(){ usedHistory ? history.back() : doCloseTool(); }
document.getElementById('backBtn').onclick = closeTool;
addEventListener('popstate', () => { if (!runner.hidden) doCloseTool(); });
addEventListener('keydown', e => {
  if (e.key === 'Escape' && !runner.hidden && menuEl.hidden && !document.querySelector('.modal')) closeTool();
});

/* ---------- Library options ---------- */
document.getElementById('settingsBtn').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  showMenu(r.right - 214, r.bottom + 6, [
    { cap:'Library' },
    { label:'Export library\u2026', on: () => {
        const blob = new Blob([JSON.stringify({ v:1, tools, pinned }, null, 2)], { type:'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'toolbox-library.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      } },
    { label:'Import library\u2026', on: () => {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'application/json,.json';
        input.onchange = async () => {
          try {
            const data = JSON.parse(await input.files[0].text());
            if (!data || typeof data.tools !== 'object') throw new Error('Not a library file');
            tools = data.tools;
            pinned = Array.isArray(data.pinned) ? data.pinned : [];
            saveTools(); renderHome(); toast('Library imported');
          } catch (err){ toast('That file is not a library export'); }
        };
        input.click();
      } },
    'sep',
    { label:'Restore default tools', danger:true, on: async () => {
        if (!await confirmDlg('Restore default tools?', 'Every tool you have written or edited is replaced by the originals.', 'Restore')) return;
        resetLibrary(); toast('Defaults restored');
      } },
    'sep',
    { cap:'Danger zone' },
    { label:'Erase everything\u2026', danger:true, on: async () => {
        const phrase = await ask(
          'Erase everything?',
          'This deletes every tool you\u2019ve edited AND every piece of data saved inside them \u2014 the password vault, TOTP accounts, saved recipes, expenses, shopping lists, the scratchpad, all of it. This cannot be undone. Type ERASE to confirm.',
          ''
        );
        if (phrase !== 'ERASE'){ if (phrase !== null) toast('Not erased \u2014 type ERASE exactly'); return; }
        eraseEverything();
      } }
  ]);
};

/* ----------------------------------------------------------------------
   Console access:
   - resetToolbox()   wipes the cached tool LIBRARY only (your edited tool
                       code/HTML/JS). Saved data inside tools \u2014 the vault,
                       TOTP accounts, recipes, expenses, shopping lists,
                       scratchpad, etc \u2014 is untouched.
   - eraseEverything() wipes ALL of it: the library AND every tool's saved
                       data. This is a full factory reset with no way back.
   Both reload the page afterwards.
   ---------------------------------------------------------------------- */
window.resetToolbox = function(){
  try { localStorage.removeItem(STORAGE_KEY); } catch {}
  location.reload();
};
window.eraseEverything = function(){
  try { localStorage.clear(); } catch {}
  try { sessionStorage.clear(); } catch {}
  location.reload();
};

/* ---------- Boot ----------
   Always prefer the cache. Only seed the defaults when nothing is stored. */
if (!loadTools()){
  tools  = defaultLibrary();
  pinned = DEFAULT_PINNED.slice();
  saveTools();
}
renderHome();
</script>
