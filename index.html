illStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);\n  if (!text) return;\n  const bits = code128B(text);\n  const quiet = 10;\n  const unit = (canvas.width - quiet * 2) / bits.length;\n  ctx.fillStyle = '#000';\n  for (let i = 0; i < bits.length; i++)\n    if (bits[i] === '1') ctx.fillRect(quiet + i * unit, 0, Math.ceil(unit), canvas.height);\n}\n\nfunction drawQR(canvas, text){\n  const ctx = canvas.getContext('2d');\n  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);\n  if (!window.qrcode || !text) return;\n  const qr = window.qrcode(0, 'M');\n  qr.addData(text); qr.make();\n  const n = qr.getModuleCount();\n  const scale = canvas.width / n;\n  ctx.fillStyle = '#000';\n  for (let r = 0; r < n; r++)\n    for (let c = 0; c < n; c++)\n      if (qr.isDark(r, c))\n        ctx.fillRect(Math.floor(c * scale), Math.floor(r * scale), Math.ceil(scale), Math.ceil(scale));\n}\n\nfunction update(){\n  const co = $('atCo').value.trim() || 'COMPANY NAME';\n  const serial = $('atSerial').value.trim();\n  const asset = $('atAsset').value.trim();\n  const model = $('atModel').value.trim();\n\n  $('tgCo').textContent = co;\n  $('tgSerial').textContent = serial || 'SERIAL';\n  $('tgSlbl').textContent = 'Serial number';\n  const bits = [];\n  if (asset) bits.push('Asset: ' + asset);\n  if (model) bits.push('Model: ' + model);\n  $('tgSub').textContent = bits.join('   ·   ');\n  $('tgFt1').textContent = $('atContact').value.trim();\n  $('tgFt2').textContent = $('atNote').value.trim();\n  $('tgBctx').textContent = serial;\n\n  $('atWarn').textContent = '';\n  try { drawBarcode($('tgBc'), serial); }\n  catch (e){ $('atWarn').textContent = 'Barcode: ' + e.message + ' (Code 128 supports standard keyboard characters).'; }\n  drawQR($('tgQr'), serial);\n}\n\n['atCo','atSerial','atAsset','atModel','atContact','atNote'].forEach(id =>\n  $(id).addEventListener('input', update));\n\n/* ---------- export: render the tag to a high-resolution canvas ---------- */\nfunction renderTag(scale){\n  const W = 340, H = $('atTag').offsetHeight || 210;\n  const c = document.createElement('canvas');\n  c.width = W * scale; c.height = H * scale;\n  const x = c.getContext('2d');\n  x.scale(scale, scale);\n  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);\n  x.strokeStyle = '#D8D8DE'; x.lineWidth = 1;\n  x.strokeRect(.5, .5, W - 1, H - 1);\n\n  const P = 15;\n  let y = 13;\n  x.fillStyle = '#000';\n  x.font = '800 14px -apple-system, Segoe UI, Arial, sans-serif';\n  x.fillText(($('atCo').value.trim() || 'COMPANY NAME').toUpperCase(), P, y + 11);\n  y += 20;\n  x.fillRect(P, y, W - P * 2, 2);\n  y += 11;\n\n  x.fillStyle = '#666';\n  x.font = '700 8px -apple-system, Segoe UI, Arial, sans-serif';\n  x.fillText('SERIAL NUMBER', P, y + 7);\n  x.fillStyle = '#000';\n  x.font = '700 15px ui-monospace, Menlo, Consolas, monospace';\n  x.fillText($('atSerial').value.trim() || 'SERIAL', P, y + 24);\n\n  const bits = [];\n  if ($('atAsset').value.trim()) bits.push('Asset: ' + $('atAsset').value.trim());\n  if ($('atModel').value.trim()) bits.push('Model: ' + $('atModel').value.trim());\n  if (bits.length){\n    x.fillStyle = '#444';\n    x.font = '10px -apple-system, Segoe UI, Arial, sans-serif';\n    x.fillText(bits.join('   \\u00b7   '), P, y + 40);\n  }\n  x.drawImage($('tgQr'), W - P - 74, y - 2, 74, 74);\n  y += 78;\n\n  x.drawImage($('tgBc'), P, y, W - P * 2, 44);\n  y += 46;\n  x.fillStyle = '#000';\n  x.font = '9.5px ui-monospace, Menlo, monospace';\n  const s = $('atSerial').value.trim();\n  x.fillText(s, (W - x.measureText(s).width) / 2, y + 8);\n  y += 16;\n\n  x.strokeStyle = '#DDD'; x.beginPath(); x.moveTo(P, y); x.lineTo(W - P, y); x.stroke();\n  x.fillStyle = '#666';\n  x.font = '8.5px -apple-system, Segoe UI, Arial, sans-serif';\n  const f1 = $('atContact').value.trim(), f2 = $('atNote').value.trim();\n  if (f1) x.fillText(f1, P, y + 11);\n  if (f2) x.fillText(f2, W - P - x.measureText(f2).width, y + 11);\n\n  return c;\n}\n\n$('atPng').onclick = () => {\n  const c = renderTag(4);\n  const a = document.createElement('a');\n  a.href = c.toDataURL('image/png');\n  a.download = 'asset-tag-' + ($('atSerial').value.trim() || 'tag') + '.png';\n  a.click();\n};\n$('atCopy').onclick = () => {\n  renderTag(4).toBlob(async b => {\n    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]); toast('Tag copied'); }\n    catch { toast('Copy not supported here \\u2014 use Download'); }\n  });\n};\n$('atPrint').onclick = () => {\n  const url = renderTag(4).toDataURL('image/png');\n  const w = window.open('', '_blank');\n  if (!w) return toast('Allow pop-ups to print');\n  w.document.write('<title>Asset tag</title><style>@page{margin:10mm}body{margin:0;display:flex;flex-wrap:wrap;gap:6mm;padding:6mm}img{width:90mm}</style>' +\n    ('<img src=\"' + url + '\">').repeat(1));\n  w.document.close();\n  setTimeout(() => { w.focus(); w.print(); }, 350);\n};\n\n// the QR library arrives asynchronously; redraw once it lands\n(function waitForQr(n){\n  if (window.qrcode){ update(); return; }\n  if (n > 0) setTimeout(() => waitForQr(n - 1), 40);\n})(30);\nupdate();"

      "html": "<div id=\"cv\">\n<style>\n  #cv{position:absolute;inset:0;overflow-y:auto;padding:22px 18px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #cv .wrap{width:100%;max-width:680px}\n  #cv h2{margin:0 0 14px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #cv .top{display:flex;gap:8px;margin-bottom:12px}\n  #cv .top input{flex:1;padding:11px 14px;border:1px solid rgba(60,60,67,.16);border-radius:13px;background:#fff;font:inherit;font-size:16px}\n  #cv .top input:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #cv .btn{padding:11px 15px;border:0;border-radius:12px;background:#0A84FF;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .15s}\n  #cv .btn:active{transform:scale(.97)}\n  #cv .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #cv .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}\n  #cv .tags{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;-webkit-overflow-scrolling:touch}\n  #cv .tags button{padding:6px 13px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:12.5px;font-weight:560;color:#6E6E76;cursor:pointer;white-space:nowrap}\n  #cv .tags button.on{background:#111114;border-color:#111114;color:#fff}\n  #cv .sn{background:#fff;border-radius:14px;margin-bottom:9px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05),0 8px 20px -18px rgba(16,24,40,.4)}\n  #cv .sn .hd{display:flex;align-items:center;gap:11px;padding:14px 15px;cursor:pointer;user-select:none}\n  #cv .sn .chev{color:#C3C3C9;font-size:12px;transition:transform .2s;flex:0 0 auto}\n  #cv .sn.open .chev{transform:rotate(90deg)}\n  #cv .sn .ti{flex:1;font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}\n  #cv .sn .sh{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px}\n  #cv .sn .sh.ps{background:rgba(1,36,86,.1);color:#012456}\n  #cv .sn .sh.cmd{background:rgba(60,60,67,.12);color:#3C3C43}\n  #cv .sn .sh.bash{background:rgba(48,164,108,.14);color:#12805C}\n  #cv .sn .bd{display:none;padding:0 15px 15px}\n  #cv .sn.open .bd{display:block}\n  #cv .sn .ds{font-size:13.5px;color:#6E6E76;line-height:1.55;margin:0 0 11px;padding-top:2px}\n  #cv .sn pre{margin:0;padding:13px 14px;border-radius:11px;background:#0E1116;color:#D6DEEB;overflow-x:auto;\n    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre}\n  #cv .sn pre .c{color:#7C8697} #cv .sn pre .v{color:#8ED0F5} #cv .sn pre .s{color:#B6E58C} #cv .sn pre .k{color:#E7A6FF}\n  #cv .sn .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}\n  #cv .empty{text-align:center;color:#A6A6AE;font-size:14px;padding:44px 20px;line-height:1.7}\n  /* editor */\n  #cv .ed{position:absolute;inset:0;background:#F2F2F7;overflow-y:auto;display:none;z-index:5}\n  #cv .ed.on{display:block}\n  #cv .ed .inner{max-width:680px;margin:0 auto;padding:22px 18px calc(40px + env(safe-area-inset-bottom,0px))}\n  #cv .ed label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:16px 0 6px}\n  #cv .ed input,#cv .ed textarea,#cv .ed select{width:100%;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:#111114}\n  #cv .ed textarea{min-height:190px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;white-space:pre;tab-size:4}\n  #cv .ed input:focus,#cv .ed textarea:focus,#cv .ed select:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #cv .ed h2{margin:0;font-size:22px}\n  #cv .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n</style>\n  <div class=\"wrap\">\n    <h2>Command Vault</h2>\n    <div class=\"top\">\n      <input id=\"cvQ\" placeholder=\"Search titles, commands, tags…\" spellcheck=\"false\">\n      <button class=\"btn\" id=\"cvNew\">New</button>\n    </div>\n    <div class=\"tags\" id=\"cvTags\"></div>\n    <div id=\"cvList\"></div>\n    <div style=\"display:flex;gap:8px;margin-top:20px;flex-wrap:wrap\">\n      <button class=\"btn ghost sm\" id=\"cvExport\">Export</button>\n      <button class=\"btn ghost sm\" id=\"cvImport\">Import</button>\n      <button class=\"btn ghost sm\" id=\"cvExpand\">Expand all</button>\n    </div>\n  </div>\n\n  <div class=\"ed\" id=\"cvEd\">\n    <div class=\"inner\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\">\n        <h2 id=\"cvEdT\">New snippet</h2>\n        <button class=\"btn ghost sm\" id=\"cvCancel\">Cancel</button>\n      </div>\n      <label for=\"cvT\">Title</label><input id=\"cvT\" placeholder=\"Reset a user's password\">\n      <label for=\"cvD\">Description</label><input id=\"cvD\" placeholder=\"What it does, and anything to watch out for\">\n      <div class=\"r2\">\n        <div><label for=\"cvSh\">Shell</label>\n          <select id=\"cvSh\"><option value=\"ps\">PowerShell</option><option value=\"cmd\">CMD</option><option value=\"bash\">Bash</option></select>\n        </div>\n        <div><label for=\"cvTg\">Tags</label><input id=\"cvTg\" placeholder=\"ad, users\"></div>\n      </div>\n      <label for=\"cvC\">Command / script</label>\n      <textarea id=\"cvC\" spellcheck=\"false\" placeholder=\"Get-ADUser -Identity jbloggs -Properties *\"></textarea>\n      <div style=\"display:flex;gap:8px;margin-top:20px\">\n        <button class=\"btn\" id=\"cvSave\" style=\"flex:1\">Save snippet</button>\n        <button class=\"btn ghost\" id=\"cvDel\">Delete</button>\n      </div>\n    </div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst KEY = 'cmdvault.v1';\nlet all = [], editing = null, tagFilter = '';\ntry { all = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}\nif (!all.length) all = seed();\nconst save = () => localStorage.setItem(KEY, JSON.stringify(all));\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nfunction uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }\nconst SH = { ps:'PowerShell', cmd:'CMD', bash:'Bash' };\n\nfunction seed(){\n  return [\n    { id:uid(), sh:'ps', title:'Find who locked an account out', tags:['ad','lockout'],\n      desc:'Searches the PDC emulator security log for 4740 events naming the user, which reveals the source machine.',\n      cmd:'$user = \"jbloggs\"\\n$pdc  = (Get-ADDomain).PDCEmulator\\n\\nGet-WinEvent -ComputerName $pdc -FilterHashtable @{\\n    LogName = \\'Security\\'; ID = 4740\\n} -MaxEvents 50 |\\n  Where-Object { $_.Properties[0].Value -eq $user } |\\n  Select-Object TimeCreated,\\n                @{n=\\'User\\';   e={$_.Properties[0].Value}},\\n                @{n=\\'Source\\'; e={$_.Properties[1].Value}}' },\n    { id:uid(), sh:'ps', title:'Unlock an AD account and force a password change', tags:['ad','users'],\n      desc:'Clears the lockout and flags the account so the user must set a new password at next sign-in.',\n      cmd:'Unlock-ADAccount -Identity jbloggs\\nSet-ADUser  -Identity jbloggs -ChangePasswordAtLogon $true' },\n    { id:uid(), sh:'ps', title:'Last 20 boots and shutdowns', tags:['diagnostics'],\n      desc:'Quickly answers \"when did this machine actually restart?\" using the event log.',\n      cmd:'Get-WinEvent -FilterHashtable @{LogName=\\'System\\'; ID=6005,6006,6008,41,1074} -MaxEvents 20 |\\n  Select-Object TimeCreated, Id, @{n=\\'Message\\';e={$_.Message -replace \"`r`n\",\" \" }} |\\n  Format-Table -AutoSize -Wrap' },\n    { id:uid(), sh:'ps', title:'Disk space on every drive', tags:['diagnostics','storage'],\n      desc:'Free and total space per volume, in GB.',\n      cmd:'Get-CimInstance Win32_LogicalDisk -Filter \"DriveType=3\" |\\n  Select-Object DeviceID,\\n    @{n=\\'Size(GB)\\';e={[math]::Round($_.Size/1GB,1)}},\\n    @{n=\\'Free(GB)\\';e={[math]::Round($_.FreeSpace/1GB,1)}},\\n    @{n=\\'Free%\\';   e={[math]::Round($_.FreeSpace/$_.Size*100,1)}} |\\n  Format-Table -AutoSize' },\n    { id:uid(), sh:'ps', title:'Restart the print spooler and clear stuck jobs', tags:['printing'],\n      desc:'The standard fix for a jammed queue. Stops the service, empties the spool folder, starts it again.',\n      cmd:'Stop-Service  -Name Spooler -Force\\nRemove-Item   -Path \"$env:SystemRoot\\\\System32\\\\spool\\\\PRINTERS\\\\*\" -Force -ErrorAction SilentlyContinue\\nStart-Service -Name Spooler\\nGet-Service Spooler' },\n    { id:uid(), sh:'ps', title:'Recently installed Windows updates', tags:['updates'],\n      desc:'Lists the most recent hotfixes with their install dates.',\n      cmd:'Get-HotFix | Sort-Object InstalledOn -Descending |\\n  Select-Object -First 15 HotFixID, Description, InstalledOn' },\n    { id:uid(), sh:'cmd', title:'Full network configuration and DNS reset', tags:['network'],\n      desc:'The classic connectivity reset. Run as administrator, then reboot.',\n      cmd:'ipconfig /all\\nipconfig /flushdns\\nipconfig /release\\nipconfig /renew\\nnetsh winsock reset\\nnetsh int ip reset' },\n    { id:uid(), sh:'cmd', title:'Repair Windows system files', tags:['repair'],\n      desc:'DISM repairs the component store, then SFC repairs system files against it. Run in this order.',\n      cmd:'DISM /Online /Cleanup-Image /RestoreHealth\\nsfc /scannow' },\n    { id:uid(), sh:'cmd', title:'Show saved Wi-Fi password', tags:['network','wifi'],\n      desc:'Reveals the key for a stored wireless profile on this machine.',\n      cmd:'netsh wlan show profiles\\nnetsh wlan show profile name=\"SSID-NAME\" key=clear' },\n    { id:uid(), sh:'ps', title:'Test a port on a remote host', tags:['network'],\n      desc:'Replaces telnet for checking whether a service is listening and reachable.',\n      cmd:'Test-NetConnection -ComputerName server01 -Port 443 -InformationLevel Detailed' },\n    { id:uid(), sh:'ps', title:'Top 10 processes by memory', tags:['diagnostics'],\n      desc:'Finds what is eating RAM on a sluggish machine.',\n      cmd:'Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 10 \\n  Name, Id, @{n=\\'RAM(MB)\\';e={[math]::Round($_.WorkingSet64/1MB)}}, CPU' },\n    { id:uid(), sh:'ps', title:'Bulk-add users to a group from a CSV', tags:['ad','bulk'],\n      desc:'Expects a CSV with a SamAccountName column. Test against a small file first.',\n      cmd:'Import-Csv .\\\\users.csv | ForEach-Object {\\n    Add-ADGroupMember -Identity \"Finance-RW\" -Members $_.SamAccountName\\n    Write-Host \"Added $($_.SamAccountName)\"\\n}' }\n  ];\n}\n\n/* Light syntax colouring — comments, strings, variables, keywords. */\nfunction highlight(code, sh){\n  let h = esc(code);\n  h = h.replace(/(^|\\n)(\\s*)(#[^\\n]*|::[^\\n]*|REM [^\\n]*)/gi, (m, a, b, c) => a + b + '<span class=\"c\">' + c + '</span>');\n  h = h.replace(/(&quot;[^&\\n]*?&quot;|'[^'\\n]*?')/g, '<span class=\"s\">$1</span>');\n  if (sh === 'ps'){\n    h = h.replace(/(\\$[A-Za-z_][\\w:]*)/g, '<span class=\"v\">$1</span>');\n    h = h.replace(/\\b(Get|Set|New|Remove|Add|Start|Stop|Restart|Test|Import|Export|Select|Where|ForEach|Sort|Format)-[A-Za-z]+\\b/g, '<span class=\"k\">$&</span>');\n  } else {\n    h = h.replace(/(%[A-Za-z_]\\w*%)/g, '<span class=\"v\">$1</span>');\n  }\n  return h;\n}\n\nfunction allTags(){\n  const s = new Set();\n  all.forEach(x => (x.tags || []).forEach(t => s.add(t)));\n  return [...s].sort();\n}\n\nfunction render(){\n  const q = $('cvQ').value.trim().toLowerCase();\n  const tags = allTags();\n  $('cvTags').innerHTML = tags.length\n    ? '<button class=\"' + (tagFilter ? '' : 'on') + '\" data-t=\"\">All</button>' +\n      tags.map(t => '<button class=\"' + (tagFilter === t ? 'on' : '') + '\" data-t=\"' + esc(t) + '\">' + esc(t) + '</button>').join('')\n    : '';\n  $('cvTags').querySelectorAll('button').forEach(b => b.onclick = () => { tagFilter = b.dataset.t; render(); });\n\n  const list = all.filter(s => {\n    if (tagFilter && !(s.tags || []).includes(tagFilter)) return false;\n    if (!q) return true;\n    return (s.title + ' ' + s.desc + ' ' + s.cmd + ' ' + (s.tags || []).join(' ')).toLowerCase().includes(q);\n  });\n\n  $('cvList').innerHTML = list.length ? list.map(s =>\n    '<div class=\"sn\" data-id=\"' + s.id + '\">' +\n      '<div class=\"hd\"><span class=\"chev\">&#9654;</span>' +\n        '<span class=\"ti\">' + esc(s.title) + '</span>' +\n        '<span class=\"sh ' + s.sh + '\">' + SH[s.sh] + '</span>' +\n      '</div>' +\n      '<div class=\"bd\">' +\n        (s.desc ? '<p class=\"ds\">' + esc(s.desc) + '</p>' : '') +\n        '<pre>' + highlight(s.cmd, s.sh) + '</pre>' +\n        '<div class=\"acts\">' +\n          '<button class=\"btn sm\" data-a=\"copy\">Copy</button>' +\n          '<button class=\"btn ghost sm\" data-a=\"edit\">Edit</button>' +\n          '<button class=\"btn ghost sm\" data-a=\"dup\">Duplicate</button>' +\n        '</div>' +\n      '</div>' +\n    '</div>').join('')\n    : '<div class=\"empty\">' + (all.length ? 'Nothing matches that search.' : 'No snippets yet.<br>Tap <b>New</b> to add one.') + '</div>';\n\n  $('cvList').querySelectorAll('.sn').forEach(el => {\n    const s = all.find(x => x.id === el.dataset.id);\n    el.querySelector('.hd').onclick = () => el.classList.toggle('open');\n    el.querySelectorAll('[data-a]').forEach(b => b.onclick = ev => {\n      ev.stopPropagation();\n      const a = b.dataset.a;\n      if (a === 'copy') navigator.clipboard.writeText(s.cmd).then(() => toast('Command copied'), () => toast('Copied'));\n      if (a === 'edit') openEd(s);\n      if (a === 'dup'){ const c = Object.assign({}, s, { id:uid(), title:s.title + ' (copy)' }); all.unshift(c); save(); render(); toast('Duplicated'); }\n    });\n    // right-click / long-press context menu\n    el.addEventListener('contextmenu', ev => { ev.preventDefault(); menu(ev.clientX, ev.clientY, s); });\n    let t;\n    el.addEventListener('touchstart', ev => {\n      t = setTimeout(() => {\n        const to = ev.touches[0];\n        menu(to.clientX, to.clientY, s);\n      }, 520);\n    }, { passive:true });\n    ['touchend','touchmove','touchcancel'].forEach(e2 => el.addEventListener(e2, () => clearTimeout(t), { passive:true }));\n  });\n}\n\nfunction menu(x, y, s){\n  showMenu(x, y, [\n    { cap: s.title },\n    { label:'Copy command', on:() => navigator.clipboard.writeText(s.cmd).then(() => toast('Copied'), () => toast('Copied')) },\n    { label:'Edit', on:() => openEd(s) },\n    { label:'Duplicate', on:() => { all.unshift(Object.assign({}, s, { id:uid(), title:s.title + ' (copy)' })); save(); render(); } },\n    'sep',\n    { label:'Move up', on:() => { const i = all.indexOf(s); if (i > 0){ all.splice(i, 1); all.splice(i - 1, 0, s); save(); render(); } }, disabled: all.indexOf(s) === 0 },\n    { label:'Move down', on:() => { const i = all.indexOf(s); if (i < all.length - 1){ all.splice(i, 1); all.splice(i + 1, 0, s); save(); render(); } }, disabled: all.indexOf(s) === all.length - 1 },\n    'sep',\n    { label:'Delete', danger:true, on: async () => {\n        if (!await confirmDlg('Delete \"' + s.title + '\"?', 'This snippet is removed from this device.', 'Delete')) return;\n        all = all.filter(x => x.id !== s.id); save(); render(); toast('Deleted');\n      } }\n  ]);\n}\n\nfunction openEd(s){\n  editing = s || null;\n  $('cvEdT').textContent = s ? 'Edit snippet' : 'New snippet';\n  $('cvT').value = s ? s.title : '';\n  $('cvD').value = s ? s.desc : '';\n  $('cvSh').value = s ? s.sh : 'ps';\n  $('cvTg').value = s ? (s.tags || []).join(', ') : '';\n  $('cvC').value = s ? s.cmd : '';\n  $('cvDel').style.display = s ? '' : 'none';\n  $('cvEd').classList.add('on');\n}\n$('cvNew').onclick = () => openEd(null);\n$('cvCancel').onclick = () => $('cvEd').classList.remove('on');\n$('cvSave').onclick = () => {\n  const title = $('cvT').value.trim(), cmd = $('cvC').value;\n  if (!title) return toast('Give it a title');\n  if (!cmd.trim()) return toast('Add the command');\n  const data = { title, desc:$('cvD').value.trim(), sh:$('cvSh').value, cmd,\n    tags: $('cvTg').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean) };\n  if (editing) Object.assign(editing, data);\n  else all.unshift(Object.assign({ id:uid() }, data));\n  save(); $('cvEd').classList.remove('on'); render(); toast('Saved');\n};\n$('cvDel').onclick = async () => {\n  if (!editing) return;\n  if (!await confirmDlg('Delete \"' + editing.title + '\"?', 'This snippet is removed from this device.', 'Delete')) return;\n  all = all.filter(x => x.id !== editing.id);\n  save(); $('cvEd').classList.remove('on'); render(); toast('Deleted');\n};\n$('cvQ').addEventListener('input', render);\n$('cvExpand').onclick = () => {\n  const cards = [...document.querySelectorAll('#cvList .sn')];\n  const anyClosed = cards.some(c => !c.classList.contains('open'));\n  cards.forEach(c => c.classList.toggle('open', anyClosed));\n  $('cvExpand').textContent = anyClosed ? 'Collapse all' : 'Expand all';\n};\n$('cvExport').onclick = () => {\n  const blob = new Blob([JSON.stringify(all, null, 2)], { type:'application/json' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob); a.download = 'command-vault.json'; a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n};\n$('cvImport').onclick = async () => {\n  const txt = await ask('Import snippets', 'Paste exported JSON', '', true);\n  if (!txt) return;\n  try {\n    const data = JSON.parse(txt);\n    if (!Array.isArray(data)) throw new Error('Expected a list');\n    let n = 0;\n    data.forEach(s => { if (s.title && s.cmd){ s.id = uid(); all.unshift(s); n++; } });\n    save(); render(); toast(n + ' snippet' + (n === 1 ? '' : 's') + ' imported');\n  } catch (e){ toast('Could not read that: ' + e.message); }\n};\n\n// Tab indents inside the code editor instead of moving focus\n$('cvC').addEventListener('keydown', e => {\n  if (e.key !== 'Tab') return;\n  e.preventDefault();\n  const s = $('cvC').selectionStart;\n  $('cvC').value = $('cvC').value.slice(0, s) + '    ' + $('cvC').value.slice($('cvC').selectionEnd);\n  $('cvC').selectionStart = $('cvC').selectionEnd = s + 4;\n});\n\nrender();\nonToolExit(() => hideMenu());"

      "html": "<div id=\"sp\">\n<style>\n  #sp{position:absolute;inset:0;overflow-y:auto;padding:26px 18px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #sp .wrap{width:100%;max-width:520px;text-align:center}\n  #sp h2{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #sp .sub{margin:0 0 24px;font-size:13.5px;color:#6E6E76}\n  #sp .gauge{position:relative;width:250px;height:250px;margin:0 auto 8px}\n  #sp svg{width:250px;height:250px;transform:rotate(135deg)}\n  #sp svg circle{fill:none;stroke-width:14;stroke-linecap:round}\n  #sp svg .bg{stroke:rgba(120,120,128,.14)}\n  #sp svg .fg{stroke:#0A84FF;transition:stroke-dashoffset .3s ease,stroke .3s}\n  #sp .rd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}\n  #sp .rd .n{font-size:52px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}\n  #sp .rd .u{font-size:13px;color:#A6A6AE;font-weight:600;letter-spacing:.05em;margin-top:5px}\n  #sp .rd .ph{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#0A84FF;margin-bottom:9px;min-height:15px}\n  #sp .go{width:100%;max-width:300px;height:54px;margin:18px auto 0;display:block;border:0;border-radius:16px;background:#111114;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:transform .15s}\n  #sp .go:active{transform:scale(.98)} #sp .go:disabled{opacity:.5}\n  #sp .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:24px}\n  #sp .st{background:#fff;border-radius:14px;padding:14px 8px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #sp .st .l{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A6A6AE}\n  #sp .st .v{font-size:20px;font-weight:640;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}\n  #sp .st .s{font-size:10.5px;color:#C3C3C9;margin-top:1px}\n  #sp .note{font-size:12px;color:#A6A6AE;line-height:1.6;margin-top:22px;text-align:left;background:#fff;border-radius:13px;padding:14px}\n  #sp .hist{margin-top:16px;text-align:left}\n  #sp .hist .hr{display:flex;justify-content:space-between;padding:9px 13px;background:#fff;border-radius:11px;margin-bottom:6px;font-size:13px}\n  #sp .hist .hr span:first-child{color:#6E6E76}\n  #sp .hist .hr b{font-variant-numeric:tabular-nums}\n</style>\n  <div class=\"wrap\">\n    <h2>Speed Test</h2>\n    <p class=\"sub\">Measures throughput against Cloudflare's public endpoint.</p>\n    <div class=\"gauge\">\n      <svg viewBox=\"0 0 250 250\"><circle class=\"bg\" cx=\"125\" cy=\"125\" r=\"108\"/><circle class=\"fg\" id=\"spRing\" cx=\"125\" cy=\"125\" r=\"108\"/></svg>\n      <div class=\"rd\">\n        <div class=\"ph\" id=\"spPhase\">Ready</div>\n        <div class=\"n\" id=\"spNum\">&mdash;</div>\n        <div class=\"u\">Mbps</div>\n      </div>\n    </div>\n    <button class=\"go\" id=\"spGo\">Start test</button>\n    <div class=\"stats\">\n      <div class=\"st\"><div class=\"l\">Download</div><div class=\"v\" id=\"spDown\">&mdash;</div><div class=\"s\">Mbps</div></div>\n      <div class=\"st\"><div class=\"l\">Upload</div><div class=\"v\" id=\"spUp\">&mdash;</div><div class=\"s\">Mbps</div></div>\n      <div class=\"st\"><div class=\"l\">Latency</div><div class=\"v\" id=\"spPing\">&mdash;</div><div class=\"s\">ms</div></div>\n    </div>\n    <div class=\"hist\" id=\"spHist\"></div>\n    <p class=\"note\">Browser-based tests measure what this tab can pull over HTTPS, so results sit below what a native speed test reports &mdash; expect roughly 70&ndash;90% of your line speed. Wi-Fi, VPNs and other active downloads all drag the number down. Use it for a quick sanity check rather than proving an ISP fault.</p>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst HKEY = 'speedtest.hist.v1';\nconst R = 108, CIRC = 2 * Math.PI * R;\nconst ARC = 0.75;                     // gauge sweeps three-quarters of the circle\nlet running = false, ctrl = null;\n\n$('spRing').style.strokeDasharray = CIRC;\n$('spRing').style.strokeDashoffset = CIRC;\n\nfunction gauge(mbps){\n  // log scale so both 5 Mbps and 500 Mbps read sensibly\n  const frac = Math.max(0, Math.min(1, Math.log10(Math.max(mbps, 0.1) + 1) / Math.log10(1001)));\n  $('spRing').style.strokeDashoffset = CIRC * (1 - frac * ARC);\n  $('spRing').style.stroke = mbps < 10 ? '#E5484D' : mbps < 50 ? '#F5A524' : '#30A46C';\n  $('spNum').textContent = mbps >= 100 ? Math.round(mbps) : mbps.toFixed(1);\n}\nfunction phase(t){ $('spPhase').textContent = t; }\n\nasync function latency(){\n  phase('Latency');\n  const times = [];\n  for (let i = 0; i < 6; i++){\n    const t0 = performance.now();\n    try {\n      await fetch('https://speed.cloudflare.com/__down?bytes=1000&r=' + Math.random(),\n        { cache:'no-store', signal: ctrl.signal });\n      times.push(performance.now() - t0);\n    } catch { /* ignore a dropped sample */ }\n  }\n  if (!times.length) throw new Error('no response');\n  times.sort((a, b) => a - b);\n  const median = times[Math.floor(times.length / 2)];\n  const jitter = times.length > 1 ? (times[times.length - 1] - times[0]) / 2 : 0;\n  return { ping: median, jitter };\n}\n\nasync function download(){\n  phase('Download');\n  const sizes = [2e6, 5e6, 10e6, 25e6];\n  let best = 0;\n  for (const size of sizes){\n    const t0 = performance.now();\n    let bytes = 0;\n    try {\n      const r = await fetch('https://speed.cloudflare.com/__down?bytes=' + size + '&r=' + Math.random(),\n        { cache:'no-store', signal: ctrl.signal });\n      const reader = r.body.getReader();\n      while (true){\n        const { done, value } = await reader.read();\n        if (done) break;\n        bytes += value.length;\n        const secs = (performance.now() - t0) / 1000;\n        if (secs > 0.25) gauge((bytes * 8) / secs / 1e6);\n      }\n    } catch (e){ if (e.name === 'AbortError') throw e; break; }\n    const secs = (performance.now() - t0) / 1000;\n    const mbps = (bytes * 8) / secs / 1e6;\n    if (mbps > best) best = mbps;\n    if (secs > 6) break;                 // stop climbing sizes on a slow line\n  }\n  return best;\n}\n\nasync function upload(){\n  phase('Upload');\n  const payload = new Uint8Array(3e6);\n  crypto.getRandomValues(payload.subarray(0, 65536));\n  let best = 0;\n  for (let i = 0; i < 3; i++){\n    const t0 = performance.now();\n    try {\n      await fetch('https://speed.cloudflare.com/__up', {\n        method:'POST', body: payload, cache:'no-store', signal: ctrl.signal\n      });\n    } catch (e){ if (e.name === 'AbortError') throw e; break; }\n    const secs = (performance.now() - t0) / 1000;\n    const mbps = (payload.length * 8) / secs / 1e6;\n    if (mbps > best) best = mbps;\n    gauge(mbps);\n  }\n  return best;\n}\n\nasync function run(){\n  if (running){ ctrl.abort(); return; }\n  running = true; ctrl = new AbortController();\n  $('spGo').textContent = 'Stop';\n  ['spDown','spUp','spPing'].forEach(id => $(id).textContent = '\\u2026');\n  try {\n    const { ping, jitter } = await latency();\n    $('spPing').textContent = Math.round(ping);\n    const d = await download();\n    $('spDown').textContent = d >= 100 ? Math.round(d) : d.toFixed(1);\n    const u = await upload();\n    $('spUp').textContent = u >= 100 ? Math.round(u) : u.toFixed(1);\n    gauge(d);\n    phase('Done');\n    record({ d, u, ping, jitter, t: Date.now() });\n  } catch (e){\n    if (e.name === 'AbortError') phase('Stopped');\n    else { phase('Failed'); toast('Test failed \\u2014 check your connection'); }\n  }\n  running = false;\n  $('spGo').textContent = 'Start test';\n}\n\nfunction record(r){\n  let h = [];\n  try { h = JSON.parse(localStorage.getItem(HKEY)) || []; } catch {}\n  h.unshift(r);\n  h = h.slice(0, 5);\n  localStorage.setItem(HKEY, JSON.stringify(h));\n  drawHist();\n}\nfunction drawHist(){\n  let h = [];\n  try { h = JSON.parse(localStorage.getItem(HKEY)) || []; } catch {}\n  $('spHist').innerHTML = h.length\n    ? '<div style=\"font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:0 0 9px 3px\">Recent</div>' +\n      h.map(r => '<div class=\"hr\"><span>' + new Date(r.t).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) +\n        '</span><b>' + r.d.toFixed(1) + ' \\u2193 &nbsp; ' + r.u.toFixed(1) + ' \\u2191 &nbsp; ' + Math.round(r.ping) + ' ms</b></div>').join('')\n    : '';\n}\n\n$('spGo').onclick = run;\ndrawHist();\nonToolExit(() => { if (ctrl) ctrl.abort(); });"

      "html": "<div id=\"dn\">\n<style>\n  #dn{padding:26px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #dn .wrap{width:100%;max-width:680px}\n  #dn h2{margin:0 0 18px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #dn .form{display:flex;gap:8px;margin-bottom:14px}\n  #dn .form input{flex:1;padding:12px 14px;border:1px solid rgba(60,60,67,.16);border-radius:13px;background:#fff;font:inherit;font-size:16px}\n  #dn .form input:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #dn .form button{padding:0 20px;border:0;border-radius:13px;background:#0A84FF;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s}\n  #dn .form button:active{transform:scale(.97)}\n  #dn .types{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}\n  #dn .types button{padding:7px 14px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:13px;font-weight:560;color:#6E6E76;cursor:pointer;transition:.15s}\n  #dn .types button.on{background:#111114;border-color:#111114;color:#fff}\n  #dn .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4);margin-bottom:14px}\n  #dn .card h3{margin:0;padding:12px 16px;font-size:13px;font-weight:700;letter-spacing:.02em;color:#6E6E76;border-bottom:1px solid rgba(60,60,67,.08);display:flex;justify-content:space-between}\n  #dn .card h3 span{color:#A6A6AE;font-weight:600}\n  #dn .rec{display:flex;gap:14px;padding:11px 16px;border-bottom:1px solid rgba(60,60,67,.06);align-items:baseline}\n  #dn .rec:last-child{border-bottom:0}\n  #dn .rec .data{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;word-break:break-all;color:#111114}\n  #dn .rec .ttl{flex:0 0 auto;font-size:11.5px;color:#A6A6AE;font-variant-numeric:tabular-nums}\n  #dn .msg{padding:30px;text-align:center;color:#A6A6AE;font-size:14px}\n  #dn .err{color:#B8390E}\n</style>\n  <div class=\"wrap\">\n    <h2>DNS lookup</h2>\n    <div class=\"form\">\n      <input id=\"dnHost\" placeholder=\"example.com\" spellcheck=\"false\" autocapitalize=\"off\" value=\"example.com\">\n      <button id=\"dnGo\">Look up</button>\n    </div>\n    <div class=\"types\" id=\"dnTypes\">\n      <button data-t=\"A\" class=\"on\">A</button>\n      <button data-t=\"AAAA\">AAAA</button>\n      <button data-t=\"MX\">MX</button>\n      <button data-t=\"TXT\">TXT</button>\n      <button data-t=\"NS\">NS</button>\n      <button data-t=\"CNAME\">CNAME</button>\n      <button data-t=\"SOA\">SOA</button>\n      <button data-t=\"CAA\">CAA</button>\n    </div>\n    <div id=\"dnOut\"><div class=\"msg\">Enter a domain and choose record types.</div></div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst TYPES = new Set(['A']);\nconst RTYPE = { 1:'A', 2:'NS', 5:'CNAME', 6:'SOA', 15:'MX', 16:'TXT', 28:'AAAA', 257:'CAA' };\n\n$('dnTypes').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  const t = b.dataset.t;\n  if (TYPES.has(t) && TYPES.size > 1) TYPES.delete(t); else TYPES.add(t);\n  b.classList.toggle('on', TYPES.has(t));\n};\n\nasync function lookupOne(host, type){\n  // Cloudflare's DNS-over-HTTPS JSON endpoint sends CORS headers, so it works from the browser.\n  const r = await fetch('https://cloudflare-dns.com/dns-query?name=' + encodeURIComponent(host) + '&type=' + type,\n    { headers:{ accept:'application/dns-json' } });\n  if (!r.ok) throw new Error('HTTP ' + r.status);\n  return r.json();\n}\n\nfunction recCard(type, json){\n  const answers = (json.Answer || []).filter(a => RTYPE[a.type] === type || type === 'TXT');\n  const rows = (json.Answer || []).map(a =>\n    '<div class=\"rec\"><div class=\"data\">' + fmt(type, a.data) + '</div><div class=\"ttl\">TTL ' + a.TTL + '</div></div>'\n  ).join('');\n  const status = json.Status === 0\n    ? (json.Answer ? json.Answer.length + ' record' + (json.Answer.length === 1 ? '' : 's') : 'no records')\n    : 'NXDOMAIN / error';\n  return '<div class=\"card\"><h3>' + type + ' <span>' + status + '</span></h3>' +\n    (rows || '<div class=\"msg\">No ' + type + ' records.</div>') + '</div>';\n}\nfunction fmt(type, data){\n  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\n  return esc(data);\n}\n\nasync function run(){\n  const host = $('dnHost').value.trim().replace(/^https?:\\/\\//, '').replace(/\\/.*$/, '');\n  if (!host){ toast('Enter a domain'); return; }\n  const out = $('dnOut');\n  out.innerHTML = '<div class=\"msg\">Resolving ' + host.replace(/[&<>]/g,'') + '\\u2026</div>';\n  const types = [...TYPES];\n  try {\n    const results = await Promise.all(types.map(async t => [t, await lookupOne(host, t)]));\n    out.innerHTML = results.map(([t, j]) => recCard(t, j)).join('');\n  } catch (e){\n    out.innerHTML = '<div class=\"msg err\">Lookup failed: ' + e.message +\n      '<br><br>This tool queries Cloudflare over HTTPS and needs an internet connection.</div>';\n  }\n}\n\n$('dnGo').onclick = run;\n$('dnHost').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });"

      "html": "<div id=\"ip\">\n<style>\n  #ip{padding:26px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #ip .wrap{width:100%;max-width:640px}\n  #ip h2{margin:0 0 18px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #ip .hero{background:#111114;color:#fff;border-radius:20px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden}\n  #ip .hero .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}\n  #ip .hero .addr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:30px;font-weight:600;margin-top:6px;letter-spacing:-.01em;word-break:break-all;cursor:pointer}\n  #ip .hero .sub{margin-top:8px;font-size:13.5px;color:rgba(255,255,255,.65)}\n  #ip .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4);margin-bottom:14px}\n  #ip .card h3{margin:0;padding:12px 16px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;border-bottom:1px solid rgba(60,60,67,.08)}\n  #ip .kv{display:flex;padding:11px 16px;border-bottom:1px solid rgba(60,60,67,.06);gap:14px}\n  #ip .kv:last-child{border-bottom:0}\n  #ip .kv .k{flex:0 0 132px;font-size:13.5px;color:#6E6E76}\n  #ip .kv .v{flex:1;font-size:13.5px;color:#111114;word-break:break-word;text-align:right;font-variant-numeric:tabular-nums}\n  #ip .kv .v.mono{font-family:ui-monospace,Menlo,monospace}\n  #ip .msg{padding:16px;font-size:13px;color:#A6A6AE}\n  #ip .msg.err{color:#B8390E}\n</style>\n  <div class=\"wrap\">\n    <h2>What&rsquo;s my info</h2>\n    <div class=\"hero\">\n      <div class=\"lbl\">Public IP address</div>\n      <div class=\"addr\" id=\"ipAddr\">&hellip;</div>\n      <div class=\"sub\" id=\"ipWhere\">Looking up your connection&hellip;</div>\n    </div>\n    <div class=\"card\"><h3>Network</h3><div id=\"ipNet\"><div class=\"msg\">Loading&hellip;</div></div></div>\n    <div class=\"card\"><h3>This browser &amp; device</h3><div id=\"ipDev\"></div></div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nfunction rows(el, pairs){\n  el.innerHTML = pairs.map(([k, v, mono]) =>\n    '<div class=\"kv\"><div class=\"k\">' + k + '</div><div class=\"v' + (mono ? ' mono' : '') + '\">' + esc(v ?? '\\u2014') + '</div></div>'\n  ).join('');\n}\n\n/* ---------- Local: needs no network ---------- */\n(function deviceInfo(){\n  const n = navigator, s = screen;\n  const langs = (n.languages || [n.language]).join(', ');\n  const cores = n.hardwareConcurrency ? n.hardwareConcurrency + ' logical' : 'unknown';\n  const mem = n.deviceMemory ? '~' + n.deviceMemory + ' GB' : 'unknown';\n  const touch = (n.maxTouchPoints > 0) ? n.maxTouchPoints + ' points' : 'none';\n  const dpr = window.devicePixelRatio || 1;\n  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown';\n  rows($('ipDev'), [\n    ['Platform', n.platform],\n    ['Languages', langs],\n    ['Screen', s.width + ' \\u00d7 ' + s.height + ' @ ' + dpr + 'x', true],\n    ['Viewport', innerWidth + ' \\u00d7 ' + innerHeight + ' px', true],\n    ['Colour depth', s.colorDepth + '-bit'],\n    ['CPU cores', cores],\n    ['Device memory', mem],\n    ['Touch', touch],\n    ['Time zone', tz],\n    ['Cookies', n.cookieEnabled ? 'enabled' : 'disabled'],\n    ['Do Not Track', n.doNotTrack === '1' ? 'on' : 'off']\n  ]);\n})();\n\n$('ipAddr').onclick = () => {\n  const t = $('ipAddr').textContent.trim();\n  if (t && t !== '\\u2026') navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast('Copied'));\n};\n\n/* ---------- Public IP + geo: needs network ---------- */\n(async function ipInfo(){\n  try {\n    // ipwho.is is free, CORS-enabled, and returns IP + geo in one call.\n    const r = await fetch('https://ipwho.is/');\n    const d = await r.json();\n    if (d.success === false) throw new Error(d.message || 'lookup failed');\n    $('ipAddr').textContent = d.ip || 'unknown';\n    const place = [d.city, d.region, d.country].filter(Boolean).join(', ');\n    $('ipWhere').textContent = place ? place + (d.flag && d.flag.emoji ? '  ' + d.flag.emoji : '') : 'Location unavailable';\n    rows($('ipNet'), [\n      ['IP address', d.ip, true],\n      ['Type', d.type],\n      ['ISP', d.connection && d.connection.isp],\n      ['Organisation', d.connection && d.connection.org],\n      ['ASN', d.connection && d.connection.asn ? 'AS' + d.connection.asn : null, true],\n      ['City', d.city],\n      ['Region', d.region],\n      ['Country', d.country ? d.country + ' (' + d.country_code + ')' : null],\n      ['Postal', d.postal],\n      ['Coordinates', (d.latitude != null) ? d.latitude + ', ' + d.longitude : null, true],\n      ['Time zone', d.timezone && d.timezone.id]\n    ]);\n  } catch (e){\n    $('ipAddr').textContent = 'unavailable';\n    $('ipWhere').textContent = 'Could not reach the lookup service';\n    $('ipNet').innerHTML = '<div class=\"msg err\">Public IP lookup failed (' + esc(e.message) +\n      '). It needs an internet connection. Your local device details above still work.</div>';\n  }\n})();"

      "html": "<div id=\"js\">\n<style>\n  #js{position:absolute;inset:0;display:flex;flex-direction:column;background:#F2F2F7}\n  #js .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid rgba(60,60,67,.1);flex-wrap:wrap}\n  #js .bar button{padding:8px 14px;border:1px solid rgba(60,60,67,.14);border-radius:10px;background:#fff;font-size:13.5px;font-weight:560;color:#111114;cursor:pointer;transition:.15s}\n  #js .bar button:hover{border-color:#0A84FF;color:#0A84FF}\n  #js .bar button.primary{background:#0A84FF;border-color:#0A84FF;color:#fff}\n  #js .bar button:active{transform:scale(.96)}\n  #js .bar .spacer{flex:1}\n  #js .bar select{padding:8px 10px;border:1px solid rgba(60,60,67,.14);border-radius:10px;background:#fff;font:inherit;font-size:13.5px}\n  #js .panes{flex:1;display:flex;min-height:0}\n  #js textarea{flex:1;min-width:0;padding:16px 18px;border:0;outline:none;resize:none;background:#fff;\n    font-family:ui-monospace,SFMono-Regular,\"SF Mono\",Menlo,Consolas,monospace;font-size:13px;line-height:1.6;tab-size:2;white-space:pre;overflow:auto}\n  @media (max-width:860px){#js textarea{font-size:16px}}\n  #js .divide{width:1px;background:rgba(60,60,67,.1)}\n  #js #jsView{flex:1;min-width:0;overflow:auto;background:#fff;padding:16px 18px;margin:0;\n    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre}\n  #js .k{color:#0A3069;font-weight:600} #js .s{color:#0A7B3E} #js .n{color:#B8390E}\n  #js .b{color:#8250DF} #js .z{color:#A6A6AE} #js .p{color:#57606A}\n  #js .status{flex:0 0 auto;padding:9px 16px;font-size:13px;background:#fff;border-top:1px solid rgba(60,60,67,.1);\n    font-family:ui-monospace,Menlo,monospace}\n  #js .status.ok{color:#12805C} #js .status.err{color:#B8390E}\n  @media (max-width:760px){#js .panes{flex-direction:column} #js .divide{width:auto;height:1px}}\n</style>\n  <div class=\"bar\">\n    <button class=\"primary\" id=\"jsFmt\">Format</button>\n    <button id=\"jsMin\">Minify</button>\n    <button id=\"jsSort\">Sort keys</button>\n    <select id=\"jsIndent\"><option value=\"2\">2 spaces</option><option value=\"4\">4 spaces</option><option value=\"tab\">Tab</option></select>\n    <span class=\"spacer\"></span>\n    <button id=\"jsCopy\">Copy</button>\n    <button id=\"jsSample\">Sample</button>\n  </div>\n  <div class=\"panes\">\n    <textarea id=\"jsIn\" spellcheck=\"false\" placeholder=\"Paste JSON here\"></textarea>\n    <div class=\"divide\"></div>\n    <pre id=\"jsView\"></pre>\n  </div>\n  <div class=\"status\" id=\"jsStatus\">Waiting for input</div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst inEl = $('jsIn'), view = $('jsView'), status = $('jsStatus');\n\nfunction indentStr(){ const v = $('jsIndent').value; return v === 'tab' ? '\\t' : ' '.repeat(+v); }\n\nfunction sortDeep(x){\n  if (Array.isArray(x)) return x.map(sortDeep);\n  if (x && typeof x === 'object'){\n    const o = {}; Object.keys(x).sort().forEach(k => o[k] = sortDeep(x[k])); return o;\n  }\n  return x;\n}\n\n// Turn a SyntaxError position into a line/column the reader can find.\nfunction locate(text, err){\n  const m = /position (\\d+)/.exec(err.message);\n  if (!m) return '';\n  const pos = +m[1];\n  const upto = text.slice(0, pos);\n  const line = upto.split('\\n').length;\n  const col = pos - upto.lastIndexOf('\\n');\n  return '  (line ' + line + ', column ' + col + ')';\n}\n\nfunction highlight(json){\n  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\n  return esc(json).replace(\n    /(\"(\\\\.|[^\"\\\\])*\")(\\s*:)?|\\b(true|false)\\b|\\bnull\\b|-?\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?/g,\n    (m, str, _c, colon, bool) => {\n      if (str) return colon ? '<span class=\"k\">' + str + '</span><span class=\"p\">:</span>' : '<span class=\"s\">' + str + '</span>';\n      if (bool) return '<span class=\"b\">' + m + '</span>';\n      if (m === 'null') return '<span class=\"z\">null</span>';\n      return '<span class=\"n\">' + m + '</span>';\n    }\n  );\n}\n\nfunction process(transform){\n  const raw = inEl.value.trim();\n  if (!raw){ view.innerHTML = ''; status.className = 'status'; status.textContent = 'Waiting for input'; return; }\n  let data;\n  try { data = JSON.parse(raw); }\n  catch (e){\n    status.className = 'status err';\n    status.textContent = '\\u2716 ' + e.message + locate(raw, e);\n    return;\n  }\n  if (transform) data = transform(data);\n  const text = JSON.stringify(data, null, transform === MINIFY ? 0 : indentStr());\n  view.innerHTML = highlight(text);\n  const bytes = new Blob([text]).size;\n  status.className = 'status ok';\n  status.textContent = '\\u2713 Valid JSON \\u00b7 ' + count(data) + ' \\u00b7 ' + bytes + ' bytes';\n  view.dataset.text = text;\n}\n\nfunction count(x){\n  let keys = 0, arr = 0;\n  (function walk(v){\n    if (Array.isArray(v)){ arr += v.length; v.forEach(walk); }\n    else if (v && typeof v === 'object'){ const k = Object.keys(v); keys += k.length; k.forEach(kk => walk(v[kk])); }\n  })(x);\n  return keys + ' keys, ' + arr + ' array items';\n}\n\nconst MINIFY = x => x;   // sentinel used to signal zero-indent output\n$('jsFmt').onclick    = () => process(null);\n$('jsMin').onclick    = () => process(MINIFY);\n$('jsSort').onclick   = () => process(sortDeep);\n$('jsIndent').onchange = () => process(null);\ninEl.oninput = () => process(null);\n\n$('jsCopy').onclick = () => {\n  const t = view.dataset.text || '';\n  if (!t) return toast('Nothing to copy yet');\n  navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast('Copied'));\n};\n$('jsSample').onclick = () => {\n  inEl.value = '{\"name\":\"Toolbox\",\"version\":2,\"active\":true,\"tags\":[\"cli\",\"web\",null],'\n    + '\"owner\":{\"id\":42,\"email\":\"me@example.com\"},\"scores\":[9.5,8,10]}';\n  process(null);\n};\n\n// Tab inserts two spaces rather than moving focus.\ninEl.addEventListener('keydown', e => {\n  if (e.key !== 'Tab') return;\n  e.preventDefault();\n  const s = inEl.selectionStart;\n  inEl.value = inEl.value.slice(0, s) + '  ' + inEl.value.slice(inEl.selectionEnd);\n  inEl.selectionStart = inEl.selectionEnd = s + 2;\n});"

      "html": "<div id=\"jm\">\n<style>\n  #jm{position:absolute;inset:0;display:flex;flex-direction:column;background:#F2F2F7}\n  #jm .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid rgba(60,60,67,.1);flex-wrap:wrap}\n  #jm .bar button{padding:8px 14px;border:1px solid rgba(60,60,67,.14);border-radius:10px;background:#fff;font-size:13.5px;font-weight:560;color:#111114;cursor:pointer}\n  #jm .bar button:hover{border-color:#0A84FF;color:#0A84FF}\n  #jm .bar button.primary{background:#0A84FF;border-color:#0A84FF;color:#fff}\n  #jm .bar .sp{flex:1}\n  #jm .bar label{display:flex;align-items:center;gap:6px;font-size:13px;color:#6E6E76;cursor:pointer}\n  #jm .panes{flex:1;display:flex;min-height:0}\n  #jm textarea{flex:1;min-width:0;padding:15px 17px;border:0;outline:none;resize:none;background:#fff;\n    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre;overflow:auto;tab-size:2}\n  @media (max-width:860px){#jm textarea{font-size:16px}}\n  #jm .divide{width:1px;background:rgba(60,60,67,.1)}\n  #jm .out{flex:1;min-width:0;display:flex;flex-direction:column;background:#0E1116}\n  #jm .out pre{flex:1;margin:0;padding:15px 17px;overflow:auto;color:#D6DEEB;\n    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-all}\n  #jm .stats{flex:0 0 auto;padding:9px 16px;font-size:12.5px;background:#fff;border-top:1px solid rgba(60,60,67,.1);\n    font-family:ui-monospace,Menlo,monospace;display:flex;gap:16px;flex-wrap:wrap}\n  #jm .stats b{color:#12805C} #jm .stats .e{color:#B8390E}\n  #jm .note{padding:10px 16px;background:#FFF9E8;font-size:12px;color:#5C4A16;line-height:1.5;border-top:1px solid rgba(60,60,67,.08)}\n  @media (max-width:760px){#jm .panes{flex-direction:column} #jm .divide{width:auto;height:1px}}\n</style>\n  <div class=\"bar\">\n    <button class=\"primary\" id=\"jmGo\">Minify</button>\n    <label><input type=\"checkbox\" id=\"jmKeep\"> Keep <code>/*!</code> banners</label>\n    <label><input type=\"checkbox\" id=\"jmSemi\" checked> Preserve newlines at statements</label>\n    <span class=\"sp\"></span>\n    <button id=\"jmCopy\">Copy</button>\n    <button id=\"jmDl\">Download</button>\n    <button id=\"jmSample\">Sample</button>\n  </div>\n  <div class=\"panes\">\n    <textarea id=\"jmIn\" spellcheck=\"false\" placeholder=\"Paste JavaScript here\"></textarea>\n    <div class=\"divide\"></div>\n    <div class=\"out\"><pre id=\"jmOut\"></pre></div>\n  </div>\n  <div class=\"stats\" id=\"jmStats\">Waiting for input</div>\n  <div class=\"note\">Whitespace and comments only &mdash; identifiers are never renamed, so the output stays readable and behaviour is preserved. For aggressive mangling use a build-step minifier like Terser.</div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\n\n/* A conservative minifier: it walks the source character by character so that\n   strings, template literals, regex literals and comments are each handled in\n   their own state. Nothing is renamed, so semantics are untouched. */\nfunction minify(src, opts){\n  let out = '';\n  let i = 0;\n  const n = src.length;\n  const keepBanner = opts.keepBanner;\n\n  // Decide whether a '/' at position i starts a regex literal rather than division,\n  // by looking at the last meaningful character emitted.\n  function regexAllowed(){\n    for (let k = out.length - 1; k >= 0; k--){\n      const c = out[k];\n      if (/\\s/.test(c)) continue;\n      if (/[)\\]}]/.test(c)) return false;\n      if (/[A-Za-z0-9_$]/.test(c)){\n        const m = out.slice(Math.max(0, k - 10), k + 1).match(/[A-Za-z_$][\\w$]*$/);\n        return m ? ['return','typeof','instanceof','in','of','new','delete','void','throw','case','do','else','yield','await'].includes(m[0]) : false;\n      }\n      return true;\n    }\n    return true;\n  }\n  const lastReal = () => { for (let k = out.length - 1; k >= 0; k--) if (!/\\s/.test(out[k])) return out[k]; return ''; };\n\n  while (i < n){\n    const c = src[i], next = src[i + 1];\n\n    // line comment\n    if (c === '/' && next === '/'){\n      while (i < n && src[i] !== '\\n') i++;\n      continue;\n    }\n    // block comment\n    if (c === '/' && next === '*'){\n      const isBanner = src[i + 2] === '!';\n      const end = src.indexOf('*/', i + 2);\n      const stop = end === -1 ? n : end + 2;\n      if (isBanner && keepBanner) out += src.slice(i, stop) + '\\n';\n      i = stop;\n      continue;\n    }\n    // strings\n    if (c === '\"' || c === \"'\"){\n      let j = i + 1;\n      while (j < n){\n        if (src[j] === '\\\\'){ j += 2; continue; }\n        if (src[j] === c) break;\n        j++;\n      }\n      out += src.slice(i, j + 1);\n      i = j + 1;\n      continue;\n    }\n    // template literal (nested ${} handled by depth counting)\n    if (c === '`'){\n      let j = i + 1, depth = 0;\n      while (j < n){\n        if (src[j] === '\\\\'){ j += 2; continue; }\n        if (src[j] === '$' && src[j + 1] === '{'){ depth++; j += 2; continue; }\n        if (src[j] === '}' && depth > 0){ depth--; j++; continue; }\n        if (src[j] === '`' && depth === 0) break;\n        j++;\n      }\n      out += src.slice(i, j + 1);\n      i = j + 1;\n      continue;\n    }\n    // regex literal\n    if (c === '/' && regexAllowed()){\n      let j = i + 1, inClass = false;\n      while (j < n){\n        if (src[j] === '\\\\'){ j += 2; continue; }\n        if (src[j] === '[') inClass = true;\n        else if (src[j] === ']') inClass = false;\n        else if (src[j] === '/' && !inClass) break;\n        else if (src[j] === '\\n') break;\n        j++;\n      }\n      if (src[j] === '/'){\n        j++;\n        while (j < n && /[gimsuyd]/.test(src[j])) j++;\n        out += src.slice(i, j);\n        i = j;\n        continue;\n      }\n    }\n    // whitespace runs\n    if (/\\s/.test(c)){\n      let j = i;\n      let hadNewline = false;\n      while (j < n && /\\s/.test(src[j])){ if (src[j] === '\\n') hadNewline = true; j++; }\n      const before = lastReal(), after = src[j] || '';\n      const wordish = ch => /[A-Za-z0-9_$\\\\]/.test(ch);\n      // a space is only required between two identifier-ish characters,\n      // or where removing a newline could trigger automatic semicolon insertion\n      if (wordish(before) && wordish(after)) out += ' ';\n      else if (hadNewline && opts.keepLines && before && after &&\n               !/[{};,([=+\\-*/%&|!?:<>~^]/.test(before) && !/[})\\];,.=+\\-*/%&|?:<>]/.test(after)) out += '\\n';\n      else if ((before === '+' && after === '+') || (before === '-' && after === '-')) out += ' ';\n      i = j;\n      continue;\n    }\n    out += c;\n    i++;\n  }\n  return out.replace(/\\n{2,}/g, '\\n').replace(/^\\s+|\\s+$/g, '');\n}\n\nfunction run(){\n  const src = $('jmIn').value;\n  if (!src.trim()){\n    $('jmOut').textContent = '';\n    $('jmStats').textContent = 'Waiting for input';\n    return;\n  }\n  let out = '', err = '';\n  try {\n    out = minify(src, { keepBanner: $('jmKeep').checked, keepLines: $('jmSemi').checked });\n  } catch (e){ err = e.message; }\n  $('jmOut').textContent = out;\n  const a = new Blob([src]).size, b = new Blob([out]).size;\n  const pct = a ? Math.round((1 - b / a) * 100) : 0;\n  $('jmStats').innerHTML = err\n    ? '<span class=\"e\">Failed: ' + err + '</span>'\n    : a.toLocaleString() + ' B → <b>' + b.toLocaleString() + ' B</b>' +\n      '  ·  saved <b>' + pct + '%</b>  ·  ' + (a - b).toLocaleString() + ' B removed';\n}\n\n$('jmGo').onclick = run;\n$('jmIn').addEventListener('input', run);\n$('jmKeep').onchange = run;\n$('jmSemi').onchange = run;\n$('jmCopy').onclick = () => {\n  const t = $('jmOut').textContent;\n  if (!t) return toast('Nothing to copy yet');\n  navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast('Copied'));\n};\n$('jmDl').onclick = () => {\n  const t = $('jmOut').textContent;\n  if (!t) return toast('Nothing to download yet');\n  const blob = new Blob([t], { type:'text/javascript' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob); a.download = 'script.min.js'; a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n};\n$('jmSample').onclick = () => {\n  $('jmIn').value = [\n    '/*! demo banner - kept with the banner option on */',\n    '// Count words in a string',\n    'function wordCount (text) {',\n    '    const words = text.match(/[A-Za-z\\'\\u2019]+/g) || [];   // ignore punctuation',\n    '    return words.length;',\n    '}',\n    '',\n    'const greet = (name = \"world\") => {',\n    '    /* template literals survive intact */',\n    '    return `Hello, ${name}! You typed ${wordCount(name)} word(s).`;',\n    '};',\n    '',\n    'export { wordCount, greet };'\n  ].join('\\n');\n  run();\n};\n$('jmIn').addEventListener('keydown', e => {\n  if (e.key !== 'Tab') return;\n  e.preventDefault();\n  const s = $('jmIn').selectionStart;\n  $('jmIn').value = $('jmIn').value.slice(0, s) + '  ' + $('jmIn').value.slice($('jmIn').selectionEnd);\n  $('jmIn').selectionStart = $('jmIn').selectionEnd = s + 2;\n});"

      "html": "<div id=\"b6\">\n<style>\n  #b6{padding:26px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #b6 .wrap{width:100%;max-width:680px}\n  #b6 h2{margin:0 0 18px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #b6 .tabs{display:flex;gap:6px;padding:3px;background:rgba(120,120,128,.12);border-radius:12px;margin-bottom:18px}\n  #b6 .tabs button{flex:1;padding:9px;border:0;border-radius:9px;background:none;font-size:14px;font-weight:560;color:#6E6E76;cursor:pointer;transition:.15s}\n  #b6 .tabs button.on{background:#fff;color:#111114;box-shadow:0 1px 3px rgba(0,0,0,.1)}\n  #b6 .field{margin-bottom:14px}\n  #b6 .field label{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:560;color:#6E6E76;margin-bottom:7px}\n  #b6 .field label button{border:0;background:none;color:#0A84FF;font-size:13px;font-weight:560;cursor:pointer}\n  #b6 textarea{\n    width:100%;min-height:132px;padding:14px;border:1px solid rgba(60,60,67,.16);border-radius:14px;background:#fff;resize:vertical;\n    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.55;color:#111114\n  }\n  @media (max-width:860px){#b6 textarea{font-size:16px}}\n  #b6 textarea:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #b6 .swap{display:flex;justify-content:center;margin:2px 0 12px}\n  #b6 .swap button{width:40px;height:40px;border:1px solid rgba(60,60,67,.16);border-radius:50%;background:#fff;font-size:18px;cursor:pointer;transition:transform .2s}\n  #b6 .swap button:active{transform:rotate(180deg) scale(.9)}\n  #b6 .opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}\n  #b6 .opt{padding:7px 13px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:13px;font-weight:560;color:#6E6E76;cursor:pointer;transition:.15s}\n  #b6 .opt[aria-pressed=true]{background:#0A84FF;border-color:#0A84FF;color:#fff}\n  #b6 .err{font-size:12.5px;color:#E5484D;min-height:16px;margin-top:6px}\n</style>\n  <div class=\"wrap\">\n    <h2>Encode &amp; decode</h2>\n    <div class=\"tabs\" id=\"b6Tabs\">\n      <button data-mode=\"base64\" class=\"on\">Base64</button>\n      <button data-mode=\"url\">URL</button>\n    </div>\n    <div class=\"opts\" id=\"b6Opts\">\n      <button class=\"opt\" data-flag=\"safe\" aria-pressed=\"false\">URL-safe Base64</button>\n      <button class=\"opt\" data-flag=\"comp\" aria-pressed=\"false\">Encode each component</button>\n    </div>\n\n    <div class=\"field\">\n      <label>Plain text <button id=\"b6ClearA\">Clear</button></label>\n      <textarea id=\"b6A\" spellcheck=\"false\" placeholder=\"Type or paste text\"></textarea>\n    </div>\n    <div class=\"swap\"><button id=\"b6Swap\" title=\"Move result up to re-decode\">&#8645;</button></div>\n    <div class=\"field\" style=\"margin-bottom:0\">\n      <label>Encoded <button id=\"b6CopyB\">Copy</button></label>\n      <textarea id=\"b6B\" spellcheck=\"false\" placeholder=\"\\u2026or paste encoded text here to decode\"></textarea>\n    </div>\n    <p class=\"err\" id=\"b6Err\"></p>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst A = $('b6A'), B = $('b6B'), err = $('b6Err');\nconst mode = { kind:'base64', safe:false, comp:false };\n\n// btoa/atob are byte-based; route text through UTF-8 so emoji and accents survive.\nconst enc = new TextEncoder(), dec = new TextDecoder();\nfunction b64encode(str){\n  let bin = '';\n  enc.encode(str).forEach(b => bin += String.fromCharCode(b));\n  let out = btoa(bin);\n  if (mode.safe) out = out.replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=+$/, '');\n  return out;\n}\nfunction b64decode(str){\n  let s = str.trim().replace(/-/g, '+').replace(/_/g, '/').replace(/\\s+/g, '');\n  while (s.length % 4) s += '=';\n  const bin = atob(s);\n  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));\n  return dec.decode(bytes);\n}\nfunction urlEncode(str){ return mode.comp ? encodeURIComponent(str) : encodeURI(str); }\nfunction urlDecode(str){ return decodeURIComponent(str.replace(/\\+/g, ' ')); }\n\nfunction encode(){\n  err.textContent = '';\n  const t = A.value;\n  if (!t){ B.value = ''; return; }\n  try { B.value = mode.kind === 'base64' ? b64encode(t) : urlEncode(t); }\n  catch (e){ err.textContent = 'Could not encode: ' + e.message; }\n}\nfunction decode(){\n  err.textContent = '';\n  const t = B.value;\n  if (!t){ A.value = ''; return; }\n  try { A.value = mode.kind === 'base64' ? b64decode(t) : urlDecode(t); }\n  catch (e){ err.textContent = mode.kind === 'base64' ? 'That is not valid Base64' : 'That is not valid percent-encoding'; }\n}\n\nA.addEventListener('input', encode);\nB.addEventListener('input', decode);\n\n$('b6Tabs').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  mode.kind = b.dataset.mode;\n  document.querySelectorAll('#b6Tabs button').forEach(x => x.classList.toggle('on', x === b));\n  document.querySelectorAll('#b6Opts .opt').forEach(o => {\n    o.style.display = (o.dataset.flag === 'safe' && mode.kind !== 'base64') ||\n                      (o.dataset.flag === 'comp' && mode.kind !== 'url') ? 'none' : '';\n  });\n  encode();\n};\n$('b6Opts').onclick = e => {\n  const b = e.target.closest('.opt'); if (!b) return;\n  mode[b.dataset.flag] = !mode[b.dataset.flag];\n  b.setAttribute('aria-pressed', mode[b.dataset.flag]);\n  encode();\n};\n$('b6Swap').onclick = () => { A.value = B.value; B.value = ''; decode(); };\n$('b6ClearA').onclick = () => { A.value = ''; B.value = ''; err.textContent = ''; };\n$('b6CopyB').onclick = () => {\n  if (!B.value) return toast('Nothing to copy');\n  navigator.clipboard.writeText(B.value).then(() => toast('Copied'), () => toast('Copied'));\n};\n\n// hide the option that doesn't apply to the starting tab\ndocument.querySelector('#b6Opts .opt[data-flag=\"comp\"]').style.display = 'none';"

      "html": "<div id=\"qr\">\n<style>\n  #qr{padding:26px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #qr .wrap{width:100%;max-width:560px}\n  #qr .tabs{display:flex;gap:6px;padding:3px;background:rgba(120,120,128,.12);border-radius:12px;margin-bottom:20px}\n  #qr .tabs button{flex:1;padding:9px;border:0;border-radius:9px;background:none;font-size:14px;font-weight:560;color:#6E6E76;cursor:pointer;transition:.15s}\n  #qr .tabs button.on{background:#fff;color:#111114;box-shadow:0 1px 3px rgba(0,0,0,.1)}\n  #qr .pane{display:none} #qr .pane.on{display:block}\n  #qr .canvaswrap{display:flex;justify-content:center;margin-bottom:18px}\n  #qr .canvaswrap .plate{padding:18px;background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 16px 34px -22px rgba(16,24,40,.5)}\n  #qr canvas{display:block;image-rendering:pixelated;width:256px;height:256px;border-radius:6px}\n  #qr textarea{\n    width:100%;min-height:96px;padding:14px;border:1px solid rgba(60,60,67,.16);border-radius:14px;background:#fff;resize:vertical;\n    font:inherit;font-size:16px;line-height:1.5;color:#111114;margin-bottom:14px\n  }\n  #qr textarea:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #qr .row{display:flex;gap:10px;align-items:center;margin-bottom:14px}\n  #qr .row label{font-size:13px;font-weight:560;color:#6E6E76}\n  #qr select{padding:9px 11px;border:1px solid rgba(60,60,67,.14);border-radius:11px;background:#fff;font:inherit;font-size:14px}\n  #qr .btns{display:flex;gap:8px;flex-wrap:wrap}\n  #qr .btn{padding:11px 16px;border:0;border-radius:12px;background:#0A84FF;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .15s}\n  #qr .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #qr .btn:active{transform:scale(.97)}\n  #qr .drop{\n    border:1.5px dashed rgba(60,60,67,.28);border-radius:18px;padding:38px 20px;text-align:center;color:#8E8E96;\n    font-size:14.5px;cursor:pointer;transition:.15s;background:#fff\n  }\n  #qr .drop.hot{border-color:#0A84FF;color:#0A84FF;background:rgba(10,132,255,.04)}\n  #qr .result{margin-top:16px;padding:16px;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4);display:none}\n  #qr .result.on{display:block}\n  #qr .result .lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin-bottom:8px}\n  #qr .result .val{font-family:ui-monospace,Menlo,monospace;font-size:14px;word-break:break-all;line-height:1.5}\n  #qr .result .val a{color:#0A84FF}\n  #qr .note{font-size:12.5px;color:#A6A6AE;margin-top:12px;line-height:1.5;text-align:center}\n  #qr .cam{width:100%;border-radius:14px;display:none;margin-bottom:12px;background:#000}\n</style>\n  <div class=\"wrap\">\n    <div class=\"tabs\" id=\"qrTabs\">\n      <button data-pane=\"gen\" class=\"on\">Generate</button>\n      <button data-pane=\"read\">Read</button>\n    </div>\n\n    <div class=\"pane on\" id=\"qrGen\">\n      <div class=\"canvaswrap\"><div class=\"plate\"><canvas id=\"qrCanvas\" width=\"256\" height=\"256\"></canvas></div></div>\n      <textarea id=\"qrText\" placeholder=\"Text or URL to encode\" spellcheck=\"false\">https://claude.ai</textarea>\n      <div class=\"row\">\n        <label for=\"qrEc\">Error correction</label>\n        <select id=\"qrEc\"><option value=\"M\">Medium</option><option value=\"L\">Low</option><option value=\"Q\">Quartile</option><option value=\"H\">High</option></select>\n      </div>\n      <div class=\"btns\">\n        <button class=\"btn\" id=\"qrDownload\">Download PNG</button>\n        <button class=\"btn ghost\" id=\"qrCopyImg\">Copy image</button>\n      </div>\n    </div>\n\n    <div class=\"pane\" id=\"qrRead\">\n      <div class=\"btns\" style=\"margin-bottom:14px\">\n        <button class=\"btn\" id=\"qrCamBtn\">Use camera</button>\n        <button class=\"btn ghost\" id=\"qrPickBtn\">Choose image</button>\n      </div>\n      <video class=\"cam\" id=\"qrCam\" playsinline muted></video>\n      <div class=\"drop\" id=\"qrDrop\">Drop an image here, or tap &ldquo;Choose image&rdquo;</div>\n      <input type=\"file\" id=\"qrFile\" accept=\"image/*\" hidden>\n      <div class=\"result\" id=\"qrResult\">\n        <div class=\"lbl\">Decoded</div>\n        <div class=\"val\" id=\"qrOut\"></div>\n        <div class=\"btns\" style=\"margin-top:12px\"><button class=\"btn ghost\" id=\"qrCopyText\">Copy text</button></div>\n      </div>\n      <p class=\"note\" id=\"qrReadNote\"></p>\n    </div>\n  </div>\n</div>",

      "html": "<div id=\"cl\">\n<style>\n  #cl{padding:26px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #cl .wrap{width:100%;max-width:560px}\n  #cl .hero{border-radius:22px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05),0 18px 40px -24px rgba(16,24,40,.55);margin-bottom:18px}\n  #cl .swatch{height:180px;position:relative;cursor:pointer}\n  #cl .swatch input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}\n  #cl .swatch .tap{position:absolute;left:16px;bottom:14px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);color:#111}\n  #cl .vals{background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(60,60,67,.1)}\n  #cl .val{background:#fff;padding:13px 16px;cursor:pointer;transition:background .12s}\n  #cl .val:hover{background:#F7F7FA}\n  #cl .val .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A6A6AE}\n  #cl .val .v{font-family:ui-monospace,Menlo,monospace;font-size:15px;margin-top:3px;color:#111114}\n  #cl .card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #cl .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:0 0 14px}\n  #cl .sliders label{display:flex;justify-content:space-between;font-size:13px;font-weight:560;color:#6E6E76;margin-bottom:6px}\n  #cl .sliders label b{font-family:ui-monospace,Menlo,monospace;color:#111114}\n  #cl input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;margin:0 0 16px}\n  #cl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.1);cursor:pointer}\n  #cl input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}\n  #cl .hexin{display:flex;gap:8px;margin-bottom:2px}\n  #cl .hexin input{flex:1;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;font-family:ui-monospace,Menlo,monospace;font-size:16px;text-transform:uppercase}\n  #cl .hexin input:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #cl .hexin button{padding:0 16px;border:0;border-radius:12px;background:#111114;color:#fff;font-size:14px;font-weight:560;cursor:pointer}\n  #cl .palette{display:flex;border-radius:12px;overflow:hidden}\n  #cl .palette div{flex:1;height:52px;cursor:pointer;position:relative}\n  #cl .palette div span{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;opacity:0;transition:.15s}\n  #cl .palette div:hover span{opacity:1}\n  #cl .contrast{display:flex;gap:12px;align-items:stretch}\n  #cl .cpreview{flex:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;min-height:66px}\n  #cl .cinfo{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:12.5px}\n  #cl .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}\n  #cl .badge.pass{background:rgba(48,164,108,.16);color:#12805C} #cl .badge.fail{background:rgba(229,72,77,.16);color:#B8390E}\n  #cl .ratio{font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:600;color:#111114}\n</style>\n  <div class=\"wrap\">\n    <div class=\"hero\">\n      <div class=\"swatch\" id=\"clSwatch\">\n        <input type=\"color\" id=\"clPicker\" value=\"#0A84FF\">\n        <span class=\"tap\">Tap to pick</span>\n      </div>\n      <div class=\"vals\" id=\"clVals\"></div>\n    </div>\n\n    <div class=\"card\">\n      <p class=\"cap\">Adjust</p>\n      <div class=\"hexin\">\n        <input id=\"clHex\" value=\"#0A84FF\" spellcheck=\"false\" maxlength=\"7\">\n        <button id=\"clRandom\">Random</button>\n      </div>\n      <div class=\"sliders\" id=\"clSliders\" style=\"margin-top:16px\">\n        <label>Red <b id=\"clRv\">10</b></label><input type=\"range\" id=\"clR\" min=\"0\" max=\"255\" value=\"10\">\n        <label>Green <b id=\"clGv\">132</b></label><input type=\"range\" id=\"clG\" min=\"0\" max=\"255\" value=\"132\">\n        <label>Blue <b id=\"clBv\">255</b></label><input type=\"range\" id=\"clB\" min=\"0\" max=\"255\" value=\"255\">\n      </div>\n    </div>\n\n    <div class=\"card\">\n      <p class=\"cap\">Harmonies</p>\n      <div class=\"palette\" id=\"clPalette\"></div>\n    </div>\n\n    <div class=\"card\" style=\"margin-bottom:0\">\n      <p class=\"cap\">Contrast check</p>\n      <div class=\"contrast\">\n        <div class=\"cpreview\" id=\"clCP\">Sample text</div>\n        <div class=\"cinfo\">\n          <span class=\"ratio\" id=\"clRatio\">&mdash;</span>\n          <span><span class=\"badge\" id=\"clAA\">AA</span> <span class=\"badge\" id=\"clAAA\">AAA</span></span>\n          <span style=\"color:#A6A6AE\">vs white / black</span>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nlet rgb = { r:10, g:132, b:255 };\n\nconst hex2 = n => n.toString(16).padStart(2, '0');\nconst toHex = ({r,g,b}) => '#' + hex2(r) + hex2(g) + hex2(b);\nfunction parseHex(s){\n  s = s.trim().replace(/^#/, '');\n  if (/^[0-9a-f]{3}$/i.test(s)) s = s.split('').map(c => c + c).join('');\n  if (!/^[0-9a-f]{6}$/i.test(s)) return null;\n  return { r:parseInt(s.slice(0,2),16), g:parseInt(s.slice(2,4),16), b:parseInt(s.slice(4,6),16) };\n}\nfunction rgb2hsl({r,g,b}){\n  r/=255; g/=255; b/=255;\n  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;\n  let h=0, s=0, l=(max+min)/2;\n  if (d){\n    s = l > .5 ? d/(2-max-min) : d/(max+min);\n    h = max===r ? (g-b)/d + (g<b?6:0) : max===g ? (b-r)/d + 2 : (r-g)/d + 4;\n    h *= 60;\n  }\n  return { h:Math.round(h), s:Math.round(s*100), l:Math.round(l*100) };\n}\nfunction hsl2rgb(h,s,l){\n  s/=100; l/=100;\n  const k = n => (n + h/30) % 12;\n  const a = s * Math.min(l, 1-l);\n  const f = n => l - a * Math.max(-1, Math.min(k(n)-3, 9-k(n), 1));\n  return { r:Math.round(f(0)*255), g:Math.round(f(8)*255), b:Math.round(f(4)*255) };\n}\nconst relLum = ({r,g,b}) => {\n  const f = c => { c/=255; return c <= .03928 ? c/12.92 : ((c+.055)/1.055)**2.4; };\n  return .2126*f(r) + .7152*f(g) + .0722*f(b);\n};\nconst contrast = (a,b) => { const l1=relLum(a), l2=relLum(b); return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05); };\n\nfunction copy(text){ navigator.clipboard.writeText(text).then(() => toast('Copied ' + text), () => toast('Copied')); }\n\nfunction render(){\n  const hex = toHex(rgb);\n  const hsl = rgb2hsl(rgb);\n\n  $('clPicker').value = hex;\n  $('clHex').value = hex.toUpperCase();\n  $('clR').value = rgb.r; $('clG').value = rgb.g; $('clB').value = rgb.b;\n  $('clRv').textContent = rgb.r; $('clGv').textContent = rgb.g; $('clBv').textContent = rgb.b;\n  $('clSwatch').style.background = hex;\n\n  ['clR','clG','clB'].forEach(id => {\n    const base = { clR:'255,0,0', clG:'0,255,0', clB:'0,0,255' }[id];\n    $(id).style.background = 'linear-gradient(90deg, #000, rgb(' + base + '))';\n  });\n\n  const vals = [\n    ['HEX', hex.toUpperCase()],\n    ['RGB', 'rgb(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ')'],\n    ['HSL', 'hsl(' + hsl.h + ', ' + hsl.s + '%, ' + hsl.l + '%)'],\n    ['CSS', hex.toUpperCase()]\n  ];\n  $('clVals').innerHTML = vals.map(([k,v]) =>\n    '<div class=\"val\" data-c=\"' + v + '\"><div class=\"k\">' + k + '</div><div class=\"v\">' + v + '</div></div>'\n  ).join('');\n  $('clVals').querySelectorAll('.val').forEach(el => el.onclick = () => copy(el.dataset.c));\n\n  // harmonies: complementary, triadic, analogous, split\n  const offs = [0, 180, 120, 240, 30, -30];\n  $('clPalette').innerHTML = offs.map(o => {\n    const c = toHex(hsl2rgb((hsl.h + o + 360) % 360, hsl.s, hsl.l));\n    return '<div style=\"background:' + c + '\" data-c=\"' + c + '\"><span style=\"color:' +\n      (relLum(parseHex(c)) > .4 ? '#000' : '#fff') + '\">' + c.slice(1).toUpperCase() + '</span></div>';\n  }).join('');\n  $('clPalette').querySelectorAll('div[data-c]').forEach(el => el.onclick = () => copy(el.dataset.c.toUpperCase()));\n\n  // contrast vs whichever of black/white reads better on this colour\n  const cw = contrast(rgb, {r:255,g:255,b:255});\n  const cb = contrast(rgb, {r:0,g:0,b:0});\n  const best = cw >= cb ? { c:'#fff', ratio:cw } : { c:'#111', ratio:cb };\n  $('clCP').style.background = hex; $('clCP').style.color = best.c;\n  $('clRatio').textContent = best.ratio.toFixed(2) + ':1';\n  const aa = best.ratio >= 4.5, aaa = best.ratio >= 7;\n  $('clAA').className = 'badge ' + (aa ? 'pass' : 'fail');\n  $('clAAA').className = 'badge ' + (aaa ? 'pass' : 'fail');\n}\n\nfunction setRgb(next){ rgb = next; render(); }\n\n$('clPicker').oninput = e => setRgb(parseHex(e.target.value));\n$('clHex').oninput = e => { const p = parseHex(e.target.value); if (p) setRgb(p); };\n['clR','clG','clB'].forEach(id => $(id).oninput = () => setRgb({\n  r:+$('clR').value, g:+$('clG').value, b:+$('clB').value\n}));\n$('clRandom').onclick = () => setRgb({ r:rnd(), g:rnd(), b:rnd() });\nfunction rnd(){ return crypto.getRandomValues(new Uint8Array(1))[0]; }\n\nrender();"
    }
