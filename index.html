<script type="text/x-tool" data-id="recipe" data-part="js">
let recipes=[],cur=null,scale=1;
const UNITS=['g','kg','ml','l','tsp','tbsp','cup','pinch','clove','slice','can','pcs',''];
const blank=()=>({id:uid(),name:'New recipe',desc:'',serves:4,tags:[],notes:'',
  ings:[{id:uid(),q:'',u:'g',n:''}],steps:[{id:uid(),t:'',m:0,p:false,w:-1}],u:Date.now()});
const save=async()=>{cur&&(cur.u=Date.now());await Tool.set('recipes',recipes)};
const fmtM=m=>m>=60?Math.floor(m/60)+'h '+(m%60?(m%60)+'m':''):m+'m';

function drawList(){
  $('#rl').innerHTML=recipes.length?recipes.slice().sort((a,b)=>b.u-a.u).map(r=>{
    const tot=r.steps.reduce((a,s)=>a+(+s.m||0),0);
    return '<div class="rcard" data-i="'+r.id+'"><b>'+esc(r.name)+'</b>'+
      '<small>'+r.ings.filter(i=>i.n).length+' ingredients · '+r.steps.filter(s=>s.t).length+' steps'+
      (tot?' · '+fmtM(tot):'')+'</small>'+
      (r.desc?'<div class="hint" style="margin-top:8px">'+esc(r.desc.slice(0,80))+'</div>':'')+'</div>'}).join('')
    :'<div class="empty">No recipes yet. Create your first one.</div>';
  $$('.rcard').forEach(c=>c.onclick=()=>openR(c.dataset.i));
}
function openR(id){cur=recipes.find(r=>r.id===id);scale=1;
  $('#listview').style.display='none';$('#editview').style.display='';drawEdit()}
function drawEdit(){
  const r=cur;const tot=r.steps.reduce((a,s)=>a+(+s.m||0),0);
  const act=r.steps.filter(s=>!s.p).reduce((a,s)=>a+(+s.m||0),0);
  $('#ed').innerHTML=
  '<div class="grp"><div class="row"><label class="fl">Name</label><input class="fld" id="fname" value="'+esc(r.name)+'"></div>'+
  '<div class="row"><label class="fl">Short description</label><input class="fld" id="fdesc" value="'+esc(r.desc)+'"></div>'+
  '<div style="display:flex;gap:12px;flex-wrap:wrap"><div style="flex:0 0 110px"><label class="fl">Serves</label>'+
  '<input class="fld" id="fserves" type="number" min="1" value="'+r.serves+'"></div>'+
  '<div class="grow"><label class="fl">Tags (comma separated)</label><input class="fld" id="ftags" value="'+esc((r.tags||[]).join(', '))+'"></div></div>'+
  '<div class="hint" style="margin-top:12px">Total '+fmtM(tot)+' · hands-on '+fmtM(act)+' · waiting '+fmtM(tot-act)+'</div></div>'+

  '<div class="grp"><h2>Ingredients'+
  '<span class="chip" id="scalechip" style="margin-left:8px">×'+scale+'</span>'+
  '<button class="btn sm" id="addi">Add</button></h2><div id="ings"></div>'+
  '<div style="display:flex;gap:6px;margin-top:10px;align-items:center"><span class="hint" style="margin:0">Scale:</span>'+
  [0.5,1,2,3].map(s=>'<button class="btn sm'+(scale===s?' on':'')+'" data-sc="'+s+'">×'+s+'</button>').join('')+
  '<button class="btn sm" id="shop" style="margin-left:auto">Shopping list</button></div></div>'+

  '<div class="grp"><h2>Method<button class="btn sm" id="adds">Add step</button></h2><div id="steps"></div>'+
  '<div class="hint">Mark a step <b>hands-off</b> (baking, proving, chilling) and the cook-along will start its timer, then let you get on with the next step. Use <b>wait for</b> when a step can only begin once an earlier timer finishes.</div></div>'+

  '<div class="grp"><h2>Notes</h2><textarea class="fld" id="fnotes" rows="3" placeholder="Substitutions, storage, where it came from…">'+esc(r.notes||'')+'</textarea></div>';

  const bind=(id,key,num)=>$('#'+id).oninput=e=>{r[key]=num?(+e.target.value||1):e.target.value;save();if(num)drawEdit()};
  bind('fname','name');bind('fdesc','desc');bind('fnotes','notes');
  $('#fserves').onchange=e=>{r.serves=+e.target.value||1;save()};
  $('#ftags').oninput=e=>{r.tags=e.target.value.split(',').map(s=>s.trim()).filter(Boolean);save()};
  $('#addi').onclick=()=>{r.ings.push({id:uid(),q:'',u:'g',n:''});save();drawEdit()};
  $('#adds').onclick=()=>{r.steps.push({id:uid(),t:'',m:0,p:false,w:-1});save();drawEdit()};
  $$('[data-sc]').forEach(b=>b.onclick=()=>{scale=+b.dataset.sc;drawEdit()});
  $('#shop').onclick=shopping;
  drawIngs();drawSteps();
}
function drawIngs(){
  const r=cur;
  $('#ings').innerHTML=r.ings.map((i,ix)=>'<div class="ing" data-x="'+ix+'">'+
    '<input class="fld" style="width:78px" data-f="q" value="'+esc(i.q)+'" placeholder="qty">'+
    '<select class="fld" style="width:88px" data-f="u">'+UNITS.map(u=>'<option'+(u===i.u?' selected':'')+'>'+u+'</option>').join('')+'</select>'+
    '<input class="fld grow" data-f="n" value="'+esc(i.n)+'" placeholder="ingredient">'+
    '<button class="rm" data-rm="1">×</button></div>').join('');
  $$('#ings .ing').forEach(row=>{const ix=+row.dataset.x;
    row.querySelectorAll('[data-f]').forEach(f=>{const h=()=>{r.ings[ix][f.dataset.f]=f.value;save()};f.oninput=h;f.onchange=h});
    row.querySelector('[data-rm]').onclick=()=>{r.ings.splice(ix,1);save();drawEdit()}});
  if(scale!==1)$$('#ings [data-f="q"]').forEach((f,ix)=>{const n=parseFloat(r.ings[ix].q);
    if(!isNaN(n))f.value=+(n*scale).toFixed(2)});
}
function drawSteps(){
  const r=cur;
  $('#steps').innerHTML=r.steps.map((s,ix)=>{
    const waits=r.steps.map((o,j)=>j<ix&&o.p?'<option value="'+j+'"'+(s.w===j?' selected':'')+'>after step '+(j+1)+'</option>':'').join('');
    return '<div class="stp" style="flex-direction:column;align-items:stretch;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:10px" data-x="'+ix+'">'+
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">'+
    '<span class="chip">Step '+(ix+1)+'</span>'+
    '<input class="fld" style="width:92px" type="number" min="0" data-f="m" value="'+(s.m||0)+'" placeholder="min"> <span class="hint" style="margin:0">min</span>'+
    '<label style="display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--dim)"><input type="checkbox" data-f="p"'+(s.p?' checked':'')+'> hands-off</label>'+
    (waits?'<select class="fld" style="width:auto" data-f="w"><option value="-1">no wait</option>'+waits+'</select>':'')+
    '<div class="grow"></div><button class="btn sm gho" data-up="1">↑</button><button class="btn sm gho" data-dn="1">↓</button>'+
    '<button class="rm" data-rm="1">×</button></div>'+
    '<textarea class="fld" rows="2" data-f="t" placeholder="Describe this step">'+esc(s.t)+'</textarea></div>'}).join('');
  $$('#steps .stp').forEach(row=>{const ix=+row.dataset.x;
    row.querySelectorAll('[data-f]').forEach(f=>{const h=()=>{
      const k=f.dataset.f;cur.steps[ix][k]=k==='p'?f.checked:(k==='m'||k==='w')?+f.value:f.value;save();
      if(k==='p'||k==='w')drawSteps()};f.oninput=h;f.onchange=h});
    row.querySelector('[data-rm]').onclick=()=>{cur.steps.splice(ix,1);save();drawEdit()};
    row.querySelector('[data-up]').onclick=()=>{if(!ix)return;const a=cur.steps;[a[ix-1],a[ix]]=[a[ix],a[ix-1]];save();drawEdit()};
    row.querySelector('[data-dn]').onclick=()=>{const a=cur.steps;if(ix>=a.length-1)return;[a[ix+1],a[ix]]=[a[ix],a[ix+1]];save();drawEdit()}});
}
function shopping(){
  const l=cur.ings.filter(i=>i.n).map(i=>{const n=parseFloat(i.q);
    return '• '+(i.q?((isNaN(n)?i.q:+(n*scale).toFixed(2))+' '+i.u+' '):'')+i.n}).join('\n');
  dialog({title:'Shopping list',body:'<textarea class="fld" rows="10" id="sl">'+esc(cur.name+' (serves '+Math.round(cur.serves*scale)+')\n\n'+l)+'</textarea>',
    buttons:[{label:'Copy',cls:'pri',close:false,onClick:b=>copyText(b.querySelector('#sl').value)},{label:'Close',cls:'gho'}]})
}
/* ---------- cook mode ---------- */
let ci=0,timers=[],tick=null,startT=0;
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();
  const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
  o.frequency.value=880;g.gain.value=.12;o.start();
  o.frequency.setValueAtTime(660,a.currentTime+.18);o.stop(a.currentTime+.4)}catch(e){}}
function startCook(){
  if(!cur.steps.filter(s=>s.t).length)return toast('Add some steps first');
  ci=0;timers=[];startT=Date.now();$('#cook').classList.add('on');$('#cname').textContent=cur.name;
  drawCook();clearInterval(tick);tick=setInterval(tickFn,500);
}
function tickFn(){
  const el=Math.floor((Date.now()-startT)/1000);
  $('#celapsed').textContent=Math.floor(el/60)+':'+String(el%60).padStart(2,'0');
  let changed=false;
  timers.forEach(t=>{const left=Math.max(0,t.end-Date.now());
    if(left===0&&!t.rang){t.rang=true;beep();changed=true;toast(t.label+' is ready')}});
  drawTimers();
  if(changed)drawCook();
}
function drawTimers(){
  $('#ctimers').innerHTML=timers.length?timers.map(t=>{
    const left=Math.max(0,Math.round((t.end-Date.now())/1000));
    return '<div class="tmr'+(left===0?' done':'')+'"><span>'+esc(t.label)+'</span>'+
      '<b>'+(left===0?'DONE':Math.floor(left/60)+':'+String(left%60).padStart(2,'0'))+'</b>'+
      '<button class="rm" data-t="'+t.id+'">×</button></div>'}).join('')
    :'<div class="hint" style="margin:0">Nothing running.</div>';
  $$('#ctimers [data-t]').forEach(b=>b.onclick=()=>{timers=timers.filter(t=>t.id!==b.dataset.t);drawTimers()});
}
function drawCook(){
  const steps=cur.steps.filter(s=>s.t);
  const s=steps[ci];if(!s){$('#cstep').textContent='All done. Enjoy.';$('#cnum').textContent='FINISHED';
    $('#cprog').style.width='100%';$('#cstart').style.display='none';$('#cnext').textContent='Exit';return}
  $('#cnum').textContent='STEP '+(ci+1)+' OF '+steps.length+(s.p?' · HANDS-OFF':'')+(s.m?' · '+fmtM(s.m):'');
  $('#cstep').textContent=s.t;
  $('#cprog').style.width=(ci/steps.length*100)+'%';
  const pend=s.w>=0&&timers.some(t=>t.step===s.w&&t.end>Date.now());
  $('#cingr').innerHTML=pend?'<span style="color:var(--brass)">Waiting on the timer from step '+(s.w+1)+'.</span>':'';
  $('#cstart').style.display=s.m?'':'none';
  $('#cstart').textContent=timers.some(t=>t.step===ci)?'Timer running':'Start '+fmtM(s.m)+' timer';
  $('#cstart').disabled=timers.some(t=>t.step===ci);
  $('#cnext').textContent=ci>=steps.length-1?'Finish':(s.p&&s.m?'Start and continue':'Next step');
  $('#cprev').disabled=ci===0;
  drawTimers();
}
function addTimer(i){
  const steps=cur.steps.filter(s=>s.t),s=steps[i];if(!s||!s.m)return;
  if(timers.some(t=>t.step===i))return;
  timers.push({id:uid(),step:i,label:'Step '+(i+1)+': '+s.t.slice(0,34),end:Date.now()+s.m*60000});
}
$('#cstart').onclick=()=>{addTimer(ci);drawCook()};
$('#cnext').onclick=()=>{const steps=cur.steps.filter(s=>s.t);
  if(ci>=steps.length){exitCook();return}
  const s=steps[ci];if(s.p&&s.m)addTimer(ci);
  ci++;if(ci>steps.length)ci=steps.length;drawCook()};
$('#cprev').onclick=()=>{if(ci>0)ci--;drawCook()};
$('#cx').onclick=()=>{if(timers.some(t=>t.end>Date.now()))
  confirmBox('Leave cook mode?','Timers that are still running will be lost.',exitCook,true);else exitCook()};
function exitCook(){$('#cook').classList.remove('on');clearInterval(tick);timers=[];
  $('#cstart').style.display='';$('#cnext').textContent='Next step'}
/* ---------- top level ---------- */
$('#newr').onclick=async()=>{const r=blank();recipes.push(r);await save();openR(r.id)};
$('#back').onclick=()=>{$('#editview').style.display='none';$('#listview').style.display='';drawList()};
$('#make').onclick=startCook;
$('#delr').onclick=()=>confirmBox('Delete recipe?','"'+esc(cur.name)+'" will be removed.',async()=>{
  recipes=recipes.filter(r=>r.id!==cur.id);await Tool.set('recipes',recipes);
  $('#editview').style.display='none';$('#listview').style.display='';drawList()},true);
$('#expo').onclick=()=>download(cur.name.replace(/\W+/g,'-').toLowerCase()+'.json','application/json',JSON.stringify(cur,null,2));
$('#imp').onclick=()=>dialog({title:'Import recipe JSON',
  body:'<textarea class="fld" rows="8" id="ij" placeholder=\'{"name":"…","ings":[…],"steps":[…]}\'></textarea>',
  buttons:[{label:'Cancel',cls:'gho'},{label:'Import',cls:'pri',onClick:async b=>{
    try{const o=JSON.parse(b.querySelector('#ij').value);const arr=Array.isArray(o)?o:[o];
      arr.forEach(r=>{r.id=uid();r.u=Date.now();r.ings=r.ings||[];r.steps=r.steps||[];recipes.push(r)});
      await Tool.set('recipes',recipes);drawList();toast('Imported '+arr.length)}
    catch(e){toast('Invalid JSON');return false}}}]});
(async()=>{recipes=(await Tool.get('recipes'))||[];drawList()})();
</script>

<script type="text/x-tool" data-id="pwd" data-part="html" data-name="Password Manager" data-icon="key" data-color="pine" data-desc="AES-GCM encrypted vault with unlimited custom fields, TOTP codes and a password generator.">
<style>
  #gate{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:10;background:var(--bg)}
  #gate .box{width:min(400px,100%);text-align:center}
  #gate .lockic{width:52px;height:52px;margin:0 auto 16px;border-radius:16px;background:#12312F;
    display:grid;place-items:center;border:1px solid var(--accent-dim)}

const B64=b=>btoa(String.fromCharCode.apply(null,new Uint8Array(b)));
const UNB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ITER=310000;
let KEY=null,DATA={accounts:[]},idleT=null,ticker=null;
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,
    {name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptVault(){
  const v=await Tool.get('vault');
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify(DATA)));
  await Tool.set('vault',{salt:v.salt,iter:v.iter,iv:B64(iv),ct:B64(ct),v:1,updated:Date.now()});
}
/* ---------- gate ---------- */

  $('#gsub').textContent=mode==='create'
    ?'Everything is encrypted with AES-GCM using a key stretched from this password. It never leaves this browser.'
    :'Enter the master password for this vault.';
  $('#gbtn').textContent=mode==='create'?'Create vault':'Unlock';
  $('#mp2').style.display=mode==='create'?'':'none';

}

  $('#gmeter').firstElementChild.style.background=s.col};

$('#mp2').onkeydown=e=>{if(e.key==='Enter')$('#gbtn').click()};
$('#gbtn').onclick=async()=>{

  if(pw.length<8)return $('#gerr').textContent='Use at least 8 characters.';
  $('#gbtn').disabled=true;$('#gbtn').textContent='Working…';
  try{
    if(mode==='create'){
      if(pw!==$('#mp2').value){$('#gerr').textContent='The two passwords do not match.';return}
      const salt=crypto.getRandomValues(new Uint8Array(16));
      KEY=await deriveKey(pw,salt,ITER);
      await Tool.set('vault',{salt:B64(salt),iter:ITER,iv:'',ct:'',v:1});
      DATA={accounts:[]};await encryptVault();openApp();
    }else{
      const v=await Tool.get('vault');
      KEY=await deriveKey(pw,UNB64(v.salt),v.iter||ITER);
      if(!v.ct){DATA={accounts:[]}}
      else{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:UNB64(v.iv)},KEY,UNB64(v.ct));
        DATA=JSON.parse(new TextDecoder().decode(pt))}

/* ---------- strength ---------- */
function strength(p){
  let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(p.length>=18)s++;
  if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;
  const pct=Math.min(100,s/6*100);
  const col=pct<34?'#E5534B':pct<67?'#E8A44C':'#5BC77A';
  return{pct,col,label:pct<34?'weak':pct<67?'fair':'strong',score:s}
}
/* ---------- TOTP ---------- */
function b32(s){s=s.replace(/[=\s]/g,'').toUpperCase();const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  let bits='',out=[];for(const c of s){const i=A.indexOf(c);if(i<0)continue;bits+=i.toString(2).padStart(5,'0')}
  for(let i=0;i+8<=bits.length;i+=8)out.push(parseInt(bits.substr(i,8),2));return new Uint8Array(out)}
async function totp(secret,digits,period){
  digits=digits||6;period=period||30;
  const key=await crypto.subtle.importKey('raw',b32(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);
  const ctr=Math.floor(Date.now()/1000/period);
  const buf=new ArrayBuffer(8),dv=new DataView(buf);
  dv.setUint32(0,Math.floor(ctr/4294967296));dv.setUint32(4,ctr>>>0);
  const sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,buf));
  const o=sig[19]&0xf;
  const n=((sig[o]&0x7f)<<24)|(sig[o+1]<<16)|(sig[o+2]<<8)|sig[o+3];
  return String(n%Math.pow(10,digits)).padStart(digits,'0');
}
function parseOtp(v){
  if(/^otpauth:/i.test(v)){try{const u=new URL(v);
    return{s:u.searchParams.get('secret')||'',d:+u.searchParams.get('digits')||6,p:+u.searchParams.get('period')||30}}catch(e){}}
  return{s:v,d:6,p:30};
}
async function updateTotps(){
  const els=$$('[data-totp]');
  for(const e of els){const {s,d,p}=parseOtp(e.dataset.totp);
    if(!s){e.textContent='—';continue}
    try{e.textContent=(await totp(s,d,p)).replace(/(\d{3})(?=\d)/,'$1 ')}catch(x){e.textContent='bad secret'}
    const left=p-Math.floor(Date.now()/1000)%p;
    const r=e.parentElement.querySelector('.ring');
    if(r)r.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#28323E" stroke-width="3"/>'+
      '<circle cx="12" cy="12" r="9" fill="none" stroke="#4CC9C0" stroke-width="3" stroke-linecap="round" '+
      'stroke-dasharray="56.5" stroke-dashoffset="'+(56.5*(1-left/p))+'" transform="rotate(-90 12 12)"/></svg>';
  }
}

const FTYPES=[['text','Text'],['hidden','Hidden'],['totp','TOTP'],['url','Link'],['notes','Notes']];

function migrate(){
  let n=0;

    if(!FTYPES.some(t=>t[0]===f.type))f.type='text'}));

  if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}
  const mat=new THREE.MeshPhongMaterial({color:new THREE.Color($('#mcol').value),
    specular:0x222222,shininess:35,side:THREE.DoubleSide,flatShading:true,wireframe:wire});
  mesh=new THREE.Mesh(geo,mat);scene.add(mesh);fit();
}
function fit(){
  if(!mesh)return;mesh.geometry.computeBoundingSphere();
  const bs=mesh.geometry.boundingSphere;if(!bs)return;
  target={x:bs.center.x,y:bs.center.y,z:bs.center.z};dist=Math.max(8,bs.radius*2.9);
}
/* ---------- openscad wasm ---------- */
async function getOSC(){
  if(osc)return osc;
  const base=await resolveBase();
  await loadRemote('openscad.js','OpenSCAD','the OpenSCAD engine');
  /* The .wasm is fetched here rather than left to Emscripten: raw.githubusercontent
     serves it as text/plain, which makes instantiateStreaming refuse it. Handing
     over the bytes as wasmBinary sidesteps the MIME check entirely. */
  setStatus('Downloading the WebAssembly build — about 10 MB, first render only…');
  const bin=await fetchBinary(base+'openscad.wasm','openscad.wasm');
  setStatus('Starting the engine…');
  osc=await window.OpenSCAD({noInitialRun:true,
    wasmBinary:new Uint8Array(bin),
    locateFile:f=>base+String(f).replace(/^.*\//,''),
    print:t=>console.log(t),printErr:t=>console.warn(t)});
  return osc;
}
async function render(){
  if(!scene&&!(await initThree()))return;
  let inst;
  try{inst=await getOSC()}catch(e){return setStatus('Engine unavailable.\n'+(e.message||e))}
  setStatus('Rendering…');
  const t0=performance.now();
  try{
    try{inst.FS.unlink('/out.stl')}catch(e){}
    inst.FS.writeFile('/in.scad',code.value);
    let err='';const oldErr=inst.printErr;
    inst.printErr=t=>{err+=t+'\n'};
    inst.callMain(['/in.scad','--export-format=binstl','-o','/out.stl']);
    inst.printErr=oldErr;
    const out=inst.FS.readFile('/out.stl');
    lastSTL=out;
    if(!out.length)throw new Error('Empty result. '+(err||'Does the model produce geometry?'));
    const g=parseSTL(out.buffer.slice(out.byteOffset,out.byteOffset+out.byteLength));
    show(g);
    const tris=g.getAttribute('position').count/3;
    setStatus('Rendered '+tris.toLocaleString()+' triangles in '+((performance.now()-t0)/1000).toFixed(2)+'s'+
      (err?'\n'+err.trim().split('\n').slice(0,4).join('\n'):''));
  }catch(e){setStatus('Render failed.\n'+(e.message||e))}
}

    case 'hero':{const st='min-height:'+(p.h==='auto'?'auto':p.h)+';padding:80px 22px;'+
      (p.img?'background-image:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.42)),url('+p.img+');color:#fff;':'');
      return '<section class="wb-sec wb-hero" style="'+st+'"'+(edit?' data-b="'+b.id+'"':'')+'><div class="wb-in">'+
        '<h1>'+esca(p.title)+'</h1>'+(p.sub?'<p>'+esca(p.sub).replace(/\n/g,'<br>')+'</p>':'')+
        (p.cta?A(p.cta,p.href):'')+'</div></section>'}
    case 'heading':return wrap('<'+p.lvl+'>'+esca(p.t)+'</'+p.lvl+'>');
    case 'text':return wrap(String(p.t||'').split(/\n\s*\n/).map(x=>'<p>'+esca(x).replace(/\n/g,'<br>')+'</p>').join(''));
    case 'image':return wrap((p.src?'<img src="'+esca(p.src)+'" alt="'+esca(p.alt)+'" style="border-radius:'+(p.r||0)+'px;max-width:'+(p.w||'100%')+';margin:0 auto">'
      :'<div style="background:rgba(127,127,127,.12);border-radius:12px;padding:60px;text-align:center;color:var(--mu)">Add an image URL</div>')+
      (p.cap?'<p style="text-align:center;color:var(--mu);font-size:14px;margin-top:10px">'+esca(p.cap)+'</p>':''));
    case 'button':return wrap(A(p.t,p.href));
    case 'columns':return wrap('<div class="wb-grid" style="grid-template-columns:repeat('+p.n+',1fr)">'+
      cols(p.items).map(c=>'<div><h3>'+esca(c[0]||'')+'</h3><p style="color:var(--mu)">'+esca(c[1]||'')+'</p></div>').join('')+'</div>');
    case 'cards':return wrap('<div class="wb-grid" style="grid-template-columns:repeat('+p.n+',1fr)">'+
      cols(p.items).map(c=>'<a class="wb-card" href="'+esca(c[3]||'#')+'">'+
      (c[2]?'<img src="'+esca(c[2])+'" alt="" style="width:100%;height:160px;object-fit:cover">':'')+
      '<div class="pad"><h3>'+esca(c[0]||'')+'</h3><p>'+esca(c[1]||'')+'</p></div></a>').join('')+'</div>');
    case 'list':return wrap('<'+(p.ord?'ol':'ul')+' style="padding-left:22px">'+
      lines(p.items).map(l=>'<li style="margin-bottom:8px">'+esca(l)+'</li>').join('')+'</'+(p.ord?'ol':'ul')+'>');
    case 'quote':return wrap('<blockquote>'+esca(p.t)+(p.by?'<cite>— '+esca(p.by)+'</cite>':'')+'</blockquote>');
    case 'gallery':return wrap('<div class="wb-grid" style="grid-template-columns:repeat('+p.n+',1fr)">'+
      (lines(p.items).map(u=>'<img src="'+esca(u)+'" alt="" style="border-radius:var(--r);width:100%;height:200px;object-fit:cover">').join('')
      ||'<div style="color:var(--mu)">Add image URLs, one per line</div>')+'</div>');
    case 'video':{const u=p.src||'';let em=u;
      const yt=u.match(/(?:youtu\.be\/|v=)([\w-]{6,})/);if(yt)em='https://www.youtube.com/embed/'+yt[1];
      const vm=u.match(/vimeo\.com\/(\d+)/);if(vm)em='https://player.vimeo.com/video/'+vm[1];
      return wrap(u?(/\.mp4$/i.test(u)?'<video src="'+esca(u)+'" controls style="width:100%;border-radius:var(--r)"></video>'
        :'<div style="position:relative;padding-top:56.25%"><iframe src="'+esca(em)+'" style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:var(--r)" allowfullscreen></iframe></div>')
        :'<div style="color:var(--mu)">Add a video URL</div>')}
    case 'form':return wrap('<form class="wb-form"'+(p.action?' action="'+esca(p.action)+'" method="post"':'')+'>'+
      cols(p.fields).map(c=>{const ty=(c[1]||'text').toLowerCase();
        const nm=esca(c[0]||'field');
        return '<label>'+nm+'</label>'+(ty==='textarea'?'<textarea name="'+nm+'" rows="4"></textarea>'
          :'<input type="'+esca(ty)+'" name="'+nm+'">')}).join('')+
      '<button class="wb-btn" type="submit">'+esca(p.btn||'Send')+'</button></form>');
    case 'embed':return wrap(p.src?'<iframe src="'+esca(p.src)+'" style="width:100%;height:'+(p.h||380)+'px;border:0;border-radius:var(--r)"></iframe>':'<div style="color:var(--mu)">Add an embed URL</div>');
    case 'footer':return '<footer class="wb-foot"'+(edit?' data-b="'+b.id+'"':'')+'><span>'+esca(p.t)+'</span><span style="flex:1"></span>'+
      cols(p.items).map(c=>'<a href="'+esca(c[1]||'#')+'">'+esca(c[0])+'</a>').join('')+'</footer>';
    case 'divider':return '<div'+(edit?' data-b="'+b.id+'"':'')+' style="padding:0 22px"><div class="wb-in"><hr></div></div>';
    case 'spacer':return '<div'+(edit?' data-b="'+b.id+'"':'')+' style="height:'+(p.h||48)+'px"></div>';
    case 'html':return '<div'+(edit?' data-b="'+b.id+'"':'')+' class="wb-sec" style="padding:0 22px"><div class="wb-in">'+(p.t||'')+'</div></div>';
    case 'css':case 'js':return edit?'':'';
  }
  return '';
}
function buildHTML(edit,forExport){
  const th=site.theme;
  const cssBlocks=site.pages.flatMap(p=>p.blocks).filter(b=>b.t==='css').map(b=>b.p.t).join('\n');
  const jsBlocks=site.pages.flatMap(p=>p.blocks).filter(b=>b.t==='js').map(b=>b.p.t).join('\n');
  const body=forExport
    ? site.pages.map((p,i)=>'<div class="wb-page" data-p="'+esca(p.path||('p'+i))+'"'+(i?' style="display:none"':'')+'>'+
        p.blocks.map(b=>renderBlock(b,false)).join('')+'</div>').join('')
    : page().blocks.map(b=>renderBlock(b,edit)).join('');
  const editCSS=edit?`[data-b]{position:relative;outline:1px dashed transparent;transition:outline-color .12s}
[data-b]:hover{outline-color:rgba(76,201,192,.65);cursor:pointer}
[data-b].sel{outline:2px solid #4CC9C0;outline-offset:-2px}`:'';
  const router=(forExport&&site.pages.length>1)?
    `document.addEventListener('click',function(e){var a=e.target.closest('a[href^="#/"]');if(!a)return;
e.preventDefault();go(a.getAttribute('href').slice(2))});
function go(p){var f=false;document.querySelectorAll('.wb-page').forEach(function(el){
var m=el.dataset.p===p;el.style.display=m?'':'none';if(m)f=true});
if(!f)document.querySelector('.wb-page').style.display='';location.hash='#/'+p;scrollTo(0,0)}
if(location.hash.indexOf('#/')===0)go(location.hash.slice(2));`:'';
  const editJS=edit?`document.addEventListener('click',function(e){var el=e.target.closest('[data-b]');
if(!el)return;e.preventDefault();parent.postMessage({wb:1,id:el.dataset.b},'*')},true);
addEventListener('message',function(e){if(e.data&&e.data.wbsel){
document.querySelectorAll('[data-b]').forEach(function(x){x.classList.toggle('sel',x.dataset.b===e.data.wbsel)})}});`:'';
  const S='<'+'/script>';
  return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esca(site.name)+'</title>'+
    '<style>'+css(th)+'\n'+cssBlocks+'\n'+editCSS+'</style></head><body>'+body+
    '<script>'+router+'\n'+editJS+'\n'+(forExport?jsBlocks:'')+S+'</body></html>';
}
function preview(){const f=$('#pv');f.srcdoc=buildHTML(true,false);
  f.onload=()=>{if(sel)f.contentWindow.postMessage({wbsel:sel},'*')}}
addEventListener('message',e=>{if(e.data&&e.data.wb){sel=e.data.id;inspector();tree();
  $('#pv').contentWindow.postMessage({wbsel:sel},'*')}});
/* ---------- palette / tree ---------- */
function palette(){
  $('#palist').innerHTML=GROUPS.map(g=>'<div class="palhd">'+g[0]+'</div>'+
    g[1].map(t=>'<button class="palbtn" data-add="'+t+'">'+BLOCKS[t].n+'</button>').join('')).join('');
  $$('[data-add]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.add;
    const nb={id:uid(),t,p:JSON.parse(JSON.stringify(BLOCKS[t].d||{})),s:{}};
    const at=sel?page().blocks.findIndex(x=>x.id===sel)+1:page().blocks.length;
    page().blocks.splice(at,0,nb);sel=nb.id;save();preview();tree();inspector();
    $('#pal').classList.remove('show')});
}
function tree(){
  $('#tree').innerHTML='<div class="palhd">'+esc(page().name)+'</div>'+page().blocks.map((b,i)=>
    '<div class="tnode'+(sel===b.id?' on':'')+'" data-t="'+b.id+'">'+BLOCKS[b.t].n+
    '<span class="g"><button data-u="'+i+'">↑</button><button data-d="'+i+'">↓</button>'+
    '<button data-c="'+i+'">⧉</button><button data-x="'+i+'">×</button></span></div>').join('');
  $$('.tnode').forEach(n=>n.onclick=e=>{
    const i=n.querySelector('[data-u]')?+n.querySelector('[data-u]').dataset.u:0;const a=page().blocks;
    if(e.target.dataset.u!==undefined){if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];save();preview();tree()}return}
    if(e.target.dataset.d!==undefined){if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];save();preview();tree()}return}
    if(e.target.dataset.c!==undefined){const cp=JSON.parse(JSON.stringify(a[i]));cp.id=uid();
      a.splice(i+1,0,cp);save();preview();tree();return}
    if(e.target.dataset.x!==undefined){a.splice(i,1);if(sel===n.dataset.t)sel=null;save();preview();tree();inspector();return}
    sel=n.dataset.t;tree();inspector();$('#pv').contentWindow.postMessage({wbsel:sel},'*')});
}
/* ---------- inspector ---------- */
function field(f,val,key){
  const [k,label,type,opts]=f;
  if(type==='area')return '<div class="row"><label class="fl">'+label+'</label><textarea class="fld" rows="4" data-p="'+k+'">'+esc(val||'')+'</textarea></div>';
  if(type==='code')return '<div class="row"><label class="fl">'+label+'</label><textarea class="fld" rows="9" spellcheck="false" style="font-family:var(--mono);font-size:12.5px" data-p="'+k+'">'+esc(val||'')+'</textarea></div>';
  if(type==='sel')return '<div class="row"><label class="fl">'+label+'</label><select class="fld" data-p="'+k+'">'+
    opts.map(o=>'<option'+(String(val)===o?' selected':'')+'>'+o+'</option>').join('')+'</select></div>';
  if(type==='bool')return '<div class="row"><label style="display:flex;gap:8px;align-items:center;font-size:13.5px">'+
    '<input type="checkbox" data-p="'+k+'"'+(val?' checked':'')+'>'+label+'</label></div>';
  if(type==='num')return '<div class="row"><label class="fl">'+label+'</label><input class="fld" type="number" data-p="'+k+'" value="'+esc(val)+'"></div>';
  return '<div class="row"><label class="fl">'+label+'</label><input class="fld" data-p="'+k+'" value="'+esc(val||'')+'"></div>';
}
function inspector(){
  const b=page().blocks.find(x=>x.id===sel);
  if(!b)return $('#ip').innerHTML='<div class="empty">Pick a block in the preview or the list.</div>';
  const s=b.s||{};
  $('#ip').innerHTML='<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">'+
    '<b style="font-size:14px">'+BLOCKS[b.t].n+'</b><div class="grow"></div>'+
    '<button class="btn sm gho" id="dup">Duplicate</button><button class="btn sm dgr" id="rmb">Delete</button></div>'+
    BLOCKS[b.t].f.map(f=>field(f,b.p[f[0]])).join('')+
    (['nav','footer','spacer','divider','js','css'].includes(b.t)?'':
    '<div style="border-top:1px solid var(--line);padding-top:12px;margin-top:6px">'+
    '<div class="row"><label class="fl">Alignment</label><div class="seg2" id="al">'+
    ['left','center','right'].map(a=>'<button data-a="'+a+'" class="'+((s.align||'left')===a?'on':'')+'">'+a+'</button>').join('')+'</div></div>'+
    '<div class="row"><label class="fl">Vertical padding</label><input type="range" min="0" max="140" value="'+(s.pad!=null?s.pad:34)+'" data-s="pad" style="width:100%"></div>'+
    '<div style="display:flex;gap:10px"><div class="row grow"><label class="fl">Background</label>'+
    '<input class="fld" type="color" data-s="bg" value="'+(s.bg||site.theme.bg)+'" style="height:36px;padding:3px"></div>'+
    '<div class="row grow"><label class="fl">Text</label><input class="fld" type="color" data-s="fg" value="'+(s.fg||site.theme.fg)+'" style="height:36px;padding:3px"></div></div>'+
    '<button class="btn sm gho" id="clrs">Clear block styling</button></div>');
  $$('#ip [data-p]').forEach(e=>{const h=()=>{b.p[e.dataset.p]=e.type==='checkbox'?e.checked:
    (e.type==='number'?+e.value:e.value);save();preview()};
    e.oninput=e.type==='color'||e.tagName==='SELECT'?null:h;e.onchange=h});
  $$('#ip [data-s]').forEach(e=>{const h=()=>{b.s=b.s||{};b.s[e.dataset.s]=e.type==='number'||e.type==='range'?+e.value:e.value;
    save();preview()};e.oninput=h;e.onchange=h});
  $$('#al [data-a]').forEach(e=>e.onclick=()=>{b.s=b.s||{};b.s.align=e.dataset.a;save();preview();inspector()});
  const c=$('#clrs');if(c)c.onclick=()=>{b.s={};save();preview();inspector()};
  $('#rmb').onclick=()=>{page().blocks=page().blocks.filter(x=>x.id!==b.id);sel=null;save();preview();tree();inspector()};
  $('#dup').onclick=()=>{const i=page().blocks.findIndex(x=>x.id===b.id);
    const cp=JSON.parse(JSON.stringify(b));cp.id=uid();page().blocks.splice(i+1,0,cp);sel=cp.id;save();preview();tree();inspector()};
}
/* ---------- pages / theme / export ---------- */
function pages(){
  $('#pgs').innerHTML=site.pages.map((p,i)=>'<button class="pgtab'+(i===pg?' on':'')+'" data-pg="'+i+'">'+esc(p.name)+'</button>').join('');
  $$('[data-pg]').forEach(b=>{
    b.onclick=()=>{pg=+b.dataset.pg;sel=null;preview();tree();inspector();pages()};
    b.oncontextmenu=e=>{e.preventDefault();const p=site.pages[+b.dataset.pg];
      dialog({title:'Page',style:'width:min(400px,100%)',
        body:'<div class="row"><label class="fl">Name</label><input class="fld" id="pn" value="'+esc(p.name)+'"></div>'+
          '<div class="row"><label class="fl">Path (used by links as #/path)</label><input class="fld" id="pp" value="'+esc(p.path)+'"></div>',
        buttons:[{label:'Delete',cls:'dgr left',onClick:()=>{if(site.pages.length<2)return toast('Keep at least one page');
          site.pages.splice(+b.dataset.pg,1);pg=0;save();pages();preview();tree()}},
          {label:'Cancel',cls:'gho'},{label:'Save',cls:'pri',onClick:d=>{p.name=d.querySelector('#pn').value||'Page';
            p.path=d.querySelector('#pp').value.replace(/\W+/g,'-').toLowerCase()||'page';save();pages()}}]})}});
}
$('#addpg').onclick=()=>{site.pages.push({id:uid(),name:'Page '+(site.pages.length+1),
  path:'page-'+site.pages.length,blocks:[{id:uid(),t:'heading',p:{t:'New page',lvl:'h1'},s:{pad:60}}]});
  pg=site.pages.length-1;sel=null;save();pages();preview();tree()};
$('#theme').onclick=()=>{const th=site.theme;
  dialog({title:'Theme',style:'width:min(440px,100%)',
    body:'<div class="row"><label class="fl">Site name</label><input class="fld" id="sn" value="'+esc(site.name)+'"></div>'+
      '<div class="row"><label class="fl">Typeface</label><select class="fld" id="tf">'+
      [['system','Modern sans'],['serif','Classic serif'],['round','Friendly'],['cond','Condensed'],['mono','Monospace']]
      .map(f=>'<option value="'+f[0]+'"'+(th.font===f[0]?' selected':'')+'>'+f[1]+'</option>').join('')+'</select></div>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
      [['accent','Accent'],['bg','Background'],['fg','Text'],['muted','Muted text']].map(c=>
      '<div class="row" style="flex:1 1 90px"><label class="fl">'+c[1]+'</label><input class="fld" type="color" id="c_'+c[0]+'" value="'+th[c[0]]+'" style="height:36px;padding:3px"></div>').join('')+'</div>'+
      '<div class="row"><label class="fl">Content width: <b id="wl">'+th.width+'</b>px</label><input type="range" min="640" max="1440" value="'+th.width+'" id="tw" style="width:100%"></div>'+
      '<div class="row"><label class="fl">Corner radius: <b id="rl">'+th.radius+'</b>px</label><input type="range" min="0" max="28" value="'+th.radius+'" id="tr" style="width:100%"></div>'+
      '<div class="row"><label class="fl">Presets</label><div style="display:flex;gap:6px;flex-wrap:wrap" id="pre">'+
      [['Clean','#3B6FF5','#ffffff','#12151A'],['Midnight','#7C9DF7','#0F1218','#E8ECF3'],
       ['Warm','#C9622F','#FBF7F1','#26201B'],['Forest','#2E8B62','#F4F8F4','#16241C'],
       ['Mono','#111111','#ffffff','#111111']].map(p=>'<button class="btn sm" data-pr=\''+JSON.stringify(p)+'\'>'+p[0]+'</button>').join('')+'</div></div>',
    buttons:[{label:'Done',cls:'pri'}],
    onOpen:b=>{
      const up=()=>{save();preview()};
      b.querySelector('#sn').oninput=e=>{site.name=e.target.value;up()};
      b.querySelector('#tf').onchange=e=>{th.font=e.target.value;up()};
      ['accent','bg','fg','muted'].forEach(k=>b.querySelector('#c_'+k).oninput=e=>{th[k]=e.target.value;up()});
      b.querySelector('#tw').oninput=e=>{th.width=+e.target.value;b.querySelector('#wl').textContent=th.width;up()};
      b.querySelector('#tr').oninput=e=>{th.radius=+e.target.value;b.querySelector('#rl').textContent=th.radius;up()};
      b.querySelectorAll('[data-pr]').forEach(p=>p.onclick=()=>{const v=JSON.parse(p.dataset.pr);
        th.accent=v[1];th.bg=v[2];th.fg=v[3];th.muted=v[3]+'99';
        ['accent','bg','fg'].forEach((k,i)=>b.querySelector('#c_'+k).value=th[k]);up()});
    }})};
$('#expo').onclick=()=>{
  const html=buildHTML(false,true);
  dialog({title:'Export site',style:'width:min(480px,100%)',
    body:'<div class="hint" style="margin-bottom:14px">One self-contained <b>index.html</b> — '+
      Math.round(html.length/1024)+' KB, no build step, no dependencies. Drop it on any host, or open it straight off disk.'+
      (site.pages.length>1?' Your '+site.pages.length+' pages are bundled with a hash router; link between them with <code>#/path</code>.':'')+'</div>'+
      '<div style="display:flex;flex-direction:column;gap:9px">'+
      '<button class="btn pri" id="e1">Download index.html</button>'+
      '<button class="btn" id="e2">Copy HTML to clipboard</button>'+
      '<button class="btn" id="e3">Export project JSON</button>'+
      '<button class="btn gho" id="e4">Import project JSON</button></div>',
    buttons:[{label:'Close',cls:'gho'}],
    onOpen:(b,close)=>{
      b.querySelector('#e1').onclick=()=>download('index.html','text/html',html);
      b.querySelector('#e2').onclick=()=>copyText(html);
      b.querySelector('#e3').onclick=()=>download(site.name.replace(/\W+/g,'-').toLowerCase()+'.json','application/json',JSON.stringify(site,null,2));
      b.querySelector('#e4').onclick=()=>{close();
        dialog({title:'Import project',body:'<textarea class="fld" rows="8" id="pj"></textarea>'+
          '<div class="hint">This replaces the current site.</div>',
          buttons:[{label:'Cancel',cls:'gho'},{label:'Replace site',cls:'dgr',onClick:d=>{
            try{site=JSON.parse(d.querySelector('#pj').value);pg=0;sel=null;save();pages();preview();tree();inspector()}
            catch(e){toast('Invalid JSON');return false}}}]})};
    }})};
$('#mobtog').onclick=()=>$('#pvwrap').classList.toggle('mob');
$('#tpal').onclick=()=>$('#pal').classList.toggle('show');
$('#tins').onclick=()=>$('#insp').classList.toggle('show');
(async()=>{site=(await Tool.get('site'))||dflt();
  if(!site.pages)site=dflt();
  palette();pages();tree();inspector();preview();
  Tool.title('Website Builder — '+site.name)})();
</script>

<script type="text/x-tool" data-id="game" data-part="html" data-name="Game Creator" data-icon="gamepad" data-color="plum" data-desc="PICO-8 style studio: sprite and tile editors, tilemaps, SFX tracker, music patterns, code and one-file export.">
<style>
  #gc{display:flex;flex-direction:column;height:100%;min-height:0}
  #gcbody{flex:1;overflow:hidden;min-height:0}
  .tab{display:none;height:100%;flex-direction:column;min-height:0}

  /* sprites */

    font-size:14px;display:grid;place-items:center}

<script type="text/x-tool" data-id="game" data-part="js">
const PICO=['#000000','#1D2B53','#7E2553','#008751','#AB5236','#5F574F','#C2C3C7','#FFF1E8',
  '#FF004D','#FFA300','#FFEC27','#00E436','#29ADFF','#83769C','#FF77A8','#FFCCAA'];
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const INSTS=['triangle','tilted','sawtooth','square','pulse','organ','noise','phaser'];
const FX=['none','slide','vibrato','drop','fade in','fade out','arp fast','arp slow'];
const HEX='0123456789abcdef';
let games=[],G=null,tab='spr',sheet='sprites',selSpr=0,selTile=0,colr=8,tool='pen';
let undo=[],redo=[],clip=null,audio=null,playT=null;
const S=()=>G.size, sheetArr=()=>G[sheet];
const blankSpr=n=>'0'.repeat(n*n);
function newGame(name){

    sprites:Array.from({length:64},()=>blankSpr(n)),
    tiles:Array.from({length:64},()=>blankSpr(n)),
    sflags:Array.from({length:64},()=>0),tflags:Array.from({length:64},()=>0),
    flagNames:['solid','hurt','pickup','platform','','','','','','','','','','','',''],
    palette:PICO.slice(),
    maps:[{name:'Map 1',w:64,h:32,data:new Array(64*32).fill(-1)}],
    sfx:Array.from({length:16},()=>({speed:8,notes:Array.from({length:32},()=>({n:-1,i:0,v:5,f:0}))})),
    music:[{id:'m1',name:'Track 1',loop:true,rows:[[-1,-1,-1,-1]]}],
    code:DEFAULT_CODE,res:{w:128,h:128},u:Date.now()};
}
const DEFAULT_CODE=['// A tiny demo. cnv and ctx are the canvas and its 2D context.',
'let p = { x: 60, y: 60, vy: 0 };',
'',
'function init() {',
'  // runs once before the first frame',
'}',
'',
'function update(dt) {',
'  if (btn(0)) p.x -= 60 * dt;',
'  if (btn(1)) p.x += 60 * dt;',
'  p.vy += 240 * dt;',
'  p.y += p.vy * dt;',
'  if (p.y > 100) { p.y = 100; p.vy = btn(4) ? -140 : 0; }',
'}',
'',
'function draw() {',
'  cls(1);',
'  print("arrows to move, Z to jump", 4, 4, 6);',
'  spr(0, p.x, p.y);',
'  circfill(64, 118, 6, 12);',
'}'].join('\n');
let svT=null;const save=()=>{clearTimeout(svT);svT=setTimeout(async()=>{G.u=Date.now();
  await Tool.set('games',games);$('#gsave').textContent='saved '+new Date().toLocaleTimeString()},400)};
/* ---------- tabs ---------- */
$$('#gtabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;$$('#gtabs button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.p===tab));
  if(tab==='map'){resizeMap();drawMap();drawMapTiles()}
  if(tab==='spr'){drawSpr();drawSheet()}
  if(tab==='sfx')drawTracker();
  if(tab==='mus')drawMusic();
  if(tab==='run')runGame();
  if(tab==='set')drawSettings();
  if(tab==='code')csync();
});
/* ---------- sprite editor ---------- */
const TOOLS=[['pen','✏'],['erase','◇'],['fill','▨'],['line','／'],['rect','▭'],['rectf','▬'],['circ','◯'],['pick','⊙']];
function drawTools(){
  $('#tools').innerHTML=TOOLS.map(t=>'<button data-tool="'+t[0]+'" class="'+(tool===t[0]?'on':'')+'" title="'+t[0]+'">'+t[1]+'</button>').join('');
  $$('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;drawTools()});
}
function drawPal(){
  $('#pal').innerHTML=G.palette.map((c,i)=>'<button data-c="'+i+'" class="'+(colr===i?'on':'')+'" style="background:'+c+'"></button>').join('');
  $$('#pal [data-c]').forEach(b=>b.onclick=()=>{colr=+b.dataset.c;drawPal()});
}
const curIdx=()=>sheet==='sprites'?selSpr:selTile;
const flagArr=()=>sheet==='sprites'?G.sflags:G.tflags;
function drawFlags(){
  const f=flagArr()[curIdx()]||0;
  $('#flaglist').innerHTML=G.flagNames.map((n,i)=>'<div class="flag"><input type="checkbox" data-f="'+i+'"'+((f>>i&1)?' checked':'')+'>'+
    '<input type="text" data-fn="'+i+'" value="'+esc(n)+'" placeholder="flag '+i+'"></div>').join('');
  $$('[data-f]').forEach(c=>c.onchange=()=>{const i=+c.dataset.f;const a=flagArr();
    a[curIdx()]=c.checked?(a[curIdx()]|(1<<i)):(a[curIdx()]&~(1<<i));save()});
  $$('[data-fn]').forEach(t=>t.oninput=()=>{G.flagNames[+t.dataset.fn]=t.value;save()});
}
function px(idx,x,y,v){const n=S();const a=sheetArr();
  if(x<0||y<0||x>=n||y>=n)return;
  const s=a[idx];a[idx]=s.slice(0,y*n+x)+HEX[v]+s.slice(y*n+x+1)}
function pget(idx,x,y){const n=S();if(x<0||y<0||x>=n||y>=n)return 0;
  return HEX.indexOf(sheetArr()[idx][y*n+x])}
function drawSpr(){
  const n=S(),cv=$('#sc2'),wrap=$('#spcanvas');
  const px2=Math.max(6,Math.floor(Math.min(wrap.clientWidth-24,wrap.clientHeight-24)/n));
  cv.width=cv.height=n*px2;
  const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const v=pget(curIdx(),x,y);
    c.fillStyle=v===0?((x+y)%2?'#1A1E24':'#15181D'):G.palette[v];
    c.fillRect(x*px2,y*px2,px2,px2)}
  if(px2>=10){c.strokeStyle='rgba(255,255,255,.06)';c.lineWidth=1;
    for(let i=0;i<=n;i++){c.beginPath();c.moveTo(i*px2+.5,0);c.lineTo(i*px2+.5,n*px2);c.stroke();
      c.beginPath();c.moveTo(0,i*px2+.5);c.lineTo(n*px2,i*px2+.5);c.stroke()}}
  drawFlags();
}
function pushUndo(){undo.push(JSON.stringify(sheetArr()));if(undo.length>60)undo.shift();redo=[]}
(function bindSpr(){
  const cv=$('#sc2');let drawing=false,start=null,snap=null;
  const pos=e=>{const r=cv.getBoundingClientRect(),n=S();
    return[Math.floor((e.clientX-r.left)/r.width*n),Math.floor((e.clientY-r.top)/r.height*n)]};
  const apply=(a,b)=>{
    const [x,y]=b,idx=curIdx(),c=tool==='erase'?0:colr;
    if(tool==='pen'||tool==='erase'){px(idx,x,y,c);if(a){const [ax,ay]=a;lineTo(ax,ay,x,y,(px1,py1)=>px(idx,px1,py1,c))}}
    else if(tool==='pick'){colr=pget(idx,x,y)||colr;drawPal();return}
    else if(tool==='fill'){flood(idx,x,y,c)}
    else{sheetArr()[idx]=snap[idx];
      const [sx,sy]=start;
      if(tool==='line')lineTo(sx,sy,x,y,(a1,b1)=>px(idx,a1,b1,c));
      if(tool==='rect'||tool==='rectf'){const x0=Math.min(sx,x),x1=Math.max(sx,x),y0=Math.min(sy,y),y1=Math.max(sy,y);
        for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++)
          if(tool==='rectf'||i===x0||i===x1||j===y0||j===y1)px(idx,i,j,c)}
      if(tool==='circ'){const r=Math.round(Math.hypot(x-sx,y-sy));
        for(let a1=0;a1<360;a1+=2)px(idx,Math.round(sx+r*Math.cos(a1*Math.PI/180)),Math.round(sy+r*Math.sin(a1*Math.PI/180)),c)}}
    drawSpr();drawSheet();
  };
  const lineTo=(x0,y0,x1,y1,f)=>{const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0);
    const sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx-dy;
    for(;;){f(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*err;
      if(e2>-dy){err-=dy;x0+=sx}if(e2<dx){err+=dx;y0+=sy}}};
  const flood=(idx,x,y,c)=>{const t=pget(idx,x,y);if(t===c)return;const n=S();const st=[[x,y]];
    while(st.length){const [a,b]=st.pop();if(a<0||b<0||a>=n||b>=n)continue;
      if(pget(idx,a,b)!==t)continue;px(idx,a,b,c);st.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}};
  let last=null;
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pushUndo();
    snap=sheetArr().slice();drawing=true;start=pos(e);last=null;apply(null,start);last=start;save()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);apply(last,p);
    if(tool==='pen'||tool==='erase')last=p});
  const end=()=>{if(drawing){drawing=false;save()}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
})();
function drawSheet(){
  const n=S(),a=sheetArr(),per=Math.max(8,Math.min(32,Math.floor(($('#sheet').clientWidth-20)/(n*2))));
  const scale=2,rows=Math.ceil(a.length/per);
  const cv=$('#shcv');cv.width=per*n*scale;cv.height=rows*n*scale;
  cv.style.width=cv.width+'px';
  const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
  c.fillStyle='#101419';c.fillRect(0,0,cv.width,cv.height);
  a.forEach((s,i)=>{const ox=(i%per)*n*scale,oy=Math.floor(i/per)*n*scale;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){const v=HEX.indexOf(s[y*n+x]);
      if(v>0){c.fillStyle=G.palette[v];c.fillRect(ox+x*scale,oy+y*scale,scale,scale)}}
    c.strokeStyle=(i===curIdx())?'#4CC9C0':'rgba(255,255,255,.07)';
    c.lineWidth=i===curIdx()?2:1;c.strokeRect(ox+.5,oy+.5,n*scale-1,n*scale-1)});
  cv._per=per;
  $('#shcount').textContent=a.length+' '+sheet+' · #'+curIdx();
  cv.onclick=e=>{const r=cv.getBoundingClientRect();
    const i=Math.floor((e.clientY-r.top)/(n*scale))*per+Math.floor((e.clientX-r.left)/(n*scale));
    if(i<a.length){sheet==='sprites'?selSpr=i:selTile=i;drawSpr();drawSheet()}};
}
$('#addspr').onclick=()=>{const n=S(),a=sheetArr(),f=flagArr();
  for(let i=0;i<16;i++){a.push(blankSpr(n));f.push(0)}
  save();drawSheet();if(sheet==='tiles')drawMapTiles();toast(a.length+' '+sheet)};
$('#delspr').onclick=()=>{const a=sheetArr(),f=flagArr();
  if(a.length<=16)return toast('Keep at least 16');
  const doomed=a.slice(-16),used=doomed.some(x=>/[1-9a-f]/.test(x));
  const go=()=>{a.length-=16;f.length-=16;
    if(curIdx()>=a.length){sheet==='sprites'?selSpr=a.length-1:selTile=a.length-1}
    save();drawSpr();drawSheet();drawMapTiles()};
  used?confirmBox('Remove last row?','The last 16 '+sheet+' are not empty. Anything drawn on them is lost.',go,true):go()};
$$('[data-sheet]').forEach(b=>b.onclick=()=>{sheet=b.dataset.sheet;
  $$('[data-sheet]').forEach(x=>x.classList.toggle('on',x===b));drawSpr();drawSheet()});
$('#fh').onclick=()=>{pushUndo();const n=S(),i=curIdx();let s='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)s+=HEX[pget(i,n-1-x,y)];sheetArr()[i]=s;drawSpr();drawSheet();save()};
$('#fv').onclick=()=>{pushUndo();const n=S(),i=curIdx();let s='';

<script type="text/x-tool" data-id="floor" data-part="js">
let plans=[],P=null,tl='sel',selId=null,showConn=false,snap=true;
let view={x:60,y:60,z:1},drag=null,connFrom=null;
const DEF_COLORS=[{name:'Cat6 data',hex:'#4CC9C0'},{name:'Fibre',hex:'#FFEC27'},
  {name:'Power',hex:'#E5534B'},{name:'PoE',hex:'#29ADFF'},{name:'Coax',hex:'#AB5236'}];
const DEF_TPL=[
  {id:'t1',name:'Wall',type:'wall',th:100},
  {id:'t2',name:'Door 838mm',type:'door',w:838,h:100},
  {id:'t3',name:'Window 1200mm',type:'window',w:1200,h:100},
  {id:'t4',name:'Desk',type:'furniture',w:1400,h:700},
  {id:'t5',name:'Rack 42U',type:'furniture',w:600,h:1000},
  {id:'t6',name:'Sofa',type:'furniture',w:2000,h:900},
  {id:'t7',name:'Access point',type:'device',w:200,h:200,kind:'AP'},
  {id:'t8',name:'Router',type:'device',w:300,h:200,kind:'Router'},
  {id:'t9',name:'Switch 24-port',type:'device',w:440,h:200,kind:'Switch'},
  {id:'t10',name:'Camera',type:'device',w:150,h:150,kind:'Camera'},
  {id:'t11',name:'Patch panel',type:'device',w:440,h:150,kind:'Patch panel'},
  {id:'t12',name:'Wall port',type:'device',w:120,h:80,kind:'Outlet'}];
const AP_TYPES=[{name:'Urgent',hex:'#E5534B'},{name:'Needs follow-up',hex:'#E8A44C'},
  {name:'Customer decision',hex:'#29ADFF'},{name:'Done',hex:'#5BC77A'},{name:'Note',hex:'#8B99A9'}];
const newPlan=n=>({id:uid(),name:n||'Site plan',u:Date.now(),
  items:[],devices:[],conns:[],actions:[],colors:DEF_COLORS.slice(),templates:DEF_TPL.slice(),
  meta:{site:'',client:'',surveyor:'',date:new Date().toISOString().slice(0,10)},logo:''});
let svT2=null;const save=()=>{clearTimeout(svT2);svT2=setTimeout(()=>{P.u=Date.now();Tool.set('plans',plans)},400)};
const mm=v=>(v/1000).toFixed(2)+' m';
const W2S=(x,y)=>[x/1000*100*view.z+view.x,y/1000*100*view.z+view.y];
const S2W=(x,y)=>[(x-view.x)/(100*view.z)*1000,(y-view.y)/(100*view.z)*1000];
const snapv=v=>snap?Math.round(v/100)*100:Math.round(v);
const all=()=>P.items.concat(P.devices);
/* ---------- draw ---------- */
function drawPlan(ctx,P,view,opt){
  opt=opt||{};
  const dpr=opt.dpr||1,W=opt.w,H=opt.h;
  const w2s=(x,y)=>[x/1000*100*view.z+view.x,y/1000*100*view.z+view.y];
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=opt.paper?'#ffffff':'#0B0E12';ctx.fillRect(0,0,W,H);
  const ink=opt.paper?'#111':'#E6EBF1',faint=opt.paper?'#ccc':'#1C2129';
  if(opt.grid){ctx.strokeStyle=faint;ctx.lineWidth=1;ctx.beginPath();
    const step=100*view.z;
    if(step>6){for(let x=view.x%step;x<W;x+=step){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H)}
      for(let y=view.y%step;y<H;y+=step){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5)}}
    ctx.stroke()}
  /* walls */
  P.items.filter(i=>i.type==='wall').forEach(i=>{
    const a=w2s(i.x1,i.y1),b=w2s(i.x2,i.y2);
    ctx.strokeStyle=opt.paper?'#111':'#C6D0DB';ctx.lineWidth=Math.max(2,(i.th||100)/1000*100*view.z);
    ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    if(opt.dims!==false){const len=Math.hypot(i.x2-i.x1,i.y2-i.y1);
      ctx.fillStyle=opt.paper?'#666':'#8B99A9';ctx.font='10px ui-monospace,monospace';ctx.textAlign='center';
      ctx.fillText((len/1000).toFixed(2)+'m',(a[0]+b[0])/2,(a[1]+b[1])/2-6)}});
  /* rect items */
  P.items.filter(i=>i.type!=='wall').forEach(i=>{
    const p=w2s(i.x,i.y),w=i.w/1000*100*view.z,h=i.h/1000*100*view.z;
    ctx.save();ctx.translate(p[0],p[1]);ctx.rotate((i.rot||0)*Math.PI/180);
    if(i.type==='door'){ctx.strokeStyle=opt.paper?'#111':'#FFCCAA';ctx.lineWidth=1.5;
      ctx.strokeRect(0,-h/2,w,h);ctx.beginPath();ctx.arc(0,h/2,w,-Math.PI/2,0);ctx.stroke()}
    else if(i.type==='window'){ctx.fillStyle=opt.paper?'#dff':'#29ADFF';ctx.globalAlpha=.5;
      ctx.fillRect(0,-h/2,w,h);ctx.globalAlpha=1;ctx.strokeStyle=opt.paper?'#111':'#29ADFF';ctx.strokeRect(0,-h/2,w,h)}
    else{ctx.fillStyle=opt.paper?'rgba(0,0,0,.06)':'rgba(198,208,219,.13)';ctx.fillRect(0,0,w,h);
      ctx.strokeStyle=opt.paper?'#555':'#7E8B99';ctx.lineWidth=1;ctx.strokeRect(.5,.5,w-1,h-1);
      if(i.label&&w>34){ctx.fillStyle=opt.paper?'#333':'#B7C2CE';ctx.font='10px sans-serif';ctx.textAlign='center';
        ctx.fillText(i.label,w/2,h/2+3)}}
    ctx.restore()});
  /* connections */
  if(opt.conns){P.conns.forEach(c=>{
    const a=P.devices.find(d=>d.id===c.from),b=P.devices.find(d=>d.id===c.to);
    if(!a||!b)return;
    const col=(P.colors.find(x=>x.name===c.color)||{hex:'#4CC9C0'}).hex;
    const pa=w2s(a.x+a.w/2,a.y+a.h/2),pb=w2s(b.x+b.w/2,b.y+b.h/2);
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash(c.dashed?[6,4]:[]);
    ctx.beginPath();ctx.moveTo(pa[0],pa[1]);
    const mx=(pa[0]+pb[0])/2,my=(pa[1]+pb[1])/2;
    ctx.quadraticCurveTo(mx+(pb[1]-pa[1])*0.12,my-(pb[0]-pa[0])*0.12,pb[0],pb[1]);
    ctx.stroke();ctx.setLineDash([]);
    if(c.label&&view.z>0.45){ctx.fillStyle=col;ctx.font='10px ui-monospace,monospace';ctx.textAlign='center';
      ctx.fillText(c.label,mx,my-4)}})}
  /* devices */
  P.devices.forEach(d=>{
    const p=w2s(d.x,d.y),w=Math.max(10,d.w/1000*100*view.z),h=Math.max(10,d.h/1000*100*view.z);
    ctx.save();ctx.translate(p[0],p[1]);if(d.rot)ctx.rotate(d.rot*Math.PI/180);
    ctx.fillStyle=opt.paper?'#e8f4f2':'#12312F';ctx.strokeStyle='#4CC9C0';ctx.lineWidth=1.6;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(0,0,w,h,3);else ctx.rect(0,0,w,h);
    ctx.fill();ctx.stroke();
    ctx.fillStyle=opt.paper?'#0a5':'#9FEEE3';ctx.font='9px ui-monospace,monospace';ctx.textAlign='left';
    if(view.z>0.35)ctx.fillText(d.name||d.kind||'device',0,-4);
    ctx.restore()});
  /* action points */
  P.actions.forEach(a=>{
    const p=w2s(a.x,a.y);
    ctx.fillStyle=a.hex||'#E5534B';ctx.beginPath();ctx.arc(p[0],p[1],9,0,6.284);ctx.fill();
    ctx.fillStyle='#0B0E12';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(a.n||'!',p[0],p[1]+.5);ctx.textBaseline='alphabetic'});
  /* scale bar */
  if(opt.scalebar!==false){const px=100*view.z;
    ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(14,H/dpr-16);ctx.lineTo(14+px,H/dpr-16);ctx.stroke();
    ctx.fillStyle=ink;ctx.font='10px ui-monospace,monospace';ctx.textAlign='left';ctx.fillText('1 m',14,H/dpr-22)}
}
function redraw(){
  const cv=$('#fc'),wrap=$('#cvwrap'),dpr=devicePixelRatio;
  cv.width=wrap.clientWidth*dpr;cv.height=wrap.clientHeight*dpr;
  cv.style.width=wrap.clientWidth+'px';cv.style.height=wrap.clientHeight+'px';
  const ctx=cv.getContext('2d');
  drawPlan(ctx,P,view,{dpr,w:wrap.clientWidth,h:wrap.clientHeight,grid:snap,conns:showConn});
  /* selection highlight */
  if(selId){const o=all().find(x=>x.id===selId)||P.actions.find(x=>x.id===selId);

/* ---------- hit test + interaction ---------- */
function hit(wx,wy){
  for(const a of P.actions){if(Math.hypot(a.x-wx,a.y-wy)<120/view.z)return a}
  for(const d of P.devices){if(wx>=d.x&&wy>=d.y&&wx<=d.x+d.w&&wy<=d.y+d.h)return d}
  for(let i=P.items.length-1;i>=0;i--){const o=P.items[i];
    if(o.type==='wall'){const dx=o.x2-o.x1,dy=o.y2-o.y1,L=Math.hypot(dx,dy)||1;
      const t=Math.max(0,Math.min(1,((wx-o.x1)*dx+(wy-o.y1)*dy)/(L*L)));
      if(Math.hypot(o.x1+t*dx-wx,o.y1+t*dy-wy)<Math.max(90,(o.th||100)))return o}
    else if(wx>=o.x&&wy>=o.y-(o.type==='furniture'?0:o.h/2)&&wx<=o.x+o.w&&wy<=o.y+(o.type==='furniture'?o.h:o.h/2))return o}
  return null;
}

      if(cv._pd)view.z=Math.max(.08,Math.min(8,view.z*(d/cv._pd)));cv._pd=d;redraw();return}
    if(pan){view.x+=e.clientX-pan.x;view.y+=e.clientY-pan.y;pan={x:e.clientX,y:e.clientY};redraw();return}
    const [wx,wy]=pos(e);

        o.h=Math.max(50,snapv(drag.sh+wy-drag.oy));redraw();return}

        o.x1=snapv(drag.sx1+dx);o.y1=snapv(drag.sy1+dy);o.x2=snapv(drag.sx2+dx);o.y2=snapv(drag.sy2+dy)}
      else{o.x=snapv(drag.sx+wx-drag.ox);o.y=snapv(drag.sy+wy-drag.oy)}

    if(pending){redraw();const a=W2S(pending.x1,pending.y1),b=W2S(snapv(wx),snapv(wy));

      c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();c.setLineDash([]);

  });

function buildFPPrompt(tr,extra){
  return ['You are turning a site-survey voice note into structured data for a floor plan tool.',
  '',
  '=== THE TRANSCRIPT ===',tr,'',
  extra?'=== EXTRA CONTEXT ===\n'+extra+'\n':'',
  '=== RULES ===',
  'All coordinates and sizes are in MILLIMETRES, with 0,0 at the top-left of the building. x runs east, y runs south.',
  'Walls are line segments with x1,y1,x2,y2 and a thickness th (100 unless stated).',
  'Doors, windows and furniture are rectangles positioned by their top-left corner, with an optional rot in degrees.',
  'Devices are anything electrical or IT: access points, routers, switches, patch panels, cameras, outlets, printers.',
  'In "conns", "from" and "to" must be the exact "name" of a device in your own "devices" list.',
  'Cable types available: '+P.colors.map(c=>c.name).join(', ')+'. Use one of these exact strings in "color", or invent a new one if the transcript clearly describes a different cable.',
  'Action point types available: '+AP_TYPES.map(a=>a.name).join(', ')+'. Use one of these exact strings in "type".',
  'Anything the surveyor flags as a problem, a question for the customer, or a job to come back for becomes an action point, placed at the thing it refers to.',
  'Where a measurement is missing, make a sensible estimate rather than leaving it out, and say so in the note.',
  'Existing devices in the plan (reuse these names if the transcript refers to them): '+
    (P.devices.map(d=>d.name||d.kind).join(', ')||'none yet')+'.',
  '',
  '=== OUTPUT FORMAT ===',
  'Reply with a single JSON object and nothing else. No commentary, no markdown fences. This shape:',
  FP_SCHEMA,
  '',
  'Every key is optional except the ones shown inside each object. Omit arrays you have nothing for.'].join('\n');
}
function applyPlanJSON(){
  const go=raw=>{
    let o;try{
      let s=raw.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
      try{o=JSON.parse(s)}catch(e){const a=s.indexOf('{'),b=s.lastIndexOf('}');o=JSON.parse(s.slice(a,b+1))}
    }catch(e){toast('That is not valid JSON');return false}
    const map={};
    (o.devices||[]).forEach(d=>{const nd={id:uid(),type:'device',name:d.name||'',kind:d.kind||'Device',
      x:+d.x||0,y:+d.y||0,w:+d.w||200,h:+d.h||200,rot:+d.rot||0,model:d.model||'',serial:d.serial||'',
      ports:+d.ports||0,notes:d.notes||'',fields:Array.isArray(d.fields)?d.fields:[]};
      P.devices.push(nd);map[nd.name]=nd.id});
    (o.items||[]).forEach(i=>{
      if(i.type==='wall')P.items.push({id:uid(),type:'wall',x1:+i.x1||0,y1:+i.y1||0,x2:+i.x2||0,y2:+i.y2||0,th:+i.th||100});
      else P.items.push({id:uid(),type:i.type||'furniture',x:+i.x||0,y:+i.y||0,w:+i.w||1000,h:+i.h||100,
        rot:+i.rot||0,label:i.label||''})});
    (o.conns||[]).forEach(c=>{
      const f=map[c.from]||(P.devices.find(d=>d.name===c.from)||{}).id;
      const t=map[c.to]||(P.devices.find(d=>d.name===c.to)||{}).id;
      if(!f||!t)return;
      if(c.color&&!P.colors.some(x=>x.name===c.color))
        P.colors.push({name:c.color,hex:'#'+Math.floor(Math.random()*0xAAAAAA+0x333333).toString(16)});
      P.conns.push({id:uid(),from:f,to:t,fromPort:c.fromPort||'',toPort:c.toPort||'',
        label:c.label||'',color:c.color||P.colors[0].name,dashed:!!c.dashed,notes:c.notes||''})});
    (o.actions||[]).forEach(a=>{const t=AP_TYPES.find(x=>x.name===a.type)||AP_TYPES[0];
      P.actions.push({id:uid(),x:+a.x||0,y:+a.y||0,n:String(a.n||P.actions.length+1),type:t.name,hex:t.hex,note:a.note||''})});
    save();$('#zfit').click();redraw();
    $$('.mb').forEach(m=>m.remove());
    toast('Added '+(o.devices||[]).length+' devices, '+(o.items||[]).length+' items, '+
      (o.conns||[]).length+' connections, '+(o.actions||[]).length+' action points');
  };
  navigator.clipboard.readText().then(t=>{
    if(t&&t.trim().indexOf('{')>=0)return go(t);
    ask('')},()=>ask(''));
  function ask(pre){dialog({title:'Paste the AI output',style:'width:min(560px,100%)',
    body:'<textarea class="fld" rows="10" id="pj2">'+esc(pre)+'</textarea>'+
      '<div class="hint">Everything is added to the current plan — nothing is replaced.</div>',
    buttons:[{label:'Cancel',cls:'gho'},{label:'Add to plan',cls:'pri',close:false,
      onClick:b=>{if(go(b.querySelector('#pj2').value)!==false)b.close&&b.close()}}]})}
}

function planImage(w,h){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');
  const pts=[];P.items.forEach(o=>o.type==='wall'?pts.push([o.x1,o.y1],[o.x2,o.y2]):pts.push([o.x,o.y],[o.x+o.w,o.y+o.h]));
  P.devices.forEach(d=>pts.push([d.x,d.y],[d.x+d.w,d.y+d.h]));P.actions.forEach(a=>pts.push([a.x,a.y]));
  let v={x:40,y:40,z:1};
  if(pts.length){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
    const bw=(Math.max(...xs)-Math.min(...xs))/1000*100||1,bh=(Math.max(...ys)-Math.min(...ys))/1000*100||1;
    v.z=Math.min((w-80)/bw,(h-100)/bh);
    v.x=40-Math.min(...xs)/1000*100*v.z;v.y=50-Math.min(...ys)/1000*100*v.z}
  drawPlan(ctx,P,v,{dpr:1,w,h,grid:false,conns:true,paper:true});
  return c.toDataURL('image/png');
}

function md(src){

function autolink(root,selfId){
  const map={};
  E.forEach(e=>{if(e.id===selfId)return;
    [e.key].concat(e.aliases||[]).forEach(k=>{k=String(k||'').trim();if(k.length>1)map[k.toLowerCase()]=e.id})});
  const keys=Object.keys(map).sort((a,b)=>b.length-a.length);
  if(!keys.length)return;
  const re=new RegExp('(?<![\\w-])('+keys.map(escRe).join('|')+')(?![\\w-])','gi');
  const walk=n=>{
    for(const c of [...n.childNodes]){
      if(c.nodeType===3){
        const t=c.nodeValue;if(!t.trim())continue;
        re.lastIndex=0;if(!re.test(t))continue;re.lastIndex=0;
        const frag=document.createDocumentFragment();let last=0,m;
        while((m=re.exec(t))){
          if(m.index>last)frag.appendChild(document.createTextNode(t.slice(last,m.index)));
          const a=document.createElement('a');a.className='xl';a.dataset.k=map[m[0].toLowerCase()];
          a.textContent=m[0];frag.appendChild(a);last=m.index+m[0].length}
        if(last<t.length)frag.appendChild(document.createTextNode(t.slice(last)));
        c.replaceWith(frag);
      } else if(c.nodeType===1&&!/^(A|CODE|PRE|H1)$/.test(c.tagName))walk(c);
    }};
  walk(root);
}
/* ---------- views ---------- */
function tags(){
  const all=[...new Set(E.flatMap(e=>e.tags||[]))].sort();
  $('#tagbar').innerHTML=all.length?('<button class="tg'+(tagf?'':' on')+'" data-tag="">All</button>'+
    all.map(t=>'<button class="tg'+(tagf===t?' on':'')+'" data-tag="'+esc(t)+'">'+esc(t)+'</button>').join('')):'';
  $$('[data-tag]').forEach(b=>b.onclick=()=>{tagf=b.dataset.tag;tags();list()});
}
function list(){
  const q=$('#q').value.toLowerCase();

    (!q||e.key.toLowerCase().includes(q)||(e.aliases||[]).join(' ').toLowerCase().includes(q)||
     plain(e.value).toLowerCase().includes(q))).sort((a,b)=>a.key.localeCompare(b.key));
  $('#elist').innerHTML=l.length?l.map(e=>'<div class="eitem'+(cur&&cur.id===e.id?' on':'')+'" data-i="'+e.id+'">'+
    '<b>'+esc(e.key)+'</b><small>'+esc(plain(e.value).slice(0,70)||'Empty')+'</small></div>').join('')
    :'<div class="empty">Nothing here yet.</div>';
  $$('.eitem').forEach(x=>x.onclick=()=>{open(x.dataset.i);$('#stside').classList.remove('show')});

  $('#view').innerHTML='<h1 class="title">'+esc(cur.key)+'</h1>'+
    ((cur.aliases||[]).length?'<div class="aka">also: '+esc(cur.aliases.join(', '))+'</div>':'<div class="aka"></div>')+
    '<div class="doc" id="docbox">'+md(cur.value)+'</div>'+
    (links.length?'<div class="backl"><div class="aka">Mentioned by</div>'+
      links.map(o=>'<a class="xl" data-k="'+o.id+'">'+esc(o.key)+'</a>').join('')+'</div>':'');
  autolink($('#docbox'),cur.id);
  bindLinks();

      p.style.display='block';

  .ring2 span{position:absolute;inset:0;display:grid;place-items:center;font-size:31px;font-weight:300;letter-spacing:-1px}

</style>
