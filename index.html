      "html": "<div id=\"dc\">\n<style>\n  #dc{position:absolute;inset:0;background:#F2F2F7;overflow-y:auto;padding:24px 18px calc(40px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #dc .wrap{width:100%;max-width:520px}\n  #dc h2{margin:0 0 16px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #dc .tabs{display:flex;gap:6px;padding:3px;background:rgba(120,120,128,.12);border-radius:12px;margin-bottom:18px}\n  #dc .tabs button{flex:1;padding:9px;border:0;border-radius:9px;background:none;font-size:13.5px;font-weight:560;color:#6E6E76;cursor:pointer}\n  #dc .tabs button.on{background:#fff;color:#111114;box-shadow:0 1px 3px rgba(0,0,0,.1)}\n  #dc .pane{display:none} #dc .pane.on{display:block}\n  #dc .stage{background:#111114;border-radius:20px;padding:34px 22px;text-align:center;margin-bottom:16px;min-height:172px;display:flex;flex-direction:column;align-items:center;justify-content:center}\n  #dc .stage .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:12px}\n  #dc .stage .res{font-size:31px;font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1.25;word-break:break-word}\n  #dc .stage .res.spin{opacity:.4;filter:blur(1px)}\n  #dc .stage .sub{font-size:13px;color:rgba(255,255,255,.5);margin-top:10px}\n  #dc .go{width:100%;height:54px;border:0;border-radius:16px;background:#0A84FF;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:transform .15s}\n  #dc .go:active{transform:scale(.98)}\n  #dc .card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #dc .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:0 0 12px}\n  #dc .row{display:flex;gap:8px;margin-bottom:10px}\n  #dc input{flex:1;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:16px}\n  #dc input:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #dc .btn{padding:11px 15px;border:0;border-radius:12px;background:#0A84FF;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}\n  #dc .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #dc .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}\n  #dc .opt{display:flex;align-items:center;gap:10px;padding:11px 13px;background:#F7F7FA;border-radius:11px;margin-bottom:7px}\n  #dc .opt .n{flex:1;font-size:15px}\n  #dc .opt .w{flex:0 0 62px}\n  #dc .opt .w input{width:100%;padding:6px 8px;font-size:13px;text-align:center;border-radius:8px}\n  #dc .opt .x{border:0;background:none;color:#C3C3C9;font-size:19px;cursor:pointer;padding:0 2px}\n  #dc .opt .x:hover{color:#E5484D}\n  #dc .empty{text-align:center;color:#A6A6AE;font-size:14px;padding:22px 10px;line-height:1.6}\n  #dc .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}\n  #dc .presets button{padding:6px 12px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;font-size:12.5px;cursor:pointer;color:#6E6E76}\n  #dc .presets button:hover{border-color:#0A84FF;color:#0A84FF}\n  #dc .hist{margin-top:14px}\n  #dc .hist .h{display:flex;justify-content:space-between;padding:8px 12px;background:#fff;border-radius:10px;margin-bottom:5px;font-size:13px}\n  #dc .hist .h span:last-child{color:#A6A6AE;font-size:11.5px}\n  #dc .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n  #dc label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:0 0 6px}\n</style>\n  <div class=\"wrap\">\n    <h2>Decision Maker</h2>\n    <div class=\"tabs\" id=\"dcTabs\">\n      <button data-p=\"list\" class=\"on\">Pick one</button>\n      <button data-p=\"coin\">Coin</button>\n      <button data-p=\"num\">Number</button>\n      <button data-p=\"dice\">Dice</button>\n    </div>\n\n    <div class=\"stage\">\n      <div class=\"lbl\" id=\"dcLbl\">Result</div>\n      <div class=\"res\" id=\"dcRes\">—</div>\n      <div class=\"sub\" id=\"dcSub\"></div>\n    </div>\n    <button class=\"go\" id=\"dcGo\">Decide</button>\n\n    <div class=\"pane on\" id=\"dcList\">\n      <div class=\"card\">\n        <p class=\"cap\">Options</p>\n        <div class=\"row\"><input id=\"dcNew\" placeholder=\"Add an option…\"><button class=\"btn\" id=\"dcAdd\">Add</button></div>\n        <div id=\"dcOpts\"></div>\n        <div class=\"presets\" id=\"dcPresets\">\n          <button data-l=\"Pizza,Curry,Chinese,Thai,Burgers,Fish &amp; chips\">Takeaway</button>\n          <button data-l=\"Yes,No\">Yes / No</button>\n          <button data-l=\"Yes,No,Ask again later\">Magic 8</button>\n        </div>\n        <div style=\"display:flex;gap:8px;margin-top:12px\">\n          <button class=\"btn ghost sm\" id=\"dcClear\">Clear all</button>\n          <button class=\"btn ghost sm\" id=\"dcWeights\">Toggle weights</button>\n          <button class=\"btn ghost sm\" id=\"dcRemove\">Remove after pick</button>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"pane\" id=\"dcNum\">\n      <div class=\"card\"><p class=\"cap\">Range</p>\n        <div class=\"r2\">\n          <div><label for=\"dcMin\">From</label><input id=\"dcMin\" type=\"number\" value=\"1\" inputmode=\"numeric\"></div>\n          <div><label for=\"dcMax\">To</label><input id=\"dcMax\" type=\"number\" value=\"100\" inputmode=\"numeric\"></div>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"pane\" id=\"dcDice\">\n      <div class=\"card\"><p class=\"cap\">Dice</p>\n        <div class=\"r2\">\n          <div><label for=\"dcCount\">How many</label><input id=\"dcCount\" type=\"number\" value=\"2\" min=\"1\" max=\"12\" inputmode=\"numeric\"></div>\n          <div><label for=\"dcSides\">Sides</label><input id=\"dcSides\" type=\"number\" value=\"6\" min=\"2\" max=\"100\" inputmode=\"numeric\"></div>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"hist\" id=\"dcHist\"></div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst KEY = 'decide.options.v1';\nlet opts = [], mode = 'list', showW = false, removeAfter = false, hist = [], busy = false;\ntry { opts = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}\nif (!opts.length) opts = [{ n:'Pizza', w:1 }, { n:'Curry', w:1 }, { n:'Chinese', w:1 }];\nconst save = () => localStorage.setItem(KEY, JSON.stringify(opts));\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nconst rand = n => { const b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] % n; };\n\nfunction renderOpts(){\n  $('dcOpts').innerHTML = opts.length ? opts.map((o, i) =>\n    '<div class=\"opt\"><span class=\"n\">' + esc(o.n) + '</span>' +\n    (showW ? '<span class=\"w\"><input type=\"number\" min=\"1\" max=\"99\" value=\"' + o.w + '\" data-w=\"' + i + '\"></span>' : '') +\n    '<button class=\"x\" data-x=\"' + i + '\">&times;</button></div>').join('')\n    : '<div class=\"empty\">No options yet.<br>Add a few above.</div>';\n  $('dcOpts').querySelectorAll('[data-x]').forEach(b => b.onclick = () => { opts.splice(+b.dataset.x, 1); save(); renderOpts(); });\n  $('dcOpts').querySelectorAll('[data-w]').forEach(el => el.oninput = () => { opts[+el.dataset.w].w = Math.max(1, +el.value || 1); save(); });\n}\nfunction addOpt(n){\n  n = n.trim(); if (!n) return;\n  if (opts.some(o => o.n.toLowerCase() === n.toLowerCase())) return toast('Already on the list');\n  opts.push({ n, w:1 }); save(); renderOpts();\n}\n$('dcAdd').onclick = () => { addOpt($('dcNew').value); $('dcNew').value = ''; $('dcNew').focus(); };\n$('dcNew').addEventListener('keydown', e => { if (e.key === 'Enter') $('dcAdd').click(); });\n$('dcClear').onclick = async () => {\n  if (!opts.length) return;\n  if (!await confirmDlg('Clear all options?', 'The list is emptied.', 'Clear')) return;\n  opts = []; save(); renderOpts();\n};\n$('dcWeights').onclick = () => { showW = !showW; renderOpts(); };\n$('dcRemove').onclick = () => {\n  removeAfter = !removeAfter;\n  $('dcRemove').textContent = removeAfter ? '✓ Remove after pick' : 'Remove after pick';\n};\n$('dcPresets').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  b.dataset.l.split(',').forEach(n => { if (!opts.some(o => o.n === n)) opts.push({ n, w:1 }); });\n  save(); renderOpts();\n};\n\n$('dcTabs').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  mode = b.dataset.p;\n  $('dcTabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));\n  ['list','num','dice'].forEach(p => {\n    const el = $('dc' + p[0].toUpperCase() + p.slice(1));\n    if (el) el.classList.toggle('on', mode === p);\n  });\n  $('dcRes').textContent = '—'; $('dcSub').textContent = '';\n  $('dcLbl').textContent = { list:'Result', coin:'Coin flip', num:'Random number', dice:'Dice roll' }[mode];\n};\n\nfunction weightedPick(){\n  const total = opts.reduce((n, o) => n + (o.w || 1), 0);\n  let r = rand(total * 100) / 100;\n  for (const o of opts){ r -= (o.w || 1); if (r <= 0) return o; }\n  return opts[opts.length - 1];\n}\n\nasync function decide(){\n  if (busy) return;\n  busy = true;\n  const res = $('dcRes'), sub = $('dcSub');\n  sub.textContent = '';\n\n  let final = '', detail = '';\n  if (mode === 'list'){\n    if (!opts.length){ busy = false; return toast('Add some options first'); }\n    const pick = weightedPick();\n    final = pick.n;\n    const total = opts.reduce((n, o) => n + (o.w || 1), 0);\n    detail = opts.length + ' options · ' + Math.round((pick.w || 1) / total * 100) + '% chance';\n  } else if (mode === 'coin'){\n    final = rand(2) ? 'Heads' : 'Tails';\n  } else if (mode === 'num'){\n    const a = parseInt($('dcMin').value, 10) || 0, b = parseInt($('dcMax').value, 10) || 100;\n    const lo = Math.min(a, b), hi = Math.max(a, b);\n    final = String(lo + rand(hi - lo + 1));\n    detail = 'between ' + lo + ' and ' + hi;\n  } else {\n    const c = Math.max(1, Math.min(12, parseInt($('dcCount').value, 10) || 2));\n    const s = Math.max(2, Math.min(100, parseInt($('dcSides').value, 10) || 6));\n    const rolls = Array.from({ length:c }, () => 1 + rand(s));\n    final = String(rolls.reduce((a, b) => a + b, 0));\n    detail = c + 'd' + s + ' · ' + rolls.join(' + ');\n  }\n\n  // short shuffle animation before settling\n  res.classList.add('spin');\n  const pool = mode === 'list' ? opts.map(o => o.n)\n    : mode === 'coin' ? ['Heads','Tails']\n    : [final, String(rand(99) + 1), String(rand(99) + 1)];\n  for (let i = 0; i < 11; i++){\n    res.textContent = pool[rand(pool.length)];\n    await new Promise(r => setTimeout(r, 45 + i * 11));\n  }\n  res.classList.remove('spin');\n  res.textContent = final;\n  $('dcSub').textContent = detail;\n\n  hist.unshift({ v:final, t:Date.now() });\n  hist = hist.slice(0, 5);\n  $('dcHist').innerHTML = hist.map(h =>\n    '<div class=\"h\"><span>' + esc(h.v) + '</span><span>' +\n    new Date(h.t).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) + '</span></div>').join('');\n\n  if (mode === 'list' && removeAfter){\n    opts = opts.filter(o => o.n !== final);\n    save(); renderOpts();\n  }\n  busy = false;\n}\n$('dcGo').onclick = decide;\n\nrenderOpts();"
    }
  },
  "Workshop": {
    "Edit Tools": {
      "icon": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0Ij48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImdfZWRpdCIgeDE9IjAiIHkxPSIwIiB4Mj0iMCIgeTI9IjEiPjxzdG9wIG9mZnNldD0iMCIgc3RvcC1jb2xvcj0iIzZFODZGRiIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iIzNBNEZEOCIvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPjxyZWN0IHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgcng9IjE1IiBmaWxsPSJ1cmwoI2dfZWRpdCkiLz48ZyB0cmFuc2Zvcm09InRyYW5zbGF0ZSgxNCwxNCkgc2NhbGUoMS41KSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjEuOSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOSA3LjUgNC41IDEyIDkgMTYuNSIvPjxwYXRoIGQ9Ik0xNSA3LjUgMTkuNSAxMiAxNSAxNi41Ii8+PHBhdGggZD0iTTEzLjQgNSAxMC42IDE5Ii8+PC9nPjwvc3ZnPg==",
      "html": "<div id=\"et\">\n<style>\n  #et{position:absolute;inset:0;display:flex;background:#F2F2F7;overflow:hidden;\n      font-family:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif}\n  #et button{font:inherit;color:inherit}\n\n  /* --- sidebar --- */\n  #et-side{\n    flex:0 0 272px;display:flex;flex-direction:column;background:#fff;\n    border-right:1px solid rgba(60,60,67,.1);z-index:4\n  }\n  #et-sidehead{\n    display:flex;align-items:center;justify-content:space-between;gap:8px;\n    padding:12px 10px 10px 16px;border-bottom:1px solid rgba(60,60,67,.08)\n  }\n  #et-sidehead span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A6A6AE}\n  #et-sidehead button{width:28px;height:28px;border:0;border-radius:8px;background:rgba(120,120,128,.12);font-size:17px;line-height:1;cursor:pointer;color:#0A84FF}\n  #et-sidehead button:active{transform:scale(.9)}\n  #et-list{flex:1;overflow-y:auto;padding:8px}\n  #et-hint{margin:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));font-size:11.5px;line-height:1.4;color:#A6A6AE;border-top:1px solid rgba(60,60,67,.08)}\n  .et-cat{\n    display:flex;align-items:center;gap:6px;width:100%;padding:7px 8px;margin-top:2px;\n    border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;\n    font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8E8E96\n  }\n  .et-cat:hover{background:rgba(120,120,128,.09)}\n  .et-cat .chev{display:inline-block;font-size:9px;transition:transform .18s;color:#B8B8BE}\n  .et-cat.closed .chev{transform:rotate(-90deg)}\n  .et-cat .n{margin-left:auto;font-weight:600;letter-spacing:0;color:#C3C3C9}\n  .et-tool{\n    display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;\n    border:0;background:none;border-radius:9px;cursor:pointer;text-align:left;\n    font-size:14px;letter-spacing:-.01em;color:#111114\n  }\n  .et-tool img{width:22px;height:22px;border-radius:6px;object-fit:cover;flex:0 0 auto;background:#F2F2F7}\n  .et-tool .fallback{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:#F2F2F7;font-size:12px;flex:0 0 auto}\n  .et-tool span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .et-tool:hover{background:rgba(120,120,128,.09)}\n  .et-tool.sel{background:#0A84FF;color:#fff}\n  .et-tool.sel .fallback{background:rgba(255,255,255,.22)}\n\n  /* --- main --- */\n  #et-main{flex:1;display:flex;flex-direction:column;min-width:0}\n  #et-bar{\n    flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;\n    background:#fff;border-bottom:1px solid rgba(60,60,67,.1)\n  }\n  #et-burger{display:none;width:32px;height:32px;border:0;border-radius:9px;background:rgba(120,120,128,.12);cursor:pointer}\n  #et-name{font-size:14.5px;font-weight:640;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}\n  #et-seg{display:flex;gap:2px;padding:2px;border-radius:10px;background:rgba(120,120,128,.12);flex:0 0 auto}\n  #et-seg button{padding:5px 13px;border:0;border-radius:8px;background:none;font-size:13px;font-weight:560;color:#6E6E76;cursor:pointer;transition:.15s}\n  #et-seg button.on{background:#fff;color:#111114;box-shadow:0 1px 3px rgba(0,0,0,.1)}\n  #et-prevbtn{\n    flex:0 0 auto;padding:6px 13px;border:1px solid rgba(60,60,67,.16);border-radius:10px;\n    background:#fff;font-size:13px;font-weight:560;cursor:pointer;color:#6E6E76\n  }\n  #et-prevbtn.on{background:#0A84FF;border-color:#0A84FF;color:#fff}\n  #et-saved{flex:0 0 auto;font-size:12px;color:#A6A6AE;min-width:52px;text-align:right;transition:color .2s}\n  #et-saved.busy{color:#F5A524}\n\n  #et-panes{flex:1;display:flex;min-height:0}\n  #et-editwrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}\n  #et-ta{\n    flex:1;width:100%;padding:16px 18px;border:0;background:#fff;resize:none;outline:none;\n    font-family:ui-monospace,SFMono-Regular,\"SF Mono\",Menlo,Consolas,\"Liberation Mono\",monospace;\n    font-size:13px;line-height:1.65;color:#1A1A1F;tab-size:4;white-space:pre;overflow:auto;\n    -webkit-text-size-adjust:100%\n  }\n  #et-foot{\n    flex:0 0 auto;display:flex;gap:14px;padding:6px 18px;background:#FAFAFC;\n    border-top:1px solid rgba(60,60,67,.08);font-size:11.5px;color:#A6A6AE;\n    font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\n  }\n  #et-previewwrap{flex:1;display:none;flex-direction:column;min-width:0;min-height:0;border-left:1px solid rgba(60,60,67,.1);background:#fff}\n  #et.preview #et-previewwrap{display:flex}\n  #et-prevhead{\n    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;\n    padding:7px 14px;background:#FAFAFC;border-bottom:1px solid rgba(60,60,67,.08);\n    font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE\n  }\n  #et-prevhead button{border:0;background:none;color:#0A84FF;font-size:12px;cursor:pointer;letter-spacing:0;text-transform:none;font-weight:560}\n  #et-frame{flex:1;width:100%;border:0;background:#fff}\n\n  #et-scrim{display:none;position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:3}\n  #et-empty{flex:1;display:grid;place-items:center;padding:40px;text-align:center;color:#A6A6AE;font-size:14.5px}\n\n  @media (max-width:860px){\n    #et-side{position:absolute;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .26s cubic-bezier(.32,.72,0,1);box-shadow:0 0 40px rgba(0,0,0,.16);flex-basis:80%;max-width:300px}\n    #et.drawer #et-side{transform:none}\n    #et.drawer #et-scrim{display:block}\n    #et-burger{display:block}\n    #et-panes{flex-direction:column}\n    #et-previewwrap{border-left:0;border-top:1px solid rgba(60,60,67,.1)}\n    #et-ta{font-size:16px;line-height:1.55}\n    #et-name{font-size:13.5px}\n    #et-seg button{padding:5px 10px}\n  }\n</style>\n  <aside id=\"et-side\">\n    <div id=\"et-sidehead\"><span>Library</span><button id=\"et-addcat\" title=\"New subcategory\">+</button></div>\n    <div id=\"et-list\"></div>\n    <p id=\"et-hint\">Right-click or long-press any item for options.</p>\n  </aside>\n  <div id=\"et-scrim\"></div>\n  <section id=\"et-main\">\n    <div id=\"et-bar\">\n      <button id=\"et-burger\" aria-label=\"Show library\">&#9776;</button>\n      <div id=\"et-name\">Select a tool</div>\n      <div id=\"et-seg\"><button data-mode=\"html\" class=\"on\">HTML</button><button data-mode=\"js\">JavaScript</button></div>\n      <button id=\"et-prevbtn\">Preview</button>\n      <span id=\"et-saved\"></span>\n    </div>\n    <div id=\"et-panes\">\n      <div id=\"et-editwrap\">\n        <textarea id=\"et-ta\" spellcheck=\"false\" autocapitalize=\"off\" autocorrect=\"off\" placeholder=\"Select a tool from the library to edit its source.\"></textarea>\n        <div id=\"et-foot\"><span id=\"et-pos\">Ln 1, Col 1</span><span id=\"et-lines\">0 lines</span><span id=\"et-chars\">0 chars</span></div>\n      </div>\n      <div id=\"et-previewwrap\">\n        <div id=\"et-prevhead\"><span>Live preview</span><button id=\"et-reload\">Reload</button></div>\n        <iframe id=\"et-frame\" title=\"Live preview\"></iframe>\n      </div>\n    </div>\n  </section>\n</div>",
      "js": "const et      = document.getElementById('et');\nconst list    = document.getElementById('et-list');\nconst ta      = document.getElementById('et-ta');\nconst frame   = document.getElementById('et-frame');\nconst savedEl = document.getElementById('et-saved');\nconst S = { cat:null, name:null, mode:'html', closed:new Set() };\nlet saveTimer, prevTimer;\n\n/* ---------- object helpers: order matters, so keys are rebuilt ---------- */\nfunction moveKey(obj, key, dir){\n  const keys = Object.keys(obj), i = keys.indexOf(key), j = i + dir;\n  if (i < 0 || j < 0 || j >= keys.length) return obj;\n  keys.splice(j, 0, keys.splice(i, 1)[0]);\n  const out = {}; keys.forEach(k => out[k] = obj[k]); return out;\n}\nfunction renameKey(obj, oldK, newK){\n  const out = {}; for (const k in obj) out[k === oldK ? newK : k] = obj[k]; return out;\n}\nfunction commit(){ saveTools(); renderList(); }\n\n/* ---------- sidebar ---------- */\nfunction renderList(){\n  list.innerHTML = '';\n  for (const cat of Object.keys(tools)){\n    const head = document.createElement('button');\n    head.className = 'et-cat' + (S.closed.has(cat) ? ' closed' : '');\n    head.dataset.cat = cat;\n    head.innerHTML = '<span class=\"chev\">&#9660;</span>' + escapeHtml(cat) +\n                     '<span class=\"n\">' + Object.keys(tools[cat]).length + '</span>';\n    head.onclick = () => { S.closed.has(cat) ? S.closed.delete(cat) : S.closed.add(cat); renderList(); };\n    bindMenu(head, () => catMenu(cat));\n    list.appendChild(head);\n    if (S.closed.has(cat)) continue;\n\n    for (const name of Object.keys(tools[cat])){\n      const b = document.createElement('button');\n      b.className = 'et-tool' + (cat === S.cat && name === S.name ? ' sel' : '');\n      b.innerHTML = iconMarkup(tools[cat][name].icon, 'fallback') + '<span>' + escapeHtml(name) + '</span>';\n      b.onclick = () => { select(cat, name); et.classList.remove('drawer'); };\n      bindMenu(b, () => toolMenu(cat, name));\n      list.appendChild(b);\n    }\n  }\n  if (!Object.keys(tools).length){\n    list.innerHTML = '<p style=\"padding:20px;color:#A6A6AE;font-size:13px\">No subcategories yet. Use + to add one.</p>';\n  }\n}\n\n/* Right-click on desktop, long-press on touch, both open the same menu. */\nfunction bindMenu(el, build){\n  let timer, sx, sy, justOpened = false;\n  const open = (x, y) => { justOpened = true; showMenu(x, y, build()); };\n\n  el.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); open(e.clientX, e.clientY); };\n  el.addEventListener('touchstart', e => {\n    e.stopPropagation();\n    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;\n    timer = setTimeout(() => { timer = null; open(sx, sy); }, 480);\n  }, { passive:true });\n  el.addEventListener('touchmove', e => {\n    const t = e.touches[0];\n    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) clearTimeout(timer);\n  }, { passive:true });\n  el.addEventListener('touchend', () => clearTimeout(timer));\n  // a long press must not also count as a tap\n  el.addEventListener('click', e => {\n    if (!justOpened) return;\n    justOpened = false; e.preventDefault(); e.stopImmediatePropagation();\n  }, true);\n}\n\n/* ---------- editing ---------- */\nfunction select(cat, name){\n  S.cat = cat; S.name = name;\n  document.getElementById('et-name').textContent = cat + '  \\u203A  ' + name;\n  ta.value = tools[cat][name][S.mode] || '';\n  renderList(); updateFoot(); refreshPreview();\n}\nfunction setMode(mode){\n  S.mode = mode;\n  document.querySelectorAll('#et-seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));\n  if (S.cat) ta.value = tools[S.cat][S.name][mode] || '';\n  updateFoot();\n}\ndocument.getElementById('et-seg').onclick = e => {\n  const b = e.target.closest('button'); if (b) setMode(b.dataset.mode);\n};\n\nta.addEventListener('input', () => {\n  if (!S.cat) return;\n  tools[S.cat][S.name][S.mode] = ta.value;   // the object updates on every keystroke\n  savedEl.textContent = 'Saving\\u2026'; savedEl.classList.add('busy');\n  clearTimeout(saveTimer);\n  saveTimer = setTimeout(() => {\n    saveTools();\n    savedEl.textContent = 'Saved'; savedEl.classList.remove('busy');\n  }, 260);\n  updateFoot(); refreshPreview();\n});\nta.addEventListener('keyup', updateFoot);\nta.addEventListener('click', updateFoot);\n\n/* Tab inserts four spaces; Shift+Tab removes them. Selections indent line by line. */\nta.addEventListener('keydown', e => {\n  if (e.key !== 'Tab') return;\n  e.preventDefault();\n  const v = ta.value, s = ta.selectionStart, t = ta.selectionEnd;\n  const lineStart = v.lastIndexOf('\\n', s - 1) + 1;\n\n  if (s === t && !e.shiftKey){\n    ta.value = v.slice(0, s) + '    ' + v.slice(t);\n    ta.selectionStart = ta.selectionEnd = s + 4;\n  } else {\n    const lineEnd = v.indexOf('\\n', t) === -1 ? v.length : v.indexOf('\\n', t);\n    const block = v.slice(lineStart, lineEnd);\n    let removedFirst = 0, delta = 0;\n    const lines = block.split('\\n').map((ln, i) => {\n      if (e.shiftKey){\n        const cut = ln.match(/^ {1,4}/);\n        const n = cut ? cut[0].length : 0;\n        if (i === 0) removedFirst = n;\n        delta -= n;\n        return ln.slice(n);\n      }\n      if (i === 0) removedFirst = -4;\n      delta += 4;\n      return '    ' + ln;\n    });\n    ta.value = v.slice(0, lineStart) + lines.join('\\n') + v.slice(lineEnd);\n    ta.selectionStart = Math.max(lineStart, s - removedFirst);\n    ta.selectionEnd = t + delta;\n  }\n  ta.dispatchEvent(new Event('input'));\n});\n\nfunction updateFoot(){\n  const upto = ta.value.slice(0, ta.selectionStart).split('\\n');\n  document.getElementById('et-pos').textContent = 'Ln ' + upto.length + ', Col ' + (upto[upto.length - 1].length + 1);\n  document.getElementById('et-lines').textContent = ta.value.split('\\n').length + ' lines';\n  document.getElementById('et-chars').textContent = ta.value.length + ' chars';\n}\n\n/* ---------- live preview ---------- */\ndocument.getElementById('et-prevbtn').onclick = e => {\n  et.classList.toggle('preview');\n  e.currentTarget.classList.toggle('on', et.classList.contains('preview'));\n  refreshPreview(true);\n};\ndocument.getElementById('et-reload').onclick = () => refreshPreview(true);\n\nfunction refreshPreview(now){\n  if (!et.classList.contains('preview') || !S.cat) return;\n  clearTimeout(prevTimer);\n  prevTimer = setTimeout(() => {\n    const t = tools[S.cat][S.name];\n    const open = '<scr' + 'ipt>', close = '</scr' + 'ipt>';\n    frame.srcdoc =\n      '<!DOCTYPE html><meta charset=\"utf-8\">' +\n      '<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">' +\n      '<style>html,body{margin:0;min-height:100%;position:relative;' +\n      'font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}</style>' +\n      t.html +\n      open + 'function toast(m){console.log(m)}function onToolExit(){}' + close +\n      open + 'try{' + t.js + '\\n}catch(e){document.body.insertAdjacentHTML(\"beforeend\",' +\n      '\"<pre style=\\\\\"margin:0;padding:12px;background:#FFF1F1;color:#8B1A1E;font:12px monospace;white-space:pre-wrap\\\\\">\"+e+\"</pre>\")}' + close;\n  }, now ? 0 : 320);\n}\n\n/* ---------- structure: tools ---------- */\nfunction toolMenu(cat, name){\n  const names = Object.keys(tools[cat]);\n  const i = names.indexOf(name);\n  return [\n    { cap:name },\n    { label:'Rename tool\\u2026', on: async () => {\n        const v = await ask('Rename tool', 'Tool name', name);\n        if (!v || v === name) return;\n        if (tools[cat][v]) return toast('That name is already used');\n        tools[cat] = renameKey(tools[cat], name, v);\n        repin(cat + '/' + name, cat + '/' + v);\n        if (S.cat === cat && S.name === name) S.name = v;\n        commit(); if (S.cat === cat) select(cat, S.name);\n      } },\n    { label:'Edit icon\\u2026', on: async () => {\n        const v = await ask('Tool icon', 'Image URL, data: URI, or a single emoji', tools[cat][name].icon, true);\n        if (v === null) return;\n        tools[cat][name].icon = v.trim(); commit();\n      } },\n    { label:'Move to subcategory\\u2026', on: async () => {\n        const target = await choose('Move \"' + name + '\" to', Object.keys(tools).filter(c => c !== cat));\n        if (!target) return;\n        if (tools[target][name]) return toast('That subcategory already has a tool with this name');\n        tools[target][name] = tools[cat][name];\n        delete tools[cat][name];\n        repin(cat + '/' + name, target + '/' + name);\n        if (S.cat === cat && S.name === name) S.cat = target;\n        commit(); if (S.name === name) select(target, name);\n      } },\n    'sep',\n    { label:'Move up', disabled:i === 0, on: () => { tools[cat] = moveKey(tools[cat], name, -1); commit(); } },\n    { label:'Move down', disabled:i === names.length - 1, on: () => { tools[cat] = moveKey(tools[cat], name, 1); commit(); } },\n    'sep',\n    { label:'New tool in \"' + cat + '\"\\u2026', on: () => newTool(cat) },\n    { label:'Delete tool', danger:true, on: async () => {\n        if (!await confirmDlg('Delete \"' + name + '\"?', 'This removes the tool and its source from the library.', 'Delete')) return;\n        delete tools[cat][name];\n        repin(cat + '/' + name, null);\n        if (S.cat === cat && S.name === name){ S.cat = S.name = null; ta.value = ''; document.getElementById('et-name').textContent = 'Select a tool'; }\n        commit(); toast('Tool deleted');\n      } }\n  ];\n}\n\nasync function newTool(cat){\n  const name = await ask('New tool', 'Tool name', '');\n  if (!name) return;\n  if (tools[cat][name]) return toast('That name is already used');\n  tools[cat][name] = {\n    icon: '\\u{1F9F0}',\n    html: '<div id=\"my-tool\">\\n    <style>\\n        #my-tool{padding:32px;text-align:center}\\n    </style>\\n    <h2>' + name + '</h2>\\n    <p id=\"my-tool-out\">Ready.</p>\\n</div>',\n    js:   '// Runs as soon as the tool opens.\\ndocument.getElementById(\"my-tool-out\").textContent = \"Hello from ' + name.replace(/\"/g,'') + '\";'\n  };\n  commit(); select(cat, name);\n}\n\n/* ---------- structure: subcategories ---------- */\nfunction catMenu(cat){\n  const cats = Object.keys(tools);\n  const i = cats.indexOf(cat);\n  return [\n    { cap:cat },\n    { label:'New tool here\\u2026', on: () => newTool(cat) },\n    { label:'Rename subcategory\\u2026', on: async () => {\n        const v = await ask('Rename subcategory', 'Subcategory name', cat);\n        if (!v || v === cat) return;\n        if (tools[v]) return toast('That subcategory already exists');\n        Object.keys(tools[cat]).forEach(n => repin(cat + '/' + n, v + '/' + n));\n        tools = renameKey(tools, cat, v);\n        if (S.cat === cat) S.cat = v;\n        commit(); if (S.cat === v) select(v, S.name);\n      } },\n    'sep',\n    { label:'Move up', disabled:i === 0, on: () => { tools = moveKey(tools, cat, -1); commit(); } },\n    { label:'Move down', disabled:i === cats.length - 1, on: () => { tools = moveKey(tools, cat, 1); commit(); } },\n    'sep',\n    { label:'New subcategory\\u2026', on: newCat },\n    { label:'Delete subcategory', danger:true, on: async () => {\n        const n = Object.keys(tools[cat]).length;\n        if (!await confirmDlg('Delete \"' + cat + '\"?', n ? 'This also deletes the ' + n + ' tool' + (n > 1 ? 's' : '') + ' inside it.' : 'The subcategory is empty.', 'Delete')) return;\n        Object.keys(tools[cat]).forEach(t => repin(cat + '/' + t, null));\n        delete tools[cat];\n        if (S.cat === cat){ S.cat = S.name = null; ta.value = ''; document.getElementById('et-name').textContent = 'Select a tool'; }\n        commit(); toast('Subcategory deleted');\n      } }\n  ];\n}\nasync function newCat(){\n  const v = await ask('New subcategory', 'Subcategory name', '');\n  if (!v) return;\n  if (tools[v]) return toast('That subcategory already exists');\n  tools[v] = {}; commit();\n}\ndocument.getElementById('et-addcat').onclick = newCat;\nbindMenu(list, () => [{ cap:'Library' }, { label:'New subcategory\\u2026', on:newCat }]);\n\n/* ---------- chrome ---------- */\ndocument.getElementById('et-burger').onclick = () => et.classList.toggle('drawer');\ndocument.getElementById('et-scrim').onclick  = () => et.classList.remove('drawer');\n\nrenderList();\nconst wanted = String(window.pendingEdit || '').split('/');\nwindow.pendingEdit = null;\nif (wanted.length === 2 && tools[wanted[0]] && tools[wanted[0]][wanted[1]]){\n  select(wanted[0], wanted[1]);\n} else {\n  const firstCat = Object.keys(tools)[0];\n  if (firstCat && Object.keys(tools[firstCat])[0]) select(firstCat, Object.keys(tools[firstCat])[0]);\n}\nsavedEl.textContent = 'Saved';"

      "html": "<div id=\"sc\">\n<style>\n  #sc{position:absolute;inset:0;display:flex;flex-direction:column;background:#F2F2F7}\n  #sc .bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid rgba(60,60,67,.1)}\n  #sc .bar .title{font-size:14px;font-weight:640;letter-spacing:-.01em;color:#111114}\n  #sc .bar .spacer{flex:1}\n  #sc .bar .saved{font-size:12px;color:#A6A6AE;transition:color .2s}\n  #sc .bar .saved.busy{color:#F5A524}\n  #sc .bar button{padding:7px 13px;border:1px solid rgba(60,60,67,.14);border-radius:10px;background:#fff;font-size:13px;font-weight:560;color:#111114;cursor:pointer}\n  #sc .bar button:hover{border-color:#0A84FF;color:#0A84FF}\n  #sc textarea{\n    flex:1;width:100%;border:0;outline:none;resize:none;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));\n    background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;\n    font-size:16px;line-height:1.6;color:#1A1A1F\n  }\n  #sc textarea::placeholder{color:#B8B8BE}\n  #sc .foot{display:flex;gap:16px;padding:8px 20px calc(8px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid rgba(60,60,67,.08);font-size:11.5px;color:#A6A6AE;font-variant-numeric:tabular-nums}\n</style>\n  <div class=\"bar\">\n    <span class=\"title\">Scratchpad</span>\n    <span class=\"spacer\"></span>\n    <span class=\"saved\" id=\"scSaved\">Saved</span>\n    <button id=\"scCopy\">Copy all</button>\n    <button id=\"scClear\">Clear</button>\n  </div>\n  <textarea id=\"scText\" spellcheck=\"true\" placeholder=\"Start typing. Everything is saved on this device automatically.\"></textarea>\n  <div class=\"foot\"><span id=\"scWords\">0 words</span><span id=\"scChars\">0 characters</span><span id=\"scLines\">1 line</span></div>\n</div>",
      "js": "const KEY = 'scratchpad.text.v1';\nconst ta = document.getElementById('scText');\nconst saved = document.getElementById('scSaved');\nlet timer;\n\nta.value = localStorage.getItem(KEY) || '';\n\nfunction counts(){\n  const t = ta.value;\n  const words = (t.trim().match(/\\S+/g) || []).length;\n  document.getElementById('scWords').textContent = words + (words === 1 ? ' word' : ' words');\n  document.getElementById('scChars').textContent = t.length + (t.length === 1 ? ' character' : ' characters');\n  const lines = t.split('\\n').length;\n  document.getElementById('scLines').textContent = lines + (lines === 1 ? ' line' : ' lines');\n}\n\nta.addEventListener('input', () => {\n  saved.textContent = 'Saving\\u2026'; saved.classList.add('busy');\n  clearTimeout(timer);\n  timer = setTimeout(() => {\n    try { localStorage.setItem(KEY, ta.value); saved.textContent = 'Saved'; }\n    catch { saved.textContent = 'Storage full'; }\n    saved.classList.remove('busy');\n  }, 250);\n  counts();\n});\n\ndocument.getElementById('scCopy').onclick = () => {\n  if (!ta.value) return toast('Nothing to copy');\n  navigator.clipboard.writeText(ta.value).then(() => toast('Copied'), () => toast('Copied'));\n};\ndocument.getElementById('scClear').onclick = async () => {\n  if (!ta.value) return;\n  if (!await confirmDlg('Clear the scratchpad?', 'This erases the note saved on this device.', 'Clear')) return;\n  ta.value = ''; localStorage.removeItem(KEY); counts(); saved.textContent = 'Saved'; ta.focus();\n};\n\ncounts();"

      "html": "<div id=\"wb\">\n<style>\n#wb{position:absolute;inset:0;display:flex;flex-direction:column;background:#F2F2F7;overflow:hidden;font-family:var(--font)}\n#wb button{font:inherit}\n#wb .bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 14px;background:#fff;border-bottom:1px solid rgba(60,60,67,.1);z-index:15;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}\n#wb .bar::-webkit-scrollbar{display:none}\n#wb .bar h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;max-width:32vw;overflow:hidden;text-overflow:ellipsis}\n#wb .sp{flex:1 0 6px}\n#wb .b{padding:7px 13px;border:0;border-radius:9px;background:#0A84FF;color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .12s,opacity .12s;flex:0 0 auto}\n#wb .b:active{transform:scale(.96)}\n#wb .b:disabled{opacity:.35;cursor:default}\n#wb .b.g{background:rgba(120,120,128,.12);color:#111114}\n#wb .b.d{background:rgba(229,72,77,.13);color:#B8390E}\n#wb .b.s{padding:6px 10px;font-size:12px;border-radius:8px}\n#wb .b.ico{padding:6px 9px;font-size:13px}\n#wb .seg{display:flex;gap:2px;background:rgba(120,120,128,.12);padding:2px;border-radius:9px;flex:0 0 auto}\n#wb .seg button{padding:5px 10px;border:0;border-radius:7px;background:none;font-size:12px;font-weight:600;color:#6E6E76;cursor:pointer}\n#wb .seg button.on{background:#fff;color:#111114;box-shadow:0 1px 3px rgba(0,0,0,.12)}\n#wb .saved{font-size:11.5px;color:#A6A6AE;white-space:nowrap;flex:0 0 auto}\n#wb .saved.busy{color:#0A84FF}\n\n/* ---------- home ---------- */\n#wbHome{flex:1;overflow-y:auto;padding:22px 16px calc(60px + env(safe-area-inset-bottom,0px))}\n#wbHome .wrap{max-width:860px;margin:0 auto}\n#wbHome .hsearch{width:100%;padding:11px 14px;border:1px solid rgba(60,60,67,.14);border-radius:12px;font:inherit;font-size:15px;background:#fff;margin-bottom:14px}\n#wbHome .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}\n#wbHome .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -16px rgba(16,24,40,.4);cursor:pointer;transition:transform .15s;display:flex;flex-direction:column}\n#wbHome .card:hover{transform:translateY(-2px)}\n#wbHome .card .thumb{height:120px;background:#EDEDF2;position:relative;overflow:hidden;border-bottom:1px solid rgba(60,60,67,.07)}\n#wbHome .card .thumb i{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-style:normal;opacity:.5}\n#wbHome .card .meta{padding:13px 14px;flex:1;display:flex;flex-direction:column;gap:3px}\n#wbHome .card h3{margin:0;font-size:15.5px;font-weight:680;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n#wbHome .card p{margin:0;font-size:12px;color:#A6A6AE}\n#wbHome .card .row{display:flex;gap:6px;padding:0 12px 12px}\n#wbHome .empty{text-align:center;padding:70px 20px;color:#6E6E76;font-size:15px;line-height:1.7}\n\n/* ---------- editor ---------- */\n#wbEd{flex:1;display:none;min-height:0;position:relative}\n#wbEd.on{display:flex}\n#wbLeft{flex:0 0 232px;background:#fff;border-right:1px solid rgba(60,60,67,.09);display:flex;flex-direction:column;min-height:0;z-index:8}\n#wbLeft .lt{display:flex;border-bottom:1px solid rgba(60,60,67,.09);background:#F7F7FA;flex:0 0 auto}\n#wbLeft .lt button{flex:1;padding:10px 4px;border:0;background:none;font-size:12px;font-weight:650;color:#6E6E76;cursor:pointer;border-bottom:2px solid transparent}\n#wbLeft .lt button.on{color:#0A84FF;border-bottom-color:#0A84FF;background:#fff}\n#wbLeft .lb{flex:1;overflow-y:auto;padding:10px}\n#wbLeft .pane{display:none}\n#wbLeft .pane.on{display:block}\n#wb .cap{font-size:10.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:14px 4px 7px}\n#wb .cap:first-child{margin-top:2px}\n#wb .row-item{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:550;color:#111114;user-select:none;-webkit-user-select:none}\n#wb .row-item:hover{background:rgba(120,120,128,.09)}\n#wb .row-item.on{background:rgba(10,132,255,.12);color:#0060DF}\n#wb .row-item .gr{cursor:grab;opacity:.35;font-size:12px;letter-spacing:-2px;flex:0 0 auto;touch-action:none;padding:0 2px}\n#wb .row-item .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n#wb .row-item .x{opacity:0;border:0;background:none;color:#A6A6AE;cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;flex:0 0 auto}\n#wb .row-item:hover .x{opacity:1}\n#wb .row-item .x:hover{color:#E5484D}\n#wb .row-item.drag{opacity:.4}\n#wb .row-item.over{box-shadow:inset 0 2px 0 #0A84FF}\n#wb .add-b{display:flex;align-items:flex-start;gap:9px;width:100%;padding:9px 10px;margin-bottom:5px;border:1px solid rgba(60,60,67,.12);border-radius:10px;background:#fff;cursor:pointer;text-align:left;transition:.12s}\n#wb .add-b:hover{border-color:#0A84FF;background:rgba(10,132,255,.05)}\n#wb .add-b .em{font-size:15px;line-height:1.2;flex:0 0 auto}\n#wb .add-b b{display:block;font-size:12.5px;font-weight:640;color:#111114}\n#wb .add-b span{font-size:11px;color:#A6A6AE;line-height:1.35;display:block}\n\n#wbStage{flex:1;min-width:0;overflow:auto;background:#DEDEE3;padding:18px;display:flex;justify-content:center;align-items:flex-start}\n#wbFrameBox{width:100%;max-width:var(--vpw,1180px);transition:max-width .25s ease;background:#fff;border-radius:10px;box-shadow:0 18px 46px rgba(0,0,0,.18);overflow:hidden;min-height:70vh;position:relative}\n#wbFrame{display:block;width:100%;height:100%;min-height:70vh;border:0;background:#fff}\n#wbStage.mobile{padding:26px 18px}\n\n#wbSide{flex:0 0 306px;background:#fff;border-left:1px solid rgba(60,60,67,.09);display:flex;flex-direction:column;min-height:0;z-index:8}\n#wbSide .lt{display:flex;border-bottom:1px solid rgba(60,60,67,.09);background:#F7F7FA;flex:0 0 auto}\n#wbSide .lt button{flex:1;padding:10px 4px;border:0;background:none;font-size:12px;font-weight:650;color:#6E6E76;cursor:pointer;border-bottom:2px solid transparent}\n#wbSide .lt button.on{color:#0A84FF;border-bottom-color:#0A84FF;background:#fff}\n#wbSide .lb{flex:1;overflow-y:auto;padding:14px}\n#wbSide .pane{display:none}\n#wbSide .pane.on{display:block}\n#wb label.f{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.055em;color:#A6A6AE;margin:13px 0 5px}\n#wb label.f:first-child{margin-top:0}\n#wb input.f,#wb select.f,#wb textarea.f{width:100%;padding:8px 10px;border:1px solid rgba(60,60,67,.16);border-radius:9px;font:inherit;font-size:13.5px;color:#111114;background:#fff}\n#wb textarea.f{resize:vertical;min-height:74px;line-height:1.5;font-size:13px}\n#wb input.f:focus,#wb select.f:focus,#wb textarea.f:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3px rgba(10,132,255,.13)}\n#wb input[type=color].f{height:36px;padding:3px}\n#wb input[type=range].f{padding:0;border:0}\n#wb .two{display:flex;gap:8px}\n#wb .two>*{flex:1;min-width:0}\n#wb .chk{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:13px;color:#111114;cursor:pointer}\n#wb .chk input{width:16px;height:16px;flex:0 0 auto;accent-color:#0A84FF}\n#wb .rep{border:1px solid rgba(60,60,67,.12);border-radius:10px;padding:9px;margin-bottom:7px;background:#FAFAFC;position:relative}\n#wb .rep .rh{display:flex;align-items:center;gap:5px;margin-bottom:5px}\n#wb .rep .rh b{flex:1;font-size:11px;font-weight:700;color:#A6A6AE;text-transform:uppercase;letter-spacing:.05em}\n#wb .rep .rh button{border:0;background:rgba(120,120,128,.13);border-radius:6px;width:22px;height:22px;font-size:12px;cursor:pointer;color:#6E6E76;display:grid;place-items:center;padding:0}\n#wb .rep .rh button:hover{background:rgba(10,132,255,.15);color:#0A84FF}\n#wb .rep .rh button.x:hover{background:rgba(229,72,77,.15);color:#E5484D}\n#wb .hint{font-size:11.5px;color:#A6A6AE;line-height:1.5;margin:7px 0 0}\n#wb .imgrow{display:flex;gap:6px}\n#wb .imgrow input{flex:1;min-width:0}\n#wb .swatches{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}\n#wb .swatches button{width:26px;height:26px;border-radius:7px;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0}\n#wb .empty-s{text-align:center;color:#A6A6AE;font-size:13px;line-height:1.6;padding:34px 8px}\n\n#wbOv{position:absolute;inset:0;background:#111114;z-index:40;display:none;flex-direction:column}\n#wbOv.on{display:flex}\n#wbOv .ob{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#1C1C22;border-bottom:1px solid rgba(255,255,255,.08)}\n#wbOv .ob b{color:#fff;font-size:13.5px;font-weight:650}\n#wbOv iframe{flex:1;border:0;background:#fff;width:100%}\n\n@media(max-width:1000px){\n  #wbLeft{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .22s;box-shadow:8px 0 26px rgba(0,0,0,.16)}\n  #wbEd.showL #wbLeft{transform:none}\n  #wbSide{position:absolute;right:0;top:0;bottom:0;transform:translateX(100%);transition:transform .22s;box-shadow:-8px 0 26px rgba(0,0,0,.16);flex-basis:290px;max-width:88vw}\n  #wbEd.showR #wbSide{transform:none}\n  #wbScrim{position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:7;display:none}\n  #wbEd.showL #wbScrim,#wbEd.showR #wbScrim{display:block}\n  #wbStage{padding:10px}\n}\n@media(min-width:1001px){#wb .mob-only{display:none!important}}\n</style>\n\n<div class=\"bar\" id=\"wbBarHome\">\n  <h2>Website Builder</h2><span class=\"sp\"></span>\n  <button class=\"b g s\" id=\"wbImport\">Import</button>\n  <button class=\"b\" id=\"wbNew\">+ New Site</button>\n</div>\n\n<div class=\"bar\" id=\"wbBarEd\" style=\"display:none\">\n  <button class=\"b g ico\" id=\"wbBack\" title=\"All sites\">&larr;</button>\n  <button class=\"b g ico mob-only\" id=\"wbTogL\" title=\"Pages &amp; blocks\">&#9776;</button>\n  <h2 id=\"wbTitle\">Site</h2>\n  <span class=\"saved\" id=\"wbSaved\">Saved</span>\n  <span class=\"sp\"></span>\n  <button class=\"b g ico\" id=\"wbUndo\" title=\"Undo (Ctrl+Z)\">&#8630;</button>\n  <button class=\"b g ico\" id=\"wbRedo\" title=\"Redo (Ctrl+Shift+Z)\">&#8631;</button>\n  <div class=\"seg\" id=\"wbVp\">\n    <button class=\"on\" data-w=\"1180\">Desktop</button>\n    <button data-w=\"820\">Tablet</button>\n    <button data-w=\"390\">Mobile</button>\n  </div>\n  <button class=\"b g s\" id=\"wbPrev\">Preview</button>\n  <button class=\"b s\" id=\"wbExport\">Export</button>\n  <button class=\"b g ico mob-only\" id=\"wbTogR\" title=\"Inspector\">&#9881;</button>\n</div>\n\n<div id=\"wbHome\"><div class=\"wrap\"><input class=\"hsearch\" id=\"wbQ\" placeholder=\"Search sites…\" spellcheck=\"false\"><div id=\"wbList\"></div></div></div>\n\n<div id=\"wbEd\">\n  <div id=\"wbScrim\"></div>\n  <div id=\"wbLeft\">\n    <div class=\"lt\" id=\"wbLTabs\"><button class=\"on\" data-p=\"out\">Outline</button><button data-p=\"lib\">Add block</button></div>\n    <div class=\"lb\">\n      <div class=\"pane on\" id=\"wbPaneOut\"></div>\n      <div class=\"pane\" id=\"wbPaneLib\"></div>\n    </div>\n  </div>\n\n  <div id=\"wbStage\"><div id=\"wbFrameBox\"><iframe id=\"wbFrame\" title=\"Canvas\"></iframe></div></div>\n\n  <aside id=\"wbSide\">\n    <div class=\"lt\" id=\"wbRTabs\"><button class=\"on\" data-p=\"blk\">Block</button><button data-p=\"des\">Design</button><button data-p=\"set\">Site</button></div>\n    <div class=\"lb\">\n      <div class=\"pane on\" id=\"wbPaneBlk\"></div>\n      <div class=\"pane\" id=\"wbPaneDes\"></div>\n      <div class=\"pane\" id=\"wbPaneSet\"></div>\n    </div>\n  </aside>\n\n  <div id=\"wbOv\">\n    <div class=\"ob\"><b id=\"wbOvT\">Preview</b><span class=\"sp\"></span><button class=\"b g s\" id=\"wbOvClose\">Close</button></div>\n    <iframe id=\"wbOvFrame\" title=\"Preview\"></iframe>\n  </div>\n</div>\n</div>\n",
      "js": "/* ============================================================\n   Website Builder  —  multi-page visual site studio\n   Canvas is a real iframe rendered by the same generator that\n   produces the exported HTML, so what you see is what ships.\n   ============================================================ */\nconst $ = id => document.getElementById(id);\nconst KEY = 'wb.sites.v5';\nconst LEGACY = 'wb.sites.v4';\n\nlet sites = [], site = null, page = null, sel = null;\nlet undoStack = [], redoStack = [], saveT = null, renderT = null, suppressRender = false;\n\nconst uid = p => (p || 'x') + Math.random().toString(36).slice(2, 9);\nconst esc = s => String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\nconst slugify = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'page';\nconst clone = o => JSON.parse(JSON.stringify(o));\n\n/* ---------- storage ---------- */\nfunction load() {\n  try { sites = JSON.parse(localStorage.getItem(KEY)) || []; } catch { sites = []; }\n  if (!sites.length) {\n    try {\n      const old = JSON.parse(localStorage.getItem(LEGACY)) || [];\n      sites = old.map(o => ({\n        id: o.id, name: o.title || 'Imported site', created: Date.now(), updated: Date.now(),\n        theme: o.theme || 'light', accent: o.accent || '#0A84FF', accent2: '#111114',\n        fontH: 'Inter', fontB: 'Inter', radius: 14, cw: 1080, pad: parseInt(o.pad) || 48,\n        css: '', head: '', desc: '', icon: '\\u{1F310}',\n        pages: [{ id: uid('p'), name: 'Home', slug: 'index', blocks: (o.blocks || []).map(migrate) }]\n      }));\n      if (sites.length) save();\n    } catch { }\n  }\n  sites.forEach(fix);\n}\nfunction migrate(b) {\n  const n = { id: uid('b'), type: b.type, _align: b.align || null };\n  Object.keys(b).forEach(k => { if (k !== 'id' && k !== 'type' && k !== 'align') n[k] = b[k]; });\n  if (n.type === 'features' || n.type === 'testimonials') n.items = b.items || [];\n  return n;\n}\nfunction fix(s) {\n  s.pages = s.pages || [{ id: uid('p'), name: 'Home', slug: 'index', blocks: [] }];\n  s.pages.forEach(p => { p.blocks = p.blocks || []; p.blocks.forEach(b => { if (!b.id) b.id = uid('b'); }); });\n  s.assets = s.assets || {};\n  if (s.cw == null) s.cw = 1080;\n  if (s.radius == null) s.radius = 14;\n  if (s.pad == null) s.pad = 56;\n}\nfunction save(quiet) {\n  try { localStorage.setItem(KEY, JSON.stringify(sites)); }\n  catch (e) { toast('Storage full — try smaller images'); }\n  if (!quiet && $('wbSaved')) {\n    const el = $('wbSaved');\n    el.textContent = 'Saving\\u2026'; el.classList.add('busy');\n    clearTimeout(saveT);\n    saveT = setTimeout(() => { el.textContent = 'Saved'; el.classList.remove('busy'); }, 380);\n  }\n}\nfunction touch() { if (site) site.updated = Date.now(); save(); }\n\n/* ---------- undo ---------- */\nfunction snap() {\n  if (!site) return;\n  undoStack.push(JSON.stringify(site));\n  if (undoStack.length > 60) undoStack.shift();\n  redoStack.length = 0;\n  syncUndoBtns();\n}\nfunction syncUndoBtns() {\n  if (!$('wbUndo')) return;\n  $('wbUndo').disabled = !undoStack.length;\n  $('wbRedo').disabled = !redoStack.length;\n}\nfunction restore(json) {\n  const data = JSON.parse(json);\n  const i = sites.findIndex(s => s.id === data.id);\n  if (i < 0) return;\n  sites[i] = data; site = data; fix(site);\n  page = site.pages.find(p => p.id === (page && page.id)) || site.pages[0];\n  if (sel && !page.blocks.some(b => b.id === sel)) sel = null;\n  touch(); renderAll();\n}\nfunction undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(site)); restore(undoStack.pop()); syncUndoBtns(); }\nfunction redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(site)); restore(redoStack.pop()); syncUndoBtns(); }\n\n/* ---------- fonts & themes ---------- */\nconst FONTS = ['System', 'Inter', 'Manrope', 'Poppins', 'DM Sans', 'Outfit', 'Sora', 'Space Grotesk',\n  'Montserrat', 'Work Sans', 'Nunito', 'Rubik', 'Playfair Display', 'Fraunces', 'Lora',\n  'Merriweather', 'Libre Baskerville', 'Cormorant Garamond', 'Bebas Neue', 'Anton',\n  'JetBrains Mono', 'IBM Plex Mono', 'Space Mono'];\nconst SYSTEM_STACK = \"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif\";\nconst fontStack = f => f === 'System' || !f ? SYSTEM_STACK : \"'\" + f + \"',\" + SYSTEM_STACK;\n\nconst THEMES = {\n  light: { bg: '#FFFFFF', ink: '#101014', soft: '#F5F5F8', line: 'rgba(16,16,20,.10)', accent: '#0A84FF' },\n  paper: { bg: '#FBF8F3', ink: '#221F1A', soft: '#F1EBE1', line: 'rgba(34,31,26,.12)', accent: '#B4531F' },\n  slate: { bg: '#F4F5F7', ink: '#1B1F27', soft: '#E7E9EE', line: 'rgba(27,31,39,.12)', accent: '#3B5BDB' },\n  dark: { bg: '#0E0E11', ink: '#F2F2F5', soft: '#1A1A20', line: 'rgba(255,255,255,.12)', accent: '#5B8CFF' },\n  midnight: { bg: '#0A1128', ink: '#DCE3F2', soft: '#111C3D', line: 'rgba(220,227,242,.13)', accent: '#4CC9F0' },\n  forest: { bg: '#0F2A20', ink: '#D9F2E4', soft: '#17392C', line: 'rgba(217,242,228,.13)', accent: '#4ADE80' },\n  plum: { bg: '#1A0F22', ink: '#F3E8FF', soft: '#281634', line: 'rgba(243,232,255,.13)', accent: '#C084FC' },\n  neon: { bg: '#050507', ink: '#E6FFEE', soft: '#0D1310', line: 'rgba(0,255,120,.18)', accent: '#00FF7F' },\n  sand: { bg: '#F6EFE6', ink: '#3A2E26', soft: '#EBE0D2', line: 'rgba(58,46,38,.13)', accent: '#C77B3C' },\n  mono: { bg: '#FFFFFF', ink: '#000000', soft: '#F0F0F0', line: 'rgba(0,0,0,.14)', accent: '#000000' }\n};\nconst THEME_LABEL = { light: 'Light', paper: 'Paper', slate: 'Slate', dark: 'Dark', midnight: 'Midnight', forest: 'Forest', plum: 'Plum', neon: 'Neon', sand: 'Sand', mono: 'Mono' };\n\n/* ---------- tiny markdown for rich text fields ---------- */\nfunction md(t) {\n  let s = esc(t);\n  s = s.replace(/\\[([^\\]\\n]+)\\]\\(([^)\\s]+)\\)/g, '<a href=\"$2\">$1</a>');\n  s = s.replace(/\\*\\*([^*\\n]+)\\*\\*/g, '<strong>$1</strong>');\n  s = s.rep ('p'); c.name = p.name + ' copy'; c.slug = slugify(c.name); c.blocks.forEach(b => b.id = uid('b')); site.pages.push(c); touch(); openPage(c); }\n  else if (pick === 'Delete page') {\n    if (!await confirmDlg('Delete \"' + p.name + '\"?', 'Every block on this page is removed.', 'Delete')) return;\n    snap();\n    site.pages = site.pages.filter(x => x !== p);\n    touch(); openPage(site.pages[0]);\n  }\n}\n\n/* generic pointer-based drag reorder for a list of rows */\nfunction dragList(root, rowSel, handleSel, done) {\n  root.querySelectorAll(rowSel).forEach(row => {\n    const h = row.querySelector(handleSel);\n    if (!h) return;\n    h.addEventListener('pointerdown', e => {\n      e.preventDefault();\n      const rows = [...root.querySelectorAll(rowSel)];\n      const from = rows.indexOf(row);\n      row.classList.add('drag');\n      let to = from;\n      const move = ev => {\n        const y = ev.clientY;\n        rows.forEach((r, i) => {\n          r.classList.remove('over');\n          const b = r.getBoundingClientRect();\n          if (y >= b.top && y <= b.bottom) { to = i; if (i !== from) r.classList.add('over'); }\n        });\n      };\n      const up = () => {\n        removeEventListener('pointermove', move); removeEventListener('pointerup', up);\n        row.classList.remove('drag');\n        rows.forEach(r => r.classList.remove('over'));\n        if (to !== from) done(from, to);\n      };\n      addEventListener('pointermove', move); addEventListener('pointerup', up);\n    });\n  });\n}\n\n/* ---------- block library ---------- */\nfunction renderLibrary() {\n  const cats = {};\n  Object.keys(BLOCKS).forEach(k => { (cats[BLOCKS[k].c] = cats[BLOCKS[k].c] || []).push(k); });\n  let h = '';\n  Object.keys(cats).forEach(c => {\n    h += '<div class=\"cap\">' + esc(c) + '</div>';\n    cats[c].forEach(k => {\n      h += '<button class=\"add-b\" data-add=\"' + k + '\"><span class=\"em\">' + BLOCKS[k].em + '</span>' +\n        '<span><b>' + esc(BLOCKS[k].n) +  = inp.files[0]; if (!f) return;\n    if (f.size > 1.6 * 1024 * 1024) return toast('Image too large \\u2014 keep it under 1.5 MB');\n    const r = new FileReader();\n    r.onload = () => cb(r.result);\n    r.readAsDataURL(f);\n  };\n  inp.click();\n}\n\nfunction buildField(spec, obj, changed) {\n  const v = obj[spec.k];\n  if (spec.t === 'chk') {\n    const w = el('label', 'chk');\n    const c = document.createElement('input'); c.type = 'checkbox'; c.checked = !!v;\n    c.onchange = () => { obj[spec.k] = c.checked; changed(true); };\n    w.append(c, el('span', '', spec.l));\n    return w;\n  }\n  if (spec.t === 'list') {\n    const w = document.createElement('div');\n    w.append(el('label', 'f', spec.l));\n    const arr = obj[spec.k] = obj[spec.k] || [];\n    arr.forEach((item, i) => {\n      const card = el('div', 'rep');\n      const hd = el('div', 'rh');\n      hd.append(el('b', '', '#' + (i + 1)));\n      const mk = (t, title, fn) => { const b = el('button', '', t); b.title = title; b.onclick = fn; return b; };\n      hd.append(\n        mk('\\u2191', 'Move up', () => { if (i > 0) { snap(); arr.splice(i - 1, 0, arr.splice(i, 1)[0]); changed(true); } }),\n        mk('\\u2193', 'Move down', () => { if (i < arr.length - 1) { snap(); arr.splice(i + 1, 0, arr.splice(i, 1)[0]); changed(true); } }),\n        mk('\\u29C9', 'Duplicate', () => { snap(); arr.splice(i + 1, 0, clone(item)); changed(true); })\n      );\n      const x = mk('\\u00D7', 'Remove', () => { snap(); arr.splice(i, 1); changed(true); }); x.className = 'x';\n      hd.append(x);\n      card.append(hd);\n      spec.f.forEach(sf => card.append(buildField(sf, item, changed)));\n      w.append(card);\n    });\n    const add = el('button', 'b g s', '+ Add ' + spec.l.replace(/s$/, '').toLowerCase());\n    add.style.width = '100%';\n    add.onclick = () => { snap(); arr.push(spec.add ? spec.add() : {}); changed(true); };\n    w.append(add);\n    return w;\n  }\n  if (spec.t === 'sel') {\n    const s = el('sele e=\"font-size:16px\">' + def.em + '</span><b style=\"flex:1;font-size:14px\">' + esc(def.n) + '</b>';\n  const dup = el('button', 'b g s', 'Copy'); dup.onclick = () => blockAction('dup', b.id);\n  const del = el('button', 'b d s', 'Delete'); del.onclick = () => blockAction('del', b.id);\n  hd.append(dup, del);\n  box.append(hd);\n  const changed = structural => {\n    if (structural) snap(); else debouncedSnap();\n    touch();\n    renderCanvas(!!structural);\n    if (structural) { renderInspector(); renderOutline(); }\n  };\n  def.f.forEach(f => box.append(buildField(f, b, changed)));\n}\n\n/* ---------- Design tab (per-block styling) ---------- */\nconst COMMON = [\n  S('_align', 'Text alignment', [['left', 'Left'], ['center', 'Centre'], ['right', 'Right']]),\n  S('_w', 'Content width', [['', 'Normal container'], ['wide', 'Wide'], ['narrow', 'Narrow'], ['full', 'Full bleed']]),\n  { k: '_pt', t: 'num', l: 'Padding top (px)', mn: 0, mx: 400 },\n  { k: '_pb', t: 'num', l: 'Padding bottom (px)', mn: 0, mx: 400 },\n  K('_soft', 'Use the soft background tone'),\n  C('_bg', 'Background colour'),\n  C('_ink', 'Text colour'),\n  C('_acc', 'Accent colour for this block'),\n  I('_img', 'Background image'),\n  { k: '_ov', t: 'num', l: 'Background image dim (0\\u20131)', mn: 0, mx: 1 },\n  K('_round', 'Rounded card edges'),\n  K('_shadow', 'Drop shadow'),\n  K('_anim', 'Fade in on scroll'),\n  K('_hideM', 'Hide on mobile'),\n  T('_id', 'Anchor id (for #links)')\n];\nfunction renderDesign() {\n  const box = $('wbPaneDes');\n  box.innerHTML = '';\n  const b = findBlock(sel);\n  if (!b) { box.innerHTML = '<p class=\"empty-s\">Select a block to change its spacing, colours and background.</p>'; return; }\n  const changed = structural => { if (structural) snap(); else debouncedSnap(); touch(); renderCanvas(true); if (structural) renderDesign(); };\n  COMMON.forEach(f => box.append(buildField(f, b, changed)));\n  const reset = el('button', 'b g s', 'Reset this block\\u2019s styling' mn;gap:7px';\n  const mk = (cls, txt, fn) => { const b = el('button', 'b ' + cls, txt); b.onclick = fn; return b; };\n  tools.append(\n    mk('g s', 'Export project (.json)', () => dl(JSON.stringify(site, null, 2), slugify(site.name) + '.json', 'application/json')),\n    mk('g s', 'Duplicate this site', () => { const c = clone(site); c.id = uid('wb'); c.name = site.name + ' copy'; reid(c); sites.unshift(c); save(); toast('Duplicated \\u2014 find it on the sites screen'); }),\n    mk('d s', 'Delete this site', async () => {\n      if (!await confirmDlg('Delete \"' + site.name + '\"?', 'The site and all of its pages are permanently removed.', 'Delete')) return;\n      sites = sites.filter(s => s.id !== site.id); save(); renderHome(); toast('Site deleted');\n    })\n  );\n  box.append(tools);\n  box.append(Object.assign(el('p', 'hint'), { textContent: 'Everything autosaves to this device. Use Export project to keep a backup or move a site to another device.' }));\n}\n\n/* ============================================================\n   Export / preview\n   ============================================================ */\nasync function doExport() {\n  const opts = ['Download this page (.html)'];\n  if (site.pages.length > 1) opts.push('Download every page');\n  opts.push('Copy this page\\u2019s HTML', 'Open in a new tab', 'Export project (.json)');\n  const pick = await choose('Export \"' + site.name + '\"', opts);\n  if (!pick) return;\n  if (pick === 'Download this page (.html)') {\n    dl(pageDoc(site, page, 'export'), (page.slug === 'index' ? 'index' : page.slug) + '.html');\n    toast('Downloaded');\n  } else if (pick === 'Download every page') {\n    site.pages.forEach((p, i) => setTimeout(() =>\n      dl(pageDoc(site, p, 'export'), (p.slug === 'index' ? 'index' : p.slug) + '.html'), i * 420));\n    toast(site.pages.length + ' files downloading');\n  } else if (pick === 'Copy this page\\u2019s HTML') {\n    try { await navigator.clipboard.writeText(pageDoc(site, page, 'export')); toast('HTML copied'); }\n    catch { toast('Could not copy \\u2014 use Download instead'); }\n  } else if (pick === 'Open in a new tab') {\n    const w = window.open('', '_blank');\n    if (!w) return toast('Pop-up blocked');\n    w.document.write(pageDoc(site, page, 'export')); w.document.close();\n  } else if (pick === 'Export project (.json)') {\n    dl(JSON.stringify(site, null, 2), slugify(site.name) + '.json', 'application/json');\n  }\n}\nfunction importProject() {\n  const inp = document.createElement('input');\n  inp.type = 'file'; inp.accept = 'application/json,.json';\n  inp.onchange = () => {\n    const f = inp.files[0]; if (!f) return;\n    const r = new FileReader();\n    r.onload = () => {\n      try {\n        const data = JSON.parse(r.result);\n        const arr = Array.isArray(data) ? data : [data];\n        arr.forEach(s => { s.id = uid('wb'); fix(s); reid(s); sites.unshift(s); });\n        save(); renderHome(); toast('Imported ' + arr.length + (arr.length === 1 ? ' site' : ' sites'));\n      } catch (e) { toast('That file is not a builder project'); }\n    };\n    r.readAsText(f);\n  };\n  inp.click();\n}\n\n/* ============================================================\n   Chrome wiring\n   ============================================================ */\nfunction setTab(side, p) {\n  const tabs = side === 'L' ? $('wbLTabs') : $('wbRTabs');\n  tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.p === p));\n  const panes = side === 'L' ? ['out', 'lib'] : ['blk', 'des', 'set'];\n  const pre = side === 'L' ? 'wbPane' : 'wbPane';\n  const map = { out: 'wbPaneOut', lib: 'wbPaneLib', blk: 'wbPaneBlk', des: 'wbPaneDes', set: 'wbPaneSet' };\n  panes.forEach(k => $(map[k]).classList.toggle('on', k === p));\n}\n$('wbLTabs').onclick = e => { const b = e.target.closest('button'); if (b) setTab('L', b.dataset.p); };\n$('wbRTabs').onclick = e => { const b = e.target.closest('button'); if (b) setTab('R', b.dataset.p); };\n$('wbNew').onclick = newSite;\n$('wbImport').onclick = importProject;\n$('wbQ').oninput = renderHome;\n$('wbBack').onclick = renderHome;\n$('wbUndo').onclick = undo;\n$('wbRedo').onclick = redo;\n$('wbExport').onclick = doExport;\n$('wbTogL').onclick = () => { $('wbEd').classList.remove('showR'); $('wbEd').classList.toggle('showL'); };\n$('wbTogR').onclick = () => { $('wbEd').classList.remove('showL'); $('wbEd').classList.toggle('showR'); };\n$('wbScrim').onclick = () => $('wbEd').classList.remove('showL', 'showR');\n$('wbVp').onclick = e => {\n  const b = e.target.closest('button'); if (!b) return;\n  $('wbVp').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));\n  $('wbFrameBox').style.setProperty('--vpw', b.dataset.w + 'px');\n  $('wbStage').classList.toggle('mobile', b.dataset.w !== '1180');\n};\n$('wbPrev').onclick = () => {\n  $('wbOvT').textContent = 'Preview \\u2014 ' + page.name;\n  $('wbOvFrame').srcdoc = pageDoc(site, page, 'export');\n  $('wbOv').classList.add('on');\n};\n$('wbOvClose').onclick = () => { $('wbOv').classList.remove('on'); $('wbOvFrame').srcdoc = ''; };\n\nconst onKey = e => {\n  if (!site || $('wbOv').classList.contains('on')) return;\n  const tag = (document.activeElement || {}).tagName;\n  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'IFRAME';\n  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }\n  if (typing) return;\n  if ((e.key === 'Delete' || e.key === 'Backspace') && sel) { e.preventDefault(); blockAction('del', sel); }\n  if (e.key === 'Escape' && sel) { selectBlock(null); }\n};\naddEventListener('keydown', onKey);\nonToolExit(() => {\n  removeEventListener('keydown', onKey);\n  if (frameRO) { try { frameRO.disconnect(); } catch { } }\n  delete window.__wbHook;\n});\n\nload();\nrenderHome();\n"

      "html": "<div id=\"gc\">\n<style>\n#gc{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;\n  --g-bg:#14141B;--g-p:#1D1D26;--g-p2:#262631;--g-p3:#31313E;--g-line:#3A3A48;\n  --g-ink:#EDEDF4;--g-ink2:#9C9CB2;--g-ink3:#6C6C82;--g-acc:#4C8DFF;--g-acc2:#FF6B9D;--g-ok:#3DD68C;--g-warn:#FFB84D;\n  background:var(--g-bg);color:var(--g-ink);font-family:var(--font);font-size:14px}\n#gc *{box-sizing:border-box}\n#gc button,#gc input,#gc select,#gc textarea{font-family:inherit}\n#gc .bar{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--g-p);border-bottom:1px solid var(--g-line);overflow-x:auto;scrollbar-width:none;z-index:6}\n#gc .bar::-webkit-scrollbar{display:none}\n#gc .bar h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}\n#gc .sp{flex:1 0 4px}\n#gc .b{flex:0 0 auto;padding:7px 12px;border:0;border-radius:8px;background:var(--g-p3);color:var(--g-ink);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:filter .12s,transform .1s}\n#gc .b:hover{filter:brightness(1.25)}\n#gc .b:active{transform:scale(.96)}\n#gc .b.p{background:var(--g-acc);color:#fff}\n#gc .b.d{background:#4A2230;color:#FF9AA8}\n#gc .b.ok{background:#1E4436;color:var(--g-ok)}\n#gc .b.s{padding:5px 9px;font-size:11.5px;border-radius:7px}\n#gc .b.on{background:var(--g-acc);color:#fff}\n#gc .b:disabled{opacity:.35;cursor:default}\n#gc .tag{font-size:11px;color:var(--g-ink3);white-space:nowrap;flex:0 0 auto}\n#gc .tag.busy{color:var(--g-acc)}\n#gc .seg{display:flex;gap:2px;background:var(--g-p2);padding:2px;border-radius:8px;flex:0 0 auto}\n#gc .seg button{padding:5px 11px;border:0;border-radius:6px;background:none;color:var(--g-ink2);font-size:12px;font-weight:650;cursor:pointer}\n#gc .seg button.on{background:var(--g-acc);color:#fff}\n\n/* home */\n#gcHome{flex:1;overflow-y:auto;padding:20px 16px calc(50px + env(safe-area-inset-bottom,0px))}\n#gcHome .wrap{max-width:760px;margin:0 auto}\n#gcHome .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}\n#gcHome .c{background:var(--g-p);border:1px solid var(--g-line);border-radius:14px;padding:15px;cursor:pointer;transition:.15s}\n#gcHome .c:hover{border-color:var(--g-acc);transform:translateY(-2px)}\n#gcHome .c h3{margin:0 0 5px;font-size:15px;font-weight:680}\n#gcHome .c p{margin:0;font-size:11.5px;color:var(--g-ink3);line-height:1.6}\n#gcHome .c .row{display:flex;gap:6px;margin-top:12px}\n#gcHome .empty{text-align:center;padding:64px 20px;color:var(--g-ink2);font-size:14.5px;line-height:1.8}\n\n/* editor */\n#gcEd{flex:1;display:none;flex-direction:column;min-height:0}\n#gcEd.on{display:flex}\n#gcTabs{flex:0 0 auto;display:flex;background:var(--g-p);border-bottom:1px solid var(--g-line)}\n#gcTabs button{flex:1;padding:11px 4px;border:0;background:none;color:var(--g-ink3);font-size:13px;font-weight:680;cursor:pointer;border-bottom:2px solid transparent}\n#gcTabs button.on{color:var(--g-acc);border-bottom-color:var(--g-acc);background:var(--g-p2)}\n#gc .pane{flex:1;display:none;min-height:0;flex-direction:column}\n#gc .pane.on{display:flex}\n#gc .list{flex:1;overflow-y:auto;padding:16px}\n#gc .list .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));gap:14px}\n#gc .tile{background:var(--g-p);border:1px solid var(--g-line);border-radius:14px;padding:14px;cursor:pointer;transition:.15s}\n#gc .tile:hover{border-color:var(--g-acc)}\n#gc .tile canvas{width:100%;height:128px;object-fit:contain;image-rendering:pixelated;background:#0E0E14;border-radius:9px;display:block;margin-bottom:11px}\n#gc .tile b{display:block;font-size:14.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n#gc .tile span{font-size:12px;color:var(--g-ink3)}\n#gc .tile .row{display:flex;gap:7px;margin-top:11px}\n#gc .tile .row .b{flex:1;padding:9px 10px;font-size:12.5px;border-radius:9px;min-height:36px}\n#gc .none{text-align:center;padding:56px 20px;color:var(--g-ink3);font-size:14px;line-height:1.8}\n\n/* sprite editor */\n#gcSprEd,#gcMapEd,#gcSfxEd,#gcMusEd{flex:1;display:none;flex-direction:column;min-height:0}\n#gcSprEd.on,#gcMapEd.on,#gcSfxEd.on,#gcMusEd.on{display:flex}\n#gc .tools{flex:0 0 auto;display:flex;gap:4px;padding:7px 10px;background:var(--g-p);border-bottom:1px solid var(--g-line);overflow-x:auto;scrollbar-width:none;align-items:center}\n#gc .tools::-webkit-scrollbar{display:none}\n#gc .tools .t{flex:0 0 auto;width:31px;height:31px;border:0;border-radius:7px;background:var(--g-p3);color:var(--g-ink);font-size:14px;cursor:pointer;display:grid;place-items:center;padding:0}\n#gc .tools .t.on{background:var(--g-acc);color:#fff}\n#gc .tools .t:hover{filter:brightness(1.25)}\n#gc .div{width:1px;height:22px;background:var(--g-line);flex:0 0 auto;margin:0 3px}\n#gcCanWrap{flex:1;min-height:0;display:grid;place-items:center;padding:14px;background:\n  repeating-conic-gradient(#191921 0 25%,#14141B 0 50%) 0 0/16px 16px;overflow:auto}\n#gcCanBox{position:relative;line-height:0;box-shadow:0 0 0 1px var(--g-line),0 16px 40px rgba(0,0,0,.5)}\n#gcCanBox canvas{display:block;image-rendering:pixelated;touch-action:none;background:\n  repeating-conic-gradient(#2A2A34 0 25%,#22222B 0 50%) 0 0/12px 12px}\n#gcGrid{position:absolute;inset:0;pointer-events:none;background:none!important}\n/* This is the ONLY layer that receives pointer input. Keeping it separate\n   from the art/onion/grid canvases means a future visual change can never\n   again silently disable drawing by adding pointer-events:none to the\n   wrong layer (that bug is what broke the pencil tool before this rewrite). */\n#gcCanTouch{position:absolute;inset:0;cursor:crosshair;touch-action:none}\n#gcBottom{flex:0 0 auto;background:var(--g-p);border-top:1px solid var(--g-line)}\n#gcPal{display:flex;flex-wrap:wrap;gap:4px;padding:9px 10px 6px;align-items:center}\n#gcPal .sw{width:26px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0;position:relative}\n#gcPal .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--g-acc)}\n#gcPal .sw.tr{background:repeating-conic-gradient(#555 0 25%,#333 0 50%) 0 0/8px 8px}\n#gcStrip{display:flex;gap:6px;padding:6px 10px 12px;overflow-x:auto}\n#gcStrip .sp-i{flex:0 0 auto;position:relative;cursor:pointer;border:2px solid transparent;border-radius:7px;padding:2px;background:#0E0E14}\n#gcStrip .sp-i.on{border-color:var(--g-acc)}\n#gcStrip .sp-i.tagged{box-shadow:0 0 0 1px var(--tag-col,var(--g-ok)) inset}\n#gcStrip .sp-i canvas{display:block;image-rendering:pixelated;width:42px;height:42px}\n#gcStrip .sp-i i{position:absolute;bottom:0;left:2px;font-style:normal;font-size:9px;color:var(--g-ink3);background:rgba(0,0,0,.6);padding:0 2px;border-radius:3px;pointer-events:none}\n#gcStrip .sp-i .more{position:absolute;top:1px;right:1px;width:16px;height:16px;border:0;border-radius:4px;\n  background:rgba(0,0,0,.55);color:#fff;font-size:10px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}\n#gcStrip .sp-i .more:hover{background:var(--g-acc)}\n#gcStrip .add{flex:0 0 auto;align-self:center;width:42px;height:42px;border-radius:7px;border:1.5px dashed var(--g-line);\n  background:none;color:var(--g-ink3);font-size:18px;cursor:pointer;display:grid;place-items:center}\n#gcStrip .add:hover{border-color:var(--g-acc);color:var(--g-acc)}\n\n/* map */\n#gcMapWrap{flex:1;min-height:0;position:relative;background:#0F0F16;overflow:hidden}\n#gcMapCan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}\n#gcMapHud{position:absolute;left:10px;bottom:10px;background:rgba(15,15,22,.86);border:1px solid var(--g-line);border-radius:8px;padding:5px 9px;font-size:11px;color:var(--g-ink2);font-family:var(--mono);pointer-events:none}\n\n/* sfx */\n#gcSfxBody{flex:1;overflow-y:auto;padding:12px}\n#gcRollWrap{max-height:320px;overflow-y:auto;overflow-x:auto;background:#0F0F16;border:1px solid var(--g-line);border-radius:10px}\n#gcRoll{dis
