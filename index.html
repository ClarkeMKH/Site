<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Toolbox</title>
<style>
/* ---------- Design tokens ---------- */
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --ink:#111114;
  --ink2:#6E6E76;
  --ink3:#A6A6AE;
  --accent:#0A84FF;
  --accent-ink:#0060DF;
  --green:#30A46C;
  --red:#E5484D;
  --line:rgba(60,60,67,.14);
  --line-soft:rgba(60,60,67,.08);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --shadow-tile:0 1px 2px rgba(16,24,40,.05), 0 10px 24px -14px rgba(16,24,40,.35);
  --shadow-pop:0 8px 40px -8px rgba(16,24,40,.28), 0 1px 3px rgba(16,24,40,.08);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);font-size:16px;line-height:1.45;color:var(--ink);
  background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- Home ---------- */
#home{min-height:100%;padding-bottom:calc(40px + var(--sab))}
.hdr{
  position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 14px) 20px 10px;
  background:rgba(242,242,247,.82);backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
.hdr.scrolled{border-bottom-color:var(--line-soft)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr h1{margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.024em}
.hdr-sub{margin:2px 0 0;font-size:13.5px;color:var(--ink2);letter-spacing:-.01em}
.icon-btn{
  width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;
  border:0;border-radius:50%;background:rgba(120,120,128,.12);cursor:pointer;
  transition:transform .15s,background .15s;
}
.icon-btn:active{transform:scale(.9);background:rgba(120,120,128,.2)}
.icon-btn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.search{
  position:relative;margin-top:12px;
}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round}
.search input{
  width:100%;height:38px;padding:0 12px 0 34px;border:0;border-radius:11px;
  background:rgba(118,118,128,.12);font:inherit;font-size:16px;color:var(--ink);
}
.search input::placeholder{color:var(--ink3)}
.search input:focus{outline:none;background:rgba(118,118,128,.16)}

.sec{margin-top:22px}
.sec-head{display:flex;align-items:baseline;gap:8px;padding:0 20px 10px}
.sec-head h2{margin:0;font-size:19px;font-weight:680;letter-spacing:-.018em}
.sec-head .count{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.row{
  display:flex;gap:16px;overflow-x:auto;padding:2px 20px 6px;
  /* flex-start keeps every icon pinned to the top of the row: without it the
     buttons stretch to the tallest tile and centre their own contents, so a
     tile with a one-line label floats down next to a two-line neighbour. */
  align-items:flex-start;
  scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.row::-webkit-scrollbar{display:none}
.tile{
  flex:0 0 auto;width:92px;scroll-snap-align:start;
  background:none;border:0;padding:0;cursor:pointer;text-align:center;
  /* Own column layout so the art sits at the top regardless of label height. */
  display:flex;flex-direction:column;align-items:center;
  /* A long press should raise the context menu only - no text selection,
     no iOS image callout, no drag-and-drop ghost of the icon. */
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.tile .art{
  flex:0 0 auto;
  width:76px;height:76px;margin:0 auto 9px;border-radius:20px;overflow:hidden;
  background:var(--card);box-shadow:var(--shadow-tile);
  display:grid;place-items:center;position:relative;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;
}
.tile:hover .art{transform:translateY(-2px)}
.tile:active .art{transform:scale(.92)}
.tile img{
  width:100%;height:100%;object-fit:cover;display:block;
  -webkit-user-drag:none;user-drag:none;pointer-events:none;
}
.tile .art,.tile .lbl,.tile .glyph{pointer-events:none}
.tile .glyph{font-size:34px;line-height:1}
.tile .lbl{
  display:block;font-size:12.5px;font-weight:590;letter-spacing:-.008em;line-height:1.25;
  color:var(--ink);word-break:break-word;
}
.pin-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px #fff}
.empty{padding:60px 24px;text-align:center;color:var(--ink2)}
.empty strong{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}

/* ---------- Runner ---------- */
#runner{
  position:fixed;inset:0;z-index:40;background:var(--card);
  display:flex;flex-direction:column;
}
#runner[hidden]{display:none}
#runner.in{animation:slideIn .28s cubic-bezier(.32,.72,0,1)}
@keyframes slideIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
#runbar{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  height:calc(var(--sat) + 48px);padding:var(--sat) 12px 0;
  background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid var(--line-soft);z-index:2;
}
#backBtn{
  display:flex;align-items:center;gap:3px;height:34px;padding:0 12px 0 7px;
  border:0;border-radius:17px;background:rgba(120,120,128,.1);color:var(--accent);
  font-size:15px;font-weight:590;letter-spacing:-.01em;cursor:pointer;transition:transform .15s
}
#backBtn:active{transform:scale(.94)}
#backBtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#runtitle{font-size:15px;font-weight:640;letter-spacing:-.012em;margin-left:2px}
#runnerBody{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch}
.runerr{margin:24px;padding:16px;border-radius:var(--r-md);background:#FFF1F1;border:1px solid #FFD5D5;color:#8B1A1E;font-family:var(--mono);font-size:13px;white-space:pre-wrap}

/* ---------- Shared floating UI ---------- */
.menu{
  position:fixed;z-index:200;min-width:214px;padding:6px;
  background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(28px);
  -webkit-backdrop-filter:saturate(180%) blur(28px);
  border:1px solid var(--line-soft);border-radius:var(--r-md);box-shadow:var(--shadow-pop);
  animation:pop .16s cubic-bezier(.2,.9,.3,1);transform-origin:top left;
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.menu[hidden]{display:none}
.menu button{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;
  border:0;background:none;border-radius:8px;font-size:14.5px;letter-spacing:-.01em;
  text-align:left;cursor:pointer
}
.menu button:hover{background:rgba(10,132,255,.1)}
.menu button.danger{color:var(--red)}
.menu button.danger:hover{background:rgba(229,72,77,.1)}
.menu button:disabled{opacity:.35;cursor:default;background:none}
.menu .sep{height:1px;margin:5px 8px;background:var(--line-soft)}
.menu .cap{padding:6px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}

#toast{
  position:fixed;left:50%;bottom:calc(28px + var(--sab));transform:translate(-50%,16px);
  z-index:300;padding:11px 18px;border-radius:22px;
  background:rgba(20,20,24,.92);color:#fff;font-size:14.5px;font-weight:560;letter-spacing:-.01em;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  backdrop-filter:blur(20px);max-width:80vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

.scrim{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.28);animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<!-- ===== Home ===== -->
<div id="home">
  <header class="hdr" id="hdr">
    <div class="hdr-row">
      <div>
        <h1>Toolbox</h1>
        <p class="hdr-sub" id="hdrSub"></p>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Library options">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="search" type="search" placeholder="Search tools" autocomplete="off" spellcheck="false">
    </div>
  </header>
  <main id="sections"></main>
</div>

<!-- ===== Full-screen tool runner ===== -->
<div id="runner" hidden>
  <div id="runbar">
    <button id="backBtn"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>Tools</button>
    <span id="runtitle"></span>
  </div>
  <div id="runnerBody"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="menu" class="menu" hidden></div>

<style>
/* ---------- Dialogs ---------- */
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:160;
  width:min(420px,calc(100vw - 40px));padding:22px;border-radius:20px;background:#fff;
  box-shadow:0 24px 70px -20px rgba(16,24,40,.5);animation:rise .22s cubic-bezier(.2,.9,.3,1)
}
@keyframes rise{from{transform:translate(-50%,-46%);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
.modal h3{margin:0 0 4px;font-size:19px;font-weight:680;letter-spacing:-.018em}
.modal p{margin:0 0 16px;font-size:14px;color:var(--ink2);line-height:1.5;white-space:pre-line}
.modal input,.modal textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;
  font:inherit;font-size:16px;color:var(--ink);background:#fff
}
.modal textarea{font-family:var(--mono);font-size:13px;min-height:110px;resize:vertical}
.modal input:focus,.modal textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}
.modal .opts{max-height:44vh;overflow:auto;margin:-4px 0 4px}
.modal .opts button{
  display:block;width:100%;padding:11px 13px;margin-bottom:6px;border:1px solid var(--line);
  border-radius:12px;background:#fff;font-size:15px;text-align:left;cursor:pointer
}
.modal .opts button:hover{border-color:var(--accent);color:var(--accent)}
.modal .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.modal .acts button{padding:10px 18px;border:0;border-radius:12px;font-size:15px;font-weight:590;cursor:pointer}
.modal .acts .ghost{background:rgba(120,120,128,.12)}
.modal .acts .primary{background:var(--accent);color:#fff}
.modal .acts .primary.danger{background:var(--red)}
.modal .acts button:active{transform:scale(.97)}
</style>

      "html": "<div id=\"pm\">\n<style>\n  #pm{position:absolute;inset:0;background:#F2F2F7;overflow-y:auto}\n  #pm .wrap{max-width:620px;margin:0 auto;padding:22px 18px calc(40px + env(safe-area-inset-bottom,0px))}\n  #pm h2{margin:0 0 14px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #pm .btn{padding:11px 15px;border:0;border-radius:12px;background:#0A84FF;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .15s}\n  #pm .btn:active{transform:scale(.97)}\n  #pm .btn.ghost{background:rgba(120,120,128,.12);color:#111114}\n  #pm .btn.danger{background:rgba(229,72,77,.14);color:#B8390E}\n  #pm .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}\n  #pm .btn.wide{width:100%;height:50px;font-size:16px;border-radius:15px}\n  #pm label{display:block;font-size:13px;font-weight:560;color:#6E6E76;margin:14px 0 6px}\n  #pm input,#pm textarea{width:100%;padding:11px 13px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:#111114}\n  #pm input:focus,#pm textarea:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #pm textarea{min-height:90px;resize:vertical;line-height:1.55}\n  /* lock screen */\n  #pm .lock{position:absolute;inset:0;background:#111114;color:#fff;display:flex;align-items:center;justify-content:center;padding:26px;z-index:8}\n  #pm .lock .box{width:100%;max-width:360px;text-align:center}\n  #pm .lock .ico{font-size:44px;margin-bottom:14px}\n  #pm .lock h3{margin:0 0 6px;font-size:21px;font-weight:700}\n  #pm .lock p{margin:0 0 22px;font-size:13.5px;color:rgba(255,255,255,.55);line-height:1.6}\n  #pm .lock input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;text-align:center;font-size:17px;letter-spacing:.06em;margin-bottom:10px}\n  #pm .lock input::placeholder{color:rgba(255,255,255,.35);letter-spacing:0}\n  #pm .lock input:focus{border-color:#0A84FF;box-shadow:none}\n  #pm .lock .err{color:#FF8A8F;font-size:13px;min-height:19px;margin-bottom:8px}\n  #pm .lock .go{width:100%;height:50px;border:0;border-radius:14px;background:#0A84FF;color:#fff;font-size:16px;font-weight:600;cursor:pointer}\n  #pm .lock .alt{margin-top:16px;border:0;background:none;color:rgba(255,255,255,.5);font-size:13px;cursor:pointer;text-decoration:underline}\n  /* list */\n  #pm .top{display:flex;gap:8px;margin-bottom:14px}\n  #pm .top input{flex:1}\n  #pm .acc{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#fff;border-radius:14px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05),0 8px 20px -18px rgba(16,24,40,.4)}\n  #pm .acc .av{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}\n  #pm .acc .tx{flex:1;min-width:0}\n  #pm .acc .nm{font-size:15px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  #pm .acc .un{font-size:12.5px;color:#A6A6AE;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}\n  #pm .acc .tot{flex:0 0 auto;font-family:ui-monospace,Menlo,monospace;font-size:14px;color:#0A84FF;font-variant-numeric:tabular-nums}\n  #pm .empty{text-align:center;color:#A6A6AE;font-size:14px;padding:44px 20px;line-height:1.7}\n  /* detail */\n  #pm .view{position:absolute;inset:0;background:#F2F2F7;overflow-y:auto;display:none;z-index:5}\n  #pm .view.on{display:block}\n  #pm .vh{display:flex;align-items:center;gap:12px;margin-bottom:18px}\n  #pm .vh .av{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;flex:0 0 auto}\n  #pm .vh .t{flex:1;min-width:0}\n  #pm .vh h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2;word-break:break-word}\n  #pm .fld{background:#fff;border-radius:13px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}\n  #pm .fld .l{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A6A6AE;width:84px}\n  #pm .fld .v{flex:1;min-width:0;font-size:15px;word-break:break-all;font-family:ui-monospace,Menlo,monospace}\n  #pm .fld .v.hidden{letter-spacing:.14em;font-family:inherit}\n  #pm .fld .a{flex:0 0 auto;border:0;background:rgba(120,120,128,.12);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#6E6E76}\n  #pm .fld .a:hover{background:rgba(10,132,255,.14);color:#0A84FF}\n  #pm .totp{background:#fff;border-radius:13px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:14px}\n  #pm .totp .tt{flex:1;min-width:0}\n  #pm .totp .tl{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A6A6AE;margin-bottom:2px}\n  #pm .totp .code{display:block;font-family:ui-monospace,Menlo,monospace;font-size:27px;font-weight:600;letter-spacing:.1em;font-variant-numeric:tabular-nums;cursor:pointer;line-height:1.15}\n  #pm .totp .code.bad{font-size:15px;color:#B8390E;letter-spacing:0}\n  #pm .totp svg{width:34px;height:34px;flex:0 0 auto}\n  #pm .totp svg circle{fill:none;stroke-width:4}\n  #pm .totp svg .bg{stroke:rgba(120,120,128,.18)}\n  #pm .totp svg .fg{stroke:#0A84FF;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s linear}\n  #pm .nt{background:#FFF9E8;border-radius:13px;padding:14px;font-size:14px;line-height:1.6;color:#5C4A16;white-space:pre-wrap;margin-bottom:8px}\n  #pm .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;margin:20px 0 10px}\n  #pm .cf{display:flex;gap:7px;margin-bottom:7px;align-items:center}\n  #pm .cf .k{flex:1 1 34%;min-width:0}\n  #pm .cf .v{flex:1 1 40%;min-width:0}\n  #pm .cf select{flex:0 0 104px;padding:11px 8px;border:1px solid rgba(60,60,67,.16);border-radius:12px;background:#fff;font:inherit;font-size:15px;color:#111114}\n  #pm .cf button{flex:0 0 auto;border:0;background:rgba(229,72,77,.12);color:#B8390E;border-radius:10px;padding:0 12px;height:44px;cursor:pointer;font-size:16px}\n  @media (max-width:560px){\n    #pm .cf{flex-wrap:wrap}\n    #pm .cf .k{flex:1 1 100%} #pm .cf .v{flex:1 1 calc(100% - 168px)}\n  }\n  #pm .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}\n</style>\n  <div class=\"wrap\" id=\"pmHome\">\n    <h2>Password Manager</h2>\n    <div class=\"top\">\n      <input id=\"pmQ\" placeholder=\"Search accounts…\" spellcheck=\"false\">\n      <button class=\"btn\" id=\"pmNew\">New</button>\n    </div>\n    <div id=\"pmList\"></div>\n    <div class=\"bar\">\n      <button class=\"btn ghost sm\" id=\"pmLockNow\">Lock vault</button>\n      <button class=\"btn ghost sm\" id=\"pmExport\">Export (unencrypted)</button>\n      <button class=\"btn ghost sm\" id=\"pmChange\">Change master password</button>\n    </div>\n  </div>\n\n  <div class=\"view\" id=\"pmView\"><div class=\"wrap\" id=\"pmViewBody\"></div></div>\n\n  <div class=\"lock\" id=\"pmLock\">\n    <div class=\"box\">\n      <div class=\"ico\">🔐</div>\n      <h3 id=\"pmLockT\">Unlock vault</h3>\n      <p id=\"pmLockP\">Enter your master password.</p>\n      <input id=\"pmMaster\" type=\"password\" placeholder=\"Master password\" autocomplete=\"off\">\n      <input id=\"pmMaster2\" type=\"password\" placeholder=\"Confirm master password\" autocomplete=\"off\" style=\"display:none\">\n      <p class=\"err\" id=\"pmErr\"></p>\n      <button class=\"go\" id=\"pmUnlock\">Unlock</button>\n      <button class=\"alt\" id=\"pmReset\">Forgotten? Reset the vault</button>\n    </div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst KEY = 'pwman.vault.v1';\nconst ITER = 310000;                 // PBKDF2 rounds (OWASP guidance for SHA-256)\nlet key = null;                      // derived AES key, held in memory only\nlet accounts = [];\nlet editing = null, current = null, ticker = null, idleTimer = null, accountsMigrated = false;\n\nconst esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nconst uid = () => 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);\nconst b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));\nconst unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));\n\n/* ---------------- crypto ---------------- */\nasync function deriveKey(password, salt){\n  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);\n  return crypto.subtle.deriveKey(\n    { name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' },\n    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);\n}\nasync function encryptVault(){\n  const stored = JSON.parse(localStorage.getItem(KEY));\n  const iv = crypto.getRandomValues(new Uint8Array(12));\n  const data = new TextEncoder().encode(JSON.stringify(accounts));\n  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, data);\n  localStorage.setItem(KEY, JSON.stringify({ v:1, salt:stored.salt, iter:ITER, iv:b64(iv), ct:b64(ct) }));\n}\nasync function decryptVault(password){\n  const stored = JSON.parse(localStorage.getItem(KEY));\n  const k = await deriveKey(password, unb64(stored.salt));\n  const plain = await crypto.subtle.decrypt(\n    { name:'AES-GCM', iv: unb64(stored.iv) }, k, unb64(stored.ct));\n  return { k, data: JSON.parse(new TextDecoder().decode(plain)) };\n}\n\n/* ---------------- lock screen ---------------- */\nconst exists = () => !!localStorage.getItem(KEY);\nfunction showLock(){\n  const first = !exists();\n  $('pmLockT').textContent = first ? 'Create your vault' : 'Unlock vault';\n  $('pmLockP').textContent = first\n    ? 'Pick a strong master password. It encrypts everything and cannot be recovered if you forget it.'\n    : 'Enter your master password.';\n  $('pmMaster2').style.display = first ? '' : 'none';\n  $('pmUnlock').textContent = first ? 'Create vault' : 'Unlock';\n  $('pmReset').style.display = first ? 'none' : '';\n  $('pmMaster').value = ''; $('pmMaster2').value = ''; $('pmErr').textContent = '';\n  $('pmLock').style.display = 'flex';\n  setTimeout(() => $('pmMaster').focus(), 60);\n}\nfunction lock(){\n  key = null; accounts = [];\n  clearInterval(ticker); ticker = null;\n  $('pmView').classList.remove('on');\n  showLock();\n}\n\n$('pmUnlock').onclick = async () => {\n  const pw = $('pmMaster').value;\n  if (!pw) return;\n  $('pmErr').textContent = '';\n  if (!exists()){\n    if (pw.length < 8){ $('pmErr').textContent = 'Use at least 8 characters'; return; }\n    if (pw !== $('pmMaster2').value){ $('pmErr').textContent = 'The two passwords do not match'; return; }\n    const salt = crypto.getRandomValues(new Uint8Array(16));\n    localStorage.setItem(KEY, JSON.stringify({ v:1, salt:b64(salt), iter:ITER, iv:'', ct:'' }));\n    key = await deriveKey(pw, salt);\n    accounts = [];\n    await encryptVault();\n  } else {\n    $('pmUnlock').textContent = 'Unlocking…';\n    try {\n      const { k, data } = await decryptVault(pw);\n      key = k; accounts = data;\n      accounts.forEach(migrate);\n    } catch {\n      $('pmErr').textContent = 'Wrong master password';\n      $('pmUnlock').textContent = 'Unlock';\n      return;\n    }\n  }\n  $('pmLock').style.display = 'none';\n  render(); resetIdle();\n};\n$('pmMaster').addEventListener('keydown', e => { if (e.key === 'Enter') $('pmUnlock').click(); });\n$('pmMaster2').addEventListener('keydown', e => { if (e.key === 'Enter') $('pmUnlock').click(); });\n$('pmReset').onclick = async () => {\n  if (!await confirmDlg('Reset the vault?', 'Every saved account is permanently destroyed. There is no recovery.', 'Destroy vault')) return;\n  localStorage.removeItem(KEY); showLock(); toast('Vault reset');\n};\n$('pmLockNow').onclick = lock;\n\n// auto-lock after 5 minutes of no interaction\nfunction resetIdle(){\n  clearTimeout(idleTimer);\n  idleTimer = setTimeout(() => { if (key){ lock(); toast('Vault locked'); } }, 5 * 60 * 1000);\n}\n['click','keydown','touchstart'].forEach(e => document.getElementById('pm').addEventListener(e, resetIdle, { passive:true }));\n\n/* ---------------- TOTP ---------------- */\nfunction decodeBase32(s){\n  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';\n  s = s.replace(/[\\s=]/g, '').toUpperCase();\n  let bits = 0, val = 0; const out = [];\n  for (const c of s){\n    const i = A.indexOf(c);\n    if (i < 0) throw new Error('bad base32');\n    val = (val << 5) | i; bits += 5;\n    if (bits >= 8){ bits -= 8; out.push((val >>> bits) & 0xff); }\n  }\n  return new Uint8Array(out);\n}\nasync function totp(secret){\n  const k = decodeBase32(secret);\n  const counter = Math.floor(Date.now() / 30000);\n  const msg = new Uint8Array(8);\n  let c = counter;\n  for (let i = 7; i >= 0; i--){ msg[i] = c & 0xff; c = Math.floor(c / 256); }\n  const ck = await crypto.subtle.importKey('raw', k, { name:'HMAC', hash:'SHA-1' }, false, ['sign']);\n  const mac = new Uint8Array(await crypto.subtle.sign('HMAC', ck, msg));\n  const off = mac[mac.length - 1] & 0xf;\n  const bin = ((mac[off] & 0x7f) << 24) | (mac[off+1] << 16) | (mac[off+2] << 8) | mac[off+3];\n  return String(bin % 1000000).padStart(6, '0');\n}\n\n/* ---------------- custom field types ----------------\n   Fields are { k: label, v: value, t: 'text' | 'hidden' | 'totp' }.\n   Older entries saved without a type are migrated on read: anything whose\n   label looked like a secret becomes hidden, everything else plain text. */\nconst TYPES = [['text','Text'], ['hidden','Hidden'], ['totp','TOTP']];\nfunction fieldType(f){\n  if (f.t) return f.t;\n  return /pass|pin|secret|key|token/i.test(f.k || '') ? 'hidden' : 'text';\n}\nfunction migrate(a){\n  (a.fields || []).forEach(f => { if (!f.t) f.t = fieldType(f); });\n  return a;\n}\n\n/* ---------------- list ---------------- */\nconst COLOURS = ['#0A84FF','#30A46C','#F5A524','#E5484D','#8A2BE2','#0E7C90','#C82F5A','#5E7346'];\nconst avatar = n => COLOURS[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % COLOURS.length];\n\nfunction render(){\n  const q = $('pmQ').value.trim().toLowerCase();\n  const list = accounts.filter(a => !q ||\n    (a.name + ' ' + (a.username || '') + ' ' + (a.url || '') + ' ' + (a.notes || '')).toLowerCase().includes(q));\n  $('pmList').innerHTML = list.length ? list.map(a =>\n    '<div class=\"acc\" data-id=\"' + a.id + '\">' +\n      '<span class=\"av\" style=\"background:' + avatar(a.name) + '\">' + esc((a.name[0] || '?').toUpperCase()) + '</span>' +\n      '<span class=\"tx\"><span class=\"nm\">' + esc(a.name) + '</span>' +\n      '<span class=\"un\">' + esc(a.username || 'No username') + '</span></span>' +\n      (a.totp ? '<span class=\"tot\" data-totp=\"' + a.id + '\">•••</span>' : '') +   /* primary only */\n    '</div>').join('')\n    : '<div class=\"empty\">' + (accounts.length ? 'Nothing matches that search.' : 'Vault is empty.<br>Tap <b>New</b> to add an account.') + '</div>';\n  $('pmList').querySelectorAll('.acc').forEach(el =>\n    el.onclick = () => openAcc(accounts.find(a => a.id === el.dataset.id)));\n  tickList();\n}\nasync function tickList(){\n  for (const el of document.querySelectorAll('[data-totp]')){\n    const a = accounts.find(x => x.id === el.dataset.totp);\n    if (!a) continue;\n    try {\n      const c = await totp(a.totp);\n      if (el.isConnected) el.textContent = c;\n    } catch { if (el.isConnected) el.textContent = '——'; }\n  }\n}\n$('pmQ').addEventListener('input', render);\n\n/* ---------------- detail ---------------- */\nfunction openAcc(a){\n  current = a;\n  drawView(false);\n  $('pmView').classList.add('on');\n}\nfunction fieldRow(label, value, opts = {}){\n  const id = 'f' + Math.random().toString(36).slice(2, 8);\n  return '<div class=\"fld\">' +\n    '<span class=\"l\">' + esc(label) + '</span>' +\n    '<span class=\"v' + (opts.secret ? ' hidden' : '') + '\" id=\"' + id + '\" data-real=\"' + esc(value) + '\">' +\n      (opts.secret ? '••••••••••' : esc(value)) + '</span>' +\n    (opts.secret ? '<button class=\"a\" data-show=\"' + id + '\">Show</button>' : '') +\n    '<button class=\"a\" data-copy=\"' + id + '\">Copy</button>' +\n  '</div>';\n}\n\n/* A live TOTP block. Several can sit on one account; each carries its own\n   secret so the shared ticker can refresh them all together. */\nfunction totpBlock(label, secret){\n  return '<div class=\"totp\" data-secret=\"' + esc(secret) + '\">' +\n    '<span class=\"tt\"><span class=\"tl\">' + esc(label) + '</span>' +\n    '<span class=\"code\">——————</span></span>' +\n    '<svg viewBox=\"0 0 36 36\"><circle class=\"bg\" cx=\"18\" cy=\"18\" r=\"15\"/>' +\n    '<circle class=\"fg\" cx=\"18\" cy=\"18\" r=\"15\"/></svg>' +\n  '</div>';\n}\nfunction drawView(edit){\n  const a = current;\n  const body = $('pmViewBody');\n  if (!edit){\n    body.innerHTML =\n      '<div style=\"display:flex;gap:8px;margin-bottom:16px\">' +\n        '<button class=\"btn ghost sm\" id=\"pmBack\">&larr; Back</button>' +\n        '<span style=\"flex:1\"></span>' +\n        '<button class=\"btn sm\" id=\"pmEdit\">Edit</button>' +\n      '</div>' +\n      '<div class=\"vh\"><span class=\"av\" style=\"background:' + avatar(a.name) + '\">' + esc((a.name[0] || '?').toUpperCase()) + '</span>' +\n      '<span class=\"t\"><h3>' + esc(a.name) + '</h3></span></div>' +\n      (a.username ? fieldRow('Username', a.username) : '') +\n      (a.password ? fieldRow('Password', a.password, { secret:true }) : '') +\n      (a.url ? fieldRow('URL', a.url) : '') +\n      (a.totp ? totpBlock('Authenticator code', a.totp) : '') +\n      ((a.fields || []).map(f => {\n        const t = fieldType(f);\n        if (t === 'totp') return totpBlock(f.k || 'TOTP', f.v);\n        return fieldRow(f.k, f.v, { secret: t === 'hidden' });\n      }).join('')) +\n      (a.notes ? '<div class=\"cap\">Notes</div><div class=\"nt\">' + esc(a.notes) + '</div>' : '') +\n      '<div class=\"bar\"><button class=\"btn danger sm\" id=\"pmDel\">Delete account</button></div>';\n\n    body.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {\n      const v = document.getElementById(b.dataset.copy).dataset.real;\n      navigator.clipboard.writeText(v).then(() => toast('Copied'), () => toast('Copied'));\n    });\n    body.querySelectorAll('[data-show]').forEach(b => b.onclick = () => {\n      const el = document.getElementById(b.dataset.show);\n      const hidden = el.classList.contains('hidden');\n      el.classList.toggle('hidden', !hidden);\n      el.textContent = hidden ? el.dataset.real : '••••••••••';\n      b.textContent = hidden ? 'Hide' : 'Show';\n    });\n    $('pmBack').onclick = () => { $('pmView').classList.remove('on'); clearInterval(ticker); ticker = null; render(); };\n    $('pmEdit').onclick = () => drawView(true);\n    $('pmDel').onclick = async () => {\n      if (!await confirmDlg('Delete \"' + a.name + '\"?', 'This account is removed from the vault.', 'Delete')) return;\n      accounts = accounts.filter(x => x.id !== a.id);\n      await encryptVault();\n      $('pmView').classList.remove('on'); render(); toast('Deleted');\n    };\n    clearInterval(ticker);\n    if (body.querySelector('.totp')){ tickCode(); ticker = setInterval(tickCode, 1000); }\n    return;\n  }\n\n  // ----- edit mode -----\n  body.innerHTML =\n    '<div style=\"display:flex;gap:8px;margin-bottom:6px\">' +\n      '<button class=\"btn ghost sm\" id=\"pmCancel\">Cancel</button>' +\n      '<span style=\"flex:1\"></span>' +\n      '<button class=\"btn sm\" id=\"pmSave\">Save</button>' +\n    '</div>' +\n    '<label>Account name</label><input id=\"eName\" value=\"' + esc(a.name) + '\">' +\n    '<label>Username</label><input id=\"eUser\" value=\"' + esc(a.username || '') + '\" spellcheck=\"false\">' +\n    '<label>Password</label>' +\n    '<div style=\"display:flex;gap:8px\"><input id=\"ePass\" value=\"' + esc(a.password || '') + '\" spellcheck=\"false\">' +\n      '<button class=\"btn ghost sm\" id=\"eGen\" style=\"flex:0 0 auto\">Generate</button></div>' +\n    '<label>URL</label><input id=\"eUrl\" value=\"' + esc(a.url || '') + '\" spellcheck=\"false\" placeholder=\"https://\">' +\n    '<label>Authenticator secret (Base32) — shown on the account list</label><input id=\"eTotp\" value=\"' + esc(a.totp || '') + '\" spellcheck=\"false\" placeholder=\"JBSWY3DPEHPK3PXP\">' +\n    '<div class=\"cap\">Custom fields</div><div id=\"eFields\"></div>' +\n    '<button class=\"btn ghost sm\" id=\"eAddF\">+ Add field</button>' +\n    '<p style=\"font-size:12px;color:#A6A6AE;margin:8px 0 0;line-height:1.5\">' +\n      'Hidden fields are masked until you tap Show. TOTP fields generate a live code &mdash; ' +\n      'add as many as you need. Only the main authenticator code above appears on the account list.</p>' +\n    '<label>Notes</label><textarea id=\"eNotes\">' + esc(a.notes || '') + '</textarea>';\n\n  const fbox = $('eFields');\n  const drawFields = () => {\n    fbox.innerHTML = (a.fields || []).map((f, i) =>\n      '<div class=\"cf\">' +\n        '<input class=\"k\" value=\"' + esc(f.k) + '\" data-fk=\"' + i + '\" placeholder=\"Label\">' +\n        '<select data-ft=\"' + i + '\">' + TYPES.map(([v, n]) =>\n          '<option value=\"' + v + '\"' + (fieldType(f) === v ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>' +\n        '<input class=\"v\" value=\"' + esc(f.v) + '\" data-fv=\"' + i + '\" spellcheck=\"false\" placeholder=\"' +\n          (fieldType(f) === 'totp' ? 'Base32 secret' : 'Value') + '\">' +\n        '<button data-fx=\"' + i + '\">&times;</button>' +\n      '</div>').join('');\n    fbox.querySelectorAll('[data-fk]').forEach(el => el.oninput = () => a.fields[+el.dataset.fk].k = el.value);\n    fbox.querySelectorAll('[data-fv]').forEach(el => el.oninput = () => a.fields[+el.dataset.fv].v = el.value);\n    fbox.querySelectorAll('[data-ft]').forEach(el => el.onchange = () => {\n      a.fields[+el.dataset.ft].t = el.value;\n      drawFields();\n    });\n    fbox.querySelectorAll('[data-fx]').forEach(el => el.onclick = () => { a.fields.splice(+el.dataset.fx, 1); drawFields(); });\n  };\n  a.fields = (a.fields || []).map(f => (f.t = fieldType(f), f));\n  drawFields();\n  $('eAddF').onclick = () => { a.fields.push({ k:'', v:'', t:'text' }); drawFields(); };\n  $('eGen').onclick = () => {\n    const CH = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*?';\n    const buf = crypto.getRandomValues(new Uint32Array(20));\n    $('ePass').value = [...buf].map(v => CH[v % CH.length]).join('');\n  };\n  $('pmCancel').onclick = () => { if (!a.name){ $('pmView').classList.remove('on'); render(); } else drawView(false); };\n  $('pmSave').onclick = async () => {\n    const name = $('eName').value.trim();\n    if (!name) return toast('Give the account a name');\n    Object.assign(a, {\n      name, username:$('eUser').value.trim(), password:$('ePass').value,\n      url:$('eUrl').value.trim(), totp:$('eTotp').value.replace(/\\s/g, ''),\n      notes:$('eNotes').value,\n      fields:(a.fields || []).filter(f => f.k || f.v).map(f => ({ k:f.k, v:f.v, t:fieldType(f) }))\n    });\n    if (a.totp){\n      try { await totp(a.totp); } catch { return toast('The authenticator secret is not valid Base32'); }\n    }\n    for (const f of a.fields){\n      if (f.t !== 'totp') continue;\n      try { await totp(f.v); }\n      catch { return toast('\"' + (f.k || 'TOTP field') + '\" is not a valid Base32 secret'); }\n    }\n    if (!accounts.includes(a)) accounts.unshift(a);\n    await encryptVault();\n    drawView(false); render(); toast('Saved');\n  };\n}\nasync function tickCode(){\n  const blocks = document.querySelectorAll('#pmViewBody .totp');\n  if (!blocks.length){ clearInterval(ticker); ticker = null; return; }\n  const left = 30 - (Math.floor(Date.now() / 1000) % 30);\n  const C = 2 * Math.PI * 15;\n  for (const b of blocks){\n    const codeEl = b.querySelector('.code'), ring = b.querySelector('.fg');\n    try {\n      const c = await totp(b.dataset.secret);\n      if (!b.isConnected) return;\n      codeEl.classList.remove('bad');\n      codeEl.textContent = c.slice(0, 3) + ' ' + c.slice(3);\n      codeEl.onclick = () => navigator.clipboard.writeText(c).then(() => toast('Code copied'), () => toast('Copied'));\n      ring.style.strokeDasharray = C;\n      ring.style.strokeDashoffset = C * (1 - left / 30);\n      ring.style.stroke = left <= 5 ? '#E5484D' : '#0A84FF';\n    } catch {\n      if (!b.isConnected) return;\n      codeEl.classList.add('bad');\n      codeEl.textContent = 'Invalid Base32 secret';\n      codeEl.onclick = null;\n    }\n  }\n}\n\n$('pmNew').onclick = () => { current = { id:uid(), name:'', fields:[] }; drawView(true); $('pmView').classList.add('on'); };\n$('pmChange').onclick = async () => {\n  const pw = await ask('Change master password', 'New master password (minimum 8 characters)', '');\n  if (!pw) return;\n  if (pw.length < 8) return toast('Use at least 8 characters');\n  const salt = crypto.getRandomValues(new Uint8Array(16));\n  const stored = JSON.parse(localStorage.getItem(KEY));\n  stored.salt = b64(salt);\n  localStorage.setItem(KEY, JSON.stringify(stored));\n  key = await deriveKey(pw, salt);\n  await encryptVault();\n  toast('Master password changed');\n};\n$('pmExport').onclick = async () => {\n  if (!accounts.length) return toast('Nothing to export yet');\n  const ok = await confirmDlg(\n    'Download unencrypted?',\n    'This saves every password, TOTP secret and note in this vault as a plain, readable file on your device. Anyone with the file can read it \\u2014 store it somewhere safe and delete it when you\\u2019re done.',\n    'Download'\n  );\n  if (!ok) return;\n  const blob = new Blob([JSON.stringify(accounts, null, 2)], { type:'application/json' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = 'vault-export-' + new Date().toISOString().slice(0, 10) + '.json';\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n  toast('Unencrypted export downloaded');\n};\n\nshowLock();\nonToolExit(() => { key = null; accounts = []; clearInterval(ticker); clearTimeout(idleTimer); });"

      "html": "<div id=\"pw\">\n<style>\n  #pw{padding:34px 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}\n  #pw .wrap{width:100%;max-width:520px}\n  #pw .eyebrow{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A6A6AE;text-align:center}\n  #pw .out{\n    display:block;width:100%;min-height:104px;padding:22px 20px;border:1px solid rgba(60,60,67,.1);\n    border-radius:20px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.04),0 14px 30px -22px rgba(16,24,40,.5);\n    font-family:ui-monospace,SFMono-Regular,\"SF Mono\",Menlo,Consolas,monospace;\n    font-size:23px;line-height:1.4;letter-spacing:.01em;word-break:break-all;text-align:center;\n    cursor:pointer;transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .15s;\n  }\n  #pw .out:active{transform:scale(.985)}\n  #pw .out .digit{color:#0A84FF}\n  #pw .out .sym{color:#C7415C}\n  #pw .hint{margin:9px 0 22px;font-size:12.5px;color:#A6A6AE;text-align:center}\n  #pw .meter{height:6px;border-radius:3px;background:rgba(120,120,128,.16);overflow:hidden;margin-bottom:8px}\n  #pw .meter span{display:block;height:100%;width:0;border-radius:3px;background:#30A46C;transition:width .3s cubic-bezier(.2,.8,.2,1),background .3s}\n  #pw .meta{display:flex;justify-content:space-between;font-size:12.5px;color:#6E6E76;margin-bottom:24px;font-variant-numeric:tabular-nums}\n  #pw .meta b{font-weight:640;color:#111114}\n  #pw .card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #pw .lenrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}\n  #pw .lenrow span{font-size:14.5px;font-weight:560}\n  #pw .lenrow b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}\n  #pw input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:none;margin:0 0 18px}\n  #pw input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:rgba(120,120,128,.2)}\n  #pw input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10.5px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.05)}\n  #pw input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:rgba(120,120,128,.2)}\n  #pw input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.22)}\n  #pw .opts{display:flex;flex-wrap:wrap;gap:8px}\n  #pw .opt{\n    padding:8px 14px;border:1px solid rgba(60,60,67,.14);border-radius:999px;background:#fff;\n    font-size:14px;font-weight:560;letter-spacing:-.01em;color:#6E6E76;cursor:pointer;transition:.15s\n  }\n  #pw .opt[aria-pressed=true]{background:#0A84FF;border-color:#0A84FF;color:#fff}\n  #pw .opt:active{transform:scale(.95)}\n  #pw .go{\n    width:100%;margin-top:18px;height:52px;border:0;border-radius:16px;background:#111114;color:#fff;\n    font-size:16px;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:transform .15s,opacity .15s\n  }\n  #pw .go:active{transform:scale(.98);opacity:.9}\n</style>\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">Generated on this device</p>\n    <button class=\"out\" id=\"pwOut\" aria-label=\"Generated password, click to copy\"></button>\n    <p class=\"hint\">Tap the password to copy it</p>\n    <div class=\"meter\"><span id=\"pwBar\"></span></div>\n    <div class=\"meta\"><span id=\"pwStrength\"></span><span id=\"pwEntropy\"></span></div>\n    <div class=\"card\">\n      <div class=\"lenrow\"><span>Length</span><b id=\"pwLenVal\">20</b></div>\n      <input id=\"pwLen\" type=\"range\" min=\"6\" max=\"64\" value=\"20\">\n      <div class=\"opts\" id=\"pwOpts\">\n        <button class=\"opt\" data-set=\"lower\" aria-pressed=\"true\">a&ndash;z</button>\n        <button class=\"opt\" data-set=\"upper\" aria-pressed=\"true\">A&ndash;Z</button>\n        <button class=\"opt\" data-set=\"digit\" aria-pressed=\"true\">0&ndash;9</button>\n        <button class=\"opt\" data-set=\"symbol\" aria-pressed=\"true\">Symbols</button>\n        <button class=\"opt\" data-set=\"clear\" aria-pressed=\"false\">Avoid look-alikes</button>\n      </div>\n      <button class=\"go\" id=\"pwNew\">Generate new password</button>\n    </div>\n  </div>\n</div>",
      "js": "const SETS = {\n  lower: 'abcdefghijklmnopqrstuvwxyz',\n  upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',\n  digit: '0123456789',\n  symbol: '!@#$%^&*()-_=+[]{};:,.?/~'\n};\nconst AMBIGUOUS = 'Il1O0oB8S5Z2';\nconst on = { lower:true, upper:true, digit:true, symbol:true, clear:false };\nconst out = document.getElementById('pwOut');\nconst bar = document.getElementById('pwBar');\n\nfunction pool(){\n  let p = '';\n  for (const k of ['lower','upper','digit','symbol']) if (on[k]) p += SETS[k];\n  if (on.clear) p = [...p].filter(c => !AMBIGUOUS.includes(c)).join('');\n  return p;\n}\n\n// Rejection sampling keeps every character equally likely across the pool.\nfunction pick(p){\n  const max = 256 - (256 % p.length);\n  const buf = new Uint8Array(1);\n  let v;\n  do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= max);\n  return p[v % p.length];\n}\n\nfunction paint(pw, poolSize){\n  out.innerHTML = [...pw].map(c => {\n    const cls = /[0-9]/.test(c) ? 'digit' : /[a-z]/i.test(c) ? '' : 'sym';\n    const esc = c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');\n    return cls ? '<span class=\"' + cls + '\">' + esc + '</span>' : esc;\n  }).join('');\n  const bits = Math.round(pw.length * Math.log2(poolSize));\n  const tiers = [[35,'Weak','#E5484D'],[60,'Fair','#F5A524'],[90,'Strong','#30A46C'],[1e9,'Excellent','#12805C']];\n  const [, label, colour] = tiers.find(t => bits < t[0]);\n  bar.style.width = Math.min(100, bits / 1.2) + '%';\n  bar.style.background = colour;\n  document.getElementById('pwStrength').innerHTML = '<b>' + label + '</b>';\n  document.getElementById('pwEntropy').textContent = bits + ' bits of entropy';\n}\n\nfunction generate(){\n  const p = pool();\n  if (!p){ out.textContent = 'Choose at least one character set'; bar.style.width = '0'; return; }\n  const len = +document.getElementById('pwLen').value;\n  let pw = '';\n  for (let i = 0; i < len; i++) pw += pick(p);\n  paint(pw, p.length);\n}\n\ndocument.getElementById('pwOpts').onclick = e => {\n  const b = e.target.closest('.opt'); if (!b) return;\n  const k = b.dataset.set;\n  on[k] = !on[k];\n  b.setAttribute('aria-pressed', on[k]);\n  generate();\n};\ndocument.getElementById('pwLen').oninput = e => {\n  document.getElementById('pwLenVal').textContent = e.target.value;\n  generate();\n};\ndocument.getElementById('pwNew').onclick = generate;\nout.onclick = async () => {\n  const text = out.textContent;\n  try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }\n  catch { \n    const t = document.createElement('textarea');\n    t.value = text; document.body.appendChild(t); t.select();\n    document.execCommand('copy'); t.remove(); toast('Copied to clipboard');\n  }\n};\ngenerate();"

st(p) ? '<span class=\"num\">' + p + '</span>' : p.replace(/[&<>]/g, '')\n  ).join('<span class=\"sep\">' + (sep === ' ' ? '&nbsp;' : sep) + '</span>');\n  out.dataset.plain = parts.join(sep);\n\n  const bits = Math.round(count * BITS_PER_WORD + extraBits);\n  const tiers = [[45,'Fair','#F5A524'],[70,'Strong','#30A46C'],[1e9,'Excellent','#12805C']];\n  const [, label, colour] = tiers.find(t => bits < t[0]);\n  document.getElementById('ppStrength').innerHTML = '<b style=\"color:' + colour + '\">' + label + '</b>';\n  document.getElementById('ppEntropy').textContent = bits + ' bits of entropy';\n}\n\ndocument.getElementById('ppCount').oninput = e => {\n  document.getElementById('ppCountVal').textContent = e.target.value;\n  generate();\n};\ndocument.getElementById('ppSep').onclick = e => {\n  const b = e.target.closest('.seg'); if (!b) return;\n  cfg.sep = b.dataset.sep;\n  document.querySelectorAll('#ppSep .seg').forEach(s => s.setAttribute('aria-pressed', s === b));\n  generate();\n};\ndocument.getElementById('ppOpts').onclick = e => {\n  const b = e.target.closest('.opt'); if (!b) return;\n  cfg[b.dataset.flag] = !cfg[b.dataset.flag];\n  b.setAttribute('aria-pressed', cfg[b.dataset.flag]);\n  generate();\n};\ndocument.getElementById('ppNew').onclick = generate;\nout.onclick = () => navigator.clipboard.writeText(out.dataset.plain).then(() => toast('Copied'), () => toast('Copied'));\n\ngenerate();"

      "html": "<div id=\"sn\">\n<style>\n  #sn{padding:24px 18px calc(48px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;overflow-y:auto;position:absolute;inset:0}\n  #sn .wrap{width:100%;max-width:620px}\n  #sn h2{margin:0 0 16px;font-size:24px;font-weight:700;letter-spacing:-.02em}\n  #sn .inrow{display:flex;gap:8px;margin-bottom:12px}\n  #sn .inrow input{flex:1;padding:12px 14px;border:1px solid rgba(60,60,67,.16);border-radius:13px;background:#fff;font-family:ui-monospace,Menlo,monospace;font-size:16px}\n  #sn .inrow select{flex:0 0 108px;padding:12px 10px;border:1px solid rgba(60,60,67,.16);border-radius:13px;background:#fff;font-family:ui-monospace,Menlo,monospace;font-size:16px}\n  #sn input:focus,#sn select:focus{outline:none;border-color:#0A84FF;box-shadow:0 0 0 3.5px rgba(10,132,255,.14)}\n  #sn .err{color:#B8390E;font-size:13px;min-height:18px;margin-bottom:8px}\n  #sn .hero{background:#111114;color:#fff;border-radius:18px;padding:20px;margin-bottom:14px}\n  #sn .hero .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}\n  #sn .hero .big{font-family:ui-monospace,Menlo,monospace;font-size:27px;font-weight:600;margin-top:5px;letter-spacing:-.01em}\n  #sn .hero .sub{margin-top:7px;font-size:13.5px;color:rgba(255,255,255,.6)}\n  #sn .card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 24px -18px rgba(16,24,40,.4)}\n  #sn .card h3{margin:0;padding:12px 16px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A6A6AE;border-bottom:1px solid rgba(60,60,67,.08)}\n  #sn .kv{display:flex;padding:11px 16px;border-bottom:1px solid rgba(60,60,67,.06);gap:12px;cursor:pointer}\n  #sn .kv:last-child{border-bottom:0} #sn .kv:hover{background:#F7F7FA}\n  #sn .kv .k{flex:0 0 148px;font-size:13.5px;color:#6E6E76}\n  #sn .kv .v{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:13.5px;color:#111114;text-align:right;word-break:break-all}\n  #sn .bits{padding:14px 16px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:2;word-break:break-all}\n  #sn .bits b{color:#0A84FF;font-weight:700} #sn .bits i{color:#C3C3C9;font-style:normal}\n  #sn .splitrow{display:flex;gap:8px;padding:12px 16px;align-items:center}\n  #sn .splitrow select{flex:1;padding:9px 11px;border:1px solid rgba(60,60,67,.14);border-radius:10px;font:inherit;font-size:14px;background:#fff}\n  #sn .splitrow button{padding:9px 15px;border:0;border-radius:10px;background:#0A84FF;color:#fff;font-size:14px;font-weight:600;cursor:pointer}\n  #sn .sub-t{max-height:280px;overflow-y:auto}\n  #sn .sub-r{display:flex;padding:9px 16px;border-top:1px solid rgba(60,60,67,.06);font-family:ui-monospace,Menlo,monospace;font-size:12.5px;gap:10px}\n  #sn .sub-r span:first-child{flex:0 0 34px;color:#A6A6AE}\n  #sn .sub-r span:nth-child(2){flex:1;color:#111114}\n  #sn .sub-r span:last-child{color:#6E6E76}\n</style>\n  <div class=\"wrap\">\n    <h2>Subnet Calculator</h2>\n    <div class=\"inrow\">\n      <input id=\"snIp\" value=\"192.168.1.0\" spellcheck=\"false\" inputmode=\"decimal\" placeholder=\"192.168.1.0\">\n      <select id=\"snCidr\"></select>\n    </div>\n    <p class=\"err\" id=\"snErr\"></p>\n    <div id=\"snOut\"></div>\n  </div>\n</div>",
      "js": "const $ = id => document.getElementById(id);\nconst sel = $('snCidr');\nfor (let i = 32; i >= 0; i--){\n  const o = document.createElement('option');\n  o.value = i; o.textContent = '/' + i;\n  sel.appendChild(o);\n}\nsel.value = 24;\n\nconst toInt = ip => ip.split('.').reduce((a, o) => (a << 8 >>> 0) + (+o), 0) >>> 0;\nconst toIp = n => [24, 16, 8, 0].map(s => (n >>> s) & 255).join('.');\nconst validIp = ip => /^(\\d{1,3}\\.){3}\\d{1,3}$/.test(ip) && ip.split('.').every(o => +o >= 0 && +o <= 255);\nconst bin = n => [24, 16, 8, 0].map(s => String((n >>> s) & 255).padStart(0)).length &&\n  [24, 16, 8, 0].map(s => ((n >>> s) & 255).toString(2).padStart(8, '0')).join('.');\n\nfunction classOf(n){\n  const f = (n >>> 24) & 255;\n  if (f < 128) return 'A'; if (f < 192) return 'B'; if (f < 224) return 'C';\n  if (f < 240) return 'D (multicast)'; return 'E (reserved)';\n}\nfunction isPrivate(n){\n  const f = (n >>> 24) & 255, s = (n >>> 16) & 255;\n  return f === 10 || (f === 172 && s >= 16 && s <= 31) || (f === 192 && s === 168) ||\n         f === 127 || (f === 169 && s === 254);\n}\n\nfunction calc(){\n  const ipStr = $('snIp').value.trim();\n  const cidr = +sel.value;\n  if (!validIp(ipStr)){ $('snErr').textContent = 'Enter a valid IPv4 address'; $('snOut').innerHTML = ''; return; }\n  $('snErr').textContent = '';\n\n  const ip = toInt(ipStr);\n  const mask = cidr === 0 ? 0 : (0xFFFFFFFF << (32 - cidr)) >>> 0;\n  const wildcard = (~mask) >>> 0;\n  const network = (ip & mask) >>> 0;\n  const broadcast = (network | wildcard) >>> 0;\n  const totalHosts = Math.pow(2, 32 - cidr);\n  const usable = cidr >= 31 ? (cidr === 32 ? 1 : 2) : totalHosts - 2;\n  const first = cidr >= 31 ? network : network + 1;\n  const last = cidr >= 31 ? broadcast : broadcast - 1;\n\n  const netBits = bin(network).replace(/\\./g, '');\n  const hostPart = 32 - cidr;\n  const marked = netBits.split('').map((c, i) =>\n    i < cidr ? '<b>' + c + '</b>' : '<i>' + c + '</i>').join('')\n    .replace(/(.{8})(?=.)/g, '$1.');\n\n  const rows = [\n    ['Network address', toIp(network)],\n    ['Usable range', cidr >= 31 ? toIp(first) + ' \\u2013 ' + toIp(last) : toIp(first) + ' \\u2013 ' + toIp(last)],\n    ['Broadcast address', toIp(broadcast)],\n    ['Subnet mask', toIp(mask)],\n    ['Wildcard mask', toIp(wildcard)],\n    ['Total addresses', totalHosts.toLocaleString()],\n    ['Usable hosts', usable.toLocaleString()],\n    ['CIDR notation', toIp(network) + '/' + cidr],\n    ['Class', classOf(ip)],\n    ['Scope', isPrivate(ip) ? 'Private / reserved (RFC 1918)' : 'Public']\n  ];\n\n  const splitOpts = [];\n  for (let c = cidr + 1; c <= Math.min(cidr + 8, 32); c++)\n    splitOpts.push('<option value=\"' + c + '\">/' + c + ' \\u2014 ' + Math.pow(2, c - cidr) + ' subnets</option>');\n\n  $('snOut').innerHTML =\n    '<div class=\"hero\"><div class=\"lbl\">Network</div><div class=\"big\">' + toIp(network) + '/' + cidr + '</div>' +\n    '<div class=\"sub\">' + usable.toLocaleString() + ' usable host' + (usable === 1 ? '' : 's') +\n    ' \\u00b7 mask ' + toIp(mask) + '</div></div>' +\n\n    '<div class=\"card\"><h3>Details</h3>' +\n      rows.map(([k, v]) => '<div class=\"kv\" data-c=\"' + v + '\"><div class=\"k\">' + k + '</div><div class=\"v\">' + v + '</div></div>').join('') +\n    '</div>' +\n\n    '<div class=\"card\"><h3>Binary</h3><div class=\"bits\">' + marked +\n      '<div style=\"color:#A6A6AE;font-size:11.5px;margin-top:4px\">' + cidr + ' network bits \\u00b7 ' + hostPart + ' host bits</div>' +\n    '</div></div>' +\n\n    (cidr < 32 ? '<div class=\"card\"><h3>Split this network</h3>' +\n      '<div class=\"splitrow\"><select id=\"snSplit\">' + splitOpts.join('') + '</select>' +\n      '<button id=\"snSplitGo\">Split</button></div><div id=\"snSubs\"></div></div>' : '');\n\n  $('snOut').querySelectorAll('.kv').forEach(el => el.onclick = () => {\n    navigator.clipboard.writeText(el.dataset.c).then(() => toast('Copied ' + el.dataset.c), () => toast('Copied'));\n  });\n\n  const go = $('snSplitGo');\n  if (go) go.onclick = () => {\n    const nc = +$('snSplit').value;\n    const size = Math.pow(2, 32 - nc);\n    const count = Math.pow(2, nc - cidr);\n    let html = '<div class=\"sub-t\">';\n    for (let i = 0; i < Math.min(count, 256); i++){\n      const nw = (network + i * size) >>> 0;\n      const bc = (nw + size - 1) >>> 0;\n      html += '<div class=\"sub-r\"><span>' + (i + 1) + '</span><span>' + toIp(nw) + '/' + nc +\n        '</span><span>' + (nc >= 31 ? toIp(nw) : toIp(nw + 1)) + ' \\u2013 ' + (nc >= 31 ? toIp(bc) : toIp(bc - 1)) + '</span></div>';\n    }\n    if (count > 256) html += '<div class=\"sub-r\"><span></span><span>\\u2026 and ' + (count - 256).toLocaleString() + ' more</span><span></span></div>';\n    $('snSubs').innerHTML = html + '</div>';\n  };\n}\n\n$('snIp').addEventListener('input', calc);\nsel.addEventListener('change', calc);\ncalc();"
