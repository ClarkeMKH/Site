<!DOCTYPE html>
<html lang="en"><head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body style="margin:0px; padding:0px; font-family: 'Trebuchet MS', sans-serif;">

        <div id="page" style="width:100%; height:100dvh;"></div>

        <script>
            const page = document.getElementById("page");
            let master = "";

            // COMPONENTS_START
            let components = {
          "Home": {
                    "html": "<div id='home-wrapper' style='position:relative; width:100%; height:100dvh; overflow:hidden; background:#f5f5f7;'>\n    <button id='menu-toggle-btn' style='position:absolute; top:16px; left:16px; z-index:1000; width:44px; height:44px; border:none; border-radius:8px; background:#ffffff; box-shadow:0 2px 6px rgba(0,0,0,0.15); cursor:pointer; font-size:20px; line-height:44px; text-align:center; padding:0;'>&#9776;</button>\n    <div id='menu-overlay' style='position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); opacity:0; pointer-events:none; transition:opacity 0.25s ease; z-index:998;'></div>\n    <div id='side-menu' style='position:fixed; top:0; left:-280px; width:280px; height:100%; background:#ffffff; box-shadow:2px 0 10px rgba(0,0,0,0.2); transition:left 0.25s ease; z-index:999; padding:70px 16px 16px 16px; box-sizing:border-box; display:flex; flex-direction:column;'>\n        <input id='comp-search' placeholder='Search components...' style='width:100%; box-sizing:border-box; padding:10px 12px; margin-bottom:10px; border:1px solid #ddd; border-radius:6px; font-size:14px; font-family:inherit; outline:none; flex-shrink:0;'/>\n        <div id='comp-filters' style='display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; flex-shrink:0;'></div>\n        <div id='comp-list' style='flex:1; min-height:0; overflow-y:auto;'></div>\n    </div>\n    <div id='contentsPage' style='height:100%; overflow-y:auto; padding:0px; box-sizing:border-box;'></div>\n</div>",
                    "js": "/* ---------------- helpers ---------------- */\n\nfunction el(id){\n    return document.getElementById(id);\n}\n\nif (!window.__contextListenersBound) {\n    window.__contextListenersBound = true;\n    var hideContext = function () {\n        if (window.__suppressTapUntil && Date.now() < window.__suppressTapUntil) return;\n        var m = document.getElementById(\"context\");\n        if (m) m.style.display = \"none\";\n    };\n    document.addEventListener(\"click\", hideContext);\n    document.addEventListener(\"contextmenu\", hideContext);\n    document.addEventListener(\"scroll\", hideContext, true);\n    document.addEventListener(\"keydown\", function (e) { if (e.key === \"Escape\") hideContext(); });\n}\n\nwindow.__showContext = function(x, y, obj) {\n    let menu = document.getElementById(\"context\");\n    if (!menu) {\n        menu = page.appendChild(document.createElement(\"div\"));\n        menu.id = \"context\";\n        menu.oncontextmenu = (e) => e.preventDefault();\n    }\n    const coarse = !!(window.matchMedia && window.matchMedia(\"(pointer: coarse)\").matches);\n    menu.style.cssText = \"position:fixed; top:0; left:0; z-index:2000; display:none; padding:6px; color:#333; background:#fff; border:1px solid rgba(35,40,48,.08); border-radius:10px; box-shadow:0 8px 28px rgba(35,40,48,.18); user-select:none; -webkit-user-select:none; touch-action:manipulation; -webkit-tap-highlight-color:rgba(0,0,0,0); min-width:\" + (coarse ? \"210px\" : \"160px\") + \"; font-size:\" + (coarse ? \"15px\" : \"13px\") + \";\";\n    menu.innerHTML = \"\";\n    Object.keys(obj).forEach((label) => {\n        const action = obj[label];\n        const enabled = typeof action === \"function\";\n        const item = document.createElement(\"div\");\n        item.textContent = label;\n        item.style.cssText = \"height:\" + (coarse ? \"44px\" : \"32px\") + \"; padding:0 14px; display:flex; align-items:center; border-radius:6px; cursor:\" + (enabled ? \"pointer\" : \"default\") + \"; color:\" + (enabled ? \"#333\" : \"#b4b4bc\") + \";\";\n        if (enabled) {\n            item.onmouseenter = () => item.style.background = \"#f0f0f2\";\n            item.onmouseleave = () => item.style.background = \"\";\n            item.onclick = () => { menu.style.display = \"none\"; action(); };\n        } else {\n            item.title = \"Not available for this component yet\";\n        }\n        menu.appendChild(item);\n    });\n    menu.style.display = \"block\";\n    menu.style.left = `${Math.min(x, window.innerWidth - menu.offsetWidth - 8)}px`;\n    menu.style.top = `${Math.min(y, window.innerHeight - menu.offsetHeight - 8)}px`;\n    return menu;\n}\n\nwindow.customContext = function(el, obj) {\n    el.oncontextmenu = (e) => {\n        e.preventDefault();\n        e.stopPropagation();\n        window.__showContext(e.clientX, e.clientY, obj);\n    };\n}\n\nwindow.customModal = function(title, body, actions) {\n    const overlay = document.body.appendChild(document.createElement(\"div\"));\n    overlay.style.cssText = \"position:fixed; inset:0; z-index:3000; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.45);\";\n    const panel = overlay.appendChild(document.createElement(\"div\"));\n    panel.style.cssText = \"width:92vw; height:90dvh; max-width:1100px; display:flex; flex-direction:column; background:#fff; border-radius:12px; box-shadow:0 20px 60px rgba(35,40,48,0.3); overflow:hidden; font-family:inherit; font-size:14px; color:#333;\";\n    const close = () => { overlay.remove(); document.removeEventListener(\"keydown\", onKey); };\n    const onKey = (e) => { if (e.key === \"Escape\") close(); };\n    document.addEventListener(\"keydown\", onKey);\n\n    const head = panel.appendChild(document.createElement(\"div\"));\n    head.style.cssText = \"display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid #eee; flex-shrink:0;\";\n    const heading = head.appendChild(document.createElement(\"h2\"));\n    heading.textContent = title;\n    heading.style.cssText = \"margin:0; font-size:16px; font-weight:600;\";\n    const x = head.appendChild(document.createElement(\"button\"));\n    x.innerHTML = \"&times;\";\n    x.style.cssText = \"border:none; background:none; font-size:24px; line-height:1; color:#888; cursor:pointer; padding:0 4px;\";\n    x.onclick = close;\n\n    const content = panel.appendChild(document.createElement(\"div\"));\n    content.style.cssText = \"flex:1; min-height:0; padding:16px 18px; display:flex; flex-direction:column; overflow:auto;\";\n    if (typeof body === \"string\") content.innerHTML = body; else content.appendChild(body);\n\n    const labels = Object.keys(actions || {});\n    if (labels.length) {\n        const foot = panel.appendChild(document.createElement(\"div\"));\n        foot.style.cssText = \"display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid #eee; flex-shrink:0;\";\n        labels.forEach((label, i) => {\n            const b = foot.appendChild(document.createElement(\"button\"));\n            const primary = i === labels.length - 1;\n            b.textContent = label;\n            b.style.cssText = `padding:9px 20px; border:none; border-radius:6px; cursor:pointer; font-family:inherit; font-size:14px; background:${primary ? \"#333\" : \"#f0f0f2\"}; color:${primary ? \"#fff\" : \"#333\"};`;\n            b.onclick = () => actions[label](close, content);\n        });\n    }\n    content.closeModal = close;\n    return content;\n}\n\n/* ---------------- side menu ---------------- */\n\nfunction menuIsOpen(){\n    var m=el('side-menu');\n    return !!m&&m.style.left==='0px';\n}\n\nfunction setMenu(open){\n    var m=el('side-menu');\n    var ov=el('menu-overlay');\n    if(m) m.style.left=open?'0px':'-280px';\n    if(ov){\n        ov.style.opacity=open?'1':'0';\n        ov.style.pointerEvents=open?'auto':'none';\n    }\n}\n\nfunction navigateTo(name){\n    setMenu(false);\n    var pageEl=el('page');\n    pageEl.innerHTML='';\n    mount(name,pageEl,propsDefaults(name));\n    if(name!=='Home'){\n        var back=document.createElement('button');\n        back.id='builder-back';\n        back.textContent='\\u2190 Builder';\n        back.style.cssText='position:fixed; top:14px; right:14px; z-index:2500; padding:8px 14px; border:none; border-radius:8px; background:#1e2230; color:#fff; font-family:inherit; font-size:13px; cursor:pointer; box-shadow:0 2px 8px rgba(20,24,40,0.25);';\n        pageEl.appendChild(back);\n    }\n}\n\n/* Builder blocks (anything in Web / anything with settings) get placed on the\n   page when clicked; tools take over the whole page instead. */\nfunction isBlock(name){\n    var c=components[name];\n    if(!c) return false;\n    return categoryOf(name)==='Web'||schemaOf(name).length>0||c.container===true;\n}\n\nfunction openEditor(name){\n    var raw=components[name];\n    var draft={};\n    Object.keys(raw).forEach(function(k){\n        draft[k]=(typeof raw[k]==='string')?raw[k]:JSON.stringify(raw[k],null,4);\n    });\n    var mode='html';\n    var wrap=document.createElement('div');\n    wrap.style.cssText='display:flex; flex-direction:column; height:100%; min-height:0; gap:10px;';\n    var toggle=document.createElement('div');\n    toggle.style.cssText='display:flex; gap:6px; flex-shrink:0;';\n    var ta=document.createElement('textarea');\n    ta.spellcheck=false;\n    ta.style.cssText='flex:1; min-height:0; width:100%; box-sizing:border-box; padding:12px; border:1px solid #ddd; border-radius:8px; font-family:monospace; font-size:13px; line-height:1.5; resize:none; outline:none; white-space:pre; overflow:auto;';\n    textAreaTabFunctionality(ta);\n    var tabs={};\n    Object.keys(components[name]).forEach(function(m){\n        var b=document.createElement('button');\n        b.textContent=m.toUpperCase();\n        b.style.cssText='padding:8px 20px; border:none; border-radius:6px; cursor:pointer; font-family:inherit; font-size:13px;';\n        b.onclick=function(){\n            draft[mode]=ta.value;\n            mode=m;\n            sync();\n        };\n        tabs[m]=b;\n        toggle.appendChild(b);\n    });\n    function sync(){\n        ta.value=draft[mode];\n        Object.keys(components[name]).forEach(function(m){\n            var on=m===mode;\n            tabs[m].style.background=on?'#333':'#f0f0f2';\n            tabs[m].style.color=on?'#fff':'#333';\n        });\n    }\n    sync();\n    wrap.appendChild(toggle);\n    wrap.appendChild(ta);\n    customModal('Edit: '+name,wrap,{\n        'Cancel':function(close){\n            close();\n        },\n        'Save':function(close){\n            draft[mode]=ta.value;\n            var out={};\n            var bad=null;\n            Object.keys(draft).forEach(function(k){\n                if(typeof raw[k]==='string'){\n                    out[k]=draft[k];\n                } else {\n                    try{\n                        out[k]=JSON.parse(draft[k]);\n                    }catch(err){\n                        bad=k;\n                    }\n                }\n            });\n            if(bad){\n                alert('The '+bad.toUpperCase()+' tab is not valid JSON, so nothing was saved.');\n                return;\n            }\n            components[name] = out;\n            close();\n            renderFilters();\n            renderList(searchValue());\n        }\n    });\n}\n\n/* ---------------- category filters ---------------- */\n\nwindow.__activeCats = window.__activeCats || {};\nvar activeCats = window.__activeCats;\n\nfunction searchValue(){\n    var s=el('comp-search');\n    return s?s.value:'';\n}\n\nfunction categoryOf(name){\n    var c=components[name] && components[name].category;\n    return (c && String(c).trim()) ? String(c).trim() : 'Uncategorised';\n}\n\nfunction allCategories(){\n    var out=[];\n    Object.keys(components).forEach(function(n){\n        var c=categoryOf(n);\n        if(out.indexOf(c)===-1) out.push(c);\n    });\n    out.sort(function(a,b){\n        return a.toLowerCase()<b.toLowerCase()?-1:1;\n    });\n    return out;\n}\n\nfunction pillStyle(on){\n    return 'padding:4px 10px; border:1px solid '+(on?'#333':'#ddd')+'; border-radius:999px; background:'+(on?'#333':'#fff')+'; color:'+(on?'#fff':'#666')+'; font-size:11px; font-family:inherit; cursor:pointer; line-height:1.4; white-space:nowrap;';\n}\n\nfunction renderFilters(){\n    var filtersEl=el('comp-filters');\n    if(!filtersEl) return;\n    filtersEl.innerHTML='';\n    var cats=allCategories();\n    Object.keys(activeCats).forEach(function(c){\n        if(cats.indexOf(c)===-1) delete activeCats[c];\n    });\n    cats.forEach(function(c){\n        var b=document.createElement('button');\n        b.textContent=c;\n        b.setAttribute('data-cat',c);\n        b.style.cssText=pillStyle(!!activeCats[c]);\n        filtersEl.appendChild(b);\n    });\n    if(Object.keys(activeCats).length){\n        var clr=document.createElement('button');\n        clr.textContent='Clear';\n        clr.setAttribute('data-clear-cats','1');\n        clr.style.cssText=pillStyle(false)+' color:#c0392b; border-style:dashed;';\n        filtersEl.appendChild(clr);\n    }\n}\n\n/* Shared by the sidebar list and the add-component picker. */\nfunction componentRow(name,css){\n    var btn=document.createElement('button');\n    btn.setAttribute('data-comp-name',name);\n    btn.style.cssText=css;\n    if(components[name].icon){\n        var ic=document.createElement('span');\n        ic.innerHTML=components[name].icon;\n        ic.style.flexShrink='0';\n        btn.appendChild(ic);\n    }\n    var nm=document.createElement('span');\n    nm.textContent=name;\n    nm.style.cssText='flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';\n    btn.appendChild(nm);\n    var cat=document.createElement('span');\n    cat.textContent=categoryOf(name);\n    cat.style.cssText='flex-shrink:0; font-size:10px; color:#999; text-transform:uppercase; letter-spacing:0.04em;';\n    btn.appendChild(cat);\n    return btn;\n}\n\nfunction renderList(filter){\n    var listEl=el('comp-list');\n    if(!listEl) return;\n    filter=(filter||'').toLowerCase();\n    listEl.innerHTML='';\n    var cats=Object.keys(activeCats);\n    var names=Object.keys(components).filter(function(n){\n        if(n.toLowerCase().indexOf(filter)===-1) return false;\n        if(cats.length && !activeCats[categoryOf(n)]) return false;\n        return true;\n    });\n    if(!names.length){\n        var e=document.createElement('p');\n        e.textContent='No components found.';\n        e.style.cssText='color:#999; font-size:13px;';\n        listEl.appendChild(e);\n        return;\n    }\n    names.forEach(function(name){\n        listEl.appendChild(componentRow(name,'display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:12px 14px; margin-bottom:8px; border:none; border-radius:6px; background:#f0f0f2; color:#333; font-size:15px; cursor:pointer; font-family:inherit;'));\n    });\n}\n\nfunction listActions(name){\n    var acts={\n        'Add to page':function(){\n            setMenu(false);\n            createInstance(name,contentsEl());\n        },\n        'Edit':function(){\n            openEditor(name);\n        },\n        'Rename':function(){\n            var nn=prompt('Rename \"'+name+'\" to:',name);\n            if(!nn||nn===name||components[nn])return;\n            components[nn]=components[name];\n            delete components[name];\n            renderFilters();\n            renderList(searchValue());\n        },\n        'Delete':function(){\n            if(!confirm('Delete \"'+name+'\"?'))return;\n            delete components[name];\n            renderFilters();\n            renderList(searchValue());\n        }\n    };\n    if(name==='Home'){\n        delete acts['Add to page'];\n        delete acts['Rename'];\n        delete acts['Delete'];\n    }\n    return acts;\n}\n\n/* ---------------- page instances ---------------- */\n/* Instance state lives in data-* attributes so it survives any component that\n   rewrites innerHTML, and the context menu is delegated from the document for\n   the same reason. */\n\nvar BASE_INSTANCE_CSS='position:relative; box-sizing:border-box;';\nvar INPUT_CSS='padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:13px; font-family:inherit; color:#333; outline:none; background:#fff; box-sizing:border-box; width:100%;';\n\n/* The styling panel and the default wrapper styles are the same list of\n   properties, so they are declared once, in the same format as component\n   settings. Labels are derived from the property name. */\nvar STYLE_SCHEMA={\n    'Layout':[\n        'width|text|100%',\n        'height|text|200px',\n        'min-height|text',\n        'max-height|text',\n        'padding|text|0px',\n        'margin|text|0 0 12px 0',\n        'overflow|sel|auto||,visible,hidden,auto,scroll',\n        'display|sel|||,block,flex,inline-block,grid',\n        'flex-direction|sel|||,row,column',\n        'align-items|sel|||,stretch,flex-start,center,flex-end',\n        'justify-content|sel|||,flex-start,center,flex-end,space-between,space-around'\n    ].join('\\n'),\n    'Appearance':[\n        'background|text|#ffffff',\n        'color|text||Text colour',\n        'font-size|text',\n        'border|text|1px solid #e3e3e8',\n        'border-radius|text|8px',\n        'box-shadow|text',\n        'opacity|text'\n    ].join('\\n')\n};\n\n/* Builder blocks share one default: no card chrome, height driven by content. */\nvar BLOCK_STYLES={\n    'height':'auto',\n    'overflow':'visible',\n    'background':'transparent',\n    'border':'none',\n    'border-radius':'0px',\n    'margin':'0 0 0 0'\n};\n\nfunction clone(v){\n    return (v===undefined)?v:JSON.parse(JSON.stringify(v));\n}\n\nfunction styleFields(){\n    var out=[];\n    Object.keys(STYLE_SCHEMA).forEach(function(g){\n        out=out.concat(parseSchema(STYLE_SCHEMA[g]));\n    });\n    return out;\n}\n\nfunction defaultStyles(name){\n    var base={};\n    styleFields().forEach(function(f){ base[f.key]=f.default; });\n    if(isBlock(name)) mergeOver(base,BLOCK_STYLES);\n    return mergeOver(base,components[name]&&components[name].layout);\n}\n\nfunction getStyles(wrap){\n    try{\n        var s=JSON.parse(wrap.getAttribute('data-styles'));\n        if(s&&typeof s==='object') return s;\n    }catch(err){}\n    return defaultStyles(wrap.getAttribute('data-comp'));\n}\n\nfunction setStyles(wrap,styles){\n    wrap.setAttribute('data-styles',JSON.stringify(styles));\n}\n\nfunction applyInstanceStyles(wrap){\n    var s=getStyles(wrap);\n    var css=BASE_INSTANCE_CSS;\n    Object.keys(s).forEach(function(k){\n        var v=(s[k]===null||s[k]===undefined)?'':String(s[k]).trim();\n        if(v!=='') css+=' '+k+':'+v+';';\n    });\n    var extra=wrap.getAttribute('data-css')||'';\n    if(extra.trim()!=='') css+=' '+extra.trim();\n    wrap.style.cssText=css;\n}\n\n/* ---------------- component props (per-component settings) ---------------- */\n\n/* Settings are declared as one compact line per field, which keeps the\n   components object short and makes the SCHEMA tab easy to edit:\n\n     key|type|default|label|extra|hint\n\n   type   text | area | num | sel | bool | color | list\n   extra  sel  -> comma separated options\n          num  -> min,max,step\n          list -> row fields as key:type:label:default, separated by ;\n                  (a sel row field takes its options in place of the default,\n                   and uses the first one as the default)\n   default for a list is either a row count or an inline JSON array of rows.\n   Blank label falls back to the key. A full JSON array still works too. */\n\nfunction autoLabel(key){\n    var s=String(key).replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/[_-]+/g,' ').trim();\n    return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();\n}\n\nfunction longType(t){\n    t=(t||'text').trim();\n    if(t==='area') return 'textarea';\n    if(t==='num') return 'number';\n    if(t==='sel') return 'select';\n    if(t==='bool') return 'checkbox';\n    return t;\n}\n\nfunction parseRowField(part){\n    var c=part.split(':');\n    var sub={key:(c[0]||'').trim()};\n    sub.label=(c[2]||'').trim()||autoLabel(sub.key);\n    sub.type=longType(c[1]);\n    var last=(c[3]===undefined)?'':c[3];\n    if(sub.type==='select'){\n        sub.options=last?last.split(','):[];\n        sub.default=sub.options.length?sub.options[0]:'';\n    } else if(sub.type==='checkbox'){\n        sub.default=(last==='1'||last==='true');\n    } else if(sub.type==='number'){\n        sub.default=parseFloat(last)||0;\n    } else {\n        sub.default=last;\n    }\n    return sub;\n}\n\nfunction parseField(line){\n    var b=line.split('|');\n    var f={key:b[0].trim()};\n    f.label=(b[3]||'').trim()||autoLabel(f.key);\n    f.type=longType(b[1]);\n    var dflt=(b[2]===undefined)?'':b[2];\n    var extra=(b[4]===undefined)?'':b[4].trim();\n    var hint=(b[5]===undefined)?'':b[5].trim();\n    if(f.type==='select'){\n        f.options=extra?extra.split(','):[];\n        f.default=dflt;\n    } else if(f.type==='number'){\n        f.default=parseFloat(dflt)||0;\n        var mm=extra?extra.split(','):[];\n        if(mm[0]) f.min=parseFloat(mm[0]);\n        if(mm[1]) f.max=parseFloat(mm[1]);\n        if(mm[2]) f.step=parseFloat(mm[2]);\n    } else if(f.type==='checkbox'){\n        f.default=(dflt==='1'||dflt==='true');\n    } else if(f.type==='list'){\n        f.item=extra?extra.split(';').filter(Boolean).map(parseRowField):[];\n        f.itemLabel=f.label.replace(/s$/,'')||'Item';\n        var rows=[];\n        var d=String(dflt).trim();\n        if(d.charAt(0)==='['){\n            try{ rows=JSON.parse(d); }catch(err){ rows=[]; }\n        } else if(d!==''&&!isNaN(parseInt(d,10))){\n            var n=parseInt(d,10);\n            for(var i=0;i<n;i++){\n                var row={};\n                f.item.forEach(function(sub){ row[sub.key]=clone(sub.default); });\n                rows.push(row);\n            }\n        }\n        f.default=rows;\n    } else {\n        f.default=dflt;\n    }\n    if(hint) f.hint=hint;\n    return f;\n}\n\nfunction parseSchema(spec){\n    if(Array.isArray(spec)) return spec;\n    if(typeof spec!=='string') return [];\n    return spec.split('\\n').map(function(l){\n        return l.trim();\n    }).filter(function(l){\n        return l&&l.charAt(0)!=='#';\n    }).map(parseField);\n}\n\nfunction schemaOf(name){\n    return parseSchema(components[name]&&components[name].schema);\n}\n\nfunction blankValue(f){\n    if(f.default!==undefined) return clone(f.default);\n    if(f.type==='checkbox') return false;\n    if(f.type==='number') return 0;\n    if(f.type==='list') return [];\n    return '';\n}\n\nfunction propsDefaults(name){\n    var out={};\n    schemaOf(name).forEach(function(f){\n        out[f.key]=blankValue(f);\n    });\n    return out;\n}\n\nfunction propsOf(wrap){\n    var out=propsDefaults(wrap.getAttribute('data-comp'));\n    try{\n        var saved=JSON.parse(wrap.getAttribute('data-props'));\n        if(saved&&typeof saved==='object'){\n            Object.keys(saved).forEach(function(k){ out[k]=saved[k]; });\n        }\n    }catch(err){}\n    return out;\n}\n\nfunction setProps(wrap,props){\n    wrap.setAttribute('data-props',JSON.stringify(props));\n}\n\n/* Components read window.__mountEl / window.__mountProps when they run. */\nfunction mount(name,target,props){\n    window.__mountEl=target;\n    window.__mountProps=props||{};\n    try{\n        addComponent(name,target);\n    }catch(err){\n        target.innerHTML=\"<div style='padding:12px; color:#c0392b; font-size:13px; font-family:inherit;'>Error in \\\"\"+name+\"\\\": \"+(err&&err.message?err.message:err)+\"</div>\";\n    }\n}\n\n/* ---------------- slots (nesting) ---------------- */\n\nfunction ownSlots(wrap){\n    return Array.prototype.filter.call(wrap.querySelectorAll('[data-slot]'),function(s){\n        return s.closest('.comp-instance')===wrap;\n    });\n}\n\nvar HINT_CSS='display:flex; align-items:center; justify-content:center; text-align:center; pointer-events:none; font-family:inherit;';\n\nfunction makeHint(cls,text,css){\n    var h=document.createElement('div');\n    if(cls) h.className=cls;\n    h.textContent=text;\n    h.style.cssText=HINT_CSS+css;\n    return h;\n}\n\nfunction refreshSlots(){\n    var cp=contentsEl();\n    if(!cp) return;\n    Array.prototype.forEach.call(cp.querySelectorAll('[data-slot]'),function(s){\n        var hint=s.querySelector(':scope > .slot-hint');\n        if(s.querySelector('.comp-instance')){\n            s.style.outline='';\n            s.style.minHeight='';\n            if(hint) hint.remove();\n            return;\n        }\n        s.style.outline='1px dashed #c9c9d2';\n        s.style.outlineOffset='-2px';\n        if(!s.style.minHeight) s.style.minHeight='70px';\n        if(!hint) s.appendChild(makeHint('slot-hint','Right-click to add a component','color:#b4b4bc; font-size:12px; min-height:70px; height:100%;'));\n    });\n}\n\nfunction refreshHints(){\n    refreshSlots();\n    refreshEmpty();\n}\n\nfunction contentsEl(){\n    return document.getElementById('contentsPage');\n}\n\nfunction refreshEmpty(){\n    var cp=contentsEl();\n    if(!cp) return;\n    var hint=document.getElementById('contents-empty');\n    if(!hint){\n        hint=makeHint('','Right-click here to add a component','color:#a8a8b0; font-size:14px; height:100%;');\n        hint.id='contents-empty';\n        cp.appendChild(hint);\n    }\n    hint.style.display=cp.querySelector('.comp-instance')?'none':'flex';\n}\n\nfunction supportsChildren(name){\n    var c=components[name];\n    if(!c) return false;\n    if(c.container===true||c.container==='true') return true;\n    return (c.html||'').indexOf('data-slot')!==-1;\n}\n\nfunction badgeOf(wrap){\n    return wrap.querySelector(':scope > .comp-badge');\n}\n\nfunction makeBadge(wrap,name){\n    var badge=document.createElement('div');\n    badge.className='comp-badge';\n    badge.textContent=name;\n    badge.style.cssText='position:absolute; top:0; right:0; z-index:5; padding:2px 8px; font-size:10px; letter-spacing:0.04em; text-transform:uppercase; color:#8a8a94; background:rgba(240,240,242,0.92); border-bottom-left-radius:6px; pointer-events:none; font-family:inherit;';\n    if(wrap.getAttribute('data-label')==='off') badge.style.display='none';\n    wrap.appendChild(badge);\n    return badge;\n}\n\nfunction childInstances(el){\n    return Array.prototype.slice.call(el.querySelectorAll(':scope > .comp-instance'));\n}\n\nfunction mergeOver(base,over){\n    if(over&&typeof over==='object'){\n        Object.keys(over).forEach(function(k){ base[k]=over[k]; });\n    }\n    return base;\n}\n\nfunction makeWrap(name,styles,props,css,label){\n    var wrap=document.createElement('div');\n    wrap.className='comp-instance';\n    wrap.setAttribute('data-comp',name);\n    wrap.setAttribute('data-label',(label==='off')?'off':'on');\n    wrap.setAttribute('data-css',css||'');\n    setStyles(wrap,styles);\n    setProps(wrap,props);\n    applyInstanceStyles(wrap);\n    return wrap;\n}\n\nfunction createInstance(name,container){\n    if(!components[name]){\n        alert('Component \"'+name+'\" no longer exists.');\n        return null;\n    }\n    var wrap=makeWrap(name,defaultStyles(name),propsDefaults(name),'','on');\n    container.appendChild(wrap);\n    mount(name,wrap,propsOf(wrap));\n    makeBadge(wrap,name);\n    refreshHints();\n    savePage();\n    return wrap;\n}\n\n/* ---------------- the page is stored on Home itself ----------------\n   Everything placed on the page is kept in components.Home.page, so the\n   Export component carries the built page with it and reopening the file\n   (or coming back from a preview) rebuilds it. Only diffe        if(actionsForTarget(e.target)) e.preventDefault();\n    });\n}\n\n/* Stops long press from selecting text, showing the iOS callout, or dragging\n   images and links out of the page. Inputs inside components stay selectable. */\nif(!document.getElementById('builder-touch-css')){\n    var bstyle=document.createElement('style');\n    bstyle.id='builder-touch-css';\n    bstyle.textContent=[\n        '#contentsPage, #comp-list, #comp-filters { -webkit-touch-callout:none; }',\n        '#contentsPage .comp-instance, #contentsPage #contents-empty, #contentsPage .slot-hint, #comp-list button, #comp-filters button {',\n        '  -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;',\n        '  -webkit-touch-callout:none; -webkit-tap-highlight-color:rgba(0,0,0,0); }',\n        '#contentsPage .comp-instance img, #contentsPage .comp-instance a {',\n        '  -webkit-user-drag:none; -khtml-user-drag:none; user-drag:none; -webkit-touch-callout:none; }',\n        '#contentsPage .comp-instance input, #contentsPage .comp-instance textarea, #contentsPage .comp-instance select {',\n        '  -webkit-user-select:auto; -moz-user-select:text; user-select:auto; }',\n        '#contentsPage { -webkit-overflow-scrolling:touch; }'\n    ].join('\\n');\n    document.head.appendChild(bstyle);\n}\n\nwindow.__homeClickHandler=function(e){\n    var t=e.target;\n    if(!t||!t.closest) return;\n    if(window.__suppressTapUntil&&Date.now()<window.__suppressTapUntil) return;\n    if(t.closest('#menu-toggle-btn')){\n        setMenu(!menuIsOpen());\n        return;\n    }\n    if(t.id==='menu-overlay'){\n        setMenu(false);\n        return;\n    }\n    var pill=t.closest('#comp-filters button[data-cat]');\n    if(pill){\n        var c=pill.getAttribute('data-cat');\n        if(activeCats[c]) delete activeCats[c]; else activeCats[c]=true;\n        renderFilters();\n        renderList(searchValue());\n        return;\n    }\n    if(t.closest('#comp-filters             async function saveComponents(password) {
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await crypto.subtle.deriveKey(
                    { "name" : "PBKDF2", "salt" : salt, "iterations" : 600000, "hash" : "SHA-256" },
                    await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]),
                    { "name" : "AES-GCM", "length" : 256 }, false, ["encrypt"]
                );
                const data = await crypto.subtle.encrypt({ "name" : "AES-GCM", "iv" : iv }, key, new TextEncoder().encode(JSON.stringify(components)));
                const db = await new Promise((done, fail) => {
                    const req = indexedDB.open("toolkit", 1);
                    req.onupgradeneeded = () => req.result.createObjectStore("components");
                    req.onsuccess = () => done(req.result);
                    req.onerror = () => fail(req.error);
                });
                await new Promise((done, fail) => {
                    const req = db.transaction("components", "readwrite").objectStore("components").put({ "salt" : salt, "iv" : iv, "data" : data }, "components");
                    req.onsuccess = () => done();
                    req.onerror = () => fail(req.error);
                });
                db.close();
            }
            
            async function loadComponents(password) {
                const db = await new Promise((done, fail) => {
                    const req = indexedDB.open("toolkit", 1);
                    req.onupgradeneeded = () => req.result.createObjectStore("components");
                    req.onsuccess = () => done(req.result);
                    req.onerror = () => fail(req.error);
                });
                const saved = await new Promise((done, fail) => {
                    const req = db.transaction("components", "readonly").objectStore("components").get("components");
                    req.onsuccess = () => done(req.result);
                    req.onerror = () => fail(req.error);
                });
                db.close();
                if (!saved) return false;
                if (!password) return true; // No password just asks whether a vault exists yet.
                const key = await crypto.subtle.deriveKey(
                    { "name" : "PBKDF2", "salt" : saved["salt"], "iterations" : 600000, "hash" : "SHA-256" },
                    await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]),
                    { "name" : "AES-GCM", "length" : 256 }, false, ["decrypt"]
                );
                components = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ "name" : "AES-GCM", "iv" : saved["iv"] }, key, saved["data"]).catch(() => { throw new Error("Wrong master password"); })));
                return true;
            }
            
            async function clearComponents() {
                await new Promise((done, fail) => {
                    const req = indexedDB.deleteDatabase("toolkit");
                    req.onsuccess = () => done();
                    req.onblocked = () => done();
                    req.onerror = () => fail(req.error);
                });
                components = { "Home" : components["Home"] };
                master = "";
            }

            function textAreaTabFunctionality(txtArea) {
			    txtArea.addEventListener('keydown', function(e) {
			        if (e.key === 'Tab') {
			            e.preventDefault();
			            const start = this.selectionStart;
			            const end = this.selectionEnd;
			            const spaces = '    ';
			            this.value = this.value.substring(0, start) + spaces + this.value.substring(end);
			            this.selectionStart = this.selectionEnd = start + spaces.length;
			        }
			    });
			}
