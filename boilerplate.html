<!DOCTYPE html>
<html lang="en"><head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body style="margin:0px; padding:0px; font-family: 'Trebuchet MS', sans-serif;">

        <div id="page" style="width:100%; height:100dvh; overflow:auto;"></div>

        <script>
            const page = el("page");

            let components = {
			    "Home": {
			        "html": "<div id=\"menu\" style=\"width:300px; height:100%; position:fixed; top:0px; left:-301px; display:flex; flex-direction:column; background-color:#f7f8fa; border-right:solid #e3e6ea 1px; box-shadow:0 0 24px rgba(15,23,42,0.08); transition:left 0.3s cubic-bezier(0.4,0,0.2,1); box-sizing:border-box;\">\n    <div style=\"font-size:20px; font-weight:600; letter-spacing:0.02em; color:#0f172a; padding:22px 20px 16px 20px; border-bottom:solid #e3e6ea 1px;\">Toolkit</div>\n    <div id=\"menu-list\" style=\"flex:1; min-height:0; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:2px; box-sizing:border-box;\">\n        <input type=\"text\" placeholder=\"Search...\" style=\"width:100%; padding:9px 12px; font-size:14px; font-family:inherit; color:#0f172a; border:solid #d8dde4 1px; border-radius:6px; background-color:#ffffff; outline:none; margin-bottom:12px; box-sizing:border-box; box-shadow:0 1px 2px rgba(15,23,42,0.04);\">\n    </div>\n    <div id=\"menu-toggle\" style=\"width:34px; height:34px; background-color:#ffffff; border:solid #e3e6ea 1px; border-radius:8px; position:absolute; top:18px; right:-46px; cursor:pointer; box-shadow:0 2px 6px rgba(15,23,42,0.12); display:flex; align-items:center; justify-content:center; font-size:16px; color:#334155; line-height:1; transition:background-color 0.15s ease;\">☰</div>\n</div>",
			        "js": "if (!window.unlocked) {\n    if (await loadComponents()) {\n        while (true) {\n            const attempt = prompt(\"Enter master password:\");\n            if (attempt === null) return;\n            try {\n                await loadComponents(attempt);\n                window.password = attempt;\n                break;\n            } catch {\n                alert(\"Wrong password\");\n            }\n        }\n        window.unlocked = true;\n        page.innerHTML = \"\";\n        return addComponent(\"Home\", page);\n    }\n\n    const set = prompt(\"Set a master password:\");\n    if (set === null) return;\n    window.password = set;\n    await saveComponents(window.password);\n    window.unlocked = true;\n}\n\n\n\n\n\nwindow.editComponent = function(compName, keyEditing=\"html\") {\n    if (el(\"editingModal\")) el(\"editingModal\").remove();\n    let btns = \"\";\n    for (const key in components[compName]) {\n        btns += `<button onclick=\"components['${compName}']['${keyEditing}'] = el('txt').value; editComponent('${compName}', '${key}')\" style=\"padding:7px 16px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:500; letter-spacing:0.01em; border-radius:6px; border:solid ${(keyEditing == key) ? '#2563eb' : '#d8dde4'} 1px; background-color:${(keyEditing == key) ? '#2563eb' : '#ffffff'}; color:${(keyEditing == key) ? '#ffffff' : '#334155'}; box-shadow:0 1px 2px rgba(15,23,42,0.06); transition:background-color 0.15s ease;\">${key}</button>`;\n    }\n    page.insertAdjacentHTML(\"beforeend\", `\n        <div id=\"editingModal\" style=\"width:calc(100% - 100px); height:calc(100% - 100px); position:fixed; left:50px; top:50px; padding:18px; gap:14px; border:solid #e3e6ea 1px; border-radius:10px; box-shadow:0 12px 40px rgba(15,23,42,0.18); display:flex; flex-direction:column; background-color:#f7f8fa; box-sizing:border-box; z-index:200;\">\n            <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n                ${btns}\n            </div>\n            <textarea id=\"txt\" wrap=\"off\" spellcheck=\"false\" style=\"width:100%; flex:1; min-height:0; padding:14px; outline:none; border:solid #d8dde4 1px; border-radius:8px; resize:none; background-color:#ffffff; color:#0f172a; font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size:13px; line-height:1.6; box-sizing:border-box; box-shadow:inset 0 1px 2px rgba(15,23,42,0.04);\"></textarea>\n            <button id=\"saveButton\" style=\"align-self:flex-end; padding:9px 26px; cursor:pointer; font-family:inherit; font-size:14px; font-weight:600; letter-spacing:0.01em; border:none; border-radius:6px; background-color:#0f172a; color:#ffffff; box-shadow:0 2px 6px rgba(15,23,42,0.16);\">Save</button>\n        </div>\n    `);\n    const txt = el(\"txt\");\n    txt.value = components[compName][keyEditing];\n    el(\"saveButton\").onclick = async function() {\n        components[compName][keyEditing] = txt.value;\n        navigator.clipboard.writeText(JSON.stringify(components, null, 4));\n        await saveComponents(window.password);\n        el(\"editingModal\").remove();\n    };\n    textAreaTabFunctionality(txt);\n}\n\n\n\n\n\n\nel(\"menu-toggle\").onclick = function() {\n    el(\"menu\").style.left = (el(\"menu\").style.left == \"-301px\") ? \"0px\" : \"-301px\";\n}\n\n\n\npage.addEventListener(\"click\", (e) => {\n    if (el(\"contextMenu\")) el(\"contextMenu\").remove();\n})\n\n\n\n\nfor (const comp in components) {\n    const btn = document.createElement(\"div\");\n    btn.style.cssText = \"width:100%; padding:8px 12px; font-size:14px; color:#334155; border-radius:6px; cursor:pointer; box-sizing:border-box; transition:background-color 0.15s ease;\";\n    btn.innerHTML = comp;\n    btn.onclick = function() {page.innerHTML = \"\"; addComponent(comp, page);}\n    btn.onmouseenter = function() {this.style.backgroundColor = \"#e8ebef\"; this.style.color = \"#0f172a\";}\n    btn.onmouseleave = function() {this.style.backgroundColor = \"rgba(0,0,0,0)\"; this.style.color = \"#334155\";}\n    el(\"menu-list\").appendChild(btn);\n\n    const contextActions = {\n        \"Add to Home\": function() {\n            addComponent(comp, page);\n            el(\"menu-toggle\").click();\n        },\n        \"Edit\": function() {editComponent(comp);}\n    };\n    if (comp == \"Home\") delete contextActions[\"Add to Home\"];\n\n    customContext(btn, contextActions);\n \n}",
			        "category": "",
			        "icon": "&#127968;"
			    },
			    "Test Component 1": {
			        "html": "test1",
			        "js": "",
			        "category": "",
			        "icon": ""
			    },
			    "Test Component 2": {
			        "html": "test2",
			        "js": "",
			        "category": "",
			        "icon": ""
			    }
			}


            function el(id) {
                return document.getElementById(id);
            }

           async function addComponent(compName, target) {
            target.insertAdjacentHTML("beforeend", components[compName].html);
            const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
            await new AsyncFunction(components[compName].js)();
        }

            addComponent("Home", page);

            async function saveComponents(password) {
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await crypto.subtle.deriveKey(
                    { "name" : "PBKDF2", "salt" : salt, "iterations" : 600000, "hash" : "SHA-256" },
                    await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]),
                    { "name" : "AES-GCM", "length" : 256 }, false, ["encrypt"]
                );
                const data = await crypto.subtle.encrypt({ "name" : "AES-GCM", "iv" : iv }, key, new TextEncoder().encode(JSON.stringify(components)));
                const db = await new Promise((done, fail) => {
                    const req = indexedDB.open("toolkit", 1);
                    req.onupgradeneeded = () => req.result.createObjectStore("components");
                    req.onsuccess = () => done(req.result);
                    req.onerror = () => fail(req.error);
                });
                await new Promise((done, fail) => {
                    const req = db.transaction("components", "readwrite").objectStore("components").put({ "salt" : salt, "iv" : iv, "data" : data }, "components");
                    req.onsuccess = () => done();
                    req.onerror = () => fail(req.error);
                });
                db.close();
            }

            async function loadComponents(password) {
                const db = await new Promise((done, fail) => {
                    const req = indexedDB.open("toolkit", 1);
                    req.onupgradeneeded = () => req.result.createObjectStore("components");
                    req.onsuccess = () => done(req.result);
                    req.onerror = () => fail(req.error);
                });
                const saved = await new Promise((done, fail) => {
                    const req = db.transaction("components", "readonly").objectStore("components").get("components");
                    req.onsuccess = () => done(req.result);
                    req.onerror = () => fail(req.error);
                });
                db.close();
                if (!saved) return false;
                if (!password) return true; // No password just asks whether a vault exists yet.
                const key = await crypto.subtle.deriveKey(
                    { "name" : "PBKDF2", "salt" : saved["salt"], "iterations" : 600000, "hash" : "SHA-256" },
                    await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]),
                    { "name" : "AES-GCM", "length" : 256 }, false, ["decrypt"]
                );
                components = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ "name" : "AES-GCM", "iv" : saved["iv"] }, key, saved["data"]).catch(() => { throw new Error("Wrong master password"); })));
                return true;
            }

            async function clearComponents() {
                await new Promise((done, fail) => {
                    const req = indexedDB.deleteDatabase("toolkit");
                    req.onsuccess = () => done();
                    req.onblocked = () => done();
                    req.onerror = () => fail(req.error);
                });
                components = { "Home" : components["Home"] };
                master = "";
            }

			function customContext(target, actions={}) {
			    target.addEventListener("contextmenu", (e) => {
			        e.preventDefault();
			        if (el("contextMenu")) el("contextMenu").remove();
			        const ctx = document.createElement("div");
			        ctx.id = "contextMenu";
			        ctx.addEventListener("contextmenu", (ctxContext) => {ctxContext.preventDefault();})
			        const targetPos = target.getBoundingClientRect();
			        ctx.style.cssText = `min-width:160px; max-width:240px; border:solid #e3e6ea 1px; display:flex; flex-direction:column; gap:1px; padding:5px; background-color:#ffffff; border-radius:8px; box-shadow:0 8px 24px rgba(15,23,42,0.16), 0 2px 6px rgba(15,23,42,0.08); position:fixed; left:${e.clientX}px; top:${e.clientY}px; font-family:'Trebuchet MS', sans-serif;`;
			        for (const actionName in actions) {
			            const btn = document.createElement("div");
			            btn.innerHTML = actionName;
			            btn.onmouseenter = function() {this.style.backgroundColor = "#f1f3f6"}
			            btn.onmouseleave = function() {this.style.backgroundColor = "transparent"}
			            btn.style.cssText = "width:100%; text-align:left; padding:7px 10px; font-size:13px; color:#334155; border-radius:5px; background-color:transparent; cursor:pointer; box-sizing:border-box; user-select:none; transition:background-color 0.12s ease;";
			            ctx.appendChild(btn)
			            btn.onclick = function() {
			                el("contextMenu").remove();
			                actions[actionName]();
			            }
			        }
			        document.body.appendChild(ctx)
			    })
			}

            function textAreaTabFunctionality(txtArea) {
			    txtArea.addEventListener('keydown', function(e) {
			        if (e.key === 'Tab') {
			            e.preventDefault();
			            const start = this.selectionStart;
			            const end = this.selectionEnd;
			            const spaces = '    ';
			            this.value = this.value.substring(0, start) + spaces + this.value.substring(end);
			            this.selectionStart = this.selectionEnd = start + spaces.length;
			        }
			    });
			}
        </script>

</body></html>
