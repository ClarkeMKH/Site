<!DOCTYPE html>
<html lang="en"><head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body style="margin:0px; padding:0px; font-family: 'Trebuchet MS', sans-serif;">

        <div id="page" style="width:100%; height:100dvh; overflow:auto;"></div>

        <script>
            const page = el("page");

            let components = {
    "Home": {
        "html": "\n<div id=\"menu\" style=\"width:300px; height:100%; position:fixed; top:0px; left:-301px; display:flex; flex-direction:column; gap:5px; background-color:#dddddd; border-right:solid #222222 1px; transition:all 0.3s ease-in-out;\">\n    <div style=\"font-size:26px; margin:10px;\">Toolkit</div>\n    <div id=\"menu-list\" style=\"width:calc(100% - 20px); height:calc(100% - 20px); padding:10px; display:flex; flex-direction:column; gap:5px;\">\n        <input type=\"text\" placeholder=\"Search...\" style=\"width:calc(100% - 12px); padding:5px; font-size:22px; border:solid #000000 1px; border-radius:8px; background-color:#bbbbbb; outline:none; margin-bottom:10px;\"></input>\n    </div>\n    <div id=\"menu-toggle\" style=\"width:30px; height:30px; background-color:#dddddd; border:solid #222222 2px; border-radius:8px; position:absolute; top:10px; right:-45px; cursor:pointer; box-shadow:1px 1px 2px #000000;\"></div>\n</div>\n\n",
        "js": "if (!window.unlocked) {\n    if (await loadComponents()) {\n        while (true) {\n            const attempt = prompt(\"Enter master password:\");\n            if (attempt === null) return;\n            try {\n                await loadComponents(attempt);\n                window.password = attempt;\n                break;\n            } catch {\n                alert(\"Wrong password\");\n            }\n        }\n        window.unlocked = true;\n        page.innerHTML = \"\";\n        return addComponent(\"Home\", page);\n    }\n\n    const set = prompt(\"Set a master password:\");\n    if (set === null) return;\n    window.password = set;\n    await saveComponents(window.password);\n    window.unlocked = true;\n}\n\n\n\n\n\nwindow.editComponent = function(compName, keyEditing=\"html\") {\n    if (el(\"editingModal\")) el(\"editingModal\").remove();\n    let btns = \"\";\n    for (const key in components[compName]) {\n        btns += `<button onclick=\"components['${compName}']['${keyEditing}'] = el('txt').value; editComponent('${compName}', '${key}')\" style=\"padding:5px 20px; cursor:pointer; box-shadow:1px 1px 2px #000000; font-size:20px; border-radius:8px; ${(keyEditing == key) ? 'background-color:#8888ff;' : ''}\">${key}</button>`;\n    }\n    page.innerHTML += `\n        <div id=\"editingModal\" style=\"width:calc(100% - 100px); height:calc(100% - 100px); position:fixed; left:40px; top:40px; padding:5px; gap:5px; border:solid #000000 5px; border-radius:8px; box-shadow:1px 1px 2px #000000; display:flex; flex-direction:column; background-color:#dddddd;\">\n            <div style=\"display:flex; gap:10px;\">\n                ${btns}\n            </div>\n            <textarea id=\"txt\" wrap=\"off\" spellcheck=\"false\" style=\"width:calc(100% - 12px); height:calc(100% - 12px); padding:5px; outline:none; border:solid #000000 1px; resize:none; background-color:#eeeeee;\"></textarea>\n            <button id=\"saveButton\" style=\"padding:5px 20px; cursor:pointer; box-shadow:1px 1px 2px #000000; font-size:20px; border-radius:8px;\">Save</button>\n        </div>\n    `;\n    const txt = el(\"txt\");\n    txt.value = components[compName][keyEditing];\n    el(\"saveButton\").onclick = async function() {\n        components[compName][keyEditing] = txt.value;\n        navigator.clipboard.writeText(JSON.stringify(components, null, 4));\n        await saveComponents(window.password);\n        el(\"editingModal\").remove();\n    };\n    textAreaTabFunctionality(txt);\n}\n\n\n\n\n\n\nel(\"menu-toggle\").onclick = function() {\n    el(\"menu\").style.left = (el(\"menu\").style.left == \"-301px\") ? \"0px\" : \"-301px\";\n}\n\n\n\npage.addEventListener(\"click\", (e) => {\n    if (el(\"contextMenu\")) el(\"contextMenu\").remove();\n})\n\n\n\n\nfor (const comp in components) {\n    const btn = document.createElement(\"div\");\n    btn.style.cssText = \"width:calc(100% - 10px); padding:5px; font-size:22px; border-radius:4px; cursor:pointer;\";\n    btn.innerHTML = comp;\n    btn.onclick = function() {page.innerHTML = \"\"; addComponent(comp, page);}\n    btn.onmouseenter = function() {this.style.backgroundColor = \"#bbbbbb\"}\n    btn.onmouseleave = function() {this.style.backgroundColor = \"rgba(0,0,0,0)\"}\n    el(\"menu-list\").appendChild(btn);\n\n    const contextActions = {\n        \"Add to Home\": function() {\n            addComponent(comp, page);\n            el(\"menu-toggle\").click();\n        },\n        \"Edit\": function() {editComponent(comp);}\n    };\n    if (comp == \"Home\") delete contextActions[\"Add to Home\"];\n\n    customContext(btn, contextActions);\n \n}\n\n\n\n\n\n\n\n\n",
        "category": "",
        "icon": "&#127968;"
    },
    "Test Component 1": {
        "html": "test1",
        "js": "",
        "category": "",
        "icon": ""
    },
    "Test Component 2": {
        "html": "test2",
        "js": "",
        "category": "",
        "icon": ""
    }
}


            function el(id) {
                return document.getElementById(id);
            }

           async function addComponent(compName, target) {
            target.insertAdjacentHTML("beforeend", components[compName].html);
            const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
            await new AsyncFunction(components[compName].js)();
        }

            addComponent("Home", page);

            async function saveComponents(password) {
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await crypto.subtle.deriveKey(
                    { "name" : "PBKDF2", "salt" : salt, "iterations" : 600000, "hash" : "SHA-256" },
                    await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]),
                    { "name" : "AES-GCM", "length" : 256 }, false, ["encrypt"]
                );
                const data = await crypto.subtle.encrypt({ "name" : "AES-GCM", "iv" : iv }, key, new TextEncoder().encode(JSON.stringify(components)));
                const db = await new Promise((done, fail) => {
                    const req = indexedDB.open("toolkit", 1);
                    req.onupgradeneeded = () => req.result.createObjectStore("components");
                    req.onsuccess = () => done(req.result);
                    req.onerror = () => fail(req.error);
                });
                await new Promise((done, fail) => {
                    const req = db.transaction("components", "readwrite").objectStore("components").put({ "salt" : salt, "iv" : iv, "data" : data }, "components");
                    req.onsuccess = () => done();
                    req.onerror = () => fail(req.error);
                });
                db.close();
            }

            async function loadComponents(password) {
                const db = await new Promise((done, fail) => {
                    const req = indexedDB.open("toolkit", 1);
                    req.onupgradeneeded = () => req.result.createObjectStore("components");
                    req.onsuccess = () => done(req.result);
                    req.onerror = () => fail(req.error);
                });
                const saved = await new Promise((done, fail) => {
                    const req = db.transaction("components", "readonly").objectStore("components").get("components");
                    req.onsuccess = () => done(req.result);
                    req.onerror = () => fail(req.error);
                });
                db.close();
                if (!saved) return false;
                if (!password) return true; // No password just asks whether a vault exists yet.
                const key = await crypto.subtle.deriveKey(
                    { "name" : "PBKDF2", "salt" : saved["salt"], "iterations" : 600000, "hash" : "SHA-256" },
                    await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]),
                    { "name" : "AES-GCM", "length" : 256 }, false, ["decrypt"]
                );
                components = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ "name" : "AES-GCM", "iv" : saved["iv"] }, key, saved["data"]).catch(() => { throw new Error("Wrong master password"); })));
                return true;
            }

            async function clearComponents() {
                await new Promise((done, fail) => {
                    const req = indexedDB.deleteDatabase("toolkit");
                    req.onsuccess = () => done();
                    req.onblocked = () => done();
                    req.onerror = () => fail(req.error);
                });
                components = { "Home" : components["Home"] };
                master = "";
            }

            function customContext(target, actions={}) {
                target.addEventListener("contextmenu", (e) => {
                    e.preventDefault();
                    if (el("contextMenu")) el("contextMenu").remove();
                    const ctx = document.createElement("div");
                    ctx.id = "contextMenu";
                    ctx.addEventListener("contextmenu", (ctxContext) => {ctxContext.preventDefault();})
                    const targetPos = target.getBoundingClientRect();
                    ctx.style.cssText = `max-width:200px; min-height:20px; border:solid #000000 1px; display:flex; flex-direction:column; gap:5px; padding:5px; background-color:#dddddd; border-radius:4px; position:fixed; left:${e.clientX}px; top:${e.clientY}px;`;
                    for (const actionName in actions) {
                        const btn = document.createElement("div");
                        btn.innerHTML = actionName;
                        btn.onmouseenter = function() {this.style.backgroundColor = "#aaaaaa"}
                        btn.onmouseleave = function() {this.style.backgroundColor = "#dddddd"}
                        btn.style.cssText = "width:calc(100% - 20px); text-align:center; padding:5px 10px; border-radius:8px; background-color:#dddddd; cursor:pointer;";
                        ctx.appendChild(btn)
                        btn.onclick = function() {
                            el("contextMenu").remove();
                            actions[actionName]();
                        }
                    }
                    document.body.appendChild(ctx)
                })
            }

            function textAreaTabFunctionality(txtArea) {
			    txtArea.addEventListener('keydown', function(e) {
			        if (e.key === 'Tab') {
			            e.preventDefault();
			            const start = this.selectionStart;
			            const end = this.selectionEnd;
			            const spaces = '    ';
			            this.value = this.value.substring(0, start) + spaces + this.value.substring(end);
			            this.selectionStart = this.selectionEnd = start + spaces.length;
			        }
			    });
			}
        </script>

</body></html>
