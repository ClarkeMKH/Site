<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body style="margin:0px; padding:0px; font-family: 'Trebuchet MS', sans-serif;">

        <div id="root" style="width:100%; height:100dvh;"></div>

        <script src="https://raw.githubusercontent.com/ClarkeMKH/Site/refs/heads/main/Libraries/Tone.js"></script>

        <script>
            const root = document.getElementById("root");

            const tools = {
                "Primary Tools": {
                    "Picture": {
                        "html": "Test html",
                        "js": "Test JS",
                        "icon": ""
                    },
                    "Tool 2": {
                        "html": "Test 2",
                        "js": "",
                        "icon": ""
                    }
                },
                "Secondary Tools": {
                    "Picture1": {
                        "html": "Test html",
                        "js": "Test JS",
                        "icon": ""
                    },
                    "Tool 3": {
                        "html": "Test 2",
                        "js": "",
                        "icon": ""
                    }
                }
            }


            function editingTool() {
                root.innerHTML = `
                    <div style="width:calc(100% - 4px); height:calc(100% - 4px); display:flex; gap:2px; padding:2px; background:#1a1a1a; font-family:'Segoe UI', Roboto, Arial, sans-serif;">
                        <div id="toolList" style="min-width:280px; width:280px; max-width:280px; height:100%; display:flex; flex-direction:column; background:#232323; border-radius:10px; overflow-y:auto;"></div>
                        <div style="width:100%; height:100%; display:flex; flex-direction:column; gap:2px;">
                            <div style="width:100%; min-height:54px; height:54px; max-height:54px; display:flex; align-items:center; gap:6px; background:#232323; border-radius:10px; padding:0 14px;">
                                <div id="editing_html" onclick="type='html'; refreshText();" style="cursor:pointer; padding:9px 18px; border-radius:7px; font-size:14px; font-weight:600; color:#999999; transition:background 0.15s, color 0.15s;">HTML</div>
                                <div id="editing_js" onclick="type='js'; refreshText();" style="cursor:pointer; padding:9px 18px; border-radius:7px; font-size:14px; font-weight:600; color:#999999; transition:background 0.15s, color 0.15s;">JS</div>
                                <div id="editing_preview" style="margin-left:auto; padding:9px 18px; font-size:14px; font-weight:600; color:#666666; cursor:pointer;">Preview</div>
                            </div>
                            <div style="width:100%; height:100%; display:flex; border-radius:10px; overflow:hidden;">
                                <textarea id="txtArea" wrap="off" spellcheck="false" style="width:100%; height:100%; background:#1e1e1e; outline:none; border:0; color:#dddddd; font-size:15px; font-family:Consolas,'Courier New',monospace; padding:18px; resize:none; scrollbar-color:#555555 #1e1e1e; line-height:1.55; flex-shrink:1;"></textarea>
                                <div id="previewPane" style="display:none; width:100%; height:100%; flex-shrink:1;">
                                    <div style="display:flex; width:100%; height:100%;">
                                        <div style="min-width:1px; width:1px; background:#333333;"></div>
                                        <div style="width:100%; height:100%; background:#ffffff;">
                                            <iframe id="previewFrame" sandbox="allow-scripts" style="width:100%; height:100%; border:0;"></iframe>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                const txtArea = document.getElementById("txtArea");
                textAreaTabFunctionality(txtArea);

                const firstCategory = Object.keys(tools)[0];
                window.selectedCategory = firstCategory || null;
                window.selectedTool = firstCategory ? Object.keys(tools[firstCategory])[0] : null;
                window.type = 'html';
                window.previewOn = false;

                const escapeHtml = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
                const escapeAttr = s => String(s).replace(/"/g, '&quot;');

                txtArea.addEventListener('input', function() {
                    if (!selectedCategory || !selectedTool) return;
                    tools[selectedCategory][selectedTool][type] = txtArea.value;
                    updatePreview();
                });

                document.getElementById('editing_preview').onclick = function() { togglePreview(); };

                window.togglePreview = function() {
                    previewOn = !previewOn;
                    const pane = document.getElementById('previewPane');
                    const btn = document.getElementById('editing_preview');
                    pane.style.display = previewOn ? 'flex' : 'none';
                    btn.style.color = previewOn ? '#3b6fe0' : '#666666';
                    if (previewOn) updatePreview();
                };

                window.updatePreview = function() {
                    if (!previewOn || !selectedCategory || !selectedTool) return;
                    const t = tools[selectedCategory][selectedTool];
                    document.getElementById('previewFrame').srcdoc =
                        `<html><body>${t.html || ''}<script>${t.js || ''}<\/script></body></html>`;
                };

                window.refreshText = function() {
                    document.getElementById('editing_html').style.background = (type === 'html') ? '#3b6fe0' : 'transparent';
                    document.getElementById('editing_html').style.color = (type === 'html') ? '#ffffff' : '#999999';
                    document.getElementById('editing_js').style.background = (type === 'js') ? '#3b6fe0' : 'transparent';
                    document.getElementById('editing_js').style.color = (type === 'js') ? '#ffffff' : '#999999';

                    txtArea.value = (selectedCategory && selectedTool) ? tools[selectedCategory][selectedTool][type] : '';
                    updatePreview();
                };

                window.selectTool = function(cat, name) {
                    selectedCategory = cat;
                    selectedTool = name;
                    renderToolList();
                    refreshText();
                };

                window.renderToolList = function() {
                    const listEl = document.getElementById('toolList');
                    let html = `<div style="padding:18px 20px 12px 20px; color:#eeeeee; font-size:15px; font-weight:700; letter-spacing:0.6px; border-bottom:1px solid #333333; margin-bottom:8px;">TOOLS</div>`;

                    for (const cat in tools) {
                        html += `<div style="padding:10px 18px 4px 18px; color:#777777; font-size:11px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase;">${escapeHtml(cat)}</div>`;
                        for (const name in tools[cat]) {
                            const t = tools[cat][name];
                            const icon = t.icon || 'https://github.com/ClarkeMKH/Site/blob/main/Assets/image.png?raw=true';
                            const active = (cat === selectedCategory && name === selectedTool);
                            html += `<div class="toolRow" data-cat="${escapeAttr(cat)}" data-name="${escapeAttr(name)}"
                                style="display:flex; align-items:center; gap:10px; margin:0 8px 4px 8px; padding:9px 10px; border-radius:7px; cursor:pointer; color:${active ? '#ffffff' : '#bbbbbb'}; background:${active ? '#3b6fe0' : 'transparent'}; font-size:14px; transition:background 0.15s, color 0.15s;">
                                <img src="${icon}" style="width:18px; height:18px; border-radius:3px; object-fit:cover; opacity:0.9;">
                                <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(name)}</div>
                            </div>`;
                        }
                    }
                    listEl.innerHTML = html;

                    listEl.querySelectorAll('.toolRow').forEach(row => {
                        const isActive = () => row.dataset.cat === selectedCategory && row.dataset.name === selectedTool;
                        row.addEventListener('mouseenter', () => { if (!isActive()) row.style.background = '#2e2e2e'; });
                        row.addEventListener('mouseleave', () => { if (!isActive()) row.style.background = 'transparent'; });
                        row.addEventListener('click', () => selectTool(row.dataset.cat, row.dataset.name));
                        row.addEventListener('contextmenu', e => { e.preventDefault(); openToolModal(row.dataset.cat, row.dataset.name); });
                    });
                };

                window.openToolModal = function(cat, name) {
                    document.getElementById('toolModalOverlay')?.remove();
                    const t = tools[cat][name];

                    const overlay = document.createElement('div');
                    overlay.id = 'toolModalOverlay';
                    overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:1000; display:flex; align-items:center; justify-content:center; font-family:"Segoe UI", Roboto, Arial, sans-serif;';
                    overlay.innerHTML = `
                        <div style="width:340px; background:#232323; border-radius:12px; padding:22px; box-shadow:0 8px 30px rgba(0,0,0,0.5);">
                            <div style="color:#eeeeee; font-size:16px; font-weight:700; margin-bottom:16px;">Manage Tool</div>
                            <label style="display:block; color:#999999; font-size:11px; font-weight:700; letter-spacing:0.5px; margin-bottom:6px;">CATEGORY</label>
                            <input id="modalCategory" value="${escapeAttr(cat)}" style="width:100%; box-sizing:border-box; background:#1e1e1e; border:1px solid #333333; border-radius:6px; color:#dddddd; font-size:14px; padding:9px 10px; margin-bottom:14px; outline:none;">
                            <label style="display:block; color:#999999; font-size:11px; font-weight:700; letter-spacing:0.5px; margin-bottom:6px;">NAME</label>
                            <input id="modalName" value="${escapeAttr(name)}" style="width:100%; box-sizing:border-box; background:#1e1e1e; border:1px solid #333333; border-radius:6px; color:#dddddd; font-size:14px; padding:9px 10px; margin-bottom:14px; outline:none;">
                            <label style="display:block; color:#999999; font-size:11px; font-weight:700; letter-spacing:0.5px; margin-bottom:6px;">ICON URL</label>
                            <input id="modalIcon" value="${escapeAttr(t.icon || '')}" placeholder="https://..." style="width:100%; box-sizing:border-box; background:#1e1e1e; border:1px solid #333333; border-radius:6px; color:#dddddd; font-size:14px; padding:9px 10px; margin-bottom:18px; outline:none;">
                            <div style="display:flex; gap:8px; margin-bottom:8px;">
                                <button id="modalSave" style="flex:1; background:#3b6fe0; color:#fff; border:0; border-radius:7px; padding:10px 0; font-size:13px; font-weight:600; cursor:pointer;">Save Changes</button>
                                <button id="modalNew" style="flex:1; background:#2e2e2e; color:#dddddd; border:1px solid #444444; border-radius:7px; padding:10px 0; font-size:13px; font-weight:600; cursor:pointer;">New Tool</button>
                            </div>
                            <div style="display:flex; gap:8px;">
                                <button id="modalDelete" style="flex:1; background:#5a2323; color:#f5b5b5; border:0; border-radius:7px; padding:10px 0; font-size:13px; font-weight:600; cursor:pointer;">Delete</button>
                                <button id="modalCancel" style="flex:1; background:transparent; color:#999999; border:1px solid #444444; border-radius:7px; padding:10px 0; font-size:13px; font-weight:600; cursor:pointer;">Cancel</button>
                            </div>
                        </div>
                    `;
                    document.body.appendChild(overlay);
                    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
                    document.getElementById('modalCancel').onclick = () => overlay.remove();

                    document.getElementById('modalSave').onclick = () => {
                        const newCat = document.getElementById('modalCategory').value.trim() || cat;
                        const newName = document.getElementById('modalName').value.trim() || name;
                        const newIcon = document.getElementById('modalIcon').value.trim();
                        const toolData = tools[cat][name];
                        toolData.icon = newIcon;
                        delete tools[cat][name];
                        if (!tools[newCat]) tools[newCat] = {};
                        tools[newCat][newName] = toolData;
                        if (cat !== newCat && Object.keys(tools[cat]).length === 0) delete tools[cat];
                        selectTool(newCat, newName);
                        overlay.remove();
                    };

                    document.getElementById('modalNew').onclick = () => {
                        const newCat = document.getElementById('modalCategory').value.trim() || 'General';
                        const baseName = document.getElementById('modalName').value.trim() || 'New Tool';
                        const newIcon = document.getElementById('modalIcon').value.trim();
                        if (!tools[newCat]) tools[newCat] = {};
                        let finalName = baseName, i = 2;
                        while (tools[newCat][finalName]) { finalName = baseName + ' ' + i; i++; }
                        tools[newCat][finalName] = { html: '', js: '', icon: newIcon };
                        selectTool(newCat, finalName);
                        overlay.remove();
                    };

                    document.getElementById('modalDelete').onclick = () => {
                        delete tools[cat][name];
                        if (Object.keys(tools[cat]).length === 0) delete tools[cat];
                        const cats = Object.keys(tools);
                        const nextCat = cats[0] || null;
                        const nextName = nextCat ? Object.keys(tools[nextCat])[0] || null : null;
                        selectTool(nextCat, nextName);
                        overlay.remove();
                    };
                };

                renderToolList();
                refreshText();
            }
            editingTool();



















            function textAreaTabFunctionality(txtArea) {
			    txtArea.addEventListener('keydown', function(e) {
			        if (e.key === 'Tab') {
			            e.preventDefault();
			            const start = this.selectionStart;
			            const end = this.selectionEnd;
			            const spaces = '    ';
			            this.value = this.value.substring(0, start) + spaces + this.value.substring(end);
			            this.selectionStart = this.selectionEnd = start + spaces.length;
			        }
			    });
			}
        </script>
    </body>
</html>
