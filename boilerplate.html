                                "js": "/* ============================================================\n   HOME / BUILDER  —  16 functions, in dependency order:\n\n     mk        make an element\n     menu      context menu at the last pointer position\n     modal     full-screen dialog\n     fields    parse a SCHEMA string into field objects\n     props     a component's defaults, with overrides merged in\n     input     one labelled control (recurses for list rows)\n     slots     a wrapper's own data-slot elements\n     render    (re)run a placed component, keeping its children\n     add       put a new component on the page\n     save      write the page into components.Home.page\n     load      rebuild the page from components.Home.page\n     sidebar   draw the filters + component list\n     edit      settings dialog: schema fields + Custom CSS\n     coder     code dialog: HTML / JS / SCHEMA / CATEGORY / ICON\n     go        open a component full-page\n     acts      which menu items apply to what was clicked\n\n   Everything is mounted through addComponent(name, target,\n   props) -- render() for anything on the page, go() for a\n   full-page component. Anything on the page is stored in\n   components.Home.page.\n   ============================================================ */\n\nvar $ = document.getElementById.bind(document);\nvar WRAP_CSS = 'position:relative; box-sizing:border-box; ';\nvar IN_CSS = 'padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:13px; font-family:inherit; color:#333; background:#fff; box-sizing:border-box; width:100%; outline:none;';\nvar TOOL_CSS = 'padding:3px 8px; border:1px solid #ddd; border-radius:6px; background:#fff; color:#555; font-size:11px; font-family:inherit; cursor:pointer;';\nvar mouse = {x: 100, y: 100};\n\nfunction mk(tag, css, txt){\n    var e = document.createElement(tag);\n    if (css) e.style.cssText = css;\n    if (txt != null) e.textContent = txt;\n    return e;\n}\n\nfunction menu(items){\n    var m = document.body.appendChild(mk('div'));\n    var big = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);\n    m.id = 'context';\n    m.style.cssText = 'position:fixed; z-index:2000; padding:6px; background:#fff; border:1px solid rgba(35,40,48,.08); border-radius:10px; box-shadow:0 8px 28px rgba(35,40,48,.18); max-height:70vh; overflow:auto; user-select:none; -webkit-user-select:none; font-size:' + (big ? '15px' : '13px') + '; min-width:' + (big ? '210px' : '170px') + ';';\n    m.oncontextmenu = function(e){ e.preventDefault(); };\n    Object.keys(items).forEach(function(label){\n        var row = m.appendChild(mk('div', 'height:' + (big ? '44px' : '32px') + '; padding:0 14px; display:flex; align-items:center; border-radius:6px; cursor:pointer; color:#333; white-space:nowrap;', label));\n        row.onmouseenter = function(){ row.style.background = '#f0f0f2'; };\n        row.onmouseleave = function(){ row.style.background = ''; };\n        row.onclick = function(){ m.remove(); items[label](); };\n    });\n    m.style.left = Math.min(mouse.x, innerWidth - m.offsetWidth - 8) + 'px';\n    m.style.top = Math.min(mouse.y, innerHeight - m.offsetHeight - 8) + 'px';\n}\n\nfunction modal(title, body, buttons){\n    var back = document.body.appendChild(mk('div', 'position:fixed; inset:0; z-index:3000; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.45);'));\n    back.id = 'modal';\n    var box = back.appendChild(mk('div', 'width:92vw; height:90dvh; max-width:1100px; display:flex; flex-direction:column; background:#fff; border-radius:12px; overflow:hidden; font-family:inherit; font-size:14px; color:#333;'));\n    var head = box.appendChild(mk('div', 'display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid #eee;'));\n    head.appendChild(mk('h2', 'margin:0; font-size:16px;', title));\n    head.appendChild(mk('button', 'border:none; background:none; font-size:26px; line-height:1; color:#888; cursor:pointer;', '\\u00d7')).onclick = function(){ back.remove(); };\n    body.style.cssText += ' flex:1; min-height:0; overflow:auto; padding:16px 18px;';\n    box.appendChild(body);\n    var foot = box.appendChild(mk('div', 'display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid #eee;'));\n    var names = Object.keys(buttons);\n    names.forEach(function(label, i){\n        var main = i === names.length - 1;\n        foot.appendChild(mk('button', 'padding:9px 20px; border:none; border-radius:6px; cursor:pointer; font-family:inherit; font-size:14px; background:' + (main ? '#333' : '#f0f0f2') + '; color:' + (main ? '#fff' : '#333') + ';', label)).onclick = function(){\n            back.remove();\n            buttons[label]();\n        };\n    });\n}\n\n/* key|type|default|label|extra|hint\n   type   text  area  num  sel  bool  color  list\n   extra  sel  -> a,b,c\n          list -> key:type:label:default; key:type:label:default\n   a list default is an inline JSON array or a row count */\nfunction fields(spec){\n    return String(spec || '').split('\\n').filter(function(l){\n        return l.trim() && l.trim()[0] !== '#';\n    }).map(function(line){\n        var b = line.split('|');\n        var f = {key: b[0].trim(), type: (b[1] || 'text').trim(), val: b[2] || '', label: (b[3] || '').trim(), extra: (b[4] || '').trim(), hint: (b[5] || '').trim()};\n        f.label = f.label || f.key.replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/^./, function(c){ return c.toUpperCase(); });\n        if (f.type === 'num') f.val = parseFloat(f.val) || 0;\n        if (f.type === 'bool') f.val = f.val === '1' || f.val === 'true';\n        if (f.type === 'sel') f.opts = f.extra.split(',');\n        if (f.type === 'list') {\n            f.rows = f.extra.split(';').filter(Boolean).map(function(part){\n                var c = part.split(':');\n                var s = {key: c[0], type: c[1] || 'text', label: c[2] || c[0], val: c[3] || ''};\n                if (s.type === 'sel') { s.opts = String(s.val).split(','); s.val = s.opts[0]; }\n                if (s.type === 'bool') s.val = s.val === '1';\n                return s;\n            });\n            f.blank = function(){\n                var r = {};\n                f.rows.forEach(function(s){ r[s.key] = s.val; });\n                return r;\n            };\n            f.val = String(f.val).trim()[0] === '['\n                ? JSON.parse(f.val)\n                : Array.apply(null, {length: parseInt(f.val, 10) || 0}).map(f.blank);\n        }\n        return f;\n    });\n}\n\nfunction props(name, over){\n    var out = {};\n    fields(components[name].schema).forEach(function(f){ out[f.key] = f.val; });\n    Object.keys(over || {}).forEach(function(k){ out[k] = over[k]; });\n    return out;\n}\n\nfunction input(f, val, set){\n    var cell = mk('label', 'display:flex; flex-direction:column; gap:4px; font-size:12px; color:#666;');\n    cell.appendChild(mk('span', null, f.label));\n\n    if (f.type === 'list') {\n        cell.style.gridColumn = '1 / -1';\n        var box = cell.appendChild(mk('div', 'display:flex; flex-direction:column; gap:8px;'));\n        var draw = function(){\n            box.innerHTML = '';\n            val.forEach(function(row, i){\n                var card = box.appendChild(mk('div', 'border:1px solid #eee; border-radius:8px; padding:10px 12px; background:#fafafb; display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px;'));\n                var tools = card.appendChild(mk('div', 'grid-column:1 / -1; display:flex; gap:5px;'));\n                [['\\u2191', -1], ['\\u2193', 1], ['\\u2715', 0]].forEach(function(t){\n                    tools.appendChild(mk('button', TOOL_CSS, t[0])).onclick = function(){\n                        var j = i + t[1];\n                        if (!t[1]) val.splice(i, 1);\n                        else if (j >= 0 && j < val.length) val.splice(j, 0, val.splice(i, 1)[0]);\n                        draw();\n                        set(val);\n                    };\n                });\n                f.rows.forEach(function(s){\n                    card.appendChild(input(s, row[s.key], function(v){ row[s.key] = v; set(val); }));\n                });\n            });\n            box.appendChild(mk('button', 'align-self:flex-start; padding:7px 14px; border:1px dashed #bbb; border-radius:6px; background:#fff; color:#555; font-size:12px; font-family:inherit; cursor:pointer;', '+ Add')).onclick = function(){\n                val.push(f.blank());\n                draw();\n                set(val);\n            };\n        };\n        draw();\n        return cell;\n    }\n\n    var e;\n    if (f.type === 'area') {\n        e = mk('textarea', IN_CSS + ' min-height:76px; line-height:1.5; resize:vertical;');\n        cell.style.gridColumn = '1 / -1';\n    } else if (f.type === 'sel') {\n        e = mk('select', IN_CSS);\n        f.opts.forEach(function(o){ e.appendChild(mk('option', null, o)).value = o; });\n    } else if (f.type === 'bool') {\n        e = mk('input', 'width:16px; height:16px; margin:6px 0;');\n        e.type = 'checkbox';\n    } else {\n        e = mk('input', IN_CSS + (f.type === 'color' ? ' height:36px; padding:2px 4px;' : ''));\n        e.type = f.type === 'num' ? 'number' : f.type === 'color' ? 'color' : 'text';\n    }\n    if (f.type === 'bool') e.checked = !!val; else e.value = val;\n    e.spellcheck = false;\n    cell.appendChild(e);\n    if (f.hint) cell.appendChild(mk('span', 'font-size:11px; color:#aaa;', f.hint));\n    e.oninput = e.onchange = function(){\n        set(f.type === 'bool' ? e.checked : f.type === 'num' ? parseFloat(e.value) || 0 : e.value);\n    };\n    return cell;\n}\n\nfunction slots(wrap){\n    return [].filter.call(wrap.querySelectorAll('[data-slot]'), function(s){\n        return s.closest('[data-comp]') === wrap;\n    });\n}\n\nfunction render(wrap){\n    var name = wrap.dataset.comp;\n    var keep = slots(wrap).map(function(s){\n        return [].filter.call(s.children, function(c){ return c.dataset.comp; });\n    });\n    wrap.innerHTML = '';\n    wrap.style.cssText = WRAP_CSS + wrap.dataset.css;\n    addComponent(name, wrap, props(name, JSON.parse(wrap.dataset.props)));\n    var open = slots(wrap);\n    keep.forEach(function(kids, i){\n        kids.forEach(function(c){ (open[i] || open[0]).appendChild(c); });\n    });\n    wrap.appendChild(mk('div', 'position:absolute; top:0; right:0; z-index:5; padding:2px 8px; font-size:10px; letter-spacing:0.04em; text-transform:uppercase; color:#8a8a94; background:rgba(240,240,242,0.92); border-bottom-left-radius:6px; pointer-events:none; font-family:inherit;', name));\n    return wrap;\n}\n\nfunction add(name, into, over, css){\n    var wrap = into.appendChild(mk('div'));\n    wrap.dataset.comp = name;\n    wrap.dataset.props = JSON.stringify(over || {});\n    wrap.dataset.css = css || '';\n    render(wrap);\n    save();\n    return wrap;\n}\n\nfunction save(){\n    var kids = function(node){\n        return [].filter.call(node.children, function(c){ return c.dataset.comp; }).map(function(w){\n            var n = {comp: w.dataset.comp};\n            var over = JSON.parse(w.dataset.props);\n            if (Object.keys(over).length) n.props = over;\n            if (w.dataset.css) n.css = w.dataset.css;\n            var nested = slots(w).map(kids);\n            if (nested.some(function(a){ return a.length; })) n.slots = nested;\n            return n;\n        });\n    };\n    var cp = $('contentsPage');\n    components.Home.page = kids(cp);\n    [].forEach.call(cp.querySelectorAll('[data-slot]'), function(s){\n        var bare = !s.querySelector('[data-comp]');\n        s.style.outline = bare ? '1px dashed #c9c9d2' : '';\n        s.style.outlineOffset = '-2px';\n        if (bare) s.style.minHeight = '70px';\n    });\n    $('empty').style.display = cp.querySelector('[data-comp]') ? 'none' : 'flex';\n}\n\nfunction load(list me){\n    var comp = components[name];\n    var keys = Object.keys(comp);\n    var draft = {};\n    var tabs = {};\n    var mode = keys[0];\n    keys.forEach(function(k){\n        draft[k] = typeof comp[k] === 'string' ? comp[k] : JSON.stringify(comp[k], null, 4);\n    });\n\n    var body = mk('div', 'display:flex; flex-direction:column; height:100%; gap:10px;');\n    var bar = body.appendChild(mk('div', 'display:flex; gap:6px; flex-wrap:wrap;'));\n    var ta = body.appendChild(mk('textarea', 'flex:1; min-height:300px; width:100%; box-sizing:border-box; padding:12px; border:1px solid #ddd; border-radius:8px; font-family:monospace; font-size:13px; line-height:1.5; white-space:pre; resize:none; outline:none;'));\n    ta.spellcheck = false;\n    textAreaTabFunctionality(ta);\n    var paint = function(){\n        ta.value = draft[mode];\n        keys.forEach(function(k){\n            tabs[k].style.background = k === mode ? '#333' : '#f0f0f2';\n            tabs[k].style.color = k === mode ? '#fff' : '#333';\n        });\n    };\n    keys.forEach(function(k){\n        tabs[k] = bar.appendChild(mk('button', 'padding:8px 18px; border:none; border-radius:6px; cursor:pointer; font-family:inherit; font-size:13px;', k.toUpperCase()));\n        tabs[k].onclick = function(){ draft[mode] = ta.value; mode = k; paint(); };\n    });\n    paint();\n\n    modal('Code: ' + name, body, {\n        Cancel: function(){},\n        Save: function(){\n            draft[mode] = ta.value;\n            keys.forEach(function(k){\n                comp[k] = typeof comp[k] === 'string' ? draft[k] : JSON.parse(draft[k]);\n            });\n            sidebar();\n            if (name === 'Home') go('Home');\n            else [].forEach.call($('contentsPage').querySelectorAll('[data-comp=\"' + name + '\"]'), function(w){ render(w); });\n        }\n    });\n}\n\nfunction go(name){\n    $('page').innerHTML = '';\n    addComponent(name, $('page'), props(name));\n    if (name !== 'Home') {\n        $('page'             function addComponent(compName, target, props) {
                const c = components[compName];
                const p = props || {};
                window.__mountEl = target;
                window.__mountProps = p;
                if (c.html) target.innerHTML += c.html.replace(/\{\{\s*([\w.$-]+)\s*\}\}/g, (m, key) => p[key] == null ? "" : p[key]);
                if (c.js) (new Function(c.js))();
            }

            addComponent("Home", page);


            async function saveComponents(password) {
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await crypto.subtle.deriveKey(
                    { "name" : "PBKDF2", "salt" : salt, "iterations" : 600000, "hash" : "SHA-256" },
                    await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]),
                    { "name" : "AES-GCM", "length" : 256 }, false, ["encrypt"]
                );
                const data = await crypto.subtle.encrypt({ "name" : "AES-GCM", "iv" : iv }, key, new TextEncoder().encode(JSON.stringify(components)));
                const db = await new Promise((done, fail) => {
                    const req = indexedDB.open("toolkit", 1);
                    req.onupgradeneeded = () => req.result.createObjectStore("components");
                    req.onsuccess = () => done(req.result);
                    req.onerror = () => fail(req.error);
                });
                await new Promise((done, fail) => {
                    const req = db.transaction("components", "readwrite").objectStore("components").put({ "salt" : salt, "iv" : iv, "data" : data }, "components");
                    req.onsuccess = () => done();
                    req.onerror = () => fail(req.error);
                });
                db.close();
            }

            async function loadComponents(password) {
                const db = await new Promise((done, fail) => {
                    const req = indexedDB.open("toolkit", 1);
                    req.onupgradeneeded = () => req.result.createObjectStore("components");
                    req.onsuccess = () => done(req.result);
                    req.onerror = () => fail(req.error);
                });
                const saved = await new Promise((done, fail) => {
                    const req = db.transaction("components", "readonly").objectStore("components").get("components");
                    req.onsuccess = () => done(req.result);
                    req.onerror = () => fail(req.error);
                });
                db.close();
                if (!saved) return false;
                if (!password) return true; // No password just asks whether a vault exists yet.
                const key = await crypto.subtle.deriveKey(
                    { "name" : "PBKDF2", "salt" : saved["salt"], "iterations" : 600000, "hash" : "SHA-256" },
                    await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]),
                    { "name" : "AES-GCM", "length" : 256 }, false, ["decrypt"]
                );
                components = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ "name" : "AES-GCM", "iv" : saved["iv"] }, key, saved["data"])));
                return true;
            }

            async function clearComponents() {
                await new Promise((done, fail) => {
                    const req = indexedDB.deleteDatabase("toolkit");
                    req.onsuccess = () => done();
                    req.onblocked = () => done();
                    req.onerror = () => fail(req.error);
                });
                components = { "Home" : components["Home"] };
                master = "";
            }

            function textAreaTabFunctionality(txtArea) {
                txtArea.addEventListener('keydown', function (e) {
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        const start = this.selectionStart;
                        const end = this.selectionEnd;
                        const spaces = '    ';
                        this.value = this.value.substring(0, start) + spaces + this.value.substring(end);
                        this.selectionStart = this.selectionEnd = start + spaces.length;
                    }
                });
