<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nimbus — offline workspace</title>
<style>
:root{
  --bg:#101219; --bg2:#161926; --panel:#1a1e2d; --panel2:#20253a;
  --line:#2a3048; --line2:#39415f;
  --fg:#ccd2e6; --fg2:#8d95b0; --fg3:#5f6885;
  --accent:#8d93ff; --accent2:#a9adff; --amber:#f0b45c; --mint:#5fd0a8;
  --red:#f0637a; --blue:#63a8f0;
  --lh:20px; --fs:13px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  --r:7px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--bg); color:var(--fg); font-family:var(--ui); font-size:13px;
  -webkit-font-smoothing:antialiased; user-select:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2f3650;border:3px solid transparent;background-clip:content-box;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#3f4970;background-clip:content-box}

/* ─── shell ─────────────────────────────────────────── */
#shell{display:flex;flex-direction:column;height:100%}
#topbar{
  height:38px;flex:0 0 38px;display:flex;align-items:center;gap:2px;
  padding:0 8px 0 12px;background:var(--bg2);border-bottom:1px solid var(--line);
}
.brand{
  font-weight:620;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;
  color:var(--fg2);margin-right:14px;white-space:nowrap;
}
.brand b{color:var(--accent);font-weight:620}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:2px;gap:2px}
.seg button{
  padding:4px 11px;border-radius:5px;font-size:11.5px;color:var(--fg2);
  letter-spacing:.02em;transition:background .12s,color .12s;
}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--panel2);color:var(--accent2);box-shadow:0 1px 0 #0004}
.spacer{flex:1}
.tbtn{
  display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:6px;
  color:var(--fg2);font-size:11.5px;
}
.tbtn:hover{background:var(--panel);color:var(--fg)}
.tbtn svg{width:14px;height:14px}
#fsBadge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);padding-right:6px}
#fsBadge b{color:var(--mint);font-weight:600}

#stage{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:flex}

/* ─── edit view ─────────────────────────────────────── */
#sidebar{
  width:274px;flex:0 0 274px;min-width:150px;max-width:60%;
  background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
.sbhead{
  height:30px;flex:0 0 30px;display:flex;align-items:center;gap:4px;padding:0 6px 0 12px;
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--fg3);
}
.sbhead .spacer{flex:1}
.ibtn{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--fg2)}
.ibtn:hover{background:var(--panel2);color:var(--fg)}
.ibtn svg{width:13px;height:13px}
#tree{flex:1;overflow:auto;padding:2px 0 40px}
#tree.dragover-root{background:#8d93ff0d;box-shadow:inset 0 0 0 1px var(--accent) }

.row{
  display:flex;align-items:center;gap:6px;height:23px;padding-right:8px;
  cursor:default;position:relative;white-space:nowrap;
}
.row:hover{background:#ffffff08}
.row.sel{background:#8d93ff26}
.row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.row.cut{opacity:.45}
.row.drop{background:#8d93ff2e;box-shadow:inset 0 0 0 1px var(--accent)}
.row .tw{width:14px;flex:0 0 14px;display:grid;place-items:center;color:var(--fg3)}
.row .tw svg{width:9px;height:9px;transition:transform .13s}
.row.open .tw svg{transform:rotate(90deg)}
.row .ic{width:15px;flex:0 0 15px;display:grid;place-items:center;color:var(--fg2)}
.row .ic svg{width:14px;height:14px}
.row .nm{overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.row.app .ic{color:var(--amber)}
.row.app .nm{color:#f6d9ab}
.pill{
  font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--amber);
  border:1px solid #f0b45c55;border-radius:99px;padding:0 5px;line-height:13px;flex:0 0 auto;
}
.row .ren{
  background:var(--bg);border:1px solid var(--accent);border-radius:3px;
  padding:0 4px;height:19px;width:100%;min-width:40px;user-select:text;
}
.empty{padding:22px 16px;color:var(--fg3);font-size:12px;line-height:1.7}
.empty b{color:var(--fg2);font-weight:500}

#gutterDrag{width:4px;flex:0 0 4px;margin-left:-4px;cursor:col-resize;z-index:5;background:transparent}
#gutterDrag:hover,#gutterDrag.act{background:var(--accent)}

#main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#tabs{
  height:31px;flex:0 0 31px;display:flex;align-items:stretch;background:var(--bg2);
  border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;
}
#tabs::-webkit-scrollbar{height:0}
.tab{
  display:flex;align-items:center;gap:7px;padding:0 8px 0 11px;font-size:12px;
  color:var(--fg2);border-right:1px solid var(--line);white-space:nowrap;cursor:default;
  position:relative;max-width:220px;
}
.tab:hover{background:#ffffff06}
.tab.on{background:var(--bg);color:var(--fg)}
.tab.on::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--accent)}
.tab .ic svg{width:13px;height:13px;display:block}
.tab .tt{overflow:hidden;text-overflow:ellipsis}
.tab .x{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;opacity:.5;flex:0 0 16px}
.tab .x:hover{background:#ffffff18;opacity:1}
.tab .x svg{width:8px;height:8px}
.tab.dirty .x::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--accent);position:absolute}
.tab.dirty:hover .x::before{display:none}
#panes{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:none;flex-direction:column}
.pane.on{display:flex}

#welcome{align-items:center;justify-content:center;text-align:center;color:var(--fg3);gap:6px}
#welcome .big{font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:#2c3450;font-weight:600}
#welcome .kb{font-size:12px;line-height:2}
kbd{
  font-family:var(--mono);font-size:10.5px;background:var(--panel);border:1px solid var(--line2);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--fg2);
}

/* ─── editor ────────────────────────────────────────── */
.ebar{
  height:28px;flex:0 0 28px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;
  border-bottom:1px solid var(--line);background:var(--bg2);font-size:11px;color:var(--fg3);
}
.ebar .sep{width:1px;height:14px;background:var(--line)}
.ebar button{padding:3px 7px;border-radius:5px;color:var(--fg2);font-size:11px}
.ebar button:hover{background:var(--panel2);color:var(--fg)}
.ebar button.on{color:var(--accent2);background:#8d93ff1f}
.ebar .mono{font-family:var(--mono)}
.ed{flex:1;min-height:0;display:flex;position:relative;overflow:hidden;background:var(--bg)}
.ednums{
  flex:0 0 auto;min-width:46px;padding:10px 10px 200px 8px;text-align:right;
  font:var(--fs)/var(--lh) var(--mono);color:#414a6b;background:var(--bg);
  border-right:1px solid var(--line);overflow:hidden;position:relative;z-index:2;
}
.ednums div{white-space:pre}
.ednums div.cur{color:var(--accent2)}
.edwrap{flex:1;min-width:0;position:relative;overflow:auto}
.edhl,.edta{
  margin:0;padding:10px 22px 200px 12px;font:var(--fs)/var(--lh) var(--mono);
  white-space:pre;tab-size:4;border:0;letter-spacing:0;
}
.edhl{position:absolute;inset:0;pointer-events:none;z-index:1;color:var(--fg);min-height:100%}
.edta{
  position:relative;z-index:2;display:block;width:100%;min-height:100%;
  background:transparent;color:transparent;caret-color:var(--accent2);resize:none;
  overflow:hidden;outline:0;user-select:text;
}
.edta::selection{background:#8d93ff40}
.wrapon .edhl,.wrapon .edta{white-space:pre-wrap;word-break:break-word}
.cl{min-height:var(--lh)}
.cl.cur{background:#ffffff07;box-shadow:inset 2px 0 0 #8d93ff3d}
.edstat{
  height:22px;flex:0 0 22px;display:flex;align-items:center;gap:14px;padding:0 12px;
  border-top:1px solid var(--line);background:var(--bg2);font-size:10.5px;color:var(--fg3);
  font-family:var(--mono);
}
.edstat .spacer{flex:1}
.edstat b{color:var(--fg2);font-weight:500}

/* syntax */
.t-com{color:#5c6688;font-style:italic}
.t-str{color:#8fd6a0}
.t-num{color:#e5a56a}
.t-kw{color:#a58bff}
.t-kw2{color:#f0637a}
.t-fn{color:#63b6f0}
.t-op{color:#8d95b0}
.t-tag{color:#f0637a}
.t-attr{color:#e5a56a}
.t-sel{color:#f0b45c}
.t-prop{color:#63b6f0}
.t-val{color:#8fd6a0}
.t-at{color:#a58bff}
.t-punc{color:#6f7899}

/* find bar */
.find{
  position:absolute;top:6px;right:20px;z-index:9;display:none;gap:5px;align-items:center;
  background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);
  padding:6px;box-shadow:0 10px 30px #0007;
}
.find.on{display:flex}
.find input{
  background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 7px;
  width:132px;font-family:var(--mono);font-size:11.5px;user-select:text;
}
.find input:focus{border-color:var(--accent);outline:0}
.find button{padding:4px 8px;border-radius:5px;background:var(--panel2);font-size:11px;color:var(--fg2)}
.find button:hover{background:var(--line2);color:var(--fg)}
.find .cnt{font-family:var(--mono);font-size:10.5px;color:var(--fg3);min-width:52px;text-align:center}

/* ─── console / preview panes ───────────────────────── */
.paneHead{
  height:28px;flex:0 0 28px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;
  background:var(--bg2);border-bottom:1px solid var(--line);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);
}
.paneHead .spacer{flex:1}
.paneHead button{padding:3px 8px;border-radius:5px;font-size:11px;letter-spacing:0;text-transform:none;color:var(--fg2)}
.paneHead button:hover{background:var(--panel2);color:var(--fg)}
.con{flex:1;overflow:auto;padding:6px 0;font-family:var(--mono);font-size:12px;user-select:text}
.cline{padding:2px 12px 2px 26px;position:relative;white-space:pre-wrap;word-break:break-word;line-height:1.55;border-bottom:1px solid #ffffff07}
.cline::before{position:absolute;left:10px;color:var(--fg3);font-size:10px;top:3px}
.cline.log::before{content:"›"}
.cline.err{color:#ffb3bf;background:#f0637a12}
.cline.err::before{content:"✕";color:var(--red)}
.cline.warn{color:#f5d6a8;background:#f0b45c10}
.cline.warn::before{content:"!";color:var(--amber)}
.cline.info{color:#a8d4f5}
.cline.info::before{content:"i";color:var(--blue)}
.cline.ret{color:var(--mint)}
.cline.ret::before{content:"«";color:var(--mint)}
.cline.sys{color:var(--fg3);font-style:italic}
.conin{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:0 12px;height:30px;flex:0 0 30px;background:var(--bg2)}
.conin span{color:var(--accent);font-family:var(--mono)}
.conin input{flex:1;background:none;border:0;outline:0;font-family:var(--mono);font-size:12px;user-select:text}
.frame{flex:1;border:0;width:100%;background:#fff}

/* ─── media editors ─────────────────────────────────── */
.media{flex:1;min-height:0;display:flex;flex-direction:column;background:#0c0e15}
.mstage{flex:1;min-height:0;display:grid;place-items:center;padding:18px;overflow:auto;position:relative}
.mstage canvas,.mstage video,.mstage img{
  max-width:100%;max-height:100%;
  background:conic-gradient(#1b1f2e 25%,#161926 0 50%,#1b1f2e 0 75%,#161926 0) 0 0/18px 18px;
  box-shadow:0 12px 44px #000a;border-radius:3px;
}
.mtools{
  flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg2);
  padding:9px 12px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;
}
.grp{display:flex;align-items:center;gap:6px}
.grp>label{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg3)}
.mbtn{padding:4px 9px;border-radius:5px;background:var(--panel);border:1px solid var(--line);font-size:11.5px;color:var(--fg2)}
.mbtn:hover{background:var(--panel2);color:var(--fg);border-color:var(--line2)}
.mbtn.pri{background:#8d93ff1f;border-color:#8d93ff66;color:var(--accent2)}
.mbtn.pri:hover{background:#8d93ff33}
input[type=range]{-webkit-appearance:none;appearance:none;height:3px;background:var(--line2);border-radius:9px;width:96px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:99px;background:var(--accent);cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:99px;background:var(--accent);cursor:pointer}
.num{font-family:var(--mono);font-size:10.5px;color:var(--fg3);min-width:34px}
#wave{width:100%;height:118px;display:block;border-radius:4px;background:#0c0e15;cursor:crosshair}
.wavewrap{padding:14px;position:relative}

/* ─── context menu ──────────────────────────────────── */
#ctx{
  position:fixed;z-index:200;min-width:206px;background:var(--panel);
  border:1px solid var(--line2);border-radius:9px;padding:5px;display:none;
  box-shadow:0 18px 52px #000b,0 0 0 1px #0006;
}
#ctx.on{display:block}
.mi{
  display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:5px;
  font-size:12.5px;color:var(--fg);width:100%;text-align:left;
}
.mi:hover{background:#8d93ff2b}
.mi .ic{width:14px;flex:0 0 14px;color:var(--fg2);display:grid;place-items:center}
.mi:hover .ic{color:var(--accent2)}
.mi .ic svg{width:13.5px;height:13.5px}
.mi .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--fg3)}
.mi.danger{color:#ffa8b5}
.mi.danger:hover{background:#f0637a26}
.mi.danger .ic{color:var(--red)}
.msep{height:1px;background:var(--line);margin:5px 7px}
.mlbl{padding:6px 9px 3px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}

/* ─── modal ─────────────────────────────────────────── */
#scrim{
  position:fixed;inset:0;z-index:300;background:#05070ccc;backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:24px;
}
#scrim.on{display:flex}
.modal{
  width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--panel);
  border:1px solid var(--line2);border-radius:13px;box-shadow:0 30px 90px #000c;
}
.modal.wide{width:min(760px,100%)}
.mhead{
  padding:16px 20px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:10px;
}
.mhead h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.01em}
.mhead p{margin:0;font-size:11.5px;color:var(--fg3)}
.mbody{padding:16px 20px}
.mfoot{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end}
.btn{padding:7px 14px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);font-size:12.5px}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#0d1020;font-weight:600}
.btn.pri:hover{background:var(--accent2)}
.btn.danger{background:#f0637a;border-color:#f0637a;color:#2a0710;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg3)}
.field input[type=text],.field input[type=password],.field select{
  background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;
  font-size:13px;user-select:text;width:100%;
}
.field input:focus,.field select:focus{border-color:var(--accent);outline:0}
.hint{font-size:11px;color:var(--fg3);line-height:1.6}

.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .txt{flex:1}
.srow .txt b{display:block;font-size:12.5px;font-weight:500;margin-bottom:2px}
.srow .txt span{font-size:11px;color:var(--fg3);line-height:1.5}
.sw{width:38px;height:21px;border-radius:99px;background:var(--line2);position:relative;flex:0 0 38px;transition:background .15s}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:99px;background:#c3cade;transition:transform .15s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(17px);background:#fff}
.stepper{display:flex;align-items:center;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.stepper button{width:26px;height:26px;background:var(--panel2)}
.stepper button:hover{background:var(--line2)}
.stepper span{width:34px;text-align:center;font-family:var(--mono);font-size:12px}
.sectlbl{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--fg3);margin:18px 0 4px}
.sectlbl:first-child{margin-top:0}

.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:7px}
.icopt{
  aspect-ratio:1;display:grid;place-items:center;border-radius:11px;background:var(--bg);
  border:1px solid var(--line);color:var(--fg2);
}
.icopt:hover{border-color:var(--line2);color:var(--fg);background:var(--panel2)}
.icopt.sel{border-color:var(--accent);background:#8d93ff1f;color:var(--accent2);box-shadow:0 0 0 1px var(--accent)}
.icopt svg{width:25px;height:25px}

/* ─── grid + taskbar views ──────────────────────────── */
.deskbg{
  position:absolute;inset:0;
  background:
    radial-gradient(1100px 620px at 78% -12%,#252b4a 0%,transparent 62%),
    radial-gradient(820px 520px at 8% 108%,#1c2b3e 0%,transparent 60%),
    linear-gradient(#0d0f17,#12141d);
}
.deskbg::after{
  content:"";position:absolute;inset:0;opacity:.4;
  background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);
  background-size:46px 46px;mask-image:radial-gradient(circle at 50% 42%,#000 5%,transparent 78%);
}
#gridView,#barView{flex-direction:column;position:relative}
.deskhead{position:relative;padding:52px 46px 10px;pointer-events:none}
.clock{font-size:52px;font-weight:200;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:#e6eafa;line-height:1}
.cdate{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#6f7899;margin-top:9px}
.appwrap{position:relative;flex:1;min-height:0;overflow:auto;padding:16px 40px 46px}
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;max-width:1080px}
.appcell{
  padding:16px 8px 13px;border-radius:15px;display:flex;flex-direction:column;
  align-items:center;gap:11px;color:#c3cade;transition:background .13s,transform .13s;
}
.appcell:hover{background:#ffffff0e}
.appcell:active{transform:scale(.955)}
.appcell .box{
  width:60px;height:60px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(160deg,#333c62,#222842);
  border:1px solid #ffffff17;box-shadow:0 9px 22px #0007,inset 0 1px 0 #ffffff1f;
}
.appcell .box svg{width:30px;height:30px;color:#dbe0f5}
.appcell .lb{font-size:11.5px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.noapps{
  position:relative;margin:6px 0 0;padding:30px;border:1px dashed var(--line2);border-radius:13px;
  color:var(--fg3);font-size:12.5px;line-height:1.8;max-width:520px;
}

  radio:'M12 15a3 3 0 100-6 3 3 0 000 6zM6.5 6.5a8 8 0 000 11M17.5 6.5a8 8 0 010 11M3.5 3.5a12 12 0 000 17M20.5 3.5a12 12 0 010 17',

function svg(d,cls){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"${cls?` class="${cls}"`:''}><path d="${d}"/></svg>`;}
function ico(n){return svg(P[n]||P.file);}
function appIco(n){return svg(APPICONS[n]||APPICONS.grid);}
// hydrate <svg data-i="...">
function hydrateIcons(root){
  (root||document).querySelectorAll('svg[data-i]').forEach(el=>{
    const d=P[el.dataset.i]; if(!d) return;
    el.setAttribute('viewBox','0 0 24 24'); el.setAttribute('fill','none');
    el.setAttribute('stroke','currentColor'); el.setAttribute('stroke-width','1.7');
    el.setAttribute('stroke-linecap','round'); el.setAttribute('stroke-linejoin','round');
    el.innerHTML=`<path d="${d}"/>`; el.removeAttribute('data-i');
  });
}

/* ── 2. helpers ──────────────────────────────────────────────── */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const escAttr=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ext=n=>{const i=n.lastIndexOf('.');return i<1?'':n.slice(i+1).toLowerCase();};
const bytes=n=>{if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB';};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const TEXT_EXT='txt md markdown js mjs cjs jsx ts tsx json jsonc html htm xml svg css scss less csv tsv log yml yaml ini cfg conf env sh bash py rb go rs c h cpp java php sql toml gitignore srt vtt'.split(' ');
const IMG_EXT='png jpg jpeg gif webp bmp avif ico'.split(' ');
const AUD_EXT='mp3 wav ogg m4a flac aac opus weba'.split(' ');
const VID_EXT='mp4 webm ogv mov m4v mkv'.split(' ');
function kindOf(name){
  const e=ext(name);
  if(IMG_EXT.includes(e))return e==='svg'?'text':'image';
  if(AUD_EXT.includes(e))return 'audio';
  if(VID_EXT.includes(e))return 'video';
  if(e==='pdf')return 'pdf';
  if(TEXT_EXT.includes(e)||!e)return 'text';
  return 'bin';
}
function langOf(name){
  const e=ext(name);
  if(['js','mjs','cjs','jsx','ts','tsx','json','jsonc'].includes(e))return 'js';
  if(['css','scss','less'].includes(e))return 'css';
  if(['html','htm','xml','svg','vue'].includes(e))return 'html';
  return 'plain';
}
function mimeOf(name){
  const e=ext(name),m={
    html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',mjs:'text/javascript',
    json:'application/json',svg:'image/svg+xml',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',
    gif:'image/gif',webp:'image/webp',avif:'image/avif',ico:'image/x-icon',bmp:'image/bmp',
    mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',m4a:'audio/mp4',flac:'audio/flac',opus:'audio/opus',
    mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime',
    txt:'text/plain',md:'text/markdown',csv:'text/csv',xml:'application/xml',pdf:'application/pdf',
    wasm:'application/wasm',ttf:'font/ttf',woff:'font/woff',woff2:'font/woff2',
  };
  return m[e]||'application/octet-stream';
}

function toast(msg,type='ok',ms=2600){
  const el=document.createElement('div');
  el.className='toast '+type;
  el.innerHTML=svg(P[type==='ok'?'ok':type==='err'?'alert':'info'])+`<span>${escAttr(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .25s,transform .25s';el.style.opacity='0';el.style.transform='translateY(6px)';setTimeout(()=>el.remove(),260);},ms);
}

/* ── 3. cache: IndexedDB + optional AES-GCM ──────────────────── */
const DB_NAME='nimbus', STORE='kv';
let _dbp=null;
function db(){
  if(_dbp) return _dbp;
  _dbp=new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE);};
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
  return _dbp;
}
function tx(mode,fn){
  return db().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(STORE,mode), s=t.objectStore(STORE);
    let out; const rq=fn(s);
    if(rq) rq.onsuccess=()=>{out=rq.result;};
    t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  }));
}

const _keyCache=new Map();
async function deriveKey(pass,salt){
  const ck=pass+':'+[...salt].join(',');
  if(_keyCache.has(ck)) return _keyCache.get(ck);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  _keyCache.set(ck,key); return key;
}
/* serialise anything (incl. Blob) to bytes for encryption */
async function pack(v){
  if(v instanceof Blob){
    const b=new Uint8Array(await v.arrayBuffer());
    const head=new TextEncoder().encode(JSON.stringify({__blob:1,type:v.type}));
    const out=new Uint8Array(4+head.length+b.length); const dv=new DataView(out.buffer);
    dv.setUint32(0,head.length); out.set(head,4); out.set(b,4+head.length); return out;
  }
  const head=new TextEncoder().encode(JSON.stringify({__json:1}));
  const body=new TextEncoder().encode(JSON.stringify(v===undefined?null:v));
  const out=new Uint8Array(4+head.length+body.length); const dv=new DataView(out.buffer);
  dv.setUint32(0,head.length); out.set(head,4); out.set(body,4+head.length); return out;
}
function unpack(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  const hl=dv.getUint32(0);
  const head=JSON.parse(new TextDecoder().decode(u8.subarray(4,4+hl)));
  const body=u8.subarray(4+hl);
  if(head.__blob) return new Blob([body],{type:head.type});
  return JSON.parse(new TextDecoder().decode(body));
}

/**
 * saveToCache(key, value [, encryptionKey])
 * Stores anything structured-cloneable — objects, arrays, strings, Blobs, Files.
 * Pass a passphrase to encrypt at rest with AES-256-GCM (PBKDF2, 210k rounds).
 * Resolves true on success, false on failure.
 */
async function saveToCache(key,value,encryptionKey){
  try{
    let payload=value;
    if(!encryptionKey&&value instanceof Blob){
      payload={__b:1,type:value.type,buf:await value.arrayBuffer()};
    }
    if(encryptionKey){
      const salt=crypto.getRandomValues(new Uint8Array(16));
      const iv=crypto.getRandomValues(new Uint8Array(12));
      const k=await deriveKey(encryptionKey,salt);
      const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,await pack(value));
      payload={__enc:1,v:1,salt,iv,data};
    }
    await tx('readwrite',s=>s.put(payload,key));
    return true;
  }catch(e){ console.warn('[cache] save failed',key,e); return false; }
}
/**
 * loadFromCache(key [, encryptionKey])
 * Returns the stored value, or null if the key is missing, the data is
 * encrypted and no key was given, or the passphrase is wrong.
 */
async function loadFromCache(key,encryptionKey){
  try{
    const raw=await tx('readonly',s=>s.get(key));
    if(raw===undefined||raw===null) return null;
    if(raw&&raw.__enc){
      if(!encryptionKey) return null;
      const k=await deriveKey(encryptionKey,new Uint8Array(raw.salt));
      const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(raw.iv)},k,raw.data);
      return unpack(new Uint8Array(plain));
    }
    if(encryptionKey) return null;      // asked for encrypted, found plaintext
    if(raw&&raw.__b) return new Blob([raw.buf],{type:raw.type||''});
    return raw;
  }catch(e){ return null; }             // wrong key / corrupt / missing
}
async function removeFromCache(key){ try{ await tx('readwrite',s=>s.delete(key)); return true;}catch(e){return false;} }
async function listCacheKeys(prefix=''){
  try{ const all=await tx('readonly',s=>s.getAllKeys()); return all.filter(k=>String(k).startsWith(prefix)); }
  catch(e){ return []; }
}
Object.assign(window,{saveToCache,loadFromCache,removeFromCache,listCacheKeys});

/* ═══════════════════════════════════════════════════════════════
   4. virtual filesystem  5. settings
   ═══════════════════════════════════════════════════════════════ */

const VFS_KEY='vfs.tree.v1';
const fileKey=id=>'vfs.file.'+id;

/* node: {id,name,type:'folder'|'file',parent,children[],isApp,icon,mime,size,mtime,open} */
let TREE={root:{id:'root',name:'Workspace',type:'folder',parent:null,children:[],open:true}};
let SET={
  mode:'edit', tabSize:2, useTabs:false, spellcheck:false, wrap:false,
  fontSize:13, lineNumbers:true, autoClose:true, autoIndent:true, highlight:true,
  sidebarW:274, sortFolders:true, trailingNewline:true,
};

const node=id=>TREE[id];
function children(id){ const n=TREE[id]; if(!n||!n.children) return []; return n.children.map(c=>TREE[c]).filter(Boolean); }
function pathOf(id){
  const parts=[]; let n=TREE[id];
  while(n&&n.id!=='root'){ parts.unshift(n.name); n=TREE[n.parent]; }
  return '/'+parts.join('/');
}
function isDesc(id,maybeAncestor){
  let n=TREE[id];
  while(n){ if(n.id===maybeAncestor) return true; n=TREE[n.parent]; }
  return false;
}
function uniqueName(parentId,name){
  const taken=new Set(children(parentId).map(c=>c.name.toLowerCase()));
  if(!taken.has(name.toLowerCase())) return name;
  const dot=name.lastIndexOf('.'); const base=dot>0?name.slice(0,dot):name; const e=dot>0?name.slice(dot):'';
  let i=2; while(taken.has((base+' '+i+e).toLowerCase())) i++;
  return base+' '+i+e;
}
function sortChildren(id){
  const n=TREE[id]; if(!n||!n.children) return;
  n.children.sort((a,b)=>{
    const A=TREE[a],B=TREE[b]; if(!A||!B) return 0;
    if(SET.sortFolders&&A.type!==B.type) return A.type==='folder'?-1:1;
    return A.name.localeCompare(B.name,undefined,{numeric:true,sensitivity:'base'});
  });
}

let saveTimer=null;
function persistTree(now){
  clearTimeout(saveTimer);
  const go=()=>saveToCache(VFS_KEY,JSON.parse(JSON.stringify(TREE)));
  if(now) return go();
  saveTimer=setTimeout(go,220);
}
function persistSettings(){ saveToCache('settings.v1',SET); }

/* file content — always stored as a Blob */
async function readBlob(id){
  const b=await loadFromCache(fileKey(id));
  if(b instanceof Blob) return b;
  if(b==null) return new Blob([]);
  if(b instanceof ArrayBuffer||ArrayBuffer.isView(b)) return new Blob([b]);
  if(typeof b==='string') return new Blob([b]);
  if(b.__b) return new Blob([b.buf],{type:b.type||''});
  return new Blob([JSON.stringify(b)]);
}
async function readText(id){ return (await readBlob(id)).text(); }
async function writeBlob(id,blob){
  await saveToCache(fileKey(id),blob);
  const n=TREE[id]; if(n){ n.size=blob.size; n.mtime=Date.now(); persistTree(); }
}
async function writeText(id,text){ const n=TREE[id]; await writeBlob(id,new Blob([text],{type:mimeOf(n?n.name:'a.txt')})); }

function mkNode(parentId,name,type,extra={}){
  const id=uid();
  const n={id,name:uniqueName(parentId,name),type,parent:parentId,mtime:Date.now(),...extra};
  if(type==='folder'){ n.children=[]; n.open=false; } else { n.mime=mimeOf(name); n.size=0; }
  TREE[id]=n; TREE[parentId].children.push(id); sortChildren(parentId);
  TREE[parentId].open=true;
  return n;
}
async function delNode(id){
  const n=TREE[id]; if(!n||id==='root') return;
  const stack=[id], all=[];
  while(stack.length){ const c=stack.pop(); all.push(c); const k=TREE[c]; if(k&&k.children) stack.push(...k.children); }
  for(const c of all){ if(TREE[c]&&TREE[c].type==='file') await removeFromCache(fileKey(c)); delete TREE[c]; }
  const p=TREE[n.parent]; if(p) p.children=p.children.filter(c=>c!==id);
  all.forEach(c=>closeTab(c));
  persistTree(true);
}
function moveNode(id,newParent){
  const n=TREE[id]; if(!n||id==='root') return false;
  if(isDesc(newParent,id)) return false;
  if(n.parent===newParent) return false;
  const p=TREE[n.parent]; if(p) p.children=p.children.filter(c=>c!==id);
  n.name=uniqueName(newParent,n.name);
  n.parent=newParent; TREE[newParent].children.push(id);
  sortChildren(newParent); TREE[newParent].open=true;
  persistTree(); return true;
}
async function cloneNode(id,newParent){
  const src=TREE[id];
  const copy=mkNode(newParent,src.name,src.type,{isApp:src.isApp,icon:src.icon});
  if(src.type==='file'){ await writeBlob(copy.id,await readBlob(id)); }
  else { for(const c of src.children) await cloneNode(c,copy.id); }
  return copy;
}

/* find a descendant by path relative to a folder */
function resolvePath(rootId,p){
  const parts=String(p).replace(/^\.?\//,'').split('/').filter(x=>x&&x!=='.');
  let cur=rootId;
  for(const part of parts){
    if(part==='..'){ cur=TREE[cur].parent||cur; continue; }
    const hit=children(cur).find(c=>c.name===part)||children(cur).find(c=>c.name.toLowerCase()===part.toLowerCase());
    if(!hit) return null; cur=hit.id;
  }
  return TREE[cur];
}
function collectFiles(folderId,prefix=''){
  const out=[];
  for(const c of children(folderId)){
    if(c.type==='file') out.push({node:c,path:prefix+c.name});
    else out.push(...collectFiles(c.id,prefix+c.name+'/'));
  }
  return out;
}
function listApps(){
  const out=[];
  for(const k in TREE){ const n=TREE[k]; if(n.type==='folder'&&n.isApp) out.push(n); }
  return out.sort((a,b)=>a.name.localeCompare(b.name));
}

   6. tree UI  7. context menus

let selected=null, clipboard=null, renaming=null;
const treeEl=$('#tree');

function fileGlyph(n){
  if(n.type==='folder') return n.isApp?appIco(n.icon||'grid'):ico(n.open?'folderOpen':'folder');
  const k=kindOf(n.name);
  if(k==='image')return ico('img'); if(k==='audio')return ico('music'); if(k==='video')return ico('video');
  if(langOf(n.name)!=='plain')return ico('code');
  return ico('file');
}
function renderTree(){
  const scroll=treeEl.scrollTop;
  treeEl.innerHTML='';
  if(!children('root').length){
    treeEl.innerHTML=`<div class="empty">Nothing here yet.<br><b>Right click</b> to add a file or folder, or <b>drop files</b> from your desktop.</div>`;
  } else {
    const frag=document.createDocumentFragment();
    const emit=(id,depth)=>{
      const n=TREE[id]; if(!n) return;
      frag.appendChild(rowFor(n,depth));
      if(n.type==='folder'&&n.open) n.children.forEach(c=>emit(c,depth+1));
    };
    TREE.root.children.forEach(c=>emit(c,0));
    treeEl.appendChild(frag);
  }
  treeEl.scrollTop=scroll;
  refreshApps();
}
function rowFor(n,depth){
  const el=document.createElement('div');
  el.className='row'+(n.id===selected?' sel':'')+(n.open?' open':'')+(n.isApp?' app':'')+(clipboard&&clipboard.cut&&clipboard.id===n.id?' cut':'');
  el.dataset.id=n.id; el.draggable=true;
  el.style.paddingLeft=(6+depth*13)+'px';
  el.innerHTML=
    (n.type==='folder'?`<span class="tw">${ico('chev')}</span>`:`<span class="tw"></span>`)+
    `<span class="ic">${fileGlyph(n)}</span>`+
    `<span class="nm">${escAttr(n.name)}</span>`+
    (n.isApp?`<span class="pill">app</span>`:'');
  return el;
}

/* click */
treeEl.addEventListener('click',e=>{
  const row=e.target.closest('.row'); if(!row||renaming) return;
  const n=TREE[row.dataset.id]; if(!n) return;
  selected=n.id;
  if(n.type==='folder'){ n.open=!n.open; persistTree(); renderTree(); }
  else { renderTree(); openFile(n.id); }
});
treeEl.addEventListener('dblclick',e=>{
  const row=e.target.closest('.row'); if(!row) return;
  const n=TREE[row.dataset.id];
  if(n&&n.type==='folder'&&n.isApp) runApp(n.id);
});

/* inline rename */
function startRename(id){
  renaming=id; renderTree();
  const row=treeEl.querySelector(`.row[data-id="${id}"]`); if(!row) return;
  const n=TREE[id], nm=$('.nm',row);
  const inp=document.createElement('input'); inp.className='ren'; inp.value=n.name;
  nm.replaceWith(inp); inp.focus();
  const dot=n.name.lastIndexOf('.');
  if(n.type==='file'&&dot>0) inp.setSelectionRange(0,dot); else inp.select();
  const done=ok=>{
    if(renaming!==id) return; renaming=null;
    const v=inp.value.trim();
    if(ok&&v&&v!==n.name&&!/[\\/]/.test(v)){
      n.name=uniqueName(n.parent,v);
      if(n.type==='file') n.mime=mimeOf(n.name);
      sortChildren(n.parent); persistTree();
      const t=tabs.find(t=>t.id===id); if(t){ t.lang=langOf(n.name); renderTabs(); if(t.render) t.render(); }
    }
    renderTree();
  };
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();done(true);}if(e.key==='Escape'){e.preventDefault();done(false);}});
  inp.addEventListener('blur',()=>done(true));
}

/* drag + drop within the tree */
let dragId=null;
treeEl.addEventListener('dragstart',e=>{
  const row=e.target.closest('.row'); if(!row) return;
  dragId=row.dataset.id; e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',pathOf(dragId));
});
treeEl.addEventListener('dragend',()=>{dragId=null;$$('.row.drop').forEach(r=>r.classList.remove('drop'));treeEl.classList.remove('dragover-root');});
treeEl.addEventListener('dragover',e=>{
  e.preventDefault();
  $$('.row.drop').forEach(r=>r.classList.remove('drop'));
  const row=e.target.closest('.row');
  const target=row?TREE[row.dataset.id]:null;
  const folder=target?(target.type==='folder'?target:TREE[target.parent]):TREE.root;
  treeEl.classList.toggle('dragover-root',!row);
  if(row&&folder){
    const fr=treeEl.querySelector(`.row[data-id="${folder.id}"]`);
    if(fr&&(!dragId||!isDesc(folder.id,dragId))) fr.classList.add('drop');
  }
  e.dataTransfer.dropEffect=dragId?'move':'copy';
});
treeEl.addEventListener('dragleave',e=>{ if(e.target===treeEl) treeEl.classList.remove('dragover-root'); });
treeEl.addEventListener('drop',async e=>{
  e.preventDefault();
  $$('.row.drop').forEach(r=>r.classList.remove('drop'));
  treeEl.classList.remove('dragover-root');
  const row=e.target.closest('.row');
  const target=row?TREE[row.dataset.id]:null;
  const dest=target?(target.type==='folder'?target.id:target.parent):'root';
  if(e.dataTransfer.files&&e.dataTransfer.files.length){ await importFiles(e.dataTransfer.files,dest); return; }
  if(dragId&&moveNode(dragId,dest)) renderTree();
  dragId=null;
});

/* ── context menu ───────────────────────────────────────────── */
const ctx=$('#ctx');
function closeMenu(){ ctx.classList.remove('on'); ctx.innerHTML=''; }
document.addEventListener('mousedown',e=>{ if(!ctx.contains(e.target)) closeMenu(); },true);
window.addEventListener('blur',closeMenu);
window.addEventListener('resize',closeMenu);

function menu(x,y,items){
  ctx.innerHTML='';
  for(const it of items){
    if(it==='-'){ ctx.insertAdjacentHTML('beforeend','<div class="msep"></div>'); continue; }
    if(it.label!==undefined&&!it.fn){ ctx.insertAdjacentHTML('beforeend',`<div class="mlbl">${escAttr(it.label)}</div>`); continue; }
    const b=document.createElement('button');
    b.className='mi'+(it.danger?' danger':'');
    b.innerHTML=`<span class="ic">${it.icon?ico(it.icon):''}</span><span>${escAttr(it.text)}</span>`+(it.key?`<span class="k">${escAttr(it.key)}</span>`:'');
    b.onclick=()=>{ closeMenu(); it.fn(); };
    ctx.appendChild(b);
  }
  ctx.classList.add('on');
  ctx.style.left='0px'; ctx.style.top='0px';
  const r=ctx.getBoundingClientRect();
  ctx.style.left=clamp(x,4,innerWidth-r.width-6)+'px';
  ctx.style.top=clamp(y,4,innerHeight-r.height-6)+'px';
}

treeEl.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const row=e.target.closest('.row');
  if(!row){ selected=null; renderTree(); return menu(e.clientX,e.clientY,folderMenu('root')); }
  const n=TREE[row.dataset.id]; selected=n.id; renderTree();
  menu(e.clientX,e.clientY, n.type==='folder'?folderMenu(n.id):fileMenu(n.id));
});

function folderMenu(id){
  const n=TREE[id], isRoot=id==='root';
  const items=[
    {label:isRoot?'Workspace':n.name},
    {text:'New file',icon:'filePlus',fn:()=>newThing(id,'file')},
    {text:'New folder',icon:'folderPlus',fn:()=>newThing(id,'folder')},
    {text:'Upload files…',icon:'upload',fn:()=>pickFiles(id)},
    {text:'Upload folder…',icon:'folder',fn:()=>pickDir(id)},
    '-',
  ];
  if(!isRoot){
    if(n.isApp){
      items.push({text:'Run app',icon:'play',key:'dbl-click',fn:()=>runApp(id)});
      items.push({text:'Change icon…',icon:'cube',fn:()=>appDialog(id)});
      items.push({text:'Detach from apps',icon:'x',fn:()=>{delete n.isApp;delete n.icon;persistTree();renderTree();toast(n.name+' is a plain folder again','info');}});
    } else {
      items.push({text:'Convert to app…',icon:'cube',fn:()=>appDialog(id)});
    }
    items.push('-');
  }
  items.push({text:'Download as ZIP',icon:'zip',fn:()=>downloadZip(id)});
  if(clipboard) items.push({text:'Paste',icon:'clip',key:'Ctrl+V',fn:()=>doPaste(id)});
  if(!isRoot){
    items.push('-');
    items.push({text:'Copy',icon:'copy',key:'Ctrl+C',fn:()=>{clipboard={id,cut:false};renderTree();}});
    items.push({text:'Cut',icon:'scissors',key:'Ctrl+X',fn:()=>{clipboard={id,cut:true};renderTree();}});
    items.push({text:'Rename',icon:'pencil',key:'F2',fn:()=>startRename(id)});
    items.push({text:'Delete',icon:'trash',key:'Del',danger:true,fn:()=>confirmDelete(id)});
  }
  return items;
}
function fileMenu(id){
  const n=TREE[id], lang=langOf(n.name), kind=kindOf(n.name);
  const items=[{label:n.name}];
  items.push({text:'Open',icon:'file',fn:()=>openFile(id)});
  if(ext(n.name)==='js'||ext(n.name)==='mjs') items.push({text:'Run',icon:'play',fn:()=>runScript(id)});
  if(ext(n.name)==='html'||ext(n.name)==='htm') items.push({text:'Preview',icon:'eye',fn:()=>previewHtml(id)});
  if(kind==='image'||kind==='audio'||kind==='video') items.push({text:'Open in editor',icon:'brush',fn:()=>openFile(id)});
  items.push('-');
  items.push({text:'Download',icon:'download',fn:()=>downloadFile(id)});
  items.push({text:'Duplicate',icon:'copy',fn:async()=>{await cloneNode(id,n.parent);persistTree();renderTree();toast('Duplicated');}});
  items.push('-');
  items.push({text:'Copy',icon:'copy',key:'Ctrl+C',fn:()=>{clipboard={id,cut:false};renderTree();}});
  items.push({text:'Cut',icon:'scissors',key:'Ctrl+X',fn:()=>{clipboard={id,cut:true};renderTree();}});
  items.push({text:'Rename',icon:'pencil',key:'F2',fn:()=>startRename(id)});
  items.push({text:'Delete',icon:'trash',key:'Del',danger:true,fn:()=>confirmDelete(id)});
  return items;
}

function newThing(parentId,type){
  const n=mkNode(parentId,type==='folder'?'New folder':'untitled.txt',type);
  if(type==='file') writeText(n.id,'');
  persistTree(); renderTree(); startRename(n.id);
}
async function doPaste(destId){
  if(!clipboard) return;
  const src=TREE[clipboard.id]; if(!src) return (clipboard=null);
  if(isDesc(destId,clipboard.id)) return toast("Can't paste a folder into itself",'err');
  if(clipboard.cut){ moveNode(clipboard.id,destId); clipboard=null; }
  else { await cloneNode(clipboard.id,destId); }
  persistTree(); renderTree(); toast('Pasted');
}
function confirmDelete(id){
  const n=TREE[id];
  const count=n.type==='folder'?collectFiles(id).length:0;
  showModal({
    title:'Delete '+n.name+'?',
    sub:n.type==='folder'?`${count} file${count===1?'':'s'} inside will go too. This can't be undone.`:"This can't be undone.",
    body:'',
    actions:[{text:'Cancel'},{text:'Delete',cls:'danger',fn:async()=>{await delNode(id);renderTree();toast(n.name+' deleted','info');}}]
  });
}

/* ── importing from disk ────────────────────────────────────── */
let pendingImportTarget='root';
function pickFiles(dest){ pendingImportTarget=dest; $('#fileInput').click(); }
function pickDir(dest){ pendingImportTarget=dest; $('#dirInput').click(); }
$('#fileInput').addEventListener('change',async e=>{ await importFiles(e.target.files,pendingImportTarget); e.target.value=''; });
$('#dirInput').addEventListener('change',async e=>{ await importFiles(e.target.files,pendingImportTarget,true); e.target.value=''; });

async function importFiles(fileList,destId,useRelative){
  const files=[...fileList]; if(!files.length) return;
  let n=0;
  for(const f of files){
    let parent=destId;
    const rel=useRelative?(f.webkitRelativePath||''):'';
    if(rel&&rel.includes('/')){
      const dirs=rel.split('/').slice(0,-1);
      for(const d of dirs){
        let hit=children(parent).find(c=>c.type==='folder'&&c.name===d);
        if(!hit) hit=mkNode(parent,d,'folder');
        parent=hit.id;
      }
    }
    const node=mkNode(parent,f.name,'file',{mime:f.type||mimeOf(f.name)});
    await writeBlob(node.id,f.slice(0,f.size,f.type||mimeOf(f.name)));
    n++;
  }
  persistTree(true); renderTree();
  toast(`${n} file${n===1?'':'s'} added to ${destId==='root'?'Workspace':TREE[destId].name}`);
}

}

/* ═══════════════════════════════════════════════════════════════
   8. syntax highlighting
   ═══════════════════════════════════════════════════════════════ */
const JS_KW=new Set('var let const function return if else for while do switch case break continue new delete typeof instanceof in of class extends super this null undefined true false try catch finally throw async await yield static get set import export from as void with debugger'.split(' '));
const JS_KW2=new Set('return if else for while switch case break continue new delete typeof instanceof class extends super try catch finally throw async await yield import export'.split(' '));

function tokJS(s){
  const out=[]; let i=0, prev='';
  const push=(t,c)=>{ if(t) out.push([t,c]); };
  while(i<s.length){
    const c=s[i];
    if(c==='/'&&s[i+1]==='/'){ let j=s.indexOf('\n',i); if(j<0)j=s.length; push(s.slice(i,j),'t-com'); i=j; continue; }
    if(c==='/'&&s[i+1]==='*'){ let j=s.indexOf('*/',i+2); j=j<0?s.length:j+2; push(s.slice(i,j),'t-com'); i=j; continue; }
    if(c==='"'||c==="'"||c==='`'){
      let j=i+1; while(j<s.length){ if(s[j]==='\\'){j+=2;continue;} if(s[j]===c){j++;break;} if(c!=='`'&&s[j]==='\n'){break;} j++; }
      push(s.slice(i,j),'t-str'); i=j; prev='str'; continue;
    }
    if(c==='/'&&(prev===''||prev==='op'||prev==='kw')){
      let j=i+1,ok=false,cls=false;
      while(j<s.length){ const d=s[j];
        if(d==='\\'){j+=2;continue;} if(d==='[')cls=true; else if(d===']')cls=false;
        else if(d==='/'&&!cls){ok=true;j++;break;} else if(d==='\n')break; j++; }
      if(ok){ while(j<s.length&&/[gimsuyd]/.test(s[j]))j++; push(s.slice(i,j),'t-str'); i=j; prev='str'; continue; }
    }
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){
      let j=i; while(j<s.length&&/[0-9a-fA-FxXbBoOeE._n+-]/.test(s[j])){ if(/[+-]/.test(s[j])&&!/[eE]/.test(s[j-1]))break; j++; }
      push(s.slice(i,j),'t-num'); i=j; prev='num'; continue;
    }
    if(/[A-Za-z_$]/.test(c)){
      let j=i; while(j<s.length&&/[A-Za-z0-9_$]/.test(s[j]))j++;
      const w=s.slice(i,j);
      let k=j; while(k<s.length&&/\s/.test(s[k]))k++;
      let cls='';
      if(JS_KW.has(w)) cls=JS_KW2.has(w)?'t-kw2':'t-kw';
      else if(s[k]==='(') cls='t-fn';
      else if(/^[A-Z]/.test(w)) cls='t-fn';
      push(w,cls); i=j; prev=cls.startsWith('t-kw')?'kw':'id'; continue;
    }
    if(/\s/.test(c)){ let j=i; while(j<s.length&&/\s/.test(s[j]))j++; push(s.slice(i,j),''); i=j; continue; }
    let j=i; while(j<s.length&&/[^\w\s$'"`]/.test(s[j])&&!(s[j]==='/'&&/[/*]/.test(s[j+1]||'')))j++;
    if(j===i)j=i+1;
    const p=s.slice(i,j);
    push(p,/[{}()[\];,]/.test(p)?'t-punc':'t-op');
    prev=/[)\]]/.test(p[p.length-1])?'id':'op';
    i=j;
  }
  return out;
}
function tokCSS(s){
  const out=[]; let i=0, depth=0, inVal=false;
  const push=(t,c)=>{ if(t) out.push([t,c]); };
  while(i<s.length){
    const c=s[i];
    if(c==='/'&&s[i+1]==='*'){ let j=s.indexOf('*/',i+2); j=j<0?s.length:j+2; push(s.slice(i,j),'t-com'); i=j; continue; }
    if(c==='"'||c==="'"){ let j=i+1; while(j<s.length){if(s[j]==='\\'){j+=2;continue;}if(s[j]===c){j++;break;}j++;} push(s.slice(i,j),'t-str'); i=j; continue; }
    if(c==='@'&&!depth){ let j=i+1; while(j<s.length&&/[\w-]/.test(s[j]))j++; push(s.slice(i,j),'t-at'); i=j; continue; }
    if(c==='{'){ depth++; inVal=false; push(c,'t-punc'); i++; continue; }
    if(c==='}'){ depth=Math.max(0,depth-1); inVal=false; push(c,'t-punc'); i++; continue; }
    if(c===':'&&depth){ inVal=true; push(c,'t-punc'); i++; continue; }
    if(c===';'){ inVal=false; push(c,'t-punc'); i++; continue; }
    if(/\s/.test(c)){ let j=i; while(j<s.length&&/\s/.test(s[j]))j++; push(s.slice(i,j),''); i=j; continue; }
    if(/[0-9]/.test(c)||(c==='#'&&depth)){
      let j=i+1; while(j<s.length&&/[\w.%#-]/.test(s[j]))j++;
      push(s.slice(i,j),'t-num'); i=j; continue;
    }
    if(/[\w.#*[\]&-]/.test(c)){
      let j=i; while(j<s.length&&/[\w.#*[\]="'&:>~+-]/.test(s[j])&&!(s[j]===':'&&depth))j++;
      if(j===i)j=i+1;
      const w=s.slice(i,j);
      push(w, depth? (inVal?'t-val':'t-prop') : 't-sel'); i=j; continue;
    }
    push(c,'t-punc'); i++;
  }
  return out;
}
function tokHTML(s){
  const out=[]; let i=0;
  const push=(t,c)=>{ if(t) out.push([t,c]); };
  while(i<s.length){
    if(s.startsWith('<!--',i)){ let j=s.indexOf('-->',i); j=j<0?s.length:j+3; push(s.slice(i,j),'t-com'); i=j; continue; }
    if(s[i]==='<'){
      const m=/^<\/?([A-Za-z][\w:-]*)/.exec(s.slice(i));
      if(!m){ push('<','t-punc'); i++; continue; }
      const tag=m[1].toLowerCase();
      let j=i+m[0].length;
      push(s.slice(i,j),'t-tag');
      // attributes
      while(j<s.length&&s[j]!=='>'){
        if(/\s/.test(s[j])){ let k=j; while(k<s.length&&/\s/.test(s[k]))k++; push(s.slice(j,k),''); j=k; continue; }
        if(s[j]==='/'){ push('/','t-tag'); j++; continue; }
        if(s[j]==='='){ push('=','t-punc'); j++; continue; }
        if(s[j]==='"'||s[j]==="'"){ const q=s[j]; let k=j+1; while(k<s.length&&s[k]!==q)k++; k=Math.min(k+1,s.length); push(s.slice(j,k),'t-str'); j=k; continue; }
        let k=j; while(k<s.length&&!/[\s=>/]/.test(s[k]))k++; if(k===j)k=j+1;
        push(s.slice(j,k),'t-attr'); j=k;
      }
      if(s[j]==='>'){ push('>','t-tag'); j++; }
      i=j;
      if(tag==='script'||tag==='style'){
        const close=s.toLowerCase().indexOf('</'+tag,i);
        const end=close<0?s.length:close;
        const inner=s.slice(i,end);
        if(inner) out.push(...(tag==='script'?tokJS(inner):tokCSS(inner)));
        i=end;
      }
      continue;
    }
    let j=s.indexOf('<',i); if(j<0)j=s.length;
    push(s.slice(i,j),''); i=j;
  }
  return out;
}
function tokenize(text,lang){
  try{
    if(lang==='js')return tokJS(text);
    if(lang==='css')return tokCSS(text);
    if(lang==='html')return tokHTML(text);
  }catch(e){}
  return [[text,'']];
}
/* tokens → one <div class="cl"> per logical line */
function tokensToHTML(tokens){
  let html='<div class="cl">'; 
  for(const [t,c] of tokens){
    const parts=t.split('\n');
    for(let k=0;k<parts.length;k++){
      if(k) html+='</div><div class="cl">';
      if(parts[k]) html+= c?`<span class="${c}">${esc(parts[k])}</span>`:esc(parts[k]);
    }
  }
  return html+'</div>';
}

/* ═══════════════════════════════════════════════════════════════
   9. tabs + editor
   ═══════════════════════════════════════════════════════════════ */
let tabs=[], active=null;
const tabsEl=$('#tabs'), panesEl=$('#panes');
const keyOf=(mode,id)=>mode+':'+id;

function renderTabs(){
  tabsEl.innerHTML='';
  for(const t of tabs){
    const n=TREE[t.id]; if(!n) continue;
    const el=document.createElement('div');
    el.className='tab'+(t.key===active?' on':'')+(t.dirty?' dirty':'');
    el.dataset.key=t.key;
    const badge=t.mode==='console'?ico('term'):t.mode==='preview'?ico('eye'):fileGlyph(n);
    el.innerHTML=`<span class="ic">${badge}</span><span class="tt">${escAttr(t.mode==='console'?'Run — '+n.name:t.mode==='preview'?'Preview — '+n.name:n.name)}</span><span class="x">${ico('x')}</span>`;
    el.onclick=e=>{ if(e.target.closest('.x')) return closeTabKey(t.key); setActive(t.key); };
    el.onauxclick=e=>{ if(e.button===1){e.preventDefault();closeTabKey(t.key);} };
    tabsEl.appendChild(el);
  }
}
function setActive(key){
  active=key;
  $$('.pane',panesEl).forEach(p=>p.classList.toggle('on',p.dataset.key===key));
  if(!tabs.length) $('#welcome').classList.add('on');
  renderTabs();
  const t=tabs.find(t=>t.key===key);
  if(t&&t.mode==='edit'&&t.ta) setTimeout(()=>{t.ta.focus();syncGutter(t);},0);
  const el=tabsEl.querySelector(`.tab[data-key="${key}"]`); if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest',inline:'nearest'});
}
function closeTabKey(key){
  const i=tabs.findIndex(t=>t.key===key); if(i<0) return;
  const t=tabs[i];
  if(t.flush) t.flush();
  if(t.cleanup) t.cleanup();
  tabs.splice(i,1);
  const pane=panesEl.querySelector(`.pane[data-key="${CSS.escape(key)}"]`); if(pane) pane.remove();
  if(active===key) setActive(tabs.length?tabs[Math.min(i,tabs.length-1)].key:null);
  else renderTabs();
  if(!tabs.length){ $('#welcome').classList.add('on'); active=null; }
}
function closeTab(nodeId){ tabs.filter(t=>t.id===nodeId).forEach(t=>closeTabKey(t.key)); }

function makePane(key){
  $('#welcome').classList.remove('on');
  let p=panesEl.querySelector(`.pane[data-key="${CSS.escape(key)}"]`);
  if(p) return p;
  p=document.createElement('div'); p.className='pane'; p.dataset.key=key;
  panesEl.appendChild(p); return p;
}

/* ── open a file, dispatching by kind ───────────────────────── */
async function openFile(id){
  const n=TREE[id]; if(!n||n.type!=='file') return;
  const key=keyOf('edit',id);
  if(tabs.find(t=>t.key===key)) return setActive(key);
  const kind=kindOf(n.name);
  if(kind==='image') return openImage(id);
  if(kind==='audio') return openAudio(id);
  if(kind==='video') return openVideo(id);
  if(kind==='pdf'||kind==='bin') return openBinary(id);
  return openText(id);
}

/* ── text / code editor ─────────────────────────────────────── */
async function openText(id){
  const n=TREE[id], key=keyOf('edit',id);
  const text=await readText(id);
  const pane=makePane(key);
  pane.innerHTML=`
  <div class="ebar">
    <span class="mono" data-r="lang"></span><div class="sep"></div>
    <button data-a="wrap" title="Word wrap">Wrap</button>
    <button data-a="spell" title="Spelling detection">Spelling</button>
    <button data-a="hl" title="Syntax highlighting">Syntax</button>
    <div class="sep"></div>
    <span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase">Indent</span>
    <button data-a="indentKind"></button>
    <div class="stepper" style="height:20px">
      <button data-a="ind-" style="width:20px;height:20px">−</button><span data-r="tab" style="width:20px;font-size:11px"></span><button data-a="ind+" style="width:20px;height:20px">+</button>
    </div>
    <button data-a="reindent" title="Re-indent whole document">Apply</button>
    <div class="sep"></div>
    <button data-a="fmtjson" title="Pretty-print JSON">Format</button>
    <button data-a="find">Find</button>
    <span class="spacer" style="flex:1"></span>
    <button data-a="save" title="Ctrl+S">Save</button>
  </div>
  <div class="ed">
    <div class="ednums" data-r="nums"></div>
    <div class="edwrap" data-r="wrap">
      <pre class="edhl" data-r="hl"></pre>
      <textarea class="edta" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" wrap="off"></textarea>
    </div>
    <div class="find" data-r="find">
      <input data-r="q" placeholder="Find">
      <input data-r="rep" placeholder="Replace">
      <span class="cnt" data-r="cnt">0 / 0</span>
      <button data-a="prev">↑</button><button data-a="next">↓</button>
      <button data-a="rep1">Replace</button><button data-a="repAll">All</button>
      <button data-a="closeFind">${ico('x')}</button>
    </div>
  </div>
  <div class="edstat">
    <span data-r="pos">Ln 1, Col 1</span><span data-r="sel"></span>
    <span class="spacer"></span>
    <span data-r="meta"></span>
  </div>`;
  const R=s=>pane.querySelector(`[data-r="${s}"]`);
  const ta=pane.querySelector('.edta'), hl=R('hl'), nums=R('nums'), edwrap=R('wrap');
  ta.value=text;
  const t={key,id,mode:'edit',pane,ta,hl,nums,lang:langOf(n.name),dirty:false,matches:[],mi:-1};
  tabs.push(t);

  const applySettings=()=>{
    pane.classList.toggle('wrapon',SET.wrap);
    ta.setAttribute('wrap',SET.wrap?'soft':'off');
    ta.spellcheck=SET.spellcheck;
    nums.style.display=SET.lineNumbers?'':'none';
    pane.style.setProperty('--fs',SET.fontSize+'px');
    pane.style.setProperty('--lh',Math.round(SET.fontSize*1.55)+'px');
    ta.style.tabSize=hl.style.tabSize=SET.tabSize;
    pane.querySelector('[data-a="wrap"]').classList.toggle('on',SET.wrap);
    pane.querySelector('[data-a="spell"]').classList.toggle('on',SET.spellcheck);
    pane.querySelector('[data-a="hl"]').classList.toggle('on',SET.highlight);
    pane.querySelector('[data-a="indentKind"]').textContent=SET.useTabs?'Tabs':'Spaces';
    R('tab').textContent=SET.tabSize;
    R('lang').textContent=({js:'JavaScript',css:'CSS',html:'HTML',plain:'Plain text'})[t.lang];
    render();
  };
  t.applySettings=applySettings;

  const BIG=400000;
  function render(){
    const v=ta.value;
    if(SET.highlight&&v.length<BIG&&t.lang!=='plain') hl.innerHTML=tokensToHTML(tokenize(v,t.lang));
    else hl.innerHTML=tokensToHTML([[v,'']]);
    ta.style.height='auto'; ta.style.height=hl.scrollHeight+'px';
    syncGutter(t);
    updateStatus();
  }
  t.render=render;

  function updateStatus(){
    const v=ta.value, p=ta.selectionStart;
    const before=v.slice(0,p); const ln=before.split('\n').length;
    const col=p-(before.lastIndexOf('\n')+1)+1;
    R('pos').textContent=`Ln ${ln}, Col ${col}`;
    const selLen=ta.selectionEnd-ta.selectionStart;
    R('sel').textContent=selLen?`${selLen} selected`:'';
    R('meta').innerHTML=`<b>${v.split('\n').length}</b> lines · <b>${bytes(new Blob([v]).size)}</b> · ${SET.useTabs?'Tabs':'Spaces'}: <b>${SET.tabSize}</b>`;
    highlightCurrentLine(t,ln);
  }
  t.updateStatus=updateStatus;

  let dt=null;
  const markDirty=()=>{
    if(!t.dirty){ t.dirty=true; renderTabs(); }
    clearTimeout(dt); dt=setTimeout(()=>flush(),450);
  };
  const flush=async()=>{
    clearTimeout(dt);
    if(!t.dirty) return;
    let v=ta.value;
    if(SET.trailingNewline&&v&&!v.endsWith('\n')&&kindOf(n.name)==='text'&&langOf(n.name)!=='plain'){/* leave content untouched */}
    await writeText(id,v);
    t.dirty=false; renderTabs();
  };
  t.flush=flush;

  ta.addEventListener('input',()=>{ render(); markDirty(); if(t.q&&t.q.value) runFind(t,false); });
  ta.addEventListener('scroll',()=>{ nums.scrollTop=ta.scrollTop; });
  edwrap.addEventListener('scroll',()=>{ nums.style.transform=`translateY(${-edwrap.scrollTop}px)`; });
  ['click','keyup','select'].forEach(ev=>ta.addEventListener(ev,updateStatus));
  ta.addEventListener('keydown',e=>editorKeys(e,t));

  pane.addEventListener('click',e=>{
    const a=e.target.closest('[data-a]'); if(!a) return;
    const act=a.dataset.a;
    if(act==='wrap'){SET.wrap=!SET.wrap;persistSettings();allPanes(p=>p.applySettings&&p.applySettings());}
    if(act==='spell'){SET.spellcheck=!SET.spellcheck;persistSettings();allPanes(p=>p.applySettings&&p.applySettings());}
    if(act==='hl'){SET.highlight=!SET.highlight;persistSettings();allPanes(p=>p.applySettings&&p.applySettings());}
    if(act==='indentKind'){SET.useTabs=!SET.useTabs;persistSettings();allPanes(p=>p.applySettings&&p.applySettings());}
    if(act==='ind-'){SET.tabSize=clamp(SET.tabSize-1,1,8);persistSettings();allPanes(p=>p.applySettings&&p.applySettings());}
    if(act==='ind+'){SET.tabSize=clamp(SET.tabSize+1,1,8);persistSettings();allPanes(p=>p.applySettings&&p.applySettings());}
    if(act==='reindent'){reindent(t);}
    if(act==='fmtjson'){formatDoc(t);}
    if(act==='find'){openFind(t);}
    if(act==='closeFind'){R('find').classList.remove('on');clearFindMarks(t);ta.focus();}
    if(act==='next'){stepFind(t,1);} if(act==='prev'){stepFind(t,-1);}
    if(act==='rep1'){replaceOne(t);} if(act==='repAll'){replaceAll(t);}
    if(act==='save'){flush().then(()=>toast('Saved '+n.name));}
  });
  t.q=R('q'); t.rep=R('rep'); t.cnt=R('cnt'); t.findBox=R('find');
  t.q.addEventListener('input',()=>runFind(t,false));
  t.q.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();stepFind(t,e.shiftKey?-1:1);}if(e.key==='Escape'){R('find').classList.remove('on');ta.focus();}});
  t.rep.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();replaceOne(t);}});

  applySettings();
  setActive(key);
}
function allPanes(fn){ tabs.forEach(fn); }

function syncGutter(t){
  if(!SET.lineNumbers) return;
  const rows=t.hl.children, n=rows.length;
  let html='';
  for(let i=0;i<n;i++) html+=`<div style="height:${rows[i].offsetHeight}px">${i+1}</div>`;
  t.nums.innerHTML=html;
  const v=t.ta.value, p=t.ta.selectionStart;
  highlightCurrentLine(t,v.slice(0,p).split('\n').length);
}
function highlightCurrentLine(t,ln){
  const prev=t.hl.querySelector('.cl.cur'); if(prev) prev.classList.remove('cur');
  const pn=t.nums.querySelector('.cur'); if(pn) pn.classList.remove('cur');
  const row=t.hl.children[ln-1]; if(row) row.classList.add('cur');
  const nr=t.nums.children[ln-1]; if(nr) nr.classList.add('cur');
}

/* ── key handling ───────────────────────────────────────────── */
const PAIRS={'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`'};
function ins(ta,text){
  if(!document.execCommand||!document.execCommand('insertText',false,text)){
    const s=ta.selectionStart,e=ta.selectionEnd;
    ta.value=ta.value.slice(0,s)+text+ta.value.slice(e);
    ta.selectionStart=ta.selectionEnd=s+text.length;
  }
}
function unit(){ return SET.useTabs?'\t':' '.repeat(SET.tabSize); }
function lineBounds(v,pos){
  const a=v.lastIndexOf('\n',pos-1)+1;
  let b=v.indexOf('\n',pos); if(b<0)b=v.length;
  return [a,b];
}
function editorKeys(e,t){
  const ta=t.ta, v=ta.value; let s=ta.selectionStart, en=ta.selectionEnd;
  const mod=e.ctrlKey||e.metaKey;

  if(mod&&e.key.toLowerCase()==='s'){ e.preventDefault(); t.flush().then(()=>toast('Saved '+TREE[t.id].name)); return; }
  if(mod&&e.key.toLowerCase()==='f'){ e.preventDefault(); openFind(t); return; }
  if(mod&&e.key.toLowerCase()==='h'){ e.preventDefault(); openFind(t,true); return; }
  if(mod&&e.key==='/'){
    e.preventDefault();
    const [a]=lineBounds(v,s); let [,b]=lineBounds(v,en);
    const block=v.slice(a,b), lines=block.split('\n');
    const tok=t.lang==='css'?['/* ',' */']:t.lang==='html'?['<!-- ',' -->']:['// ',''];
    const allOn=lines.every(l=>!l.trim()||l.trimStart().startsWith(tok[0].trim()));
    const out=lines.map(l=>{
      if(!l.trim()) return l;
      if(allOn){
        let r=l.replace(tok[0].trim()+' ','').replace(tok[0].trim(),'');
        if(tok[1]) r=r.replace(new RegExp('\\s*'+tok[1].trim().replace(/[*/]/g,'\\$&')+'$'),'');
        return r;
      }
      const m=l.match(/^\s*/)[0];
      return m+tok[0]+l.slice(m.length)+tok[1];
    }).join('\n');
    ta.setSelectionRange(a,b); ins(ta,out); ta.setSelectionRange(a,a+out.length);
    t.render(); return;
  }
  if(mod&&e.key.toLowerCase()==='d'){
    e.preventDefault();
    const [a,b]=lineBounds(v,s); const line=v.slice(a,b);
    ta.setSelectionRange(b,b); ins(ta,'\n'+line);
    ta.setSelectionRange(b+1+(s-a),b+1+(s-a)); t.render(); return;
  }
  if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault();
    const up=e.key==='ArrowUp';
    const [a]=lineBounds(v,s); let [,b]=lineBounds(v,en);
    if(up&&a===0) return; if(!up&&b>=v.length) return;
    const block=v.slice(a,b);
    if(up){ const [pa]=lineBounds(v,a-1); const prev=v.slice(pa,a-1);
      ta.setSelectionRange(pa,b); ins(ta,block+'\n'+prev);
      ta.setSelectionRange(pa+(s-a),pa+(en-a)); }
    else { let [,nb]=lineBounds(v,b+1); const next=v.slice(b+1,nb);
      ta.setSelectionRange(a,nb); ins(ta,next+'\n'+block);
      ta.setSelectionRange(a+next.length+1+(s-a),a+next.length+1+(en-a)); }
    t.render(); return;
  }
  if(e.key==='Tab'){
    e.preventDefault();
    const multi=v.slice(s,en).includes('\n');
    if(multi||e.shiftKey){
      const [a]=lineBounds(v,s); let [,b]=lineBounds(v,en);
      const lines=v.slice(a,b).split('\n');
      const u=unit();
      const out=lines.map(l=>{
        if(e.shiftKey){
          if(l.startsWith(u)) return l.slice(u.length);
          if(l.startsWith('\t')) return l.slice(1);
          return l.replace(/^ +/,m=>m.slice(Math.min(m.length,SET.tabSize)));
        }
        return u+l;
      }).join('\n');
      ta.setSelectionRange(a,b); ins(ta,out); ta.setSelectionRange(a,a+out.length);
    } else ins(ta,unit());
    t.render(); return;
  }
  if(e.key==='Enter'&&SET.autoIndent){
    e.preventDefault();
    const [a]=lineBounds(v,s);
    const cur=v.slice(a,s);
    let indent=(cur.match(/^[\t ]*/)||[''])[0];
    const last=cur.trimEnd().slice(-1), nxt=v[en]||'';
    if(/[{[(:>]/.test(last)) {
      const extra=indent+unit();
      if((last==='{'&&nxt==='}')||(last==='['&&nxt===']')||(last==='('&&nxt===')')){
        ins(ta,'\n'+extra+'\n'+indent);
        ta.setSelectionRange(s+1+extra.length,s+1+extra.length);
      } else { ins(ta,'\n'+extra); }
    } else ins(ta,'\n'+indent);
    t.render(); return;
  }
  if(SET.autoClose&&PAIRS[e.key]&&!e.ctrlKey&&!e.metaKey){
    const close=PAIRS[e.key], sel=v.slice(s,en);
    if(sel){ e.preventDefault(); ins(ta,e.key+sel+close); ta.setSelectionRange(s+1,s+1+sel.length); t.render(); return; }
    const nxt=v[s]||'';
    if(/["'`]/.test(e.key)&&/[\w"'`]/.test(v[s-1]||'')) return;
    if(!nxt||/[\s)\]},;.]/.test(nxt)){ e.preventDefault(); ins(ta,e.key+close); ta.setSelectionRange(s+1,s+1); t.render(); return; }
  }
  if(SET.autoClose&&/[)\]}"'`]/.test(e.key)&&s===en&&v[s]===e.key){
    e.preventDefault(); ta.setSelectionRange(s+1,s+1); t.updateStatus(); return;
  }
  if(e.key==='Backspace'&&s===en&&s>0){
    const a=v[s-1], b=v[s];
    if(PAIRS[a]&&PAIRS[a]===b){ e.preventDefault(); ta.setSelectionRange(s-1,s+1); ins(ta,''); t.render(); return; }
    const [ls]=lineBounds(v,s); const pre=v.slice(ls,s);
    if(/^[ ]+$/.test(pre)&&!SET.useTabs&&pre.length%SET.tabSize===0){
      e.preventDefault(); ta.setSelectionRange(s-SET.tabSize,s); ins(ta,''); t.render(); return;
    }
  }
  setTimeout(()=>t.updateStatus(),0);
}

/* ── find & replace ─────────────────────────────────────────── */
function openFind(t,focusRep){
  t.findBox.classList.add('on');
  const sel=t.ta.value.slice(t.ta.selectionStart,t.ta.selectionEnd);
  if(sel&&!sel.includes('\n')) t.q.value=sel;
  (focusRep?t.rep:t.q).focus(); (focusRep?t.rep:t.q).select();
  runFind(t,false);
}
function runFind(t,jump=true){
  const q=t.q.value; t.matches=[];
  if(q){ const v=t.ta.value; let i=0;
    const lq=q.toLowerCase(), lv=v.toLowerCase();
    while(true){ const j=lv.indexOf(lq,i); if(j<0)break; t.matches.push(j); i=j+Math.max(1,q.length); if(t.matches.length>5000)break; } }
  t.mi=t.matches.length?clamp(t.mi,0,t.matches.length-1):-1;
  t.cnt.textContent=`${t.matches.length?t.mi+1:0} / ${t.matches.length}`;
  if(jump&&t.mi>=0) gotoMatch(t);
}
function clearFindMarks(){}
function stepFind(t,dir){
  if(!t.matches.length){ runFind(t,false); if(!t.matches.length) return; t.mi=0; }
  else t.mi=(t.mi+dir+t.matches.length)%t.matches.length;
  t.cnt.textContent=`${t.mi+1} / ${t.matches.length}`;
  gotoMatch(t);
}
function gotoMatch(t){
  const p=t.matches[t.mi]; if(p==null) return;
  t.ta.focus(); t.ta.setSelectionRange(p,p+t.q.value.length);
  const ln=t.ta.value.slice(0,p).split('\n').length;
  const row=t.hl.children[ln-1];
  if(row&&row.scrollIntoView) row.scrollIntoView({block:'center'});
  t.updateStatus();
}
function replaceOne(t){
  if(t.mi<0) return stepFind(t,1);
  const p=t.matches[t.mi];
  t.ta.setSelectionRange(p,p+t.q.value.length);
  ins(t.ta,t.rep.value);
  t.render(); t.ta.dispatchEvent(new Event('input'));
  runFind(t,false); stepFind(t,0);
}
function replaceAll(t){
  const q=t.q.value; if(!q) return;
  const v=t.ta.value;
  const out=v.split(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi')).join(t.rep.value);
  const n=t.matches.length;
  t.ta.select(); ins(t.ta,out); t.ta.setSelectionRange(0,0);
  t.render(); t.ta.dispatchEvent(new Event('input'));
  toast(`Replaced ${n} occurrence${n===1?'':'s'}`);
}

/* ── document tools ─────────────────────────────────────────── */
function reindent(t){
  const u=unit(), lines=t.ta.value.split('\n');
  let depth=0; const out=[];
  for(let raw of lines){
    const l=raw.trim();
    if(!l){ out.push(''); continue; }
    let d=depth;
    if(/^[}\])]/.test(l)||/^<\//.test(l)) d=Math.max(0,depth-1);
    out.push(u.repeat(d)+l);
    const opens=(l.match(/[{[(]/g)||[]).length-(l.match(/[}\])]/g)||[]).length;
    depth=Math.max(0,d+opens);
    if(t.lang==='html'){
      const o=(l.match(/<(?!\/|!)[a-zA-Z][^>]*(?<!\/)>/g)||[]).length;
      const c=(l.match(/<\/[a-zA-Z][^>]*>/g)||[]).length;
      const voidT=(l.match(/<(br|hr|img|input|meta|link|source|track|area|base|col|embed|param|wbr)\b[^>]*>/gi)||[]).length;
      depth=Math.max(0,d+(o-voidT)-c);
    }
  }
  t.ta.select(); ins(t.ta,out.join('\n')); t.ta.setSelectionRange(0,0);
  t.render(); t.ta.dispatchEvent(new Event('input'));
  toast('Re-indented');
}
function formatDoc(t){
  const v=t.ta.value;
  if(ext(TREE[t.id].name)==='json'){
    try{ const j=JSON.stringify(JSON.parse(v),null,SET.useTabs?'\t':SET.tabSize);
      t.ta.select(); ins(t.ta,j); t.ta.setSelectionRange(0,0); t.render(); t.ta.dispatchEvent(new Event('input'));
      return toast('JSON formatted');
    }catch(e){ return toast('Invalid JSON: '+e.message,'err',4000); }
  }
  reindent(t);
}
