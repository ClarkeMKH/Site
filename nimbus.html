/* ── image editor ───────────────────────────────────────────── */
async function openImage(id){
  const n=TREE[id], key=keyOf('edit',id);
  const blob=await readBlob(id);
  const url=URL.createObjectURL(blob);
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;}).catch(()=>{});
  const pane=paneShell(key,n.name,`
    <div class="grp"><label>Rotate</label>
      <button class="mbtn" data-a="rot-90">⟲ 90°</button><button class="mbtn" data-a="rot90">⟳ 90°</button>
      <button class="mbtn" data-a="flipH">Flip H</button><button class="mbtn" data-a="flipV">Flip V</button></div>
    <div class="grp"><label>Size</label>
      <button class="mbtn" data-a="resize">Resize…</button>
      <button class="mbtn" data-a="crop">Crop to selection</button>
      <span class="num" data-r="dims"></span></div>
    <div class="grp"><label>Bright</label><input type="range" data-f="brightness" min="0" max="200" value="100"><span class="num" data-r="v-brightness">100</span></div>
    <div class="grp"><label>Contrast</label><input type="range" data-f="contrast" min="0" max="200" value="100"><span class="num" data-r="v-contrast">100</span></div>
    <div class="grp"><label>Sat</label><input type="range" data-f="saturate" min="0" max="300" value="100"><span class="num" data-r="v-saturate">100</span></div>
    <div class="grp"><label>Blur</label><input type="range" data-f="blur" min="0" max="20" value="0"><span class="num" data-r="v-blur">0</span></div>
    <div class="grp"><label>Hue</label><input type="range" data-f="hue-rotate" min="0" max="360" value="0"><span class="num" data-r="v-hue-rotate">0</span></div>
    <div class="grp"><button class="mbtn" data-a="gray">Grayscale</button><button class="mbtn" data-a="invert">Invert</button><button class="mbtn" data-a="sepia">Sepia</button></div>
    <div class="grp"><label>Save as</label>
      <select data-r="fmt" style="background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:4px 6px">
        <option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option>
      </select>
      <input type="range" data-r="q" min="10" max="100" value="92" title="Quality"><span class="num" data-r="qv">92</span></div>
    <div class="grp"><button class="mbtn" data-a="reset">Reset</button>
      <button class="mbtn pri" data-a="apply">Save to file</button>
      <button class="mbtn" data-a="saveas">Save as new…</button>
      <button class="mbtn" data-a="dl">Download</button></div>`,
    `<div style="position:relative;display:inline-block"><canvas data-r="cv"></canvas><div data-r="marq" style="position:absolute;border:1px dashed #8d93ff;background:#8d93ff1f;display:none;pointer-events:none"></div></div>`);
  const R=s=>pane.querySelector(`[data-r="${s}"]`);
  const cv=R('cv'), ctx2=cv.getContext('2d');
  let base=document.createElement('canvas');
  base.width=img.naturalWidth||1; base.height=img.naturalHeight||1;
  base.getContext('2d').drawImage(img,0,0);
  URL.revokeObjectURL(url);

  const filt={brightness:100,contrast:100,saturate:100,blur:0,'hue-rotate':0,grayscale:0,invert:0,sepia:0};
  const fstr=()=>`brightness(${filt.brightness}%) contrast(${filt.contrast}%) saturate(${filt.saturate}%) blur(${filt.blur}px) hue-rotate(${filt['hue-rotate']}deg) grayscale(${filt.grayscale}%) invert(${filt.invert}%) sepia(${filt.sepia}%)`;
  function draw(){
    cv.width=base.width; cv.height=base.height;
    ctx2.filter=fstr(); ctx2.clearRect(0,0,cv.width,cv.height); ctx2.drawImage(base,0,0); ctx2.filter='none';
    R('dims').textContent=`${base.width}×${base.height}`;
  }
  function bake(){ const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;
    const x=c.getContext('2d');x.filter=fstr();x.drawImage(base,0,0);
    base=c; Object.assign(filt,{brightness:100,contrast:100,saturate:100,blur:0,'hue-rotate':0,grayscale:0,invert:0,sepia:0});
    pane.querySelectorAll('input[data-f]').forEach(i=>{const f=i.dataset.f;i.value=filt[f];const v=R('v-'+f);if(v)v.textContent=filt[f];});
    draw(); }
  function transform(w,h,fn){ const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x);base=c;draw(); }
  draw();

  /* marquee selection for crop */
  let sel=null,dragging=false,st=null;
  const marq=R('marq');
  cv.addEventListener('mousedown',e=>{const r=cv.getBoundingClientRect();dragging=true;st={x:e.clientX-r.left,y:e.clientY-r.top};marq.style.display='block';});
  addEventListener('mousemove',e=>{ if(!dragging)return; const r=cv.getBoundingClientRect();
    const x=clamp(e.clientX-r.left,0,r.width),y=clamp(e.clientY-r.top,0,r.height);
    const l=Math.min(x,st.x),tp=Math.min(y,st.y),w=Math.abs(x-st.x),h=Math.abs(y-st.y);
    Object.assign(marq.style,{left:l+'px',top:tp+'px',width:w+'px',height:h+'px'});
    const k=cv.width/r.width; sel={x:l*k,y:tp*k,w:w*k,h:h*k}; });
  addEventListener('mouseup',()=>{ if(dragging){dragging=false; if(sel&&(sel.w<3||sel.h<3)){sel=null;marq.style.display='none';}} });

  pane.addEventListener('input',e=>{
    const f=e.target.dataset.f;
    if(f){ filt[f]=+e.target.value; R('v-'+f).textContent=e.target.value; draw(); }
    if(e.target.dataset.r==='q') R('qv').textContent=e.target.value;
  });
  pane.addEventListener('click',async e=>{
    const a=e.target.closest('[data-a]'); if(!a) return;
    const act=a.dataset.a;
    if(act==='rot90'||act==='rot-90'){ bake(); const w=base.height,h=base.width;
      transform(w,h,x=>{x.translate(w/2,h/2);x.rotate((act==='rot90'?90:-90)*Math.PI/180);x.drawImage(base,-base.width/2,-base.height/2);}); }
    if(act==='flipH'){ bake(); transform(base.width,base.height,x=>{x.translate(base.width,0);x.scale(-1,1);x.drawImage(base,0,0);}); }
    if(act==='flipV'){ bake(); transform(base.width,base.height,x=>{x.translate(0,base.height);x.scale(1,-1);x.drawImage(base,0,0);}); }
    if(act==='gray'){ filt.grayscale=filt.grayscale?0:100; draw(); }
    if(act==='invert'){ filt.invert=filt.invert?0:100; draw(); }
    if(act==='sepia'){ filt.sepia=filt.sepia?0:100; draw(); }
    if(act==='crop'){
      if(!sel) return toast('Drag a box on the image first','info');
      bake(); const s2={...sel};
      transform(Math.round(s2.w),Math.round(s2.h),x=>x.drawImage(base,-s2.x,-s2.y));
      sel=null; marq.style.display='none';
    }
    if(act==='resize'){
      showModal({title:'Resize image',sub:`Currently ${base.width}×${base.height}`,
        body:`<div class="field"><label>Width (px)</label><input type="text" id="rw" value="${base.width}"></div>
              <div class="field"><label>Height (px)</label><input type="text" id="rh" value="${base.height}"></div>
              <div class="srow"><div class="txt"><b>Keep aspect ratio</b></div><div class="sw on" id="rlock"></div></div>`,
        after:()=>{ const rw=$('#rw'),rh=$('#rh'),lk=$('#rlock'); const ar=base.width/base.height;
          lk.onclick=()=>lk.classList.toggle('on');
          rw.oninput=()=>{ if(lk.classList.contains('on')) rh.value=Math.max(1,Math.round((+rw.value||1)/ar)); };
          rh.oninput=()=>{ if(lk.classList.contains('on')) rw.value=Math.max(1,Math.round((+rh.value||1)*ar)); }; },
        actions:[{text:'Cancel'},{text:'Resize',cls:'pri',fn:()=>{
          const w=clamp(parseInt($('#rw').value)||base.width,1,12000), h=clamp(parseInt($('#rh').value)||base.height,1,12000);
          bake(); const src=base; transform(w,h,x=>{x.imageSmoothingQuality='high';x.drawImage(src,0,0,w,h);});
        }}]});
    }
    if(act==='reset'){ base=document.createElement('canvas'); base.width=img.naturalWidth;base.height=img.naturalHeight;
      base.getContext('2d').drawImage(img,0,0);
      Object.assign(filt,{brightness:100,contrast:100,saturate:100,blur:0,'hue-rotate':0,grayscale:0,invert:0,sepia:0});
      pane.querySelectorAll('input[data-f]').forEach(i=>{i.value=filt[i.dataset.f];R('v-'+i.dataset.f).textContent=filt[i.dataset.f];});
      draw(); toast('Reset to original','info'); }
    if(act==='apply'||act==='saveas'||act==='dl'){
      const fmt=R('fmt').value, q=(+R('q').value)/100;
      const out=await new Promise(r=>{const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;
        const x=c.getContext('2d'); if(fmt==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);}
        x.filter=fstr(); x.drawImage(base,0,0); c.toBlob(r,fmt,q);});
      const newExt=fmt==='image/png'?'png':fmt==='image/jpeg'?'jpg':'webp';
      if(act==='dl') return saveBlob(out,n.name.replace(/\.[^.]+$/,'')+'.'+newExt);
      if(act==='saveas'){
        const nn=mkNode(n.parent,n.name.replace(/\.[^.]+$/,'')+' edited.'+newExt,'file');
        await writeBlob(nn.id,out); persistTree(); renderTree(); return toast('Saved as '+nn.name);
      }
      if(ext(n.name)!==newExt){ n.name=n.name.replace(/\.[^.]+$/,'')+'.'+newExt; n.mime=fmt; sortChildren(n.parent); }
      await writeBlob(n.id,out); persistTree(); renderTree(); renderTabs(); toast('Saved '+n.name);
    }
  });
  tabs.push({key,id,mode:'edit',pane}); setActive(key);
}

/* ── audio editor ───────────────────────────────────────────── */
async function openAudio(id){
  const n=TREE[id], key=keyOf('edit',id);
  const blob=await readBlob(id);
  const pane=paneShell(key,n.name,`
    <div class="grp"><button class="mbtn pri" data-a="play">▶ Play</button><button class="mbtn" data-a="stop">■ Stop</button>
      <span class="num" data-r="time">0.00 s</span></div>
    <div class="grp"><label>Selection</label><span class="num" data-r="selinfo" style="min-width:150px">whole file</span>
      <button class="mbtn" data-a="selall">Select all</button><button class="mbtn" data-a="trim">Trim to selection</button></div>
    <div class="grp"><label>Gain</label><input type="range" data-r="gain" min="0" max="300" value="100"><span class="num" data-r="gv">100%</span>
      <button class="mbtn" data-a="normalize">Normalise</button></div>
    <div class="grp"><label>Fade</label><button class="mbtn" data-a="fadein">In</button><button class="mbtn" data-a="fadeout">Out</button>
      <button class="mbtn" data-a="reverse">Reverse</button></div>
    <div class="grp"><label>Speed</label><input type="range" data-r="rate" min="25" max="300" value="100"><span class="num" data-r="rv">1.00×</span>
      <button class="mbtn" data-a="applyrate">Apply</button></div>
    <div class="grp"><button class="mbtn" data-a="reset">Reset</button>
      <button class="mbtn pri" data-a="savewav">Save as WAV…</button><button class="mbtn" data-a="dl">Download WAV</button></div>`,
    `<div class="wavewrap" style="width:100%"><canvas id="wave" data-r="wave"></canvas></div>`);
  const R=s=>pane.querySelector(`[data-r="${s}"]`);
  R('hint').textContent='Decoded in-browser · exports uncompressed WAV';
  const AC=window.AudioContext||window.webkitAudioContext;
  const ac=new AC();
  let buf=null, orig=null, src=null, playing=false, startT=0, offT=0;
  let selA=0, selB=0;
  try{ buf=await ac.decodeAudioData(await blob.arrayBuffer()); orig=buf; }
  catch(e){ R('stage').innerHTML=`<div class="empty">Couldn't decode this audio (${escAttr(n.name)}). The browser may not support the codec.</div>`; }

  const wave=R('wave'), wctx=wave&&wave.getContext('2d');
  function drawWave(){
    if(!buf||!wave) return;
    const dpr=devicePixelRatio||1;
    const w=wave.clientWidth||600, h=118;
    wave.width=w*dpr; wave.height=h*dpr; wctx.setTransform(dpr,0,0,dpr,0,0);
    wctx.clearRect(0,0,w,h);
    const d=buf.getChannelData(0), step=Math.max(1,Math.floor(d.length/w));
    // selection
    if(selB>selA){ wctx.fillStyle='#8d93ff26'; const x1=selA/buf.duration*w, x2=selB/buf.duration*w; wctx.fillRect(x1,0,x2-x1,h); }
    wctx.strokeStyle='#5fd0a8'; wctx.beginPath();
    for(let i=0;i<w;i++){
      let mn=1,mx=-1;
      for(let j=0;j<step;j++){ const v=d[i*step+j]||0; if(v<mn)mn=v; if(v>mx)mx=v; }
      wctx.moveTo(i+.5,h/2-mx*h/2*.92); wctx.lineTo(i+.5,h/2-mn*h/2*.92);
    }
    wctx.stroke();
    wctx.strokeStyle='#ffffff14'; wctx.beginPath(); wctx.moveTo(0,h/2); wctx.lineTo(w,h/2); wctx.stroke();
    if(playing){ const p=(ac.currentTime-startT+offT)/buf.duration*w; wctx.strokeStyle='#f0b45c'; wctx.beginPath(); wctx.moveTo(p,0); wctx.lineTo(p,h); wctx.stroke(); }
    R('selinfo').textContent=selB>selA?`${selA.toFixed(2)}s → ${selB.toFixed(2)}s (${(selB-selA).toFixed(2)}s)`:`whole file · ${buf.duration.toFixed(2)}s`;
  }
  if(wave){
    let dg=false,anchor=0;
    const posOf=e=>{const r=wave.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width,0,1)*buf.duration;};
    wave.addEventListener('mousedown',e=>{dg=true;anchor=posOf(e);selA=selB=anchor;drawWave();});
    addEventListener('mousemove',e=>{if(!dg||!buf)return;const p=posOf(e);selA=Math.min(anchor,p);selB=Math.max(anchor,p);drawWave();});
    addEventListener('mouseup',()=>{if(dg){dg=false;if(selB-selA<0.01){selA=selB=0;}drawWave();}});
    new ResizeObserver(drawWave).observe(wave);
  }
  drawWave();
  let raf=null;
  function tick(){ if(!playing)return; R('time').textContent=(ac.currentTime-startT+offT).toFixed(2)+' s'; drawWave(); raf=requestAnimationFrame(tick); }

  function stop(){ if(src){try{src.stop()}catch(e){}} src=null; playing=false; cancelAnimationFrame(raf); drawWave(); }
  function play(){
    if(!buf) return; stop();
    src=ac.createBufferSource(); src.buffer=buf;
    const g=ac.createGain(); g.gain.value=(+R('gain').value)/100;
    src.playbackRate.value=(+R('rate').value)/100;
    src.connect(g); g.connect(ac.destination);
    offT=selB>selA?selA:0;
    const dur=selB>selA?selB-selA:undefined;
    src.start(0,offT,dur); startT=ac.currentTime; playing=true;
    src.onended=()=>{playing=false;cancelAnimationFrame(raf);drawWave();};
    ac.resume(); tick();
  }
  function rebuild(fn){
    const ch=buf.numberOfChannels, len=buf.length;
    const out=ac.createBuffer(ch,len,buf.sampleRate);
    for(let c=0;c<ch;c++){ const s=buf.getChannelData(c), d=out.getChannelData(c);
      for(let i=0;i<len;i++) d[i]=fn(s[i],i,len,c); }
    buf=out; drawWave();
  }
  const sIdx=()=>[Math.floor((selB>selA?selA:0)*buf.sampleRate),Math.floor((selB>selA?selB:buf.duration)*buf.sampleRate)];

  pane.addEventListener('input',e=>{
    if(e.target.dataset.r==='gain') R('gv').textContent=e.target.value+'%';
    if(e.target.dataset.r==='rate') R('rv').textContent=((+e.target.value)/100).toFixed(2)+'×';
  });
  pane.addEventListener('click',async e=>{
    const a=e.target.closest('[data-a]'); if(!a||!buf) return;
    const act=a.dataset.a;
    if(act==='play') play();
    if(act==='stop') stop();
    if(act==='selall'){ selA=0; selB=buf.duration; drawWave(); }
    if(act==='trim'){
      if(selB<=selA) return toast('Drag across the waveform to select a range','info');
      const [i0,i1]=sIdx(), len=i1-i0;
      const out=ac.createBuffer(buf.numberOfChannels,len,buf.sampleRate);
      for(let c=0;c<buf.numberOfChannels;c++) out.getChannelData(c).set(buf.getChannelData(c).subarray(i0,i1));
      buf=out; selA=selB=0; drawWave(); toast('Trimmed');
    }
    if(act==='normalize'){
      let peak=0; for(let c=0;c<buf.numberOfChannels;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++)peak=Math.max(peak,Math.abs(d[i]));}
      if(peak<1e-6) return toast('Silent track','info');
      const k=0.98/peak; rebuild(v=>v*k); toast(`Normalised (+${(20*Math.log10(k)).toFixed(1)} dB)`);
    }
    if(act==='fadein'||act==='fadeout'){
      const [i0,i1]=sIdx(), len=i1-i0;
      rebuild((v,i)=>{ if(i<i0||i>=i1) return v; const t=(i-i0)/len; return v*(act==='fadein'?t:1-t); });
      toast('Fade applied');
    }
    if(act==='reverse'){
      const out=ac.createBuffer(buf.numberOfChannels,buf.length,buf.sampleRate);
      for(let c=0;c<buf.numberOfChannels;c++){const s=buf.getChannelData(c),d=out.getChannelData(c);
        for(let i=0;i<s.length;i++)d[i]=s[s.length-1-i];}
      buf=out; drawWave(); toast('Reversed');
    }
    if(act==='applyrate'){
      const r=(+R('rate').value)/100; if(r===1) return;
      const len=Math.floor(buf.length/r);
      const out=ac.createBuffer(buf.numberOfChannels,len,buf.sampleRate);
      for(let c=0;c<buf.numberOfChannels;c++){const s=buf.getChannelData(c),d=out.getChannelData(c);
        for(let i=0;i<len;i++){const p=i*r,i0=Math.floor(p),f=p-i0;d[i]=(s[i0]||0)*(1-f)+(s[i0+1]||0)*f;}}
      buf=out; R('rate').value=100; R('rv').textContent='1.00×'; drawWave(); toast('Speed baked in');
    }
    if(act==='reset'){ buf=orig; selA=selB=0; drawWave(); toast('Reset to original','info'); }
    if(act==='savewav'||act==='dl'){
      const g=(+R('gain').value)/100;
      const wav=bufferToWav(buf,g);
      if(act==='dl') return saveBlob(wav,n.name.replace(/\.[^.]+$/,'')+'.wav');
      const nn=mkNode(n.parent,n.name.replace(/\.[^.]+$/,'')+' edited.wav','file');
      await writeBlob(nn.id,wav); persistTree(); renderTree(); toast('Saved as '+nn.name);
    }
  });
  tabs.push({key,id,mode:'edit',pane,cleanup:()=>{stop();try{ac.close()}catch(e){}}});
  setActive(key);
}
function bufferToWav(buf,gain=1){
  const ch=buf.numberOfChannels, len=buf.length, sr=buf.sampleRate;
  const ab=new ArrayBuffer(44+len*ch*2), dv=new DataView(ab);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF'); dv.setUint32(4,36+len*ch*2,true); w(8,'WAVE'); w(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,ch,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr*ch*2,true); dv.setUint16(32,ch*2,true); dv.setUint16(34,16,true);
  w(36,'data'); dv.setUint32(40,len*ch*2,true);
  let o=44;
  const chans=[]; for(let c=0;c<ch;c++)chans.push(buf.getChannelData(c));
  for(let i=0;i<len;i++) for(let c=0;c<ch;c++){
    let v=clamp(chans[c][i]*gain,-1,1);
    dv.setInt16(o,v<0?v*0x8000:v*0x7fff,true); o+=2;
  }
  return new Blob([ab],{type:'audio/wav'});
}

function saveBlob(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);

/* CRC32 */
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function dosTime(d){return ((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()/2))&0xFFFF;}
function dosDate(d){return (((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;}

/** Build a ZIP (stored, no compression) from [{path, blob}] */
async function makeZip(entries){
  const parts=[], central=[]; let offset=0;
  const enc=new TextEncoder();
  for(const e of entries){
    const nameBytes=enc.encode(e.path);
    const data=new Uint8Array(await e.blob.arrayBuffer());
    const crc=crc32(data), d=new Date(e.date||Date.now());
    const lh=new ArrayBuffer(30), lv=new DataView(lh);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0x0800,true);
    lv.setUint16(8,0,true); lv.setUint16(10,dosTime(d),true); lv.setUint16(12,dosDate(d),true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,nameBytes.length,true); lv.setUint16(28,0,true);
    parts.push(new Uint8Array(lh),nameBytes,data);
    const ch=new ArrayBuffer(46), cv=new DataView(ch);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true);
    cv.setUint16(12,dosTime(d),true); cv.setUint16(14,dosDate(d),true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,nameBytes.length,true); cv.setUint32(42,offset,true);
    central.push(new Uint8Array(ch),nameBytes);
    offset+=30+nameBytes.length+data.length;
  }
  const cSize=central.reduce((a,b)=>a+b.length,0);
  const eo=new ArrayBuffer(22), ev=new DataView(eo);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,entries.length,true); ev.setUint16(10,entries.length,true);
  ev.setUint32(12,cSize,true); ev.setUint32(16,offset,true);
  return new Blob([...parts,...central,new Uint8Array(eo)],{type:'application/zip'});
}
async function downloadZip(id){
  const n=TREE[id];
  const files=collectFiles(id);
  if(!files.length) return toast('That folder is empty','info');
  toast(`Packing ${files.length} files…`,'info',1500);
  const entries=[];
  for(const f of files) entries.push({path:f.path,blob:await readBlob(f.node.id),date:f.node.mtime});
  saveBlob(await makeZip(entries),(id==='root'?'workspace':n.name)+'.zip');
  toast('ZIP ready');
}

        hist.push(src); hi=hist.length; inp.value='';
        conLine(con,'log',src);
        try{ const r=(0,eval)(src); conLine(con,'ret',fmtVal(r)); if(r&&r.then) r.then(v=>conLine(con,'ret','↩ '+fmtVal(v)),err=>conLine(con,'err',String(err))); }
        catch(err){ conLine(con,'err',err&&err.stack?err.stack:String(err)); }

function conLine(con,cls,text){
  const d=document.createElement('div'); d.className='cline '+cls; d.textContent=text;
  con.appendChild(d); con.scrollTop=con.scrollHeight;
  while(con.children.length>1200) con.firstChild.remove();
}
function fmtVal(v){
  if(v===undefined)return 'undefined'; if(v===null)return 'null';
  if(typeof v==='string')return v;
  if(typeof v==='function')return v.toString().split('\n')[0].slice(0,140);
  if(v instanceof Error)return v.stack||String(v);
  if(v instanceof Element)return '<'+v.tagName.toLowerCase()+'>';
  try{ return JSON.stringify(v,(k,val)=>typeof val==='bigint'?String(val):val,2); }catch(e){ return String(v); }
}
async function execFile(id,con){
  const n=TREE[id];
  const t=tabs.find(t=>t.id===id&&t.mode==='edit'); if(t&&t.flush) await t.flush();
  const code=await readText(id);
  conLine(con,'sys','▶ '+pathOf(id)+' — '+new Date().toLocaleTimeString());
  const orig={log:console.log,warn:console.warn,error:console.error,info:console.info,debug:console.debug};
  const wrap=(k,cls)=>(...a)=>{ conLine(con,cls,a.map(fmtVal).join(' ')); orig[k].apply(console,a); };
  console.log=wrap('log','log'); console.info=wrap('info','info');
  console.warn=wrap('warn','warn'); console.error=wrap('error','err'); console.debug=wrap('debug','log');
  const onErr=ev=>conLine(con,'err',(ev.error&&ev.error.stack)||ev.message||'Unknown error');
  const onRej=ev=>conLine(con,'err','Unhandled rejection: '+fmtVal(ev.reason));
  addEventListener('error',onErr); addEventListener('unhandledrejection',onRej);
  const restore=()=>{ Object.assign(console,orig); removeEventListener('error',onErr); removeEventListener('unhandledrejection',onRej); };
  try{
    const fn=new Function('__file__','__dir__',code);
    const out=fn.call(window,pathOf(id),pathOf(TREE[id].parent));
    if(out&&typeof out.then==='function'){
      out.then(v=>{ if(v!==undefined)conLine(con,'ret',fmtVal(v)); conLine(con,'sys','■ finished'); restore(); },
               e=>{ conLine(con,'err',(e&&e.stack)||String(e)); conLine(con,'sys','■ failed'); restore(); });
      return;
    }
    if(out!==undefined) conLine(con,'ret',fmtVal(out));
    conLine(con,'sys','■ finished');
  }catch(e){ conLine(con,'err',(e&&e.stack)||String(e)); conLine(con,'sys','■ failed'); }
  setTimeout(restore,60);
}

/* ═══ host bridge exposed to running apps ═══════════════════ */
const HOSTGLOBALS={};
const HOSTAPI={};
const NIMBUS={
  /** Nimbus.setGlobal('THEME',{...}) — appears inside apps as a plain global */
  setGlobal(name,value){ HOSTGLOBALS[name]=value; return value; },
  /** Nimbus.expose('doThing', fn) — apps call it as `await Host.doThing(...)` */
  expose(name,fn){ HOSTAPI[name]=fn; return fn; },
  globals:HOSTGLOBALS, api:HOSTAPI,
  get tree(){ return TREE; }, saveToCache, loadFromCache,
};
window.Nimbus=NIMBUS;

/* default host API — `root` is bound per running app */
function bindHostAPI(rootId){
  const rel=p=>resolvePath(rootId,p);
  return {
    async readFile(p){ const n=rel(p); if(!n||n.type!=='file') return null; return readText(n.id); },
    async readFileBytes(p){ const n=rel(p); if(!n||n.type!=='file') return null; return new Uint8Array(await (await readBlob(n.id)).arrayBuffer()); },
    async readFileURL(p){ const n=rel(p); if(!n||n.type!=='file') return null; return URL.createObjectURL(await readBlob(n.id)); },
    async writeFile(p,content,mime){
      const parts=String(p).replace(/^\//,'').split('/'), name=parts.pop();
      let parent=rootId;
      for(const d of parts){ let hit=children(parent).find(c=>c.type==='folder'&&c.name===d); if(!hit) hit=mkNode(parent,d,'folder'); parent=hit.id; }
      let n=children(parent).find(c=>c.name===name&&c.type==='file');
      if(!n) n=mkNode(parent,name,'file');
      const blob=content instanceof Blob?content:new Blob([content],{type:mime||mimeOf(name)});
      await writeBlob(n.id,blob); persistTree(); renderTree(); return pathOf(n.id);
    },
    async deleteFile(p){ const n=rel(p); if(!n) return false; await delNode(n.id); renderTree(); return true; },
    async listDir(p){ const n=p?rel(p):TREE[rootId]; if(!n||n.type!=='folder') return [];
      return children(n.id).map(c=>({name:c.name,type:c.type,size:c.size||0,isApp:!!c.isApp})); },
    async exists(p){ return !!rel(p); },
    async saveToCache(k,v,e){ return saveToCache('app:'+rootId+':'+k,v,e); },
    async loadFromCache(k,e){ return loadFromCache('app:'+rootId+':'+k,e); },
    async notify(msg,type){ toast(String(msg),type==='err'?'err':type==='info'?'info':'ok'); return true; },
    async close(){ closeRunner(); return true; },
    async setTitle(t){ $('#runName').textContent=String(t); return true; },
    async apps(){ return listApps().map(a=>({name:a.name,icon:a.icon||'grid'})); },
  };
}
let CURRENT_HOST=null;
addEventListener('message',async e=>{
  const d=e.data;
  if(!d||d.__nimbusRPC!=='call') return;
  const reply=(ok,value)=>{ try{ e.source.postMessage({__nimbusRPC:'reply',id:d.id,ok,value},'*'); }catch(_){} };
  const api=Object.assign({},CURRENT_HOST||{},HOSTAPI);
  const fn=api[d.fn];
  if(typeof fn!=='function') return reply(false,'No host function named "'+d.fn+'"');
  try{ reply(true,await fn(...(d.args||[]))); }
  catch(err){ reply(false,String(err&&err.message||err)); }
});
function bridgeScript(rootId){
  const names=Object.keys(HOSTAPI).concat(Object.keys(bindHostAPI(rootId)));
  return `<script>(function(){
var G=${JSON.stringify(HOSTGLOBALS)};for(var k in G){try{window[k]=G[k];}catch(e){}}
window.HOST_GLOBALS=G;
var seq=0,waiting={};
addEventListener('message',function(e){var d=e.data;if(d&&d.__nimbusRPC==='reply'&&waiting[d.id]){var w=waiting[d.id];delete waiting[d.id];d.ok?w[0](d.value):w[1](new Error(d.value));}});
function call(fn,args){return new Promise(function(res,rej){var id=++seq;waiting[id]=[res,rej];parent.postMessage({__nimbusRPC:'call',id:id,fn:fn,args:args},'*');});}
var H={call:function(n){return call(n,[].slice.call(arguments,1));}};
${JSON.stringify([...new Set(names)])}.forEach(function(n){H[n]=function(){return call(n,[].slice.call(arguments));};});
window.Host=H;
})();<\/script>`;
}

/* ═══ asset resolution ══════════════════════════════════════ */
const SKIP=/^(https?:|data:|blob:|about:|mailto:|tel:|javascript:|#|\/\/)/i;
async function replaceAsync(str,re,fn){
  const jobs=[]; str.replace(re,(...a)=>{ jobs.push(fn(...a)); return ''; });
  const vals=await Promise.all(jobs); let i=0;
  return str.replace(re,()=>vals[i++]);
}
function makeResolver(rootId){
  const urls=new Map(), created=[];
  async function asset(p,fromFolder,depth=0){
    if(!p||SKIP.test(p.trim())) return null;
    const clean=p.trim().split('#')[0].split('?')[0];
    if(!clean) return null;
    const startsRoot=clean.startsWith('/');
    const n=resolvePath(startsRoot?rootId:fromFolder,clean)||resolvePath(rootId,clean);
    if(!n||n.type!=='file') return null;
    const cacheKey=n.id+':'+depth;
    if(urls.has(n.id)) return urls.get(n.id);
    let blob=await readBlob(n.id);
    const e=ext(n.name);
    if(depth<6&&(e==='css'||e==='scss')){
      let css=await blob.text(); css=await rewriteCSS(css,n.parent,depth+1);
      blob=new Blob([css],{type:'text/css'});
    } else if(depth<6&&['js','mjs'].includes(e)){
      let js=await blob.text(); js=await rewriteJS(js,n.parent,depth+1);
      blob=new Blob([js],{type:'text/javascript'});
    }
    const u=URL.createObjectURL(blob);
    urls.set(n.id,u); created.push(u);
    return u;
  }
  async function rewriteCSS(css,folder,depth){
    css=await replaceAsync(css,/url\(\s*(['"]?)([^'")]+)\1\s*\)/gi,async(m,q,p)=>{
      const u=await asset(p,folder,depth); return u?`url("${u}")`:m; });
    css=await replaceAsync(css,/@import\s+(['"])([^'"]+)\1/gi,async(m,q,p)=>{
      const u=await asset(p,folder,depth); return u?`@import "${u}"`:m; });
    return css;
  }
  async function rewriteJS(js,folder,depth){
    return replaceAsync(js,/((?:^|[\s;}])(?:import|export)[\s\S]{0,200}?from\s*|(?:^|[\s;{(=,])import\s*\(\s*)(['"])([^'"]+)\2/g,
      async(m,head,q,p)=>{ const u=await asset(p,folder,depth); return u?head+q+u+q:m; });
  }
  async function rewriteHTML(html,folder){
    // inline <style> blocks
    html=await replaceAsync(html,/(<style\b[^>]*>)([\s\S]*?)(<\/style>)/gi,async(m,a,body,b)=>a+await rewriteCSS(body,folder,1)+b);
    // classic <script> bodies get import rewriting too
    html=await replaceAsync(html,/(<script\b(?![^>]*\bsrc=)[^>]*>)([\s\S]*?)(<\/script>)/gi,async(m,a,body,b)=>a+await rewriteJS(body,folder,1)+b);
    // srcset
    html=await replaceAsync(html,/(\ssrcset\s*=\s*)(["'])([^"']*)\2/gi,async(m,head,q,val)=>{
      const parts=await Promise.all(val.split(',').map(async seg=>{
        const bits=seg.trim().split(/\s+/); const u=await asset(bits[0],folder,1);
        if(u) bits[0]=u; return bits.join(' ');
      }));
      return head+q+parts.join(', ')+q;
    });
    // src / href / poster / data
    html=await replaceAsync(html,/(\s(?:src|href|poster|data|xlink:href)\s*=\s*)(["'])([^"']*)\2/gi,async(m,head,q,val)=>{
      const u=await asset(val,folder,1); return u?head+q+u+q:m; });
    // style="... url(...)"
    html=await replaceAsync(html,/(\sstyle\s*=\s*)(["'])([^"']*url\([^"']*)\2/gi,async(m,head,q,val)=>
      head+q+(await rewriteCSS(val,folder,1))+q);
    return html;
  }
  return {asset,rewriteHTML,rewriteCSS,rewriteJS,revoke(){created.forEach(u=>URL.revokeObjectURL(u));}};
}

/* ═══ service-worker virtual filesystem (preferred) ═════════ */
const SW_SRC=`
const M=new Map();
self.addEventListener('install',()=>self.skipWaiting());
self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
self.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.t==='mount'){M.set(d.token,d.files);}
  if(d.t==='unmount'){M.delete(d.token);}
  if(e.ports&&e.ports[0])e.ports[0].postMessage({ok:true});
});
self.addEventListener('fetch',e=>{
  const u=new URL(e.request.url);
  const m=u.pathname.match(/__nimbus__\\/([^/]+)\\/(.*)$/);
  if(!m)return;
  const files=M.get(m[1]);if(!files)return;
  let p=decodeURIComponent(m[2]||'')||'index.html';
  let b=files[p]||files[p.replace(/^\\//,'')]||files[p+'/index.html']||files['index.html'];
  if(!b){e.respondWith(new Response('Not found: '+p,{status:404,headers:{'Content-Type':'text/plain'}}));return;}
  e.respondWith(new Response(b,{headers:{'Content-Type':b.type||'application/octet-stream'}}));
});`;
let VFSMODE='rewrite', SWREG=null;
async function initVFS(){
  const badge=$('#fsBadge');
  const paint=()=>badge.innerHTML=`Virtual FS <b>${VFSMODE==='sw'?'service worker':'inline rewrite'}</b>`;
  paint();
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol)) return paint();
  try{
    const url=URL.createObjectURL(new Blob([SW_SRC],{type:'text/javascript'}));
    SWREG=await navigator.serviceWorker.register(url,{scope:'./'});
    await navigator.serviceWorker.ready;
    VFSMODE='sw';
  }catch(e){ VFSMODE='rewrite'; }
  paint();
}
async function swMount(token,rootId){
  const files={};
  for(const f of collectFiles(rootId)) files[f.path]=await readBlob(f.node.id);
  const sw=navigator.serviceWorker.controller||(SWREG&&SWREG.active);
  if(!sw) throw new Error('no controller');
  await new Promise((res,rej)=>{
    const ch=new MessageChannel();
    ch.port1.onmessage=()=>res();
    setTimeout(()=>rej(new Error('mount timeout')),3000);
    sw.postMessage({t:'mount',token,files},[ch.port2]);
  });
}
function swUnmount(token){
  const sw=navigator.serviceWorker&&(navigator.serviceWorker.controller||(SWREG&&SWREG.active));
  if(sw) sw.postMessage({t:'unmount',token});
}

/* ═══ the runner overlay ════════════════════════════════════ */
let runState=null;
async function runApp(id){
  const n=TREE[id];
  const entry=children(id).find(c=>c.type==='file'&&/^index\.html?$/i.test(c.name));
  if(!entry) return toast(`No index.html in ${n.name}`,'err',4000);
  for(const t of tabs) if(t.flush) await t.flush();
  await launch(id,entry.id,n.name);
}
async function launch(rootId,entryId,title){
  closeRunner();
  const frame=$('#runFrame');
  $('#runName').textContent=title;
  $('#runner').classList.add('on'); $('#runPill').style.display='flex';
  CURRENT_HOST=bindHostAPI(rootId);
  runState={rootId,entryId,title,token:null,resolver:null};

  if(VFSMODE==='sw'){
    try{
      const token=uid();
      // inject the bridge into a copy of index.html before mounting
      const files={};
      for(const f of collectFiles(rootId)) files[f.path]=await readBlob(f.node.id);
      const entryPath=collectFiles(rootId).find(f=>f.node.id===entryId).path;
      let html=await files[entryPath].text();
      html=injectBridge(html,rootId);
      files[entryPath]=new Blob([html],{type:'text/html'});
      const sw=navigator.serviceWorker.controller||(SWREG&&SWREG.active);
      if(!sw) throw new Error('no controller');
      await new Promise((res,rej)=>{ const ch=new MessageChannel();
        ch.port1.onmessage=()=>res(); setTimeout(()=>rej(new Error('timeout')),3000);
        sw.postMessage({t:'mount',token,files},[ch.port2]); });
      runState.token=token;
      frame.removeAttribute('srcdoc');
      frame.src=new URL('./__nimbus__/'+token+'/'+entryPath,location.href).href;
      return;
    }catch(e){ /* fall through to rewrite */ }
  }
  const r=makeResolver(rootId);
  runState.resolver=r;
  let html=await readText(entryId);
  html=await r.rewriteHTML(html,TREE[entryId].parent);
  html=injectBridge(html,rootId);
  frame.removeAttribute('src');
  frame.srcdoc=html;
}
function injectBridge(html,rootId){
  const b=bridgeScript(rootId);
  if(/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i,m=>m+b);
  if(/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i,m=>m+b);
  return b+html;
}
function closeRunner(){
  const frame=$('#runFrame');
  frame.removeAttribute('src'); frame.removeAttribute('srcdoc');
  $('#runner').classList.remove('on'); $('#runPill').style.display='none';
  if(runState){ if(runState.token) swUnmount(runState.token); if(runState.resolver) setTimeout(()=>runState.resolver.revoke(),500); }
  runState=null; CURRENT_HOST=null;
}
$('#runClose').onclick=closeRunner;
$('#runReload').onclick=()=>{ if(runState) launch(runState.rootId,runState.entryId,runState.title); };
(()=>{ let t=null; const pill=$('#runPill');
  const dim=()=>pill.classList.add('dim');
  const wake=()=>{ pill.classList.remove('dim'); clearTimeout(t); t=setTimeout(dim,2800); };
  ['mousemove','keydown','touchstart'].forEach(ev=>addEventListener(ev,wake));
  pill.addEventListener('mouseenter',()=>{clearTimeout(t);pill.classList.remove('dim');});
})();

/* ═══ HTML preview tab ══════════════════════════════════════ */
async function previewHtml(id){
  const n=TREE[id], key=keyOf('preview',id);
  const t0=tabs.find(t=>t.id===id&&t.mode==='edit'); if(t0&&t0.flush) await t0.flush();
  let pane=panesEl.querySelector(`.pane[data-key="${CSS.escape(key)}"]`);
  if(!pane){
    pane=makePane(key);
    pane.innerHTML=`<div class="paneHead"><span>Preview — ${escAttr(n.name)}</span><div class="spacer"></div>
      <button data-a="refresh">Refresh</button><button data-a="full">Open fullscreen</button></div>
      <iframe class="frame" data-r="f" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"></iframe>`;
    pane.addEventListener('click',e=>{
      const a=e.target.closest('[data-a]'); if(!a) return;
      if(a.dataset.a==='refresh') fill();
      if(a.dataset.a==='full') launch(TREE[id].parent,id,n.name);
    });
    tabs.push({key,id,mode:'preview',pane,cleanup:()=>pane._r&&pane._r.revoke()});
  }
  async function fill(){
    if(pane._r) pane._r.revoke();
    const r=makeResolver(TREE[id].parent); pane._r=r;
    let html=await readText(id);
    html=await r.rewriteHTML(html,TREE[id].parent);
    pane.querySelector('[data-r="f"]').srcdoc=injectBridge(html,TREE[id].parent);
  }
  await fill();
  setActive(key);
}

/* ── global shortcuts ──────────────────────────────────────── */
addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  const inField=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key==='Escape'){
    if(scrim.classList.contains('on')) return hideModal();
    if(ctx.classList.contains('on')) return closeMenu();
    if($('#runner').classList.contains('on')) return closeRunner();
  }
  if(mod&&e.key===','){ e.preventDefault(); return openSettings(); }
  if(mod&&e.key.toLowerCase()==='b'){ e.preventDefault(); const sb=$('#sidebar'); sb.style.display=sb.style.display==='none'?'':'none'; return; }
  if(mod&&e.key.toLowerCase()==='w'&&active){ e.preventDefault(); return closeTabKey(active); }
  if(mod&&e.key==='`'){ e.preventDefault(); const order=['edit','grid','bar']; return setMode(order[(order.indexOf(SET.mode)+1)%3]); }
  if(inField) return;
  if(e.key==='F2'&&selected) { e.preventDefault(); return startRename(selected); }
  if(e.key==='Delete'&&selected) { e.preventDefault(); return confirmDelete(selected); }
  if(mod&&e.key.toLowerCase()==='c'&&selected){ clipboard={id:selected,cut:false}; renderTree(); return; }
  if(mod&&e.key.toLowerCase()==='x'&&selected){ clipboard={id:selected,cut:true}; renderTree(); return; }
  if(mod&&e.key.toLowerCase()==='v'){ doPaste(targetFolder()); return; }
});

}
tick();
setInterval(tick, 1000);
