        // Salt and IV are random per save. Wrong password fails the GCM auth tag and throws.
        async function saveCache(password) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const key = await crypto.subtle.deriveKey(
                { "name" : "PBKDF2", "salt" : salt, "iterations" : 600000, "hash" : "SHA-256" },
                await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]),
                { "name" : "AES-GCM", "length" : 256 }, false, ["encrypt"]
            );
            const data = await crypto.subtle.encrypt({ "name" : "AES-GCM", "iv" : iv }, key, new TextEncoder().encode(JSON.stringify(cache)));

            const db = await new Promise((done, fail) => {
                const req = indexedDB.open("toolkit", 1);
                req.onupgradeneeded = () => req.result.createObjectStore("cache");
                req.onsuccess = () => done(req.result);
                req.onerror = () => fail(req.error);
            });
            await new Promise((done, fail) => {
                const req = db.transaction("cache", "readwrite").objectStore("cache").put({ "salt" : salt, "iv" : iv, "data" : data }, "cache");
                req.onsuccess = () => done();
                req.onerror = () => fail(req.error);
            });
            db.close();
        }

        async function loadCache(password) {
            const db = await new Promise((done, fail) => {
                const req = indexedDB.open("toolkit", 1);
                req.onupgradeneeded = () => req.result.createObjectStore("cache");
                req.onsuccess = () => done(req.result);
                req.onerror = () => fail(req.error);
            });
            const saved = await new Promise((done, fail) => {
                const req = db.transaction("cache", "readonly").objectStore("cache").get("cache");
                req.onsuccess = () => done(req.result);
                req.onerror = () => fail(req.error);
            });
            db.close();
            if (!saved) return false;

            const key = await crypto.subtle.deriveKey(
                { "name" : "PBKDF2", "salt" : saved["salt"], "iterations" : 600000, "hash" : "SHA-256" },
                await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]),
                { "name" : "AES-GCM", "length" : 256 }, false, ["decrypt"]
            );
            cache = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ "name" : "AES-GCM", "iv" : saved["iv"] }, key, saved["data"]).catch(() => { throw new Error("Wrong master password"); })));
            return true;
        }

        function customContext(el, obj) {
            let menu = document.getElementById("context");
            if (!menu) {
                menu = document.body.appendChild(document.createElement("div"));
                menu.id = "context";
                menu.setAttribute("style", `position:fixed; top:0px; left:0px; z-index:50; display:none; min-width:180px; box-sizing:border-box; padding:6px; font-size:13px; color:${theme['text']}; background-color:rgba(255,255,255,1); border:1px solid rgba(35,40,48,0.06); border-radius:12px; box-shadow:0 8px 28px rgba(35,40,48,0.18); user-select:none; -webkit-user-select:none;`);
                menu.oncontextmenu = (e) => e.preventDefault();
                document.addEventListener("click", () => menu.style.display = "none");
                document.addEventListener("contextmenu", () => menu.style.display = "none");
                document.addEventListener("scroll", () => menu.style.display = "none", true);
                document.addEventListener("keydown", (e) => { if (e.key === "Escape") menu.style.display = "none"; });
            }

            el.oncontextmenu = (e) => {
                e.preventDefault();
                e.stopPropagation();

                menu.innerHTML = Object.keys(obj).map((label) => `
                    <div onmouseenter="this.style.backgroundColor='${theme['bg']}'" onmouseleave="this.style.backgroundColor='rgba(0,0,0,0)'" style="min-height:34px; height:34px; max-height:34px; width:100%; box-sizing:border-box; padding:0 12px; display:flex; align-items:center; border-radius:8px; background-color:rgba(0,0,0,0); cursor:pointer; transition:background-color 0.1s ease;">${label}</div>
                `).join("");

                Object.values(obj).forEach((js, i) => menu.children[i].onclick = () => { menu.style.display = "none"; new Function("el", "context", js).call(el, el, obj); });

                menu.style.display = "block";
                menu.style.left = `${Math.min(e.clientX, window.innerWidth - menu.offsetWidth - 8)}px`;
                menu.style.top = `${Math.min(e.clientY, window.innerHeight - menu.offsetHeight - 8)}px`;
            };
        }

                        ${Object.entries(obj).map(([category, items]) => `
                            <div data-toggle="${category}" style="margin:18px 0 2px 2px; display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:rgba(35,40,48,0.45); cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:rgba(0,0,0,0);">

                                    <path d="m6 9.5 6 6 6-6"></path>

                            <div style="width:100%; display:${cache['collapsed'][category] ? "none" : "flex"}; flex-direction:column; gap:8px;">
                                ${Object.entries(items).map(([name, tool]) => `
                                    <div data-category="${category}" data-tool="${name}" style="min-height:50px; height:50px; max-height:50px; width:100%; box-sizing:border-box; padding:0 14px; display:flex; align-items:center; gap:12px; font-size:15px; letter-spacing:0.1px; color:${theme['text']}; background-color:rgba(255,255,255,1); border-radius:12px; border:1px solid rgba(35,40,48,0.06); box-shadow:0 1px 2px rgba(35,40,48,0.06), 0 4px 12px rgba(35,40,48,0.04); cursor:pointer; transition:transform 0.12s ease, box-shadow 0.12s ease;">
                                        <img src="${tool['icon']}" alt="" style="min-width:32px; width:32px; max-width:32px; height:32px; box-sizing:border-box; padding:6px; border-radius:9px; background-color:${theme['bg']}; opacity:0.85;">
                                        <div style="flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;">${name}</div>
                                    </div>
                                `).join("")}
                            </div>
                        `).join("")}
                    </div>
                </div>
            `;

            document.querySelectorAll("[data-toggle]").forEach((el) => el.onclick = () => {
                const open = cache["collapsed"][el.dataset.toggle] !== true;
                cache["collapsed"][el.dataset.toggle] = open;
                el.children[1].style.transform = open ? "rotate(-90deg)" : "rotate(0deg)";
                el.nextElementSibling.style.display = open ? "none" : "flex";
            });

            document.querySelectorAll("[data-tool]").forEach((el) => customContext(el, context));
        }

        showList(tools, {
            "Rename Tool" : `const next = (prompt("Rename tool", el.dataset.tool) || "").trim(); if (next && next !== el.dataset.tool) { tools[el.dataset.category] = Object.fromEntries(Object.entries(tools[el.dataset.category]).map(([key, tool]) => [key === el.dataset.tool ? next : key, tool])); showList(tools, context); }`,
            "Edit Tool" : `console.log("Edit", el.dataset.category, el.dataset.tool, tools[el.dataset.category][el.dataset.tool]);`,
            "Delete Tool" : `if (confirm("Delete " + el.dataset.tool + "?")) { delete tools[el.dataset.category][el.dataset.tool]; showList(tools, context); }`
        });
